ialized views or summary tables, or move them to a read replica.","Re-measure after every change; never assume."],"code":"EXPLAIN ANALYZE\nSELECT id, total FROM orders\nWHERE user_id = 7 AND created_at >= '2026-01-01'\nORDER BY created_at DESC LIMIT 20;\n\n-- Before: Seq Scan on orders (rows=30,000,000) 2400 ms\n-- Fix: CREATE INDEX ON orders (user_id, created_at DESC);\n-- After:  Index Scan using orders_user_created  3 ms","e":"A dashboard query used WHERE DATE(created_at) = today, which ignored the index on created_at and scanned 50M rows. Rewriting it as created_at >= today AND created_at < tomorrow made it use the index: 9 s down to 15 ms.","p":["Guessing instead of running EXPLAIN ANALYZE","Optimising a query that runs once a day while ignoring one that runs 10,000 times a minute","SELECT * pulling megabytes of unused columns","Deep OFFSET pagination (OFFSET 100000 still reads 100,000 rows)","Testing on a tiny dev database where everything is fast"],"v":["Database Indexing","Indexing is ONE tool. Query optimization is the whole process: find slow queries, read the plan, then fix with indexes, rewrites, less data, caching or precomputation."],"f":["Find slow query (logs)","EXPLAIN ANALYZE","!Seq Scan 30M rows","Index + rewrite → 3 ms"],"q":[["What is the first step to optimize a slow query?","Measure: find it via slow logs/pg_stat_statements, then run EXPLAIN ANALYZE to see the actual plan and where time is spent."],["What does “sargable” mean? Give an example.","A condition the DB can answer with an index. created_at >= '2026-01-01' is sargable; YEAR(created_at) = 2026 is not because of the function on the column."],["Why is large OFFSET slow and what’s the alternative?","OFFSET N still reads and discards N rows. Keyset pagination (WHERE id < last_seen_id ORDER BY id DESC LIMIT 20) jumps straight via the index."],["EXPLAIN vs EXPLAIN ANALYZE?","EXPLAIN shows the estimated plan without running; EXPLAIN ANALYZE actually runs the query and shows real row counts and timings."],["How do you prioritize which queries to optimize?","By total time consumed (frequency × duration), because a 20 ms query called a million times matters more than a 5 s query called once."]]},{"n":22,"c":"db","t":"Read Replicas","s":"Extra copies of your database that handle read queries, so the main database can focus on writes.","w":"The primary database accepts all writes. It streams every change to one or more replicas. Your app sends SELECT queries to the replicas and INSERT/UPDATE/DELETE to the primary. Most apps read far more than they write (often 10:1 or more), so this spreads the heaviest load.","y":"A single database server eventually runs out of CPU just answering reads. Adding replicas multiplies read capacity without touching how writes work. Replicas can also take over if the primary dies.","h":["Route reads to replicas and writes to the primary (many ORMs and proxies like ProxySQL support this).","Understand replication lag: replicas are usually milliseconds behind, sometimes seconds under heavy load.","Read-your-own-writes: right after a user saves something, read from the primary (or wait until the replica catches up), or they’ll think their save was lost.","Send heavy reports and analytics to a dedicated replica so they can’t slow down user traffic.","Monitor replica lag and stop sending traffic to replicas that fall too far behind."],"e":"A news site sends article reads to 4 replicas and only editor saves to the primary. After an editor publishes, the admin page reads from the primary so the editor sees the change instantly.","p":["User updates profile, page reloads from a lagging replica and shows old data","Thinking replicas are backups (a DROP TABLE replicates instantly)","Replicas don’t help write-heavy workloads"],"v":["Backups","A replica copies every change immediately, including mistakes. A backup is a frozen point in time you can restore to after a mistake."],"f":["Write → primary","Primary streams changes","Replicas (slightly behind)","Reads served by replicas"],"q":[["What is replication lag and why does it matter?","The delay before a write on the primary appears on a replica. Reading from a lagging replica can show stale data, e.g. a user not seeing their own update."],["How do you guarantee read-your-own-writes?","Read from the primary for that user for a short time after a write, or track the write position and wait for the replica to catch up."],["Do read replicas help with write load?","No; every replica must apply every write too. For write scaling you need sharding or a bigger primary."]]},{"n":23,"c":"db","t":"Database Migrations","s":"Version-controlled scripts that change your database structure step by step, the same way everywhere.","w":"A migration is a small file like “003_add_phone_to_users” with the SQL change (and often a reverse change). A migration tool (Flyway, Liquibase, Alembic, Prisma Migrate, Rails/Django migrations) records which ones have run and applies new ones in order. Your schema evolves like code: reviewed, versioned and repeatable.","y":"Changing production by hand leads to “works on my machine” databases, forgotten steps and outages. Some changes also lock big tables for minutes and take the site down if done naively.","h":["Every schema change goes in a migration file committed with the code that needs it.","Run migrations automatically in CI/CD, the same way in dev, staging and production.","Use expand → migrate → contract for zero downtime: 1) add new column (nullable), 2) deploy code that writes both, 3) backfill old rows in batches, 4) switch reads, 5) later drop the old column.","Never rename or drop a column in the same deploy that stops using it; old app servers are still running during a rolling deploy.","Watch out for locking operations on big tables; use online tools (CREATE INDEX CONCURRENTLY, gh-ost, pt-online-schema-change).","Backfill large data in small batches, not one giant UPDATE.","Back up before risky migrations and test them on a copy of production-size data."],"code":"-- step 1 (expand): safe, no lock on reads\nALTER TABLE users ADD COLUMN phone TEXT NULL;\nCREATE INDEX CONCURRENTLY idx_users_phone ON users(phone);\n-- step 3: backfill in batches of 10k\n-- step 5 (contract, weeks later): ALTER TABLE users DROP COLUMN old_phone;","e":"A team added a NOT NULL column with a default to a 200M-row table on an old MySQL version; it rewrote the table and locked it for 40 minutes. The expand/contract approach would have had zero downtime.","p":["Renaming a column while old code still reads the old name","Big table-locking ALTERs during peak traffic","Editing a migration that already ran in production instead of writing a new one"],"v":["Schema Versioning","A migration is one CHANGE. Schema versioning is the RECORD of which changes have been applied. Migration tools do both."],"f":["Add new column","Deploy code writing both","Backfill in batches","Drop old column later"],"q":[["Explain expand and contract migrations.","First add new structures without breaking old code, migrate data and code to use them, then remove old structures in a later release, keeping every intermediate state compatible."],["Why can’t you drop a column in the same deploy?","During rolling deploys old instances still run and may query that column; they’d crash."],["How do you add an index to a huge Postgres table without downtime?","CREATE INDEX CONCURRENTLY, which builds without blocking writes (it’s slower and can’t run inside a transaction)."]]},{"n":24,"c":"db","t":"Schema Versioning","s":"Tracking exactly which version of the database structure each environment is on.","w":"Migration tools keep a special table (e.g. schema_migrations or flyway_schema_history) listing every migration that has run, with a version number and checksum. Looking at it tells you exactly what shape the database is in, and the tool knows which new migrations to apply.","y":"Without it, staging might have a column production lacks, a developer’s database drifts, and deploys fail with “column does not exist”. Nobody can say for sure what state production is in.","h":["Let the migration tool own the version table; never edit it by hand.","Use ordered versions (timestamps avoid number clashes between developers).","Never change a migration that has already run anywhere shared; checksums will catch it. Write a new one instead.","Run “pending migrations” checks in CI and fail the build if the schema and code disagree.","Detect drift: compare the live schema with what migrations would produce.","For APIs/events carrying data, also version your data formats (e.g. with a schema registry for Avro/Protobuf)."],"code":"SELECT version, description, installed_on\nFROM flyway_schema_history ORDER BY installed_rank;\n-- 20260102_1200 | add_users_phone | 2026-01-02","e":"Two developers both created migration “015”. Switching to timestamp versions (20260310_0915_add_tags) ended the clashes.","p":["Hot-fixing production schema by hand, causing drift","Editing old migrations","Different environments applying migrations in different orders"],"v":["API Versioning","Schema versioning tracks your DATABASE structure. API versioning manages the contract your CLIENTS depend on. A DB change shouldn’t automatically force a new API version."],"f":["New migration file","Tool checks version table","Applies missing ones in order","Records version + checksum"],"q":[["Where does a migration tool store which migrations ran?","In a dedicated table in the database itself, with version, description, checksum and timestamp."],["Why use timestamps for migration versions?","Developers working in parallel won’t pick the same number, avoiding conflicts."],["What is schema drift?","When the actual database schema differs from what the migrations describe, usually due to manual changes."]]},{"n":25,"c":"db","t":"Optimistic Locking","s":"Let everyone edit freely, but on save, check that nobody else changed the record since you read it.","w":"Each row has a version number. You read the row (version 5), make changes, and save with UPDATE ... WHERE id = ? AND version = 5, setting version = 6. If someone else saved first, the version is now 6, your update matches zero rows, and you know there was a conflict. No locks are held while the user is thinking.","y":"Without it, two people edit the same wiki page; whoever saves last silently wipes out the other’s work (a “lost update”). Holding real database locks while humans edit for minutes would be terrible.","h":["Add a version integer (or updated_at) column.","Read the version along with the data and send it to the client.","Update with WHERE version = :old and SET version = version + 1.","If rows affected = 0, it’s a conflict: show “someone else changed this”, reload, merge or retry.","In HTTP APIs use ETag and If-Match headers; return 412 Precondition Failed on mismatch.","Most ORMs support it built in (JPA @Version, Rails lock_version, Django packages)."],"code":"UPDATE documents\nSET body = :body, version = version + 1\nWHERE id = :id AND version = :version_i_read;\n-- 0 rows updated => conflict, tell the user","e":"Google Docs-style editors aside, Jira and Confluence use version checks so that if two people edit the same ticket, the second gets a “this issue was updated” warning instead of overwriting.","p":["Forgetting to check rows affected","Using it on very hot rows where conflicts constantly happen, causing endless retries","Not including the version in the API, so clients can’t send it back"],"v":["Pessimistic Locking","Optimistic: no lock, detect conflict at save time; best when conflicts are rare. Pessimistic: lock first, others wait; best when conflicts are frequent and short."],"f":["A and B read v5","A saves → v6","!B saves with v5 → 0 rows","B reloads and retries"],"q":[["How does optimistic locking detect a conflict?","The update includes the version that was read in its WHERE clause; if another writer bumped the version, zero rows are updated."],["When is optimistic better than pessimistic locking?","When conflicts are rare and edits are long (like humans editing forms), because no locks are held."],["How do HTTP APIs implement optimistic concurrency?","With ETags: client sends If-Match with the ETag it read; server returns 412 if the resource changed."]]},{"n":26,"c":"db","t":"Pessimistic Locking","s":"Lock the row before changing it, so anyone else who wants it must wait until you’re done.","w":"Inside a transaction you run SELECT ... FOR UPDATE. The database locks those rows. Another transaction trying to lock or update them waits until you commit or roll back. You assume conflict will happen, so you prevent it up front.","y":"For things like seat booking, inventory or account balances under heavy concurrent access, detecting conflicts after the fact means lots of failed retries. Locking guarantees only one change at a time.","h":["Begin a transaction, SELECT ... FOR UPDATE the rows you’ll change, update, commit.","Keep the locked section tiny: no HTTP calls or user waits inside.","Lock in a consistent order to avoid deadlocks.","Use NOWAIT to fail immediately, or SKIP LOCKED to grab the next free row (great for job queues).","Set lock_timeout so waits don’t last forever.","Use FOR SHARE when you only need to stop others from changing the row while you read."],"code":"BEGIN;\nSELECT qty FROM stock WHERE sku = 'A1' FOR UPDATE;\n-- others now wait for this row\nUPDATE stock SET qty = qty - 1 WHERE sku = 'A1';\nCOMMIT;\n\n-- job queue: each worker takes a different job\nSELECT * FROM jobs WHERE status='new'\nFOR UPDATE SKIP LOCKED LIMIT 1;","e":"Many Postgres-backed job queues (like Que, GoodJob, Oban) use FOR UPDATE SKIP LOCKED so 20 workers can safely pull jobs from one table without taking the same job.","p":["Holding locks while calling payment APIs","Locking whole tables when you only need one row","Inconsistent lock order causing deadlocks"],"v":["Distributed Lock","Pessimistic DB locks protect rows inside one database. A distributed lock coordinates work across servers for anything (files, jobs, external APIs)."],"f":["T1: SELECT … FOR UPDATE","T2 tries same row → waits","T1 updates + commits","T2 continues with fresh data"],"q":[["What does SELECT ... FOR UPDATE do?","Locks the selected rows until the transaction ends so other transactions can’t modify or lock them."],["What is SKIP LOCKED useful for?","Job queues: each worker skips rows already locked by others and takes the next available one."],["What’s the main risk of pessimistic locking?","Long waits, lower throughput and deadlocks, especially if locks are held for long."]]},{"n":27,"c":"dist","t":"Distributed Locks","s":"A lock that works across many servers, so only one of them does a particular job at a time.","w":"An in-memory mutex only stops threads in one process. When you have 10 servers and want only one to run the nightly report or process invoice #42, you need a lock stored somewhere all of them can see: Redis, ZooKeeper, etcd, Consul, or a database row.","y":"Without it, a cron job running on every server sends 10 copies of the same email, or two workers process the same file at the same time.","h":["Use a lease, not a forever lock: the lock expires after N seconds so a crashed server doesn’t block everyone forever.","Acquire atomically: Redis SET key value NX PX 30000 (set only if not exists, with expiry).","Store a unique random value and only delete the lock if the value is still yours (use a Lua script for check-and-delete).","Renew the lease while working on long tasks.","Use fencing tokens: the lock service hands out an increasing number, and the resource rejects writes with an older number. This protects you when a paused server thinks it still holds an expired lock.","For strong guarantees prefer consensus systems (etcd, ZooKeeper); a single Redis is fine for “avoid duplicate work” but not for correctness-critical safety.","Still make the work idempotent; locks reduce duplicates, they don’t make them impossible."],"code":"ok = redis.set(\"lock:report\", my_id, nx=True, px=30000)\nif ok:\n    try: run_report()\n    finally:\n        # delete only if still mine (atomic Lua script)\n        release_if_owner(\"lock:report\", my_id)","e":"A garbage-collection pause froze a server for 40 s while holding a 30 s lock. The lock expired, another server took it, and both wrote to the same file. Fencing tokens let the storage reject the stale writer.","p":["No expiry, so one crash blocks forever","Deleting someone else’s lock after yours expired","Assuming a lock makes duplicate work impossible"],"v":["Leader Election","A distributed lock protects ONE task or resource for a short time. Leader election picks ONE node to be the coordinator for a longer period. Leader election is often built on leases too."],"f":["Servers race for lock","One wins (SET NX + TTL)","Others skip or wait","Winner releases / lease expires"],"q":[["Why must a distributed lock have an expiry?","If the holder crashes it can never release the lock; a TTL/lease guarantees eventual release."],["What is a fencing token?","A monotonically increasing number issued with each lock grant; the protected resource rejects requests carrying an older token, blocking stale holders."],["Why compare the stored value before releasing?","Your lock may have expired and been taken by someone else; deleting blindly would release their lock."]]},{"n":28,"c":"db","t":"Sharding","s":"Splitting your data across several separate databases, each holding only part of it.","w":"When one database server can’t hold or handle all the data, you split rows by a shard key. For example users 1–1M on shard A, 1M–2M on shard B, or shard = hash(user_id) % 8. Each shard is a full independent database. The app (or a routing layer) uses the key to find the right shard.","y":"A single machine has limits on disk, memory, CPU and especially write throughput. Read replicas don’t help with writes. Sharding lets you scale writes and storage horizontally. It’s powerful but adds lots of complexity, so it’s usually a late step.","h":["Try simpler things first: indexes, query fixes, caching, read replicas, a bigger machine.","Pick a shard key that appears in almost every query (often tenant_id or user_id) so queries hit one shard.","The key should spread data and traffic evenly and avoid hot shards (a celebrity user, today’s date).","Choose a scheme: range (easy range queries, risk of hotspots), hash (even spread, no range queries), or directory/lookup table (flexible, extra lookup).","Use consistent hashing or many small virtual shards so you can rebalance without moving everything.","Plan for cross-shard queries (scatter-gather), cross-shard transactions (avoid them) and globally unique IDs (e.g. Snowflake IDs).","Consider systems that shard for you: Vitess, Citus, CockroachDB, DynamoDB, MongoDB."],"code":"shard = hash(user_id) % NUM_SHARDS\ndb = shards[shard]\ndb.query(\"SELECT * FROM orders WHERE user_id = %s\", user_id)","e":"Instagram sharded Postgres by user ID into thousands of logical shards mapped onto fewer physical servers, so they could move logical shards between machines as they grew.","p":["Picking a key that creates hot spots","Using hash % N, then changing N forces moving almost all data","Needing frequent joins across shards","Sharding too early and paying the complexity cost for nothing"],"v":["Partitioning","Partitioning usually splits a table into pieces INSIDE one database. Sharding spreads pieces across SEPARATE database servers. Sharding is partitioning taken across machines."],"f":["Order for user 7381","hash(7381) % 4 = 1","Route to shard 1","Only shard 1 does the work"],"q":[["What makes a good shard key?","High cardinality, even distribution of data and load, and present in most queries so they hit a single shard."],["Why is hash % N problematic when adding shards?","Changing N remaps almost every key, requiring huge data movement; consistent hashing or fixed virtual shards avoid this."],["What becomes harder after sharding?","Cross-shard joins, transactions, global uniqueness, rebalancing, reporting and operations."]]},{"n":29,"c":"db","t":"Partitioning","s":"Splitting one huge table into smaller pieces inside the same database, so queries and maintenance touch only the relevant piece.","w":"The table still looks like one table to your app, but under the hood rows are stored in separate partitions, e.g. one per month for an events table. Types: range (by date), list (by region), hash (spread evenly). When a query filters on the partition key, the database skips other partitions (“partition pruning”).","y":"Tables with billions of rows get slow to query, index, vacuum and clean up. Deleting old data with DELETE on billions of rows is painful; with partitions you just drop last year’s partition instantly.","h":["Choose a partition key used in most WHERE clauses (often a timestamp).","Make sure queries filter on that key, or pruning can’t happen and you scan every partition.","Keep partition counts reasonable (dozens to a few thousand, not millions).","Automate creating future partitions (pg_partman, cron) and dropping/archiving old ones.","Remember unique constraints usually must include the partition key."],"code":"CREATE TABLE events (id bigint, created_at timestamptz, data jsonb)\n  PARTITION BY RANGE (created_at);\nCREATE TABLE events_2026_10 PARTITION OF events\n  FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');\n-- delete a whole month instantly:\nDROP TABLE events_2025_10;","e":"A logging platform kept 90 days of events partitioned by day. Retention became “drop partitions older than 90 days”, replacing a nightly DELETE that used to run for hours.","p":["Queries that don’t filter on the partition key (scan all partitions)","Too many tiny partitions","Thinking partitioning automatically makes everything faster"],"v":["Sharding","Partitioning = pieces inside ONE database server. Sharding = pieces across MANY servers. Partitioning helps manageability; sharding adds machines."],"f":["Query: last 7 days","Planner checks partitions","Prune old months","Scan only 1 partition"],"q":[["What is partition pruning?","The planner skips partitions that can’t contain matching rows, based on the WHERE clause on the partition key."],["Why is partitioning great for data retention?","Old data can be removed by dropping a partition, which is instant, versus a slow massive DELETE."],["Range vs hash partitioning?","Range groups by ordered values (dates) and suits time queries/retention; hash spreads rows evenly when there’s no natural range."]]},{"n":30,"c":"db","t":"Replication","s":"Keeping copies of the same data on multiple machines, so you survive failures and can serve more reads.","w":"Every change on one node is copied to others. Common setups: leader–follower (one leader takes writes, followers copy), multi-leader (several accept writes, conflicts must be resolved) and leaderless (like Cassandra/Dynamo: write to several nodes, read from several). Copies can be synchronous (wait until the copy confirms) or asynchronous (don’t wait).","y":"A single disk or server will eventually fail. Without replication, that means downtime and possibly lost data. Replication gives high availability, read scaling, and lets you put data closer to users in other regions.","h":["Synchronous replication: no data loss on failover, but each write waits for the replica (slower).","Asynchronous replication: fast writes, but if the leader dies, the last few writes may be lost.","Semi-sync: wait for at least one replica, a common middle ground.","Plan failover: who promotes a replica, and how do clients find the new leader?","Prevent split-brain (two leaders at once) using fencing or consensus.","For leaderless systems, use quorums: with N copies, write to W and read from R where W + R > N to see the latest data.","Still take backups: replication copies mistakes too."],"e":"Amazon RDS Multi-AZ keeps a synchronous standby in another availability zone. If the primary’s zone fails, DNS switches to the standby in about a minute with no lost committed data.","p":["Treating replicas as backups","Async replication with automatic failover silently losing recent writes","Split-brain after a network partition"],"v":["Sharding","Replication = SAME data copied many times (safety, reads). Sharding = DIFFERENT data on different machines (capacity, writes). Big systems use both: each shard is replicated."],"f":["Write to leader","Copy to followers (sync/async)","!Leader dies","Follower promoted"],"q":[["Sync vs async replication trade-off?","Sync guarantees replicas have every committed write but adds latency; async is faster but can lose recent writes on failover."],["What is split-brain?","Two nodes both believing they are leader and accepting writes, causing divergent data."],["In a quorum system with N=3, what W and R give consistent reads?","Any W + R > N, e.g. W=2, R=2, so read and write sets always overlap."]]},{"n":31,"c":"dist","t":"Leader Election","s":"A way for a group of servers to agree that exactly one of them is “in charge” right now.","w":"Some jobs must have a single coordinator: the database primary, the node assigning work, the scheduler that runs cron jobs. Leader election lets nodes pick one, and pick a new one automatically if the leader dies. It’s typically built on consensus algorithms (Raft, Paxos) or on leases in systems like etcd, ZooKeeper or Consul.","y":"Without it you have either nobody coordinating (work stops) or two coordinators at once (duplicate work, conflicting data). Choosing a leader by hand doesn’t survive 3 a.m. failures.","h":["Don’t write your own consensus; use etcd, ZooKeeper, Consul, or Kubernetes' Lease objects.","The leader holds a lease that expires unless renewed; if it dies, the lease lapses and another node takes over.","Use an odd number of voting nodes (3 or 5) so a majority can always be formed.","Followers should detect a stale leader and refuse its commands, using a term/epoch number or fencing token.","Make leaders step down if they can’t renew their lease (e.g. after a network split).","Design work so a new leader can resume safely (store progress externally)."],"e":"Kubernetes runs several copies of its controller manager, but only one is active. They compete for a Lease object; if the active one dies, another takes the lease within seconds.","p":["Even number of nodes: a 2–2 split has no majority","Old leader keeps acting after losing its lease (needs fencing)","Building homemade election on timestamps from different clocks"],"v":["Failover","Leader election is HOW a new leader is chosen. Failover is the whole process of switching to a backup, which also includes moving traffic, DNS and connections."],"f":["3 nodes, one leader","!Leader stops renewing lease","Majority votes new leader","New leader resumes work"],"q":[["Why use an odd number of nodes?","A majority (quorum) is needed to elect a leader; odd numbers maximize failures tolerated and prevent ties."],["What protects against an old leader that doesn’t know it was replaced?","Term/epoch numbers or fencing tokens; followers and resources reject commands from older terms."],["Name tools that provide leader election.","etcd, ZooKeeper, Consul, Kubernetes Lease API (built on etcd)."]]},{"n":32,"c":"dist","t":"CAP Theorem","s":"When the network splits your system in two, you must choose: stay consistent (refuse some requests) or stay available (risk serving old/conflicting data).","w":"C = Consistency: every read sees the latest write. A = Availability: every request gets a non-error answer. P = Partition tolerance: the system keeps working when messages between nodes are lost. Networks DO fail, so P isn’t optional. CAP really says: DURING a partition, pick C or A. When there is no partition you can have both.","y":"It forces honest design: if two data centres lose contact, should both keep accepting bank withdrawals (available, maybe overdraw) or should one side refuse (consistent, some users see errors)? Different features deserve different answers.","h":["For money, inventory, unique usernames: lean CP. Refuse or block writes on the minority side.","For likes, view counts, feeds, shopping carts: lean AP. Accept writes and reconcile later.","Decide per operation, not per company.","Also think about PACELC: Else (no partition), you still trade Latency vs Consistency. Waiting for replicas to agree takes time.","Know your database’s defaults: e.g. Cassandra/DynamoDB are tunable toward AP; Spanner/etcd/ZooKeeper are CP."],"e":"Amazon’s shopping cart (Dynamo paper) chose availability: during failures you can always add items, and conflicting carts are merged later, occasionally bringing back a deleted item. Better than “can’t add to cart”.","p":["Saying “we chose CA” (with a distributed system you can’t opt out of partitions)","Thinking you pick two forever, instead of a choice made during partitions","Applying one choice to every feature"],"v":["Eventual Consistency","CAP describes a trade-off during network splits. Eventual consistency is one specific consistency model that AP systems often use."],"f":["!Network splits DC1 | DC2","Write arrives at DC1","CP: reject, stay correct","AP: accept, reconcile later"],"q":[["What does CAP actually say?","In the presence of a network partition, a distributed system must choose between consistency and availability."],["Why isn’t “CA” a real choice for distributed systems?","Partitions happen regardless; ignoring them doesn’t make them go away, so you must decide behaviour when they occur."],["What does PACELC add?","Even without partitions there’s a trade-off between latency and consistency."]]},{"n":33,"c":"dist","t":"Eventual Consistency","s":"Copies of the data may disagree for a short while, but if no new updates come in, they will all end up the same.","w":"When you write to one replica, the change spreads to the others in the background. For a moment, different users may see different values. “Eventually” usually means milliseconds to seconds. The opposite is strong consistency, where every read is guaranteed to see the latest write.","y":"Waiting for every copy worldwide to agree before answering makes writes slow and fails when any region is unreachable. Accepting brief disagreement gives speed and availability, which is fine for many features.","h":["Use it where small delays are harmless: like counts, follower counts, search indexes, analytics, recommendations.","Avoid it for balances, stock that must not oversell, and permissions.","Provide read-your-own-writes so a user always sees their own change (read from the leader or a sticky replica).","Plan conflict resolution for concurrent writes: last-write-wins (simple, can lose data), merge logic, or CRDTs (data types that merge automatically).","Design the UI for it: optimistic updates, “processing” states, “may take a minute to appear”."],"e":"After you change your profile photo, a friend in another country may still see the old one for a few seconds. Social networks accept this; your bank doesn’t for balances.","p":["Using it for money or inventory","Users not seeing their own updates and clicking “save” repeatedly","Last-write-wins silently losing edits"],"v":["Strong Consistency","Strong: every read shows the latest write, at the cost of latency/availability. Eventual: reads may be briefly stale, but faster and more available."],"f":["Write to replica A","B and C still old","Background sync","All replicas agree"],"q":[["Give two features where eventual consistency is fine and two where it isn’t.","Fine: like counts, search indexing. Not fine: account balances, seat bookings."],["What is read-your-own-writes consistency?","A guarantee that after you write, your own subsequent reads reflect that write, even if other users see it later."],["What is a CRDT?","Conflict-free replicated data type: a data structure designed so concurrent updates on different replicas can always be merged automatically into the same result."]]},{"n":34,"c":"dist","t":"Distributed Transactions","s":"Making one business action succeed or fail as a whole even though it touches several databases or services.","w":"Inside one database a transaction gives all-or-nothing. But “place order” might touch the orders DB, the payment service and the inventory service. There’s no single database to roll everything back. Options: two-phase commit (2PC), where a coordinator asks everyone “ready?” then “commit”; or sagas, which run local steps and undo them with compensating actions on failure.","y":"Partial success is the nightmare: money taken but no order, or stock reserved but never paid. In microservices this happens whenever one step fails or times out halfway.","h":["First, try to avoid it: keep data that must change together inside one service and one database.","2PC: phase 1 “prepare” (everyone locks and promises), phase 2 “commit”. Gives atomicity but blocks if the coordinator dies, holds locks across the network, and many modern services/APIs don’t support it.","Sagas (usually preferred): sequence of local transactions, each with a compensating action.","Use the transactional outbox to reliably publish “step done” events.","Make every step and compensation idempotent because retries will happen.","Use a workflow engine (Temporal, AWS Step Functions, Camunda) for complex flows."],"e":"Booking a holiday: reserve flight, reserve hotel, charge card. If the charge fails, a saga cancels the hotel and flight reservations rather than relying on one giant lock across three companies.","p":["Calling service A, B and C in sequence with no plan for failure in the middle","Using 2PC across slow external services","Forgetting that compensations can fail too"],"v":["Saga Pattern","2PC tries to make everything commit at once (strong but blocking). A saga accepts in-between states and uses undo steps (flexible, eventually consistent)."],"f":["Reserve stock ✓","Charge card ✓","!Create shipment fails","Compensate: refund + release stock"],"q":[["What are the two phases of 2PC?","Prepare: all participants vote whether they can commit and lock resources. Commit: if all voted yes the coordinator tells everyone to commit, otherwise abort."],["Why is 2PC often avoided in microservices?","It blocks while waiting, holds locks across network calls, has a coordinator failure problem, and many systems don’t support it."],["What’s the best way to avoid distributed transactions?","Design service boundaries so data that must change atomically lives in one service/database."]]},{"n":35,"c":"dist","t":"Saga Pattern","s":"Break a big multi-service action into small steps, and if a later step fails, run “undo” steps for the earlier ones.","w":"Each step is a local transaction in one service. Each has a compensating action: reserve seat ↔ release seat, charge card ↔ refund. Two styles: choreography (services react to each other’s events, no central boss) and orchestration (one orchestrator tells each service what to do next and handles failures).","y":"It gives reliable multi-service workflows without global locks. You accept that the system passes through in-between states (e.g. “payment pending”) for a while.","h":["List the steps and write a compensation for each one that can be undone.","Put steps that can’t be undone (sending an email, shipping) as late as possible.","Orchestration for complex flows: easier to see, test and change. Choreography for simple ones: fewer moving parts but logic is scattered.","Persist saga state so a crash resumes instead of forgetting.","Make each step and compensation idempotent and retryable.","Handle compensation failure with retries, alerts and manual intervention.","Show intermediate states to users honestly (“order processing”)."],"code":"steps = [\n  (reserve_stock,  release_stock),\n  (charge_payment, refund_payment),\n  (create_shipment, cancel_shipment),\n]\ndone = []\nfor do, undo in steps:\n    try: do(order); done.append(undo)\n    except: \n        for u in reversed(done): u(order)\n        raise","e":"Uber Eats-style flows: accept order → charge customer → restaurant confirms. If the restaurant rejects, the saga refunds the charge and notifies the customer.","p":["Compensations that aren’t true reversals (you can’t un-send an SMS)","No persisted state, so a crash leaves a half-done saga forever","Other users seeing intermediate data and acting on it"],"v":["Two-Phase Commit","2PC: all-or-nothing at one instant, with locks. Saga: step by step with undo actions, no global locks, but temporary inconsistency."],"f":["Step 1 ✓ Step 2 ✓","!Step 3 fails","Undo step 2","Undo step 1"],"q":[["Choreography vs orchestration?","Choreography: services listen to events and decide next steps themselves. Orchestration: a central coordinator directs each step and failure handling."],["What is a compensating transaction?","An action that semantically undoes a previous completed step, like a refund for a charge."],["Why put irreversible steps last?","If an earlier step fails, nothing irreversible has happened yet, so compensation is possible."]]},{"n":36,"c":"msg","t":"Message Queues","s":"A waiting line for work: one part of the system drops tasks in, workers take them out and process them when they’re ready.","w":"A producer sends a message (“resize image 42”) to a queue (RabbitMQ, SQS, Redis/BullMQ, Kafka used queue-style). A consumer/worker pulls it, does the job, then acknowledges (acks) it. If the worker crashes before acking, the message becomes visible again and another worker picks it up.","y":"If your API does slow work (send emails, generate PDFs, call slow partners) during the request, users wait and traffic spikes overwhelm you. A queue lets you reply instantly (“we’re on it”), absorb spikes, and scale workers separately.","h":["Put slow or unreliable work behind a queue; respond to the user immediately.","Ack only after the work is fully done, never before.","Expect at-least-once delivery: the same message can arrive twice. Make consumers idempotent.","Set visibility timeouts longer than the job takes.","Limit retries and send repeatedly failing messages to a dead-letter queue.","Monitor queue depth AND age of the oldest message; age shows how far behind users really are.","Autoscale workers on queue depth.","Ordering is usually not guaranteed unless you use FIFO queues or partitions."],"code":"# producer (API)\nqueue.send({\"type\": \"resize\", \"image_id\": 42})\nreturn 202  # Accepted\n\n# worker\nmsg = queue.receive()\nresize(msg.image_id)\nqueue.ack(msg)   # only after success","e":"When you upload a video to YouTube, the upload finishes fast; encoding into many resolutions happens through job queues over the next minutes.","p":["Acking before processing (crash = lost job)","Non-idempotent consumers creating duplicates","Unbounded queue silently growing for days","Putting huge payloads in messages instead of a reference (store the file in S3, send its ID)"],"v":["Pub/Sub","A queue usually gives each message to ONE worker (share the work). Pub/sub gives each message to EVERY subscriber (broadcast the news)."],"f":["API enqueues job","Queue holds it","Worker processes","Worker acks → removed"],"q":[["Why ack after processing and not before?","If the worker crashes after acking but before finishing, the job is lost forever."],["What does at-least-once delivery mean for consumers?","They may receive the same message more than once and must be idempotent."],["Which metric best shows queue health?","Age of the oldest message (latency), together with queue depth and processing rate."]]},{"n":37,"c":"msg","t":"Pub/Sub","s":"A publisher announces an event to a topic, and every service that subscribed gets its own copy.","w":"The publisher doesn’t know or care who’s listening. “OrderPlaced” goes to the topic; the email service, the analytics service and the warehouse service each receive it. Adding a new listener needs zero changes to the publisher. Tools: Kafka, Google Pub/Sub, SNS, Redis Pub/Sub, NATS.","y":"Without it, the order service must call email, analytics and warehouse directly. Every new feature means editing the order service, and if analytics is down, ordering breaks.","h":["Publish facts in past tense: OrderPlaced, PaymentFailed, with IDs and key fields.","Each subscriber gets its own subscription/consumer group with its own position.","Expect duplicates and out-of-order delivery; deduplicate with event IDs.","Version event schemas; only add fields, don’t remove or rename (or use a schema registry).","Choose durability: Redis Pub/Sub drops messages if nobody’s listening; Kafka/Google Pub/Sub keep them.","Ordering is usually guaranteed only per key/partition (e.g. per order ID)."],"e":"When a ride ends at Uber, a TripCompleted event fans out to billing, driver payouts, receipts, ratings prompts and fraud detection, each a separate subscriber.","p":["Publishing commands disguised as events (“SendEmailNow”)","Breaking subscribers by changing event shape","Using non-durable pub/sub for important events"],"v":["Message Queue","Queue: many workers SHARE the work, each message handled once. Pub/sub: every subscriber gets EVERY message. Kafka can do both via consumer groups."],"f":["Order service publishes OrderPlaced","Topic","Email / Analytics / Warehouse","Each processes its own copy"],"q":[["How does pub/sub reduce coupling?","Publishers don’t know subscribers; new consumers can be added without changing the publisher."],["What’s the difference between an event and a command?","An event states a fact that happened (OrderPlaced). A command asks someone to do something (ChargeCard)."],["How is ordering typically guaranteed in Kafka?","Only within a partition; messages with the same key go to the same partition and keep order."]]},{"n":38,"c":"msg","t":"Event-Driven Architecture","s":"Services communicate mainly by announcing what happened, and others react, instead of calling each other directly and waiting.","w":"In request/response style, service A calls B and waits. In event-driven style, A emits “something happened” and moves on; B, C and D react in their own time. The system is built from producers, an event backbone (Kafka, EventBridge, Pub/Sub) and consumers.","y":"It decouples teams and services, keeps the user’s request fast (side effects happen asynchronously), and absorbs spikes. The price: the flow is harder to see and debug, and data becomes eventually consistent.","h":["Use events for side effects and notifications; keep direct calls for things the user needs an answer to NOW.","Define clear event contracts and own them like an API.","Add correlation IDs and distributed tracing so you can follow one order through many services.","Make consumers idempotent and handle retries and DLQs.","Publish reliably with the transactional outbox.","Document who produces and who consumes each event (an event catalog).","Watch consumer lag to see when listeners fall behind."],"e":"When you place an Amazon order, the checkout returns quickly. Emails, warehouse picking, recommendations and invoices follow from events behind the scenes.","p":["“Event spaghetti”: nobody knows what triggers what","Using events where the caller actually needs the result","Losing events between DB commit and publish"],"v":["Request/Response","Request/response: call and wait for an answer (simple, tightly coupled). Event-driven: announce and continue (decoupled, eventually consistent, harder to trace)."],"f":["User places order","OrderPlaced event","Services react async","User already got “Order confirmed”"],"q":[["When should you NOT use events?","When the caller needs an immediate answer to continue, like checking a password or getting a price."],["What are the main downsides of event-driven systems?","Harder debugging and tracing, eventual consistency, duplicate/out-of-order handling, and hidden dependencies."],["What is consumer lag?","How far behind a consumer is from the latest events; growing lag means it can’t keep up."]]},{"n":39,"c":"msg","t":"Dead Letter Queues","s":"A separate “problem pile” where messages go after failing too many times, so they stop blocking everything else.","w":"Some messages can never succeed: malformed JSON, a deleted customer, a bug in the consumer. These “poison messages” fail, get retried, fail again forever. A dead-letter queue (DLQ) catches them after N failed attempts, so the main queue keeps flowing and humans can inspect the bad ones.","y":"Without a DLQ, a poison message either blocks a strictly ordered queue completely, or loops forever burning CPU, or is silently dropped and lost.","h":["Set a max receive/retry count (e.g. 5) after which messages move to the DLQ (SQS redrive policy, RabbitMQ dead-letter exchange).","Keep the original payload plus error reason, attempt count and timestamps.","Alert when DLQ size is above zero or growing.","Investigate, fix the bug or data, then redrive (replay) messages back to the main queue.","Make sure replay is safe: consumers must be idempotent.","Set a retention period long enough for someone to look."],"e":"An invoice worker crashed on any customer with an emoji in their address. Instead of retrying forever, those messages landed in the DLQ; after the encoding fix, the team replayed them all with one command.","p":["Nobody watching the DLQ, so it becomes a graveyard","Replaying before fixing the bug (they just go back to the DLQ)","DLQ retention shorter than the time it takes anyone to notice"],"v":["Retry Queue","A retry queue holds messages to try AGAIN later. A DLQ holds messages that have given up and need a HUMAN or a fix."],"f":["Message fails","Retry ×5 with backoff","!Still failing","Move to DLQ + alert"],"q":[["What is a poison message?","A message that will fail every time it’s processed, e.g. due to bad data or a bug."],["What should you do with messages in a DLQ?","Alert, investigate the cause, fix code or data, then replay them safely to the main queue."],["Why must DLQ replay be idempotent?","Some messages may have partially succeeded before failing; replaying could duplicate effects."]]},{"n":40,"c":"msg","t":"Backpressure","s":"When the downstream part can’t keep up, it pushes back and tells the upstream part to slow down, instead of drowning.","w":"Think of a sink: if water pours in faster than the drain, it overflows. In software, a producer that sends faster than the consumer can handle fills up memory, buffers and queues until something crashes. Backpressure is the feedback signal: “stop”, “slow down”, or “I’ll only take 100 at a time”.","y":"Unbounded buffers hide the problem until latency explodes and the process runs out of memory. With backpressure, the system degrades gracefully: some requests get “busy, try later” while the rest stay fast.","h":["Use bounded queues and buffers; when full, block the producer or reject new work.","Reject early and cheaply with 503/429 at the edge instead of accepting work you can’t finish.","Use pull-based consumption: consumers ask for N items when ready (Reactive Streams, Kafka consumers, gRPC flow control).","Limit concurrency: e.g. max 50 in-flight DB calls; queue or reject the rest.","Shed load by priority: drop analytics before checkout.","Propagate the signal upstream so clients slow down too."],"code":"queue = asyncio.Queue(maxsize=1000)   # bounded\nawait queue.put(item)   # producer waits when full\n# or, for HTTP:\nif inflight >= LIMIT: return 503, {\"Retry-After\": \"2\"}","e":"TCP has backpressure built in: the receiver advertises a window size, and the sender never sends more unacknowledged data than that window.","p":["Unbounded in-memory queues","Accepting every request then timing them all out","Retry storms ignoring the slow-down signal"],"v":["Rate Limiting","Rate limiting is a fixed policy (“100/min per user”) even when idle. Backpressure is dynamic, based on how overloaded the system is right now."],"f":["Producer sends fast","Bounded buffer fills","Signal: slow down / 503","Producer waits, system stable"],"q":[["Why are unbounded queues dangerous?","They hide overload, grow until memory runs out, and make latency for every item huge."],["Name three ways to apply backpressure.","Bounded blocking queues, rejecting with 503/429, pull-based consumption with demand signals, or concurrency limits."],["What is load shedding?","Deliberately dropping lower-priority work when overloaded to protect the most important work."]]},{"n":41,"c":"ops","t":"Cron Jobs","s":"Tasks that run automatically on a schedule, like “every night at 2 AM”.","w":"Cron is the classic Unix scheduler using expressions like 0 2 * * * (minute hour day month weekday). In modern systems you use Kubernetes CronJobs, cloud schedulers (EventBridge Scheduler, Cloud Scheduler) or job libraries. Typical uses: backups, reports, cleanup, sending reminders, syncing data.","y":"Without scheduling, routine work depends on someone remembering. But naive cron jobs have classic failures: they run on every server at once, overlap with the previous run, fail silently, or fire at the wrong time due to time zones.","h":["Run the job in ONE place (a scheduler, or with a distributed lock) so 10 servers don’t all run it.","Prevent overlap: skip if the previous run is still going (Kubernetes concurrencyPolicy: Forbid).","Make jobs idempotent so a rerun or a double run is safe.","Be explicit about time zones (UTC is safest) and daylight-saving changes.","Log start, end and result, and alert when a job FAILS or DOESN’T RUN (heartbeat monitoring like healthchecks.io).","Keep the cron trigger light: it can enqueue jobs that workers process.","Process big data in batches and checkpoint progress so a crash can resume."],"code":"# Kubernetes CronJob\nschedule: \"0 2 * * *\"      # 02:00 every day\ntimeZone: \"Etc/UTC\"\nconcurrencyPolicy: Forbid\nstartingDeadlineSeconds: 600","e":"A nightly billing cron ran on all 4 app servers after a scale-up, charging customers 4 times. Moving it to a single scheduled job with an idempotency check per invoice fixed it.","p":["Silent failures nobody notices for weeks","Same job running on every instance","DST shifting a 2:30 AM job to never run (or run twice)"],"v":["Message Queue","Cron decides WHEN work starts. A queue decides HOW work is buffered and processed. A good pattern: cron enqueues, workers process."],"f":["Scheduler fires 02:00 UTC","Acquire lock / single runner","Enqueue or run job","Log + heartbeat ping"],"q":[["How do you make sure a cron job runs only once with many servers?","Use a central scheduler, a single-instance runner, or a distributed lock, and make the job idempotent."],["How do you detect a cron job that silently stopped running?","Heartbeat (“dead man’s switch”) monitoring: alert if the job doesn’t check in by the expected time."],["What does 0 2 * * 1 mean?","At 02:00 every Monday."]]},{"n":42,"c":"sec","t":"SQL Injection","s":"An attack where user input is treated as part of your SQL command, letting attackers read or change your data.","w":"If you build SQL by gluing strings, like \"SELECT * FROM users WHERE name = '\" + name + \"'\", an attacker can type ' OR '1'='1 as their name. The query becomes WHERE name = '' OR '1'='1', which matches everyone. Worse inputs can drop tables or dump passwords.","y":"It’s one of the oldest and most damaging web vulnerabilities, behind countless data breaches. It’s also completely preventable.","h":["Always use parameterized queries / prepared statements. The query structure and the data are sent separately, so data can never become code.","ORMs are safe by default, but raw SQL inside ORMs (raw(), execute(), string-formatted filters) is not.","Identifiers like column names in ORDER BY can’t be parameters: use an allowlist of permitted values.","Give the app’s DB user least privilege (no DROP, no access to other schemas).","Validate input types (an ID should be an integer) as an extra layer.","Don’t show raw DB error messages to users.","Use scanners (sqlmap in testing, SAST tools in CI)."],"code":"# VULNERABLE\ncur.execute(f\"SELECT * FROM users WHERE email = '{email}'\")\n\n# SAFE: parameter is sent as data, never as SQL\ncur.execute(\"SELECT * FROM users WHERE email = %s\", (email,))\n\n# ORDER BY: allowlist\ncol = {\"name\": \"name\", \"date\": \"created_at\"}.get(sort, \"created_at\")","e":"The 2008 Heartland Payment Systems breach, one of the largest card thefts ever (over 100 million cards), started with a SQL injection on a web form.","p":["“Escaping” input manually instead of parameters","Thinking an ORM protects raw queries too","Trusting input because it comes from your own frontend or a hidden field"],"v":["XSS","SQL injection makes input run as SQL on YOUR DATABASE. XSS makes input run as JavaScript in OTHER USERS' BROWSERS. Fix SQLi with parameters, XSS with output escaping."],"f":["!Input: ' OR '1'='1","String-built SQL","!Returns every user","Fix: parameterized query"],"q":[["Why do parameterized queries prevent SQL injection?","The SQL structure is compiled separately from the values; values are always treated as data, never as executable SQL."],["How do you safely let users choose a sort column?","Map their choice through an allowlist of known column names; never insert it directly."],["Is input validation enough to stop SQL injection?","No; it’s a helpful extra layer, but parameterization is the real fix."]]},{"n":43,"c":"sec","t":"XSS","s":"Cross-Site Scripting: an attacker gets their JavaScript to run inside your website, in other users' browsers.","w":"If you put user content into a page without escaping, e.g. a comment containing <script>steal()<\/script>, every visitor’s browser runs that script as if your site wrote it. Types: stored (saved in DB, shown to many), reflected (bounced from a URL parameter) and DOM-based (frontend JS inserts data unsafely with innerHTML).","y":"The script runs with your site’s power: it can read data on the page, act as the logged-in user, steal tokens from localStorage, change what users see, or redirect them to phishing pages.","h":["Escape output for its context: HTML body, HTML attribute, JavaScript, URL and CSS each need different encoding.","Use frameworks that escape by default (React, Vue, Angular, Django/Jinja templates) and avoid their escape hatches (dangerouslySetInnerHTML, v-html, |safe).","If you must allow HTML (rich text), sanitize with a proven library like DOMPurify using an allowlist.","Use textContent instead of innerHTML in plain JS.","Add a Content-Security-Policy header that blocks inline scripts and untrusted script sources.","Set session cookies HttpOnly so JS can’t read them.","Validate URLs: block javascript: links in href attributes."],"code":"// UNSAFE\nel.innerHTML = comment;\n// SAFE\nel.textContent = comment;\n// Rich text: sanitize first\nel.innerHTML = DOMPurify.sanitize(comment);\n// Header\nContent-Security-Policy: script-src 'self'","e":"The 2005 “Samy” MySpace worm used stored XSS in a profile: anyone viewing it ran a script that added Samy as a friend and copied itself into their profile. Over a million profiles were infected in under a day.","p":["Escaping for HTML but placing data inside a script block or attribute","Trusting data from your own database (it came from users originally)","Building HTML strings in JS with concatenation"],"v":["CSRF","XSS runs the attacker’s code INSIDE your site. CSRF tricks the user’s browser into SENDING a request to your site from somewhere else. XSS is generally worse; it can bypass CSRF protections."],"f":["!Attacker posts <script> comment","Saved in DB","Victim opens page","Fix: escape output + CSP"],"q":[["Stored vs reflected XSS?","Stored is saved on the server and served to many users; reflected comes from the current request (like a URL parameter) and is echoed back immediately."],["Why is escaping context-dependent?","Characters that are dangerous differ between HTML, attributes, JavaScript strings and URLs, so each needs its own encoding."],["How does CSP reduce XSS impact?","It tells the browser which script sources are allowed, blocking injected inline scripts even if escaping fails."]]},{"n":44,"c":"sec","t":"CSRF","s":"Cross-Site Request Forgery: a malicious website makes your logged-in browser send an action to another site without you knowing.","w":"Browsers automatically attach cookies to requests for a site. So if you’re logged into bank.com and visit evil.com, evil.com can contain a hidden form that POSTs to bank.com/transfer. Your browser adds your bank cookie, and the bank sees a valid logged-in request. The attacker can’t read the response, but the action still happens.","y":"Any state-changing action that relies only on cookies (transfer money, change email, delete account) can be triggered by a stranger’s webpage.","h":["Set cookies with SameSite=Lax (modern browser default) or Strict, which stops cookies on most cross-site requests.","Use anti-CSRF tokens: a random token in the form/header that evil.com can’t know; most frameworks provide this built in.","Never change state with GET requests.","Check the Origin / Referer header on sensitive requests.","APIs that use an Authorization header (not cookies) aren’t vulnerable in the same way, because browsers don’t add that header automatically.","Re-ask for password for critical actions."],"code":"Set-Cookie: session=abc; HttpOnly; Secure; SameSite=Lax\n\n<form method=\"POST\" action=\"/email\">\n  <input type=\"hidden\" name=\"csrf_token\" value=\"{{ token }}\">\n<\/form>","e":"In 2008, a CSRF bug in some home routers let any website change the router’s DNS settings just by loading an image URL, sending users to fake banking sites.","p":["State-changing GET links like /delete?id=5","Thinking CORS protects you (simple form POSTs don’t need CORS permission to be SENT)","Disabling the framework’s CSRF protection to fix an annoying error"],"v":["CORS","CORS controls whether another site’s JS can READ responses. CSRF is about another site making the browser SEND requests. CORS does not stop CSRF."],"f":["You’re logged into bank.com","!evil.com auto-submits form","Browser attaches cookie","Fix: SameSite + CSRF token"],"q":[["Why does CSRF work?","Browsers automatically include cookies for the target site, so forged requests look authenticated."],["How does SameSite=Lax help?","Cookies aren’t sent on cross-site subrequests and cross-site POSTs, only on top-level GET navigations."],["Are APIs using bearer tokens in headers vulnerable to CSRF?","Generally no, because browsers don’t attach Authorization headers automatically; the attacker’s page doesn’t know the token."]]},{"n":45,"c":"sec","t":"SSRF","s":"Server-Side Request Forgery: tricking your server into fetching a URL the attacker chooses, often an internal one.","w":"Features like “import from URL”, link previews, webhooks or PDF generators make your server fetch URLs. An attacker supplies http://169.254.169.254/latest/meta-data/ (cloud metadata) or http://localhost:6379 or http://internal-admin/. Your server, which sits inside the trusted network, happily fetches it and maybe shows the result.","y":"Internal services often trust anything from inside the network. Cloud metadata endpoints can hand out credentials. SSRF turns your server into the attacker’s insider.","h":["Allowlist destinations if possible (only specific domains).","Resolve the hostname and block private, loopback and link-local ranges (10.x, 172.16–31.x, 192.168.x, 127.x, 169.254.x, ::1, fc00::/7).","Re-check after every redirect, or disable redirects.","Pin the resolved IP for the actual connection to stop DNS rebinding tricks.","Allow only http/https schemes; block file://, gopher:// etc.","Use IMDSv2 on AWS (requires a token, blocks simple SSRF) and give instances minimal IAM permissions.","Run URL fetchers in an isolated network with restricted egress."],"e":"In the 2019 Capital One breach, an SSRF through a misconfigured web firewall let the attacker query the AWS metadata service, obtain credentials and read over 100 million customer records from S3.","p":["Blocking the string “localhost” but not 127.0.0.1, 0.0.0.0, [::1] or decimal IP tricks","Validating the URL then following a redirect to an internal address","Returning fetched content verbatim to the user"],"v":["CSRF","CSRF tricks a USER’s browser into sending requests. SSRF tricks your SERVER into sending requests from inside your network."],"f":["!User submits internal URL","Server resolves host","Blocked: private IP range","Only public allowed URLs fetched"],"q":[["Why is 169.254.169.254 important in SSRF?","It’s the cloud instance metadata endpoint that can return credentials and configuration."],["Why isn’t checking the URL string enough?","Attackers use redirects, alternate IP encodings and DNS rebinding; you must check the resolved IP for every connection."],["Name two infrastructure defenses for SSRF.","Restricted egress / network isolation for fetchers, and IMDSv2 with minimal instance permissions."]]},{"n":46,"c":"sec","t":"OAuth","s":"A standard that lets one app get limited access to your account on another service without ever seeing your password.","w":"Roles: the user (resource owner), the app (client), the authorization server (e.g. Google’s login), and the resource server (Google Drive API). You click “Connect Google Drive”, Google asks you to approve specific permissions (scopes), then Google gives the app an access token for just those permissions. OAuth 2.0 is about authorization (what can be accessed). OpenID Connect (OIDC) adds an ID token on top for login (who you are).","y":"Before OAuth, apps asked for your actual Gmail password, getting full access forever. OAuth gives limited, revocable, expiring access.","h":["Use the Authorization Code flow with PKCE for web, mobile and SPAs. Avoid the old Implicit flow and the password grant.","Use a random state parameter to prevent CSRF on the callback.","Register exact redirect URIs; never allow wildcards.","Request the smallest scopes you need.","Keep short-lived access tokens and use refresh tokens to get new ones; store tokens securely on the server where possible.","For login, use OIDC and validate the ID token (signature, issuer, audience, expiry, nonce).","Use Client Credentials flow for machine-to-machine access.","Use a well-known library or provider, not hand-written OAuth."],"code":"1. App → redirect to /authorize?client_id&scope=drive.read\n       &redirect_uri&state=xyz&code_challenge=…\n2. User logs in at Google + approves\n3. Google → redirect back with ?code=abc&state=xyz\n4. App server → POST /token (code + code_verifier)\n5. Gets access_token (+ refresh_token)","e":"“Sign in with Google” on most websites is OIDC on top of OAuth 2.0: the site never sees your Google password, only an ID token saying who you are.","p":["Using OAuth access tokens as proof of login without OIDC checks","Open/wildcard redirect URIs leaking codes to attackers","Storing refresh tokens in localStorage","Skipping the state check"],"v":["JWT","OAuth is a PROTOCOL for granting access. JWT is a token FORMAT. OAuth tokens may or may not be JWTs."],"f":["App redirects to Google","User approves scopes","App gets code → exchanges","Access token for Drive API"],"q":[["OAuth 2.0 vs OpenID Connect?","OAuth 2.0 grants delegated access (authorization). OIDC adds identity (authentication) with an ID token telling the app who the user is."],["What does PKCE protect against?","Interception of the authorization code: only the client that created the code_verifier can exchange the code for tokens."],["What’s the purpose of the state parameter?","It ties the callback to the request the app started, preventing CSRF/login mix-up attacks."]]},{"n":47,"c":"sec","t":"JWT Rotation","s":"Regularly replacing tokens and signing keys so that stolen ones stop working quickly.","w":"A JWT (JSON Web Token) is a signed blob: header.payload.signature. Servers verify the signature instead of looking up a session. The catch: once issued, a JWT is valid until it expires, even if stolen. Rotation covers two things: token rotation (short-lived access tokens plus refresh tokens that get replaced on every use) and key rotation (changing the signing keys periodically).","y":"A long-lived token (say 30 days) that leaks gives an attacker 30 days of access. A leaked signing key lets attackers create valid tokens for anyone. Rotation limits the blast radius.","h":["Keep access tokens short (5–15 minutes).","Use refresh tokens to get new access tokens; store refresh tokens securely (HttpOnly cookie or server-side).","Refresh token rotation: each use returns a NEW refresh token and invalidates the old one.","Reuse detection: if an old refresh token is used again, assume theft and revoke the whole token family/session.","Rotate signing keys: publish keys via JWKS with a kid (key ID) header; add the new key, start signing with it, keep the old one for verification until old tokens expire, then remove it.","Prefer asymmetric signing (RS256/ES256) so services verify with a public key without holding the private one.","Always validate: signature, exp, iss, aud, and reject alg=none."],"e":"Auth0 and Okta both support refresh token rotation with automatic reuse detection: replaying a stolen refresh token logs out the legitimate user and the attacker together, cutting the attack off.","p":["Day-long or never-expiring access tokens","Putting sensitive data in the payload (it’s only base64, not encrypted)","Accepting the algorithm from the token header blindly","One key forever with no rotation plan"],"v":["Token Revocation","Rotation replaces credentials on a schedule or each use. Revocation kills a specific credential NOW. Short-lived JWTs + revocable refresh tokens give you both."],"f":["Access token expires (15 min)","Send refresh token R1","Get new access + R2; R1 dead","!R1 reused → revoke session"],"q":[["Why can’t you simply “log out” a JWT?","It’s self-contained and valid until expiry; servers don’t look it up. You need short lifetimes, a denylist, or revocable refresh tokens."],["How does refresh token reuse detection work?","Each refresh issues a new token and invalidates the old one; if an invalidated token is presented, the server assumes theft and revokes the whole family."],["How do you rotate a signing key without logging everyone out?","Publish the new key alongside the old via JWKS with key IDs, sign new tokens with the new key, keep verifying the old until its tokens expire, then remove it."]]},{"n":48,"c":"sec","t":"IAM","s":"Identity and Access Management: the system that decides who (or what) you are, and what you’re allowed to do.","w":"IAM covers identities (users, groups, service accounts, roles), authentication (proving who you are: passwords, MFA, SSO) and authorization (permissions/policies: “this role can read this S3 bucket”). In clouds like AWS/GCP/Azure, every API call is checked against IAM policies.","y":"Most cloud breaches come from overly broad permissions or leaked credentials. If every developer and service has admin access, one leaked key means total compromise.","h":["Least privilege: grant only the actions and resources needed, nothing extra.","Use roles and groups instead of attaching permissions to individuals.","Use temporary credentials (assume-role, workload identity) instead of long-lived access keys.","Turn on MFA for every human, especially admins; use SSO for central control.","Separate environments (prod vs dev accounts/projects).","Review access regularly and remove unused permissions (AWS Access Analyzer, IAM recommender).","Log every access (CloudTrail, audit logs) and alert on risky actions.","Lock away the root/owner account; use it almost never."],"code":"{\n  \"Effect\": \"Allow\",\n  \"Action\": [\"s3:GetObject\"],\n  \"Resource\": \"arn:aws:s3:::invoices-bucket/*\"\n}  // read-only, one bucket, nothing else","e":"A startup gave its CI pipeline AdministratorAccess. When the CI token leaked, the attacker deleted production databases. With least privilege, the CI could only deploy to one service.","p":["Wildcards everywhere: “Action”: \"*\", “Resource”: \"*\"","Sharing one account between people","Never removing access for people who left"],"v":["RBAC","IAM is the whole system of identities and access. RBAC is one WAY to model permissions inside it, by roles."],"f":["Identity: user / service","Authenticate (SSO + MFA)","Check policy","Allow or deny + audit log"],"q":[["What is the principle of least privilege?","Give each identity only the minimum permissions required to do its job, and nothing more."],["Why prefer roles with temporary credentials over access keys?","Temporary credentials expire automatically and aren’t stored in code, so leaks are less damaging."],["Authentication vs authorization?","Authentication proves who you are; authorization decides what you’re allowed to do."]]},{"n":49,"c":"sec","t":"TLS","s":"The protocol behind HTTPS that encrypts traffic and proves you’re talking to the real server.","w":"TLS (Transport Layer Security, the successor to SSL) gives three things: encryption (nobody in the middle can read it), integrity (nobody can change it unnoticed) and authentication (the server proves its identity with a certificate signed by a trusted Certificate Authority). During the handshake, client and server agree on keys; TLS 1.3 does this in one round trip.","y":"Without TLS, anyone on the same Wi-Fi, ISP or network path can read passwords and cookies, inject ads or malware, or impersonate your site.","h":["Use HTTPS everywhere, and redirect HTTP to HTTPS.","Get certificates automatically (Let’s Encrypt with certbot/Caddy, or cloud-managed certificates) and auto-renew them.","Allow only TLS 1.2 and 1.3; disable old SSL/TLS versions and weak ciphers.","Add HSTS (Strict-Transport-Security) so browsers never try plain HTTP again.","Monitor certificate expiry; expired certs cause full outages.","Use mTLS (both sides present certificates) between internal services for zero-trust setups.","Test your config with SSL Labs."],"code":"Strict-Transport-Security: max-age=31536000; includeSubDomains\n\n# nginx\nssl_protocols TLSv1.2 TLSv1.3;","e":"Many famous outages, including some at Microsoft Teams and Spotify, were caused simply by an expired certificate that nobody renewed in time.","p":["Expired certificates","Disabling certificate verification in code (\"verify=False\") to fix an error","Mixed content: HTTPS page loading HTTP scripts"],"v":["Encryption at Rest","TLS protects data MOVING over the network. Encryption at rest protects data SITTING on disk. You need both."],"f":["Client hello","Server sends certificate","Verify CA + agree keys","Encrypted HTTPS traffic"],"q":[["What three guarantees does TLS give?","Confidentiality (encryption), integrity (tamper detection) and server authentication (certificates)."],["What is HSTS?","A header telling browsers to always use HTTPS for the domain, preventing downgrade to HTTP."],["What is mTLS?","Mutual TLS: both client and server present certificates, so each side authenticates the other; common between microservices."]]},{"n":50,"c":"sec","t":"Encryption at Rest","s":"Encrypting data while it’s stored on disks, databases and backups, so stolen storage is useless without the key.","w":"Data at rest is anything stored: DB files, S3 objects, backups, laptop disks. Encrypting it means the bytes on disk are scrambled. Levels: full-disk/volume encryption (e.g. EBS, BitLocker), database-level (TDE), and application-level or field-level encryption (you encrypt a specific column like Aadhaar or card numbers before saving).","y":"Disks get stolen, backups get misplaced, cloud snapshots get shared by mistake. Many regulations (GDPR, PCI DSS, HIPAA) require it.","h":["Turn on provider encryption for disks, databases, object storage and backups (usually one checkbox with a managed key).","Use a Key Management Service (AWS KMS, GCP KMS, Vault); never store keys next to the data.","Envelope encryption: data is encrypted with a data key, and the data key is encrypted with a master key in KMS.","For very sensitive fields, add application-level encryption so even DB admins only see ciphertext.","Rotate keys and restrict who can use them; log every key use.","Remember its limits: if the app is hacked, it reads data decrypted. It mainly protects against stolen media and some insider access."],"e":"AWS S3 now encrypts all new objects by default (SSE-S3). Teams handling payment data add SSE-KMS with their own keys so access to the key itself is controlled and audited.","p":["Key stored in the same place as the data","Thinking it protects against SQL injection or app compromise","Unencrypted backups of encrypted databases"],"v":["Encryption in Transit","At rest = stored data on disk. In transit = data travelling over networks. A secure system encrypts both."],"f":["App writes data","Encrypt with data key","Data key wrapped by KMS","Disk stores ciphertext"],"q":[["What is envelope encryption?","Data is encrypted with a data key; that key is itself encrypted with a master key held in a KMS. Only the wrapped data key is stored with the data."],["What does encryption at rest NOT protect against?","An attacker who compromises the running application or credentials that can read data normally."],["Why use application-level field encryption?","So specific sensitive fields stay encrypted even to database admins, logs and backups."]]},{"n":51,"c":"sec","t":"Encryption in Transit","s":"Encrypting data while it travels between browsers, servers, databases and services.","w":"Any data crossing a network can be captured: public Wi-Fi, ISPs, cloud network hops. Encryption in transit wraps traffic so it can’t be read or altered on the way, mostly using TLS (HTTPS, database connections with SSL, SMTP with STARTTLS) or VPN/IPsec/WireGuard tunnels.","y":"Teams often protect the public HTTPS edge but send plaintext between the load balancer, app, database and cache inside the network. Internal networks get breached too, and cloud networks are shared infrastructure.","h":["Use HTTPS for all external traffic.","Enable TLS for database, Redis and message broker connections (sslmode=verify-full for Postgres).","Verify certificates; encryption without verification can still be intercepted.","Use mTLS or a service mesh (Istio, Linkerd) to encrypt service-to-service traffic automatically.","Never send secrets or tokens in URLs (they land in logs); use headers or bodies over TLS.","Use VPN or private links for cross-cloud or on-prem connections."],"code":"postgresql://app@db:5432/shop?sslmode=verify-full\nredis-cli --tls -h cache.internal","e":"In 2013 it emerged that some intelligence agencies tapped private links between Google’s data centres. Google responded by encrypting all internal traffic.","p":["TLS that skips certificate verification","Plaintext internal traffic “because it’s private”","Tokens in query strings"],"v":["TLS","Encryption in transit is the GOAL. TLS is the most common TOOL used to achieve it."],"f":["Browser → LB (HTTPS)","LB → app (TLS)","App → DB (TLS verify-full)","Encrypted end to end"],"q":[["Why encrypt internal traffic?","Internal networks can be compromised or shared; attackers inside could otherwise read everything."],["What does sslmode=verify-full do in Postgres?","Encrypts and also verifies the server certificate and hostname, preventing man-in-the-middle attacks."],["Why shouldn’t tokens go in URLs?","URLs are recorded in logs, browser history and Referer headers."]]},{"n":52,"c":"sec","t":"WAF","s":"A Web Application Firewall: a filter in front of your app that blocks requests matching known attack patterns.","w":"A WAF inspects HTTP requests (URL, headers, body) and blocks suspicious ones: SQL injection payloads, XSS strings, path traversal (../../etc/passwd), bad bots, known exploits. It runs at the edge (Cloudflare, AWS WAF, Akamai) or as a module (ModSecurity with the OWASP Core Rule Set).","y":"It’s a safety net that buys time, for example blocking a newly announced exploit (like Log4Shell) across all apps within hours, before every service is patched.","h":["Start with managed rule sets (OWASP CRS, vendor managed rules).","Run in “count/log only” mode first to find false positives, then enable blocking.","Add custom rules: rate limits on login, geo or bot rules, blocking admin paths from the internet.","Tune exceptions for legitimate endpoints that look scary (e.g. a code editor posting SQL).","Keep logs and dashboards of blocked requests.","Treat it as defence-in-depth; still fix the actual vulnerabilities in code."],"e":"When Log4Shell was disclosed in December 2021, Cloudflare and AWS pushed WAF rules blocking ${jndi: patterns within hours, protecting customers while they patched Java apps.","p":["Relying on a WAF instead of writing secure code","Enabling blocking without tuning, breaking real users","Attackers bypassing with encodings the WAF doesn’t decode"],"v":["DDoS Protection","A WAF filters MALICIOUS requests by content. DDoS protection deals with HUGE VOLUMES of traffic. Often offered together, but different jobs."],"f":["Incoming request","WAF rule check","!Matches attack → block","Clean request → app"],"q":[["Why start a WAF in log-only mode?","To detect false positives that would block legitimate users before enforcing."],["Can a WAF replace secure coding?","No; attackers find bypasses. It’s an extra layer and a stopgap for new vulnerabilities."],["What is the OWASP Core Rule Set?","An open-source set of generic attack-detection rules for WAFs like ModSecurity."]]},{"n":53,"c":"sec","t":"DDoS Protection","s":"Defending against floods of traffic from many machines that try to knock your service offline.","w":"In a DDoS (Distributed Denial of Service), thousands of hijacked devices (a botnet) send traffic. Types: volumetric (fill your bandwidth with gigabits of junk), protocol (exhaust connection tables, e.g. SYN floods), and application-layer (realistic-looking HTTP requests to expensive pages).","y":"A small server or even a whole data centre link can be overwhelmed. You can’t simply out-scale terabits of attack traffic yourself; it requires huge edge networks.","h":["Put a CDN/DDoS provider in front (Cloudflare, AWS Shield + CloudFront, Akamai, Google Cloud Armor) to absorb volumetric floods at the edge.","Hide your origin IP; allow traffic only from the provider’s IP ranges.","Rate limit per IP/token, and challenge suspicious clients (CAPTCHA, JS challenge).","Cache as much as possible so floods hit the cache, not your servers.","Protect expensive endpoints (search, login, report generation) with stricter limits.","Autoscale carefully with cost caps; scaling alone can just make the attack expensive for you.","Have a runbook: who to call, how to turn on “under attack” mode."],"e":"In 2018 GitHub was hit with a 1.35 Tbps memcached amplification attack. Routing traffic through Akamai’s scrubbing network brought the site back within about 10 minutes.","p":["Origin IP leaked (old DNS records, email headers), so attackers bypass the CDN","Relying on autoscaling and getting a giant bill","No plan until the attack starts"],"v":["Rate Limiting","Rate limiting handles abusive clients you can identify. DDoS protection handles massive distributed floods that need edge network capacity."],"f":["!Botnet flood","Edge network absorbs/scrubs","Rate limit + challenges","Clean traffic reaches origin"],"q":[["Name three types of DDoS attacks.","Volumetric (bandwidth floods), protocol (SYN floods etc.), and application-layer (HTTP floods on expensive endpoints)."],["Why must the origin IP stay hidden?","If attackers know it, they can bypass the protective edge network and hit servers directly."],["Why isn’t autoscaling a full DDoS defence?","Attack traffic can exceed what you can scale to, and scaling multiplies cost; filtering at the edge is needed."]]},{"n":54,"c":"net","t":"WebSockets","s":"A c
