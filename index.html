 can mean hijacking.","Domain and certificate expiry dates."],"k":["You must move a site to a new IP tomorrow. The A record TTL is 24 hours. What should you do today?",["Nothing; change it tomorrow","Lower the TTL now so caches expire quickly when you change the IP","Delete the record","Increase the TTL"],1,"Resolvers cache for the old TTL. Lowering it well before the change shortens how long old answers linger."],"sl":"dns"},{"n":61,"c":"ops","t":"Docker","s":"Packs your app and everything it needs into a container image that runs the same on any machine.","w":"A Dockerfile lists steps: base OS image, install dependencies, copy code, set the start command. docker build creates an image (a stack of read-only layers). docker run starts a container: an isolated process using that image. Containers share the host kernel, so they’re far lighter than virtual machines.","y":"“It works on my machine” happens because of different OS versions, libraries and settings. A container image freezes all of that, so dev, CI and production run the identical thing.","h":["Use small official base images (alpine, slim, distroless).","Order Dockerfile steps for caching: copy dependency files and install them BEFORE copying source code.","Use multi-stage builds: build in a big image, copy only the output into a tiny runtime image.","Run as a non-root user.","Pin versions (node:22.11-slim, not node:latest).","Never bake secrets into images; pass them at runtime.","Add a .dockerignore (node_modules, .git, .env).","Store data in volumes or external databases; container filesystems disappear with the container.","Scan images for vulnerabilities (Trivy, Docker Scout)."],"code":"FROM node:22-slim AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-slim\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD [\"node\", \"dist/server.js\"]","e":"A team’s image dropped from 1.2 GB to 140 MB with a multi-stage build, cutting deploy time from 4 minutes to 40 seconds.","p":["Using :latest and getting surprise upgrades","Copying all code before npm install, killing the cache","Saving uploaded files inside the container","Secrets in image layers (they’re readable even if deleted later)"],"v":["Kubernetes","Docker builds and runs containers. Kubernetes runs and manages LOTS of containers across many machines."],"f":["Dockerfile","docker build → image","Push to registry","docker run anywhere"],"q":[["Image vs container?","An image is the read-only template; a container is a running instance of that image."],["Why order COPY package.json before COPY . ?","So the dependency install layer is cached and only rebuilt when dependencies change, not on every code change."],["What is a multi-stage build?","A Dockerfile with several FROM stages where the final image copies only needed artifacts from build stages, keeping it small and secure."],["Why run containers as non-root?","If the app is compromised, the attacker has fewer privileges inside the container and a harder time escaping to the host."],["Where should persistent data live?","In volumes or external services (databases, object storage), because a container’s filesystem disappears when it’s replaced."]],"r":[62,66,76,19],"num":"Image 1.2 GB → multi-stage 140 MB.\nDeploy to 50 nodes pulling over 1 Gbps: 1.2 GB × 50 = 60 GB vs 7 GB transferred.\nLayer caching: changing only code rebuilds the last layer (seconds) instead of reinstalling dependencies (minutes).","m":["Image size and build time: regressions slow every deploy.","Vulnerabilities found by image scanning.","Container restarts and OOM kills."],"k":["Why copy package.json and run npm ci BEFORE copying the rest of the source code in a Dockerfile?",["It’s required by Docker","So the dependency layer is cached and only rebuilds when dependencies change","It makes the image smaller","It runs faster at runtime"],1,"Each instruction is a cached layer. Code changes invalidate only the layers after COPY . ."],"sl":"docker"},{"n":62,"c":"ops","t":"Kubernetes","s":"A system that runs your containers across many machines and keeps them in the state you asked for: running, healthy and scaled.","w":"You declare the desired state in YAML: “run 3 copies of this image with 512 MB memory each”. Kubernetes (K8s) keeps comparing reality to that and fixes differences: restarts crashed containers, reschedules them if a machine dies, rolls out new versions. Key objects: Pod (one or more containers), Deployment (manages replicas and rollouts), Service (stable network address), Ingress (HTTP routing from outside), ConfigMap/Secret (config), HPA (autoscaling).","y":"Managing dozens of containers on many servers by hand (placement, restarts, networking, rollouts) is error-prone. K8s automates it, at the cost of a lot of complexity.","h":["Use a managed cluster (EKS, GKE, AKS) instead of running the control plane yourself.","Set resource requests (what the pod needs for scheduling) and limits (the maximum).","Configure readiness and liveness probes.","Run at least 2–3 replicas and a PodDisruptionBudget for anything important.","Use Deployments with rolling updates; keep containers stateless.","Keep secrets in Secrets backed by a real secrets manager.","Use namespaces, RBAC and network policies to separate teams/apps.","Ask if you need it at all: for a small app, a PaaS (Render, Railway, Cloud Run, App Runner) is far simpler."],"code":"apiVersion: apps/v1\nkind: Deployment\nmetadata: { name: api }\nspec:\n  replicas: 3\n  template:\n    spec:\n      containers:\n      - name: api\n        image: shop/api:1.4.2\n        resources:\n          requests: { cpu: 250m, memory: 256Mi }\n          limits:   { memory: 512Mi }","e":"When a node dies at 3 a.m., Kubernetes notices the pods are gone and starts replacements on healthy nodes within a minute, without anyone being paged.","p":["No resource requests, so pods get packed onto nodes and starve each other","Using K8s for a tiny app and drowning in YAML","Memory limit too low, causing constant OOM kills"],"v":["Docker","Docker = building and running a container. Kubernetes = orchestrating many containers across a cluster. K8s runs images built by Docker (or other tools)."],"f":["You declare: 3 replicas","Scheduler places pods","!One node dies","K8s recreates pods elsewhere"],"q":[["Requests vs limits?","Requests reserve resources for scheduling; limits cap what a container may use (exceeding the memory limit gets it OOM-killed)."],["What does a Service do?","Gives a stable name/IP and load balances across the changing set of pods behind it."],["What does “desired state” mean in Kubernetes?","You declare what should exist, and controllers continuously reconcile actual state to match it."],["Deployment vs StatefulSet?","Deployments manage interchangeable stateless pods; StatefulSets give pods stable names and their own persistent volumes, for databases and similar."],["When is Kubernetes overkill?","For a small app or team where a PaaS or a few VMs would do; Kubernetes adds significant operational complexity."]],"r":[61,63,75,81],"num":"Node: 4 vCPU, 16 GB. Pod requests 500m CPU, 1 GiB.\nMax pods by CPU = 4 ÷ 0.5 = 8; by memory ≈ 14 → CPU limits you to ~8 pods (minus system reservations).","m":["Pod restarts and OOMKilled events.","CPU/memory usage vs requests: helps right-size requests.","Pending pods: not enough capacity or impossible scheduling constraints."],"k":["A pod keeps getting OOMKilled. What does that mean?",["It used more CPU than its limit","It exceeded its memory limit and the kernel killed it","Its liveness probe failed","The node rebooted"],1,"Exceeding a memory limit kills the container. Fix leaks or raise the limit based on real usage."],"sl":"kubernetes"},{"n":63,"c":"ops","t":"Helm Charts","s":"Reusable, configurable packages of Kubernetes YAML, like an app store package for your cluster.","w":"A chart is a folder of YAML templates plus a values.yaml file with settings. helm install renders the templates with your values and applies them. You can install the same chart for dev, staging and prod just by changing values (replicas, image tag, domain). Helm tracks releases, so helm rollback returns to the previous version.","y":"One app in K8s needs a Deployment, Service, Ingress, ConfigMap, HPA and more. Copy-pasting them per environment leads to drift and mistakes. Third-party software (Postgres, Prometheus, ingress controllers) is easiest to install as charts.","h":["Keep environment differences in values files: values-dev.yaml, values-prod.yaml.","Pin chart versions and image tags.","Run helm lint and helm template (or helm diff) in CI to see exactly what will change.","Don’t over-template: too much logic in templates makes charts unreadable.","Never put secrets in plain values files in Git; use sealed-secrets/external-secrets.","Pair with GitOps tools (Argo CD, Flux) for automatic, reviewed deployments."],"code":"helm install shop ./chart -f values-prod.yaml\nhelm upgrade shop ./chart --set image.tag=1.4.3\nhelm rollback shop 7\n# values-prod.yaml\nreplicaCount: 5\nimage: { repository: shop/api, tag: \"1.4.2\" }","e":"Installing a full monitoring stack (Prometheus, Grafana, Alertmanager) takes one command with the kube-prometheus-stack chart instead of writing hundreds of YAML files.","p":["Secrets committed in values.yaml","Unpinned chart versions changing under you","Huge templating logic nobody understands"],"v":["Terraform","Helm manages things INSIDE Kubernetes (apps). Terraform usually manages infrastructure AROUND it (clusters, databases, networks). Many teams use both."],"f":["Chart templates","+ values-prod.yaml","helm upgrade renders YAML","Release v8 applied (rollback ready)"],"q":[["What’s in a Helm chart?","Templates for Kubernetes manifests, a default values.yaml, and Chart.yaml metadata."],["How do you deploy one chart to several environments?","Use different values files per environment with the same templates."],["How do you preview a Helm change?","helm template or the helm diff plugin to see rendered manifests before applying."],["How do you roll back a bad Helm release?","helm rollback <release> <revision> re-applies a previous revision’s manifests."],["Why shouldn’t secrets go in values files in Git?","Anyone with repo access can read them and they live in history forever; use sealed/external secrets."]],"r":[62,67,68,65],"k":["What’s the main purpose of separate values files like values-prod.yaml?",["To store secrets","To reuse the same chart templates with environment-specific settings","To speed up Helm","To replace Kubernetes"],1,"Templates stay the same; values change per environment (replicas, image tags, domains)."],"sl":"helm-charts"},{"n":64,"c":"ops","t":"Service Discovery","s":"How services find each other’s current addresses automatically, even as instances come and go.","w":"In the cloud, instances are created and destroyed all the time; IPs change. Service discovery keeps a live registry of “which healthy instances exist for service X”. Two styles: client-side (the caller asks the registry, e.g. Consul/Eureka, and picks an instance) and server-side (the caller hits a stable name, and a load balancer or DNS routes it, e.g. Kubernetes Services).","y":"Hardcoding IPs breaks the moment you scale or redeploy. You’d be editing config files every time a server restarts.","h":["In Kubernetes, use Services: call http://orders.default.svc.cluster.local and K8s routes to healthy pods.","Outside K8s, use Consul, Eureka or cloud service registries (AWS Cloud Map).","Register instances only once they’re ready, and remove them on shutdown.","Use health checks so unhealthy instances drop out of the registry.","Watch DNS caching: clients caching old IPs too long call dead instances.","Combine with retries and timeouts for when you hit an instance just as it dies."],"e":"When the payments service scales from 3 to 10 pods, the checkout service keeps calling http://payments and Kubernetes spreads traffic across all 10 automatically.","p":["Hardcoded IPs in config","Registering instances before they’re ready","Long DNS caching in clients (e.g. old JVM default caching forever)"],"v":["Load Balancing","Discovery answers “WHERE are the instances?”. Load balancing answers “WHICH instance gets this request?”. They usually work together."],"f":["Pod starts, becomes ready","Registered in registry/Service","Caller asks for “payments”","Routed to a healthy instance"],"q":[["Client-side vs server-side discovery?","Client-side: the caller queries the registry and chooses an instance. Server-side: the caller hits a stable endpoint and a router/load balancer picks."],["How does Kubernetes do service discovery?","Through Services with stable DNS names and virtual IPs that route to the pods matching a label selector."],["Why do health checks matter for discovery?","They remove dead or unready instances from the registry so traffic isn’t sent to them."],["Why can aggressive client DNS caching break service discovery?","Clients keep calling old IPs of instances that no longer exist; keep DNS caching short."],["Why register instances only once they are ready?","Otherwise traffic arrives before the instance can serve it, causing errors."]],"r":[8,62,139,74],"k":["In Kubernetes, how does service A usually find service B?",["Hardcoded pod IPs","Through a Service’s stable DNS name that routes to healthy pods","By scanning the network","Through environment files edited by hand"],1,"Services provide stable names and virtual IPs while pods come and go behind them."],"sl":"service-discovery"},{"n":65,"c":"ops","t":"CI/CD","s":"Automatically testing every code change (CI) and automatically releasing it safely (CD).","w":"Continuous Integration: every push or pull request triggers a pipeline that builds the code and runs linting, tests and security checks, so problems are caught in minutes. Continuous Delivery: every change that passes is ready to release with one click. Continuous Deployment: it goes to production automatically. Tools: GitHub Actions, GitLab CI, Jenkins, CircleCI, Argo CD.","y":"Manual releases are slow, scary and inconsistent: someone forgets a step, deploys the wrong branch, or skips tests. Teams that release in small, automated steps ship faster AND break things less.","h":["Run fast checks first (lint, unit tests), slower ones later (integration, e2e).","Keep the pipeline under ~10 minutes; slow pipelines get skipped.","Build the artifact (e.g. Docker image) ONCE and promote the same artifact through staging to production.","Run DB migrations as a controlled pipeline step.","Use safe rollout strategies (rolling, canary, blue-green) and automatic rollback on bad health metrics.","Protect the main branch: required reviews and green checks.","Add security scanning: dependencies, secrets, containers.","Use short-lived cloud credentials (OIDC) for pipelines instead of stored keys."],"code":"# .github/workflows/ci.yml\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm run lint && npm test\n  deploy:\n    needs: test\n    if: github.ref == 'refs/heads/main'\n    steps: [ ... build image, deploy canary ... ]","e":"Companies like Etsy and Amazon deploy to production many times a day; each change is small, so if something breaks, it’s obvious which change did it.","p":["Rebuilding separately per environment, so prod runs something staging never tested","Flaky tests everyone ignores","Long-lived feature branches that merge in giant risky chunks"],"v":["Blue-Green Deployment","CI/CD is the AUTOMATION pipeline. Blue-green is one RELEASE STRATEGY that the pipeline can use."],"f":["git push","Build + test + scan","Deploy to staging","Promote same image to prod"],"q":[["Continuous delivery vs continuous deployment?","Delivery: every passing change is releasable, with a manual approval to ship. Deployment: every passing change ships automatically."],["Why build an artifact once and promote it?","So production runs exactly what was tested, not a rebuild that could differ."],["What makes a pipeline trustworthy?","Fast, reliable (no flaky tests), comprehensive checks, reproducible builds and automatic rollback."],["What are the four DORA metrics?","Deployment frequency, lead time for changes, change failure rate, and time to restore service."],["How do you handle flaky tests?","Track them, quarantine or fix quickly, and never let 'just rerun it' become normal, because people stop trusting the pipeline."]],"r":[66,71,73,23],"num":"10 deploys/day × 30-minute manual release = 5 engineer-hours/day.\nPipeline at 8 minutes with automation: feedback 4× faster; failures caught before merge.","m":["Deployment frequency and lead time for changes.","Change failure rate: % of deploys causing incidents.","Mean time to restore after a bad deploy.","Pipeline duration and flaky-test rate."],"k":["Why build the Docker image once and promote the same image from staging to production?",["It saves registry space","Production then runs exactly what was tested, not a rebuild that could differ","Rebuilding is not allowed","It makes tests faster"],1,"Rebuilds can pull different dependency versions or settings. Promoting the same artifact guarantees what you tested is what ships."],"sl":"ci-cd"},{"n":66,"c":"ops","t":"Build Caching","s":"Reusing results of build steps that haven’t changed, so builds take seconds instead of many minutes.","w":"Most builds redo the same work: download the same dependencies, recompile unchanged files, rebuild the same Docker layers. Build caching saves outputs keyed by their inputs (lockfile hash, source file hashes). If inputs are the same, reuse the output.","y":"Slow CI means slow feedback, developers waiting, and higher CI bills. Caching often cuts build times by 50–90%.","h":["Cache package downloads keyed by the lockfile hash (package-lock.json, poetry.lock, go.sum).","Order Docker layers so dependency install is cached and code changes only rebuild the last layers.","Use remote Docker layer cache in CI (BuildKit --cache-from/--cache-to, registry cache).","Use tools with content-addressed caches for monorepos (Turborepo, Nx, Bazel, Gradle remote cache).","Make builds deterministic: pinned versions, no timestamps baked in, so cache hits are reliable.","Never cache secrets or environment-specific outputs.","Have a way to bust the cache when it’s corrupted."],"code":"- uses: actions/cache@v4\n  with:\n    path: ~/.npm\n    key: npm-${{ hashFiles('package-lock.json') }}","e":"A monorepo with 40 packages took 25 minutes per CI run. With Turborepo’s remote cache, only changed packages rebuild and most PRs finish in 3 minutes.","p":["Cache keys that don’t include all inputs, giving stale wrong builds","Caching node_modules across OS/Node versions","Never measuring cache hit rate"],"v":["Application Caching","Build caching speeds up making your SOFTWARE (CI). Application caching speeds up serving your USERS (runtime). Same idea, totally different place."],"f":["Compute hash of inputs","Cache hit?","Yes: restore output","No: build + save to cache"],"q":[["What should a dependency cache key be based on?","The hash of the lockfile (plus OS/runtime version), so it changes exactly when dependencies change."],["Why does Dockerfile order affect caching?","Each instruction is a layer; if an early layer changes, all later layers rebuild. Put rarely-changing steps first."],["What is remote caching?","A shared cache of build outputs that all developers and CI machines can reuse."],["What is a remote build cache?","A shared store of build outputs keyed by input hashes that CI machines and developers reuse to skip unchanged work."],["Why do deterministic builds matter for caching?","If the same inputs always produce the same outputs, cache hits are safe and frequent."]],"r":[65,61,76,78],"k":["A CI cache key is based on the branch name only. What can go wrong?",["Nothing","Dependency changes may restore an outdated cache and produce wrong or broken builds","Caches will never hit","CI will be slower"],1,"Keys should be derived from inputs like the lockfile hash, so changes in dependencies produce a new cache."],"sl":"build-caching"},{"n":67,"c":"ops","t":"Infrastructure as Code","s":"Describing your servers, networks and databases in code files, so infrastructure is created, reviewed and changed like software.","w":"Instead of clicking around a cloud console, you write files that say “a VPC with these subnets, a Postgres database of this size, a bucket with these rules”. A tool reads the files and makes reality match. Declarative tools (Terraform, OpenTofu, CloudFormation, Pulumi) describe the end state; the tool figures out the steps.","y":"Click-ops can’t be reviewed, repeated or audited. Nobody remembers why a firewall rule exists. Recreating an environment after a disaster takes weeks. With IaC, staging and prod can be identical, and changes go through pull requests.","h":["Keep IaC in Git and change it only through pull requests with review.","Show the plan (what will change) in the PR before applying.","Split into modules (network, database, app) and environments.","Store state remotely with locking (for Terraform).","Never hardcode secrets; reference a secrets manager.","Block manual console changes in production, or detect drift regularly.","Use policy checks (OPA/Conftest, Checkov, tfsec) for security rules like “no public buckets”."],"e":"After an accidental account deletion, a team with full IaC rebuilt their entire AWS environment in an afternoon by running their pipeline against a new account.","p":["Mixing manual changes with IaC, causing drift","Huge single files nobody understands","Applying without reading the plan"],"v":["Terraform","IaC is the PRACTICE. Terraform is one popular TOOL that implements it; others are Pulumi, CloudFormation and CDK."],"f":["Write infra code","Pull request + plan","Review + approve","Apply → cloud matches code"],"q":[["Declarative vs imperative IaC?","Declarative describes the desired end state and the tool computes changes; imperative scripts list the steps to perform."],["What is drift?","When real infrastructure differs from the code because of manual changes or external modifications."],["Why review the plan before applying?","To catch unexpected destroys or replacements of critical resources before they happen."],["Why should infrastructure changes go through pull requests?","Changes are reviewed, recorded with reasons, testable via plans, and reversible like code."],["What are policy-as-code checks?","Automated rules (e.g. no public buckets, encryption required) evaluated against IaC before apply, using tools like OPA or Checkov."]],"r":[68,63,65,48],"k":["What is configuration drift?",["Servers moving to another region","Real infrastructure differing from the code because of manual changes","Slow Terraform runs","Version mismatch in libraries"],1,"Manual console changes make reality diverge from the code, so the code no longer describes what’s running."],"sl":"infrastructure-as-code"},{"n":68,"c":"ops","t":"Terraform","s":"A popular IaC tool: you describe cloud resources in HCL files, it shows a plan of changes and then applies them.","w":"Terraform uses providers (AWS, GCP, Azure, Cloudflare, GitHub…) to talk to APIs. It keeps a state file that maps your code to real resource IDs. Workflow: terraform init → terraform plan (preview) → terraform apply. OpenTofu is the open-source fork with the same workflow.","y":"It gives one consistent language for many providers, a reviewable plan before anything changes, and repeatable environments.","h":["Store state remotely (S3 + DynamoDB lock, GCS, Terraform Cloud) with locking so two people can’t apply at once.","State can contain secrets: encrypt it and restrict access.","Always run plan and read it, especially lines saying “destroy” or “must be replaced”.","Use modules for repeated patterns, and pin provider/module versions.","Separate state per environment and per component to limit blast radius.","Add lifecycle { prevent_destroy = true } on critical resources like production databases.","Use terraform import or import blocks to adopt existing resources.","Run plan in CI on every PR."],"code":"resource \"aws_db_instance\" \"main\" {\n  engine         = \"postgres\"\n  instance_class = \"db.t4g.medium\"\n  allocated_storage = 50\n  lifecycle { prevent_destroy = true }\n}\n# terraform plan  → shows +/~/- changes\n# terraform apply → executes them","e":"A rename of a resource block made Terraform plan to destroy and recreate a production database. The plan review caught it; a moved block fixed it without data loss.","p":["Local state files on laptops","Not reading the plan","Editing state by hand","One giant state for everything, so every apply risks everything"],"v":["Kubernetes","Terraform creates and changes infrastructure (clusters, DBs, networks). Kubernetes runs your app containers continuously on that infrastructure."],"f":[".tf code","terraform plan","Review +/~/- changes","terraform apply (state updated)"],"q":[["What is Terraform state used for?","Mapping code resources to real-world IDs and attributes, so Terraform can compute what needs to change."],["Why use remote state with locking?","To share state across a team and prevent concurrent applies from corrupting it."],["How do you protect a production database from accidental deletion?","lifecycle prevent_destroy, careful plan review, and deletion protection on the resource itself."],["What happens if two people run terraform apply at the same time without state locking?","They can overwrite each other’s state changes, corrupting state and causing resources to be duplicated or orphaned."],["How do you bring an existing resource under Terraform?","Use terraform import or import blocks, then write matching configuration and confirm the plan shows no changes."]],"r":[67,63,62,97],"k":["A terraform plan shows '-/+ must be replaced' for your production database. What should you do?",["Apply it quickly","Stop and investigate: replacement means destroy and recreate, which can lose data","Run plan again","Delete the state file"],1,"Replacement destroys the existing resource. Find which attribute forces it, and use moved blocks, ignore_changes or prevent_destroy as appropriate."],"sl":"terraform"},{"n":69,"c":"ops","t":"Feature Flags","s":"On/off switches in your code, controlled from outside, so you can release features to some users without redeploying.","w":"Code ships with both paths: if flags.enabled(“new_checkout”, user): newFlow() else: oldFlow(). A flag service (LaunchDarkly, Unleash, Flagsmith, ConfigCat or a DB table) decides per user, percentage, region or plan. Deploying code and releasing features become separate decisions.","y":"Without flags, a feature is all-or-nothing at deploy time. If it’s broken, you must roll back the whole deploy. Flags allow gradual rollouts, instant kill switches, beta programs and A/B tests.","h":["Types: release flags (temporary), ops/kill switches (long-lived), experiment flags, permission flags.","Roll out gradually: internal staff → 1% → 10% → 50% → 100%, watching metrics at each step.","Make percentage rollouts sticky (hash the user ID) so a user doesn’t flip between versions.","Default to the safe path if the flag service is unreachable.","Remove release flags after full rollout; add an owner and expiry date to each flag.","Restrict and audit who can change production flags.","Test both paths."],"code":"if flags.is_enabled(\"new_checkout\", user_id=user.id):\n    return new_checkout(cart)\nreturn old_checkout(cart)\n# rollout: 5% of users, hashed by user_id → stable","e":"Facebook launches features to employees first, then to a small percentage of a country, then everyone, all controlled by its internal Gatekeeper flag system.","p":["Hundreds of stale flags making code unreadable (“flag debt”)","Flags that depend on other flags in confusing ways","Exposing flag rules client-side that reveal unreleased features"],"v":["Canary Release","Feature flags select USERS for a feature inside the same deployed code. Canary sends a slice of TRAFFIC to a new deployed VERSION."],"f":["Deploy code with flag off","Enable for staff","Ramp 1% → 50% → 100%","!Problem? Flip off instantly"],"q":[["What’s the benefit of separating deploy from release?","You can ship code safely dark and choose when and for whom it goes live, with an instant off switch."],["How do you keep a percentage rollout consistent per user?","Hash a stable user ID into buckets so the same user always gets the same result."],["What is flag debt?","Old flags left in code after rollout, adding branches, confusion and risk; they should be cleaned up."],["What should happen if the flag service is unreachable?","Evaluate to a safe default (usually the old behaviour) using cached rules, not fail requests."],["Why remove release flags after rollout?","Every flag doubles code paths; stale flags add complexity, bugs and confusion."]],"r":[71,70,73,65],"m":["Error and conversion metrics split by flag variation: the evidence for ramping up or rolling back.","Flag count and age: stale flags to clean up.","Flag evaluation errors / fallbacks to default."],"k":["Why hash the user ID to decide a 10% rollout instead of picking randomly per request?",["Hashing is faster","Each user consistently gets the same variation instead of flipping between versions","Random numbers are insecure","It reduces memory"],1,"Sticky bucketing keeps a user’s experience consistent and makes metrics meaningful."],"sl":"feature-flags"},{"n":70,"c":"ops","t":"Blue-Green Deployment","s":"Run the new version (green) next to the old one (blue), test it, then switch all traffic over in one move.","w":"Blue is live. You deploy the new version to an identical green environment, run smoke tests against it, then flip the router/load balancer to green. Blue stays running untouched; if anything goes wrong, flip back in seconds.","y":"Updating servers in place means downtime or a messy partial state, and rollbacks require redeploying. Blue-green gives near-instant cutover and near-instant rollback.","h":["Automate creating green identical to blue (IaC, same config).","Run smoke and health tests on green before switching.","Switch with the load balancer or DNS (LB is faster; DNS has caching delays).","Keep blue alive for a while after switch for fast rollback.","Databases are the hard part: both versions share the DB, so migrations must be backward compatible (expand/contract).","Drain in-flight requests and handle long-lived connections during the switch."],"e":"AWS Elastic Beanstalk and CodeDeploy support blue-green natively: they spin up a new environment, swap URLs, and keep the old one ready for a quick swap back.","p":["A DB migration that breaks blue, so you can’t actually roll back","Doubling infrastructure cost permanently","DNS-based switch taking hours due to TTLs"],"v":["Rolling Deployment","Blue-green swaps ALL traffic at once between two full environments (needs double capacity). Rolling replaces instances a few at a time within one environment."],"f":["Blue live, green deployed","Test green","Switch router → green","!Issue? Switch back to blue"],"q":[["What’s the biggest challenge with blue-green?","The shared database: schema changes must work with both versions, or rollback breaks."],["Why switch at the load balancer rather than DNS?","LB changes are instant; DNS changes are delayed by caching TTLs."],["What’s the cost of blue-green?","Running two full environments during the deployment window."],["What is the hardest part of blue-green deployments?","The shared database: schema changes must work with both versions so you can switch back safely."],["Why is a load-balancer switch preferred over a DNS switch?","Load balancer changes take effect immediately; DNS changes are delayed by cached TTLs."]],"r":[72,71,73,23],"k":["In blue-green deployment, what makes rollback nearly instant?",["Backups","The old (blue) environment is still running, so traffic can be switched back","Feature flags","Smaller images"],1,"Because blue stays untouched until you’re confident, switching the router back restores the old version immediately."],"sl":"blue-green-deployment"},{"n":71,"c":"ops","t":"Canary Releases","s":"Send a small slice of real traffic (like 1–5%) to the new version first, watch it, and expand only if it looks healthy.","w":"Named after canaries in coal mines that warned miners early. The new version gets a small percentage of traffic. You compare its error rate and latency against the old version. If it’s fine, increase to 25%, 50%, 100%. If not, send all traffic back to the old version; only a few users were affected.","y":"Tests never catch everything; real users and real data find bugs. A canary limits how many users see a bad release.","h":["Define success metrics before starting: error rate, p99 latency, key business metrics like checkout conversion.","Compare canary vs baseline at the same time, not against yesterday.","Ramp in steps with waiting periods.","Automate analysis and rollback (Argo Rollouts, Flagger, Spinnaker).","Make sure the canary gets enough traffic to be statistically meaningful.","Watch for issues that only show at full load or after time (memory leaks)."],"code":"# Argo Rollouts\nstrategy:\n  canary:\n    steps:\n    - setWeight: 5\n    - pause: {duration: 10m}\n    - setWeight: 25\n    - pause: {duration: 10m}\n    - setWeight: 100","e":"Google rolls out changes to services and Android gradually; a bad config pushed to a small canary set is caught before reaching everyone.","p":["Too little traffic to notice anything","No predefined rollback criteria, so people argue during an incident","Sticky issues: users bouncing between versions with incompatible data"],"v":["Feature Flags","Canary = traffic % to a new deployed VERSION. Feature flags = turn FEATURES on for chosen users within the same version."],"f":["5% → new version","Compare errors/latency","Healthy: 25% → 100%","!Bad: route back to old"],"q":[["What metrics decide if a canary is healthy?","Error rate, latency (p95/p99), saturation and key business metrics, compared against the baseline version."],["Why compare against a simultaneous baseline?","Traffic patterns change over time; comparing at the same moment isolates the effect of the new version."],["How is canary different from blue-green?","Canary shifts traffic gradually while measuring; blue-green switches everything at once."],["What should be decided before starting a canary?","The metrics and thresholds for success or rollback, step sizes and wait times, so decisions are objective during the rollout."],["What kinds of problems can canaries miss?","Issues that appear only at full load, after long uptime (memory leaks), or for rare user segments the canary didn’t include."]],"r":[69,72,107,104],"num":"Canary at 5% of 2,000 req/s = 100 req/s.\nTo detect an error rate rising from 0.1% to 0.5%: expect 0.1 vs 0.5 errors/s → need several minutes of data for confidence.\nToo little traffic (1% at 50 req/s = 0.5 req/s) may hide real problems.","k":["Why compare the canary against a baseline running at the same time rather than against yesterday?",["It’s cheaper","Traffic and conditions change over time; a simultaneous baseline isolates the effect of the new version","Yesterday’s data is deleted","It avoids alerts"],1,"Time-of-day patterns and other changes would confuse a comparison to the past."],"sl":"canary-releases"},{"n":72,"c":"ops","t":"Rolling Deployments","s":"Update your servers a few at a time, so the service keeps running throughout the release.","w":"With 10 instances, take down 2, start 2 with the new version, wait until they’re healthy, then continue. Kubernetes Deployments do this by default with settings like maxUnavailable and maxSurge. During the rollout, old and new versions both serve traffic.","y":"Restarting everything at once causes downtime. Blue-green needs double capacity. Rolling updates are the cheap, default middle ground.","h":["Configure maxSurge (extra pods allowed during rollout) and maxUnavailable (how many can be down).","Use readiness probes so traffic only goes to new pods once they’re actually ready.","Handle shutdown gracefully: stop accepting new requests, finish in-flight ones (SIGTERM handling + preStop delay).","Make old and new versions compatible: API and DB changes must work with both at the same time.","Watch metrics during rollout and pause/undo on errors (kubectl rollout undo)."],"code":"strategy:\n  type: RollingUpdate\n  rollingUpdate:\n    maxSurge: 25%\n    maxUnavailable: 0   # never drop below full capacity","e":"A Kubernetes deploy of 20 pods with maxUnavailable: 0 and maxSurge: 5 replaces pods 5 at a time; users see no downtime.","p":["No readiness probe, so traffic hits pods still starting up","Ignoring SIGTERM and dropping in-flight requests","Breaking changes that old pods can’t handle mid-rollout"],"v":["Canary Release","Rolling replaces instances progressively to FINISH the deploy. Canary deliberately pauses at a small slice to MEASURE before deciding."],"f":["10 pods on v1","Replace 2 → v2 (ready?)","Repeat batch by batch","10 pods on v2, zero downtime"],"q":[["What do maxSurge and maxUnavailable control?","maxSurge: how many extra pods can exist above desired count; maxUnavailable: how many can be unavailable during the rollout."],["Why is backward compatibility critical for rolling deploys?","Old and new versions run simultaneously and share databases and APIs."],["What is graceful shutdown?","On termination, stop taking new requests, finish current ones, then exit, avoiding dropped requests."],["What does maxUnavailable: 0 guarantee?","Capacity never drops below the desired replica count during the rollout; new pods must be ready before old ones are removed."],["Why must old and new versions be compatible during a rolling deploy?","Both run at the same time and share databases and APIs, so breaking changes would fail requests on one side."]],"r":[70,71,75,73],"k":["During a rolling deploy, users get errors from pods that just started. What’s missing?",["More replicas","A readiness probe, so traffic only reaches pods once they’re ready","A liveness probe","A bigger node"],1,"Without readiness checks, the Service routes traffic to pods that are still starting up."],"sl":"rolling-deployments"},{"n":73,"c":"ops","t":"Rollbacks","s":"Going back to the last known-good version quickly when a release causes problems.","w":"A rollback redeploys the previous artifact (image, build) or configuration. The goal is to stop user pain FIRST, and investigate the root cause after. Rollback can be manual (kubectl rollout undo, helm rollback) or automatic when health metrics break.","y":"During an incident every minute counts. Teams without a fast, practiced rollback end up trying to write fixes under pressure, which often makes things worse.","h":["Keep previous artifacts and tag them immutably (never overwrite tags).","Make rollback one command or one button, and practice it.","Automate rollback triggers based on error rate/latency during deploys.","Make DB migrations backward compatible so old code still works after a rollback.","Config and feature flags count too: roll those back like code.","Decide rollback vs roll-forward: roll back by default; roll forward only when the fix is tiny and certain, or data changes make rollback unsafe."],"code":"kubectl rollout undo deployment/api\nhelm rollback shop 41\n# or redeploy the previous immutable image tag\nimage: shop/api:1.4.1","e":"A config change pushed globally broke Cloudflare’s proxy in 2019; reverting the change (a rollback of config, not code) restored service across their network.","p":["A migration that dropped a column, so old code can’t run anymore","Mutable “latest” tags, so “previous version” is unknown","Never testing the rollback path"],"v":["Database Migrations","Code rollbacks are easy. Data/schema changes often aren’t reversible, which is why migrations must stay compatible with the previous code version."],"f":["v2 deployed","!Errors spike","Roll back to v1 artifact","Users ok → investigate v2"],"q":[["Rollback or roll forward?","Rollback by default to restore service quickly; roll forward when rollback is impossible (irreversible data changes) or the fix is trivial and well understood."],["Why use immutable artifact tags?","So you can always redeploy exactly the previous version."],["What makes a rollback unsafe?","Irreversible schema/data changes, or other services already depending on the new behaviour."],["Why use immutable image tags for releases?","So 'the previous version' always refers to the exact same artifact and can be redeployed reliably."],["Should configuration changes have rollbacks too?","Yes; config and feature flag changes cause many incidents and need versioning and quick revert like code."]],"r":[70,23,69,109],"k":["When is rolling forward (shipping a fix) better than rolling back?",["Always","When rollback is unsafe, such as after an irreversible data migration, or the fix is tiny and certain","Never","Only on weekends"],1,"Rollback is the default to restore service fast, but irreversible changes can make the old version unable to run."],"sl":"rollbacks"},{"n":74,"c":"ops","t":"Health Checks","s":"Simple endpoints or commands that answer “is this instance OK?” so load balancers and orchestrators can react.","w":"An instance exposes something like GET /health that returns 200 when it’s fine and 503 when it’s not. Load balancers call it every few seconds and stop sending traffic to instances that fail several checks in a row. Monitoring systems use similar checks from outside (uptime checks).","y":"Without health checks, a crashed or frozen instance keeps receiving traffic, and a share of users get errors until a human notices.","h":["Keep it cheap and fast; it runs constantly.","Return 200 only when the instance can genuinely serve requests.","Separate shallow checks (process alive) from deep checks (can reach DB/cache).","Be careful with deep checks: if the shared DB has a blip, ALL instances fail health checks and get removed at once, turning a small problem into a total outage.","Use thresholds (e.g. 3 failures in a row) to avoid flapping.","Don’t expose sensitive details publicly in health responses.","Also run external synthetic checks from multiple regions."],"code":"@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\"}, 200\n\n@app.get(\"/ready\")\ndef ready():\n    ok = db.ping(timeout=0.3)\n    return ({\"db\": ok}, 200 if ok else 503)","e":"An app returned 200 from /health even when its DB connection pool was exhausted, so the load balancer kept sending traffic to useless instances. Adding a readiness check on pool availability fixed it.","p":["Health check that always returns 200","Deep checks causing all instances to fail together","Expensive checks adding real load"],"v":["Liveness & Readiness Probes","A health check is the general idea. Kubernetes splits it into liveness (restart me?) and readiness (send me traffic?), which have different consequences."],"f":["LB calls /health every 5 s","!3 failures in a row","Instance removed from pool","Recovers → added back"],"q":[["Shallow vs deep health check?","Shallow checks the process responds; deep checks dependencies like DB. Deep checks are more accurate but risk mass removal during shared dependency blips."],["Why use failure thresholds?","To avoid flapping instances in and out of rotation due to single slow or failed checks."],["What should a health endpoint never do?","Be slow or expensive, or leak sensitive internal information."],["What should a health endpoint return when the instance is shutting down?","Fail readiness (503) so traffic drains before the process exits."],["Why use multiple consecutive failures before removing an instance?","One slow check shouldn’t cause flapping; thresholds avoid removing healthy instances on noise."]],"r":[75,8,64,101],"k":["Your health check queries the shared database. The DB has a 10-second blip. What can happen?",["Nothing","All instances fail health checks together and are removed, turning a short blip into a full outage","Only one instance is affected","The DB recovers faster"],1,"Deep checks on shared dependencies can fail everywhere at once. Keep health checks mostly about the instance itself."],"sl":"health-checks"},{"n":75,"c":"ops","t":"Liveness & Readiness Probes","s":"Kubernetes asks two different questions: “Are you stuck? (restart you)” and “Can you take traffic right now? (route to you)”.","w":"Liveness probe failing → Kubernetes kills and restarts the container. Readiness probe failing → the pod stays running but is removed from the Service’s endpoints, so it gets no traffic. A third, the startup probe, gives slow-starting apps time before liveness kicks in.","y":"Mixing them up causes real outages. If liveness checks the database and the DB is slow, Kubernetes restarts ALL your pods at once (a restart storm), even though restarting doesn’t fix the DB.","h":["Liveness: very simple, only “is my process alive and not deadlocked?”. Never check external dependencies.","Readiness: “am I able to serve?”. Warmed up, connected to essentials, not overloaded.","Startup probe for apps that take long to boot (JVMs, model loading).","Tune timeoutSeconds, periodSeconds and failureThreshold to avoid false failures.","Mark not-ready during graceful shutdown so traffic drains before the pod exits."],"code":"livenessProbe:\n  httpGet: { path: /livez, port: 8080 }\n  periodSeconds: 10\n  failureThreshold: 3\nreadinessProbe:\n  httpGet: { path: /readyz, port: 8080 }\n  periodSeconds: 5\nstartupProbe:\n  httpGet: { path: /livez, port: 8080 }\n  failureThreshold: 30   # up to 5 min to start","e":"A team pointed their liveness probe at an endpoint that queried Postgres. A 30-second DB failover made every pod fail liveness, and Kubernetes restarted 200 pods at once, causing a much longer outage than the failover itself.","p":["Dependency checks in liveness","No startup probe, so slow apps get killed during boot forever","Same endpoint for liveness and readiness"],"v":["Health Checks","Generic health checks just say healthy/unhealthy. Liveness and readiness split that into two actions: restart vs remove from traffic."],"f":["Liveness fail → restart","Readiness fail → no traffic","Startup probe → wait for boot","Pod serves when ready"],"q":[["What happens when a readiness probe fails?","The pod is removed from Service endpoints and receives no traffic, but isn’t restarted."],["Why shouldn’t liveness probes check the database?","A DB problem would restart all pods, which doesn’t fix the DB and adds load and downtime."],["What is a startup probe for?","Giving slow-starting containers time to boot before liveness checks can kill them."],["What happens when readiness fails but liveness passes?","The pod keeps running but receives no traffic until it’s ready again."],["Why should liveness never depend on external services?","A dependency outage would restart all pods, which doesn’t fix the dependency and adds load and downtime."]],"r":[74,72,62,87],"k":["A slow-starting Java app keeps getting restarted before it finishes booting. What fixes it?",["A readiness probe","A startup probe that gives it time before liveness checks begin","A higher replica count","Removing all probes"],1,"Startup probes suspend liveness checks until the app has started, preventing restart loops."],"sl":"liveness-and-readiness-probes"},{"n":76,"c":"ops","t":"Dependency Hell","s":"When the libraries your project uses need conflicting versions of other libraries, and nothing installs or works cleanly.","w":"Your app needs library A and B. A needs C version 1.x, B needs C version 2.x. Some ecosystems can’t load both, so the install fails or picks one and something breaks at runtime. It also covers transitive dependencies (dependencies of dependencies) silently changing and breaking your build.","y":"It wastes days, blocks security upgrades and causes “it worked yesterday” builds. Unmanaged dependencies are also a big security risk (supply chain attacks, known vulnerabilities).","h":["Commit a lockfile (package-lock.json, poetry.lock, go.sum, Cargo.lock) so every install is identical.","Use isolated environments (venv, containers) per project.","Update regularly in small steps with bots like Dependabot or Renovate, not once every two years.","Read changelogs on major version bumps (SemVer major = breaking).","Keep dependency count low; avoid tiny packages you could write in 5 lines.","Use overrides/resolutions to force one compatible version when needed.","Scan for known vulnerabilities (npm audit, pip-audit, Snyk, OSV).","Remove unused dependencies."],"e":"In 2016 the “left-pad” package (11 lines of code) was unpublished from npm and broke thousands of builds worldwide, including big projects that depended on it transitively.","p":["No lockfile in Git","Huge “upgrade everything” PRs every two years","Pinning to ancient versions forever and missing security fixes"],"v":["Semantic Versioning","Dependency hell is the PROBLEM. SemVer is a COMMUNICATION convention that helps tools choose compatible versions, if maintainers follow it."],"f":["App needs A and B","A → C 1.x, B → C 2.x","!Conflict","Fix: upgrade/override + lockfile"],"q":[["What does a lockfile do?","Records exact versions of every direct and transitive dependency so installs are reproducible."],["Why update dependencies frequently?","Small updates are easy to test and fix; rare huge upgrades are painful and leave known vulnerabilities in place."],["What is a transitive dependency?","A dependency of one of your dependencies, which you didn’t install directly."],["Why commit the lockfile?","It pins exact versions of all direct and transitive dependencies, so every install and build is reproducible."],["How do bots like Renovate or Dependabot help?","They open small, regular update PRs with changelogs, keeping upgrades manageable instead of huge and risky."]],"r":[78,66,61,65],"k":["Two libraries need incompatible versions of the same dependency. What is the most sustainable fix?",["Delete the lockfile","Upgrade one library so both accept a compatible version (or override with care and test)","Copy the dependency source into your repo","Ignore the warning"],1,"Find a compatible combination by upgrading, and use overrides/resolutions only with testing."],"sl":"dependency-hell"},{"n":77,"c":"net","t":"API Versioning","s":"Changing your API without breaking apps that already use it, by managing versions and deprecations.","w":"Once clients (especially mobile apps you can’t force-update) rely on your API, changing a field name or meaning breaks them. Versioning lets old and new contracts live side by side: in the URL (/v1/orders), a header (Accept: application/vnd.shop.v2+json), or dated versions (Stripe-Version: 2024-06-20).","y":"Breaking changes without versioning crash old app versions in users' hands, and partner integrations fail overnight.","h":["Prefer non-breaking changes: add new fields and endpoints; don’t remove, rename or change types/meaning.","Clients must ignore unknown fields (tolerant reader).","Create a new version only for real breaking changes.","Pick one scheme and stick to it (URL versioning is simplest to see and route).","Announce deprecation with timelines, Deprecation/Sunset headers and docs.","Track which clients use old versions before turning them off.","Keep version translation at the edge so internal code doesn’t fork everywhere."],"code":"GET /v1/users/7  → { \"name\": \"Asha Rao\" }\nGET /v2/users/7  → { \"first_name\": \"Asha\", \"last_name\": \"Rao\" }\n\nDeprecation: true\nSunset: Wed, 31 Dec 2026 23:59:59 GMT","e":"Stripe pins each account to the API version that existed when it integrated. New changes go into new dated versions, and Stripe translates responses so old integrations keep working for years.","p":["Renaming a field “because it’s cleaner”","Versioning every tiny change, creating dozens of versions","Turning off old versions without knowing who still uses them"],"v":["Semantic Versioning","API versioning protects CLIENTS of a service contract. SemVer labels RELEASES of a library/package. A service can use v1/v2 without SemVer."],"f":["Old app calls /v1","New app calls /v2","Both served","v1 deprecated → sunset later"],"q":[["Name three breaking API changes.","Removing or renaming a field, changing a field’s type or meaning, and making an optional parameter required."],["What is the tolerant reader principle?","Clients should ignore fields they don’t understand so servers can add fields safely."],["URL vs header versioning?","URL is explicit and easy to route/cache; headers keep URLs clean but are less visible and harder to test casually."],["What is the Sunset header?","An HTTP header announcing the date when an endpoint or version will stop working, helping clients plan migration."],["Why version at the edge instead of throughout the codebase?","Translating old request/response shapes at the boundary keeps internal code on one model instead of forking everywhere."]],"r":[78,124,116,150],"m":["Requests per API version and per client: know who still uses old versions before sunsetting.","Errors after releases by client version: detect accidental breaking changes."],"k":["Which change is backward compatible for existing API clients?",["Renaming a field","Changing a field from string to number","Adding a new optional field to the response","Making an optional parameter required"],2,"Adding optional fields doesn’t break clients that ignore unknown fields. The others change the contract existing clients rely on."],"sl":"api-versioning"},{"n":78,"c":"ops","t":"Semantic Versioning","s":"Version numbers as MAJOR.MINOR.PATCH, where each part tells users how risky the upgrade is.","w":"PATCH (1.4.2 → 1.4.3): bug fixes, nothing breaks. MINOR (1.4 → 1.5): new features, backward compatible. MAJOR (1.x → 2.0): breaking changes. Versions 0.x are “anything may change”. Package managers use ranges: ^1.4.2 means any 1.x ≥ 1.4.2; ~1.4.2 means 1.4.x only.","y":"Without meaning in version numbers, every upgrade is a gamble. SemVer lets tools auto-accept safe updates and warns humans about breaking ones.","h":["Bump MAJOR for any breaking change to the public API, even small ones.","Document the public API; SemVer only applies to it.","Keep a CHANGELOG with “Breaking changes” clearly marked.","Use pre-release tags (2.0.0-beta.1) for testing.","Automate versioning from commit messages (Conventional Commits + semantic-release).","As a consumer: use lockfiles and tests; don’t blindly trust that maintainers got it right."],"code":"1.4.2 → 1.4.3   fix: crash on empty cart       (PATCH)\n1.4.3 → 1.5.0   feat: add coupon support        (MINOR)\n1.5.0 → 2.0.0   BREAKING: rename total → amount (MAJOR)\n\n\"lodash\": \"^4.17.21\"   # allows 4.x.y >= 4.17.21","e":"Python 2 → 3 is the classic giant major version: breaking changes so large that migration took the ecosystem more than a decade.","p":["Breaking changes in a minor release","Staying at 0.x forever to avoid commitment","Trusting ^ ranges without a lockfile"],"v":["API Versioning","SemVer describes compatibility of RELEASES (libraries, packages). API versioning manages endpoint CONTRACTS for clients of a running service."],"f":["Bug fix → PATCH","New feature → MINOR","Breaking change → MAJOR","Users judge risk by number"],"q":[["What does ^1.4.2 allow vs ~1.4.2?","^ allows any 1.x.y ≥ 1.4.2 (not 2.0); ~ allows 1.4.x ≥ 1.4.2 only."],["What does version 0.y.z mean?","Initial development; the API isn’t considered stable and anything may change."],["If you remove a deprecated function, which part do you bump?","MAJOR, because removal breaks users who still call it."],["What does a pre-release like 2.0.0-rc.1 mean?","A release candidate before 2.0.0 for testing; it sorts lower than 2.0.0 and shouldn’t be considered stable."],["Why still test minor and patch updates?","Maintainers make mistakes; SemVer communicates intent, not a guarantee."]],"r":[76,77,66,65],"k":["A library goes from 3.4.1 to 4.0.0. What does semantic versioning tell you?",["Only bug fixes","New features, fully compatible","There are breaking changes; read the changelog before upgrading","Nothing"],2,"A major version bump signals breaking changes to the public API."],"sl":"semantic-versioning"},{"n":79,"c":"scale","t":"Garbage Collection","s":"The runtime automatically finds memory your program can no longer reach and frees it.","w":"In Java, Go, JavaScript, C# and Python, you create objects without freeing them manually. The garbage collector (GC) periodically finds objects that nothing references anymore and reclaims their memory. Most GCs are generational: new objects (which usually die young) are collected often and cheaply; long-lived objects less often. Some GC work pauses your program (“stop the world”).","y":"GC prevents whole classes of bugs (forgetting to free, double free). But GC pauses can add latency spikes, and high allocation rates make the GC burn CPU.","h":["Measure first: GC logs, pause times, % CPU in GC (JVM GC logs, GODEBUG=gctrace=1, Node --trace-gc).","Allocate less in hot paths: reuse buffers, avoid creating many temporary objects in loops.","Size the heap sensibly; too small means constant collection, too large means longer pauses with some collectors.","Choose a collector for your goal: JVM G1 (balanced), ZGC/Shenandoah (very low pauses), Go’s GC with GOGC/GOMEMLIMIT tuning.","In containers, make the runtime aware of the memory limit (-XX:MaxRAMPercentage, GOMEMLIMIT).","Remember GC can’t free things you still reference; that’s a leak."],"e":"Discord moved a latency-sensitive service from Go to Rust partly because Go’s periodic GC caused regular latency spikes with their huge in-memory cache.","p":["Blaming GC when the real problem is a leak","JVM ignoring container limits and getting OOM-killed","Calling System.gc() manually"],"v":["Memory Leaks","GC frees UNREACHABLE memory. A leak is memory that’s still reachable but useless, so GC can’t help."],"f":["Objects allocated","Some become unreachable","GC marks reachable ones","Sweeps the rest → memory freed"],"q":[["What is generational garbage collection?","Dividing the heap by object age and collecting young objects frequently, since most die young, and old objects rarely."],["What is a stop-the-world pause?","A period when application threads are paused so the GC can safely do part of its work."],["How can you reduce GC pressure?","Allocate fewer short-lived objects in hot paths, reuse buffers, and tune heap size and collector."],["How can GC pauses show up in your metrics?","As periodic p99 latency spikes that don’t match traffic spikes; GC logs confirm the correlation."],["Why tell the runtime about container memory limits?","Otherwise it may size the heap for the host’s memory and exceed the container limit, getting OOM-killed."]],"r":[16,92,87,103],"m":["GC pause time p99: directly adds to request latency.","% time in GC: high values mean too much allocation or too small a heap.","Allocation rate: drives how often GC runs."],"k":["Can a garbage collector free an object that’s still referenced from a global map?",["Yes, if it’s old","No; reachable objects can’t be collected, which is how leaks happen","Only in Java","Only after a restart"],1,"GC frees only unreachable objects. Unneeded data still referenced from globals stays forever."],"sl":"garbage-collection"},{"n":80,"c":"dist","t":"Thread Safety","s":"Code is thread-safe if it still behaves correctly when many threads use it at the same time.","w":"Threads in one process share memory. If two threads do count = count + 1 simultaneously, both may read 5 and both write 6, losing an increment. Thread-safe code protects shared mutable state using locks, atomic operations, immutable data, or by not sharing at all.","y":"Thread-safety bugs are intermittent and nearly impossible to reproduce: wrong totals, corrupted maps, crashes under load only.","h":["Best: avoid shared mutable state. Use local variables, immutable objects, or give each thread its own data.","Use atomic types for counters and flags (AtomicInteger, sync/atomic, std::atomic).","Protect compound operations with a mutex/lock; keep the critical section small.","Use concurrent collections (ConcurrentHashMap) instead of plain maps.","Communicate by message passing (Go channels, actor model, queues) instead of sharing memory.","Use tools: Go race detector (-race), ThreadSanitizer, stress tests.","Document whether your classes are thread-safe."],"code":"// unsafe\ncounter++                     // read, add, write: 3 steps\n\n// safe (Go)\nvar counter int64\natomic.AddInt64(&counter, 1)\n\n// or a lock\nmu.Lock(); counter++; mu.Unlock()","e":"A Java service used a plain HashMap as a shared cache. Under heavy concurrent writes the map’s internal structure got corrupted and a thread looped forever at 100% CPU. ConcurrentHashMap fixed it.","p":["Assuming one line of code is atomic","Holding locks while doing slow IO","Thread-safe parts combined in an unsafe way (check-then-act across two safe calls)"],"v":["Race Condition","Thread safety is the PROPERTY you want. A race condition is the BUG you get when you don’t have it."],"f":["T1 reads 5, T2 reads 5","!Both write 6 (lost update)","Use atomic / lock","Result 7, correct"],"q":[["Why is count++ not thread-safe?","It’s read-modify-write in multiple steps; two threads can interleave and lose an update."],["Name three ways to achieve thread safety.","Immutability/no sharing, atomic operations, and locks; also message passing."],["Is combining two thread-safe operations always thread-safe?","No; e.g. “if !map.contains(k) then map.put(k)” can race. Use an atomic putIfAbsent."],["What is a critical section?","Code that accesses shared state and must not be executed by more than one thread at a time."],["Why is message passing often easier than locks?","Each piece of state has one owner; others send messages, so there’s no shared mutable state to protect."]],"r":[14,26,27,25],"k":["Two threads run count++ 1,000 times each on a shared int without synchronization. The final value is…",["Always 2,000","Possibly less than 2,000 because increments can be lost","Always 1,000","Random negative numbers"],1,"count++ is read-modify-write; interleaving threads can read the same value and overwrite each other."],"sl":"thread-safety"},{"n":81,"c":"scale","t":"Autoscaling","s":"Automatically adding servers when load goes up and removing them when it goes down.","w":"An autoscaler watches a signal (CPU, requests per second, queue length, custom metric) and changes the number of instances to keep it near a target. Examples: AWS Auto Scaling Groups, Kubernetes HPA (pods) and Cluster Autoscaler/Karpenter (nodes), serverless platforms scaling per request.","y":"Fixed capacity is either too small at peak (outage) or too big at night (wasted money). Autoscaling follows demand.","h":["Pick a signal that reflects real load: CPU for compute-bound apps; queue depth/age for workers; requests per instance for web.","Set min and max instances: min for baseline and redundancy, max to cap cost and protect databases.","Use cooldowns/stabilization windows to avoid flapping up and down.","Make startup fast; scaling is useless if new instances take 10 minutes.","Scale ahead of known peaks with scheduled scaling (sale at 8 PM).","Remember dependencies: 100 more app servers may overwhelm the database (connection limits).","Keep instances stateless so any can be removed."],"code":"# Kubernetes HPA\nminReplicas: 3\nmaxReplicas: 40\nmetrics:\n- type: Resource\n  resource:\n    name: cpu\n    target: { type: Utilization, averageUtilization: 60 }","e":"Food delivery apps in India see huge spikes at lunch and dinner; their services scale up before 12:30 and 7:30 PM, then scale down overnight.","p":["Scaling on a metric that doesn’t relate to load","Slow boot times making scaling arrive too late","No max, so a bug or attack scales into a huge bill"],"v":["Horizontal Scaling","Horizontal scaling is the ABILITY to add instances. Autoscaling is AUTOMATICALLY doing it based on metrics."],"f":["Traffic rises","CPU > 60% target","Add instances","Load drops → remove after cooldown"],"q":[["What’s a good autoscaling metric for queue workers?","Queue depth or the age of the oldest message, not CPU."],["Why set a maximum?","To cap cost and to avoid overwhelming shared dependencies like the database."],["What is scheduled scaling?","Pre-adding capacity for predictable peaks, since reactive scaling can lag."],["What protects the database when the app autoscales aggressively?","A max instance count, bounded connection pools, a connection pooler and rate limits on expensive work."],["What is a cooldown or stabilization window?","A waiting period after scaling before scaling again, preventing rapid up/down oscillation."]],"r":[82,8,88,86],"num":"Target 60% CPU per instance; each instance handles ~800 req/s at 60%.\nTraffic 4,000 req/s → 5 instances; at a spike to 10,000 req/s → 13 instances.\nIf new instances take 3 min to boot, a spike that doubles in 1 min will overload you first → scheduled scaling or headroom.","m":["Desired vs actual instance count: lag shows slow scaling.","Scaling events per hour: frequent up/down means flapping; tune cooldowns.","The scaling metric itself (CPU, queue age) relative to target."],"k":["Why might CPU-based autoscaling fail for a queue worker that mostly waits on a slow external API?",["Workers can’t scale","CPU stays low while the backlog grows, so the autoscaler never adds workers","CPU metrics are inaccurate","Queues don’t support scaling"],1,"IO-bound workers aren’t CPU-busy. Scale on queue depth or oldest-message age instead."],"sl":"autoscaling"},{"n":82,"c":"scale","t":"Horizontal Scaling","s":"Handling more load by adding more machines (scale out), instead of a bigger machine.","w":"Instead of one server, run 2, 10 or 100 identical ones behind a load balancer. Capacity grows roughly with the number of machines, and losing one isn’t fatal.","y":"Every single machine has a ceiling, and one machine is a single point of failure. Horizontal scaling has (almost) no ceiling and improves availability.","h":["Make the app stateless: sessions in Redis/DB, files in object storage (S3), not on local disk.","Put a load balancer in front.","Avoid in-memory locks and caches that must be consistent; use shared stores.","Scale the data layer separately: read replicas, caching, sharding.","Use autoscaling to add/remove instances.","Watch out for things that must run once (cron jobs) now that there are many instances."],"e":"Netflix runs thousands of identical stateless service instances; losing a few at any time is normal and unnoticed by viewers.","p":["Storing uploads on local disk, so other servers can’t find the file","Scaling app servers while the single DB is the real bottleneck","Cron jobs running on every instance"],"v":["Vertical Scaling","Horizontal = MORE machines (more resilient, more complex). Vertical = BIGGER machine (simple, has a ceiling, single point of failure)."],"f":["1 server at limit","Make app stateless","Add servers behind LB","Capacity × N, survives failures"],"q":[["What must change in an app to scale horizontally?","It must be stateless: shared session storage, external file storage, and no reliance on local memory for coordination."],["Why doesn’t adding app servers always help?","The bottleneck may be a shared dependency like the database."],["Horizontal scaling’s main advantages?","Near-unlimited growth and fault tolerance."],["Why might horizontal scaling not improve throughput?","A shared bottleneck (database, lock, external API) limits the whole system no matter how many app servers you add."],["What new problems does horizontal scaling introduce?","Coordination (cron jobs, locks), consistent configuration, distributed caching and harder debugging across instances."]],"r":[83,8,140,28],"k":["Which change is required before you can scale web servers horizontally?",["Bigger servers","Moving sessions and uploaded files out of individual servers' memory and disks","A NoSQL database","HTTP/3"],1,"Any instance must be able to serve any request, so state must live in shared stores."],"sl":"horizontal-scaling"},{"n":83,"c":"scale","t":"Vertical Scaling","s":"Handling more load by giving one machine more CPU, RAM or faster disk (scale up).","w":"Change the instance type from 4 cores/16 GB to 32 cores/128 GB. Nothing in the app changes. It’s usually the simplest first move, especially for databases.","y":"It’s fast and needs no code changes. Modern machines are huge (hundreds of cores, terabytes of RAM), so vertical scaling goes further than many people think.","h":["Find the bottleneck first (CPU, memory, disk IO, network) and upgrade that.","Great for databases, which are hard to scale horizontally.","Plan for the restart/failover needed to resize; use a replica to make it near-zero downtime.","Make sure software can use the extra resources (single-threaded apps won’t use 32 cores; tune pools and memory settings).","Watch cost: the biggest instances cost a lot more per unit.","Know the ceiling and plan the next step before you hit it."],"e":"Stack Overflow famously served huge traffic for years from a small number of powerful SQL Server machines instead of a sharded fleet.","p":["Upgrading CPU when the bottleneck is disk IO","Thinking a bigger box fixes a single point of failure","Forgetting to raise config limits (buffer pool, worker counts) to use the new resources"],"v":["Horizontal Scaling","Vertical: bigger single machine, simple, limited, no redundancy. Horizontal: more machines, scalable and resilient, but needs stateless design."],"f":["DB CPU at 90%","Resize 8 → 32 cores","Failover to resized replica","Headroom gained, no code change"],"q":[["When is vertical scaling the right first step?","When the app or database is simple, the bottleneck is clear, and a bigger machine solves it cheaply without code changes."],["What are its limits?","A hardware ceiling, rising cost, possible downtime to resize, and still a single point of failure."],["Why are databases often scaled vertically?","Splitting relational data across machines (sharding) is complex; a bigger machine is far simpler."],["Why doesn’t vertical scaling fix availability?","It’s still one machine: if it fails, the service is down. You need redundancy for availability."],["What configuration should you revisit after scaling a database up?","Memory settings (buffer pool/shared_buffers), worker and connection limits, so the database actually uses the new resources."]],"r":[82,22,28,86],"k":["When is vertical scaling the most sensible first step?",["Never","When the bottleneck is clear and a bigger machine solves it cheaply without code changes","Only for stateless servers","When you need multi-region"],1,"A larger instance is often the fastest, simplest fix, especially for databases, until you approach hardware or cost limits."],"sl":"vertical-scaling"},{"n":84,"c":"scale","t":"CDN","s":"A worldwide network of servers that keeps copies of your content close to users, so it loads fast.","w":"A Content Delivery Network (Cloudflare, CloudFront, Akamai, Fastly) has hundreds of edge locations (points of presence). When a user in Chennai requests your image, it’s served from a nearby edge instead of your origin server in the US. The first request fetches from origin and caches; later requests are served from the edge.","y":"Physics: a round trip from India to the US is ~200+ ms. Pages need many requests. A CDN cuts that to ~20 ms, offloads most traffic from your servers, and absorbs attacks.","h":["Serve static assets (JS, CSS, images, fonts, videos) through the CDN.","Use hashed file names (app.3f9a2c.js) with long cache lifetimes: Cache-Control: public, max-age=31536000, immutable.","Short or no caching for HTML so new deploys show up quickly.","Never cache private or user-specific responses publicly (Cache-Control: private / no-store).","Set up purge/invalidation for urgent changes.","Use image optimization, compression (brotli) and HTTP/2-3 at the edge.","Monitor cache hit ratio; low ratio means poor cache keys or headers."],"code":"# hashed assets: cache forever\nCache-Control: public, max-age=31536000, immutable\n# HTML: always revalidate\nCache-Control: no-cache\n# user data: never cache publicly\nCache-Control: private, no-store","e":"Hotstar/JioCinema use CDNs to stream cricket matches to tens of millions of concurrent viewers; the origin servers would never handle that alone.","p":["Caching personalized pages and showing one user’s data to another","Long cache on HTML causing old app versions","Query strings or cookies fragmenting the cache key so nothing hits"],"v":["Edge Caching","A CDN is the NETWORK and platform. Edge caching is one TECHNIQUE it provides; CDNs also do TLS, DDoS protection, image optimization and edge compute."],"f":["User in Chennai","Nearest edge (Mumbai)","Cache hit → ~20 ms","Miss → fetch from origin once"],"q":[["Why use hashed filenames for static assets?","The content hash changes when the file changes, so you can cache forever and new versions get new URLs."],["What must never be cached at a public CDN?","Private, user-specific responses like account pages or API responses with personal data."],["What is cache hit ratio?","The percentage of requests served from cache; higher means less origin load and faster responses."],["Why must you be careful caching responses that set cookies?","They may be user-specific; caching them publicly can leak one user’s session or data to others."],["How do you update content that’s cached at the CDN urgently?","Purge by URL or tag, or change the URL (versioning)."]],"r":[85,7,53,144],"num":"Origin in Virginia, users in Chennai: ~250 ms RTT; edge in Chennai/Mumbai: ~20 ms.\nA page with 40 assets over a few parallel connections → seconds saved.\nHit ratio 95% on 50 TB/month → origin serves 2.5 TB instead of 50 TB.","m":["Cache hit ratio (requests and bytes): low ratios mean bad cache headers or fragmented cache keys.","Origin request rate and egress: what the CDN is not absorbing.","Edge latency by region."],"k":["What’s the safest caching approach for JavaScript bundles?",["Cache index.html for a year","Use content-hashed filenames with long max-age and immutable","Never cache JS","Cache with a 5-second TTL"],1,"A new deploy produces new filenames, so old files can be cached forever without serving stale code."],"sl":"cdn"},{"n":85,"c":"scale","t":"Edge Caching","s":"Storing responses at servers near users (the “edge”), so requests are answered before they ever reach your origin.","w":"Not just static files: API responses and full HTML pages can be cached at the edge too, if they’re the same for many users. The edge decides using the cache key (URL plus selected headers/cookies) and headers like Cache-Control, s-maxage and Vary. Techniques like stale-while-revalidate serve a slightly old copy instantly while fetching a fresh one in the background.","y":"A product listing viewed 100,000 times a minute doesn’t need 100,000 origin hits. Even caching for 10 seconds can remove 99% of origin load during a spike.","h":["Use s-maxage for shared caches (CDN) separate from max-age for browsers.","Use stale-while-revalidate and stale-if-error for speed and resilience (serve stale if origin is down).","Keep cache keys tight: ignore irrelevant query params like utm_source; use Vary only on headers that truly change content.","Never cache responses with Set-Cookie or user-specific data publicly.","Use micro-caching (1–10 s) for hot dynamic content.","Use surrogate keys/cache tags to purge all pages related to one product."],"code":"Cache-Control: public, max-age=0, s-maxage=60,\n               stale-while-revalidate=300, stale-if-error=86400","e":"News sites micro-cache article pages for a few seconds at the edge. When a story goes viral, the origin still sees only a handful of requests per second.","p":["Vary: Cookie or Vary: User-Agent destroying hit rates","Caching responses containing Set-Cookie","No purge strategy for urgent corrections"],"v":["Application Caching","Edge caching serves whole RESPONSES near users before the request reaches your servers. Application caching stores DATA inside your backend (e.g. Redis) to speed up building responses."],"f":["Request hits edge","Fresh copy? serve","Stale? serve + refresh in background","Origin barely touched"],"q":[["max-age vs s-maxage?","max-age applies to all caches including browsers; s-maxage overrides it for shared caches like CDNs."],["What does stale-while-revalidate do?","Lets the cache serve a stale response immediately while fetching a fresh one in the background."],["Why can Vary hurt caching?","Each distinct header value creates a separate cache entry; varying on high-variety headers fragments the cache."],["What is micro-caching?","Caching dynamic responses for a very short time (1–10 s), which can absorb huge spikes on hot pages."],["How do surrogate keys/cache tags help?","They group cached responses (e.g. all pages showing product 42) so you can purge them together."]],"r":[84,7,6,134],"k":["What does stale-if-error do?",["Deletes the cache on errors","Lets the cache serve an older copy when the origin returns errors or is down","Retries the origin forever","Forces revalidation"],1,"It improves resilience: users still get content (slightly old) during origin outages."],"sl":"edge-caching"},{"n":86,"c":"scale","t":"Cost Optimization","s":"Paying less for cloud infrastructure while keeping the speed and reliability users need.","w":"Cloud bills grow quietly: oversized servers, forgotten test environments, data transfer, logs nobody reads, idle databases. Cost optimization (part of FinOps) means measuring where money goes, then cutting waste without hurting users.","y":"For many startups the cloud bill is one of the largest expenses. Waste of 30–50% is common. Saving it can mean months more runway.","h":["Make costs visible: tag every resource by team/service/environment and review a cost dashboard weekly.","Set budgets and anomaly alerts so a runaway bill is caught in a day, not a month.","Right-size: if a server averages 10% CPU, use a smaller one.","Turn off or delete idle resources: dev environments at night, unattached disks, old snapshots, unused IPs and load balancers.","Use commitments (Savings Plans, reserved instances) for steady baseline load and spot/preemptible instances for fault-tolerant batch work.","Watch data transfer: cross-region and internet egress are expensive; cache and compress.","Set log retention and sample noisy logs; observability bills grow fast.","Move cold data to cheaper storage classes with lifecycle rules.","Use ARM instances (Graviton etc.) where compatible for better price/performance."],"e":"A startup found 40% of its AWS bill was a forgotten staging cluster and debug-level logs kept forever. Fixing both took a day and saved lakhs per month.","p":["Cutting redundancy and causing outages to save a little","Optimizing tiny line items while ignoring the biggest ones","No ownership: nobody knows who runs what"],"v":["Autoscaling","Autoscaling is one TOOL that can reduce cost by matching capacity to demand. Cost optimization is the broader PRACTICE including pricing models, cleanup and architecture choices."],"f":["Tag + measure spend","Find top cost drivers","Right-size / delete / commit","Budgets + alerts keep it down"],"q":[["What’s the first step in cloud cost optimization?","Visibility: tagging resources and seeing which services and teams spend what."],["When should yo
