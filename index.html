 do bulkheads prevent?","Resource exhaustion in one area (threads, connections) spreading to unrelated features."],["Give two ways to implement bulkheads.","Separate thread/connection pools per dependency, and separate instances or queues per workload or tenant."],["What is cell-based architecture?","Splitting a system into independent full copies (cells), each serving a subset of customers, to contain failures."],["What’s the trade-off of bulkheads?","Partitioned pools can leave capacity idle in one compartment while another is full; sizing needs measurement."],["Give a non-thread example of a bulkhead.","Separate queues and workers per job type, or separate clusters (cells) per group of customers."]],"r":[13,4,40,10],"k":["A slow recommendations API exhausts all 200 shared threads and checkout stops working. Which pattern prevents this?",["Retries","Bulkheads: separate thread/connection pools per dependency","Bigger servers","Caching"],1,"Isolating resources per dependency means one slow dependency can only exhaust its own pool."],"sl":"bulkheads"},{"n":113,"c":"msg","t":"Transactional Outbox Pattern","s":"Save the database change and the event-to-publish in the same transaction, then publish the event separately, so neither can be lost.","w":"The “dual write” problem: you save an order to the DB and then publish OrderPlaced to Kafka. If the app crashes between the two, the order exists but no event is sent (or the event goes out but the DB transaction rolls back). The outbox fixes it: in the same DB transaction, insert the order AND a row into an outbox table. A separate relay reads the outbox and publishes events, marking them sent.","y":"Lost events mean warehouses never ship, emails never send, and systems silently disagree. This is one of the most common hidden bugs in event-driven systems.","h":["Create an outbox table: id, aggregate_id, event_type, payload, created_at, sent_at.","Write business rows and outbox rows in ONE database transaction.","A relay publishes unsent rows in order, then marks them sent (polling with FOR UPDATE SKIP LOCKED, or change data capture with Debezium reading the DB log).","The relay can crash after publishing but before marking sent, so events can repeat: consumers must be idempotent (use the outbox row id as event ID).","Clean up old sent rows periodically.","Keep ordering per aggregate (e.g. per order ID) if consumers need it."],"code":"BEGIN;\nINSERT INTO orders (id, user_id, total) VALUES (42, 7, 999);\nINSERT INTO outbox (id, type, payload)\n  VALUES (gen_random_uuid(), 'OrderPlaced', '{\"order_id\":42}');\nCOMMIT;\n-- relay: SELECT * FROM outbox WHERE sent_at IS NULL\n--        → publish → UPDATE outbox SET sent_at = now()","e":"Many companies use Debezium to stream outbox table inserts from Postgres’s write-ahead log into Kafka, giving reliable event publishing without polling.","p":["Publishing to the broker inside the DB transaction (the broker call can’t be rolled back)","Non-idempotent consumers getting duplicate events","Outbox table growing forever"],"v":["Pub/Sub","Pub/sub DELIVERS events to subscribers. The outbox makes sure the event is RELIABLY PUBLISHED in the first place, consistent with your database."],"f":["One TX: order + outbox row","Commit","Relay reads outbox","Publish → mark sent"],"q":[["What is the dual-write problem?","Writing to two systems (DB and broker) without a shared transaction, so a crash between them leaves them inconsistent."],["Why can the outbox still produce duplicates?","The relay may publish and crash before marking the row sent, so it publishes again on restart."],["What is change data capture (CDC) in this context?","Reading the database’s transaction log to detect new outbox rows and publish them, instead of polling."],["How does the outbox relay avoid losing events on crash?","It only marks rows sent after publishing; on restart it republishes unsent rows (at-least-once), so consumers must dedupe."],["How do you keep outbox events ordered per entity?","Publish in order of creation per aggregate ID and use the aggregate ID as the message key/partition."]],"r":[149,120,35,37],"k":["Why not publish to Kafka inside the database transaction?",["Kafka is too slow","The publish can’t be rolled back if the transaction aborts, and the commit can fail after publishing","Kafka doesn’t support JSON","It’s not allowed by SQL"],1,"Two systems without a shared transaction can diverge. The outbox makes the event part of the DB commit."],"sl":"transactional-outbox-pattern"},{"n":114,"c":"dist","t":"CQRS","s":"Command Query Responsibility Segregation: use one model for changing data (commands) and a separate, optimized model for reading it (queries).","w":"Commands like PlaceOrder go through the write model, which enforces business rules on normalized data. Queries like “show my order history with product names and totals” read from read models, which are denormalized views shaped exactly for each screen. Read models are updated from the write side, often via events, so they may lag slightly.","y":"One model serving both often becomes a mess: writes need strict validation and normalized tables, while reads want fast, pre-joined data in many shapes. Read and write loads also scale differently.","h":["Use it only where reads and writes really differ a lot; for simple CRUD it’s overkill.","Commands: validate and change state, return little (success/ID).","Queries: never change state; read from views built for the screen.","Update read models with events or CDC; make projection updates idempotent.","Handle lag in the UI: show the user’s own change optimistically or read from the write side right after a command.","Be able to rebuild read models from the source of truth.","Read models can live in different stores (Elasticsearch for search, Redis for counters)."],"e":"An e-commerce site writes orders to Postgres (write model) and projects them into Elasticsearch for fast search and filtering in the admin panel (read model).","p":["Applying CQRS to every simple service","Users confused because their change doesn’t appear yet","No way to rebuild a corrupted read model"],"v":["Event Sourcing","CQRS separates READ and WRITE models. Event sourcing stores state as a HISTORY of events. They pair well but are independent: either can be used without the other."],"f":["Command: PlaceOrder","Write model validates + saves","Event updates read model","Query reads fast view"],"q":[["What problem does CQRS solve?","Conflicting needs of reads and writes: complex validation and normalized data for writes vs fast, varied, denormalized views for reads."],["What’s the main downside?","More complexity and eventual consistency between the write model and read models."],["Do you need event sourcing to use CQRS?","No; read models can be updated from regular DB changes, CDC or events."],["How do you handle a read model that lags behind a command?","Show the user’s change optimistically, read from the write side briefly after commands, or show 'updating' states."],["How do you rebuild a corrupted read model?","Replay events (or re-run CDC/snapshot) from the source of truth into a fresh projection, then switch over."]],"r":[115,149,145,33],"k":["When is CQRS most likely overkill?",["Heavy-read dashboards with complex views","A simple CRUD admin app with modest traffic","Systems with very different read and write models","Event-sourced domains"],1,"CQRS adds models, sync and eventual consistency. Simple CRUD gains little from it."],"sl":"cqrs"},{"n":115,"c":"dist","t":"Event Sourcing","s":"Instead of storing only the current state, store every change as an event, and rebuild the current state by replaying them.","w":"A bank account isn’t stored as \"balance = 500\". It’s stored as events: Opened, Deposited 1000, Withdrew 300, Withdrew 200. Current balance = replay of all events. Events are immutable and only appended. Projections build queryable views from them; snapshots speed up rebuilding long histories.","y":"You get a full audit trail, the ability to answer “what was the state last Tuesday?”, to rebuild views after fixing bugs, and to create new views from old history. It’s powerful for finance, logistics and domains where history matters, but it adds real complexity.","h":["Model events as past-tense business facts with all needed data.","Store them in an append-only event store, ordered per entity (stream), with optimistic concurrency on stream version.","Build projections/read models for queries (usually with CQRS).","Use snapshots so you don’t replay 10 years of events every time.","Plan event schema evolution: version events, use upcasters to convert old formats.","Handle personal data carefully: you can’t easily delete from immutable logs (store personal data separately or use crypto-shredding).","Use it for the parts of the system that need it, not everything."],"code":"events for account 7:\n1 AccountOpened   {owner: \"Asha\"}\n2 MoneyDeposited  {amount: 1000}\n3 MoneyWithdrawn  {amount: 300}\n4 MoneyWithdrawn  {amount: 200}\nbalance = replay → 500","e":"Git is a familiar example of the idea: it stores a history of commits, and the current files can be reconstructed from that history.","p":["Events that are just CRUD (“RowUpdated”) instead of business facts","No plan for changing event formats","GDPR deletion requests on immutable logs","Using it everywhere and drowning in complexity"],"v":["Audit Log","In event sourcing the events ARE the source of truth; state is derived from them. An audit log is a side record of what happened; the real state lives elsewhere."],"f":["Command: withdraw 200","Append MoneyWithdrawn event","Projections update","State = replay of events"],"q":[["How is current state obtained in event sourcing?","By replaying all events for an entity in order, often starting from a snapshot."],["What are snapshots for?","Storing state at a point in time so you only replay events after it, speeding up loads."],["What’s hard about event sourcing?","Schema evolution, eventual consistency of projections, deleting personal data and overall complexity."],["How do you change the shape of old events?","Version events and use upcasters that convert old versions to the current shape when reading."],["How can you handle GDPR deletion with immutable events?","Store personal data outside the event log or encrypt it per user and delete the key (crypto-shredding)."]],"r":[114,132,113,121],"k":["In an event-sourced system, how do you get an account’s current balance?",["Read the balance column","Replay its events (optionally from a snapshot) to compute it","Ask the cache","Query the audit log"],1,"Events are the source of truth; state is derived by applying them in order."],"sl":"event-sourcing"},{"n":116,"c":"net","t":"API Pagination","s":"Returning big lists in small chunks (pages) instead of all at once.","w":"GET /orders could return 2 million rows. Instead you return, say, 20 at a time plus a way to get the next 20. Two main styles: offset pagination (?page=3 or ?offset=40&limit=20) and cursor/keyset pagination (?after=eyJpZCI6MTAyfQ, a pointer to the last item you saw).","y":"Giant responses are slow, use huge memory on server and client, time out and waste mobile data. And deep offset pages get slower and slower.","h":["Always have a default limit and a maximum (e.g. default 20, max 100).","Offset is simple and allows jumping to page N, but OFFSET 100000 still reads 100,000 rows, and inserts/deletes shift results (duplicates or skipped items).","Cursor/keyset: WHERE (created_at, id) < (:last_created_at, :last_id) ORDER BY created_at DESC, id DESC LIMIT 20. Fast at any depth and stable while data changes.","Sort by a unique, stable order (add id as tiebreaker).","Return next_cursor (opaque, base64-encoded) and has_more, rather than total counts (counting is expensive on big tables).","Have an index matching the sort order."],"code":"GET /orders?limit=20&after=eyJ0IjoiMjAyNi0xMC0xOSIsImlkIjo5OH0\n{\n  \"data\": [ ...20 orders... ],\n  \"next_cursor\": \"eyJ0IjoiMjAyNi0xMC0xOCIsImlkIjo3OH0\",\n  \"has_more\": true\n}","e":"Twitter/X, Slack and Stripe APIs use cursor-based pagination because their feeds change constantly and users scroll very deep.","p":["No maximum limit, so a client asks for 1,000,000","Ordering by a non-unique column, causing duplicates across pages","Deep OFFSET queries killing the DB","Expensive COUNT(*) on every request"],"v":["Offset vs Cursor","Offset: easy, supports jumping to page 50, slow when deep, unstable with changing data. Cursor: fast and stable, but only next/previous navigation."],"f":["GET first 20","Return data + next_cursor","Client sends cursor","DB seeks via index → next 20"],"q":[["Why is offset pagination slow on deep pages?","The database must read and skip all preceding rows before returning the page."],["Why add id as a tiebreaker in sorting?","To make the order unique and stable so items don’t repeat or vanish between pages."],["What does a cursor usually contain?","An encoded pointer to the last item’s sort values (e.g. created_at and id)."],["Why avoid returning a total count on every page of a huge table?","COUNT(*) on large tables is expensive; return has_more or an approximate count instead."],["Why should cursors be opaque?","Clients shouldn’t depend on their internal format, so you can change sort keys or encoding later."]],"r":[21,20,150,77],"num":"OFFSET 100,000 LIMIT 20: the DB reads and discards 100,000 rows to return 20.\nKeyset (WHERE id < last_id LIMIT 20): index seek, reads ~20 rows at any depth.","k":["A feed uses OFFSET pagination; new posts arrive while a user scrolls. What can happen?",["Nothing","Items shift between pages, so users see duplicates or miss items","The DB locks","Pages load faster"],1,"New rows change offsets. Cursor/keyset pagination continues from a stable marker instead."],"sl":"api-pagination"},{"n":117,"c":"sec","t":"Input Validation","s":"Checking that incoming data has the right shape, type and allowed values before your system uses it.","w":"Every request is untrusted: a quantity could be -5, an email could be 10 MB of text, an “id” could be a string with SQL in it. Validation checks syntax (is it a valid email/number/date? correct length?) and business rules (quantity between 1 and 10? start date before end date? does this user own this order?).","y":"Bad input causes crashes, corrupted data, confusing errors and security holes. Validating in the browser improves UX, but anyone can bypass the browser with curl, so the server must validate.","h":["Validate on the server at every entry point: APIs, webhooks, file uploads, queue messages.","Use schemas (JSON Schema, Zod, Pydantic, Joi, class-validator) to declare types, required fields, formats and ranges.","Prefer allowlists (only these values allowed) over blocklists.","Limit sizes: string length, array length, request body size, upload size and file type (check content, not just extension).","Reject unknown fields where it matters to avoid mass assignment (user sending “is_admin”: true).","Return clear 400/422 errors that explain what’s wrong.","Validation is not a replacement for parameterized queries, output escaping or authorization checks."],"code":"class CreateOrder(BaseModel):          # Pydantic\n    product_id: int\n    quantity: conint(ge=1, le=10)\n    coupon: constr(max_length=20) | None = None\n    model_config = {\"extra\": \"forbid\"}  # reject unknown fields","e":"GitHub had a mass-assignment bug in 2012 (via Rails) where a user could add an unexpected field to a form and gain write access to the Rails repository itself.","p":["Validating only in the frontend","Blocklists of “bad characters”","Accepting unknown fields straight into DB models","No size limits on uploads or arrays"],"v":["Authentication","Validation checks whether the DATA is acceptable. Authentication checks WHO is sending it. Perfectly valid data can still come from an attacker."],"f":["Request arrives","Schema check: types, ranges","Business rule check","!Invalid → 422 with reason"],"q":[["Why isn’t client-side validation enough?","Clients can be bypassed or modified; only server-side checks are trustworthy."],["Allowlist vs blocklist?","Allowlists accept only known-good values; blocklists try to reject known-bad ones and are easy to bypass."],["What is mass assignment?","Automatically binding request fields to model fields, letting attackers set fields they shouldn’t, like roles."],["What is mass assignment?","Binding all request fields into a model automatically, letting attackers set fields like is_admin. Allowlist fields or reject unknown ones."],["Why validate file uploads by content, not just extension?","Extensions are easy to fake; check the actual file type, size and scan if needed."]],"r":[42,43,118,124],"k":["Your frontend validates that quantity is between 1 and 10. Is server-side validation still needed?",["No, the frontend already checks it","Yes, attackers can send requests directly without your frontend","Only for admins","Only for GET requests"],1,"Anything from the client can be modified. Validate on the server at every entry point."],"sl":"input-validation"},{"n":118,"c":"sec","t":"RBAC vs. ABAC","s":"Two ways to decide permissions: RBAC uses roles (“editors can publish”); ABAC uses attributes and context (“editors can publish articles in their own department during work hours”).","w":"RBAC (Role-Based Access Control): users get roles, roles have permissions. Simple and easy to audit. ABAC (Attribute-Based Access Control): a policy evaluates attributes of the user (department, level), the resource (owner, sensitivity), the action and the environment (time, IP, device). Related: ReBAC (relationship-based, like Google Docs sharing: “viewers of this folder”).","y":"RBAC alone breaks down when access depends on ownership or context: you end up with “role explosion” (Editor-Mumbai-Finance-ReadOnly…). ABAC handles that but is harder to reason about and audit.","h":["Start with RBAC with a few clear roles.","Always check ownership/tenant at the resource level (user can view ONLY their own orders), whatever the model.","Add ABAC rules when access truly depends on attributes or context.","Centralize policies in one place (OPA/Rego, Cedar, Casbin, or an authorization service) instead of scattering if-statements.","Default deny: no matching rule = no access.","Test policies with unit tests and log decisions for audits.","For sharing-heavy apps consider ReBAC tools (OpenFGA, SpiceDB)."],"code":"# RBAC\nallow if \"editor\" in user.roles and action == \"publish\"\n\n# ABAC\nallow if user.role == \"manager\"\n     and resource.region == user.region\n     and resource.amount <= 50000","e":"AWS IAM is mostly ABAC-capable: policies can check tags, e.g. allow developers to stop only EC2 instances tagged with their own team name.","p":["Role explosion trying to express context in role names","Forgetting object-level checks (IDOR: changing /orders/41 to /orders/42)","Permission logic copy-pasted across services"],"v":["RBAC","RBAC: permissions via roles, simple to audit. ABAC: permissions computed from attributes and context, more flexible, more complex."],"f":["User + action + resource","RBAC: role allows?","ABAC: attributes match policy?","Allow or default deny"],"q":[["What is role explosion?","Creating ever more specific roles to capture context, making RBAC unmanageable."],["What is IDOR?","Insecure Direct Object Reference: accessing another user’s resource by changing an ID because ownership isn’t checked."],["When would you choose ABAC?","When access depends on resource attributes, ownership, location, time or other context that roles can’t express cleanly."],["What does default deny mean?","If no policy explicitly allows an action, it’s refused."],["What is ReBAC?","Relationship-based access control: permissions come from relationships (e.g. member of a folder), as in Google Docs sharing; tools include OpenFGA and SpiceDB."]],"r":[48,122,152,117],"k":["Users can view /orders/42 by changing the ID to someone else’s order. What’s missing?",["Rate limiting","An object-level authorization (ownership) check","TLS","Input validation"],1,"This is an IDOR. Every request must check that the user is allowed to access that specific object."],"sl":"rbac-vs-abac"},{"n":119,"c":"msg","t":"Exactly-Once Processing","s":"The goal that each message’s effect happens exactly one time, which in practice means “at-least-once delivery + idempotent processing”.","w":"Delivery guarantees: at-most-once (may lose messages, never duplicates), at-least-once (never lose, may duplicate), exactly-once (neither). Over unreliable networks, a sender can’t know if a lost acknowledgement means “not received” or “received but ack lost”, so true end-to-end exactly-once delivery is impossible in general. What systems offer is exactly-once EFFECT within a boundary, e.g. Kafka transactions for read-process-write within Kafka.","y":"Teams that believe a product’s “exactly-once” label skip deduplication, then charge customers twice when an external call is retried. Understanding the real guarantee prevents that.","h":["Assume at-least-once delivery and design for duplicates.","Make consumers idempotent: dedupe by message ID with a unique constraint, or use naturally idempotent operations (SET status = 'paid').","Store the processed message ID in the SAME transaction as the business change.","Use idempotency keys when calling external APIs.","Understand your platform’s guarantee boundary: Kafka exactly-once covers Kafka-to-Kafka with transactions, not your email provider.","Commit offsets/acks only after the effect is durable."],"code":"BEGIN;\nINSERT INTO processed_messages (id) VALUES (:msg_id);  -- unique\n-- duplicate? → unique violation → rollback & ack\nUPDATE accounts SET balance = balance + :amt WHERE id = :acct;\nCOMMIT;","e":"A team trusted their queue’s “exactly-once” FIFO setting but it only deduplicated within a 5-minute window. A retry after 7 minutes double-credited wallets until they added a processed-IDs table.","p":["Trusting marketing labels","Dedupe check and business update in separate transactions","Acking before the effect is saved"],"v":["At-Least-Once Delivery","At-least-once is what you usually GET from brokers. Exactly-once is the EFFECT you build on top using idempotency and deduplication."],"f":["Message delivered","!Ack lost → redelivered","Consumer sees ID already processed","Skip → effect happened once"],"q":[["Why is end-to-end exactly-once delivery generally impossible?","A sender can’t distinguish a lost message from a lost acknowledgement, so it must either risk loss or risk duplicates."],["How do you achieve exactly-once effects?","At-least-once delivery combined with idempotent processing or deduplication stored atomically with the effect."],["What does Kafka’s exactly-once cover?","Read-process-write cycles within Kafka using transactions and idempotent producers, not external side effects."],["Why does acking after the effect is durable matter?","Acking first risks losing the message if you crash before the effect is saved."],["Does Kafka’s exactly-once cover sending emails?","No. It covers Kafka read-process-write within Kafka; external side effects still need idempotency."]],"r":[120,126,148,1],"k":["What do most real systems use to get 'exactly-once' business effects?",["Brokers that never redeliver","At-least-once delivery plus idempotent consumers or deduplication","Faster networks","Bigger queues"],1,"Duplicates are unavoidable over unreliable networks; you make their effects harmless."],"sl":"exactly-once-processing"},{"n":120,"c":"msg","t":"Idempotent Consumers","s":"Message handlers designed so processing the same message twice has the same result as processing it once.","w":"Queues, Kafka and webhooks redeliver messages after timeouts, crashes or lost acks. An idempotent consumer detects or neutralizes repeats. Approaches: track processed message IDs; use natural keys with unique constraints (one invoice per order ID); use operations that are naturally idempotent (set status = 'shipped' instead of increment counter); check state before acting (skip if already shipped).","y":"Without it, duplicates turn into double emails, double charges, double inventory deductions or double loyalty points.","h":["Give every message a unique ID (or derive one from business data).","Store processed IDs in a durable table with a unique constraint, inside the same transaction as the effect.","Prefer absolute updates (SET) over relative ones (+1) when possible.","Use unique business constraints (UNIQUE(order_id) on invoices).","For external side effects (payments, emails), pass an idempotency key to the provider.","Expire old processed IDs only after redelivery is no longer possible.","Never rely only on an in-memory set; it’s lost on restart and not shared."],"code":"def handle(msg):\n    with db.transaction():\n        inserted = db.execute(\n          \"INSERT INTO processed(id) VALUES (%s) ON CONFLICT DO NOTHING\",\n          msg.id).rowcount\n        if not inserted: return        # duplicate, skip\n        create_invoice(msg.order_id)   # UNIQUE(order_id) too","e":"Stripe explicitly warns that webhook endpoints may receive the same event more than once and recommends logging processed event IDs to skip duplicates.","p":["In-memory dedupe sets","Checking “processed?” in one transaction and doing the work in another","Relative updates like balance += amount without dedupe"],"v":["Message Deduplication","Deduplication DETECTS repeated messages by ID. Idempotency makes repeating HARMLESS even if a duplicate slips through. Use both for important effects."],"f":["Message ID m-77 arrives","Insert into processed (unique)","New → do work in same TX","Repeat m-77 → conflict, skip"],"q":[["Why store processed IDs in the same transaction as the business change?","So either both happen or neither; otherwise a crash between them causes loss or duplication."],["Give an example of a naturally idempotent operation.","Setting a field to a value (status = 'paid'), as opposed to incrementing a counter."],["Why not use an in-memory set for dedupe?","It disappears on restart and isn’t shared across consumer instances."],["Give a naturally idempotent way to record 'order shipped'.","UPDATE orders SET status='shipped' WHERE id=?; repeating it changes nothing further."],["How long should processed IDs be kept?","At least as long as duplicates could arrive (broker retention, provider retry windows)."]],"r":[119,126,1,39],"k":["A consumer keeps processed message IDs in an in-memory set. What breaks?",["Nothing","After a restart or on another instance the set is empty, so duplicates get processed","Messages arrive slower","The broker rejects messages"],1,"Dedupe state must be durable and shared, ideally in the same transaction as the business change."],"sl":"idempotent-consumers"},{"n":121,"c":"sec","t":"Data Retention & Deletion","s":"Deciding how long you keep each type of data, and reliably deleting it everywhere when that time is up or a user asks.","w":"Data lives in many places: main database, replicas, caches, search indexes, logs, analytics warehouses, backups, third-party tools. A retention policy defines, per data type, how long it’s kept and why (e.g. invoices 8 years for tax law, raw logs 30 days, deleted accounts erased in 30 days). Deletion must cover all copies. Laws like GDPR and India’s DPDP Act give users rights to have their data erased.","y":"Keeping everything “just in case” increases breach impact, storage cost and legal risk. Fines for mishandling personal data can be huge.","h":["Inventory personal data: what you store, where, and why.","Set retention per category based on purpose and legal requirements.","Automate expiry: TTL indexes, partition drops, lifecycle rules on object storage, log retention settings.","Build a deletion workflow that fans out to every system (DB, search, cache, analytics, third-party processors) and records proof.","Handle backups: let them expire on schedule, and make sure restores don’t resurrect deleted users (re-apply deletions after restore).","Respect legal holds that pause deletion for litigation.","Prefer anonymization/aggregation when you need data for analytics but not identity.","Crypto-shredding: encrypt each user’s data with their own key, and delete the key to make data unreadable everywhere."],"e":"Under GDPR, Meta, Amazon and others have received fines in the hundreds of millions of euros for data handling violations, showing regulators take retention and processing rules seriously.","p":["Deleting from the main DB but forgetting logs, search indexes and analytics","Restoring a backup that brings deleted users back","No owner for the retention policy"],"v":["Backups","Backups exist to KEEP data for recovery. Retention policy decides how long ANY copy, including backups, may exist."],"f":["Data reaches retention limit","Delete in DB, search, cache","Notify processors + logs","Backups expire on schedule"],"q":[["Why is deleting user data hard?","Copies spread across many systems (replicas, caches, logs, analytics, backups, third parties)."],["What is crypto-shredding?","Encrypting each user’s data with a unique key and deleting the key, making all copies unreadable."],["How do you handle backups for deletion requests?","Let backups expire within a defined period and re-apply deletions if a backup is ever restored."],["What is a legal hold?","An instruction to keep specific data (for litigation or investigation) that pauses normal deletion."],["How do you stop a backup restore from bringing deleted users back?","Keep a log of deletions and re-apply it after any restore."]],"r":[97,50,115,154],"k":["A user asks to be deleted. You delete their row in the main DB. What have you probably missed?",["Nothing","Copies in logs, search indexes, caches, analytics, third-party tools and backups","The user’s password","The CDN"],1,"Data spreads across many systems; deletion must fan out to all of them, with backups expiring on a defined schedule."],"sl":"data-retention-and-deletion"},{"n":122,"c":"sec","t":"Zero Trust Security","s":"Never trust a request just because it comes from “inside” the network; verify identity and permission for every access.","w":"The old model: a strong firewall around the office/data centre, and everything inside trusts each other (castle and moat). Zero trust assumes attackers may already be inside. Every user, device and service must authenticate, be authorized for the specific resource, and be continuously evaluated. Google’s BeyondCorp is the famous implementation.","y":"With perimeter security, one phished laptop or compromised server can move freely to databases and admin tools (“lateral movement”). Remote work and cloud made the perimeter mostly meaningless anyway.","h":["Strong identity for everyone: SSO with MFA, preferably phishing-resistant (security keys/passkeys).","Check device health (managed, updated, encrypted) for sensitive access.","Authorize each request to each resource with least privilege, not network location.","Service-to-service: mTLS with workload identities (SPIFFE, service mesh) and per-service authorization.","Segment networks (micro-segmentation) so a breach can’t spread.","Replace VPN-everything with identity-aware proxies for internal apps.","Log and monitor every access; re-evaluate continuously.","It’s a journey and architecture principle, not one product to buy."],"e":"After the 2009 “Operation Aurora” attacks, Google built BeyondCorp, letting employees access internal apps from any network, with access based on user identity and device state, not on being in the office.","p":["Calling a VPN “zero trust”","Internal services with no authentication","MFA via SMS only for admins","Buying a product and skipping the identity work"],"v":["Perimeter Security","Perimeter: trust anything inside the walls. Zero trust: trust nothing by location; verify identity, device and permission every time."],"f":["Request to internal app","Verify user + MFA","Check device + policy","Allow only that resource, log it"],"q":[["What is lateral movement?","An attacker who compromised one machine moving to others within the network, often because internal traffic is trusted."],["Name three building blocks of zero trust.","Strong identity with MFA, device posture checks and least-privilege per-request authorization (plus mTLS between services)."],["Is a VPN zero trust?","No; a VPN typically grants broad network access once connected, which is the perimeter model."],["Why are passkeys or security keys better than SMS codes?","They’re phishing-resistant: they’re bound to the real site’s origin, while SMS codes can be phished or SIM-swapped."],["How does micro-segmentation limit breaches?","Services can only talk to the specific services they need, so a compromised one can’t freely reach everything."]],"r":[48,51,118,139],"k":["Which statement best describes zero trust?",["Trust everything inside the VPN","Verify identity, device and permission for every request, regardless of network location","Block all traffic","Use only one firewall"],1,"Location no longer implies trust; every access is authenticated and authorized."],"sl":"zero-trust-security"},{"n":123,"c":"obs","t":"Request Correlation IDs","s":"A unique ID attached to each request and passed through every service, so all related logs can be found together.","w":"When a request enters (at the gateway or first service), it gets an ID like req_8f2a91. Every service includes it in every log line and forwards it in a header (X-Request-ID, or the trace ID from traceparent) to the next service and into queue messages. Searching that one ID shows the full story of the request.","y":"One user action can generate logs across 10 services mixed with thousands of other requests. Without a shared ID, connecting them is guesswork based on timestamps.","h":["Generate the ID at the edge; if the client sends one, accept it only if valid (format/length) or create a fresh one.","Store it in request context (middleware, MDC in Java, contextvars in Python, AsyncLocalStorage in Node) so all logs include it automatically.","Forward it on every outbound HTTP call and in message metadata.","Return it in the response header so support can ask users for it (\"error reference: req_8f2a91\").","Prefer using the OpenTelemetry trace ID, so logs and traces line up.","Don’t treat it as a secret or authentication token."],"code":"// Express middleware\napp.use((req, res, next) => {\n  const id = valid(req.get('X-Request-ID')) || crypto.randomUUID();\n  als.run({ requestId: id }, () => {\n    res.set('X-Request-ID', id);\n    next();\n  });\n});","e":"A support agent gets \"Something went wrong. Reference: req_8f2a91\" from a customer screenshot. Engineers search it and see the full path: gateway → orders → payments, where a timeout occurred.","p":["Generating a new ID in each service, breaking the chain","Not passing it through queues","Trusting arbitrary client-supplied IDs (log injection)"],"v":["Distributed Tracing","A correlation ID is just a shared label to LINK logs. Distributed tracing adds structure: spans, parent/child relations and timing. Using the trace ID as the correlation ID gives you both."],"f":["Gateway assigns req_8f2a","Header passed to each service","Every log line includes it","Search one ID → full story"],"q":[["Where should a correlation ID be created?","At the entry point to the system, such as the API gateway or first service."],["How do you make every log line include it automatically?","Store it in request-scoped context (MDC, contextvars, AsyncLocalStorage) used by the logger."],["Correlation ID vs trace ID?","A correlation ID links logs; a trace ID also anchors spans with timing and hierarchy. Many systems use the trace ID as the correlation ID."],["Should you trust a client-provided X-Request-ID?","Only after validating its format and length; otherwise generate a new one to avoid log injection or collisions."],["Why return the correlation ID in error responses?","Users and support can quote it, letting engineers find the exact failing request."]],"r":[102,100,105,17],"k":["A customer reports an error and gives you 'reference req_8f2a'. How does a correlation ID help?",["It decrypts the request","You search logs for that ID and see every service’s lines for that request","It retries the request","It identifies the user"],1,"Because every service logs the same ID, one search reconstructs the request’s whole path."],"sl":"request-correlation-ids"},{"n":124,"c":"net","t":"API Contracts & Contract Testing","s":"Writing down exactly what an API accepts and returns, then automatically testing that both sides still agree.","w":"An API contract describes endpoints, request/response fields, types, required fields and error formats, often in OpenAPI (REST), Protobuf (gRPC), AsyncAPI or JSON Schema (events). Contract testing checks compatibility without spinning up the whole system. In consumer-driven contract testing (e.g. Pact), each consumer records what it expects; the provider’s CI verifies it still satisfies every consumer’s expectations.","y":"End-to-end tests across many services are slow and flaky. Without contract tests, a backend team renames a field, all their own tests pass, and the mobile app breaks in production.","h":["Define the contract first (OpenAPI/Protobuf) and generate clients, server stubs and docs from it.","Lint contracts and run breaking-change detection in CI (openapi-diff, buf breaking for Protobuf).","Use consumer-driven contracts (Pact) between services you own: consumers publish expectations, providers verify them in CI.","Block deploys that would break a consumer (“can I deploy?” checks).","Test only what consumers actually use, not every internal detail.","Version or deprecate properly when breaking changes are unavoidable."],"code":"# Pact consumer test (simplified)\ngiven \"order 42 exists\"\nupon receiving GET /orders/42\nwill respond with 200 {\n  \"id\": 42, \"status\": like(\"paid\"), \"total\": like(999)\n}","e":"A bank’s backend team ran Pact verification in CI. Removing a field “nobody used” failed the build because the Android app’s contract still expected it, catching the break before release.","p":["Contracts in a wiki that drift from reality","Relying only on slow end-to-end tests","Over-specified contracts that break on harmless changes"],"v":["API Versioning","Contract testing DETECTS breaking changes early. API versioning is how you RELEASE a breaking change without hurting existing clients."],"f":["Consumer publishes expectations","Provider CI verifies","!Breaking change detected","Fix or version before deploy"],"q":[["What is consumer-driven contract testing?","Consumers define the interactions they rely on; providers verify they satisfy them, ensuring changes don’t break real usage."],["Why are contract tests better than only end-to-end tests?","They’re fast, isolated and pinpoint which interaction broke, while E2E tests are slow, flaky and need everything running."],["What tools detect breaking changes in schemas?","openapi-diff/oasdiff for OpenAPI, buf breaking for Protobuf, and schema registries for events."],["What does 'can I deploy?' mean in contract testing?","A check against the contract broker that this version is compatible with the versions of consumers/providers currently deployed."],["How do you avoid over-specified contracts?","Match on types and required fields (e.g. like('paid')) rather than exact values, and only include fields consumers use."]],"r":[77,57,150,65],"k":["What does consumer-driven contract testing catch that provider unit tests miss?",["Slow queries","A provider change that breaks what a real consumer relies on","CSS bugs","Memory leaks"],1,"Provider tests check the provider’s own expectations; consumer contracts check real usage by each client."],"sl":"api-contracts-and-contract-testing"},{"n":125,"c":"db","t":"Database Transactions & ACID","s":"A transaction groups several database changes so they all happen together or not at all. ACID describes the guarantees.","w":"A = Atomicity: all changes commit, or none do. C = Consistency: constraints (foreign keys, unique, checks) are never violated. I = Isolation: concurrent transactions don’t see each other’s half-done work, to a degree set by the isolation level. D = Durability: once committed, data survives crashes (written to the write-ahead log). Isolation levels from weaker to stronger: Read Uncommitted, Read Committed, Repeatable Read, Serializable.","y":"Transferring money means debit one account AND credit another. If the server crashes between the two, money disappears without a transaction. Concurrency without proper isolation causes lost updates and anomalies.","h":["Wrap related writes in a transaction: BEGIN … COMMIT (or ROLLBACK on error).","Keep transactions short: no HTTP calls, no user waits inside.","Know your default isolation (Postgres: Read Committed; MySQL InnoDB: Repeatable Read).","Read Committed can still have lost updates; use atomic updates, SELECT … FOR UPDATE or optimistic version checks.","Use Serializable for complex invariants, and retry on serialization failures.","Use constraints in the DB (UNIQUE, CHECK balance >= 0, FOREIGN KEY) as the last line of defence.","Remember: a DB transaction doesn’t cover external systems (emails, payment APIs); use the outbox or sagas for those."],"code":"BEGIN;\nUPDATE accounts SET balance = balance - 500 WHERE id = 1;\nUPDATE accounts SET balance = balance + 500 WHERE id = 2;\n-- CHECK (balance >= 0) rejects overdraft automatically\nCOMMIT;   -- both or neither","e":"Every UPI or card payment in a bank’s core system relies on ACID transactions so a debit never happens without the matching credit and ledger entries.","p":["Calling external APIs inside a transaction","Assuming the default isolation prevents all anomalies","Not retrying serialization/deadlock failures","Autocommit mode splitting related writes"],"v":["ACID vs BASE","ACID: strict guarantees, typical of relational DBs. BASE (Basically Available, Soft state, Eventually consistent): favours availability and scale, typical of some distributed NoSQL systems. Real systems mix both."],"f":["BEGIN","Debit A, credit B","!Crash midway → rollback","COMMIT: both durable"],"q":[["Explain each letter of ACID.","Atomicity (all or nothing), Consistency (constraints hold), Isolation (concurrent transactions don’t interfere improperly), Durability (committed data survives crashes)."],["What anomaly can happen at Read Committed?","Lost updates and non-repeatable reads: two transactions read the same value and both write, one overwriting the other."],["Why not call a payment API inside a DB transaction?","It holds locks during slow network calls, and the external call can’t be rolled back if the transaction aborts."],["What does durability depend on physically?","The commit record being flushed to stable storage (the WAL with fsync) before the commit is acknowledged."],["Why keep transactions short?","Long transactions hold locks, block others, increase deadlock risk and bloat MVCC versions."]],"r":[133,132,26,34],"k":["A bank transfer debits account A, then the server crashes before crediting B. With a transaction, what happens on restart?",["A stays debited","The incomplete transaction is rolled back, so neither change applies","B is credited automatically","Both are applied twice"],1,"Atomicity: uncommitted transactions are undone during recovery, so the transfer is all or nothing."],"sl":"database-transactions-and-acid"},{"n":126,"c":"msg","t":"Idempotency vs. Deduplication","s":"Idempotency means repeating an operation is harmless by design. Deduplication means detecting a repeat and skipping it. Related, but not the same.","w":"Idempotent operations: “set order 42 status to paid” or \"PUT /users/7 {name: Asha}\". Doing it twice changes nothing more. Deduplication: remembering IDs you’ve seen (message IDs, idempotency keys, event IDs) and ignoring repeats. Some operations are naturally idempotent; others (charge ₹500, add 10 points, send email) are not, so they need deduplication to become effectively idempotent.","y":"Engineers often add a dedupe check and assume they’re safe, but if the check and the effect aren’t atomic, two copies can both pass the check (a race). Or dedupe windows expire and a late duplicate gets through.","h":["Prefer naturally idempotent designs where possible: absolute values (SET), upserts, unique business keys.","For non-idempotent effects, deduplicate with a durable record of IDs.","Make the dedupe record and the effect atomic: same DB transaction, or a unique constraint on the effect itself (UNIQUE(order_id) on payments).","Choose dedupe retention longer than the maximum redelivery/retry window.","Scope keys correctly (per user/tenant/operation).","For external side effects, use the provider’s idempotency key support."],"code":"-- naturally idempotent\nUPDATE orders SET status = 'paid' WHERE id = 42;\n\n-- not idempotent → needs dedupe\nINSERT INTO points_ledger (event_id, user_id, points)\nVALUES ('evt_9', 7, 10)      -- UNIQUE(event_id)\nON CONFLICT (event_id) DO NOTHING;","e":"A loyalty system checked Redis for “event seen?” then wrote points to Postgres separately. Two consumer instances processed the same event in parallel and both passed the Redis check. Moving to a UNIQUE(event_id) ledger insert fixed it.","p":["Non-atomic “check then act” deduplication","Dedupe windows shorter than retry windows","Assuming “idempotent” just because you added a dedupe cache"],"v":["Idempotency Keys","An idempotency key is a specific DEDUPLICATION mechanism for client requests to an API. Idempotency is the broader PROPERTY you want; deduplication is one way to get it."],"f":["Duplicate event arrives","Natural idempotency? SET again, harmless","Otherwise: unique insert","Conflict → skip atomically"],"q":[["What’s the difference between idempotency and deduplication?","Idempotency is a property where repeats have no additional effect; deduplication is a technique that detects and drops repeated inputs."],["Why must the dedupe check be atomic with the effect?","Otherwise two concurrent duplicates can both pass the check before either records it, causing a double effect."],["How long should dedupe IDs be kept?","Longer than the maximum time a duplicate could arrive (retry and redelivery windows)."],["Why is a Redis 'seen?' check plus a separate DB write not fully safe?","Two consumers can both check before either records the ID, and the two systems can fail independently. Use a unique constraint in the same transaction as the effect."],["Give a business example of using a unique constraint for deduplication.","UNIQUE(order_id) on invoices: a duplicate 'create invoice' event fails to insert a second invoice."]],"r":[1,120,119,113],"k":["Which operation is naturally idempotent?",["balance = balance + 100","INSERT a new payment row","UPDATE orders SET status = 'paid' WHERE id = 42","Send an SMS"],2,"Setting a value to a fixed result gives the same state no matter how many times it runs."],"sl":"idempotency-vs-deduplication"},{"n":127,"c":"dist","t":"Consistent Hashing","s":"A way to spread keys across servers so that adding or removing a server moves only a small share of the keys, not almost all of them.","w":"Simple hashing does server = hash(key) % N. If N changes from 4 to 5, almost every key lands on a different server, so your cache is suddenly empty or your data must all move. Consistent hashing puts servers and keys on an imaginary circle (a “ring”) of hash values. Each key goes to the first server you meet walking clockwise. Add a server and it only takes keys from its neighbour; remove one and only its keys move to the next server.","y":"Distributed caches (Memcached clusters), databases (Cassandra, DynamoDB), CDNs and load balancers constantly add and remove nodes. Without consistent hashing, every scale-up or crash would cause a giant reshuffle: cache hit rate drops to zero and the database gets flooded.","h":["Hash every server name onto a ring of numbers (e.g. 0 to 2^32).","Hash each key onto the same ring; walk clockwise to the first server: that server owns the key.","Use virtual nodes: put each physical server on the ring 100–200 times at different points. This spreads load evenly and makes a dead server’s keys spread across many servers instead of one.","Give bigger servers more virtual nodes (weighting).","For replication, store the key on the next 2–3 distinct servers clockwise.","When a node joins or leaves, move only the keys in the affected ring segments."],"code":"ring = sorted((hash(f\"{server}#{i}\"), server)\n              for server in servers for i in range(150))\ndef owner(key):\n    h = hash(key)\n    i = bisect(ring, (h,))          # first point clockwise\n    return ring[i % len(ring)][1]\n# with N servers, adding one moves only ~1/(N+1) of keys","e":"Amazon’s Dynamo paper (2007) made consistent hashing with virtual nodes famous; Cassandra, Riak and DynamoDB all use the idea. Discord uses it to route each chat server’s traffic to the right node.","p":["Using hash % N and being surprised that scaling empties the cache","No virtual nodes, so one server owns a huge arc and gets overloaded","Forgetting replication, so a dead node’s data is gone"],"v":["Sharding","Sharding is the IDEA of splitting data across servers. Consistent hashing is one smart WAY to decide which shard owns each key so resharding is cheap."],"f":["Servers placed on hash ring","Key hashed onto ring","Walk clockwise → owner","Add server: only neighbour’s keys move"],"q":[["Why is hash(key) % N bad when servers change?","Changing N changes the result for almost every key, so nearly all data or cache entries must move."],["What are virtual nodes and why use them?","Each physical server appears many times on the ring. This balances load and spreads a failed server’s keys across many servers."],["Roughly how many keys move when you add one server to N?","About 1/(N+1) of all keys, instead of nearly all of them."],["Where is consistent hashing used?","Distributed caches, Cassandra/DynamoDB-style databases, CDNs and some load balancers."],["How does consistent hashing help with replication?","Store each key on the next 2–3 distinct nodes clockwise, so losing one node leaves copies on its neighbours."]],"r":[28,136,134,8],"num":"8 servers, add a 9th:\nhash % N: ~8/9 ≈ 89% of keys move.\nConsistent hashing: ~1/9 ≈ 11% of keys move.\n150 virtual nodes per server keeps load imbalance to a few percent.","k":["You add one cache node to a cluster of 9 using consistent hashing. Roughly what share of keys move?",["About 90%","About 10%","None","50%"],1,"Only keys in the new node’s ring segments move: about 1/(N+1)."],"sl":"consistent-hashing"},{"n":128,"c":"scale","t":"Bloom Filters","s":"A tiny, super-fast data structure that can tell you “definitely NOT in the set” or “PROBABLY in the set”.","w":"A Bloom filter is a bit array plus a few hash functions. To add an item, hash it with each function and set those bits to 1. To check an item, look at its bits: if any is 0, the item was never added (100% sure). If all are 1, it was probably added, but those bits might have been set by other items (a false positive). It never gives false negatives. It uses a tiny fraction of the memory of storing the real items.","y":"Checking “does this exist?” against a huge disk-based set is slow. A Bloom filter in memory can skip most of those expensive lookups. It’s a classic interview answer for “check if a username is taken among a billion users” or “avoid recrawling URLs”.","h":["Pick the expected number of items (n) and acceptable false positive rate (e.g. 1%).","Size the bit array and number of hash functions from those (about 10 bits per item gives ~1% false positives).","On add: set k bits. On check: if any bit is 0 → definitely absent; else → maybe present, so confirm with the real store.","Standard Bloom filters can’t delete items; use a Counting Bloom filter or Cuckoo filter if you need deletes.","Rebuild or use scalable Bloom filters when the item count grows past the plan.","Use built-ins: RedisBloom (BF.ADD / BF.EXISTS), Guava BloomFilter, or databases that use them internally."],"code":"BF.RESERVE usernames 0.01 1000000000   # 1% error, 1B items\nBF.ADD usernames \"asha_rao\"\nBF.EXISTS usernames \"asha_rao\"   # 1 → maybe, check DB\nBF.EXISTS usernames \"zzq_123\"    # 0 → definitely free","e":"Cassandra, HBase and RocksDB keep a Bloom filter per data file, so a read can skip files that definitely don’t contain the key, avoiding many disk reads. Google Chrome once used a Bloom filter to check URLs against a malicious-site list locally.","p":["Treating “maybe present” as “definitely present” without confirming","Undersizing it, so it fills up and false positives skyrocket","Expecting to delete items from a plain Bloom filter"],"v":["Hash Set","A hash set stores every item and answers exactly, using lots of memory. A Bloom filter stores only bits, uses ~1 byte per item, and answers “no” or “maybe”."],"f":["Check “asha_rao”","Hash → look at k bits","Any bit 0 → definitely new","All 1 → maybe, confirm in DB"],"q":[["Can a Bloom filter have false negatives?","No. If it says an item is absent, it’s definitely absent. It can only have false positives."],["How do you reduce the false positive rate?","Use more bits per item (a larger array) and the right number of hash functions for that size."],["Why can’t you delete from a standard Bloom filter?","A bit may be shared by several items; clearing it could make other items look absent. Use counting or cuckoo filters for deletes."],["Give a system design use.","Skip disk lookups for keys that don’t exist (LSM-tree databases), check username availability, avoid re-crawling URLs, or filter already-seen recommendations."],["What happens to the false-positive rate if you insert many more items than planned?","It rises sharply as more bits become 1; size for growth or use scalable Bloom filters."]],"r":[131,20,153,134],"num":"1 billion usernames, 1% false-positive target ≈ 9.6 bits per item.\nMemory ≈ 1e9 × 9.6 bits ≈ 1.2 GB (vs tens of GB to store the names).\nAt 1% FPR, 99% of 'definitely free' checks skip the database entirely.","k":["A Bloom filter says an item is present. What do you know?",["It is definitely present","It is probably present; confirm with the real store","It is definitely absent","The filter is broken"],1,"Bloom filters can give false positives, never false negatives."],"sl":"bloom-filters"},{"n":129,"c":"db","t":"SQL vs NoSQL","s":"SQL databases store data in tables with strict structure and powerful queries; NoSQL databases trade some of that for flexibility and easier horizontal scaling.","w":"SQL (relational) databases like PostgreSQL and MySQL use tables, rows, a fixed schema, joins and ACID transactions. NoSQL is a family: document stores (MongoDB, store JSON-like documents), key-value stores (Redis, DynamoDB, look up by key super fast), wide-column stores (Cassandra, huge write-heavy datasets), and graph databases (Neo4j, relationships like friends-of-friends).","y":"It’s one of the first decisions in any design interview, and the wrong choice causes pain for years. The honest answer is usually: start with SQL unless you have a specific reason not to.","h":["Default to SQL (Postgres) for most business apps: orders, users, payments, anything with relationships and transactions.","Choose document stores when records are self-contained, shapes vary, and you read the whole document at once (product catalogs, CMS content).","Choose key-value when access is always by a key and must be extremely fast or massive (sessions, carts, caches, DynamoDB at huge scale).","Choose wide-column for enormous write volume and simple access patterns (time series, messages, IoT events).","Choose graph when queries walk relationships many levels deep (social graphs, fraud rings, recommendations).","With NoSQL, design tables around your queries first, because you can’t rely on flexible joins later.","It’s fine to use both: Postgres for core data, Redis for caching, Elasticsearch for search (“polyglot persistence”)."],"e":"Discord stores trillions of messages in a wide-column database (moved from Cassandra to ScyllaDB) because messages are written constantly and read by channel and time. But billing and accounts at most companies still live in relational databases.","p":["Choosing MongoDB “because it scales” for a highly relational app, then rebuilding joins in code","Assuming SQL can’t scale (it scales very far with indexes, replicas and partitioning)","Designing a NoSQL schema like SQL tables and then needing joins"],"v":["Schema-less","NoSQL isn’t truly schema-less: the schema just lives in your application code instead of the database. You still need to manage changes to it."],"f":["What are the access patterns?","Relations + transactions → SQL","Key lookups at huge scale → KV","Massive writes → wide-column"],"q":[["When would you pick NoSQL over SQL?","Massive scale with simple, known access patterns, flexible or nested document shapes, very high write throughput, or graph-style queries."],["Name the four main NoSQL types with an example each.","Document (MongoDB), key-value (Redis/DynamoDB), wide-column (Cassandra), graph (Neo4j)."],["Can SQL databases scale horizontally?","Yes, with read replicas, partitioning and sharding (Vitess, Citus), or distributed SQL like CockroachDB/Spanner, though it takes more effort."],["What is polyglot persistence?","Using different databases for different jobs in the same system, e.g. Postgres + Redis + Elasticsearch."],["What should you design first when using a NoSQL store like DynamoDB?","Access patterns (queries) first, then keys and indexes around them, since flexible joins aren’t available later."]],"r":[130,125,131,154],"k":["An app stores orders, payments and customers with many relationships and needs transactions. Best default choice?",["A key-value store","A relational database like PostgreSQL","A graph database","Only a cache"],1,"Relational databases fit relationships, joins, constraints and ACID transactions; start there unless you have a specific reason not to."],"sl":"sql-vs-nosql"},{"n":130,"c":"db","t":"Normalization vs Denormalization","s":"Normalization stores each fact once to avoid duplicates; denormalization deliberately copies data to make reads faster.","w":"Normalized: orders table stores customer_id, and the customer’s name lives only in the customers table. To show an order with the name, you JOIN. Denormalized: the orders table also stores customer_name, so no join is needed, but if the customer changes their name you must update it in many places.","y":"Normalization keeps data correct and writes simple. Denormalization makes reads fast, which matters at scale (feeds, dashboards, NoSQL). Interviewers love asking when to do which.","h":["Start normalized (roughly 3rd normal form): each table about one thing, no repeated groups, no facts depending on non-key columns.","Measure: denormalize only where joins are a proven bottleneck on hot read paths.","Typical denormalizations: storing counts (comment_count on posts), copying display fields (author_name on comments), pre-computed summary tables.","Keep copies in sync: update in the same transaction, use triggers, or update asynchronously from events (accepting brief staleness).","Prefer materialized views or read models (CQRS) over sprinkling copies everywhere.","In NoSQL, denormalization is the default: shape data around your queries."],"code":"-- normalized: correct, needs a JOIN\nSELECT o.id, c.name FROM orders o JOIN customers c ON c.id = o.customer_id;\n\n-- denormalized counter: fast read, must stay in sync\nUPDATE posts SET comment_count = comment_count + 1 WHERE id = 7;","e":"Instagram stores like counts directly on each post instead of counting the likes table on every view, because counting millions of rows per page load would be far too slow.","p":["Denormalizing everything early and fighting inconsistent data forever","Forgetting to update one of the copies","Normalizing so strictly that simple screens need 10 joins"],"v":["Caching","Denormalization stores duplicate data permanently in the database itself. A cache keeps a temporary copy outside it. Both trade freshness work for read speed."],"f":["Normalized: fact stored once","!Hot page needs 5 joins","Denormalize that field","Keep copies in sync"],"q":[["What problem does normalization solve?","Duplicate data and update anomalies, where changing a fact in one place leaves stale copies elsewhere."],["When should you denormalize?","When read performance on a hot path is a proven problem and you can keep the copies in sync acceptably."],["How do you keep denormalized data consistent?","Update copies in the same transaction, use triggers, or propagate via events with eventual consistency."],["What is an update anomaly?","Changing a fact stored in several places but missing one copy, leaving inconsistent data; normalization prevents it."],["What’s a materialized view and how does it relate to denormalization?","A stored precomputed query result; it denormalizes data in a managed way and can be refreshed."]],"r":[129,114,6,145],"k":["Posts store comment_count (denormalized). A comment is added. What must happen?",["Nothing","comment_count must be updated too (same transaction or reliably via events)","The post must be deleted","The cache must be cleared only"],1,"Denormalized copies must be kept in sync, or they drift from reality."],"sl":"normalization-vs-denormalization"},{"n":131,"c":"db","t":"B-Trees vs LSM Trees","s":"The two main ways databases store data on disk: B-trees are great for reads, LSM trees are great for heavy writes.","w":"A B-tree (used by Postgres, MySQL InnoDB) keeps data sorted in fixed-size pages and updates them in place, so lookups take a few page reads. An LSM tree (Log-Structured Merge tree, used by Cassandra, RocksDB, LevelDB, ScyllaDB) first writes to an in-memory table plus a log, then flushes sorted immutable files (SSTables) to disk, and later merges them in the background (compaction). Writes are sequential and very fast; reads may check several files.","y":"This is why some databases handle millions of writes per second and others are better at complex reads. Interviewers use it to test whether you understand storage trade-offs.","h":["B-tree: pick for read-heavy, mixed workloads with range queries and transactions.","LSM: pick for write-heavy workloads like logs, metrics, messages, IoT.","LSM reads use Bloom filters per file to skip files that don’t contain the key.","LSM needs compaction tuning: too little = slow reads and more disk use; too much = disk IO spikes.","Know the “amplification” trade-offs: B-trees have higher write amplification for random writes; LSM has read amplification and background compaction cost.","Deletes in LSM are tombstones that disappear only after compaction."],"e":"Facebook built RocksDB (an LSM engine) and moved parts of MySQL onto it (MyRocks) to cut storage and write costs for huge, write-heavy tables.","p":["Using an LSM store for a heavy random-read workload without tuning","Ignoring compaction and running out of disk","Deleting lots of data in Cassandra and hitting tombstone slowdowns"],"v":["Database Indexing","B-tree is also the usual structure for an INDEX inside a SQL database. LSM vs B-tree is about the whole storage engine design."],"f":["Write arrives","LSM: memtable + log","Flush sorted file (SSTable)","Background compaction merges"],"q":[["Why are LSM trees fast for writes?","Writes go to memory and an append-only log, then flush as sequential files; no random in-place disk updates."],["Why can LSM reads be slower?","A key may exist in several files, so reads may check multiple SSTables (helped by Bloom filters and compaction)."],["Which databases use each?","B-tree: Postgres, MySQL InnoDB. LSM: Cassandra, RocksDB, LevelDB, ScyllaDB, HBase."],["What is compaction?","Background merging of sorted files in an LSM tree to remove overwritten/deleted entries and reduce the number of files reads must check."],["What are tombstones?","Markers recording deletes in LSM stores; data is only physically removed during compaction, and too many tombstones slow reads."]],"r":[132,128,20,129],"k":["Why do LSM-tree databases use Bloom filters per data file?",["To encrypt data","To skip files that definitely don’t contain the key, avoiding disk reads","To compress data","To order writes"],1,"A read may otherwise check many SSTables; Bloom filters rule most of them out cheaply."],"sl":"b-trees-vs-lsm-trees"},{"n":132,"c":"db","t":"Write-Ahead Log (WAL)","s":"Before changing data, the database first writes the change to an append-only log, so it can recover after a crash.","w":"Changing data pages directly is slow and risky: a crash halfway leaves a corrupted page. Instead, the database appends a record \"transaction 91: set balance of account 7 to 500\" to the WAL and forces it to disk (fsync). Only then does it confirm COMMIT. The actual data pages are updated later in the background. After a crash, the database replays the WAL to redo committed changes.","y":"The WAL is how databases give Durability (the D in ACID). It also powers replication (replicas replay the leader’s log), point-in-time recovery and change data capture.","h":["Understand that commit = WAL record safely on disk, not data pages updated.","Put the WAL on fast storage; commit latency depends on its fsync speed.","Group commit batches many transactions into one fsync for higher throughput.","Archive WAL files to get point-in-time recovery (restore a base backup, then replay logs).","Stream the WAL to replicas for replication (Postgres streaming replication, MySQL binlog).","Use it for CDC tools like Debezium, which read the log to publish changes.","Never disable fsync in production to “go faster”: you lose durability."],"e":"Kafka’s whole design is essentially a distributed append-only log, the same idea as a WAL, which is why it’s so fast at writes.","p":["Turning off fsync or synchronous_commit without understanding the data-loss risk","Not archiving WAL, so point-in-time recovery is impossible","WAL disk filling up because a replica or replication slot stopped consuming"],"v":["Event Sourcing","A WAL is an internal, low-level log the database uses for crash recovery. Event sourcing is an application design where business events are the source of truth."],"f":["UPDATE balance","Append to WAL + fsync","COMMIT confirmed","!Crash → replay WAL on restart"],"q":[["Why write to a log before changing data pages?","Appending to a log is fast and sequential, and replaying it after a crash restores all committed changes, guaranteeing durability."],["How is the WAL used for replication?","Replicas receive and replay the leader’s WAL records to apply the same changes."],["What is point-in-time recovery?","Restoring a base backup and replaying archived WAL up to a chosen moment."],["What is group commit?","Combining several transactions' log writes into one fsync to increase throughput."],["What happens if a replication slot stops being consumed?","The database keeps WAL for it indefinitely, which can fill the disk."]],"r":[125,30,149,97],"k":["When a database confirms COMMIT, what has typically been made durable?",["All data pages on disk","The transaction’s record in the write-ahead log","Only memory","The replica copy"],1,"The WAL record is flushed; data pages are written later and can be reconstructed from the log after a crash."],"sl":"write-ahead-log-wal"},{"n":133,"c":"db","t":"Isolation Levels","s":"Settings that decide how much concurrent transactions can see each other’s in-progress or recent changes.","w":"From weakest to strongest: Read Uncommitted (can see others' uncommitted data: dirty reads), Read Committed (only committed data, but rereading a row may give a new value: non-repeatable read), Repeatable Read (rows you read stay the same; in some DBs new rows can still appear: phantoms), Serializable (behaves as if transactions ran one at a time). Stronger isolation = fewer weird bugs but more blocking or retries.","y":"Many real bugs (double bookings, wrong balances) come from assuming the database is “serializable” when it’s actually Read Committed. Interviewers often ask you to name the anomalies.","h":["Know the defaults: Postgres and SQL Server use Read Committed; MySQL InnoDB uses Repeatable Read.","Learn the anomalies: dirty read, non-repeatable read, phantom read, lost update, write skew.","For most CRUD, Read Committed plus atomic updates is fine.","For “check then write” invariants (only one doctor on call may go off duty), use SELECT ... FOR UPDATE or Serializable.","With Serializable, catch serialization failures and retry the whole transaction.","Prefer database constraints (UNIQUE, CHECK) as a final guard."],"code":"BEGIN ISOLATION LEVEL SERIALIZABLE;\nSELECT count(*) FROM doctors WHERE on_call AND shift = 1;\nUPDATE doctors SET on_call = false WHERE id = 7;\nCOMMIT;  -- may fail with serialization error → retry","e":"Write skew classic: two doctors both check “at least 2 on call”, both see yes, both go off duty, and nobody is on call. Read Committed and even Repeatable Read can allow this; Serializable or explicit locks prevent it.","p":["Assuming transactions automatically prevent all races","Using Serializable without retry logic","Picking Read Uncommitted for speed and reading garbage"],"v":["ACID","ACID lists four guarantees. Isolation levels are the dial that controls HOW STRONG the “I” is."],"f":["T1 and T2 run together","!Both read “2 on call”","Both update","Serializable aborts one → retry"],"q":[["Name the four standard isolation levels.","Read Uncommitted, Read Committed, Repeatable Read, Serializable."],["What is a phantom read?","Re-running a query returns new rows that another transaction inserted and committed in between."],["What is write skew?","Two transactions read overlapping data, make decisions, and write different rows, together breaking a rule neither broke alone."],["What must application code do when using Serializable isolation?","Catch serialization failures and retry the whole transaction."],["What is a non-repeatable read?","Reading the same row twice in one transaction and getting different values because another transaction committed a change in between."]],"r":[125,26,14,25],"k":["Which anomaly is prevented by Serializable but possible under Read Committed?",["Dirty reads","Write skew","Reading committed data","Durability loss"],1,"Read Committed prevents dirty reads but allows write skew and lost updates; Serializable prevents them (with retries)."],"sl":"isolation-levels"},{"n":134,"c":"scale","t":"Hot Keys & Hot Partitions","s":"When one key or one shard gets far more traffic than the rest, so it becomes the bottleneck even though other servers are idle.","w":"Sharding assumes traffic spreads evenly. But real traffic is skewed: a celebrity’s profile, a viral post, a flash-sale product, or “today’s date” as a key. All requests for that key go to one cache node or one database partition, which melts while others sit idle.","y":"Hot keys cause outages that adding servers doesn’t fix, because the load can’t spread. Interviewers ask “what happens when Virat Kohli posts?” to see if you think about this.","h":["Detect them: monitor per-key or per-partition traffic (Redis --hotkeys, DynamoDB contributor insights).","Cache hot reads close to users: local in-process cache with a short TTL in each app server, plus CDN.","Replicate the hot key: store copies under key#1..key#N and read a random copy.","Split writes: for counters, write to N sub-counters (likes:post7:shard3) and sum them on read.","Avoid naturally hot shard keys like timestamps or status; add a random or hashed prefix.","Use request coalescing so many identical concurrent misses trigger only one backend fetch.","For viral content, special-case celebrities (e.g. fan-out on read for them)."],"code":"# sharded counter: spread writes across 16 keys\nr.incr(f\"likes:post7:{random.randint(0,15)}\")\n# read: sum all 16\ntotal = sum(int(r.get(f\"likes:post7:{i}\") or 0) for i in range(16))","e":"When a major celebrity posts on social media, millions of fans load the same post within seconds. Platforms serve it from local and edge caches and use sharded counters for likes so no single node takes all the traffic.","p":["Sharding by date or status so all new traffic hits one partition","Assuming more nodes will fix a single hot key","No per-key monitoring, so the cause stays invisible"],"v":["Load Balancing","Load balancing spreads REQUESTS over servers. A hot key is about DATA: every request for that one key must go to whichever node owns it, so the balancer can’t help."],"f":["Viral post: 1M reads/sec","!All hit one shard","Local cache + key replicas","Load spread, shard survives"],"q":[["How do you handle a hot read key?","Cache it in local memory and at the edge, and/or replicate it under multiple keys and read randomly."],["How do you handle a hot write key like a like counter?","Shard the counter into N sub-keys, write randomly, and sum on read (or aggregate asynchronously)."],["Why is a timestamp a bad partition key?","All current writes share the same recent value, so they land on one partition."],["How does request coalescing help with hot keys?","Many identical concurrent misses wait for a single backend fetch instead of each hitting the database."],["Why do timestamps make poor partition keys?","All current writes share recent time values and land on the same partition."]],"r":[6,127,128,143],"num":"Viral post: 500,000 reads/s; one Redis node handles ~100,000 ops/s.\nReplicate key into 10 copies (post:7#0..#9) → ~50,000 reads/s each.\nPlus 1-second local in-process cache on 100 app servers → Redis sees at most ~100 reads/s for that key.","m":["Per-key and per-partition request rates (hot key detection).","Per-node CPU/ops skew across the cache or DB cluster.","Throttling on specific partitions (e.g. DynamoDB)."],"k":["One Redis node is at 100% CPU while others are idle. Adding nodes doesn’t help. Most likely?",["Bad network","A hot key: one key gets most traffic and always maps to the same node","Memory leak","Wrong eviction policy"],1,"All requests for a key go to its owner node; spreading requires replicating the key or caching it closer to clients."],"sl":"hot-keys-and-hot-partitions"},{"n":135,"c":"dist","t":"Consensus (Raft & Paxos)","s":"Algorithms that let a group of servers agree on the same value or the same order of operations, even if some servers fail.","w":"Imagine 5 servers that must agree on “who is leader” or “what is the next entry in the log”. Messages can be lost and servers can crash. Consensus algorithms guarantee that once a majority agrees, the decision is final and everyone eventually learns it. Raft (designed to be understandable) works like this: elect a leader; the leader appends client commands to its log and replicates them; an entry is committed once a majority has it; if the leader dies, a new election starts with a higher “term”.","y":"Consensus is the foundation of etcd (Kubernetes' brain), ZooKeeper, Consul, CockroachDB and Spanner. Leader election, distributed locks and strongly consistent replication are all built on it.","h":["Use an odd cluster size: 3 tolerates 1 failure, 5 tolerates 2 (you need a majority alive).","Leader election: followers that stop hearing heartbeats become candidates and ask for votes; majority wins.","Log replication: leader sends entries; once a majority stores an entry it’s committed and applied.","Terms (epochs) ensure old leaders are ignored after a new one is elected.","Don’t implement it yourself in production; use etcd, ZooKeeper or Consul.","Keep clusters small (3–5 nodes) and close together; every write needs a majority round trip."],"e":"Every change you make with kubectl is stored in etcd, which uses Raft. If one of three etcd nodes dies, the other two still form a majority and the cluster keeps working.","p":["Running 2 or 4 nodes (no extra fault tolerance over 1 or 3)","Spreading a consensus cluster across far regions, making every write slow","Writing a homemade consensus protocol"],"v":["Leader Election","Leader election is one PROBLEM. Consensus is the general SOLUTION that can elect leaders and also agree on every log entry."],"f":["Leader receives command","Replicates to followers","Majority stored → committed","!Leader dies → new term election"],"q":[["How many failures can a 5-node Raft cluster tolerate?","2, because 3 nodes still form a majority."],["When is an entry committed in Raft?","When the leader has replicated it to a majority of nodes."],["Why not use an even number of nodes?","It adds cost without improving fault tolerance and allows split votes; 4 nodes tolerate only 1 failure, same as 3."],["Why must a new Raft leader have an up-to-date log?","Voters only elect candidates whose logs are at least as current as theirs, so committed entries are never lost."],["Why not spread a consensus cluster across far-apart regions?","Every write needs a majority round trip, so cross-region latency is added to every write."]],"r":[31,136,137,27],"k":["A 3-node Raft cluster loses 2 nodes. What happens to writes?",["They continue normally","They stop, because there’s no majority to commit entries","Only reads stop","The cluster splits into two leaders"],1,"Committing requires a majority (2 of 3). With one node left, writes can’t be committed safely."],"sl":"consensus-raft-and-paxos"},{"n":136,"c":"dist","t":"Quorums","s":"Requiring a minimum number of replicas to agree on each read and write, so reads always see the latest write.","w":"With N copies of data, a write must be acknowledged by W replicas and a read must ask R replicas. If W + R > N, every read set overlaps with every write set, so at least one replica in your read has the latest value. Example: N=3, W=2, R=2. You can tune: W=3,R=1 for fast reads; W=1,R=3 for fast writes; W=1,R=1 for speed with weaker consistency.","y":"Quorums let leaderless databases (Cassandra, DynamoDB-style, Riak) stay available when some nodes are down while still giving consistent results. A favourite interview formula.","h":["Choose N (copies), usually 3.","Choose W and R based on needs; W + R > N for strong reads.","Use versions/timestamps so the reader can pick the newest value among responses.","Read repair: if the read sees an outdated replica, update it.","Hinted handoff: if a target replica is down, another node holds the write temporarily and passes it on later.","In Cassandra, use consistency levels like QUORUM, ONE, ALL, LOCAL_QUORUM."],"code":"N = 3 replicas\nW = 2  (write succeeds after 2 acks)\nR = 2  (read asks 2, takes newest version)\nW + R = 4 > 3 → reads see latest write\n-- Cassandra: CONSISTENCY QUORUM;","e":"A Cassandra cluster with replication factor 3 using QUORUM reads and writes keeps serving correct data even when one replica in each set is down for maintenance.","p":["Using W=1, R=1 and expecting strong consistency","Ignoring clock-based conflicts when picking the “newest” value","Cross-region quorums making every request slow (use LOCAL_QUORUM)"],"v":["Consensus","Quorums are a simpler overlap rule for reads/writes. Consensus (Raft/Paxos) also uses majorities but additionally agrees on a single ORDER of operations with a leader."],"f":["Write to 3 replicas","2 acks → success (W=2)","Read from 2 (R=2)","Overlap guarantees latest"],"q":[["What does W + R > N guarantee?","Any read quorum overlaps any write quorum, so at least one replica read has the latest write."],["With N=3, how do you favour fast reads?","W=3, R=1: every write goes to all replicas so any singl
