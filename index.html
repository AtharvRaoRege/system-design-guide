<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1530">
<title>System Design Metro — learn it station by station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FA;--bg2:#E8ECF6;--surface:#FFFFFF;--surface2:#F6F7FC;--ink:#141A33;--muted:#5A6386;--line:#DCE1EF;--line2:#C9D0E4;
  --grid:rgba(20,26,51,.045);--shadow:0 1px 0 rgba(20,26,51,.04),0 10px 30px -14px rgba(20,26,51,.25);
  --code-bg:#151B36;--code-ink:#E6EAFF;--bad:#E5484D;--good:#14946B;
  --accent:#5B5BF0;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1430;--bg2:#121A3B;--surface:#161E42;--surface2:#1B2450;--ink:#E9EDFF;--muted:#9DA6CC;--line:#273266;--line2:#33407A;
  --grid:rgba(160,175,255,.06);--shadow:0 1px 0 rgba(0,0,0,.2),0 16px 40px -18px rgba(0,0,0,.7);
  --code-bg:#0A0F26;--code-ink:#E6EAFF;--bad:#FF6B70;--good:#3DD9A4;--accent:#8C8CFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1430;--bg2:#121A3B;--surface:#161E42;--surface2:#1B2450;--ink:#E9EDFF;--muted:#9DA6CC;--line:#273266;--line2:#33407A;
  --grid:rgba(160,175,255,.06);--shadow:0 1px 0 rgba(0,0,0,.2),0 16px 40px -18px rgba(0,0,0,.7);
  --code-bg:#0A0F26;--code-ink:#E6EAFF;--bad:#FF6B70;--good:#3DD9A4;--accent:#8C8CFF;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,24px);
  background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.4px;white-space:nowrap}
.brand-mark{width:30px;height:30px;flex:none}
.brand small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
.top-spacer{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:14px;min-height:40px}
.kbtn:hover{border-color:var(--line2);color:var(--ink)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.pill{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.readbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;z-index:70;background:var(--lc,var(--accent));transition:width .1s}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);height:calc(100vh - 61px - env(safe-area-inset-top,0px));overflow:auto;padding:18px 14px 40px;border-right:1px solid var(--line);overscroll-behavior:contain}
.side-head{display:flex;gap:14px;align-items:center;padding:6px 6px 16px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink)}
.side-stats strong{font-family:var(--display);font-size:18px;display:block;line-height:1.2}
.side-stats span{color:var(--muted);font-size:13.5px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lgroup{margin:4px 0 8px}
.lhead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:10px;text-align:left}
.lhead:hover{background:var(--surface2)}
.lhead .sw{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent);flex:none}
.lhead b{font-family:var(--display);font-weight:700;font-size:15px;flex:1}
.lhead em{font-style:normal;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lhead .chev{transition:transform .2s;color:var(--muted)}
.lgroup.closed .chev{transform:rotate(-90deg)}
.lgroup.closed .stations{display:none}
.stations{position:relative;margin:2px 0 6px 14px;padding-left:14px}
.stations::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c);opacity:.85}
.st{position:relative;display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:6px 8px;border-radius:9px;font-size:14.5px;line-height:1.35;color:var(--muted)}
.st::before{content:"";position:absolute;left:-19px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--c)}
.st.done::before{background:var(--c)}
.st:hover{background:var(--surface2);color:var(--ink)}
.st.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.newtag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--c);color:#111;vertical-align:1px;margin-left:4px}
.st .no{font-family:var(--mono);font-size:11.5px;min-width:24px;opacity:.75}
.empty{padding:14px;color:var(--muted);font-size:14px}

main{min-width:0;padding:clamp(18px,4vw,52px) clamp(16px,4vw,56px) 120px}
.wrap{max-width:780px;margin:0 auto}

/* home */
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7.4vw,84px);line-height:.95;letter-spacing:-.045em;margin:6px 0 18px;max-width:12ch}
.hero p{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:58ch;margin:0 0 22px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:15.5px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}

.map{margin:40px -8px 0;padding:22px 8px 10px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.map-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 18px 12px;flex-wrap:wrap}
.map-top h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.02em}
.map-top span{color:var(--muted);font-size:14px}
.map-scroll{overflow-x:auto;padding:4px 0 14px;-webkit-overflow-scrolling:touch}
.mrow{display:grid;grid-template-columns:150px auto;align-items:center;min-width:max-content;padding:6px 18px}
.mrow .lbl{position:sticky;left:0;z-index:2;background:var(--surface);padding-right:12px;font-family:var(--display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.mrow .lbl i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.track{justify-self:start;position:relative;display:flex;gap:12px;padding:10px 6px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:var(--c);transform-origin:left;animation:draw 1.1s cubic-bezier(.6,0,.2,1) both;animation-delay:var(--d,0s)}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stn{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--c);flex:none;transition:transform .15s}
.stn.done{background:var(--c)}
.stn:hover,.stn:focus-visible{transform:scale(1.35)}
.stn .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;font-weight:700}
.stn:hover .tip,.stn:focus-visible .tip{opacity:1}
.mrow:first-child .stn .tip{bottom:auto;top:calc(100% + 10px)}
.map-legend{display:flex;gap:16px;padding:6px 18px 4px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.map-legend b{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);vertical-align:-1px;margin-right:6px}
.map-legend b.f{background:var(--muted)}

.lines-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:26px 0}
.lcard{text-align:left;padding:16px 16px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.lcard:hover{border-color:var(--c)}
.lcard b{font-family:var(--display);font-size:17px;display:block}
.lcard span{color:var(--muted);font-size:14px}
.lbar{height:5px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}
.lbar div{height:100%;background:var(--c);border-radius:5px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 0}
.howto div{padding:16px;border-radius:18px;border:1px dashed var(--line2)}
.howto b{font-family:var(--display);display:block;font-size:16px;margin-bottom:4px}
.howto p{margin:0;color:var(--muted);font-size:15px}
.note{color:var(--muted);font-size:14px}

/* lesson */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lbadge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:color-mix(in srgb,var(--lc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--lc) 45%,transparent);color:var(--ink);font-weight:700}
.lbadge i{width:18px;height:18px;border-radius:50%;background:var(--lc);display:inline-grid;place-items:center;font-style:normal;font-size:10px;color:#111;font-family:var(--mono);font-weight:600}
.lesson h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6.4vw,66px);line-height:1;letter-spacing:-.04em;margin:16px 0 18px}
.tldr{font-size:clamp(19px,2.4vw,23px);line-height:1.5;margin:0 0 22px;padding-left:18px;border-left:6px solid var(--lc);font-family:var(--body)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 0 6px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;font-size:13.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.jump a:hover{color:var(--ink);border-color:var(--lc)}
.sec{margin:38px 0 0}
.sec h2{font-family:var(--display);font-size:clamp(23px,3vw,28px);letter-spacing:-.025em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec h2 .ico{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--lc) 20%,transparent);font-size:17px;flex:none}
.prose{font-size:17.5px;line-height:1.8;margin:0;max-width:68ch}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;position:relative}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 54px;border-bottom:1px solid var(--line);line-height:1.65}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:var(--lc);color:#111}
.code{position:relative;margin:18px 0 0;border-radius:16px;background:var(--code-bg);color:var(--code-ink);overflow:hidden}
.code pre{margin:0;padding:18px 18px 18px;overflow-x:auto;font:13.5px/1.65 var(--mono);tab-size:2}
.code .copy{position:absolute;top:8px;right:8px;font-size:12.5px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff}
.code .copy:hover{background:rgba(255,255,255,.2)}
.code .cbar{display:flex;gap:6px;padding:12px 16px 0}
.code .cbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.story{padding:22px 22px 22px 24px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.story::before{content:"“";position:absolute;right:16px;top:-14px;font-family:var(--display);font-size:110px;line-height:1;color:var(--lc);opacity:.35}
.story p{margin:0;font-size:17.5px;line-height:1.75}

/* trip diagram */
.trip{padding:22px 18px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.trip-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.tstop{position:relative;text-align:center;padding:0 6px}
.tstop .dot{position:relative;z-index:2;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;background:var(--surface);border:5px solid var(--line2);transition:all .35s}
.tstop .lab{font-size:14.5px;line-height:1.4;color:var(--muted);transition:color .35s}
.tstop .seg{position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:6px;border-radius:6px;background:var(--line);overflow:hidden;z-index:1}
.tstop .seg::after{content:"";position:absolute;inset:0;background:var(--lc);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.tstop:last-child .seg{display:none}
.tstop.on .dot{border-color:var(--lc);background:var(--lc);transform:scale(1.08)}
.tstop.on .lab{color:var(--ink);font-weight:700}
.tstop.on.passed .seg::after{transform:scaleX(1)}
.tstop.bad.on .dot{border-color:var(--bad);background:var(--bad)}
.tstop.bad.on .lab{color:var(--bad)}
.trip-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.trip-foot span{color:var(--muted);font-size:13.5px}
.mini{padding:7px 12px;border-radius:10px;border:1px solid var(--line2);font-size:13.5px;font-weight:700;background:var(--surface2)}

.oops{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.oops li{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);line-height:1.55}
.oops li::before{content:"✕";flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-top:1px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.vs .side-a,.vs .side-b{padding:18px}
.vs .side-a{background:color-mix(in srgb,var(--lc) 12%,var(--surface))}
.vs b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px}
.vs small{color:var(--muted);font-size:13px}
.vs .mid{display:grid;place-items:center;padding:0 6px;font-family:var(--display);font-weight:800;color:var(--muted);background:var(--surface2)}
.vs .txt{grid-column:1/-1;padding:16px 18px;border-top:1px solid var(--line);font-size:16.5px;line-height:1.7}

.cards{display:grid;gap:12px}
.flip{perspective:1200px;text-align:left;width:100%}
.flip .in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-height:96px;display:flex;flex-direction:column;justify-content:center}
.flip .back{transform:rotateY(180deg);background:color-mix(in srgb,var(--lc) 10%,var(--surface));border-color:color-mix(in srgb,var(--lc) 45%,transparent)}
.flip.open .in{transform:rotateY(180deg)}
.flip .q{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.35;letter-spacing:-.01em}
.flip .hint{font-size:13px;color:var(--muted);margin-top:8px}
.flip .a{font-size:16.5px;line-height:1.65}
.score{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}

.finish{margin:46px 0 0;padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:16px}
.finish .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.learnbtn{min-height:52px;padding:12px 22px;border-radius:16px;font-weight:800;font-size:16.5px;background:var(--lc);color:#111;border:0;display:inline-flex;gap:10px;align-items:center}
.learnbtn.is-done{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
.navs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navs button{text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);min-height:68px}
.navs button:hover:not(:disabled){border-color:var(--ink)}
.navs button:disabled{opacity:.4;cursor:not-allowed}
.navs small{display:block;color:var(--muted);font-size:12.5px}
.navs b{font-family:var(--display);font-size:16px;line-height:1.25}
.navs .nx{text-align:right}

/* palette */
.pal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10vh) 14px 14px;background:rgba(8,10,25,.55);backdrop-filter:blur(4px)}
.pal.open{display:flex}
.pal-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden}
.pal-box input{width:100%;padding:18px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:18px}
.pal-res{max-height:min(56vh,460px);overflow:auto;padding:6px}
.pr{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.pr i{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.pr b{display:block;font-size:15.5px}
.pr span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}
.pr[aria-selected="true"]{background:var(--surface2)}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,30px);opacity:0;z-index:95;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;transition:all .3s;pointer-events:none;max-width:calc(100% - 28px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96;width:100%;height:100%}

/* dock (mobile) */
.dock{display:none}
.scrim{display:none}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .brand small,.kbtn .lbl,.kbtn .kbd{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(78vh,720px);z-index:80;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 30px);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
  .side::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 10px}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:79;background:rgba(8,10,25,.45)}
  .scrim.open{display:block}
  .dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:60;
    background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
  .dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;font-size:11px;color:var(--muted);min-height:48px;justify-content:center}
  .dock button span{font-size:19px;line-height:1}
  .dock button.hi{background:var(--lc,var(--ink));color:#111}
  .dock button:disabled{opacity:.35}
  main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
}
@media (max-width:640px){
  body{font-size:16.5px}
  .top{gap:8px}
  .pill.streak{display:none}
  .trip-row{grid-auto-flow:row;grid-auto-columns:auto}
  .tstop{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:center;text-align:left;padding:0 0 22px}
  .tstop:last-child{padding-bottom:0}
  .tstop .dot{margin:0}
  .tstop .seg{left:11px;right:auto;top:28px;width:6px;height:auto;bottom:-0px}
  .tstop .seg::after{transform:scaleY(0);transform-origin:top}
  .tstop.on.passed .seg::after{transform:scaleY(1)}
  .vs{grid-template-columns:1fr}
  .vs .mid{padding:6px}
  .navs{grid-template-columns:1fr}
  .navs .nx{text-align:left}
  .mrow{grid-template-columns:116px auto}
  .mrow .lbl{font-size:13px}
  .steps li{padding-left:48px}
  .steps li::before{width:32px;height:32px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
const T = [{"n":1,"c":"rel","t":"Idempotency Keys","s":"A unique ID sent with a request so the server can say “I already did this one” instead of doing it twice.","w":"“Idempotent” means: doing it once or doing it ten times gives the same final result. An idempotency key is a random ID (usually a UUID) that the client creates once per action, like “pay ₹500 for order 42”, and sends in a header such as Idempotency-Key. The server saves the key together with the result. If the same key shows up again, the server does not run the action again. It just sends back the saved result.","y":"Networks are unreliable. Your app sends “pay ₹500”, the bank charges the card, but the reply gets lost. The app thinks it failed and retries. Without a key, the server sees a brand new payment and charges again. Same thing happens when a user double-taps a button. GET and PUT are usually safe to repeat, but POST (create something) is not. Idempotency keys make POST safe to retry.","h":["Client generates one UUID per user action (not per attempt) and reuses it for every retry of that action.","Server checks a store (DB table or Redis) for the key before doing any work.","If the key is new: insert it with status “in progress” using a unique constraint, so two parallel requests cannot both win.","Do the work, then save the response (status code + body) next to the key.","If the key already exists and is finished: return the saved response. If it is still in progress: return 409 Conflict or ask the client to wait.","Scope keys per user/account and expire them after a sensible window, e.g. 24 hours.","If the same key arrives with a different request body, reject it (422). That is a client bug."],"code":"-- unique constraint is what makes this race-safe\nCREATE TABLE idempotency (\n  user_id   BIGINT,\n  key       TEXT,\n  status    TEXT,          -- in_progress | done\n  response  JSONB,\n  created_at TIMESTAMPTZ DEFAULT now(),\n  PRIMARY KEY (user_id, key)\n);\n-- INSERT ... ON CONFLICT DO NOTHING\n-- 0 rows inserted => this key was seen before","e":"Stripe’s API accepts an Idempotency-Key header on every POST. If your checkout server crashes after calling Stripe and you retry with the same key, Stripe returns the first charge instead of creating a second one.","p":["Generating a new key on every retry (then it protects nothing)","Checking “does key exist?” and then inserting in two separate steps, which is itself a race condition","Storing keys only in server memory, so they vanish on restart or on another server","Never expiring keys, so the table grows forever"],"v":["Retries","A retry is “try again”. An idempotency key is what makes “try again” safe. You usually need both together."],"f":["Client sends pay + key K1","!Reply lost on network","Client retries with K1","Server sees K1, returns saved result"],"q":[["Who should generate the idempotency key, client or server?","The client, because only the client knows that two attempts are the same action. The server only stores and checks it."],["How do you stop two simultaneous requests with the same key from both running?","Insert the key first using a unique/primary-key constraint. Only one insert can succeed; the other sees a conflict and waits or gets 409."],["Is GET idempotent by default? Is POST?","GET, PUT and DELETE are idempotent by HTTP definition. POST is not, which is why POST endpoints that create money movements or orders need idempotency keys."]]},{"n":2,"c":"rel","t":"Rate Limiting","s":"A rule that says “each client may make at most X requests per time window”, and blocks the rest.","w":"Rate limiting counts how many requests a client (a user, an API key, or an IP address) sends, and refuses extra requests once a limit is hit. The server replies with HTTP 429 Too Many Requests and usually a Retry-After header saying when to try again. It is like a ride at a fair that only lets 20 people in every 5 minutes.","y":"Without limits, one buggy script, one scraper or one attacker can send thousands of requests per second and slow the service down for everyone. Login pages without limits allow password guessing. Expensive endpoints (search, AI calls, SMS sending) can also create huge bills.","h":["Decide WHO you are limiting: user ID for logged-in APIs, API key for partners, IP for anonymous traffic like login.","Pick an algorithm. Fixed window: count per minute, simple but allows bursts at the window edge. Sliding window: smoother and more accurate. Token bucket: a bucket refills at a steady rate and each request takes a token, which allows short bursts but limits the average.","Store counters in a shared fast store like Redis, so all your servers see the same count.","Return 429 with Retry-After and headers like X-RateLimit-Remaining so good clients can slow down.","Use different limits per endpoint: login might be 5/minute, reading a feed 600/minute.","Enforce at the edge too (API gateway, CDN, Nginx) so bad traffic is dropped before it reaches app servers."],"code":"# token bucket idea (pseudo)\ntokens = min(capacity, tokens + rate * seconds_since_last)\nif tokens >= 1:\n    tokens -= 1      # allow\nelse:\n    return 429       # reject, Retry-After: (1-tokens)/rate","e":"GitHub’s API allows 5,000 requests per hour per logged-in user. Every response tells you how many you have left. When you hit zero you get 403/429 until the hour resets.","p":["Counting in each server’s memory, so with 10 servers the real limit is 10× bigger","Limiting only by IP: many users behind one office or mobile network share an IP and get blocked together","Forgetting to tell the client when to retry","One global limit for cheap and expensive endpoints"],"v":["Backpressure","Rate limiting is a policy: “you are allowed 100 per minute”, even if the server is idle. Backpressure is a reaction to load: “I am overloaded right now, slow down”."],"f":["Request arrives","Check counter in Redis","Under limit: process","!Over limit: 429 + Retry-After"],"q":[["Fixed window vs token bucket, what’s the difference?","Fixed window resets a counter every period and lets 2× traffic slip through at the boundary. Token bucket refills steadily, allows controlled bursts up to bucket size, and enforces a smooth average."],["Why store counters in Redis instead of memory?","With many app servers, each has its own memory. A shared store gives one accurate count across all servers."],["What status code and headers should a rate-limited response have?","429 Too Many Requests, plus Retry-After, and optionally X-RateLimit-Limit / Remaining / Reset."]]},{"n":3,"c":"net","t":"Reverse Proxies","s":"A server that stands in front of your app servers, receives every request first, and forwards it to the right one.","w":"Users never talk to your app servers directly. They talk to the reverse proxy (Nginx, HAProxy, Envoy, Caddy, or a cloud load balancer). The proxy decides where the request goes, forwards it, gets the answer and passes it back. To the user it looks like one server.","y":"Without it, every app server must handle HTTPS certificates, compression, security headers and be exposed to the internet. You cannot easily send /api to one service and /images to another, or hide which servers exist.","h":["Terminate TLS at the proxy: the certificate lives in one place.","Route by path or host: /api → API servers, / → frontend, admin.site.com → admin service.","Add gzip/brotli compression, caching of static files and security headers here.","Pass the real client IP with X-Forwarded-For, and configure the app to trust that header ONLY from the proxy.","Set timeouts and request size limits at the proxy to stop slow or giant requests.","Keep app servers on a private network so the proxy is the only door."],"code":"# nginx\nserver {\n  listen 443 ssl;\n  location /api/ { proxy_pass http://api_servers; }\n  location /     { proxy_pass http://web_servers; }\n  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n}","e":"A typical startup runs Nginx on the front. It handles HTTPS with a Let’s Encrypt certificate, serves the React build files directly, and forwards /api calls to three Node.js servers.","p":["Trusting X-Forwarded-For from anyone: attackers can fake their IP","Proxy timeouts shorter than app timeouts, causing confusing 504 errors","Making the single proxy a single point of failure (run two)"],"v":["Forward Proxy","A reverse proxy acts on behalf of SERVERS (users don’t know which server answers). A forward proxy acts on behalf of CLIENTS, like a company proxy that all employees' browsing goes through."],"f":["User request","Reverse proxy (TLS, routing)","Correct app server","Response back via proxy"],"q":[["Name four jobs a reverse proxy commonly does.","TLS termination, routing by path/host, load balancing, compression/caching, and hiding internal servers."],["Is a load balancer a reverse proxy?","Most load balancers are reverse proxies that focus on spreading traffic across many identical servers. A reverse proxy can also do routing to different services, TLS, caching etc."],["How does the app know the real client IP behind a proxy?","Through X-Forwarded-For (or the Forwarded header), which the app should trust only when the request came from the known proxy."]]},{"n":4,"c":"db","t":"Connection Pooling","s":"Keep a small set of database connections open and reuse them, instead of opening a new one for every request.","w":"Opening a database connection is slow: network handshake, TLS, login, memory setup on the DB side. A connection pool opens, say, 10 connections at startup. When a request needs the DB it borrows one, runs its queries, and returns it to the pool for the next request.","y":"Opening a connection per request adds tens of milliseconds of delay. Worse, databases have a hard connection limit (Postgres often ~100 by default) and each connection costs memory. If 50 app servers each open 20 connections, that is 1,000 connections and the database falls over.","h":["Use your driver’s pool (HikariCP, pg.Pool, SQLAlchemy pool) instead of manual connects.","Size it carefully: total = pool size × number of app instances must stay below the DB limit. Small pools (5–20) are usually faster than huge ones.","Set a wait timeout, so when the pool is empty a request fails fast instead of hanging forever.","Always release the connection, even on errors (try/finally or “using” blocks).","For serverless or many instances, put a pooler like PgBouncer or RDS Proxy in front of the DB.","Monitor: active connections, waiting requests, and time spent waiting for a connection."],"code":"const pool = new Pool({ max: 10, idleTimeoutMillis: 30000,\n                        connectionTimeoutMillis: 2000 });\nconst client = await pool.connect();\ntry { await client.query('SELECT 1'); }\nfinally { client.release(); }   // never forget this","e":"A Django app on 20 Kubernetes pods each with a pool of 10 = 200 connections. The team’s Postgres limit was 100, so during scale-ups it crashed. Adding PgBouncer let 200 app connections share 40 real DB connections.","p":["Forgetting to release connections (connection leak: pool slowly empties and the app freezes)","Making the pool huge thinking more = faster; it just overloads the database","Holding a connection during slow work like an external API call"],"v":["Load Balancing","A pool reuses connections to ONE dependency. Load balancing spreads requests across MANY servers. Different problems."],"f":["Request needs DB","Borrow connection from pool","Run query","Return connection to pool"],"q":[["Why is a bigger pool not always better?","The DB has limited CPU cores and disk; too many concurrent queries cause contention and context switching, making everything slower. Total connections also must stay below the DB’s max."],["What is a connection leak?","Code borrows a connection and never returns it (often on an error path). Over time the pool runs empty and every request waits or times out."],["What is PgBouncer for?","It is an external pooler that lets many clients share a small number of real Postgres connections, essential with many app instances or serverless functions."]]},{"n":5,"c":"db","t":"N+1 Queries","s":"A bug where you run 1 query to get a list, then 1 more query for every item in that list.","w":"You load 50 blog posts (1 query). Then, while displaying them, your code asks for each post’s author separately (50 queries). That is 51 queries when 2 would do. It often hides inside ORMs, because post.author looks like a simple property but secretly runs a query.","y":"With 5 test rows nobody notices. In production with 500 rows it becomes 501 round trips to the database, and each round trip costs a millisecond or more. Pages that should take 30 ms take 3 seconds, and the database CPU climbs.","h":["Detect it: turn on query logging or use tools (Django Debug Toolbar, Bullet gem for Rails, Hibernate statistics) and count queries per request.","Fix with a JOIN: fetch posts and authors in one query.","Or eager load: ORM features like select_related / prefetch_related (Django), includes (Rails), JOIN FETCH (JPA), include (Prisma).","Or batch: collect all author IDs and run one query with WHERE id IN (...).","In GraphQL, use DataLoader to batch lookups made in the same request.","Add a test that asserts the number of queries for key pages, so it never comes back."],"code":"# BAD: 1 + N queries\nposts = Post.objects.all()\nfor p in posts: print(p.author.name)\n\n# GOOD: 1 query with a JOIN\nposts = Post.objects.select_related('author')\n\n# GOOD: 2 queries (posts, then authors WHERE id IN ...)\nposts = Post.objects.prefetch_related('tags')","e":"An e-commerce order history page loaded each order’s items one by one. A customer with 300 orders caused 301 queries and a 6-second page. Switching to one batched query brought it to 80 ms.","p":["Fixing it by adding an index: the index makes each query faster but you still have 500 round trips","Eager loading everything “just in case”, which pulls huge amounts of unused data","Only testing with tiny data sets"],"v":["Missing Index","N+1 = too MANY queries. Missing index = each query is too SLOW because it scans the table. Fix N+1 by batching or joining; fix missing indexes by adding indexes."],"f":["1 query: get 50 posts","!50 queries: author of each","Fix: JOIN or WHERE id IN (...)","2 queries total"],"q":[["How would you spot an N+1 in production?","Look at query logs or APM traces for one request repeating the same query shape many times with different IDs."],["JOIN vs prefetch (separate IN query): when do you use which?","JOIN suits one-to-one/many-to-one (each post has one author). A separate IN query suits one-to-many/many-to-many (posts with many tags), avoiding row explosion from duplicated parent rows."],["What does DataLoader do?","It collects all IDs requested during one tick of a GraphQL request and fetches them in a single batched query, and caches per request."]]},{"n":6,"c":"scale","t":"Caching Strategies","s":"Save the answer to an expensive question somewhere fast, so next time you skip the expensive work.","w":"A cache is fast storage (usually memory, like Redis or Memcached) that keeps copies of results. Reading from Redis takes under a millisecond; a complex DB query may take 200 ms. The “strategy” is about WHEN you read from and write to the cache versus the real database.","y":"Many apps read the same data again and again: product pages, user profiles, home feeds. Hitting the database every time wastes money and makes the database the bottleneck. A good cache can remove 90%+ of read load.","h":["Cache-aside (most common): app checks cache; on a miss, reads DB, then puts the result in cache with a TTL.","Read-through: the cache library itself loads from DB on a miss; the app only talks to the cache.","Write-through: every write goes to cache and DB together, so cache is always fresh but writes are slower.","Write-behind (write-back): write to cache now, flush to DB later. Very fast, but you can lose data if the cache dies.","Always set a TTL (time to live) so stale data eventually disappears.","Choose keys carefully: include everything that changes the answer, e.g. product:42:lang:hi.","Pick an eviction policy (usually LRU: throw out least recently used) and watch the hit ratio.","Protect against stampedes: when a hot key expires, let only one request rebuild it (lock or “single flight”)."],"code":"def get_product(id):\n    key = f\"product:{id}\"\n    data = redis.get(key)\n    if data: return json.loads(data)          # hit\n    data = db.query(\"SELECT ... WHERE id=%s\", id)  # miss\n    redis.setex(key, 300, json.dumps(data))   # TTL 5 min\n    return data","e":"Twitter/X keeps users' home timelines pre-built in Redis. Opening the app reads a list from memory instead of running a huge query across everyone you follow.","p":["Caching user-specific data under a shared key (user A sees user B’s data)","No TTL, so wrong data lives forever","Cache stampede: popular key expires and 10,000 requests hit the DB at once","Caching things that are rarely read again (low hit ratio, wasted memory)"],"v":["Database Indexing","An index makes the database’s own work faster. A cache skips the database entirely. Indexes are always up to date; caches can be stale."],"f":["Request for product 42","Check Redis","Hit: return in <1 ms","Miss: read DB, store in Redis"],"q":[["Explain cache-aside in one line.","The application checks the cache, and on a miss loads from the DB and writes the result into the cache."],["What is a cache stampede and how do you prevent it?","When a hot key expires, many requests miss together and all hit the DB. Prevent it with a lock so one request rebuilds, early refresh before expiry, or random TTL jitter."],["Write-through vs write-behind?","Write-through writes cache and DB synchronously (safe, slower writes). Write-behind writes cache first and DB later (fast, risk of data loss)."]]},{"n":7,"c":"scale","t":"Cache Invalidation","s":"Making sure the cache throws away (or updates) old data when the real data changes.","w":"Once you copy data into a cache, you have two versions. When the database changes, the cache copy becomes wrong (“stale”). Invalidation is the job of removing or refreshing that stale copy. It is famous as one of the two hard things in computer science.","y":"If a price drops from ₹999 to ₹799 but the cache still says ₹999, customers see the wrong price. With permissions it is worse: a user you removed from a team might still have access because the cache remembers the old role.","h":["TTL expiry: simplest. Data is at most N seconds old. Good when slight staleness is fine.","Delete on write: when you update the DB, delete the cache key. The next read reloads fresh data. Delete is safer than “update cache” because two concurrent updates can write values in the wrong order.","Event-based: the service publishes “product 42 changed” and every cache listening deletes its copy.","Versioned keys: put a version in the key (product:42:v7). Bump the version on change; old keys just expire.","Order matters: update the DB first, then delete the cache. Otherwise a reader might re-cache the old value in between.","Always keep a TTL as a safety net in case an invalidation message gets lost."],"code":"def update_price(id, price):\n    db.execute(\"UPDATE products SET price=%s WHERE id=%s\", price, id)\n    redis.delete(f\"product:{id}\")   # next read reloads fresh","e":"Facebook’s famous memcache paper describes deleting keys after DB writes and using “leases” to stop a slow reader from putting old data back into the cache.","p":["Forgetting a cached page that ALSO contains the item (lists, search results, CDN copies)","Updating cache before the DB commits","Relying only on invalidation with no TTL backup","Invalidating so often that the cache is always empty"],"v":["TTL Expiration","TTL waits for time to pass; data can be stale until then. Invalidation reacts immediately to a change. Use both: invalidation for freshness, TTL for safety."],"f":["Price updated in DB","Delete cache key","Next read misses","Fresh value cached"],"q":[["Why delete the cache key instead of updating it on writes?","With concurrent writers, two cache updates can land in the wrong order and leave stale data forever. A delete just forces the next reader to load the latest DB value."],["Should you update the DB first or invalidate cache first?","DB first, then delete the key. If you delete first, a reader can reload the old DB value into the cache before your write commits."],["How do you invalidate data cached on a CDN?","Use purge APIs, short TTLs, or versioned URLs (app.v8.js) so new content uses new URLs."]]},{"n":8,"c":"scale","t":"Load Balancing","s":"Spreading incoming requests across several servers so no single one gets overwhelmed.","w":"A load balancer sits in front of a group of identical servers. Each request is sent to one of them based on an algorithm. It also runs health checks and stops sending traffic to servers that are down.","y":"One server has limited CPU and memory, and if it crashes your whole app is down. With 4 servers behind a balancer you get roughly 4× capacity and one can die without users noticing.","h":["Choose an algorithm. Round robin: take turns. Least connections: send to the least busy server, good when requests vary in length. Weighted: bigger servers get more. IP hash / consistent hashing: same client goes to same server.","Configure health checks (e.g. GET /health every 5 s) to remove broken servers automatically.","Make servers stateless: store sessions in Redis or a DB, not in server memory, so any server can handle any request.","Avoid sticky sessions unless needed; they cause uneven load and lost sessions when a server dies.","Know the layer: L4 balancers route by IP/port (very fast); L7 balancers understand HTTP and can route by path, headers or cookies.","Run the balancer itself redundantly (cloud LBs do this for you)."],"e":"An AWS Application Load Balancer sends traffic across EC2 instances in three availability zones. When one zone has an outage, health checks fail there and traffic moves to the other two.","p":["Storing login sessions in local memory, so users get logged out when they hit another server","Health check that only says “process is running” even when the app can’t reach its DB","Forgetting that the database behind all servers is still one bottleneck"],"v":["Autoscaling","Load balancing spreads requests over the servers you HAVE. Autoscaling changes HOW MANY servers you have. They are usually used together."],"f":["Many users","Load balancer","Server A / B / C","!Unhealthy server skipped"],"q":[["L4 vs L7 load balancer?","L4 works at TCP/UDP level using IPs and ports, very fast but blind to HTTP. L7 understands HTTP, so it can route by URL path, host or header and terminate TLS."],["Why should app servers be stateless behind a load balancer?","Any request can land on any server. If state like sessions lives in one server’s memory, other servers can’t see it and the user experience breaks."],["When is least-connections better than round robin?","When requests take very different amounts of time; round robin may pile long requests onto one server while least-connections favours idle ones."]]},{"n":9,"c":"net","t":"API Gateways","s":"One front door for all your APIs that handles common jobs like auth, rate limits and routing before passing requests to services.","w":"When you have many backend services (users, orders, payments), clients shouldn’t need to know all their addresses. The API gateway exposes one URL like api.shop.com and routes /users to the user service, /orders to the order service, and applies shared rules on the way.","y":"Without a gateway, every service re-implements token checking, rate limits, CORS, logging and API keys, often slightly differently, causing security holes and repeated work.","h":["Route requests by path, method or version to the right service.","Validate auth tokens once at the gateway, then forward the user identity to services in a trusted header.","Apply rate limits and quotas per API key or plan (free vs paid).","Add request IDs, logging and metrics in one place.","Optionally transform or aggregate: one mobile call fans out to 3 services and returns combined data (the BFF, backend-for-frontend pattern).","Keep business logic OUT of the gateway; it should stay thin and fast.","Run it redundantly because every request passes through it."],"e":"Netflix’s Zuul gateway sits in front of hundreds of microservices, handling authentication, routing and canary traffic splits for all device apps.","p":["Putting business rules in the gateway, turning it into a monolith nobody can change","Services trusting identity headers even when called directly, bypassing the gateway","One gateway team becomes a bottleneck for every API change"],"v":["Reverse Proxy","A reverse proxy forwards traffic. An API gateway is a reverse proxy specialised for APIs, adding auth, keys, quotas, versioning and developer-facing features."],"f":["Mobile / web client","API gateway: auth + limits","Route to service","Users / Orders / Payments"],"q":[["What responsibilities belong in an API gateway?","Routing, authentication, rate limiting/quotas, TLS, request logging/IDs, CORS, and sometimes response aggregation."],["What is a BFF?","Backend-for-frontend: a gateway layer tailored to one client type (mobile, web), shaping and combining data for that client."],["What is the main risk of a gateway?","It is a single point of failure and potential bottleneck; and if business logic leaks into it, it becomes hard to change."]]},{"n":10,"c":"rel","t":"Timeouts","s":"A maximum time you are willing to wait for something before you give up and handle the failure.","w":"Every network call can hang: the other server is slow, overloaded, or the packet just vanished. A timeout says “if no answer in 2 seconds, stop waiting and treat it as failed”. There are several kinds: connect timeout (time to establish a connection), read timeout (time waiting for data), and an overall deadline for the whole operation.","y":"Many HTTP libraries have NO timeout by default, or a very long one. If a dependency hangs, your requests wait forever, each holding a thread and a connection. Soon all threads are stuck and your service stops answering too, even for things unrelated to the slow dependency. One slow service takes down everything: a cascading failure.","h":["Set an explicit timeout on every outbound call: HTTP, DB, Redis, queues.","Base the number on real latency: e.g. if p99 is 300 ms, a timeout around 1 s is reasonable.","Use short connect timeouts (around 1 s) and separate read timeouts.","Use a deadline for the whole user request (e.g. 3 s) and pass the REMAINING time to downstream calls, so inner calls never outlive the outer request.","Cancel work after a timeout where possible, so you don’t keep spending resources on an answer nobody wants.","Make sure outer layers have longer timeouts than inner ones (load balancer > app > DB)."],"code":"# Python requests: (connect, read) seconds\nrequests.get(url, timeout=(1, 2))\n\n// Go: deadline flows to every call made with ctx\nctx, cancel := context.WithTimeout(ctx, 2*time.Second)\ndefer cancel()","e":"A payment page called a fraud-check API without a timeout. One day that API hung; every checkout thread waited, the app ran out of threads, and the whole site went down for 40 minutes, even pages that never used fraud checks.","p":["Relying on library defaults (often infinite)","Timeouts so long they never help (60 s for a call that normally takes 50 ms)","Inner timeouts longer than outer timeouts, so the caller gives up but the work continues"],"v":["Retries","A timeout decides WHEN to give up on an attempt. A retry decides WHETHER to try again. Retrying without timeouts or a total deadline can multiply load."],"f":["Call fraud API","!No reply…","2 s timeout fires","Return fallback / error fast"],"q":[["Why are missing timeouts dangerous?","Hanging calls hold threads and connections; when a dependency stalls, these resources run out and the calling service also stops responding (cascading failure)."],["What is deadline propagation?","Passing the remaining time budget of the user request to each downstream call so no inner call waits longer than the overall request allows."],["Connect timeout vs read timeout?","Connect timeout limits establishing the TCP/TLS connection; read timeout limits waiting for response data after connecting."]]},{"n":11,"c":"rel","t":"Retries","s":"Automatically trying a failed operation again, because many failures are temporary.","w":"Some errors fix themselves in a moment: a network blip, a server restarting, a brief overload (HTTP 503), a timeout. Retrying after a short pause often succeeds. But some errors will never fix themselves (400 Bad Request, 401 Unauthorized, 404 Not Found), and retrying those is pointless.","y":"Without retries, users see errors for problems that would have disappeared in 100 ms. With BAD retries (instant, unlimited, on everything), you can turn a small hiccup into a flood that keeps the struggling service down.","h":["Retry only transient errors: timeouts, connection resets, 502/503/504, 429 (after waiting).","Never blindly retry 4xx errors like 400/401/403/404/422.","Only retry operations that are safe to repeat (idempotent), or use idempotency keys.","Cap attempts (e.g. 3) and set an overall deadline.","Wait between attempts using exponential backoff with jitter.","Retry at ONE layer only. If the browser, gateway, service A and service B each retry 3 times, one failure can become 81 calls.","Use a retry budget, e.g. retries may be at most 10% of total traffic."],"code":"for attempt in range(3):\n    try:\n        return call_api(timeout=2)\n    except (Timeout, ConnectionError, Http503):\n        if attempt == 2: raise\n        sleep(random.uniform(0, 0.2 * 2**attempt))  # backoff + jitter","e":"AWS SDKs retry throttling and 5xx errors automatically up to a few times with backoff, which is why most S3 hiccups never reach your app as errors.","p":["Retrying a non-idempotent payment POST without a key, causing double charges","Retries at every layer multiplying load","Retrying immediately in a tight loop","Retrying forever"],"v":["Exponential Backoff","Retry = do it again. Backoff = how long to wait before doing it again. Retries should almost always use backoff."],"f":["Call fails: 503","Is it transient? yes","Wait (backoff)","Try again, max 3"],"q":[["Which errors should you retry?","Transient ones: timeouts, connection errors, 502/503/504 and 429 after the indicated wait. Not 400/401/403/404/422."],["What is retry amplification?","When several layers each retry, attempts multiply (3×3×3…), overwhelming an already struggling service."],["Why must retried operations be idempotent?","The first attempt might have succeeded even though you saw an error; repeating a non-idempotent action could duplicate it."]]},{"n":12,"c":"rel","t":"Exponential Backoff","s":"Wait longer after each failure (1 s, 2 s, 4 s, 8 s…) plus a bit of randomness, before retrying.","w":"Backoff means “back off”: give the struggling server breathing room. Exponential means the wait doubles each time. Jitter means adding randomness so that thousands of clients don’t all retry at the exact same moment.","y":"Imagine a server goes down for 10 seconds and 10,000 phones retry every 100 ms. When it comes back, it gets hit by a giant synchronized wave and falls over again. This is called the thundering herd. Backoff with jitter spreads retries out over time.","h":["Start with a base delay (e.g. 100 ms) and double it each attempt.","Cap the delay (e.g. max 30 s) so it doesn’t grow to hours.","Add jitter. “Full jitter” picks a random wait between 0 and the current backoff value, which works very well.","Respect the server’s Retry-After header if it sends one.","Limit total attempts or total time.","Combine with a circuit breaker so that during long outages you stop trying altogether."],"code":"def backoff(attempt, base=0.1, cap=30):\n    exp = min(cap, base * 2 ** attempt)\n    return random.uniform(0, exp)   # full jitter\n# attempt 0: 0–0.1s, 1: 0–0.2s, 2: 0–0.4s ... capped at 30s","e":"AWS published an analysis showing that “full jitter” backoff finished contended work faster and with far fewer total calls than plain exponential backoff, because clients stopped colliding.","p":["No jitter: all clients still retry in synchronized waves","No cap: delays grow to absurd lengths","Backoff without an attempt limit"],"v":["Circuit Breaker","Backoff slows retries down. A circuit breaker stops calls completely for a while once it is clear the dependency is broken."],"f":["Fail → wait ~0.1 s","Fail → wait ~0.2 s","Fail → wait ~0.4 s","Success, server recovered"],"q":[["Why add jitter to backoff?","Without randomness, clients that failed together retry together, creating repeated traffic spikes. Jitter spreads them out."],["What is the thundering herd problem?","Many clients waking up or retrying at the same instant and overwhelming a resource just as it recovers."],["What should a client do with a Retry-After header?","Wait at least that long before retrying; it is the server telling you when it can accept more work."]]},{"n":13,"c":"rel","t":"Circuit Breakers","s":"After too many failures, stop calling a broken service for a while and fail fast, then test carefully if it recovered.","w":"Named after the electrical switch that cuts power to stop a fire. It has three states. CLOSED: calls flow normally while failures are counted. OPEN: too many failures happened, so calls are rejected instantly without even trying. HALF-OPEN: after a cool-down, a few test calls are allowed; if they succeed the breaker closes, if they fail it opens again.","y":"If the recommendation service is dead, calling it 1,000 times a second just wastes threads waiting for timeouts, slows your own pages and keeps hammering the dead service so it can’t recover.","h":["Wrap each remote dependency in its own breaker (libraries: Resilience4j, Polly, opossum, or service meshes like Istio).","Set a trip rule: e.g. open if 50% of the last 20 calls failed or timed out.","Set an open duration, e.g. 30 s, before going half-open.","In half-open, allow only a few trial requests.","Always provide a fallback: cached data, a default value, a “feature unavailable” message, or skip the feature.","Emit metrics and alerts on state changes so humans know a dependency is down."],"code":"breaker = CircuitBreaker(fail_rate=0.5, window=20, open_for=30)\ndef recommendations(user):\n    try:\n        return breaker.call(reco_api.get, user)\n    except BreakerOpen:\n        return popular_items()    # fallback","e":"Netflix’s Hystrix library made this famous. If the “personalised rows” service broke, the home screen fell back to generic popular titles instead of crashing.","p":["One breaker for all dependencies, so one bad service blocks the others","No fallback, so open just means a different error","Thresholds so sensitive that normal noise trips the breaker"],"v":["Retries","Retries try harder after a failure. Circuit breakers give up quickly when failures continue. Retries handle blips; breakers handle outages."],"f":["Closed: calls pass","!Failures pile up → Open","Fail fast + fallback","Half-open test → Closed"],"q":[["Describe the three states of a circuit breaker.","Closed (normal, counting failures), Open (rejecting calls immediately), Half-open (allowing limited test calls to see if the dependency recovered)."],["Why does a circuit breaker help the failing service too?","It stops the flood of requests, giving the failing service room to recover instead of being hammered."],["What makes a good fallback?","Something useful and cheap: cached/stale data, defaults, degraded features, or a clear message, never another call to the same broken thing."]]},{"n":14,"c":"dist","t":"Race Conditions","s":"A bug where the result depends on which of two simultaneous operations happens first.","w":"Two requests read the same value, both make a decision based on it, and both write. Classic “check-then-act”: request A checks “is the seat free?” → yes. Request B checks → yes. A books it. B books it. The seat is now sold twice. Each request was correct alone; together they are wrong.","y":"Race conditions cause overselling, double spending, negative stock, lost updates (one person’s edit overwrites another’s) and counters that are wrong. They rarely appear in testing because they need precise timing, then show up under real traffic.","h":["Make the database do the check and the write in ONE atomic statement: UPDATE seats SET booked_by=? WHERE id=? AND booked_by IS NULL. Then check rows affected = 1.","Use unique constraints (one booking per seat) so the DB rejects the second write.","Use atomic operations: UPDATE stock SET qty = qty - 1 WHERE qty > 0, or Redis INCR.","Use transactions with the right isolation level, or row locks (SELECT ... FOR UPDATE).","Use optimistic locking with a version column when conflicts are rare.","Test it: fire 100 parallel requests at the same item in a test and assert the invariant holds."],"code":"-- atomic: check and update in one statement\nUPDATE seats\nSET booked_by = 77\nWHERE id = 12 AND booked_by IS NULL;\n-- rows affected = 1 → you got it\n-- rows affected = 0 → someone else did","e":"During a concert ticket sale, a site that read “available” in code and then wrote “sold” separately sold the same front-row seats to several people. The fix was one conditional UPDATE.","p":["Read value in app code, change it, write it back (lost update)","Assuming “it’s fast so it won’t overlap”","Fixing it with an in-memory lock that doesn’t work across multiple servers"],"v":["Deadlock","A race condition finishes but with WRONG data. A deadlock doesn’t finish at all: operations wait on each other forever."],"f":["A reads: seat free","B reads: seat free","!Both write: sold twice","Fix: atomic conditional UPDATE"],"q":[["What is a check-then-act race?","Checking a condition and acting on it in separate steps, so another operation can change the condition in between."],["How does a unique constraint prevent races?","The database guarantees only one row with that value can exist, so the second concurrent insert fails no matter the timing."],["Why doesn’t a mutex in application code fix races in a web app?","Apps run on multiple processes/servers; an in-memory lock only coordinates threads in one process."]]},{"n":15,"c":"db","t":"Deadlocks","s":"Two transactions each hold something the other needs, so both wait forever, until the database kills one.","w":"Transaction A locks row 1 and wants row 2. Transaction B locks row 2 and wants row 1. Neither can continue. Databases detect this cycle and abort one transaction with a “deadlock detected” error so the other can finish.","y":"Under real traffic, deadlocks show up as random failed requests and slow transactions. If the app doesn’t handle the error, users see failures for actions that were perfectly valid.","h":["Always lock rows in the same order everywhere, e.g. sort IDs ascending before updating. Most deadlocks disappear with this alone.","Keep transactions short: no network calls, no waiting for users inside a transaction.","Add indexes so updates lock only the rows they need, not big ranges.","Catch the deadlock error and retry the whole transaction a few times with a small backoff.","Set lock timeouts (lock_timeout in Postgres) so stuck waits end.","Read the DB’s deadlock log to find which queries collided."],"code":"# transfer money: lock both accounts in a fixed order\na, b = sorted([from_id, to_id])\ndb.execute(\"SELECT * FROM accounts WHERE id IN (%s,%s) ORDER BY id FOR UPDATE\", a, b)","e":"A bank transfer feature deadlocked when Alice paid Bob at the same moment Bob paid Alice: each transaction locked the sender first. Locking accounts in ID order fixed it.","p":["Long transactions that do HTTP calls while holding locks","Different code paths updating the same tables in different orders","Not retrying the transaction that the DB aborted"],"v":["Race Condition","A race condition gives wrong results silently. A deadlock is a visible stall that the DB breaks by failing one transaction."],"f":["A locks row 1","B locks row 2","!A waits on 2, B waits on 1","DB aborts one → retry"],"q":[["What is the most effective way to prevent deadlocks?","Acquire locks in a consistent global order and keep transactions short."],["What does a database do when it detects a deadlock?","It picks a victim transaction, rolls it back and returns an error, letting the others proceed."],["How should an application handle a deadlock error?","Retry the entire transaction (not just the failed statement) a few times with backoff."]]},{"n":16,"c":"scale","t":"Memory Leaks","s":"Your program keeps holding on to memory it no longer needs, so memory use grows until the process slows down or crashes.","w":"In languages with garbage collection (Java, JS, Python, Go), memory is freed only when nothing references it anymore. A leak happens when something still points to old objects by accident: a global list that only grows, an event listener never removed, a cache with no size limit, a timer that keeps a closure alive.","y":"The server works fine after a deploy, but memory climbs slowly over hours or days. Then it hits the container limit and gets OOM-killed (Out Of Memory), or garbage collection runs constantly and everything gets slow.","h":["Watch the graph: memory that climbs and never comes down after GC (a “sawtooth” trending upward) suggests a leak.","Take heap snapshots at two different times and compare which object types grew (Chrome DevTools for Node, jmap/Eclipse MAT for Java, tracemalloc for Python).","Look for unbounded collections: maps used as caches without limits; use an LRU with max size.","Remove event listeners, clear intervals/timers and close connections when done.","Avoid storing per-request data in global/module-level variables.","Set memory limits and alerts so leaks are caught early, not by crashes."],"code":"// LEAK: grows forever\nconst seen = {};\napp.get('/', (req) => { seen[req.id] = req; });\n\n// FIX: bounded cache\nconst cache = new LRU({ max: 1000 });","e":"A Node.js API stored every WebSocket client in a global array but never removed them on disconnect. Memory grew ~200 MB per day and pods restarted every night until the cleanup handler was added.","p":["“Fixing” by restarting servers on a schedule and never finding the cause","Confusing a big intentional cache with a leak","Adding listeners inside a function that runs on every request"],"v":["High Memory Usage","High memory can be normal and stable (a big cache). A leak keeps GROWING without a limit. Look at the trend, not one number."],"f":["Request stores object globally","Object never removed","!Memory climbs for days","OOM kill → restart"],"q":[["How can a garbage-collected language still leak memory?","The GC only frees unreachable objects. If your code still references unneeded objects (globals, listeners, caches), they stay reachable and can’t be freed."],["How do you find a leak?","Compare heap snapshots over time to see which objects grow, then trace who holds references to them."],["Name three common leak sources.","Unbounded caches/maps, forgotten event listeners or timers, and closures capturing large objects."]]},{"n":17,"c":"net","t":"Webhooks","s":"Instead of you asking “did anything happen?” over and over, the other system calls YOUR URL when something happens.","w":"You give a provider (Stripe, GitHub, Razorpay) a URL on your server. When an event happens, like “payment succeeded”, they send an HTTP POST to that URL with the event details as JSON. It’s a reverse API: they call you.","y":"The alternative is polling: asking “any new payments?” every few seconds. That wastes requests and you still learn late. Webhooks are instant and efficient, but they come with their own problems: fake senders, duplicates, retries and out-of-order events.","h":["Verify the signature: providers sign the payload with a shared secret (HMAC). Reject anything that doesn’t verify, or anyone can fake “payment succeeded”.","Respond fast (2xx within a few seconds). Save the event and process it in the background via a queue.","Deduplicate using the event ID; providers retry, so you WILL get duplicates.","Don’t trust order: “payment.refunded” may arrive before “payment.succeeded”. Check timestamps or fetch the latest state from the provider’s API.","Handle provider retries: if you return 500, they’ll retry with backoff for hours or days.","Log every received event so you can replay or debug."],"code":"sig = request.headers[\"Stripe-Signature\"]\nevent = stripe.Webhook.construct_event(body, sig, SECRET)  # verifies\nif db.exists(\"events\", event.id): return 200   # duplicate\ndb.insert(\"events\", event.id)\nqueue.push(event)                              # process later\nreturn 200","e":"GitHub calls your CI server’s webhook on every push; that’s how a build starts within seconds of a commit, without CI polling every repository.","p":["Not verifying signatures","Doing slow work before replying, causing timeouts and duplicate deliveries","Assuming each event arrives exactly once and in order"],"v":["Polling","Polling = you keep asking. Webhook = they tell you. Webhooks are faster and cheaper but need a public endpoint plus duplicate and security handling."],"f":["Payment succeeds at provider","Provider POSTs to your URL","Verify signature + dedupe","Queue job, reply 200"],"q":[["Why must you verify webhook signatures?","The URL is public; without verification anyone could send fake events like “order paid”."],["Why reply quickly and process asynchronously?","Providers time out slow responses and retry, creating duplicates; heavy work belongs in a background job."],["How do you handle duplicate webhook deliveries?","Store processed event IDs (with a unique constraint) and skip any ID you have already handled."]]},{"n":18,"c":"sec","t":"CORS","s":"A browser rule that decides whether JavaScript on one website is allowed to read responses from another website.","w":"An “origin” is scheme + domain + port, e.g. https://app.com. By default, browsers block JS on app.com from reading responses from api.other.com (the Same-Origin Policy). CORS (Cross-Origin Resource Sharing) lets the API server say “I allow app.com” using headers like Access-Control-Allow-Origin. For non-simple requests (custom headers, PUT, JSON), the browser first sends an OPTIONS “preflight” to ask permission.","y":"Without the same-origin rule, any website you visit could use your logged-in cookies to read your bank or email data. CORS errors also confuse developers, who then “fix” them by allowing everything, which can open real security holes.","h":["Allow specific origins only: Access-Control-Allow-Origin: https://app.com, not * for anything private.","Never combine * with Access-Control-Allow-Credentials: true (browsers forbid it anyway).","Don’t blindly reflect whatever Origin header the request sends back as allowed.","List only needed methods and headers in preflight responses, and cache preflights with Access-Control-Max-Age.","Remember CORS is enforced by BROWSERS only. curl, Postman and servers ignore it. It is not authentication.","In development, a dev-server proxy often avoids CORS completely."],"code":"Access-Control-Allow-Origin: https://app.example.com\nAccess-Control-Allow-Methods: GET, POST, PUT\nAccess-Control-Allow-Headers: Content-Type, Authorization\nAccess-Control-Allow-Credentials: true\nAccess-Control-Max-Age: 600","e":"A React app at app.example.com calls api.example.com. They are different origins, so the API must return Access-Control-Allow-Origin: https://app.example.com or the browser will hide the response from JavaScript.","p":["Thinking CORS protects your API from hackers (it doesn’t stop non-browser clients)","Reflecting any Origin with credentials allowed","Forgetting to handle OPTIONS preflight requests"],"v":["Authentication","CORS controls which WEBSITES' scripts can read responses in a browser. Authentication controls which USERS can access data. You need both."],"f":["JS on app.com calls api.com","Browser sends OPTIONS preflight","API: Allow-Origin app.com","Browser lets JS read response"],"q":[["What is an origin?","The combination of scheme, host and port. https://a.com and https://a.com:8443 are different origins."],["When does a browser send a preflight request?","For non-simple requests: methods other than GET/HEAD/POST, custom headers like Authorization, or content types like application/json."],["Does CORS protect your API from attackers using curl?","No. CORS is enforced only by browsers; servers must still use proper authentication and authorization."]]},{"n":19,"c":"sec","t":"Secrets Management","s":"Keeping passwords, API keys and private keys out of your code and in a secure, controlled store.","w":"Secrets are things that grant access: DB passwords, Stripe keys, JWT signing keys, cloud credentials. Secrets management means storing them in a dedicated system (AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager, Kubernetes Secrets with encryption), giving apps access only at runtime, rotating them, and logging who accessed what.","y":"Secrets committed to Git live forever in the history, even after you delete them. Bots scan public GitHub for AWS keys within minutes and spin up crypto miners on your bill. Secrets placed in frontend code are visible to every visitor.","h":["Never commit secrets. Use .env files only locally and add them to .gitignore.","Use a secrets manager in production; inject secrets as environment variables or files at runtime.","Give each service only the secrets it needs (least privilege), with separate secrets per environment.","Rotate secrets regularly and immediately if one leaks. Revoking the old key matters more than deleting the commit.","Add secret scanning (GitHub secret scanning, gitleaks, trufflehog) to CI and pre-commit hooks.","Never put server secrets in frontend env vars like NEXT_PUBLIC_ or VITE_; those are shipped to browsers.","Prefer short-lived credentials (IAM roles, workload identity) over long-lived keys."],"e":"A developer pushed an AWS key to a public repo by mistake. Within about 5 minutes automated scanners found it, and dozens of GPU instances started mining crypto, generating a bill of thousands of dollars before the key was revoked.","p":["Deleting the leaked secret from Git but not revoking it","Sharing one admin key across all services","Logging full config objects that include secrets","Putting secrets inside Docker images"],"v":["Encryption at Rest","Encryption at rest protects stored data. Secrets management controls who can GET the keys, how they’re rotated and audited. Encryption is useless if the key sits in your repo."],"f":["App starts","Fetch secret from vault (IAM role)","Use in memory only","Rotate on schedule"],"q":[["You accidentally pushed an API key to GitHub. What do you do first?","Revoke/rotate the key immediately at the provider, then check usage logs, then remove it from history. Deleting the commit alone isn’t enough."],["Why are frontend environment variables not secret?","They’re bundled into JavaScript sent to every browser; anyone can read them."],["What is the benefit of short-lived credentials?","If stolen, they expire quickly, limiting damage, and there is no long-lived key to leak."]]},{"n":20,"c":"db","t":"Database Indexing","s":"A sorted lookup structure that lets the database jump straight to matching rows instead of reading the whole table.","w":"Without an index, finding WHERE email = 'a@b.com' means checking every row (a full table scan). An index is like the index at the back of a book: a sorted list of values pointing to where the rows are. Most databases use a B-tree, which finds a value among millions in a handful of steps.","y":"On a table with 10 million rows, a scan can take seconds; with an index the same lookup takes about a millisecond. But indexes aren’t free: every INSERT/UPDATE must also update every index, and they use disk and memory.","h":["Index columns you filter on (WHERE), join on (JOIN ... ON), or sort by (ORDER BY).","Composite index (a, b) works for queries on a, or a AND b, but NOT for b alone. This is the left-most prefix rule. Put the equality columns first, then range/sort columns.","Covering index: include all columns the query needs so the DB never visits the table.","Partial index: index only rows you query, e.g. WHERE status = 'active'.","Unique indexes also enforce data rules (no duplicate emails).","Verify with EXPLAIN that the index is actually used.","Remove unused indexes; they slow writes for no benefit.","Low-selectivity columns (e.g. a boolean) alone rarely benefit from an index."],"code":"CREATE INDEX idx_orders_user_created\n  ON orders (user_id, created_at DESC);\n-- fast:  WHERE user_id = 7 ORDER BY created_at DESC\n-- fast:  WHERE user_id = 7\n-- slow:  WHERE created_at > '2026-01-01'  (not left-most)","e":"An orders page filtered by user_id and sorted by date took 2.4 s on 30M rows. One composite index on (user_id, created_at) brought it to 4 ms.","p":["Wrapping the column in a function: WHERE LOWER(email) = ... won’t use a normal index on email (use an expression index)","LIKE '%term' with a leading wildcard can’t use a B-tree","Indexing every column “to be safe” and making writes slow","Wrong column order in composite indexes"],"v":["Caching","An index makes the DB’s lookup faster and is always up to date. A cache avoids the DB entirely but can be stale."],"f":["WHERE user_id = 7","!No index: scan 10M rows","B-tree index lookup","Jump to matching rows (~1 ms)"],"q":[["What is the left-most prefix rule?","A composite index on (a, b, c) can be used for queries on a, (a, b), or (a, b, c), but not for b or c alone."],["Why can indexes slow down a system?","Every write must update each index, adding CPU and IO, and indexes consume storage and memory."],["What is a covering index?","An index containing every column a query needs, so the database answers from the index alone without reading the table rows."]]},{"n":21,"c":"db","t":"Query Optimization","s":"Finding out WHY a query is slow and changing the query, indexes or schema so the database does far less work.","w":"When you send SQL, the database’s query planner chooses HOW to run it: which index, which join method, what order. Optimization means reading that plan, finding the expensive step, and fixing it. The goal is always the same: read fewer rows, and do fewer round trips.","y":"One slow query running on every page load can max out the database CPU and make the entire app slow. Usually a small fix (an index, a rewritten condition, fetching less data) gives 10× to 1000× speedups.","h":["Find the slow queries first: enable the slow query log or pg_stat_statements and sort by TOTAL time (calls × average), not just the single slowest.","Run EXPLAIN ANALYZE and read it. Look for “Seq Scan” on big tables, huge “rows” estimates, sorts spilling to disk, and nested loops over many rows.","Add or fix indexes for the WHERE, JOIN and ORDER BY columns (composite index in the right order).","Make conditions sargable (index-friendly): write created_at >= '2026-01-01' instead of YEAR(created_at) = 2026; avoid functions on indexed columns.","Select only needed columns instead of SELECT *, especially big text/JSON columns.","Use LIMIT and keyset pagination instead of huge OFFSET values.","Kill N+1 patterns: batch with IN (...) or JOIN.","Avoid OR across different columns that blocks index use; rewrite as UNION if needed.","Replace correlated subqueries with JOINs or EXISTS when the planner handles them badly.","Keep table statistics fresh (ANALYZE) so the planner estimates correctly.","For heavy reports: precompute with mater
