      <div class="deep-card deep-wide"><h3>3. Trace one operation from start to finish</h3><ol>${deepWalkthrough(t)}</ol></div>
      <div class="deep-card"><h3>4. What changes as the system grows?</h3><p>At small scale, the simplest implementation may be enough. As requests, data, or concurrent users increase, look for the resource that is becoming scarce: time, CPU, memory, network round trips, storage, connections, or human operational attention.</p><p>Use the lesson’s specific implementation steps as the starting point, then measure the real bottleneck before adding complexity.</p></div>
      <div class="deep-card"><h3>5. Know the limits of the analogy</h3><p>The real system has concurrency, partial failures, finite resources, and software-defined rules. Two requests can overlap; a network response can disappear after a write succeeds; and a copied value can become stale. Use the analogy to remember the idea, not as a substitute for these mechanics.</p></div>
    </div>
  </section>
  <section class="sec" id="s-deep-walk"><h2><span class="ico" aria-hidden="true">🔬</span>Worked walkthrough: from problem to result</h2>
    <p class="prose">Use this repeatable method on a real feature. It keeps the design grounded in observable behavior instead of technology names.</p>
    <div class="deep-grid">
      <div class="deep-card"><h3>Starting situation</h3><p>${esc(t.e)}</p><p>Turn the story into a concrete question: what must the user see happen, and what must remain true even if the request is slow, repeated, or interrupted?</p></div>
      <div class="deep-card"><h3>Initial implementation</h3><p>Begin with the smallest implementation that satisfies the feature. In this lesson, the first practical move is:</p><div class="deep-callout"><p>${esc(firstStep)}</p></div><p>Keep the behavior easy to reason about before optimising it.</p></div>
      <div class="deep-card deep-wide"><h3>Walk the request</h3><ol>${deepWalkthrough(t)}</ol><p>At every boundary, name the input, output, and failure mode. If a step changes durable data, ask what happens if the process stops immediately afterward.</p></div>
      <div class="deep-card"><h3>What the improved version must prove</h3><p>The design should satisfy the expected behavior and make its important assumptions visible. The final implementation step in this lesson is:</p><div class="deep-callout"><p>${esc(finalStep)}</p></div></div>
      <div class="deep-card"><h3>What this example does not prove</h3><p>A successful happy-path example does not prove the system is safe under concurrency, high traffic, partial outages, malformed input, or process restarts. Those need targeted tests and production signals.</p></div>
    </div>
    ${t.num?`<div class="deep-card deep-wide" style="margin-top:12px"><h3>Check the numbers, not just the story</h3><p>The guide’s estimate is a model with assumptions. Write down the unit for every value, show the arithmetic, and change one assumption at a time to see whether the conclusion changes.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:13.5px/1.7 var(--mono);margin:10px 0 0">${esc(t.num)}</pre></div>`:''}
  </section>
  <section class="sec" id="s-deep-choices"><h2><span class="ico" aria-hidden="true">⚖️</span>Trade-offs and when to use it</h2>
    <p class="prose">There is rarely one best architecture for every workload. Choose based on the problem you measured, the correctness guarantees you need, and the operational complexity your team can support.</p>
    <div class="deep-table-wrap"><table class="deep-table"><thead><tr><th>Decision question</th><th>What to examine</th><th>Practical rule</th></tr></thead><tbody>
    <tr><td>What problem am I solving?</td><td>${esc(t.y)}</td><td>Write down the symptom and baseline before selecting a tool.</td></tr>
    <tr><td>What is the simpler alternative?</td><td>${esc(t.v?.[0]||'A simpler implementation without this technique')}</td><td>Keep the simple design if it meets the requirement and measured load.</td></tr>
    <tr><td>What new failure can appear?</td><td>${esc(failure[0]||'Incorrect configuration, unexpected load, or a mismatch between assumptions and reality')}</td><td>Design the failure behavior before production traffic depends on it.</td></tr>
    <tr><td>How will I know it helped?</td><td>${esc(metricList[0]||'Measure latency, errors, resource usage, and correctness before and after the change.')}</td><td>Compare equivalent workloads; do not rely on intuition alone.</td></tr>
    </tbody></table></div>
    <div class="deep-grid">
      <div class="deep-card"><h3>Good reasons to use it</h3><ul><li>The problem it addresses is visible in measurements or a clear product requirement.</li><li>The team can explain the expected benefit and the new operational cost.</li><li>There is a test or metric that can confirm the outcome.</li></ul></div>
      <div class="deep-card"><h3>Reasons to wait</h3><ul><li>The system is small and the simpler approach already meets its targets.</li><li>The proposed tool adds another dependency without removing the actual bottleneck.</li><li>The team cannot yet monitor, recover, or safely operate the added component.</li></ul></div>
    </div>
  </section>
  <section class="sec" id="s-deep-debug"><h2><span class="ico" aria-hidden="true">🧰</span>Debugging: symptoms, causes, and checks</h2>
    <p class="prose">A symptom is evidence, not a diagnosis. Start with a reproducible observation, narrow down the layer responsible, and verify the fix under the condition that caused the failure.</p>
    <div class="deep-grid">${failure.map((x,i)=>`<div class="deep-card"><h3>Failure pattern ${i+1}: ${esc(x)}</h3><p><b>What you may observe:</b> requests become slower, errors rise, results are duplicated or missing, or resource use grows unexpectedly—depending on how this mistake affects the system.</p><p><b>How to investigate:</b> reproduce the scenario; inspect the relevant request logs and dependency metrics; compare a healthy request with a failing one; then test one hypothesis at a time.</p><p><b>Prevent recurrence:</b> add a regression test for this exact case and an alert or diagnostic signal if it can recur in production.</p></div>`).join('')}
    <div class="deep-card"><h3>Measure before and after</h3>${metricList.length?`<ul>${metricList.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>Record request latency, error rate, resource saturation, and correctness for the relevant operation. Use the same workload before and after the change.</p>'}<p>Do not conclude that a fix worked just because the code looks simpler. Verify both the intended improvement and the absence of regressions.</p></div></div>
  </section>
  <section class="sec" id="s-deep-practice"><h2><span class="ico" aria-hidden="true">✍️</span>Practice until you can explain it</h2>
    <div class="exercise"><details><summary>Exercise 1 · Explain it without memorising</summary><p>Explain <b>${esc(t.t)}</b> to a school student in three sentences: the problem, how the idea helps, and one limitation.</p><p><b>Hint:</b> Start with the problem described in “Why it matters”, then explain the idea in your own words.</p><p><b>Self-check:</b> Your answer should describe a cause-and-effect relationship, not only repeat the definition.</p></details></div>
    <div class="exercise"><details><summary>Exercise 2 · Apply it to a real application</summary><p>Imagine a growing application needs the behavior described in this lesson. Use this scenario as your starting point: <b>${esc(t.e)}</b></p><p>Write down the request flow, the data each step needs, and what happens if one dependency times out or returns an error.</p><p><b>Hint:</b> Start from this implementation step: ${esc(firstStep)}</p><p><b>Self-check:</b> A strong answer includes the happy path, at least one failure path, and a way to verify correctness.</p></details></div>
    <div class="exercise"><details><summary>Exercise 3 · Debug and defend your decision</summary><p>Pick one mistake: <b>${esc(failure[0]||'an incorrect assumption in the implementation')}</b>. Explain the symptom you would expect, the evidence you would collect, and the test you would add after fixing it.</p><p><b>Interview extension:</b> ${esc(questions[0]?.[0]||'When would you choose this approach, and what trade-off does it introduce?')}</p><p><b>Strong answer:</b> ${esc(questions[0]?.[1]||'Explain the mechanism, name a meaningful alternative, and justify the choice using requirements and measurements.')}</p></details></div>
    ${related.length?`<div class="deep-card" style="margin-top:12px"><h3>Connect this lesson to the wider system</h3><p>These related lessons are useful because real systems combine multiple mechanisms. Learn the current concept first, then compare how each connected topic changes the design.</p><div class="tlinks">${related.map(r=>topicLink(r,'tl',`<i></i><small>${esc(r.t)} · lesson ${num(r.n)}</small>`)).join('')}</div></div>`:''}
  </section>`;
}

  <section class="sec lesson-narrative" id="s-overview"><h2><span class="ico" aria-hidden="true">💡</span>Understand the idea</h2>
    <p class="prose">${esc(t.w)}</p>
    <p class="prose">${esc(t.y)}</p>
    <p class="prose"><b>Imagine it this way:</b> ${esc(analogy)} The analogy helps make the central idea memorable, but real software also has concurrent requests, network delays, finite resources, and partial failures. Those details are where the engineering decisions begin.</p>

  <section class="sec lesson-narrative" id="s-implementation"><h2><span class="ico" aria-hidden="true">🛠</span>How it works in practice</h2>
    <p class="prose">Follow one operation from the moment a request arrives until the system returns a result. Each action below exists for a reason; focus on what information it receives, what changes, and what could go wrong if that action fails.</p>
    ${stepNarrative}
    ${t.f&&t.f.length?`<div class="trip"><ol class="trip-row">${t.f.map(x=>{const bad=x.startsWith("!");return `<li class="tstop${bad?" bad":""}"><div class="dot" aria-hidden="true"></div><div class="lab">${bad?'<span class="badmark" aria-label="Problem:">✕ </span>':""}${esc(bad?x.slice(1):x)}</div><div class="seg" aria-hidden="true"></div></li>`}).join("")}</ol><div class="trip-foot"><span>Stops marked ✕ show where things can go wrong.</span><button class="mini" id="replay">↻ Replay</button></div></div>`:""}

  <section class="sec lesson-narrative" id="s-reliability"><h2><span class="ico" aria-hidden="true">⚖️</span>Trade-offs, failures, and how to verify the design</h2>
    <p class="prose">This technique is useful when it solves the problem described above and the benefit is worth its complexity. It is not automatically the right choice for every application. A simpler alternative may be enough when traffic is small or the existing design already meets its targets. The meaningful question is: what evidence shows that this change is needed, and how will you prove it helped?</p>

    ${mistakeNarrative}
    ${metricNarrative?`<div class="metric-story"><h3>What to watch after deployment</h3>${metricNarrative}<p class="note">Compare the same workload before and after the change. A cleaner-looking implementation is not proof of better behavior.</p></div>`:""}
    <div class="exercise"><details><summary>Practice: explain the decision in your own words</summary><p>Explain <b>${esc(t.t)}</b> without repeating the definition. Describe the problem it solves, walk through one real request, and name one situation where this approach could be unnecessary or fail.</p><p><b>Scenario:</b> ${esc(t.e)}</p><p><b>Self-check:</b> Your explanation should include cause and effect, one trade-off, and a way to verify the outcome.</p></details></div>
  </section>

  <section class="sec lesson-narrative" id="s-quiz"><h2><span class="ico" aria-hidden="true">🧠</span>Interview practice</h2><p class="prose">Try answering in your own words before revealing the explanation. The aim is to explain the mechanism and justify a decision, not memorise a sentence.</p>

  ${t.k?`<section class="sec lesson-narrative" id="s-check"><h2><span class="ico" aria-hidden="true">✅</span>Quick check</h2><fieldset class="mcq"><legend>${esc(t.k[0])}</legend>${t.k[1].map((o,i)=>`<label class="opt"><input type="radio" name="mcq" value="${i}"><span>${esc(o)}</span></label>`).join("")}<div class="row"><button class="btn primary" id="checkBtn" type="button">Check answer</button>${prevQuiz?`<span class="note">Last attempt: ${prevQuiz.ok?"correct ✓":"incorrect ✕"}</span>`:""}</div><div class="mcqfb" id="mcqFb" role="status" aria-live="polite"></div></fieldset></section>`:""}
  ${rel.length?`<section class="sec lesson-narrative" id="s-next"><h2><span class="ico" aria-hidden="true">🧭</span>Related lessons</h2><p class="prose">This concept becomes more useful when you understand how it interacts with the rest of a system. Follow a related lesson when you are ready to connect the ideas.</p><div class="tlinks">${rel.map(r=>topicLink(r,"tl",`<i></i><small>${esc(LINES[r.c].name)} · lesson ${num(r.n)}</small>`)).join("")}</div></section>`:""}
  <div class="endnav"><button class="btn" id="prevB" ${prev?"":"disabled"}>← Previous</button><button class="btn primary" id="learn">${isDone?"✓ Learned":"Mark as learned"}</button><button class="btn" id="nextB" ${next?"":"disabled"}>Next →</button></div>
  </article>`;
  bindLesson(t,prev,next);
}
function bindLesson(t,prev,next){
  const n=t.n;
  $("#copy")&&($("#copy").onclick=async()=>{ const b=$("#copy"); try{ await navigator.clipboard.writeText(t.code); b.textContent="Copied ✓"; }catch(e){ b.textContent="Copy failed: select the text"; } setTimeout(()=>{ if(b.isConnected) b.textContent="Copy"; },1800); });
  $("#replay")&&($("#replay").onclick=playTrip);
  $("#linkBtn").onclick=async()=>{ const link=shareLink(t,null); try{ await navigator.clipboard.writeText(link); toast("Link copied: "+link); }catch(e){ toast("Copy this link: "+link); } };
  $("#rvBtn").onclick=()=>toggleReview(n);
  const seen=new Set();
  $$(".flip").forEach(b=>b.onclick=()=>{ const o=b.classList.toggle("open"); b.setAttribute("aria-expanded",String(o)); if(o) seen.add(b.dataset.i); $("#score").textContent=seen.size+" of "+t.q.length+" revealed"+(seen.size===t.q.length?" · now try the knowledge check":""); });
  $("#checkBtn")&&($("#checkBtn").onclick=()=>{
    const sel=$('input[name="mcq"]:checked'), fb=$("#mcqFb");
    if(!sel){ fb.textContent="Pick an answer first."; fb.className="mcqfb"; return; }
    const ok=+sel.value===t.k[2];
    $$(".opt").forEach((l,i)=>{ l.classList.toggle("right",i===t.k[2]); l.classList.toggle("wrong",i===+sel.value&&!ok); });
    fb.className="mcqfb "+(ok?"good":"bad");
    fb.innerHTML=`<b>${ok?"Correct.":"Not quite."}</b> ${esc(t.k[3])}`;
    S.quiz[n]={ok,at:Date.now()}; save();
  });
  $("#learn").onclick=()=>toggleLearned(n);
  $("#prevB").onclick=()=>prev&&go(prev.n);
  $("#nextB").onclick=()=>next&&go(next.n);
  $("#jump").addEventListener("click",e=>{ const a=e.target.closest("a[data-sec]"); if(!a) return; e.preventDefault();
    const s=a.dataset.sec; scrollToSection(s,true); syncUrl(t,s,"replace"); if(S.view) S.view.section=s; save(); });
  $("#main").querySelectorAll(".tlinks").forEach(box=>box.addEventListener("click",navClick));
  if(sectionObserver) sectionObserver.disconnect();
  if("IntersectionObserver" in window){
    sectionObserver=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(!en.isIntersecting) return; const id=en.target.id.slice(2);
        $$("#jump a").forEach(a=>{ const on=a.dataset.sec===id; if(on) a.setAttribute("aria-current","true"); else a.removeAttribute("aria-current"); });
        const cur=$('#jump a[aria-current]'); if(cur){ const j=$("#jump"); j.scrollLeft=cur.offsetLeft-j.clientWidth/2+cur.clientWidth/2; }
        S.lastSection=id; save(); });
    },{rootMargin:"-90px 0px -65% 0px"});
    $$(".lesson .sec").forEach(s=>sectionObserver.observe(s));
  }
}
function toggleLearned(n){
  const t=byN(n), y=window.scrollY;
  if(learned.has(n)){ learned.delete(n); save(true); toast("Unmarked. It’s back on your study list."); }
  else{ learned.add(n); save(true); const d=bumpStreak(); showStreak(); confetti(LINES[t.c].c);
    const all=inLine(t.c);
    if(learned.size===T.length) toast("🏆 All "+T.length+" stations. You’ve mapped the entire network.");
    else if(all.every(x=>learned.has(x.n))) toast("🎉 You finished the whole "+LINES[t.c].name+" line!");
    else toast("Station learned · "+learned.size+" of "+T.length+(d>1?" · 🔥 "+d+"-day streak":"")); }
  renderLesson(t); requestAnimationFrame(()=>window.scrollTo(0,y));
}
function toggleReview(n){
  review.has(n)?review.delete(n):review.add(n); save(true);
  const b=$("#rvBtn"); if(b&&current===n){ const on=review.has(n); b.setAttribute("aria-pressed",String(on)); b.textContent=on?"★ In review list":"☆ Review later"; }
  toast(review.has(n)?"Added to your review list.":"Removed from your review list."); renderSide();
}

  if(e.key==="Escape"){ closePal(); closeSheet(); return; }
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName); if(typing||$("#pal").classList.contains("open")||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); openPal(); }
  else if(e.key==="ArrowRight"&&current&&nb(current,1)) go(nb(current,1).n);
  else if(e.key==="ArrowLeft"&&current&&nb(current,-1)) go(nb(current,-1).n);
  else if(e.key.toLowerCase()==="l"&&current) toggleLearned(current);
  else if(e.key.toLowerCase()==="r"&&current) toggleReview(current);
});
let sx=0,sy=0,st=0;
$("#main").addEventListener("touchstart",e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); },{passive:true});
$("#main").addEventListener("touchend",e=>{ if(!current) return; const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
  if(Date.now()-st<600&&Math.abs(dx)>90&&Math.abs(dy)<50&&!e.target.closest(".code,.calc,.map-scroll,.jump,.mcq")){ const x=nb(current,dx<0?1:-1); x&&go(x.n); } },{passive:true});

/* ---------- reading progress (lesson body only) ---------- */
function updateReadbar(){
  const bar=$("#readbar"), art=$(".lesson");
  if(!art){ bar.style.width="0"; return; }
  const top=art.getBoundingClientRect().top+window.scrollY, h=art.offsetHeight, vh=window.innerHeight;
  const span=Math.max(1,h-vh*0.6); const p=Math.min(1,Math.max(0,(window.scrollY-top+vh*0.4)/span));
  bar.style.width=(p*100).toFixed(1)+"%";
}
addEventListener("resize",updateReadbar,{passive:true});

/* ---------- toast + confetti ---------- */
let tt; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2800); }
function confetti(color){
  if(reduce) return; const cv=$("#confetti"), cx=cv.getContext("2d"), dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols=[color,"#ffffff",...ORDER.map(k=>LINES[k].c)], P=[], ox=innerWidth/2, oy=innerHeight*0.75;
  for(let i=0;i<120;i++){ const a=-Math.PI/2+(Math.random()-.5)*1.6, v=7+Math.random()*9; P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,round:Math.random()<.4}); }
  let f=0; (function tick(){ cx.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; if(p.round){ cx.beginPath(); cx.arc(0,0,p.r,0,7); cx.fill(); } else cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
    if(++f<110) requestAnimationFrame(tick); else cx.clearRect(0,0,innerWidth,innerHeight); })();
}

/* ---------- theme ---------- */
function applyTheme(m){ if(m) document.documentElement.dataset.theme=m; const dark=m?m==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme").textContent=dark?"☀︎":"☾"; $("#theme").setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
  document.querySelector('meta[name="theme-color"]').content=dark?"#0E1430":"#F2F4FA"; }
let th=null; try{ th=localStorage.getItem(THEME_KEY); }catch(e){}
applyTheme(th==="light"||th==="dark"?th:null);
$("#theme").onclick=()=>{ const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; const n=dark?"light":"dark"; applyTheme(n); try{ localStorage.setItem(THEME_KEY,n); }catch(e){} };

/* ---------- boot ---------- */
$("#brandCount").textContent=T.length+" stations";
showStreak();
if(!routeFromLocation("replace")){
  const v=S.view;
  if(!CAN_PUSH && v && v.n && byN(v.n)) go(v.n,{section:v.section,mode:"none",y:typeof v.y==="number"?v.y:undefined});
  else goHome({mode:"replace"});
}
