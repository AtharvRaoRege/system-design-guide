<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1530">
<title>System Design Metro — learn it station by station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FA;--bg2:#E8ECF6;--surface:#FFFFFF;--surface2:#F6F7FC;--ink:#141A33;--muted:#5A6386;--line:#DCE1EF;--line2:#C9D0E4;
  --grid:rgba(20,26,51,.045);--shadow:0 1px 0 rgba(20,26,51,.04),0 10px 30px -14px rgba(20,26,51,.25);
  --code-bg:#151B36;--code-ink:#E6EAFF;--bad:#E5484D;--good:#14946B;
  --accent:#5B5BF0;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1430;--bg2:#121A3B;--surface:#161E42;--surface2:#1B2450;--ink:#E9EDFF;--muted:#9DA6CC;--line:#273266;--line2:#33407A;
  --grid:rgba(160,175,255,.06);--shadow:0 1px 0 rgba(0,0,0,.2),0 16px 40px -18px rgba(0,0,0,.7);
  --code-bg:#0A0F26;--code-ink:#E6EAFF;--bad:#FF6B70;--good:#3DD9A4;--accent:#8C8CFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1430;--bg2:#121A3B;--surface:#161E42;--surface2:#1B2450;--ink:#E9EDFF;--muted:#9DA6CC;--line:#273266;--line2:#33407A;
  --grid:rgba(160,175,255,.06);--shadow:0 1px 0 rgba(0,0,0,.2),0 16px 40px -18px rgba(0,0,0,.7);
  --code-bg:#0A0F26;--code-ink:#E6EAFF;--bad:#FF6B70;--good:#3DD9A4;--accent:#8C8CFF;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--body);min-height:100vh;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,24px);
  background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.4px;white-space:nowrap}
.brand-mark{width:30px;height:30px;flex:none}
.brand small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px;letter-spacing:0}
.top-spacer{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:14px;min-height:40px}
.kbtn:hover{border-color:var(--line2);color:var(--ink)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.pill{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.readbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;z-index:70;background:var(--lc,var(--accent));transition:width .1s}

.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
/* sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);height:calc(100vh - 61px - env(safe-area-inset-top,0px));overflow:auto;padding:18px 14px 40px;border-right:1px solid var(--line);overscroll-behavior:contain}
.side-head{display:flex;gap:14px;align-items:center;padding:6px 6px 16px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring text{font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink)}
.side-stats strong{font-family:var(--display);font-size:18px;display:block;line-height:1.2}
.side-stats span{color:var(--muted);font-size:13.5px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px}
.search:focus{border-color:var(--accent)}
.filters{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lgroup{margin:4px 0 8px}
.lhead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;border-radius:10px;text-align:left}
.lhead:hover{background:var(--surface2)}
.lhead .sw{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent);flex:none}
.lhead b{font-family:var(--display);font-weight:700;font-size:15px;flex:1}
.lhead em{font-style:normal;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lhead .chev{transition:transform .2s;color:var(--muted)}
.lgroup.closed .chev{transform:rotate(-90deg)}
.lgroup.closed .stations{display:none}
.stations{position:relative;margin:2px 0 6px 14px;padding-left:14px}
.stations::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c);opacity:.85}
.st{position:relative;display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:6px 8px;border-radius:9px;font-size:14.5px;line-height:1.35;color:var(--muted)}
.st::before{content:"";position:absolute;left:-19px;top:9px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--c)}
.st.done::before{background:var(--c)}
.st:hover{background:var(--surface2);color:var(--ink)}
.st.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.newtag{display:inline-block;font-size:10.5px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--c);color:#111;vertical-align:1px;margin-left:4px}
.st .no{font-family:var(--mono);font-size:11.5px;min-width:24px;opacity:.75}
.empty{padding:14px;color:var(--muted);font-size:14px}

main{min-width:0;padding:clamp(18px,4vw,52px) clamp(16px,4vw,56px) 120px}
.wrap{max-width:780px;margin:0 auto}

/* home */
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7.4vw,84px);line-height:.95;letter-spacing:-.045em;margin:6px 0 18px;max-width:12ch}
.hero p{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:58ch;margin:0 0 22px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 18px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:15.5px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed}

.map{margin:40px -8px 0;padding:22px 8px 10px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.map-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 18px 12px;flex-wrap:wrap}
.map-top h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.02em}
.map-top span{color:var(--muted);font-size:14px}
.map-scroll{overflow-x:auto;padding:4px 0 14px;-webkit-overflow-scrolling:touch}
.mrow{display:grid;grid-template-columns:150px auto;align-items:center;min-width:max-content;padding:6px 18px}
.mrow .lbl{position:sticky;left:0;z-index:2;background:var(--surface);padding-right:12px;font-family:var(--display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.mrow .lbl i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.track{justify-self:start;position:relative;display:flex;gap:12px;padding:10px 6px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:var(--c);transform-origin:left;animation:draw 1.1s cubic-bezier(.6,0,.2,1) both;animation-delay:var(--d,0s)}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stn{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--c);flex:none;transition:transform .15s}
.stn.done{background:var(--c)}
.stn:hover,.stn:focus-visible{transform:scale(1.35)}
.stn .tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;font-weight:700}
.stn:hover .tip,.stn:focus-visible .tip{opacity:1}
.mrow:first-child .stn .tip{bottom:auto;top:calc(100% + 10px)}
.map-legend{display:flex;gap:16px;padding:6px 18px 4px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.map-legend b{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--muted);vertical-align:-1px;margin-right:6px}
.map-legend b.f{background:var(--muted)}

.lines-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:26px 0}
.lcard{text-align:left;padding:16px 16px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.lcard:hover{border-color:var(--c)}
.lcard b{font-family:var(--display);font-size:17px;display:block}
.lcard span{color:var(--muted);font-size:14px}
.lbar{height:5px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}
.lbar div{height:100%;background:var(--c);border-radius:5px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 0}
.howto div{padding:16px;border-radius:18px;border:1px dashed var(--line2)}
.howto b{font-family:var(--display);display:block;font-size:16px;margin-bottom:4px}
.howto p{margin:0;color:var(--muted);font-size:15px}
.note{color:var(--muted);font-size:14px}

/* lesson */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lbadge{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:color-mix(in srgb,var(--lc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--lc) 45%,transparent);color:var(--ink);font-weight:700}
.lbadge i{width:18px;height:18px;border-radius:50%;background:var(--lc);display:inline-grid;place-items:center;font-style:normal;font-size:10px;color:#111;font-family:var(--mono);font-weight:600}
.lesson h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6.4vw,66px);line-height:1;letter-spacing:-.04em;margin:16px 0 18px}
.tldr{font-size:clamp(19px,2.4vw,23px);line-height:1.5;margin:0 0 22px;padding-left:18px;border-left:6px solid var(--lc);font-family:var(--body)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 0 6px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;font-size:13.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.jump a:hover{color:var(--ink);border-color:var(--lc)}
.sec{margin:38px 0 0}
.sec h2{font-family:var(--display);font-size:clamp(23px,3vw,28px);letter-spacing:-.025em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.sec h2 .ico{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--lc) 20%,transparent);font-size:17px;flex:none}
.prose{font-size:17.5px;line-height:1.8;margin:0;max-width:68ch}

.deep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.deep-card{min-width:0;padding:17px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.deep-card h3{font:700 17px/1.35 var(--display);margin:0 0 8px;color:var(--ink)}
.deep-card p,.deep-card li{font-size:15.5px;line-height:1.72;color:var(--ink)}
.deep-card p{margin:0 0 9px}.deep-card p:last-child{margin-bottom:0}
.deep-card ul,.deep-card ol{margin:8px 0 0;padding-left:21px}
.deep-card li+li{margin-top:7px}
.deep-wide{grid-column:1/-1}
.deep-callout{padding:15px 17px;border-left:4px solid var(--lc);background:color-mix(in srgb,var(--lc) 8%,var(--surface));border-radius:0 14px 14px 0;margin-top:12px}
.deep-callout p{margin:0;font-size:15.5px;line-height:1.75}
.deep-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}
.deep-table{border-collapse:collapse;width:100%;min-width:520px;background:var(--surface);font-size:14.5px;line-height:1.6}
.deep-table th,.deep-table td{padding:11px 13px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.deep-table th{background:var(--surface2);font-family:var(--display)}
.deep-table tr:last-child td{border-bottom:0}
.exercise{padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:10px}
.exercise summary{cursor:pointer;font-weight:700;line-height:1.5}.exercise p{font-size:15.5px;line-height:1.7}
@media(max-width:680px){.deep-grid{grid-template-columns:1fr}.deep-wide{grid-column:auto}.deep-card{padding:15px}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;position:relative}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 54px;border-bottom:1px solid var(--line);line-height:1.65}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:var(--lc);color:#111}
.code{position:relative;margin:18px 0 0;border-radius:16px;background:var(--code-bg);color:var(--code-ink);overflow:hidden}
.code pre{margin:0;padding:18px 18px 18px;overflow-x:auto;font:13.5px/1.65 var(--mono);tab-size:2}
.code .copy{position:absolute;top:8px;right:8px;font-size:12.5px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#fff}
.code .copy:hover{background:rgba(255,255,255,.2)}
.code .cbar{display:flex;gap:6px;padding:12px 16px 0}
.code .cbar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18)}
.story{padding:22px 22px 22px 24px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.story::before{content:"“";position:absolute;right:16px;top:-14px;font-family:var(--display);font-size:110px;line-height:1;color:var(--lc);opacity:.35}
.story p{margin:0;font-size:17.5px;line-height:1.75}

/* trip diagram */
.trip{padding:22px 18px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.trip-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.tstop{position:relative;text-align:center;padding:0 6px}
.tstop .dot{position:relative;z-index:2;width:28px;height:28px;margin:0 auto 12px;border-radius:50%;background:var(--surface);border:5px solid var(--line2);transition:all .35s}
.tstop .lab{font-size:14.5px;line-height:1.4;color:var(--muted);transition:color .35s}
.tstop .seg{position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:6px;border-radius:6px;background:var(--line);overflow:hidden;z-index:1}
.tstop .seg::after{content:"";position:absolute;inset:0;background:var(--lc);transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.tstop:last-child .seg{display:none}
.tstop.on .dot{border-color:var(--lc);background:var(--lc);transform:scale(1.08)}
.tstop.on .lab{color:var(--ink);font-weight:700}
.tstop.on.passed .seg::after{transform:scaleX(1)}
.tstop.bad.on .dot{border-color:var(--bad);background:var(--bad)}
.tstop.bad.on .lab{color:var(--bad)}
.trip-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.trip-foot span{color:var(--muted);font-size:13.5px}
.mini{padding:7px 12px;border-radius:10px;border:1px solid var(--line2);font-size:13.5px;font-weight:700;background:var(--surface2)}

.oops{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.oops li{display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--bad) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 25%,transparent);line-height:1.55}
.oops li::before{content:"✕";flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-top:1px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.vs .side-a,.vs .side-b{padding:18px}
.vs .side-a{background:color-mix(in srgb,var(--lc) 12%,var(--surface))}
.vs b{font-family:var(--display);font-size:18px;display:block;margin-bottom:2px}
.vs small{color:var(--muted);font-size:13px}
.vs .mid{display:grid;place-items:center;padding:0 6px;font-family:var(--display);font-weight:800;color:var(--muted);background:var(--surface2)}
.vs .txt{grid-column:1/-1;padding:16px 18px;border-top:1px solid var(--line);font-size:16.5px;line-height:1.7}

.cards{display:grid;gap:12px}
.flip{perspective:1200px;text-align:left;width:100%}
.flip .in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-height:96px;display:flex;flex-direction:column;justify-content:center}
.flip .back{transform:rotateY(180deg);background:color-mix(in srgb,var(--lc) 10%,var(--surface));border-color:color-mix(in srgb,var(--lc) 45%,transparent)}
.flip.open .in{transform:rotateY(180deg)}
.flip .q{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.35;letter-spacing:-.01em}
.flip .hint{font-size:13px;color:var(--muted);margin-top:8px}
.flip .a{font-size:16.5px;line-height:1.65}
.score{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}

.finish{margin:46px 0 0;padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:16px}
.finish .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.learnbtn{min-height:52px;padding:12px 22px;border-radius:16px;font-weight:800;font-size:16.5px;background:var(--lc);color:#111;border:0;display:inline-flex;gap:10px;align-items:center}
.learnbtn.is-done{background:var(--surface2);color:var(--ink);border:1px solid var(--line2)}
.navs{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* palette */

.pal-box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden}
.pal-box input{width:100%;padding:18px 20px;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:18px}

.pr{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.pr i{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:6px;flex:none}
.pr b{display:block;font-size:15.5px}
.pr span{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}

/* toast + confetti */

.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:96;width:100%;height:100%}

/* dock (mobile) */
.dock{display:none}
.scrim{display:none}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .brand small,.kbtn .lbl,.kbtn .kbd{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(78vh,720px);z-index:80;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 30px);box-shadow:0 -20px 60px -20px rgba(0,0,0,.5)}
  .side::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 10px}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;z-index:79;background:rgba(8,10,25,.45)}
  .scrim.open{display:block}
  .dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:60;
    background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
  .dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;font-size:11px;color:var(--muted);min-height:48px;justify-content:center}

}
@media (max-width:640px){

  .tstop .seg{left:11px;right:auto;top:28px;width:6px;height:auto;bottom:-0px}

  .vs{grid-template-columns:1fr}
  .vs .mid{padding:6px}
  .navs{grid-template-columns:1fr}
  .navs .nx{text-align:left}
  .mrow{grid-template-columns:116px auto}

}

.stn.seen{background:radial-gradient(circle,var(--c) 0 4px,var(--surface) 4.5px)}
.map-legend b.h{background:radial-gradient(circle,var(--muted) 0 2px,transparent 2.5px)}

.goals li::marker{color:var(--lc)}
.calc{border-radius:18px;border:1px solid var(--line);background:var(--surface);overflow:hidden}

.homesearch:focus-within{border-color:var(--accent)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0 0}
.statrow div{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.statrow b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}

.hbox{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.hbox h2{font-family:var(--display);font-size:18px;margin:0 0 4px}
.hbox .note{margin:0 0 10px}
.hbox .tlinks{grid-template-columns:1fr}
.notfound h1{font-family:var(--display);font-size:clamp(34px,6vw,56px);letter-spacing:-.03em;line-height:1;margin:10px 0 16px}
.notfound h2{font-family:var(--display);margin:24px 0 10px}
.palhint{font-size:12.5px;color:var(--muted);padding:8px 12px 2px}
.pr small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.badmark{font-weight:800}
ol.trip-row{list-style:none;margin:0;padding:0}
.code .cbar span{margin-left:8px;font:12px var(--mono);color:rgba(255,255,255,.55);align-self:center}
@media (max-width:640px){.statrow{grid-template-columns:repeat(2,1fr)}.tlinks{grid-template-columns:1fr}}
.brand{min-width:0;flex-shrink:1}

<script>
const T = [{"n":1,"c":"rel","t":"Idempotency Keys","s":"A unique ID sent with a request so the server can say “I already did this one” instead of doing it twice.","w":"“Idempotent” means: doing it once or doing it ten times gives the same final result. An idempotency key is a random ID (usually a UUID) that the client creates once per action, like “pay ₹500 for order 42”, and sends in a header such as Idempotency-Key. The server saves the key together with the result. If the same key shows up again, the server does not run the action again. It just sends back the saved result.","y":"Networks are unreliable. Your app sends “pay ₹500”, the bank charges the card, but the reply gets lost. The app thinks it failed and retries. Without a key, the server sees a brand new payment and charges again. Same thing happens when a user double-taps a button. GET and PUT are usually safe to repeat, but POST (create something) is not. Idempotency keys make POST safe to retry.","h":["Client generates one UUID per user action (not per attempt) and reuses it for every retry of that action.","Server checks a store (DB table or Redis) for the key before doing any work.","If the key is new: insert it with status “in progress” using a unique constraint, so two parallel requests cannot both win.","Do the work, then save the response (status code + body) next to the key.","If the key already exists and is finished: return the saved response. If it is still in progress: return 409 Conflict or ask the client to wait.","Scope keys per user/account and expire them after a sensible window, e.g. 24 hours.","If the same key arrives with a different request body, reject it (422). That is a client bug."],"code":"-- unique constraint is what makes this race-safe\nCREATE TABLE idempotency (\n  user_id   BIGINT,\n  key       TEXT,\n  status    TEXT,          -- in_progress | done\n  response  JSONB,\n  created_at TIMESTAMPTZ DEFAULT now(),\n  PRIMARY KEY (user_id, key)\n);\n-- INSERT ... ON CONFLICT DO NOTHING\n-- 0 rows inserted => this key was seen before","e":"Stripe’s API accepts an Idempotency-Key header on every POST. If your checkout server crashes after calling Stripe and you retry with the same key, Stripe returns the first charge instead of creating a second one.","p":["Generating a new key on every retry (then it protects nothing)","Checking “does key exist?” and then inserting in two separate steps, which is itself a race condition","Storing keys only in server memory, so they vanish on restart or on another server","Never expiring keys, so the table grows forever"],"v":["Retries","A retry is “try again”. An idempotency key is what makes “try again” safe. You usually need both together."],"f":["Client sends pay + key K1","!Reply lost on network","Client retries with K1","Server sees K1, returns saved result"],"q":[["Who should generate the idempotency key, client or server?","The client, because only the client knows that two attempts are the same action. The server only stores and checks it."],["How do you stop two simultaneous requests with the same key from both running?","Insert the key first using a unique/primary-key constraint. Only one insert can succeed; the other sees a conflict and waits or gets 409."],["Is GET idempotent by default? Is POST?","GET, PUT and DELETE are idempotent by HTTP definition. POST is not, which is why POST endpoints that create money movements or orders need idempotency keys."],["Debugging: customers report occasional double charges even though you use idempotency keys. Where do you look?","Check that the client reuses the same key across retries (not one per attempt), that the server inserts the key atomically before doing work (unique constraint, not check-then-insert), that keys are stored durably and shared across servers, and that the call to the payment provider also passes an idempotency key."],["What should the server return if a request arrives with a key that is still being processed?","Usually 409 Conflict (or 425/429 with Retry-After) so the client waits and retries later; it must not start the operation a second time."]],"r":[11,120,126,125],"num":"Mobile checkout, 2M payments/day, 1% of replies time out and get retried.\nRetries/day = 2,000,000 × 0.01 = 20,000\nWithout keys: up to 20,000 possible double charges per day.\nKey storage: ~200 bytes/key × 2M/day × 1 day TTL ≈ 400 MB (fine for Redis or a DB table).","m":["Replayed-key rate: share of requests that hit an existing key. A sudden jump means a client retry bug or network trouble.","Key conflicts (409s): requests arriving while the same key is still in progress; high values mean clients retry too fast.","Key mismatch errors (422): same key, different body. Almost always a client bug worth fixing."],"k":["A client times out on POST /payments and retries with a NEW idempotency key. What happens?",["The server detects the duplicate and returns the first result","The server may charge twice, because it sees two different operations","The server rejects the second request with 409","The payment provider automatically deduplicates it"],1,"The key is what tells the server two attempts are the same action. A new key looks like a brand new payment, so the protection only works if the client reuses the key for every retry of one action."],"sl":"idempotency-keys"},{"n":2,"c":"rel","t":"Rate Limiting","s":"A rule that says “each client may make at most X requests per time window”, and blocks the rest.","w":"Rate limiting counts how many requests a client (a user, an API key, or an IP address) sends, and refuses extra requests once a limit is hit. The server replies with HTTP 429 Too Many Requests and usually a Retry-After header saying when to try again. It is like a ride at a fair that only lets 20 people in every 5 minutes.","y":"Without limits, one buggy script, one scraper or one attacker can send thousands of requests per second and slow the service down for everyone. Login pages without limits allow password guessing. Expensive endpoints (search, AI calls, SMS sending) can also create huge bills.","h":["Decide WHO you are limiting: user ID for logged-in APIs, API key for partners, IP for anonymous traffic like login.","Pick an algorithm. Fixed window: count per minute, simple but allows bursts at the window edge. Sliding window: smoother and more accurate. Token bucket: a bucket refills at a steady rate and each request takes a token, which allows short bursts but limits the average.","Store counters in a shared fast store like Redis, so all your servers see the same count.","Return 429 with Retry-After and headers like X-RateLimit-Remaining so good clients can slow down.","Use different limits per endpoint: login might be 5/minute, reading a feed 600/minute.","Enforce at the edge too (API gateway, CDN, Nginx) so bad traffic is dropped before it reaches app servers."],"code":"# token bucket idea (pseudo)\ntokens = min(capacity, tokens + rate * seconds_since_last)\nif tokens >= 1:\n    tokens -= 1      # allow\nelse:\n    return 429       # reject, Retry-After: (1-tokens)/rate","e":"GitHub’s API allows 5,000 requests per hour per logged-in user. Every response tells you how many you have left. When you hit zero you get 403/429 until the hour resets.","p":["Counting in each server’s memory, so with 10 servers the real limit is 10× bigger","Limiting only by IP: many users behind one office or mobile network share an IP and get blocked together","Forgetting to tell the client when to retry","One global limit for cheap and expensive endpoints"],"v":["Backpressure","Rate limiting is a policy: “you are allowed 100 per minute”, even if the server is idle. Backpressure is a reaction to load: “I am overloaded right now, slow down”."],"f":["Request arrives","Check counter in Redis","Under limit: process","!Over limit: 429 + Retry-After"],"q":[["Fixed window vs token bucket, what’s the difference?","Fixed window resets a counter every period and lets 2× traffic slip through at the boundary. Token bucket refills steadily, allows controlled bursts up to bucket size, and enforces a smooth average."],["Why store counters in Redis instead of memory?","With many app servers, each has its own memory. A shared store gives one accurate count across all servers."],["What status code and headers should a rate-limited response have?","429 Too Many Requests, plus Retry-After, and optionally X-RateLimit-Limit / Remaining / Reset."],["Your limiter works locally but production users can exceed it by 10×. Why?","Counters are probably kept in each server’s memory. With 10 servers each enforcing the limit separately, the real limit is 10× higher. Move counters to a shared store (Redis) or enforce at a single edge layer."],["Should a rate limiter fail open or fail closed when Redis is down?","It depends on the endpoint: fail open for normal reads to avoid an outage, fail closed (or fall back to a local, stricter limit) for sensitive endpoints like login or SMS sending where abuse is costly."]],"r":[40,12,9,53],"num":"Login endpoint, limit 5 attempts/min per account.\nAttacker guessing passwords: 5 × 60 × 24 = 7,200 guesses/day per account (instead of millions).\nToken bucket: capacity 20, refill 10/s → bursts of 20 allowed, average capped at 10 req/s.\nRedis cost: 1 counter per active client; 1M clients × ~100 bytes ≈ 100 MB.","m":["429 rate by client and endpoint: who is being limited and how often. Many legit users hitting limits means limits are too strict.","Requests per client (top N): finds abusive scrapers and buggy integrations.","Limiter store latency/errors: if Redis is slow or down, decide whether you fail open (allow) or fail closed (block)."],"k":["Why can a fixed-window limit of 100/minute let a client send about 200 requests in a few seconds?",["Because Redis counters are approximate","Because the client can send 100 at the end of one window and 100 at the start of the next","Because 429 responses don’t count","Because fixed windows don’t reset"],1,"Fixed windows reset at hard boundaries, so a burst straddling the boundary gets two full allowances. Sliding windows or token buckets smooth this out."],"sl":"rate-limiting"},{"n":3,"c":"net","t":"Reverse Proxies","s":"A server that stands in front of your app servers, receives every request first, and forwards it to the right one.","w":"Users never talk to your app servers directly. They talk to the reverse proxy (Nginx, HAProxy, Envoy, Caddy, or a cloud load balancer). The proxy decides where the request goes, forwards it, gets the answer and passes it back. To the user it looks like one server.","y":"Without it, every app server must handle HTTPS certificates, compression, security headers and be exposed to the internet. You cannot easily send /api to one service and /images to another, or hide which servers exist.","h":["Terminate TLS at the proxy: the certificate lives in one place.","Route by path or host: /api → API servers, / → frontend, admin.site.com → admin service.","Add gzip/brotli compression, caching of static files and security headers here.","Pass the real client IP with X-Forwarded-For, and configure the app to trust that header ONLY from the proxy.","Set timeouts and request size limits at the proxy to stop slow or giant requests.","Keep app servers on a private network so the proxy is the only door."],"code":"# nginx\nserver {\n  listen 443 ssl;\n  location /api/ { proxy_pass http://api_servers; }\n  location /     { proxy_pass http://web_servers; }\n  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n}","e":"A typical startup runs Nginx on the front. It handles HTTPS with a Let’s Encrypt certificate, serves the React build files directly, and forwards /api calls to three Node.js servers.","p":["Trusting X-Forwarded-For from anyone: attackers can fake their IP","Proxy timeouts shorter than app timeouts, causing confusing 504 errors","Making the single proxy a single point of failure (run two)"],"v":["Forward Proxy","A reverse proxy acts on behalf of SERVERS (users don’t know which server answers). A forward proxy acts on behalf of CLIENTS, like a company proxy that all employees' browsing goes through."],"f":["User request","Reverse proxy (TLS, routing)","Correct app server","Response back via proxy"],"q":[["Name four jobs a reverse proxy commonly does.","TLS termination, routing by path/host, load balancing, compression/caching, and hiding internal servers."],["Is a load balancer a reverse proxy?","Most load balancers are reverse proxies that focus on spreading traffic across many identical servers. A reverse proxy can also do routing to different services, TLS, caching etc."],["How does the app know the real client IP behind a proxy?","Through X-Forwarded-For (or the Forwarded header), which the app should trust only when the request came from the known proxy."],["Users get 504 Gateway Timeout but app logs show requests completing in 70 seconds. Explain.","The proxy’s upstream timeout (e.g. 60 s) is shorter than the app’s processing time, so the proxy gives up and returns 504 while the app keeps working. Align timeouts or make the slow operation asynchronous."],["Why is trusting X-Forwarded-For from any client dangerous?","Clients can set the header themselves, faking their IP to bypass rate limits, IP allowlists or audit logs. Only accept it when set by your own proxy, and take the right-most untrusted entry."]],"r":[8,9,49,60],"num":"TLS handshake cost: ~1–2 ms CPU per new connection on a typical server core.\n10,000 new connections/s spread over 20 app servers = 500/s each doing TLS.\nTerminate at 2 proxies instead → certificates and TLS tuning in 2 places, not 20.","m":["Upstream response time vs total time: separates slow app servers from slow proxy/network.","5xx from proxy (502/504): 502 = upstream refused or crashed, 504 = upstream too slow for proxy timeout.","Active connections and connection errors: shows if the proxy itself is saturated."],"k":["Your app logs show every request coming from 10.0.0.5. What is most likely wrong?",["The app is under attack from one IP","The app reads the TCP peer address (the proxy) instead of X-Forwarded-For from the trusted proxy","DNS is misconfigured","TLS is terminated incorrectly"],1,"Behind a reverse proxy, the TCP connection comes from the proxy. The real client IP travels in X-Forwarded-For, which you should trust only when the request comes from your proxy."],"sl":"reverse-proxies"},{"n":4,"c":"db","t":"Connection Pooling","s":"Keep a small set of database connections open and reuse them, instead of opening a new one for every request.","w":"Opening a database connection is slow: network handshake, TLS, login, memory setup on the DB side. A connection pool opens, say, 10 connections at startup. When a request needs the DB it borrows one, runs its queries, and returns it to the pool for the next request.","y":"Opening a connection per request adds tens of milliseconds of delay. Worse, databases have a hard connection limit (Postgres often ~100 by default) and each connection costs memory. If 50 app servers each open 20 connections, that is 1,000 connections and the database falls over.","h":["Use your driver’s pool (HikariCP, pg.Pool, SQLAlchemy pool) instead of manual connects.","Size it carefully: total = pool size × number of app instances must stay below the DB limit. Small pools (5–20) are usually faster than huge ones.","Set a wait timeout, so when the pool is empty a request fails fast instead of hanging forever.","Always release the connection, even on errors (try/finally or “using” blocks).","For serverless or many instances, put a pooler like PgBouncer or RDS Proxy in front of the DB.","Monitor: active connections, waiting requests, and time spent waiting for a connection."],"code":"const pool = new Pool({ max: 10, idleTimeoutMillis: 30000,\n                        connectionTimeoutMillis: 2000 });\nconst client = await pool.connect();\ntry { await client.query('SELECT 1'); }\nfinally { client.release(); }   // never forget this","e":"A Django app on 20 Kubernetes pods each with a pool of 10 = 200 connections. The team’s Postgres limit was 100, so during scale-ups it crashed. Adding PgBouncer let 200 app connections share 40 real DB connections.","p":["Forgetting to release connections (connection leak: pool slowly empties and the app freezes)","Making the pool huge thinking more = faster; it just overloads the database","Holding a connection during slow work like an external API call"],"v":["Load Balancing","A pool reuses connections to ONE dependency. Load balancing spreads requests across MANY servers. Different problems."],"f":["Request needs DB","Borrow connection from pool","Run query","Return connection to pool"],"q":[["Why is a bigger pool not always better?","The DB has limited CPU cores and disk; too many concurrent queries cause contention and context switching, making everything slower. Total connections also must stay below the DB’s max."],["What is a connection leak?","Code borrows a connection and never returns it (often on an error path). Over time the pool runs empty and every request waits or times out."],["What is PgBouncer for?","It is an external pooler that lets many clients share a small number of real Postgres connections, essential with many app instances or serverless functions."],["Calculate: 30 pods with a pool of 15 connect to a DB allowing 300 connections. Problem?","30 × 15 = 450 possible connections, above 300. During scale-ups or bursts the DB will refuse connections. Shrink pools, cap pod count, or add a pooler like PgBouncer."],["Why are serverless functions especially hard on databases?","Each concurrent function instance may open its own connection, and concurrency can jump to thousands instantly. Use a connection proxy (RDS Proxy, PgBouncer), reuse connections across warm invocations, and cap concurrency."]],"r":[5,21,15,88],"num":"20 app instances × pool of 10 = 200 possible DB connections.\nIf the DB is configured for max_connections = 100 → configuration must change.\nOption: PgBouncer with 40 server connections shared by all 200 client connections.\nRule of thumb starting point (verify by load testing): pool ≈ (CPU cores × 2) per DB, split across instances.","m":["Pool wait time: how long requests wait to borrow a connection. Rising wait = pool too small or connections held too long.","Active vs idle connections: active pinned at max means saturation.","Connection timeouts / leaks: borrowed connections never returned grow over time; a leak shows as active count that never drops."],"k":["Requests start timing out under load, the DB CPU is only 30%, and the pool shows 10/10 active with many waiters. Most likely cause?",["The database is too small","Connections are held too long or leaked, so the pool is exhausted","The network is down","Indexes are missing"],1,"The DB isn’t busy, but every pool slot is taken. Usually code holds connections during slow work (like HTTP calls) or forgets to release them on errors."],"sl":"connection-pooling"},{"n":5,"c":"db","t":"N+1 Queries","s":"A bug where you run 1 query to get a list, then 1 more query for every item in that list.","w":"You load 50 blog posts (1 query). Then, while displaying them, your code asks for each post’s author separately (50 queries). That is 51 queries when 2 would do. It often hides inside ORMs, because post.author looks like a simple property but secretly runs a query.","y":"With 5 test rows nobody notices. In production with 500 rows it becomes 501 round trips to the database, and each round trip costs a millisecond or more. Pages that should take 30 ms take 3 seconds, and the database CPU climbs.","h":["Detect it: turn on query logging or use tools (Django Debug Toolbar, Bullet gem for Rails, Hibernate statistics) and count queries per request.","Fix with a JOIN: fetch posts and authors in one query.","Or eager load: ORM features like select_related / prefetch_related (Django), includes (Rails), JOIN FETCH (JPA), include (Prisma).","Or batch: collect all author IDs and run one query with WHERE id IN (...).","In GraphQL, use DataLoader to batch lookups made in the same request.","Add a test that asserts the number of queries for key pages, so it never comes back."],"code":"# BAD: 1 + N queries\nposts = Post.objects.all()\nfor p in posts: print(p.author.name)\n\n# GOOD: 1 query with a JOIN\nposts = Post.objects.select_related('author')\n\n# GOOD: 2 queries (posts, then authors WHERE id IN ...)\nposts = Post.objects.prefetch_related('tags')","e":"An e-commerce order history page loaded each order’s items one by one. A customer with 300 orders caused 301 queries and a 6-second page. Switching to one batched query brought it to 80 ms.","p":["Fixing it by adding an index: the index makes each query faster but you still have 500 round trips","Eager loading everything “just in case”, which pulls huge amounts of unused data","Only testing with tiny data sets"],"v":["Missing Index","N+1 = too MANY queries. Missing index = each query is too SLOW because it scans the table. Fix N+1 by batching or joining; fix missing indexes by adding indexes."],"f":["1 query: get 50 posts","!50 queries: author of each","Fix: JOIN or WHERE id IN (...)","2 queries total"],"q":[["How would you spot an N+1 in production?","Look at query logs or APM traces for one request repeating the same query shape many times with different IDs."],["JOIN vs prefetch (separate IN query): when do you use which?","JOIN suits one-to-one/many-to-one (each post has one author). A separate IN query suits one-to-many/many-to-many (posts with many tags), avoiding row explosion from duplicated parent rows."],["What does DataLoader do?","It collects all IDs requested during one tick of a GraphQL request and fetches them in a single batched query, and caches per request."],["When can eager loading make things worse?","When you eager-load large relations you don’t display, pulling huge amounts of data, or when joining many one-to-many relations multiplies rows (row explosion). Load only what the page uses, and use separate IN queries for collections."],["How do you prevent N+1 from coming back after a fix?","Add tests that assert the query count for key endpoints, enable ORM strict/lazy-loading warnings in development, and watch queries-per-request in APM."]],"r":[21,20,4,150],"num":"Page lists 100 orders, then loads items per order.\nQueries = 1 + 100 = 101. At ~1 ms network round trip each ≈ 100 ms in round trips alone.\nBatched: 2 queries ≈ 2 ms of round trips → ~50× less waiting, plus less DB CPU.\nWith 1,000 orders: 1,001 queries vs still 2.","m":["Queries per request (per endpoint): the clearest N+1 signal; it should not grow with result size.","Repeated query fingerprints in one trace: same SQL shape repeated with different IDs.","Endpoint p95 latency vs page size: latency that rises linearly with rows suggests N+1."],"k":["An endpoint takes 40 ms with 10 rows and 4 s with 1,000 rows. Each individual query is fast (<1 ms). What is the likely problem?",["A missing index","An N+1 query pattern","Slow network","Too small connection pool"],1,"Fast individual queries but latency that grows with row count points to many round trips, one per row: the N+1 pattern. Batch with JOIN/IN or eager loading."],"sl":"n-plus-one-queries"},{"n":6,"c":"scale","t":"Caching Strategies","s":"Save the answer to an expensive question somewhere fast, so next time you skip the expensive work.","w":"A cache is fast storage (usually memory, like Redis or Memcached) that keeps copies of results. Reading from Redis takes under a millisecond; a complex DB query may take 200 ms. The “strategy” is about WHEN you read from and write to the cache versus the real database.","y":"Many apps read the same data again and again: product pages, user profiles, home feeds. Hitting the database every time wastes money and makes the database the bottleneck. A good cache can remove 90%+ of read load.","h":["Cache-aside (most common): app checks cache; on a miss, reads DB, then puts the result in cache with a TTL.","Read-through: the cache library itself loads from DB on a miss; the app only talks to the cache.","Write-through: every write goes to cache and DB together, so cache is always fresh but writes are slower.","Write-behind (write-back): write to cache now, flush to DB later. Very fast, but you can lose data if the cache dies.","Always set a TTL (time to live) so stale data eventually disappears.","Choose keys carefully: include everything that changes the answer, e.g. product:42:lang:hi.","Pick an eviction policy (usually LRU: throw out least recently used) and watch the hit ratio.","Protect against stampedes: when a hot key expires, let only one request rebuild it (lock or “single flight”)."],"code":"def get_product(id):\n    key = f\"product:{id}\"\n    data = redis.get(key)\n    if data: return json.loads(data)          # hit\n    data = db.query(\"SELECT ... WHERE id=%s\", id)  # miss\n    redis.setex(key, 300, json.dumps(data))   # TTL 5 min\n    return data","e":"Twitter/X keeps users' home timelines pre-built in Redis. Opening the app reads a list from memory instead of running a huge query across everyone you follow.","p":["Caching user-specific data under a shared key (user A sees user B’s data)","No TTL, so wrong data lives forever","Cache stampede: popular key expires and 10,000 requests hit the DB at once","Caching things that are rarely read again (low hit ratio, wasted memory)"],"v":["Database Indexing","An index makes the database’s own work faster. A cache skips the database entirely. Indexes are always up to date; caches can be stale."],"f":["Request for product 42","Check Redis","Hit: return in <1 ms","Miss: read DB, store in Redis"],"q":[["Explain cache-aside in one line.","The application checks the cache, and on a miss loads from the DB and writes the result into the cache."],["What is a cache stampede and how do you prevent it?","When a hot key expires, many requests miss together and all hit the DB. Prevent it with a lock so one request rebuilds, early refresh before expiry, or random TTL jitter."],["Write-through vs write-behind?","Write-through writes cache and DB synchronously (safe, slower writes). Write-behind writes cache first and DB later (fast, risk of data loss)."],["Redis goes down. What should a well-designed cache-aside app do?","Treat the cache as optional: catch errors, use short timeouts, read directly from the DB, and protect the DB with rate limits or a circuit breaker so the sudden extra load doesn’t overwhelm it."],["How would you cache personalized data safely?","Include the user (or tenant) ID in the cache key, never share keys across users, keep TTLs short, and invalidate on permission changes."]],"r":[7,153,134,85],"num":"Product page: 1,000 req/s, DB query 50 ms, cache hit ratio 95%.\nDB reads/s = 1,000 × (1 − 0.95) = 50 instead of 1,000 (20× less).\nAvg latency ≈ 0.95 × 1 ms + 0.05 × 51 ms ≈ 3.5 ms.\nMemory: 100k products × 5 KB ≈ 500 MB of Redis.","m":["Hit ratio: hits ÷ (hits + misses). A falling ratio means poor keys, short TTLs or too little memory.","Evictions per second: high evictions with low hit ratio = cache too small.","Cache latency and errors: a slow or down cache should degrade gracefully, not take the site down.","DB load during cache restarts: shows how dependent you are on the cache (cold-start risk)."],"k":["With cache-aside, what happens on a cache miss?",["The request fails until the cache is warmed","The app reads from the database, returns the data and stores it in the cache","The cache itself queries the database","The write is queued for later"],1,"In cache-aside the application owns the logic: check cache, on miss load from the DB, then populate the cache (with a TTL) for later requests."],"sl":"caching-strategies"},{"n":7,"c":"scale","t":"Cache Invalidation","s":"Making sure the cache throws away (or updates) old data when the real data changes.","w":"Once you copy data into a cache, you have two versions. When the database changes, the cache copy becomes wrong (“stale”). Invalidation is the job of removing or refreshing that stale copy. It is famous as one of the two hard things in computer science.","y":"If a price drops from ₹999 to ₹799 but the cache still says ₹999, customers see the wrong price. With permissions it is worse: a user you removed from a team might still have access because the cache remembers the old role.","h":["TTL expiry: simplest. Data is at most N seconds old. Good when slight staleness is fine.","Delete on write: when you update the DB, delete the cache key. The next read reloads fresh data. Delete is safer than “update cache” because two concurrent updates can write values in the wrong order.","Event-based: the service publishes “product 42 changed” and every cache listening deletes its copy.","Versioned keys: put a version in the key (product:42:v7). Bump the version on change; old keys just expire.","Order matters: update the DB first, then delete the cache. Otherwise a reader might re-cache the old value in between.","Always keep a TTL as a safety net in case an invalidation message gets lost."],"code":"def update_price(id, price):\n    db.execute(\"UPDATE products SET price=%s WHERE id=%s\", price, id)\n    redis.delete(f\"product:{id}\")   # next read reloads fresh","e":"Facebook’s famous memcache paper describes deleting keys after DB writes and using “leases” to stop a slow reader from putting old data back into the cache.","p":["Forgetting a cached page that ALSO contains the item (lists, search results, CDN copies)","Updating cache before the DB commits","Relying only on invalidation with no TTL backup","Invalidating so often that the cache is always empty"],"v":["TTL Expiration","TTL waits for time to pass; data can be stale until then. Invalidation reacts immediately to a change. Use both: invalidation for freshness, TTL for safety."],"f":["Price updated in DB","Delete cache key","Next read misses","Fresh value cached"],"q":[["Why delete the cache key instead of updating it on writes?","With concurrent writers, two cache updates can land in the wrong order and leave stale data forever. A delete just forces the next reader to load the latest DB value."],["Should you update the DB first or invalidate cache first?","DB first, then delete the key. If you delete first, a reader can reload the old DB value into the cache before your write commits."],["How do you invalidate data cached on a CDN?","Use purge APIs, short TTLs, or versioned URLs (app.v8.js) so new content uses new URLs."],["A price was updated but some users see the old price for hours. What could cause it?","A missed invalidation (event lost, or another cache layer like a CDN or local in-process cache wasn’t purged), a TTL that is too long, or a race where a slow reader re-cached the old value after the delete."],["What is a 'versioned key' invalidation strategy?","Include a version number in the key (product:42:v7). On change, bump the version stored in the DB; readers build the new key and old keys simply expire, so no delete is needed."]],"r":[6,85,33,113],"num":"TTL 300 s, product updated at a random time.\nWorst-case staleness = 300 s; average ≈ 150 s if you rely on TTL alone.\nDelete-on-write: staleness ≈ time between DB commit and cache delete (milliseconds), with TTL as safety net.","m":["Stale reads detected: compare sampled cache values against the DB; any mismatch rate shows broken invalidation.","Invalidation event lag: time from DB change to cache delete when using events.","Hit ratio after deploy of invalidation changes: over-aggressive invalidation shows as a hit-ratio collapse."],"k":["Why is 'update DB, then delete cache key' safer than 'update DB, then set cache to the new value' with concurrent writers?",["Delete is faster than set","Two concurrent 'set' calls can land in the wrong order and leave a stale value forever; a delete just forces a fresh reload","Deletes are atomic, sets are not","Setting values requires a lock"],1,"Concurrent writers can overwrite each other’s cache value out of order. Deleting avoids picking a winner: the next reader loads whatever the database has now."],"sl":"cache-invalidation"},{"n":8,"c":"scale","t":"Load Balancing","s":"Spreading incoming requests across several servers so no single one gets overwhelmed.","w":"A load balancer sits in front of a group of identical servers. Each request is sent to one of them based on an algorithm. It also runs health checks and stops sending traffic to servers that are down.","y":"One server has limited CPU and memory, and if it crashes your whole app is down. With 4 servers behind a balancer you get roughly 4× capacity and one can die without users noticing.","h":["Choose an algorithm. Round robin: take turns. Least connections: send to the least busy server, good when requests vary in length. Weighted: bigger servers get more. IP hash / consistent hashing: same client goes to same server.","Configure health checks (e.g. GET /health every 5 s) to remove broken servers automatically.","Make servers stateless: store sessions in Redis or a DB, not in server memory, so any server can handle any request.","Avoid sticky sessions unless needed; they cause uneven load and lost sessions when a server dies.","Know the layer: L4 balancers route by IP/port (very fast); L7 balancers understand HTTP and can route by path, headers or cookies.","Run the balancer itself redundantly (cloud LBs do this for you)."],"e":"An AWS Application Load Balancer sends traffic across EC2 instances in three availability zones. When one zone has an outage, health checks fail there and traffic moves to the other two.","p":["Storing login sessions in local memory, so users get logged out when they hit another server","Health check that only says “process is running” even when the app can’t reach its DB","Forgetting that the database behind all servers is still one bottleneck"],"v":["Autoscaling","Load balancing spreads requests over the servers you HAVE. Autoscaling changes HOW MANY servers you have. They are usually used together."],"f":["Many users","Load balancer","Server A / B / C","!Unhealthy server skipped"],"q":[["L4 vs L7 load balancer?","L4 works at TCP/UDP level using IPs and ports, very fast but blind to HTTP. L7 understands HTTP, so it can route by URL path, host or header and terminate TLS."],["Why should app servers be stateless behind a load balancer?","Any request can land on any server. If state like sessions lives in one server’s memory, other servers can’t see it and the user experience breaks."],["When is least-connections better than round robin?","When requests take very different amounts of time; round robin may pile long requests onto one server while least-connections favours idle ones."],["You added 3 more app servers but latency didn’t improve. Why might that be?","The bottleneck is elsewhere, usually the shared database, a cache, or an external API. Adding app servers can even make it worse by opening more DB connections."],["When are sticky sessions acceptable?","For stateful connections like WebSockets or when migrating a legacy app, with care: they cause uneven load and lost state on server failure, so prefer external session storage."]],"r":[81,64,74,82],"num":"Peak 6,000 req/s, one server handles ~1,000 req/s at 60% CPU.\nNeeded = 6,000 ÷ 1,000 = 6 servers; add N+1 for failure → 7.\nIf one AZ (of 3) fails, the other two must carry 6,000 → plan 4 per AZ.","m":["Per-backend request count and latency: uneven numbers mean a bad algorithm or sticky sessions.","Healthy host count: drops show failing health checks or capacity loss.","5xx from the balancer vs from backends: distinguishes balancer issues from app issues."],"k":["Requests vary from 5 ms to 5 s. Which algorithm usually spreads load best?",["Round robin","Least connections / least outstanding requests","Random with a fixed seed","IP hash"],1,"Round robin ignores how busy each server is, so long requests can pile up on one. Least connections sends new work to the least busy server."],"sl":"load-balancing"},{"n":9,"c":"net","t":"API Gateways","s":"One front door for all your APIs that handles common jobs like auth, rate limits and routing before passing requests to services.","w":"When you have many backend services (users, orders, payments), clients shouldn’t need to know all their addresses. The API gateway exposes one URL like api.shop.com and routes /users to the user service, /orders to the order service, and applies shared rules on the way.","y":"Without a gateway, every service re-implements token checking, rate limits, CORS, logging and API keys, often slightly differently, causing security holes and repeated work.","h":["Route requests by path, method or version to the right service.","Validate auth tokens once at the gateway, then forward the user identity to services in a trusted header.","Apply rate limits and quotas per API key or plan (free vs paid).","Add request IDs, logging and metrics in one place.","Optionally transform or aggregate: one mobile call fans out to 3 services and returns combined data (the BFF, backend-for-frontend pattern).","Keep business logic OUT of the gateway; it should stay thin and fast.","Run it redundantly because every request passes through it."],"e":"Netflix’s Zuul gateway sits in front of hundreds of microservices, handling authentication, routing and canary traffic splits for all device apps.","p":["Putting business rules in the gateway, turning it into a monolith nobody can change","Services trusting identity headers even when called directly, bypassing the gateway","One gateway team becomes a bottleneck for every API change"],"v":["Reverse Proxy","A reverse proxy forwards traffic. An API gateway is a reverse proxy specialised for APIs, adding auth, keys, quotas, versioning and developer-facing features."],"f":["Mobile / web client","API gateway: auth + limits","Route to service","Users / Orders / Payments"],"q":[["What responsibilities belong in an API gateway?","Routing, authentication, rate limiting/quotas, TLS, request logging/IDs, CORS, and sometimes response aggregation."],["What is a BFF?","Backend-for-frontend: a gateway layer tailored to one client type (mobile, web), shaping and combining data for that client."],["What is the main risk of a gateway?","It is a single point of failure and potential bottleneck; and if business logic leaks into it, it becomes hard to change."],["Your gateway becomes the bottleneck. How do you scale it?","Run it stateless and horizontally scaled behind a load balancer, keep rate-limit state in a shared store, remove heavy transformations, and cache auth key lookups."],["Services trust the X-User-ID header the gateway adds. What risk exists?","If services are reachable without going through the gateway, attackers can forge the header. Enforce network policies or mTLS so only the gateway can reach services, or pass a signed token instead."]],"r":[3,2,46,77],"num":"Without gateway: 25 services × own auth + rate-limit code = 25 implementations to patch for one auth bug.\nGateway latency budget: typically adds a few ms per request; at p99 keep it well under your API SLO.","m":["Gateway added latency (p50/p99): the gateway is in every request path, so it must stay fast.","Auth failures (401/403) by client: spikes show token problems or attacks.","Per-route error rate and upstream timeouts: helps tell which backend is failing."],"k":["Which responsibility does NOT belong in an API gateway?",["Validating access tokens","Per-API-key rate limits","Calculating order discounts and tax","Routing /orders to the order service"],2,"Business logic like pricing belongs in services. Gateways should stay thin: routing, auth, quotas, logging."],"sl":"api-gateways"},{"n":10,"c":"rel","t":"Timeouts","s":"A maximum time you are willing to wait for something before you give up and handle the failure.","w":"Every network call can hang: the other server is slow, overloaded, or the packet just vanished. A timeout says “if no answer in 2 seconds, stop waiting and treat it as failed”. There are several kinds: connect timeout (time to establish a connection), read timeout (time waiting for data), and an overall deadline for the whole operation.","y":"Many HTTP libraries have NO timeout by default, or a very long one. If a dependency hangs, your requests wait forever, each holding a thread and a connection. Soon all threads are stuck and your service stops answering too, even for things unrelated to the slow dependency. One slow service takes down everything: a cascading failure.","h":["Set an explicit timeout on every outbound call: HTTP, DB, Redis, queues.","Base the number on real latency: e.g. if p99 is 300 ms, a timeout around 1 s is reasonable.","Use short connect timeouts (around 1 s) and separate read timeouts.","Use a deadline for the whole user request (e.g. 3 s) and pass the REMAINING time to downstream calls, so inner calls never outlive the outer request.","Cancel work after a timeout where possible, so you don’t keep spending resources on an answer nobody wants.","Make sure outer layers have longer timeouts than inner ones (load balancer > app > DB)."],"code":"# Python requests: (connect, read) seconds\nrequests.get(url, timeout=(1, 2))\n\n// Go: deadline flows to every call made with ctx\nctx, cancel := context.WithTimeout(ctx, 2*time.Second)\ndefer cancel()","e":"A payment page called a fraud-check API without a timeout. One day that API hung; every checkout thread waited, the app ran out of threads, and the whole site went down for 40 minutes, even pages that never used fraud checks.","p":["Relying on library defaults (often infinite)","Timeouts so long they never help (60 s for a call that normally takes 50 ms)","Inner timeouts longer than outer timeouts, so the caller gives up but the work continues"],"v":["Retries","A timeout decides WHEN to give up on an attempt. A retry decides WHETHER to try again. Retrying without timeouts or a total deadline can multiply load."],"f":["Call fraud API","!No reply…","2 s timeout fires","Return fallback / error fast"],"q":[["Why are missing timeouts dangerous?","Hanging calls hold threads and connections; when a dependency stalls, these resources run out and the calling service also stops responding (cascading failure)."],["What is deadline propagation?","Passing the remaining time budget of the user request to each downstream call so no inner call waits longer than the overall request allows."],["Connect timeout vs read timeout?","Connect timeout limits establishing the TCP/TLS connection; read timeout limits waiting for response data after connecting."],["How do you pick a timeout value?","Measure the dependency’s normal latency (p99), add headroom, and make sure it fits within the caller’s own deadline. Different operations get different timeouts."],["What is cancellation and why does it matter with timeouts?","Stopping downstream work once the result is no longer needed (e.g. via context cancellation). Without it, timed-out requests keep using CPU, DB and connections."]],"r":[11,13,112,92],"num":"Service gets 200 req/s; dependency hangs; no timeout.\nThreads needed after 30 s of hanging = 200 × 30 = 6,000 stuck requests → thread pool (say 200) exhausted in 1 s.\nWith 1 s timeout: at most ~200 in-flight, failures return fast.\nDeadline budget: 3 s total = 0.5 s auth + 1 s DB + 1 s payment + 0.5 s margin.","m":["Timeout count per dependency: tells you which dependency is slow.","Dependency latency p99 vs configured timeout: timeouts should sit above normal p99 with some margin.","In-flight requests / thread pool usage: climbing toward the limit warns of a cascading failure."],"k":["Your app server has a 30 s timeout calling service B, but your load balancer times out after 10 s. What’s the problem?",["Nothing, shorter outer timeouts are best","Users get errors after 10 s while your server keeps waiting and wasting resources for 20 more seconds","The load balancer will retry forever","Service B will be overloaded by retries"],1,"Inner timeouts should be shorter than outer ones. Otherwise the caller has already given up while the work continues, wasting threads and connections."],"sl":"timeouts"},{"n":11,"c":"rel","t":"Retries","s":"Automatically trying a failed operation again, because many failures are temporary.","w":"Some errors fix themselves in a moment: a network blip, a server restarting, a brief overload (HTTP 503), a timeout. Retrying after a short pause often succeeds. But some errors will never fix themselves (400 Bad Request, 401 Unauthorized, 404 Not Found), and retrying those is pointless.","y":"Without retries, users see errors for problems that would have disappeared in 100 ms. With BAD retries (instant, unlimited, on everything), you can turn a small hiccup into a flood that keeps the struggling service down.","h":["Retry only transient errors: timeouts, connection resets, 502/503/504, 429 (after waiting).","Never blindly retry 4xx errors like 400/401/403/404/422.","Only retry operations that are safe to repeat (idempotent), or use idempotency keys.","Cap attempts (e.g. 3) and set an overall deadline.","Wait between attempts using exponential backoff with jitter.","Retry at ONE layer only. If the browser, gateway, service A and service B each retry 3 times, one failure can become 81 calls.","Use a retry budget, e.g. retries may be at most 10% of total traffic."],"code":"for attempt in range(3):\n    try:\n        return call_api(timeout=2)\n    except (Timeout, ConnectionError, Http503):\n        if attempt == 2: raise\n        sleep(random.uniform(0, 0.2 * 2**attempt))  # backoff + jitter","e":"AWS SDKs retry throttling and 5xx errors automatically up to a few times with backoff, which is why most S3 hiccups never reach your app as errors.","p":["Retrying a non-idempotent payment POST without a key, causing double charges","Retries at every layer multiplying load","Retrying immediately in a tight loop","Retrying forever"],"v":["Exponential Backoff","Retry = do it again. Backoff = how long to wait before doing it again. Retries should almost always use backoff."],"f":["Call fails: 503","Is it transient? yes","Wait (backoff)","Try again, max 3"],"q":[["Which errors should you retry?","Transient ones: timeouts, connection errors, 502/503/504 and 429 after the indicated wait. Not 400/401/403/404/422."],["What is retry amplification?","When several layers each retry, attempts multiply (3×3×3…), overwhelming an already struggling service."],["Why must retried operations be idempotent?","The first attempt might have succeeded even though you saw an error; repeating a non-idempotent action could duplicate it."],["During an outage, traffic to a struggling service tripled. How could retries cause this?","Clients and intermediate services retried every failure, multiplying load (retry storm). Fix with capped attempts, exponential backoff with jitter, retry budgets, and retrying at only one layer."],["How do you retry a non-idempotent operation safely?","Make it idempotent using an idempotency key or a unique business constraint, so a repeated attempt is recognised and not executed twice."]],"r":[12,1,13,10],"num":"Retry amplification: 4 layers, each retries 3 attempts.\nWorst case calls to the bottom service = 3⁴ = 81 per user request.\nRetry budget: allow retries ≤ 10% of requests → at 1,000 req/s, max 100 retries/s.","m":["Retry rate (retries ÷ requests): a rise often precedes an outage; it should stay small.","Success-after-retry rate: shows retries are actually helping, not just adding load.","Errors by status code: retries of 4xx indicate misconfigured retry rules."],"k":["Which response should a client normally NOT retry?",["503 Service Unavailable","Connection timeout","422 Unprocessable Entity","429 Too Many Requests (after waiting)"],2,"4xx errors like 422 mean the request itself is wrong; retrying sends the same bad request again. Retry only transient failures."],"sl":"retries"},{"n":12,"c":"rel","t":"Exponential Backoff","s":"Wait longer after each failure (1 s, 2 s, 4 s, 8 s…) plus a bit of randomness, before retrying.","w":"Backoff means “back off”: give the struggling server breathing room. Exponential means the wait doubles each time. Jitter means adding randomness so that thousands of clients don’t all retry at the exact same moment.","y":"Imagine a server goes down for 10 seconds and 10,000 phones retry every 100 ms. When it comes back, it gets hit by a giant synchronized wave and falls over again. This is called the thundering herd. Backoff with jitter spreads retries out over time.","h":["Start with a base delay (e.g. 100 ms) and double it each attempt.","Cap the delay (e.g. max 30 s) so it doesn’t grow to hours.","Add jitter. “Full jitter” picks a random wait between 0 and the current backoff value, which works very well.","Respect the server’s Retry-After header if it sends one.","Limit total attempts or total time.","Combine with a circuit breaker so that during long outages you stop trying altogether."],"code":"def backoff(attempt, base=0.1, cap=30):\n    exp = min(cap, base * 2 ** attempt)\n    return random.uniform(0, exp)   # full jitter\n# attempt 0: 0–0.1s, 1: 0–0.2s, 2: 0–0.4s ... capped at 30s","e":"AWS published an analysis showing that “full jitter” backoff finished contended work faster and with far fewer total calls than plain exponential backoff, because clients stopped colliding.","p":["No jitter: all clients still retry in synchronized waves","No cap: delays grow to absurd lengths","Backoff without an attempt limit"],"v":["Circuit Breaker","Backoff slows retries down. A circuit breaker stops calls completely for a while once it is clear the dependency is broken."],"f":["Fail → wait ~0.1 s","Fail → wait ~0.2 s","Fail → wait ~0.4 s","Success, server recovered"],"q":[["Why add jitter to backoff?","Without randomness, clients that failed together retry together, creating repeated traffic spikes. Jitter spreads them out."],["What is the thundering herd problem?","Many clients waking up or retrying at the same instant and overwhelming a resource just as it recovers."],["What should a client do with a Retry-After header?","Wait at least that long before retrying; it is the server telling you when it can accept more work."],["Why cap the maximum backoff delay?","Pure doubling grows quickly (10 attempts ≈ 100 s+), leaving users waiting far too long. A cap keeps delays bounded while still easing load."],["How should backoff interact with a server’s Retry-After header?","The client should wait at least the Retry-After duration, which the server knows best, and only use its own backoff when no header is given."]],"r":[11,13,2,40],"num":"Base 100 ms, doubling, cap 30 s:\nattempt 1: 0–100 ms, 2: 0–200 ms, 3: 0–400 ms, 4: 0–800 ms, 5: 0–1.6 s.\n10,000 clients retrying at once without jitter → 10,000 requests in the same instant.\nWith full jitter over 0–1.6 s → ~6,250 req/s spread out instead of one spike.","m":["Retry timing distribution: clustered retries indicate missing jitter.","Recovery time after an outage: thundering-herd spikes delay recovery.","429/503 rate during recovery: should fall steadily if backoff works."],"k":["What problem does jitter solve?",["Retries that are too slow","Many clients retrying at exactly the same moments and creating synchronized load spikes","Lost messages","Clock skew between servers"],1,"Clients that failed together would retry together. Random jitter spreads their retries over time, preventing a thundering herd."],"sl":"exponential-backoff"},{"n":13,"c":"rel","t":"Circuit Breakers","s":"After too many failures, stop calling a broken service for a while and fail fast, then test carefully if it recovered.","w":"Named after the electrical switch that cuts power to stop a fire. It has three states. CLOSED: calls flow normally while failures are counted. OPEN: too many failures happened, so calls are rejected instantly without even trying. HALF-OPEN: after a cool-down, a few test calls are allowed; if they succeed the breaker closes, if they fail it opens again.","y":"If the recommendation service is dead, calling it 1,000 times a second just wastes threads waiting for timeouts, slows your own pages and keeps hammering the dead service so it can’t recover.","h":["Wrap each remote dependency in its own breaker (libraries: Resilience4j, Polly, opossum, or service meshes like Istio).","Set a trip rule: e.g. open if 50% of the last 20 calls failed or timed out.","Set an open duration, e.g. 30 s, before going half-open.","In half-open, allow only a few trial requests.","Always provide a fallback: cached data, a default value, a “feature unavailable” message, or skip the feature.","Emit metrics and alerts on state changes so humans know a dependency is down."],"code":"breaker = CircuitBreaker(fail_rate=0.5, window=20, open_for=30)\ndef recommendations(user):\n    try:\n        return breaker.call(reco_api.get, user)\n    except BreakerOpen:\n        return popular_items()    # fallback","e":"Netflix’s Hystrix library made this famous. If the “personalised rows” service broke, the home screen fell back to generic popular titles instead of crashing.","p":["One breaker for all dependencies, so one bad service blocks the others","No fallback, so open just means a different error","Thresholds so sensitive that normal noise trips the breaker"],"v":["Retries","Retries try harder after a failure. Circuit breakers give up quickly when failures continue. Retries handle blips; breakers handle outages."],"f":["Closed: calls pass","!Failures pile up → Open","Fail fast + fallback","Half-open test → Closed"],"q":[["Describe the three states of a circuit breaker.","Closed (normal, counting failures), Open (rejecting calls immediately), Half-open (allowing limited test calls to see if the dependency recovered)."],["Why does a circuit breaker help the failing service too?","It stops the flood of requests, giving the failing service room to recover instead of being hammered."],["What makes a good fallback?","Something useful and cheap: cached/stale data, defaults, degraded features, or a clear message, never another call to the same broken thing."],["How do you choose breaker thresholds?","Base them on normal error rates and traffic: require a minimum number of calls (e.g. 20) before tripping, use a failure-rate threshold well above normal noise, and test with fault injection."],["Why have one breaker per dependency instead of one global breaker?","So one failing dependency doesn’t block calls to healthy ones. Breakers isolate failures per dependency (and sometimes per endpoint)."]],"r":[11,112,10,99],"num":"Dependency fails 100%; 500 req/s; timeout 2 s.\nWithout breaker: 500 × 2 s = 1,000 requests stuck waiting at any time.\nWith breaker open: failures return in ~1 ms, 0 stuck; half-open sends a few test calls every 30 s.","m":["Breaker state changes (closed/open/half-open): each open event should alert and point to a failing dependency.","Fallback rate: how often users get degraded responses.","Dependency error rate and latency: the inputs that trip the breaker."],"k":["In the half-open state, a circuit breaker…",["Rejects all calls","Allows a limited number of trial calls to test if the dependency recovered","Sends all traffic as normal","Permanently disables the dependency"],1,"Half-open lets a few requests through. Success closes the breaker; failure reopens it for another cool-down period."],"sl":"circuit-breakers"},{"n":14,"c":"dist","t":"Race Conditions","s":"A bug where the result depends on which of two simultaneous operations happens first.","w":"Two requests read the same value, both make a decision based on it, and both write. Classic “check-then-act”: request A checks “is the seat free?” → yes. Request B checks → yes. A books it. B books it. The seat is now sold twice. Each request was correct alone; together they are wrong.","y":"R
