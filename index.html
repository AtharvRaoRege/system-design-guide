ace conditions cause overselling, double spending, negative stock, lost updates (one person’s edit overwrites another’s) and counters that are wrong. They rarely appear in testing because they need precise timing, then show up under real traffic.","h":["Make the database do the check and the write in ONE atomic statement: UPDATE seats SET booked_by=? WHERE id=? AND booked_by IS NULL. Then check rows affected = 1.","Use unique constraints (one booking per seat) so the DB rejects the second write.","Use atomic operations: UPDATE stock SET qty = qty - 1 WHERE qty > 0, or Redis INCR.","Use transactions with the right isolation level, or row locks (SELECT ... FOR UPDATE).","Use optimistic locking with a version column when conflicts are rare.","Test it: fire 100 parallel requests at the same item in a test and assert the invariant holds."],"code":"-- atomic: check and update in one statement\nUPDATE seats\nSET booked_by = 77\nWHERE id = 12 AND booked_by IS NULL;\n-- rows affected = 1 → you got it\n-- rows affected = 0 → someone else did","e":"During a concert ticket sale, a site that read “available” in code and then wrote “sold” separately sold the same front-row seats to several people. The fix was one conditional UPDATE.","p":["Read value in app code, change it, write it back (lost update)","Assuming “it’s fast so it won’t overlap”","Fixing it with an in-memory lock that doesn’t work across multiple servers"],"v":["Deadlock","A race condition finishes but with WRONG data. A deadlock doesn’t finish at all: operations wait on each other forever."],"f":["A reads: seat free","B reads: seat free","!Both write: sold twice","Fix: atomic conditional UPDATE"],"q":[["What is a check-then-act race?","Checking a condition and acting on it in separate steps, so another operation can change the condition in between."],["How does a unique constraint prevent races?","The database guarantees only one row with that value can exist, so the second concurrent insert fails no matter the timing."],["Why doesn’t a mutex in application code fix races in a web app?","Apps run on multiple processes/servers; an in-memory lock only coordinates threads in one process."],["Why are race conditions hard to find in testing?","They depend on precise timing that rarely occurs with one tester and small data; they appear under real concurrency. Use concurrency tests that fire many parallel requests."],["What is a lost update?","Two transactions read the same value, each modifies it, and the second write overwrites the first, so one change disappears."]],"r":[80,25,26,125],"num":"Flash sale: 1 item left, 500 buyers click within 50 ms.\nCheck-then-act in app code: many requests read qty=1 before any write → possibly dozens of orders for 1 item.\nAtomic UPDATE ... WHERE qty > 0: exactly 1 succeeds, 499 get 0 rows affected.","m":["Invariant checks: negative stock, duplicate bookings, balance mismatches found by periodic audits.","Unique constraint violations: show how often races happen (and are safely rejected).","Rows-affected = 0 rate on conditional updates: contention level on hot items."],"k":["Which approach reliably prevents overselling the last seat?",["Check availability in code, then insert the booking","Use a conditional UPDATE ... WHERE booked_by IS NULL and check rows affected","Add a short sleep before writing","Cache the seat status in Redis"],1,"Doing the check and the write in one atomic database statement leaves no gap for another request to slip in."],"sl":"race-conditions"},{"n":15,"c":"db","t":"Deadlocks","s":"Two transactions each hold something the other needs, so both wait forever, until the database kills one.","w":"Transaction A locks row 1 and wants row 2. Transaction B locks row 2 and wants row 1. Neither can continue. Databases detect this cycle and abort one transaction with a “deadlock detected” error so the other can finish.","y":"Under real traffic, deadlocks show up as random failed requests and slow transactions. If the app doesn’t handle the error, users see failures for actions that were perfectly valid.","h":["Always lock rows in the same order everywhere, e.g. sort IDs ascending before updating. Most deadlocks disappear with this alone.","Keep transactions short: no network calls, no waiting for users inside a transaction.","Add indexes so updates lock only the rows they need, not big ranges.","Catch the deadlock error and retry the whole transaction a few times with a small backoff.","Set lock timeouts (lock_timeout in Postgres) so stuck waits end.","Read the DB’s deadlock log to find which queries collided."],"code":"# transfer money: lock both accounts in a fixed order\na, b = sorted([from_id, to_id])\ndb.execute(\"SELECT * FROM accounts WHERE id IN (%s,%s) ORDER BY id FOR UPDATE\", a, b)","e":"A bank transfer feature deadlocked when Alice paid Bob at the same moment Bob paid Alice: each transaction locked the sender first. Locking accounts in ID order fixed it.","p":["Long transactions that do HTTP calls while holding locks","Different code paths updating the same tables in different orders","Not retrying the transaction that the DB aborted"],"v":["Race Condition","A race condition gives wrong results silently. A deadlock is a visible stall that the DB breaks by failing one transaction."],"f":["A locks row 1","B locks row 2","!A waits on 2, B waits on 1","DB aborts one → retry"],"q":[["What is the most effective way to prevent deadlocks?","Acquire locks in a consistent global order and keep transactions short."],["What does a database do when it detects a deadlock?","It picks a victim transaction, rolls it back and returns an error, letting the others proceed."],["How should an application handle a deadlock error?","Retry the entire transaction (not just the failed statement) a few times with backoff."],["How do you investigate deadlocks in production?","Read the database’s deadlock report (e.g. Postgres logs, MySQL SHOW ENGINE INNODB STATUS) to see which statements and rows were involved, then fix ordering, add indexes, or shorten the transactions."],["Why can a missing index cause deadlocks?","Without an index, updates may scan and lock many more rows (or ranges) than needed, increasing the chance two transactions lock overlapping rows in different orders."]],"r":[26,133,125,14],"num":"Deadlock retry cost: if 0.1% of 2,000 tx/s deadlock → 2 retries/s (acceptable).\nIf 5% deadlock → 100 retries/s plus wasted work: fix lock ordering or indexes.","m":["Deadlocks per minute (DB stats/logs): should be near zero; a jump after a deploy points at new code paths.","Lock wait time: long waits precede deadlocks and timeouts.","Transaction duration p99: long transactions hold locks longer and deadlock more."],"k":["Two transactions transfer money A→B and B→A at the same time and deadlock. Best fix?",["Increase the lock timeout","Always lock the two accounts in a consistent order (e.g. lower ID first)","Disable transactions","Retry immediately in a loop forever"],1,"Deadlocks need a cycle of waits. Locking resources in the same global order makes a cycle impossible."],"sl":"deadlocks"},{"n":16,"c":"scale","t":"Memory Leaks","s":"Your program keeps holding on to memory it no longer needs, so memory use grows until the process slows down or crashes.","w":"In languages with garbage collection (Java, JS, Python, Go), memory is freed only when nothing references it anymore. A leak happens when something still points to old objects by accident: a global list that only grows, an event listener never removed, a cache with no size limit, a timer that keeps a closure alive.","y":"The server works fine after a deploy, but memory climbs slowly over hours or days. Then it hits the container limit and gets OOM-killed (Out Of Memory), or garbage collection runs constantly and everything gets slow.","h":["Watch the graph: memory that climbs and never comes down after GC (a “sawtooth” trending upward) suggests a leak.","Take heap snapshots at two different times and compare which object types grew (Chrome DevTools for Node, jmap/Eclipse MAT for Java, tracemalloc for Python).","Look for unbounded collections: maps used as caches without limits; use an LRU with max size.","Remove event listeners, clear intervals/timers and close connections when done.","Avoid storing per-request data in global/module-level variables.","Set memory limits and alerts so leaks are caught early, not by crashes."],"code":"// LEAK: grows forever\nconst seen = {};\napp.get('/', (req) => { seen[req.id] = req; });\n\n// FIX: bounded cache\nconst cache = new LRU({ max: 1000 });","e":"A Node.js API stored every WebSocket client in a global array but never removed them on disconnect. Memory grew ~200 MB per day and pods restarted every night until the cleanup handler was added.","p":["“Fixing” by restarting servers on a schedule and never finding the cause","Confusing a big intentional cache with a leak","Adding listeners inside a function that runs on every request"],"v":["High Memory Usage","High memory can be normal and stable (a big cache). A leak keeps GROWING without a limit. Look at the trend, not one number."],"f":["Request stores object globally","Object never removed","!Memory climbs for days","OOM kill → restart"],"q":[["How can a garbage-collected language still leak memory?","The GC only frees unreachable objects. If your code still references unneeded objects (globals, listeners, caches), they stay reachable and can’t be freed."],["How do you find a leak?","Compare heap snapshots over time to see which objects grow, then trace who holds references to them."],["Name three common leak sources.","Unbounded caches/maps, forgotten event listeners or timers, and closures capturing large objects."],["How would you find the cause of a leak in a Node.js service?","Take heap snapshots at two times under load, compare them in Chrome DevTools to find object types that grew, and inspect retainers to see what still references them (global maps, listeners, closures)."],["Why is restarting servers nightly a bad fix?","It hides the bug, risks outages if the leak speeds up, and wastes resources; it also makes memory metrics useless for spotting new problems."]],"r":[79,103,62,87],"num":"Leak of 50 KB per request, 20 req/s:\n50 KB × 20 × 3,600 ≈ 3.6 GB per hour → a 2 GB container is OOM-killed in ~35 minutes.\nLeak of 200 MB/day → restarts every ~5 days with a 1 GB limit (easy to miss).","m":["Memory after GC over days: a steadily rising floor is the classic leak signal.","OOM kills / container restarts: often the first visible symptom.","GC time %: rising GC effort as heap fills."],"k":["Memory grows from 300 MB to 1.5 GB over two days and never drops, even after garbage collection. Most likely?",["A large intentional cache","A memory leak: objects still referenced so the GC can’t free them","Normal JIT warm-up","Disk swapping"],1,"Memory that keeps rising after GC means reachable but unneeded objects are piling up, which is a leak."],"sl":"memory-leaks"},{"n":17,"c":"net","t":"Webhooks","s":"Instead of you asking “did anything happen?” over and over, the other system calls YOUR URL when something happens.","w":"You give a provider (Stripe, GitHub, Razorpay) a URL on your server. When an event happens, like “payment succeeded”, they send an HTTP POST to that URL with the event details as JSON. It’s a reverse API: they call you.","y":"The alternative is polling: asking “any new payments?” every few seconds. That wastes requests and you still learn late. Webhooks are instant and efficient, but they come with their own problems: fake senders, duplicates, retries and out-of-order events.","h":["Verify the signature: providers sign the payload with a shared secret (HMAC). Reject anything that doesn’t verify, or anyone can fake “payment succeeded”.","Respond fast (2xx within a few seconds). Save the event and process it in the background via a queue.","Deduplicate using the event ID; providers retry, so you WILL get duplicates.","Don’t trust order: “payment.refunded” may arrive before “payment.succeeded”. Check timestamps or fetch the latest state from the provider’s API.","Handle provider retries: if you return 500, they’ll retry with backoff for hours or days.","Log every received event so you can replay or debug."],"code":"sig = request.headers[\"Stripe-Signature\"]\nevent = stripe.Webhook.construct_event(body, sig, SECRET)  # verifies\nif db.exists(\"events\", event.id): return 200   # duplicate\ndb.insert(\"events\", event.id)\nqueue.push(event)                              # process later\nreturn 200","e":"GitHub calls your CI server’s webhook on every push; that’s how a build starts within seconds of a commit, without CI polling every repository.","p":["Not verifying signatures","Doing slow work before replying, causing timeouts and duplicate deliveries","Assuming each event arrives exactly once and in order"],"v":["Polling","Polling = you keep asking. Webhook = they tell you. Webhooks are faster and cheaper but need a public endpoint plus duplicate and security handling."],"f":["Payment succeeds at provider","Provider POSTs to your URL","Verify signature + dedupe","Queue job, reply 200"],"q":[["Why must you verify webhook signatures?","The URL is public; without verification anyone could send fake events like “order paid”."],["Why reply quickly and process asynchronously?","Providers time out slow responses and retry, creating duplicates; heavy work belongs in a background job."],["How do you handle duplicate webhook deliveries?","Store processed event IDs (with a unique constraint) and skip any ID you have already handled."],["Events arrive out of order: refund before payment success. How do you handle it?","Don’t rely on delivery order. Store events, use timestamps/versions to ignore stale state changes, or fetch the latest state from the provider’s API before acting."],["How do you replay missed webhooks after an outage?","Use the provider’s event list API or dashboard to resend, and make processing idempotent by event ID so replays are safe."]],"r":[120,113,1,56],"num":"Polling every 10 s for 50,000 merchants = 5,000 req/s, mostly empty answers.\nWebhooks: ~ number of real events (say 20/s) + retries.\nProvider retries over ~3 days: your endpoint must handle duplicates for that whole window.","m":["Webhook processing failures and provider retry counts: rising retries mean your endpoint is erroring or slow.","Time from event to processed: queue lag after receiving.","Signature verification failures: possible attacks or a rotated secret."],"k":["Why should a webhook endpoint respond 2xx quickly and process the event in the background?",["To save bandwidth","Because slow responses cause provider timeouts and retries, creating duplicates","Because HTTP requires it","To avoid verifying the signature"],1,"Providers time out slow endpoints and retry, so slow processing leads to duplicate deliveries. Store the event, return 2xx, and process asynchronously."],"sl":"webhooks"},{"n":18,"c":"sec","t":"CORS","s":"A browser rule that decides whether JavaScript on one website is allowed to read responses from another website.","w":"An “origin” is scheme + domain + port, e.g. https://app.com. By default, browsers block JS on app.com from reading responses from api.other.com (the Same-Origin Policy). CORS (Cross-Origin Resource Sharing) lets the API server say “I allow app.com” using headers like Access-Control-Allow-Origin. For non-simple requests (custom headers, PUT, JSON), the browser first sends an OPTIONS “preflight” to ask permission.","y":"Without the same-origin rule, any website you visit could use your logged-in cookies to read your bank or email data. CORS errors also confuse developers, who then “fix” them by allowing everything, which can open real security holes.","h":["Allow specific origins only: Access-Control-Allow-Origin: https://app.com, not * for anything private.","Never combine * with Access-Control-Allow-Credentials: true (browsers forbid it anyway).","Don’t blindly reflect whatever Origin header the request sends back as allowed.","List only needed methods and headers in preflight responses, and cache preflights with Access-Control-Max-Age.","Remember CORS is enforced by BROWSERS only. curl, Postman and servers ignore it. It is not authentication.","In development, a dev-server proxy often avoids CORS completely."],"code":"Access-Control-Allow-Origin: https://app.example.com\nAccess-Control-Allow-Methods: GET, POST, PUT\nAccess-Control-Allow-Headers: Content-Type, Authorization\nAccess-Control-Allow-Credentials: true\nAccess-Control-Max-Age: 600","e":"A React app at app.example.com calls api.example.com. They are different origins, so the API must return Access-Control-Allow-Origin: https://app.example.com or the browser will hide the response from JavaScript.","p":["Thinking CORS protects your API from hackers (it doesn’t stop non-browser clients)","Reflecting any Origin with credentials allowed","Forgetting to handle OPTIONS preflight requests"],"v":["Authentication","CORS controls which WEBSITES' scripts can read responses in a browser. Authentication controls which USERS can access data. You need both."],"f":["JS on app.com calls api.com","Browser sends OPTIONS preflight","API: Allow-Origin app.com","Browser lets JS read response"],"q":[["What is an origin?","The combination of scheme, host and port. https://a.com and https://a.com:8443 are different origins."],["When does a browser send a preflight request?","For non-simple requests: methods other than GET/HEAD/POST, custom headers like Authorization, or content types like application/json."],["Does CORS protect your API from attackers using curl?","No. CORS is enforced only by browsers; servers must still use proper authentication and authorization."],["Why is Access-Control-Allow-Origin: * with credentials not allowed?","Browsers forbid combining a wildcard origin with credentials because it would let any site read responses using the user’s cookies."],["How do you allow several specific origins?","Keep an allowlist on the server, compare the request’s Origin header against it, echo back that exact origin when it matches, and add Vary: Origin so caches don’t mix responses."]],"r":[44,43,46,9],"m":["CORS preflight failures in browser error reporting: misconfigured origins break real users.","OPTIONS request volume: high preflight counts suggest adding Access-Control-Max-Age."],"k":["A script on evil.com tries to read your API’s JSON using fetch. Your API returns no CORS headers. What happens?",["The request is blocked from leaving the browser","The browser may send the request but blocks evil.com’s script from reading the response","The server rejects it automatically","CORS has no effect"],1,"CORS controls whether the browser lets a script READ the cross-origin response. It doesn’t stop requests from being sent, and it doesn’t protect against non-browser clients."],"sl":"cors"},{"n":19,"c":"sec","t":"Secrets Management","s":"Keeping passwords, API keys and private keys out of your code and in a secure, controlled store.","w":"Secrets are things that grant access: DB passwords, Stripe keys, JWT signing keys, cloud credentials. Secrets management means storing them in a dedicated system (AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager, Kubernetes Secrets with encryption), giving apps access only at runtime, rotating them, and logging who accessed what.","y":"Secrets committed to Git live forever in the history, even after you delete them. Bots scan public GitHub for AWS keys within minutes and spin up crypto miners on your bill. Secrets placed in frontend code are visible to every visitor.","h":["Never commit secrets. Use .env files only locally and add them to .gitignore.","Use a secrets manager in production; inject secrets as environment variables or files at runtime.","Give each service only the secrets it needs (least privilege), with separate secrets per environment.","Rotate secrets regularly and immediately if one leaks. Revoking the old key matters more than deleting the commit.","Add secret scanning (GitHub secret scanning, gitleaks, trufflehog) to CI and pre-commit hooks.","Never put server secrets in frontend env vars like NEXT_PUBLIC_ or VITE_; those are shipped to browsers.","Prefer short-lived credentials (IAM roles, workload identity) over long-lived keys."],"e":"A developer pushed an AWS key to a public repo by mistake. Within about 5 minutes automated scanners found it, and dozens of GPU instances started mining crypto, generating a bill of thousands of dollars before the key was revoked.","p":["Deleting the leaked secret from Git but not revoking it","Sharing one admin key across all services","Logging full config objects that include secrets","Putting secrets inside Docker images"],"v":["Encryption at Rest","Encryption at rest protects stored data. Secrets management controls who can GET the keys, how they’re rotated and audited. Encryption is useless if the key sits in your repo."],"f":["App starts","Fetch secret from vault (IAM role)","Use in memory only","Rotate on schedule"],"q":[["You accidentally pushed an API key to GitHub. What do you do first?","Revoke/rotate the key immediately at the provider, then check usage logs, then remove it from history. Deleting the commit alone isn’t enough."],["Why are frontend environment variables not secret?","They’re bundled into JavaScript sent to every browser; anyone can read them."],["What is the benefit of short-lived credentials?","If stolen, they expire quickly, limiting damage, and there is no long-lived key to leak."],["What’s wrong with putting a database password in a Docker image?","Anyone who can pull the image can extract it from its layers, even if a later layer deletes it. Inject secrets at runtime instead."],["What does secret rotation involve without downtime?","Create the new secret, deploy apps that accept/use it (often supporting both old and new briefly), then revoke the old one."]],"r":[48,47,50,65],"m":["Secret access audit logs: unusual readers or volumes may indicate compromise.","Secret age: secrets past their rotation date.","Secret-scanning alerts in CI/repos: any hit needs immediate rotation."],"k":["You find an API key committed to a public repo three months ago. What is the FIRST thing to do?",["Delete the file and force-push","Revoke/rotate the key at the provider","Make the repo private","Add the file to .gitignore"],1,"The key has been public; history and forks may still contain it. Only revoking it actually stops misuse. Clean history afterwards."],"sl":"secrets-management"},{"n":20,"c":"db","t":"Database Indexing","s":"A sorted lookup structure that lets the database jump straight to matching rows instead of reading the whole table.","w":"Without an index, finding WHERE email = 'a@b.com' means checking every row (a full table scan). An index is like the index at the back of a book: a sorted list of values pointing to where the rows are. Most databases use a B-tree, which finds a value among millions in a handful of steps.","y":"On a table with 10 million rows, a scan can take seconds; with an index the same lookup takes about a millisecond. But indexes aren’t free: every INSERT/UPDATE must also update every index, and they use disk and memory.","h":["Index columns you filter on (WHERE), join on (JOIN ... ON), or sort by (ORDER BY).","Composite index (a, b) works for queries on a, or a AND b, but NOT for b alone. This is the left-most prefix rule. Put the equality columns first, then range/sort columns.","Covering index: include all columns the query needs so the DB never visits the table.","Partial index: index only rows you query, e.g. WHERE status = 'active'.","Unique indexes also enforce data rules (no duplicate emails).","Verify with EXPLAIN that the index is actually used.","Remove unused indexes; they slow writes for no benefit.","Low-selectivity columns (e.g. a boolean) alone rarely benefit from an index."],"code":"CREATE INDEX idx_orders_user_created\n  ON orders (user_id, created_at DESC);\n-- fast:  WHERE user_id = 7 ORDER BY created_at DESC\n-- fast:  WHERE user_id = 7\n-- slow:  WHERE created_at > '2026-01-01'  (not left-most)","e":"An orders page filtered by user_id and sorted by date took 2.4 s on 30M rows. One composite index on (user_id, created_at) brought it to 4 ms.","p":["Wrapping the column in a function: WHERE LOWER(email) = ... won’t use a normal index on email (use an expression index)","LIKE '%term' with a leading wildcard can’t use a B-tree","Indexing every column “to be safe” and making writes slow","Wrong column order in composite indexes"],"v":["Caching","An index makes the DB’s lookup faster and is always up to date. A cache avoids the DB entirely but can be stale."],"f":["WHERE user_id = 7","!No index: scan 10M rows","B-tree index lookup","Jump to matching rows (~1 ms)"],"q":[["What is the left-most prefix rule?","A composite index on (a, b, c) can be used for queries on a, (a, b), or (a, b, c), but not for b or c alone."],["Why can indexes slow down a system?","Every write must update each index, adding CPU and IO, and indexes consume storage and memory."],["What is a covering index?","An index containing every column a query needs, so the database answers from the index alone without reading the table rows."],["Why might the database ignore an index you created?","The query uses a function on the column, a leading wildcard LIKE, a type mismatch, or the planner estimates a scan is cheaper because the filter matches most rows or statistics are stale."],["What is index selectivity?","How well an index narrows results. A unique email is highly selective; a boolean is not, so indexing it alone rarely helps."]],"r":[21,5,131,145],"num":"10M rows, full scan reads all 10M; B-tree depth ≈ log_200(10M) ≈ 3–4 page reads.\nIndex size for an 8-byte column: ~10M × ~20 bytes ≈ 200 MB.\nEach extra index adds one more structure to update on every INSERT.","m":["Sequential scans on large tables (pg_stat_user_tables): candidates for missing indexes.","Index usage counts (pg_stat_user_indexes): indexes with zero scans are pure write cost.","Write latency after adding indexes: confirms the write cost is acceptable."],"k":["You have an index on (user_id, created_at). Which query cannot use it efficiently?",["WHERE user_id = 7","WHERE user_id = 7 ORDER BY created_at DESC","WHERE created_at > '2026-01-01'","WHERE user_id = 7 AND created_at > '2026-01-01'"],2,"Composite indexes follow the left-most prefix rule. Filtering only on the second column can’t use the index’s sort order."],"sl":"database-indexing"},{"n":21,"c":"db","t":"Query Optimization","s":"Finding out WHY a query is slow and changing the query, indexes or schema so the database does far less work.","w":"When you send SQL, the database’s query planner chooses HOW to run it: which index, which join method, what order. Optimization means reading that plan, finding the expensive step, and fixing it. The goal is always the same: read fewer rows, and do fewer round trips.","y":"One slow query running on every page load can max out the database CPU and make the entire app slow. Usually a small fix (an index, a rewritten condition, fetching less data) gives 10× to 1000× speedups.","h":["Find the slow queries first: enable the slow query log or pg_stat_statements and sort by TOTAL time (calls × average), not just the single slowest.","Run EXPLAIN ANALYZE and read it. Look for “Seq Scan” on big tables, huge “rows” estimates, sorts spilling to disk, and nested loops over many rows.","Add or fix indexes for the WHERE, JOIN and ORDER BY columns (composite index in the right order).","Make conditions sargable (index-friendly): write created_at >= '2026-01-01' instead of YEAR(created_at) = 2026; avoid functions on indexed columns.","Select only needed columns instead of SELECT *, especially big text/JSON columns.","Use LIMIT and keyset pagination instead of huge OFFSET values.","Kill N+1 patterns: batch with IN (...) or JOIN.","Avoid OR across different columns that blocks index use; rewrite as UNION if needed.","Replace correlated subqueries with JOINs or EXISTS when the planner handles them badly.","Keep table statistics fresh (ANALYZE) so the planner estimates correctly.","For heavy reports: precompute with materialized views or summary tables, or move them to a read replica.","Re-measure after every change; never assume."],"code":"EXPLAIN ANALYZE\nSELECT id, total FROM orders\nWHERE user_id = 7 AND created_at >= '2026-01-01'\nORDER BY created_at DESC LIMIT 20;\n\n-- Before: Seq Scan on orders (rows=30,000,000) 2400 ms\n-- Fix: CREATE INDEX ON orders (user_id, created_at DESC);\n-- After:  Index Scan using orders_user_created  3 ms","e":"A dashboard query used WHERE DATE(created_at) = today, which ignored the index on created_at and scanned 50M rows. Rewriting it as created_at >= today AND created_at < tomorrow made it use the index: 9 s down to 15 ms.","p":["Guessing instead of running EXPLAIN ANALYZE","Optimising a query that runs once a day while ignoring one that runs 10,000 times a minute","SELECT * pulling megabytes of unused columns","Deep OFFSET pagination (OFFSET 100000 still reads 100,000 rows)","Testing on a tiny dev database where everything is fast"],"v":["Database Indexing","Indexing is ONE tool. Query optimization is the whole process: find slow queries, read the plan, then fix with indexes, rewrites, less data, caching or precomputation."],"f":["Find slow query (logs)","EXPLAIN ANALYZE","!Seq Scan 30M rows","Index + rewrite → 3 ms"],"q":[["What is the first step to optimize a slow query?","Measure: find it via slow logs/pg_stat_statements, then run EXPLAIN ANALYZE to see the actual plan and where time is spent."],["What does “sargable” mean? Give an example.","A condition the DB can answer with an index. created_at >= '2026-01-01' is sargable; YEAR(created_at) = 2026 is not because of the function on the column."],["Why is large OFFSET slow and what’s the alternative?","OFFSET N still reads and discards N rows. Keyset pagination (WHERE id < last_seen_id ORDER BY id DESC LIMIT 20) jumps straight via the index."],["EXPLAIN vs EXPLAIN ANALYZE?","EXPLAIN shows the estimated plan without running; EXPLAIN ANALYZE actually runs the query and shows real row counts and timings."],["How do you prioritize which queries to optimize?","By total time consumed (frequency × duration), because a 20 ms query called a million times matters more than a 5 s query called once."]],"r":[20,5,133,154],"m":["Total time per query fingerprint (pg_stat_statements): optimise the biggest total, not just the slowest single query.","Rows examined vs rows returned: a big ratio means the query reads far more than it needs.","Temp files / disk sorts: sorts spilling to disk indicate missing indexes or low work_mem."],"k":["EXPLAIN ANALYZE shows 'Seq Scan on orders (rows=30,000,000)' for a query filtering by user_id. Best first step?",["Add more RAM","Create an index on user_id (or a composite index matching filter + sort)","Switch to NoSQL","Increase the connection pool"],1,"A sequential scan over a huge table for a selective filter almost always means a missing or unusable index."],"sl":"query-optimization"},{"n":22,"c":"db","t":"Read Replicas","s":"Extra copies of your database that handle read queries, so the main database can focus on writes.","w":"The primary database accepts all writes. It streams every change to one or more replicas. Your app sends SELECT queries to the replicas and INSERT/UPDATE/DELETE to the primary. Most apps read far more than they write (often 10:1 or more), so this spreads the heaviest load.","y":"A single database server eventually runs out of CPU just answering reads. Adding replicas multiplies read capacity without touching how writes work. Replicas can also take over if the primary dies.","h":["Route reads to replicas and writes to the primary (many ORMs and proxies like ProxySQL support this).","Understand replication lag: replicas are usually milliseconds behind, sometimes seconds under heavy load.","Read-your-own-writes: right after a user saves something, read from the primary (or wait until the replica catches up), or they’ll think their save was lost.","Send heavy reports and analytics to a dedicated replica so they can’t slow down user traffic.","Monitor replica lag and stop sending traffic to replicas that fall too far behind."],"e":"A news site sends article reads to 4 replicas and only editor saves to the primary. After an editor publishes, the admin page reads from the primary so the editor sees the change instantly.","p":["User updates profile, page reloads from a lagging replica and shows old data","Thinking replicas are backups (a DROP TABLE replicates instantly)","Replicas don’t help write-heavy workloads"],"v":["Backups","A replica copies every change immediately, including mistakes. A backup is a frozen point in time you can restore to after a mistake."],"f":["Write → primary","Primary streams changes","Replicas (slightly behind)","Reads served by replicas"],"q":[["What is replication lag and why does it matter?","The delay before a write on the primary appears on a replica. Reading from a lagging replica can show stale data, e.g. a user not seeing their own update."],["How do you guarantee read-your-own-writes?","Read from the primary for that user for a short time after a write, or track the write position and wait for the replica to catch up."],["Do read replicas help with write load?","No; every replica must apply every write too. For write scaling you need sharding or a bigger primary."],["How do you decide which queries can go to replicas?","Reads that tolerate small staleness (listings, reports, public pages) go to replicas; reads right after a user’s own write or those requiring the latest state (balances, checkout) go to the primary."],["What happens to replicas during a heavy write burst?","They may fall behind as they replay changes, increasing lag; monitor lag and shed read traffic from lagging replicas."]],"r":[30,7,33,96],"num":"Primary handles 8,000 reads/s + 800 writes/s at 85% CPU.\nAdd 3 replicas, send reads there: ~2,700 reads/s each; primary keeps writes.\nReplication lag example: 200 ms typical, 10 s under a heavy batch job.","m":["Replication lag per replica: the key metric; route traffic away from lagging replicas.","Read distribution across replicas: uneven load means routing problems.","Replica errors/disconnects: broken replication silently serves stale data."],"k":["A user updates their profile, reloads, and sees the old version. You use read replicas. Why?",["The write failed","The reload was served by a replica that hasn’t applied the change yet (replication lag)","The cache is disabled","The primary crashed"],1,"Replicas are slightly behind the primary. Read-your-own-writes requires reading from the primary (or a caught-up replica) right after a write."],"sl":"read-replicas"},{"n":23,"c":"db","t":"Database Migrations","s":"Version-controlled scripts that change your database structure step by step, the same way everywhere.","w":"A migration is a small file like “003_add_phone_to_users” with the SQL change (and often a reverse change). A migration tool (Flyway, Liquibase, Alembic, Prisma Migrate, Rails/Django migrations) records which ones have run and applies new ones in order. Your schema evolves like code: reviewed, versioned and repeatable.","y":"Changing production by hand leads to “works on my machine” databases, forgotten steps and outages. Some changes also lock big tables for minutes and take the site down if done naively.","h":["Every schema change goes in a migration file committed with the code that needs it.","Run migrations automatically in CI/CD, the same way in dev, staging and production.","Use expand → migrate → contract for zero downtime: 1) add new column (nullable), 2) deploy code that writes both, 3) backfill old rows in batches, 4) switch reads, 5) later drop the old column.","Never rename or drop a column in the same deploy that stops using it; old app servers are still running during a rolling deploy.","Watch out for locking operations on big tables; use online tools (CREATE INDEX CONCURRENTLY, gh-ost, pt-online-schema-change).","Backfill large data in small batches, not one giant UPDATE.","Back up before risky migrations and test them on a copy of production-size data."],"code":"-- step 1 (expand): safe, no lock on reads\nALTER TABLE users ADD COLUMN phone TEXT NULL;\nCREATE INDEX CONCURRENTLY idx_users_phone ON users(phone);\n-- step 3: backfill in batches of 10k\n-- step 5 (contract, weeks later): ALTER TABLE users DROP COLUMN old_phone;","e":"A team added a NOT NULL column with a default to a 200M-row table on an old MySQL version; it rewrote the table and locked it for 40 minutes. The expand/contract approach would have had zero downtime.","p":["Renaming a column while old code still reads the old name","Big table-locking ALTERs during peak traffic","Editing a migration that already ran in production instead of writing a new one"],"v":["Schema Versioning","A migration is one CHANGE. Schema versioning is the RECORD of which changes have been applied. Migration tools do both."],"f":["Add new column","Deploy code writing both","Backfill in batches","Drop old column later"],"q":[["Explain expand and contract migrations.","First add new structures without breaking old code, migrate data and code to use them, then remove old structures in a later release, keeping every intermediate state compatible."],["Why can’t you drop a column in the same deploy?","During rolling deploys old instances still run and may query that column; they’d crash."],["How do you add an index to a huge Postgres table without downtime?","CREATE INDEX CONCURRENTLY, which builds without blocking writes (it’s slower and can’t run inside a transaction)."],["Why should migrations be tested on production-size data?","Operations that are instant on small tables can lock or rewrite huge tables for minutes; only realistic data reveals duration and locking."],["Can every migration be rolled back?","No. Dropping columns or transforming data may be irreversible, so prefer additive changes, back up first, and plan roll-forward fixes."]],"r":[24,73,72,125],"num":"Backfill 200M rows in one UPDATE: long lock + huge transaction log.\nBatches of 10,000: 20,000 batches; at 50 ms each ≈ 17 minutes, with no long locks.","m":["Migration duration and lock waits: watch for blocked queries while migrations run.","Error rate during and after deploys with schema changes.","Replication lag during backfills: big writes can delay replicas."],"k":["You want to rename column 'phone' to 'mobile' with zero downtime during rolling deploys. Best approach?",["ALTER TABLE RENAME in the same deploy as the code change","Add 'mobile', write to both, backfill, switch reads, then drop 'phone' later","Drop 'phone' and add 'mobile'","Rename it at night"],1,"Expand/contract keeps every intermediate state compatible with both old and new code running at the same time."],"sl":"database-migrations"},{"n":24,"c":"db","t":"Schema Versioning","s":"Tracking exactly which version of the database structure each environment is on.","w":"Migration tools keep a special table (e.g. schema_migrations or flyway_schema_history) listing every migration that has run, with a version number and checksum. Looking at it tells you exactly what shape the database is in, and the tool knows which new migrations to apply.","y":"Without it, staging might have a column production lacks, a developer’s database drifts, and deploys fail with “column does not exist”. Nobody can say for sure what state production is in.","h":["Let the migration tool own the version table; never edit it by hand.","Use ordered versions (timestamps avoid number clashes between developers).","Never change a migration that has already run anywhere shared; checksums will catch it. Write a new one instead.","Run “pending migrations” checks in CI and fail the build if the schema and code disagree.","Detect drift: compare the live schema with what migrations would produce.","For APIs/events carrying data, also version your data formats (e.g. with a schema registry for Avro/Protobuf)."],"code":"SELECT version, description, installed_on\nFROM flyway_schema_history ORDER BY installed_rank;\n-- 20260102_1200 | add_users_phone | 2026-01-02","e":"Two developers both created migration “015”. Switching to timestamp versions (20260310_0915_add_tags) ended the clashes.","p":["Hot-fixing production schema by hand, causing drift","Editing old migrations","Different environments applying migrations in different orders"],"v":["API Versioning","Schema versioning tracks your DATABASE structure. API versioning manages the contract your CLIENTS depend on. A DB change shouldn’t automatically force a new API version."],"f":["New migration file","Tool checks version table","Applies missing ones in order","Records version + checksum"],"q":[["Where does a migration tool store which migrations ran?","In a dedicated table in the database itself, with version, description, checksum and timestamp."],["Why use timestamps for migration versions?","Developers working in parallel won’t pick the same number, avoiding conflicts."],["What is schema drift?","When the actual database schema differs from what the migrations describe, usually due to manual changes."],["How do you detect schema drift?","Compare the live schema against what migrations produce (schema diff tools), and fail CI if they differ."],["Why keep migrations in the same repository as the code?","So every code version is paired with the schema it expects, reviewed together, and deployed in a controlled order."]],"r":[23,77,78,65],"m":["Pending migrations per environment: drift between staging and production.","Checksum mismatch errors: someone edited an applied migration."],"k":["The migration tool fails with a checksum mismatch on migration 012 in production. What happened?",["The database is corrupted","Someone edited a migration file after it had already been applied","The network failed","Two migrations have the same name"],1,"Tools store a checksum of each applied migration. Editing an applied file changes it; write a new migration instead."],"sl":"schema-versioning"},{"n":25,"c":"db","t":"Optimistic Locking","s":"Let everyone edit freely, but on save, check that nobody else changed the record since you read it.","w":"Each row has a version number. You read the row (version 5), make changes, and save with UPDATE ... WHERE id = ? AND version = 5, setting version = 6. If someone else saved first, the version is now 6, your update matches zero rows, and you know there was a conflict. No locks are held while the user is thinking.","y":"Without it, two people edit the same wiki page; whoever saves last silently wipes out the other’s work (a “lost update”). Holding real database locks while humans edit for minutes would be terrible.","h":["Add a version integer (or updated_at) column.","Read the version along with the data and send it to the client.","Update with WHERE version = :old and SET version = version + 1.","If rows affected = 0, it’s a conflict: show “someone else changed this”, reload, merge or retry.","In HTTP APIs use ETag and If-Match headers; return 412 Precondition Failed on mismatch.","Most ORMs support it built in (JPA @Version, Rails lock_version, Django packages)."],"code":"UPDATE documents\nSET body = :body, version = version + 1\nWHERE id = :id AND version = :version_i_read;\n-- 0 rows updated => conflict, tell the user","e":"Google Docs-style editors aside, Jira and Confluence use version checks so that if two people edit the same ticket, the second gets a “this issue was updated” warning instead of overwriting.","p":["Forgetting to check rows affected","Using it on very hot rows where conflicts constantly happen, causing endless retries","Not including the version in the API, so clients can’t send it back"],"v":["Pessimistic Locking","Optimistic: no lock, detect conflict at save time; best when conflicts are rare. Pessimistic: lock first, others wait; best when conflicts are frequent and short."],"f":["A and B read v5","A saves → v6","!B saves with v5 → 0 rows","B reloads and retries"],"q":[["How does optimistic locking detect a conflict?","The update includes the version that was read in its WHERE clause; if another writer bumped the version, zero rows are updated."],["When is optimistic better than pessimistic locking?","When conflicts are rare and edits are long (like humans editing forms), because no locks are held."],["How do HTTP APIs implement optimistic concurrency?","With ETags: client sends If-Match with the ETag it read; server returns 412 if the resource changed."],["How does an ETag implement optimistic locking over HTTP?","The server returns an ETag (a version/hash). The client sends it back in If-Match when updating; if it no longer matches, the server returns 412 Precondition Failed."],["When is optimistic locking a bad fit?","For hot rows with constant concurrent updates, where most attempts conflict and retry endlessly; use atomic operations or pessimistic locks instead."]],"r":[26,14,133,1],"num":"Conflict probability: 1,000 edits/hour on 100,000 docs → conflicts are rare (optimistic works).\nHot counter updated 500 times/s by many clients → constant version conflicts and retries (use atomic increments or pessimistic locks).","m":["Version conflict rate: rising conflicts mean contention; consider a different strategy for hot rows.","Retries per successful update: high values waste work."],"k":["UPDATE docs SET body=?, version=version+1 WHERE id=7 AND version=5 updates 0 rows. What does it mean?",["The database is down","Someone else updated the document after you read version 5","The document was deleted permanently","The update succeeded"],1,"Zero rows matched because the version changed. That’s a detected conflict: reload, merge or retry."],"sl":"optimistic-locking"},{"n":26,"c":"db","t":"Pessimistic Locking","s":"Lock the row before changing it, so anyone else who wants it must wait until you’re done.","w":"Inside a transaction you run SELECT ... FOR UPDATE. The database locks those rows. Another transaction trying to lock or update them waits until you commit or roll back. You assume conflict will happen, so you prevent it up front.","y":"For things like seat booking, inventory or account balances under heavy concurrent access, detecting conflicts after the fact means lots of failed retries. Locking guarantees only one change at a time.","h":["Begin a transaction, SELECT ... FOR UPDATE the rows you’ll change, update, commit.","Keep the locked section tiny: no HTTP calls or user waits inside.","Lock in a consistent order to avoid deadlocks.","Use NOWAIT to fail immediately, or SKIP LOCKED to grab the next free row (great for job queues).","Set lock_timeout so waits don’t last forever.","Use FOR SHARE when you only need to stop others from changing the row while you read."],"code":"BEGIN;\nSELECT qty FROM stock WHERE sku = 'A1' FOR UPDATE;\n-- others now wait for this row\nUPDATE stock SET qty = qty - 1 WHERE sku = 'A1';\nCOMMIT;\n\n-- job queue: each worker takes a different job\nSELECT * FROM jobs WHERE status='new'\nFOR UPDATE SKIP LOCKED LIMIT 1;","e":"Many Postgres-backed job queues (like Que, GoodJob, Oban) use FOR UPDATE SKIP LOCKED so 20 workers can safely pull jobs from one table without taking the same job.","p":["Holding locks while calling payment APIs","Locking whole tables when you only need one row","Inconsistent lock order causing deadlocks"],"v":["Distributed Lock","Pessimistic DB locks protect rows inside one database. A distributed lock coordinates work across servers for anything (files, jobs, external APIs)."],"f":["T1: SELECT … FOR UPDATE","T2 tries same row → waits","T1 updates + commits","T2 continues with fresh data"],"q":[["What does SELECT ... FOR UPDATE do?","Locks the selected rows until the transaction ends so other transactions can’t modify or lock them."],["What is SKIP LOCKED useful for?","Job queues: each worker skips rows already locked by others and takes the next available one."],["What’s the main risk of pessimistic locking?","Long waits, lower throughput and deadlocks, especially if locks are held for long."],["What’s the danger of calling an external API while holding a row lock?","The API may be slow or hang, so the lock is held for a long time, blocking other transactions and risking timeouts and deadlocks."],["NOWAIT vs SKIP LOCKED?","NOWAIT fails immediately if the row is locked; SKIP LOCKED silently skips locked rows and returns others."]],"r":[25,15,27,36],"m":["Lock wait time and blocked sessions: show contention on locked rows.","Lock timeouts (NOWAIT failures): rising counts mean too much contention.","Transaction duration while holding locks."],"k":["Twenty workers pull jobs from a Postgres table. Which clause lets each grab a different job without waiting?",["FOR UPDATE NOWAIT","FOR UPDATE SKIP LOCKED","FOR SHARE","LOCK TABLE"],1,"SKIP LOCKED makes each worker skip rows already locked by others and take the next free one."],"sl":"pessimistic-locking"},{"n":27,"c":"dist","t":"Distributed Locks","s":"A lock that works across many servers, so only one of them does a particular job at a time.","w":"An in-memory mutex only stops threads in one process. When you have 10 servers and want only one to run the nightly report or process invoice #42, you need a lock stored somewhere all of them can see: Redis, ZooKeeper, etcd, Consul, or a database row.","y":"Without it, a cron job running on every server sends 10 copies of the same email, or two workers process the same file at the same time.","h":["Use a lease, not a forever lock: the lock expires after N seconds so a crashed server doesn’t block everyone forever.","Acquire atomically: Redis SET key value NX PX 30000 (set only if not exists, with expiry).","Store a unique random value and only delete the lock if the value is still yours (use a Lua script for check-and-delete).","Renew the lease while working on long tasks.","Use fencing tokens: the lock service hands out an increasing number, and the resource rejects writes with an older number. This protects you when a paused server thinks it still holds an expired lock.","For strong guarantees prefer consensus systems (etcd, ZooKeeper); a single Redis is fine for “avoid duplicate work” but not for correctness-critical safety.","Still make the work idempotent; locks reduce duplicates, they don’t make them impossible."],"code":"ok = redis.set(\"lock:report\", my_id, nx=True, px=30000)\nif ok:\n    try: run_report()\n    finally:\n        # delete only if still mine (atomic Lua script)\n        release_if_owner(\"lock:report\", my_id)","e":"A garbage-collection pause froze a server for 40 s while holding a 30 s lock. The lock expired, another server took it, and both wrote to the same file. Fencing tokens let the storage reject the stale writer.","p":["No expiry, so one crash blocks forever","Deleting someone else’s lock after yours expired","Assuming a lock makes duplicate work impossible"],"v":["Leader Election","A distributed lock protects ONE task or resource for a short time. Leader election picks ONE node to be the coordinator for a longer period. Leader election is often built on leases too."],"f":["Servers race for lock","One wins (SET NX + TTL)","Others skip or wait","Winner releases / lease expires"],"q":[["Why must a distributed lock have an expiry?","If the holder crashes it can never release the lock; a TTL/lease guarantees eventual release."],["What is a fencing token?","A monotonically increasing number issued with each lock grant; the protected resource rejects requests carrying an older token, blocking stale holders."],["Why compare the stored value before releasing?","Your lock may have expired and been taken by someone else; deleting blindly would release their lock."],["Is a single Redis instance safe for distributed locking?","For avoiding duplicate work, often yes. For strict correctness it’s risky (failover can lose locks); use consensus systems (etcd/ZooKeeper) plus fencing for critical cases."],["What happens if work takes longer than the lock lease?","The lock can expire and another worker may start the same work. Renew the lease while working and make the work idempotent."]],"r":[31,135,26,94],"m":["Lock acquisition failures and wait time: contention or a stuck holder.","Lease expirations while work is in progress: tasks taking longer than the lease.","Fencing token rejections: stale holders attempting writes."],"k":["Why is a fencing token needed even with lock expiry?",["To make locks faster","Because a paused process may still think it holds an expired lock; the resource rejects its older token","To encrypt the lock","To avoid using Redis"],1,"GC pauses or network delays can make a holder outlive its lease. Increasing tokens let the protected resource reject writes from stale holders."],"sl":"distributed-locks"},{"n":28,"c":"db","t":"Sharding","s":"Splitting your data across several separate databases, each holding only part of it.","w":"When one database server can’t hold or handle all the data, you split rows by a shard key. For example users 1–1M on shard A, 1M–2M on shard B, or shard = hash(user_id) % 8. Each shard is a full independent database. The app (or a routing layer) uses the key to find the right shard.","y":"A single machine has limits on disk, memory, CPU and especially write throughput. Read replicas don’t help with writes. Sharding lets you scale writes and storage horizontally. It’s powerful but adds lots of complexity, so it’s usually a late step.","h":["Try simpler things first: indexes, query fixes, caching, read replicas, a bigger machine.","Pick a shard key that appears in almost every query (often tenant_id or user_id) so queries hit one shard.","The key should spread data and traffic evenly and avoid hot shards (a celebrity user, today’s date).","Choose a scheme: range (easy range queries, risk of hotspots), hash (even spread, no range queries), or directory/lookup table (flexible, extra lookup).","Use consistent hashing or many small virtual shards so you can rebalance without moving everything.","Plan for cross-shard queries (scatter-gather), cross-shard transactions (avoid them) and globally unique IDs (e.g. Snowflake IDs).","Consider systems that shard for you: Vitess, Citus, CockroachDB, DynamoDB, MongoDB."],"code":"shard = hash(user_id) % NUM_SHARDS\ndb = shards[shard]\ndb.query(\"SELECT * FROM orders WHERE user_id = %s\", user_id)","e":"Instagram sharded Postgres by user ID into thousands of logical shards mapped onto fewer physical servers, so they could move logical shards between machines as they grew.","p":["Picking a key that creates hot spots","Using hash % N, then changing N forces moving almost all data","Needing frequent joins across shards","Sharding too early and paying the complexity cost for nothing"],"v":["Partitioning","Partitioning usually splits a table into pieces INSIDE one database. Sharding spreads pieces across SEPARATE database servers. Sharding is partitioning taken across machines."],"f":["Order for user 7381","hash(7381) % 4 = 1","Route to shard 1","Only shard 1 does the work"],"q":[["What makes a good shard key?","High cardinality, even distribution of data and load, and present in most queries so they hit a single shard."],["Why is hash % N problematic when adding shards?","Changing N remaps almost every key, requiring huge data movement; consistent hashing or fixed virtual shards avoid this."],["What becomes harder after sharding?","Cross-shard joins, transactions, global uniqueness, rebalancing, reporting and operations."],["How do you run a query that needs data from all shards?","Scatter-gather: send it to every shard in parallel and merge results, or maintain a separate aggregated store (warehouse/search index) for such queries."],["What is a hot shard and how do you fix it?","One shard getting far more traffic, often due to a skewed key. Split it, move tenants, add key salting, or cache hot data."]],"r":[127,29,30,134],"num":"2 TB data, 40,000 writes/s; one node handles ~10,000 writes/s.\nShards needed ≈ 40,000 ÷ 10,000 = 4 (plan 8 for growth/headroom).\nhash % 4 → % 5: ~80% of keys move. Consistent hashing: ~20% move.","m":["Per-shard load (QPS, CPU, storage): finds hot shards.","Cross-shard query rate: high rates mean a poor shard key.","Rebalancing progress and errors."],"k":["Which is generally the best shard key for a multi-tenant SaaS app?",["created_at","tenant_id","status","country"],1,"Most queries are scoped to one tenant, so tenant_id keeps them on a single shard. Dates and status values create hot spots."],"sl":"sharding"},{"n":29,"c":"db","t":"Partitioning","s":"Splitting one huge table into smaller pieces inside the same database, so queries and maintenance touch only the relevant piece.","w":"The table still looks like one table to your app, but under the hood rows are stored in separate partitions, e.g. one per month for an events table. Types: range (by date), list (by region), hash (spread evenly). When a query filters on the partition key, the database skips other partitions (“partition pruning”).","y":"Tables with billions of rows get slow to query, index, vacuum and clean up. Deleting old data with DELETE on billions of rows is painful; with partitions you just drop last year’s partition instantly.","h":["Choose a partition key used in most WHERE clauses (often a timestamp).","Make sure queries filter on that key, or pruning can’t happen and you scan every partition.","Keep partition counts reasonable (dozens to a few thousand, not millions).","Automate creating future partitions (pg_partman, cron) and dropping/archiving old ones.","Remember unique constraints usually must include the partition key."],"code":"CREATE TABLE events (id bigint, created_at timestamptz, data jsonb)\n  PARTITION BY RANGE (created_at);\nCREATE TABLE events_2026_10 PARTITION OF events\n  FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');\n-- delete a whole month instantly:\nDROP TABLE events_2025_10;","e":"A logging platform kept 90 days of events partitioned by day. Retention became “drop partitions older than 90 days”, replacing a nightly DELETE that used to run for hours.","p":["Queries that don’t filter on the partition key (scan all partitions)","Too many tiny partitions","Thinking partitioning automatically makes everything faster"],"v":["Sharding","Partitioning = pieces inside ONE database server. Sharding = pieces across MANY servers. Partitioning helps manageability; sharding adds machines."],"f":["Query: last 7 days","Planner checks partitions","Prune old months","Scan only 1 partition"],"q":[["What is partition pruning?","The planner skips partitions that can’t contain matching rows, based on the WHERE clause on the partition key."],["Why is partitioning great for data retention?","Old data can be removed by dropping a partition, which is instant, versus a slow massive DELETE."],["Range vs hash partitioning?","Range groups by ordered values (dates) and suits time queries/retention; hash spreads rows evenly when there’s no natural range."],["What happens if you insert a row for a date with no partition?","It fails (or goes to a default partition if configured). Automate creating partitions ahead of time."],["Partitioning vs adding an index?","An index speeds row lookups; partitioning splits storage so queries and maintenance touch fewer pieces and old data can be dropped instantly. They’re often used together."]],"r":[28,121,154,20],"num":"Events table: 50M rows/day, keep 90 days = 4.5B rows.\nDaily partitions: 90 partitions; deleting a day = DROP TABLE (instant) vs DELETE of 50M rows (hours + bloat).","m":["Partitions scanned per query (EXPLAIN): should be few if pruning works.","Partition count and creation job health: missing future partitions cause insert failures."],"k":["A query on a date-partitioned table is still slow and scans every partition. Why?",["Partitions are too small","The query doesn’t filter on the partition key, so pruning can’t skip partitions","Indexes are not allowed on partitions","The database is replicated"],1,"Partition pruning only works when the WHERE clause constrains the partition key."],"sl":"partitioning"},{"n":30,"c":"db","t":"Replication","s":"Keeping copies of the same data on multiple machines, so you survive failures and can serve more reads.","w":"Every change on one node is copied to others. Common setups: leader–follower (one leader takes writes, followers copy), multi-leader (several accept writes, conflicts must be resolved) and leaderless (like Cassandra/Dynamo: write to several nodes, read from several). Copies can be synchronous (wait until the copy confirms) or asynchronous (don’t wait).","y":"A single disk or server will eventually fail. Without replication, that means downtime and possibly lost data. Replication gives high availability, read scaling, and lets you put data closer to users in other regions.","h":["Synchronous replication: no data loss on failover, but each write waits for the replica (slower).","Asynchronous replication: fast writes, but if the leader dies, the last few writes may be lost.","Semi-sync: wait for at least one replica, a common middle ground.","Plan failover: who promotes a replica, and how do clients find the new leader?","Prevent split-brain (two leaders at once) using fencing or consensus.","For leaderless systems, use quorums: with N copies, write to W and read from R where W + R > N to see the latest data.","Still take backups: replication copies mistakes too."],"e":"Amazon RDS Multi-AZ keeps a synchronous standby in another availability zone. If the primary’s zone fails, DNS switches to the standby in about a minute with no lost committed data.","p":["Treating replicas as backups","Async replication with automatic failover silently losing recent writes","Split-brain after a network partition"],"v":["Sharding","Replication = SAME data copied many times (safety, reads). Sharding = DIFFERENT data on different machines (capacity, writes). Big systems use both: each shard is replicated."],"f":["Write to leader","Copy to followers (sync/async)","!Leader dies","Follower promoted"],"q":[["Sync vs async replication trade-off?","Sync guarantees replicas have every committed write but adds latency; async is faster but can lose recent writes on failover."],["What is split-brain?","Two nodes both believing they are leader and accepting writes, causing divergent data."],["In a quorum system with N=3, what W and R give consistent reads?","Any W + R > N, e.g. W=2, R=2, so read and write sets always overlap."],["What is semi-synchronous replication?","The leader waits until at least one replica confirms receiving a write before acknowledging it, a middle ground between durability and latency."],["Why do leaderless systems use read repair?","Replicas can diverge; when a read sees an outdated replica, it writes back the newest value to keep copies converging."]],"r":[22,96,136,97],"num":"Async replication with 200 ms lag at 1,000 writes/s:\nIf the leader dies, up to ~200 writes may be lost on failover.\nSync to 1 replica: + one round trip (~1 ms same region) per commit, 0 committed writes lost.","m":["Replication lag: the main health signal for async replicas.","Replica connection status: a broken stream silently stops updates.","Failover events and data loss checks."],"k":["With asynchronous replication and automatic failover, what can happen when the leader crashes?",["Nothing is ever lost","The most recent writes not yet copied to the follower may be lost","The follower refuses to become leader","All replicas crash"],1,"Async replication confirms writes before followers have them. If the leader dies, those latest writes may not exist on the new leader."],"sl":"replication"},{"n":31,"c":"dist","t":"Leader Election","s":"A way for a group of servers to agree that exactly one of them is “in charge” right now.","w":"Some jobs must have a single coordinator: the database primary, the node assigning work, the scheduler that runs cron jobs. Leader election lets nodes pick one, and pick a new one automatically if the leader dies. It’s typically built on consensus algorithms (Raft, Paxos) or on leases in systems like etcd, ZooKeeper or Consul.","y":"Without it you have either nobody coordinating (work stops) or two coordinators at once (duplicate work, conflicting data). Choosing a leader by hand doesn’t survive 3 a.m. failures.","h":["Don’t write your own consensus; use etcd, ZooKeeper, Consul, or Kubernetes' Lease objects.","The leader holds a lease that expires unless renewed; if it dies, the lease lapses and another node takes over.","Use an odd number of voting nodes (3 or 5) so a majority can always be formed.","Followers should detect a stale leader and refuse its commands, using a term/epoch number or fencing token.","Make leaders step down if they can’t renew their lease (e.g. after a network split).","Design work so a new leader can resume safely (store progress externally)."],"e":"Kubernetes runs several copies of its controller manager, but only one is active. They compete for a Lease object; if the active one dies, another takes the lease within seconds.","p":["Even number of nodes: a 2–2 split has no majority","Old leader keeps acting after losing its lease (needs fencing)","Building homemade election on timestamps from different clocks"],"v":["Failover","Leader election is HOW a new leader is chosen. Failover is the whole process of switching to a backup, which also includes moving traffic, DNS and connections."],"f":["3 nodes, one leader","!Leader stops renewing lease","Majority votes new leader","New leader resumes work"],"q":[["Why use an odd number of nodes?","A majority (quorum) is needed to elect a leader; odd numbers maximize failures tolerated and prevent ties."],["What protects against an old leader that doesn’t know it was replaced?","Term/epoch numbers or fencing tokens; followers and resources reject commands from older terms."],["Name tools that provide leader election.","etcd, ZooKeeper, Consul, Kubernetes Lease API (built on etcd)."],["What is an election term or epoch?","A number that increases with each election. Nodes reject messages from leaders with older terms, preventing stale leaders from acting."],["How does Kubernetes elect a single active controller?","Replicas compete to acquire and renew a Lease object; only the holder acts, and others take over when renewals stop."]],"r":[135,27,96,137],"m":["Leader changes per hour: frequent elections indicate network or resource problems.","Time without a leader: unavailability window during elections."],"k":["A 4-node cluster splits 2–2 during a network partition. What happens to leader election?",["Both halves elect a leader","Neither half has a majority, so no leader can be elected","The node with the lowest ID wins","The old leader stays leader on both sides"],1,"Elections require a majority (3 of 4). A 2–2 split has none, which is why odd cluster sizes are preferred."],"sl":"leader-election"},{"n":32,"c":"dist","t":"CAP Theorem","s":"When the network splits your system in two, you must choose: stay consistent (refuse some requests) or stay available (risk serving old/conflicting data).","w":"C = Consistency: every read sees the latest write. A = Availability: every request gets a non-error answer. P = Partition tolerance: the system keeps working when messages between nodes are lost. Networks DO fail, so P isn’t optional. CAP really says: DURING a partition, pick C or A. When there is no partition you can have both.","y":"It forces honest design: if two data centres lose contact, should both keep accepting bank withdrawals (available, maybe overdraw) or should one side refuse (consistent, some users see errors)? Different features deserve different answers.","h":["For money, inventory, unique usernames: lean CP. Refuse or block writes on the minority side.","For likes, view counts, feeds, shopping carts: lean AP. Accept writes and reconcile later.","Decide per operation, not per company.","Also think about PACELC: Else (no partition), you still trade Latency vs Consistency. Waiting for replicas to agree takes time.","Know your database’s defaults: e.g. Cassandra/DynamoDB are tunable toward AP; Spanner/etcd/ZooKeeper are CP."],"e":"Amazon’s shopping cart (Dynamo paper) chose availability: during failures you can always add items, and conflicting carts are merged later, occasionally bringing back a deleted item. Better than “can’t add to cart”.","p":["Saying “we chose CA” (with a distributed system you can’t opt out of partitions)","Thinking you pick two forever, instead of a choice made during partitions","Applying one choice to every feature"],"v":["Eventual Consistency","CAP describes a trade-off during network splits. Eventual consistency is one specific consistency model that AP systems often use."],"f":["!Network splits DC1 | DC2","Write arrives at DC1","CP: reject, stay correct","AP: accept, reconcile later"],"q":[["What does CAP actually say?","In the presence of a network partition, a distributed system must choose between consistency and availability."],["Why isn’t “CA” a real choice for distributed systems?","Partitions happen regardless; ignoring them doesn’t make them go away, so you must decide behaviour when they occur."],["What does PACELC add?","Even without partitions there’s a trade-off between latency and consistency."],["Give an example of choosing differently per feature in the same app.","A social app keeps likes and feeds available (AP) during partitions but makes username registration or payments consistent (CP)."],["Why does CAP say little about systems without partitions?","Without partitions you can be both consistent and available; then the real trade-off is latency vs consistency (PACELC)."]],"r":[33,93,136,135],"k":["During a network partition, a CP system typically…",["Accepts writes on both sides","Rejects or blocks some requests to avoid inconsistent data","Loses all data","Becomes faster"],1,"Choosing consistency means refusing operations that can’t be safely coordinated while nodes can’t communicate."],"sl":"cap-theorem"},{"n":33,"c":"dist","t":"Eventual Consistency","s":"Copies of the data may disagree for a short while, but if no new updates come in, they will all end up the same.","w":"When you write to one replica, the change spreads to the others in the background. For a moment, different users may see different values. “Eventually” usually means milliseconds to seconds. The opposite is strong consistency, where every read is guaranteed to see the latest write.","y":"Waiting for every copy worldwide to agree before answering makes writes slow and fails when any region is unreachable. Accepting brief disagreement gives speed and availability, which is fine for many features.","h":["Use it where small delays are harmless: like counts, follower counts, search indexes, analytics, recommendations.","Avoid it for balances, stock that must not oversell, and permissions.","Provide read-your-own-writes so a user always sees their own change (read from the leader or a sticky replica).","Plan conflict resolution for concurrent writes: last-write-wins (simple, can lose data), merge logic, or CRDTs (data types that merge automatically).","Design the UI for it: optimistic updates, “processing” states, “may take a minute to appear”."],"e":"After you change your profile photo, a friend in another country may still see the old one for a few seconds. Social networks accept this; your bank doesn’t for balances.","p":["Using it for money or inventory","Users not seeing their own updates and clicking “save” repeatedly","Last-write-wins silently losing edits"],"v":["Strong Consistency","Strong: every read shows the latest write, at the cost of latency/availability. Eventual: reads may be briefly stale, but faster and more available."],"f":["Write to replica A","B and C still old","Background sync","All replicas agree"],"q":[["Give two features where eventual consistency is fine and two where it isn’t.","Fine: like counts, search indexing. Not fine: account balances, seat bookings."],["What is read-your-own-writes consistency?","A guarantee that after you write, your own subsequent reads reflect that write, even if other users see it later."],["What is a CRDT?","Conflict-free replicated data type: a data structure designed so concurrent updates on different replicas can always be merged automatically into the same result."],["What is monotonic read consistency?","A user never sees data go 'back in time': once they’ve seen a newer value, later reads won’t show an older one. Often achieved by sticking a user to one replica."],["How do CRDTs avoid conflicts?","They’re data types (counters, sets) whose merge operation is commutative and idempotent, so replicas always converge regardless of update order."]],"r":[22,30,32,136],"num":"Replica lag 0.5 s, 10M daily reads; if 1% of reads follow a user's own write within 0.5 s:\n100,000 reads/day could show stale data to the writer unless you implement read-your-own-writes.","m":["Replication/propagation lag: how 'eventual' your eventual consistency is.","Conflict resolutions per hour (multi-writer systems): rising conflicts may mean data loss under last-write-wins."],"k":["Which feature is LEAST suited to eventual consistency?",["View counts","Search index updates","Account balance used to approve withdrawals","Recommendations"],2,"Approving withdrawals on a stale balance can overdraw an account. Money decisions need strong consistency."],"sl":"eventual-consistency"},{"n":34,"c":"dist","t":"Distributed Transactions","s":"Making one business action succeed or fail as a whole even though it touches several databases or services.","w":"Inside one database a transaction gives all-or-nothing. But “place order” might touch the orders DB, the payment service and the inventory service. There’s no single database to roll everything back. Options: two-phase commit (2PC), where a coordinator asks everyone “ready?” then “commit”; or sagas, which run local steps and undo them with compensating actions on failure.","y":"Partial success is the nightmare: money taken but no order, or stock reserved but never paid. In microservices this happens whenever one step fails or times out halfway.","h":["First, try to avoid it: keep data that must change together inside one service and one database.","2PC: phase 1 “prepare” (everyone locks and promises), phase 2 “commit”. Gives atomicity but blocks if the coordinator dies, holds locks across the network, and many modern services/APIs don’t support it.","Sagas (usually preferred): sequence of local transactions, each with a compensating action.","Use the transactional outbox to reliably publish “step done” events.","Make every step and compensation idempotent because retries will happen.","Use a workflow engine (Temporal, AWS Step Functions, Camunda) for complex flows."],"e":"Booking a holiday: reserve flight, reserve hotel, charge card. If the charge fails, a saga cancels the hotel and flight reservations rather than relying on one giant lock across three companies.","p":["Calling service A, B and C in sequence with no plan for failure in the middle","Using 2PC across slow external services","Forgetting that compensations can fail too"],"v":["Saga Pattern","2PC tries to make everything commit at once (strong but blocking). A saga accepts in-between states and uses undo steps (flexible, eventually consistent)."],"f":["Reserve stock ✓","Charge card ✓","!Create shipment fails","Compensate: refund + release stock"],"q":[["What are the two phases of 2PC?","Prepare: all participants vote whether they can commit and lock resources. Commit: if all voted yes the coordinator tells everyone to commit, otherwise abort."],["Why is 2PC often avoided in microservices?","It blocks while waiting, holds locks across network calls, has a coordinator failure problem, and many systems don’t support it."],["What’s the best way to avoid distributed transactions?","Design service boundaries so data that must change atomically lives in one service/database."],["What is the 'in-doubt' state in 2PC?","A participant voted yes and locked resources but hasn’t heard commit or abort; it must wait for the coordinator, holding locks."],["How do you keep a DB update and a message publish consistent without 2PC?","Use the transactional outbox: write the message to an outbox table in the same DB transaction, then publish it asynchronously."]],"r":[35,113,125,1],"k":["Why is two-phase commit often avoided between microservices?",["It’s too simple","It blocks with locks held across the network and suffers if the coordinator fails","It doesn’t support atomicity","It requires NoSQL"],1,"2PC holds locks until the coordinator decides; coordinator failure or slow participants block everyone, and many services don’t support it."],"sl":"distributed-transactions"},{"n":35,"c":"dist","t":"Saga Pattern","s":"Break a big multi-service action into small steps, and if a later step fails, run “undo” steps for the earlier ones.","w":"Each step is a local transaction in one service. Each has a compensating action: reserve seat ↔ release seat, charge card ↔ refund. Two styles: choreography (services react to each other’s events, no central boss) and orchestration (one orchestrator tells each service what to do next and handles failures).","y":"It gives reliable multi-service workflows without global locks. You accept that the system passes through in-between states (e.g. “payment pending”) for a while.","h":["List the steps and write a compensation for each one that can be undone.","Put steps that can’t be undone (sending an email, shipping) as late as possible.","Orchestration for complex flows: easier to see, test and change. Choreography for simple ones: fewer moving parts but logic is scattered.","Persist saga state so a crash resumes instead of forgetting.","Make each step and compensation idempotent and retryable.","Handle compensation failure with retries, alerts and manual intervention.","Show intermediate states to users honestly (“order processing”)."],"code":"steps = [\n  (reserve_stock,  release_stock),\n  (charge_payment, refund_payment),\n  (create_shipment, cancel_shipment),\n]\ndone = []\nfor do, undo in steps:\n    try: do(order); done.append(undo)\n    except: \n        for u in reversed(done): u(order)\n        raise","e":"Uber Eats-style flows: accept order → charge customer → restaurant confirms. If the restaurant rejects, the saga refunds the charge and notifies the customer.","p":["Compensations that aren’t true reversals (you can’t un-send an SMS)","No persisted state, so a crash leaves a half-done saga forever","Other users seeing intermediate data and acting on it"],"v":["Two-Phase Commit","2PC: all-or-nothing at one instant, with locks. Saga: step by step with undo actions, no global locks, but temporary inconsistency."],"f":["Step 1 ✓ Step 2 ✓","!Step 3 fails","Undo step 2","Undo step 1"],"q":[["Choreography vs orchestration?","Choreography: services listen to events and decide next steps themselves. Orchestration: a central coordinator directs each step and failure handling."],["What is a compensating transaction?","An action that semantically undoes a previous completed step, like a refund for a charge."],["Why put irreversible steps last?","If an earlier step fails, nothing irreversible has happened yet, so compensation is possible."],["What if a compensating action itself fails?","Retry it with backoff (it must be idempotent), persist saga state so it resumes, and alert for manual intervention if it keeps failing."],["Why are intermediate states visible in sagas, and how do you handle it?","Each step co
