u use spot instances?","For interruptible, fault-tolerant work like batch jobs, CI runners and stateless workers."],["Why can data transfer be a hidden cost?","Cloud providers charge for egress and cross-region/zone traffic, which grows with chatty architectures."],["Why tag every cloud resource?","Without tags you can’t tell which team or service creates which cost, so nobody owns optimization."],["Give an example of a cost cut that hurts reliability.","Removing replicas or multi-AZ redundancy saves money but turns single failures into outages."]],"r":[81,83,87,100],"num":"Server averaging 8% CPU on an 8-vCPU instance.\nDownsize to 2 vCPU: ~32% average, ~75% cost reduction for that instance.\nLogs: 2 TB/day at ~$0.50/GB ingestion ≈ $1,000/day; sampling DEBUG logs can cut this sharply.","m":["Cost per service/team/environment (via tags).","Cost per business unit of work, e.g. cost per 1,000 orders.","Idle resource reports: unattached disks, idle instances, old snapshots."],"k":["Which workload fits spot/preemptible instances best?",["The primary database","Stateless batch jobs that can be interrupted and retried","A single critical payment server","DNS servers"],1,"Spot capacity can be reclaimed with little notice, so it suits fault-tolerant, restartable work."],"sl":"cost-optimization"},{"n":87,"c":"scale","t":"Cold Starts","s":"The extra delay when a serverless function or new container has to boot up before it can handle the first request.","w":"Serverless platforms (Lambda, Cloud Functions, Cloud Run) scale to zero when idle. The next request must wait while the platform creates an environment, downloads your code, starts the runtime (JVM, Node, Python) and runs your initialization (DB connections, loading config). That can take from ~100 ms to several seconds. Later requests reuse the “warm” instance.","y":"Users notice when an occasional request takes 3 seconds instead of 50 ms. It especially hurts low-traffic APIs, user-facing endpoints and traffic spikes that need many new instances at once.","h":["Keep deployment packages small; remove unused dependencies.","Choose fast-starting runtimes (Node, Go, Python, Rust) or use JVM tricks (SnapStart, GraalVM native images).","Do expensive init lazily or reuse it across invocations (create clients outside the handler).","Use provisioned concurrency / minimum instances for latency-critical endpoints (costs money).","Avoid unnecessary VPC attachments on older setups.","Measure cold start frequency and duration; it may affect only 1% of requests.","If constant low latency matters more than scale-to-zero savings, use always-on containers."],"code":"# created once per instance (reused while warm)\ndb = connect()\ndef handler(event, ctx):\n    return db.query(...)   # warm calls skip the connect","e":"A Java Spring app on Lambda had 6-second cold starts. Enabling SnapStart (restoring from a snapshot of an initialized runtime) cut it to under a second.","p":["Initializing heavy clients inside the handler on every call","Huge bundles with every dependency","Pinging functions every few minutes instead of using proper provisioned concurrency"],"v":["Latency","Latency is the total time of a request. A cold start is one specific CAUSE of extra latency, only on requests that hit a new instance."],"f":["Request arrives, no warm instance","!Boot runtime + init (~1–3 s)","Handle request","Next requests warm (~20 ms)"],"q":[["What causes a cold start?","A request arriving when no initialized instance exists, forcing the platform to create one and run initialization."],["How can you reduce cold start time?","Smaller packages, faster runtimes, lazy or reused initialization, snapshotting (SnapStart), and provisioned/minimum instances."],["Why initialize clients outside the handler?","They’re created once per instance and reused across warm invocations."],["What is provisioned concurrency?","Pre-initialized function instances kept warm (for a cost) so requests don’t hit cold starts."],["How do you measure cold start impact?","Track init duration and the fraction of invocations that are cold, then look at how they affect p99 latency."]],"r":[88,75,89,81],"k":["Where should you create a database client in a serverless function to reduce cold-start and per-call cost?",["Inside the handler on every call","Outside the handler, so warm invocations reuse it","In a separate function","Never use databases"],1,"Code outside the handler runs once per instance; warm invocations then reuse the client."],"sl":"cold-starts"},{"n":88,"c":"scale","t":"Serverless Limits","s":"Serverless functions come with hard limits on running time, memory, payload size and concurrency that you must design around.","w":"Examples (typical, vary by provider): AWS Lambda max 15 minutes per run, up to 10 GB memory, synchronous payloads around 6 MB, an account-level concurrency limit (often 1,000 by default), temporary disk limits. API gateways in front add their own timeouts (often ~30 s). These aren’t bugs; they’re the contract.","y":"A video processing job that takes 20 minutes, a 50 MB upload, or a spike needing 5,000 concurrent functions will simply fail. Unlimited auto-scaling can also crush a database that allows only 100 connections.","h":["Check the current limits in your provider’s docs before designing.","Split long jobs into steps with a workflow engine (Step Functions, Workflows) or use containers/batch for long tasks.","For big files, upload directly to object storage with pre-signed URLs; pass references, not bytes.","Set reserved/maximum concurrency per function to protect downstream databases.","Put a queue between spiky traffic and functions to smooth bursts.","Use connection proxies (RDS Proxy) or HTTP-based databases.","Load-test realistic peaks and watch throttling metrics.","Know the cost curve: at very high steady load, containers may be cheaper."],"e":"A team’s Lambda image processor scaled to 3,000 concurrent executions during a marketing push, each opening a DB connection. Postgres maxed out and crashed. Reserved concurrency of 50 plus a queue fixed it.","p":["Assuming \"serverless = infinite\"","Uploading big files through the function","Unbounded concurrency hammering a database","Gateway timeout shorter than function timeout"],"v":["Cold Starts","Cold starts are about STARTUP delay. Serverless limits are hard CAPS on duration, size and concurrency. A function can be warm and still hit a limit."],"f":["20-min job requested","!Exceeds 15-min limit","Split into steps via workflow","Each step within limits"],"q":[["How do you handle file uploads larger than the function payload limit?","Have clients upload directly to object storage using pre-signed URLs, then process the stored file by reference."],["Why limit function concurrency?","To protect downstream systems like databases from being overwhelmed by massive parallel scaling."],["What do you do with tasks longer than the max execution time?","Break them into steps orchestrated by a workflow engine, or run them on containers/batch services."],["How can serverless functions overload a database?","Concurrency scales to thousands of instances, each opening connections; use reserved concurrency limits, queues and connection proxies."],["What do you do with a job longer than the maximum function duration?","Split it into steps with a workflow engine or run it on containers/batch compute."]],"r":[87,144,36,4],"k":["A Lambda function processes uploads larger than the request payload limit. Best design?",["Raise the limit in code","Upload directly to object storage with a presigned URL, then process by reference","Split files in the browser","Use a bigger function"],1,"Pass references, not bytes: clients upload to S3 directly and the function reads the object."],"sl":"serverless-limits"},{"n":89,"c":"scale","t":"Latency","s":"How long one request takes, from the user’s action until they get a result.","w":"Latency is measured in milliseconds per operation. It adds up across the whole path: DNS lookup, TCP/TLS handshake, network travel, load balancer, app code, database queries, external APIs, and rendering on the device. Useful reference numbers: memory access ~100 ns, SSD read ~100 µs, same-datacenter round trip ~0.5 ms, India to US round trip ~200+ ms.","y":"Users feel latency directly. Studies by Amazon and Google linked even 100 ms delays to fewer sales and searches. A backend that handles huge volume but takes 3 s per page still feels broken.","h":["Measure end to end and per hop (tracing shows where the time goes).","Look at percentiles (p50, p95, p99), not just the average.","Reduce round trips: batch queries, fix N+1, combine API calls.","Do independent calls in parallel instead of one after another.","Cache hot data and move content closer to users (CDN, edge, regional deployments).","Keep connections warm (keep-alive, connection pooling) to avoid repeated handshakes.","Move slow non-essential work to background queues.","Optimize payloads: compress, paginate, send only needed fields."],"code":"# serial: 120 + 80 + 100 = 300 ms\na = get_user(); b = get_orders(); c = get_reco()\n# parallel: max(120, 80, 100) = 120 ms\na, b, c = await gather(get_user(), get_orders(), get_reco())","e":"Amazon famously found that every 100 ms of extra latency cost about 1% in sales, which is why its pages are aggressively optimized and cached.","p":["Only watching averages","Serial calls that could be parallel","Ignoring network distance by putting the DB in another region from the app"],"v":["Throughput","Latency = how LONG one request takes. Throughput = how MANY requests per second you handle. Improving one doesn’t automatically improve the other."],"f":["User taps","Network + TLS","App + DB + APIs","Result shown: total = latency"],"q":[["Why use percentiles instead of averages for latency?","Averages hide slow outliers; percentiles show what the slowest users actually experience."],["Name three ways to reduce latency.","Parallelize independent calls, cache/move data closer to users, and reduce round trips (batching, fixing N+1)."],["Why does geography matter?","Signals are limited by the speed of light; cross-continent round trips add hundreds of milliseconds."],["Why can a fast server still give users slow pages?","Network distance, many sequential round trips, large payloads and slow client rendering add latency outside the server."],["What latency numbers should every engineer know roughly?","Memory ~100 ns, SSD read ~100 µs, same-datacenter round trip ~0.5 ms, cross-continent round trip ~100–250 ms."]],"r":[90,91,92,84],"num":"Serial calls: 120 + 80 + 100 ms = 300 ms.\nParallel calls: max(120, 80, 100) = 120 ms.\nSpeed of light in fiber ≈ 200,000 km/s → Mumbai–London (~7,200 km) ≈ 36 ms one way minimum, ~72 ms round trip before any processing.","m":["Latency percentiles (p50/p95/p99) per endpoint.","Latency breakdown per dependency from traces.","Client-side (real user) latency including network and rendering."],"k":["Three independent backend calls take 100 ms, 150 ms and 200 ms. Fastest total if done in parallel?",["450 ms","200 ms","150 ms","100 ms"],1,"In parallel you wait for the slowest one: 200 ms. Serially it would be 450 ms."],"sl":"latency"},{"n":90,"c":"scale","t":"Throughput","s":"How much work your system finishes per unit of time, like requests per second or orders per minute.","w":"If a checkout service completes 2,000 orders per second, that’s its throughput. It’s limited by the bottleneck: the slowest component in the path (CPU, DB writes, a lock, an external API’s rate limit). Little’s Law connects things: concurrent requests = throughput × latency. So 1,000 req/s at 0.2 s each means about 200 requests in progress at any moment.","y":"Big events (sales, launches, IPL finals) need a known capacity. If your throughput tops out at 500 req/s and 2,000 arrive, queues grow, latency explodes and requests fail.","h":["Load test (k6, Locust, Gatling, JMeter) to find maximum sustainable throughput.","Find the bottleneck: watch CPU, DB, connection pools, locks, queue depth during the test.","Increase parallelism: more instances, more workers, async IO.","Batch work: insert 1,000 rows in one statement instead of 1,000 statements.","Remove contention: hot rows, global locks, single-threaded parts.","Use queues to accept bursts and process at steady throughput.","Remember throughput beyond a point increases latency sharply (queues form near 100% utilization). Keep headroom."],"e":"During Flipkart’s Big Billion Days, teams load-test months ahead to make sure order throughput can handle many times normal peak.","p":["Testing with unrealistic data or traffic patterns","Running systems near 100% utilization","Scaling app servers while a single DB lock limits throughput"],"v":["Latency","Throughput = volume per second. Latency = time per request. Little’s Law links them: in-flight requests = throughput × latency."],"f":["Requests arrive","Pass through components","!Bottleneck caps rate","Fix bottleneck → higher req/s"],"q":[["What is Little’s Law?","L = λ × W: average items in the system equals arrival rate times average time in the system."],["What determines a system’s maximum throughput?","Its bottleneck: the most constrained resource in the request path."],["Why not run systems at 100% utilization?","Queueing delay grows rapidly as utilization approaches 100%, making latency explode."],["Why does latency explode near 100% utilization?","Queueing theory: as utilization approaches 100%, waiting time grows very sharply because any burst has nowhere to go."],["How do you find the throughput ceiling?","Load test with increasing traffic and watch where latency or errors rise sharply and which resource saturates first."]],"r":[89,40,82,142],"num":"Little's Law: in-flight = throughput × latency.\n1,000 req/s × 0.2 s = 200 concurrent requests.\nIf latency doubles to 0.4 s at the same traffic → 400 concurrent → thread pools and connection pools must be larger or requests queue.","m":["Requests per second (or jobs/s) completed.","Saturation of the bottleneck resource (CPU, DB, locks).","Queue length in front of the bottleneck."],"k":["A service handles 500 req/s with 100 ms average latency. Roughly how many requests are in progress at once?",["5","50","500","5,000"],1,"Little’s Law: 500 × 0.1 = 50 concurrent requests."],"sl":"throughput"},{"n":91,"c":"scale","t":"P99 Latency","s":"The time within which 99% of requests finish. The slowest 1% take longer.","w":"Sort a minute’s worth of request times from fastest to slowest. p50 (median) is the middle one. p99 is the value 99% of the way up the list. If p99 = 800 ms, 1 in 100 requests takes 800 ms or more. Related: p95, p99.9 (“three nines” tail).","y":"Averages lie. An average of 100 ms can hide a p99 of 3 seconds. And a single page load often makes dozens of requests, so most users hit that slow 1% at least once per session. Heavy users (often your best customers) hit it most.","h":["Record latencies in histograms (Prometheus histograms, HdrHistogram, OpenTelemetry), not averages.","Don’t average percentiles across servers; aggregate the histograms instead.","Set SLOs on p95/p99, e.g. “99% of checkout requests under 500 ms”.","When p99 is high, look for causes that affect a few requests: GC pauses, cold caches, lock contention, noisy neighbours, slow dependencies, large customers with huge data.","Look at traces of the slowest requests specifically.","Use enough data: p99 of 20 requests is meaningless."],"code":"histogram_quantile(0.99,\n  sum(rate(http_request_duration_seconds_bucket[5m])) by (le))","e":"Amazon measures p99.9 for many services, because their biggest customers, with the most data, tend to experience the slowest requests.","p":["Averaging p99s from multiple servers","Showing only mean latency on dashboards","Calculating percentiles over too few samples"],"v":["Average Latency","Average mixes everything and hides outliers. P99 shows the experience of your slowest 1%, which is what users complain about."],"f":["Collect request times","Sort fast → slow","Take 99th percentile","Alert when it crosses SLO"],"q":[["Why can’t you average p99 values from several servers?","Percentiles aren’t additive; you must combine the underlying distributions (histograms) and compute the percentile from them."],["Why does p99 matter even though it’s only 1%?","Pages make many requests, so most users encounter at least one slow request; and heavy users hit tails more."],["Name common causes of high p99.","GC pauses, lock contention, cache misses, slow dependencies, queueing and large data for specific users."],["Why can’t you average p99 values across servers?","Percentiles aren’t additive. You must merge the underlying histograms and compute the percentile from the combined data."],["How do you investigate high p99?","Look at traces of the slowest requests, correlate with GC pauses, lock waits, cache misses, specific customers or endpoints."]],"r":[92,89,107,103],"num":"1,000 requests sorted by time: p50 = the 500th, p99 = the 990th.\nPage making 30 requests, each with 1% chance of being slow:\nP(at least one slow) = 1 − 0.99³⁰ ≈ 26% of page loads.","m":["p50, p95, p99 (and p99.9 for critical paths) from histograms.","Request count behind each percentile, so small samples aren’t over-trusted."],"k":["Average latency is 80 ms but p99 is 2.5 s. What does that tell you?",["Everything is fine","About 1 in 100 requests is very slow, hidden by the average","The average is miscalculated","The server is down"],1,"Averages hide the tail. A big gap between mean and p99 means some users regularly see slow responses."],"sl":"p99-latency"},{"n":92,"c":"scale","t":"Tail Latency","s":"The slow end of response times, which gets dramatically worse when one request depends on many backend calls.","w":"If a request fans out to 100 servers and must wait for all of them, its speed equals the SLOWEST of the 100. Even if each server is slow only 1% of the time, the chance that at least one of 100 is slow is about 63%. Tail latency is about controlling these rare slow responses.","y":"Large systems (search, feeds, microservices) fan out a lot. Rare slowness at each step becomes common slowness for the user.","h":["Reduce fan-out: fewer dependencies per request, aggregate data in advance.","Set tight timeouts per call and return partial results when sensible (show the page without recommendations).","Hedged requests: if a reply is slower than the p95, send a duplicate to another replica and use whichever answers first (only for idempotent reads, with a budget).","Remove sources of variance: GC tuning, avoid noisy neighbours, warm caches, background jobs off hot servers.","Use load balancing that avoids slow or overloaded instances (least-outstanding requests).","Track p99 and p99.9 per dependency."],"e":"Google’s paper “The Tail at Scale” showed that hedged requests to a second replica after a short delay cut the 99.9th percentile latency dramatically with only a few percent extra load.","p":["Waiting for every dependency even when some are optional","Hedging everything and doubling load","Optimizing averages while tails stay terrible"],"v":["P99 Latency","Tail latency is the general PROBLEM of slow outliers. P99 is one METRIC to measure it."],"f":["Request fans out to 100","!One replica slow","Whole request waits","Fix: timeouts, hedging, partial results"],"q":[["Why does fan-out amplify tail latency?","The request waits for the slowest call; with many calls, the probability that at least one is slow becomes high."],["What is a hedged request?","Sending a backup copy of a slow request to another replica after a delay and using the first response."],["How can partial results help?","If optional parts are slow, return the page without them rather than making everyone wait."],["When is a hedged request unsafe?","For non-idempotent operations (like payments), where sending a duplicate could execute twice."],["How do partial results reduce tail latency?","If optional parts don’t respond in time, return the page without them instead of waiting."]],"r":[91,10,89,112],"num":"Request fans out to 100 backends; each is slow 1% of the time.\nP(at least one slow) = 1 − 0.99¹⁰⁰ ≈ 63%.\nHedging after p95: extra load ≈ 5% of requests, but tail latency drops sharply.","k":["Why does fanning out to many backends make tail latency worse?",["Backends get slower when called in parallel","The request waits for the slowest backend, and with many calls a rare slow one becomes likely","Network bandwidth drops","Parallel calls are not allowed"],1,"The response time is the max of all calls; more calls means a higher chance at least one hits its slow tail."],"sl":"tail-latency"},{"n":93,"c":"dist","t":"Network Partitions","s":"When parts of your system are running fine but can’t talk to each other because the network between them failed.","w":"A switch fails, a cable is cut, a cloud zone loses connectivity, or a firewall change blocks traffic. Both sides are alive, but each thinks the other is dead. The tricky part: a slow network looks exactly like a dead server. You can’t tell the difference from the outside.","y":"If both sides keep acting alone, you can get two leaders, double-booked inventory or conflicting writes (split-brain). If both stop, you get an outage. You must decide in advance which happens.","h":["Assume partitions WILL happen; test them (chaos tools, iptables rules, Toxiproxy).","Use timeouts; never wait forever on another node.","Use quorum/majority rules: only the side with a majority of nodes may elect a leader or accept writes.","Use fencing tokens so a node cut off from the cluster can’t keep writing.","Decide per feature: refuse (consistency) or accept and reconcile later (availability).","Plan the healing: how do conflicting changes get merged when the partition ends?"],"e":"In 2012, a network issue at GitHub caused their MySQL cluster’s failover tooling to promote replicas incorrectly, leading to data inconsistency and a long cleanup.","p":["Treating a timeout as proof the other node is dead","Two-node clusters with no tie-breaker","No plan for reconciling data after healing"],"v":["CAP Theorem","A partition is the FAILURE itself. CAP is the THEORY of what you must choose (consistency or availability) while it lasts."],"f":["Nodes A, B | C","!Link between them cut","Majority side (A,B) continues","Minority (C) stops writes"],"q":[["Why can’t a node distinguish a partition from a crash?","In both cases it just stops receiving replies; slow, dead and unreachable look the same."],["How do quorums handle partitions?","Only the side with a majority may make decisions, so at most one side can act."],["What is split-brain?","Two parts of a cluster each believing they’re in charge and accepting conflicting changes."],["How do you test partition handling?","Inject network failures between nodes (iptables, Toxiproxy, chaos tools) in staging and verify behaviour and recovery."],["What should happen to the minority side of a partition in a CP system?","It stops accepting writes (and possibly reads) until it can reach the majority again."]],"r":[32,136,31,96],"k":["Why can’t a node reliably tell whether another node crashed or is just unreachable?",["Because of encryption","Both look identical from outside: no replies arrive","Because clocks differ","Because of DNS"],1,"Silence could mean crash, slowness or a broken network path, which is why systems use timeouts and quorums."],"sl":"network-partitions"},{"n":94,"c":"dist","t":"Clock Skew","s":"Different machines' clocks show slightly different times, so timestamps from different servers can’t be fully trusted for ordering.","w":"Every server’s clock drifts. NTP keeps them close, typically within milliseconds, but sometimes much worse (VM pauses, misconfigured NTP, leap seconds). If server A’s clock is 2 seconds ahead of B’s, an event on A can look like it happened after a later event on B.","y":"Clock skew breaks “last write wins” (the newest change might lose), makes JWTs appear expired or not-yet-valid, confuses log timelines during incidents, and breaks distributed locks that rely on time.","h":["Run NTP (chrony) everywhere and monitor clock offset.","Allow small leeway when validating time-based tokens (e.g. 30–60 s for exp/nbf).","Don’t use wall-clock timestamps to order events across machines. Use sequence numbers from a single source, version numbers, logical clocks (Lamport) or vector clocks.","Use monotonic clocks to measure durations inside one machine (they never jump backwards).","Store timestamps in UTC.","For strong global ordering, systems like Google Spanner use TrueTime, with GPS/atomic clocks and explicit uncertainty intervals."],"code":"# measuring duration: use monotonic, not wall clock\nstart = time.monotonic()\ndo_work()\nelapsed = time.monotonic() - start","e":"A leap second in 2012 made Linux servers' clocks misbehave; Reddit, LinkedIn and others had outages as Java processes spun CPUs at 100%.","p":["Last-write-wins using timestamps from different servers","Measuring timeouts with the wall clock (it can jump)","Zero tolerance on token expiry checks"],"v":["Distributed Tracing","Traces show timing per span, but cross-machine timestamps can be skewed. Traces rely on parent/child links (not clock order) to show causality."],"f":["A writes at 10:00:02 (fast clock)","B writes later at 10:00:01","!Last-write-wins keeps A (wrong)","Fix: version numbers / logical clocks"],"q":[["Why is last-write-wins dangerous with clock skew?","The write with the higher timestamp wins, but a fast clock can make an older write look newer, discarding the real latest update."],["Monotonic vs wall clock?","Wall clock shows calendar time and can jump; monotonic only moves forward and is right for measuring durations."],["What is a Lamport clock?","A logical counter incremented on events and updated on messages, giving an ordering consistent with causality without real time."],["Why give JWT validation some clock leeway?","Small clock differences between servers could otherwise reject valid tokens as expired or not yet valid."],["What are vector clocks used for?","Tracking causality between versions in distributed systems to detect concurrent conflicting updates."]],"r":[93,47,102,115],"k":["Which clock should you use to measure how long an operation took?",["The wall clock","A monotonic clock","The database server’s clock","NTP time"],1,"Wall clocks can jump (NTP corrections, DST); monotonic clocks only move forward, so durations are reliable."],"sl":"clock-skew"},{"n":95,"c":"rel","t":"Multi-Region Deployment","s":"Running your system in more than one geographic region, for lower latency worldwide and survival of a whole-region outage.","w":"A region is a cluster of data centres in one area (e.g. Mumbai, Singapore, Virginia). Single-region setups go down if that region has a major outage. Multi-region options: active-passive (one region serves, another is on standby) or active-active (all regions serve traffic). The hard part is always the data.","y":"Whole regions do fail occasionally. Global users far from your one region get slow responses. Some laws require data to stay in a country (data residency).","h":["Start with multi-AZ (zones within one region); it covers most failures cheaply.","Decide your targets (RTO/RPO) before choosing a design.","Active-passive: replicate data asynchronously to standby, practice failover. Simpler; small data loss possible.","Active-active: route users to the nearest region (latency-based DNS, anycast); handle write conflicts (single-writer per user/home region, or databases built for it like Spanner, CockroachDB, DynamoDB Global Tables).","Pin each user’s data to a home region to avoid cross-region writes.","Replicate everything needed: images, configs, secrets, queues, not just the DB.","Run failover drills regularly.","Consider data residency rules."],"e":"During a major AWS us-east-1 outage, companies running only in that region were down for hours, while multi-region companies shifted traffic and stayed mostly up.","p":["Hidden single-region dependencies (auth, DNS, a config service)","Never testing failover","Active-active writes without a conflict strategy"],"v":["Failover","Multi-region is the SETUP (resources in many regions). Failover is the ACTION of moving traffic when one fails. Having regions doesn’t guarantee failover works."],"f":["Users routed to nearest region","Data replicated across regions","!Region outage","Traffic shifts to healthy region"],"q":[["Active-active vs active-passive?","Active-active serves traffic from all regions simultaneously; active-passive keeps a standby region that takes over on failure."],["What’s the hardest part of multi-region?","Data: replication lag, write conflicts and consistency across regions."],["Why do multi-AZ before multi-region?","It covers common failures with much less complexity and cost."],["What is a 'home region' strategy?","Each user’s data has one primary region where their writes go, avoiding cross-region write conflicts."],["What hidden single-region dependencies often break multi-region failover?","Central auth, configuration services, DNS management, secrets stores or a CI/CD system located only in one region."]],"r":[96,30,33,60],"num":"Single region with 99.9% availability ≈ 8.8 h down/year.\nTwo independent regions, failover works: unavailable only if both down ≈ much less (in theory 1 − (0.001²)), but failover time and shared dependencies dominate in reality.\nCross-region replication lag of 1 s at 2,000 writes/s → up to ~2,000 writes at risk on sudden region loss (async).","k":["What is usually the hardest part of an active-active multi-region design?",["DNS routing","Handling data consistency and write conflicts across regions","TLS certificates","Container images"],1,"Serving traffic from many regions is easy; keeping writes consistent across regions with lag is hard."],"sl":"multi-region-deployment"},{"n":96,"c":"rel","t":"Failover","s":"Automatically or manually switching to a backup component when the main one fails.","w":"Primary database dies → a replica is promoted. Load balancer node fails → the standby takes its IP. Region goes down → DNS points users to another region. Failover involves detecting the failure, choosing the replacement, redirecting traffic, and later restoring redundancy.","y":"Without failover, one component’s failure becomes a full outage until a human wakes up and fixes it.","h":["Define RTO (how long you can be down) and RPO (how much data you can lose); they decide your design.","Use health checks with sensible thresholds to detect failure.","Automate failover where possible (managed DBs like RDS Multi-AZ, Patroni for Postgres), but avoid flapping.","Prevent split-brain: fence the old primary so it can’t accept writes if it comes back.","Make clients reconnect: DNS TTLs, connection retry logic, stable endpoints.","Test failover regularly in production-like environments; untested failover usually fails.","After failover, restore redundancy quickly; you’re now running without a spare."],"e":"Amazon RDS Multi-AZ promotes the standby within about a minute or two and updates the DNS endpoint; apps that retry connections recover automatically.","p":["Apps caching the old DB IP forever","Automatic failover on brief blips, causing more downtime than the blip","The old primary waking up and accepting writes"],"v":["Backups","Failover keeps the service RUNNING using a live standby. Backups RESTORE data after corruption or deletion. Failover won’t save you from DELETE FROM users, because the standby copies it."],"f":["Primary healthy","!Primary fails health checks","Promote replica, fence old","Clients reconnect to new primary"],"q":[["What are RTO and RPO?","RTO: maximum acceptable downtime. RPO: maximum acceptable data loss, measured in time."],["What is fencing in failover?","Ensuring the old primary can’t accept writes after a new one is promoted, e.g. by cutting its access or using tokens."],["Why must failover be tested?","Configurations drift and assumptions break; untested failover often fails when it’s needed most."],["Why can automatic failover cause more harm than good?","Brief network blips can trigger unnecessary failovers, causing downtime or split-brain. Use sensible thresholds and fencing."],["What should you do immediately after a failover?","Restore redundancy (new standby), verify data integrity and investigate the original failure."]],"r":[97,95,31,155],"num":"RTO 5 minutes, RPO 0: needs automatic failover + synchronous replication.\nRTO 4 hours, RPO 24 hours: nightly backups + manual restore may be enough.","m":["Time to detect failure and time to complete failover during drills.","Data lost during failover tests (RPO achieved).","Replication health of standbys before you need them."],"k":["An application keeps connecting to the old database IP after failover. What is the likely cause?",["The new primary is down","The app caches the old IP or connection and doesn’t reconnect via the endpoint name","Replication is synchronous","The backup failed"],1,"Clients must reconnect through a stable endpoint (DNS name) and not hold connections or IPs forever."],"sl":"failover"},{"n":97,"c":"rel","t":"Backups","s":"Separate, saved copies of your data from different points in time that you can restore after loss, corruption or deletion.","w":"Types: full (everything), incremental (changes since the last backup), and continuous / point-in-time recovery (base backup + transaction logs, so you can restore to e.g. 14:32:10 yesterday, just before the bad command). Backups should be stored separately from production: another account, another region.","y":"Replication instantly copies mistakes and ransomware encryption to replicas. Only backups let you go back in time. Data loss can end a company.","h":["Follow 3-2-1: 3 copies, on 2 different media/services, 1 off-site (another region or account).","Automate backups and enable point-in-time recovery for databases.","Encrypt backups and restrict who can delete them; use immutable/locked backups (object lock) against ransomware.","TEST RESTORES regularly. A backup you’ve never restored is a hope, not a backup.","Measure how long a restore takes; that’s part of your RTO.","Back up more than databases: object storage, configs, secrets, infrastructure code.","Set retention that meets business and legal needs."],"e":"In 2017 GitLab accidentally deleted a production database directory and found that several of its backup methods weren’t working. They recovered from a 6-hour-old snapshot taken almost by luck, and lost hours of data.","p":["Never testing restores","Backups in the same account an attacker can delete","Assuming replicas are backups","Unknown restore time"],"v":["Replication","Replication = a live copy that follows every change, including mistakes. Backup = a frozen copy from the past you can return to."],"f":["Nightly base backup + logs","Copied to separate account","!Bad DELETE at 14:32","Restore to 14:31 point in time"],"q":[["What is the 3-2-1 backup rule?","Keep 3 copies of data on 2 different storage types, with 1 copy off-site."],["Why are replicas not backups?","They replicate every change, including accidental deletes and corruption, almost instantly."],["What is point-in-time recovery?","Restoring a database to any specific moment by replaying transaction logs on top of a base backup."],["How do immutable backups protect against ransomware?","Object lock/WORM storage prevents deletion or modification for a retention period, even by compromised admin credentials."],["Why include encryption keys in backup planning?","Encrypted backups are useless if the key is lost or stored only in the system you’re recovering."]],"r":[98,30,50,121],"num":"DB 2 TB, restore speed ~200 MB/s → about 2.8 hours just to copy data.\nPlus WAL replay and verification: your realistic RTO might be 4+ hours. Test it.","m":["Last successful backup time and size per system.","Restore test results and duration.","Backup storage access logs (deletion attempts)."],"k":["Which statement about backups is true?",["A read replica is a backup","A backup you’ve never restored is unproven","Backups only need to cover the database","Backups should live in the same account as production"],1,"Restores fail for many reasons (corruption, missing keys, wrong scripts). Only regular restore tests prove backups work."],"sl":"backups"},{"n":98,"c":"rel","t":"Disaster Recovery","s":"A practiced plan for bringing your whole system back after a major failure: region outage, data corruption, ransomware or human error.","w":"Disaster recovery (DR) combines technology (backups, replicas, infrastructure as code) and process (runbooks, roles, communication). Common strategies by cost and speed: backup & restore (cheapest, slowest), pilot light (core data replicated, rest built on demand), warm standby (scaled-down copy running), and multi-site active-active (fastest, most expensive).","y":"In a real disaster, people panic, documentation is missing, and things take 10× longer than expected. Planning and rehearsal turn days of chaos into hours of procedure.","h":["Set RTO and RPO per system based on business impact.","Choose a DR strategy that meets them at acceptable cost.","Write runbooks: step-by-step recovery instructions anyone on call can follow.","Map dependencies: DNS, identity provider, secrets, third-party APIs; DR fails if any is missing.","Keep infrastructure as code so environments can be rebuilt.","Store backups and credentials where a disaster (or attacker) in the main account can’t reach them.","Run DR drills (game days) at least yearly; fix what breaks.","Plan communication: status page, customers, internal roles."],"e":"After a fire destroyed an OVHcloud data centre in Strasbourg in 2021, customers with off-site backups recovered; some with backups stored in the same building lost data permanently.","p":["Backups in the same location as production","A runbook that’s never been executed","Forgetting dependencies like DNS or SSO"],"v":["Backups","Backups are one INGREDIENT. Disaster recovery is the full RECIPE: infrastructure, people, runbooks, dependencies, targets and practice."],"f":["!Disaster declared","Follow runbook, assign roles","Rebuild infra + restore data","Verify, switch traffic, communicate"],"q":[["Name four DR strategies from cheapest to fastest.","Backup & restore, pilot light, warm standby, multi-site active-active."],["What is a DR drill?","A planned exercise simulating a disaster to test recovery procedures and find gaps."],["Why map dependencies in DR planning?","Recovery fails if a required service (DNS, identity, secrets, third-party API) is unavailable or forgotten."],["What does a good DR runbook include?","Triggers for declaring a disaster, roles, step-by-step recovery commands, dependency order, verification checks and communication templates."],["Why run DR drills?","Plans decay as systems change; drills reveal missing steps, permissions and dependencies before a real disaster."]],"r":[97,96,99,109],"k":["Which strategy has the fastest recovery but highest cost?",["Backup and restore","Pilot light","Warm standby","Multi-site active-active"],3,"Active-active already serves traffic in multiple sites, so recovery is nearly instant, at roughly double the infrastructure."],"sl":"disaster-recovery"},{"n":99,"c":"rel","t":"Chaos Engineering","s":"Deliberately causing small, controlled failures to prove your system handles them before real failures surprise you.","w":"You form a hypothesis (“if one payment pod dies, checkout success stays above 99.5%”), inject a failure (kill a pod, add 300 ms latency, block a dependency, fill a disk), and observe. If the hypothesis fails, you’ve found a weakness safely. Tools: Chaos Monkey, Gremlin, LitmusChaos, AWS Fault Injection Service, Chaos Mesh.","y":"Retries, timeouts, failover and fallbacks are often never exercised until a real outage, and that’s when you discover they don’t work.","h":["Start with good monitoring; you can’t run experiments you can’t observe.","Define steady state (normal metrics) and a clear hypothesis.","Start small: one instance, in staging, during work hours with the team watching.","Limit blast radius and have an abort button / stop conditions.","Gradually move to production with tiny scope once confident.","Fix findings and turn experiments into regular automated tests.","Run game days where teams practice incident response too."],"e":"Netflix’s Chaos Monkey randomly terminates production instances during business hours, forcing every service to tolerate instance loss. When AWS had major outages, Netflix often stayed up.","p":["Running chaos without monitoring or an abort plan","Starting with huge production experiments","Finding problems and never fixing them"],"v":["Disaster Recovery","DR plans how to RECOVER after a big failure. Chaos engineering TESTS resilience proactively with small failures, often revealing gaps in DR plans."],"f":["Hypothesis: survive pod loss","Inject failure (small scope)","Observe metrics","Weakness found → fix"],"q":[["What are the steps of a chaos experiment?","Define steady state, form a hypothesis, inject a controlled failure, observe, then fix and repeat."],["What is blast radius?","How much of the system or user base an experiment can affect; keep it small at first."],["Why run chaos in production at all?","Production has real traffic, configs and dependencies that staging can’t fully reproduce."],["Give three example chaos experiments.","Kill a random instance, add 300 ms latency to a dependency, make a dependency return errors; then check SLOs hold."],["What happens after a chaos experiment finds a weakness?","Fix it, then automate the experiment so the weakness can’t silently return."]],"r":[98,13,96,112],"k":["What should you have before running chaos experiments in production?",["Nothing","Good monitoring, a hypothesis, small blast radius and a way to abort","Only a staging environment","A new database"],1,"Without observability and stop conditions, a chaos experiment is just causing an outage."],"sl":"chaos-engineering"},{"n":100,"c":"obs","t":"Logging","s":"Recording what your application does (events, errors, important actions) so you can figure out what happened later.","w":"Logs are timestamped records like \"payment failed for order 42: card declined\". Modern systems use structured logs (JSON with fields) shipped to a central place (ELK/OpenSearch, Loki, Datadog, Cloud Logging) where you can search across all servers. Levels (DEBUG, INFO, WARN, ERROR) control detail.","y":"When a user says \"my payment failed at 3:14 PM\", logs are how you find out why. Without central, structured logs you’re SSH-ing into servers grepping text files.","h":["Log in structured JSON with consistent field names.","Include context: request/correlation ID, user ID (not personal details), route, duration, error type.","Use levels properly: ERROR = needs attention; INFO = important business events; DEBUG = off in production by default.","Log errors once, with the stack trace, at the boundary where they’re handled.","Never log passwords, tokens, card numbers or full personal data; add automatic redaction.","Centralize logs and set retention periods (cost!).","Sample high-volume noisy logs."],"code":"{\"ts\":\"2026-10-19T09:14:03Z\",\"level\":\"error\",\n \"msg\":\"payment failed\",\"request_id\":\"req_8f2a\",\n \"order_id\":42,\"provider\":\"razorpay\",\n \"error\":\"card_declined\",\"duration_ms\":812}","e":"A team couldn’t debug intermittent checkout failures for weeks. After adding request IDs to every log line, they traced a failing request through 4 services in minutes.","p":["Logging secrets and personal data","Unstructured text you can’t query","Logging everything at DEBUG in production (huge bills, noise)","Logging the same error at every layer"],"v":["Metrics","Logs = detailed individual EVENTS (why did THIS fail?). Metrics = numbers over time (HOW OFTEN is it failing?). Metrics alert you; logs explain."],"f":["Event happens","Write structured JSON log","Ship to central store","Search by request_id"],"q":[["Why structured logging?","Fields can be filtered, aggregated and queried reliably, unlike free-form text."],["What should never be logged?","Passwords, tokens, secrets, full card numbers and unnecessary personal data."],["What is a correlation/request ID used for in logs?","Linking all log lines from one request across services so you can follow its path."],["Why log an error once at the boundary instead of at every layer?","Logging at every layer creates duplicate noise; log where it’s handled, with full context and stack trace."],["How do you avoid logging personal data?","Use allowlists of logged fields, redaction middleware, and avoid dumping entire request bodies."]],"r":[103,102,123,105],"num":"500 req/s × 10 log lines × 500 bytes = 2.5 MB/s ≈ 216 GB/day.\nDropping DEBUG and sampling successful-request logs at 10% can cut this by ~80%.","m":["Log volume per service (cost and noise).","Error log rate: often the first signal of a new bug.","Log pipeline lag/drops: missing logs during incidents hurt most."],"k":["Which log line is most useful for debugging?",["“Error happened”","A structured JSON line with request_id, order_id, error type and duration","A full dump of the request including the password","“Done”"],1,"Structured context lets you search, filter and join logs across services. Never log secrets."],"sl":"logging"},{"n":101,"c":"obs","t":"Monitoring","s":"Continuously measuring your system’s health and alerting someone when something important goes wrong.","w":"Monitoring collects signals (metrics, health checks, synthetic tests), shows them on dashboards and triggers alerts on rules. Two popular frameworks: the Four Golden Signals (latency, traffic, errors, saturation) and RED for services (Rate, Errors, Duration). USE for resources (Utilization, Saturation, Errors).","y":"Without monitoring, users become your alerting system, and you find out about outages from Twitter.","h":["Monitor from the user’s view first: request success rate and latency per key endpoint.","Add golden signals for every service, plus resource metrics (CPU, memory, disk, connections).","Add business metrics: orders per minute, sign-ups, payment success rate. They catch issues technical metrics miss.","Use synthetic checks (scripted logins/checkouts from outside) to catch problems even at low traffic.","Build a few clear dashboards per service, not hundreds.","Alert on symptoms users feel; keep cause metrics on dashboards for diagnosis.","Monitor the monitoring (is data still arriving?)."],"e":"A payment provider’s API kept returning 200 OK but with a “failed” status inside. Technical metrics looked green; a “payment success rate” business metric caught the drop within minutes.","p":["Only CPU/memory monitoring","Dashboards nobody looks at","No external checks, so a DNS or certificate failure goes unnoticed"],"v":["Observability","Monitoring watches for problems you KNOW to look for. Observability lets you investigate problems you DIDN’T predict, using rich, connected telemetry."],"f":["Collect metrics + checks","Dashboards","Rule crosses threshold","Alert to on-call"],"q":[["What are the four golden signals?","Latency, traffic, errors and saturation."],["Why monitor business metrics?","They reflect real user outcomes and can catch failures that technical metrics miss."],["What are synthetic checks?","Automated scripts that simulate user actions from outside to verify the system works end to end."],["What’s the USE method?","For each resource check Utilization, Saturation and Errors; useful for finding infrastructure bottlenecks."],["Why monitor the monitoring system?","If metrics stop arriving, everything looks 'quiet'; alert on missing data."]],"r":[105,104,103,106],"m":["Golden signals per service: latency, traffic, errors, saturation.","Synthetic check success from multiple regions.","Business KPIs (orders/min, payment success rate)."],"k":["Your dashboards are green but customers say checkout fails. What monitoring gap is most likely?",["Too many metrics","No user-journey or business metrics (e.g. payment success rate) and no synthetic checks","Missing CPU graphs","Logs are disabled"],1,"Technical metrics can look healthy while a user flow is broken; monitor outcomes users care about."],"sl":"monitoring"},{"n":102,"c":"obs","t":"Distributed Tracing","s":"Following a single request as it travels through many services, with timing for each step.","w":"When a request enters, it gets a trace ID. Every service it touches creates a span (name, start time, duration, attributes) and passes the trace ID along in headers (W3C traceparent). A tracing backend (Jaeger, Tempo, Zipkin, Honeycomb, Datadog) stitches spans into a waterfall chart showing exactly where time went and where errors happened. OpenTelemetry is the standard way to instrument.","y":"In microservices, “checkout is slow” could be any of 12 services. Logs from each service don’t show the chain. A trace shows “80% of time was the inventory service waiting on a DB query”.","h":["Instrument with OpenTelemetry; auto-instrumentation covers HTTP, gRPC and DB clients for many languages.","Propagate context across every boundary, including message queues (put trace context in message headers).","Add useful attributes: route, user tier, order size (not personal data).","Sample to control cost: head sampling (keep X%) or tail sampling (keep all errors and slow traces).","Link logs and metrics to trace IDs so you can jump between them.","Look at the slowest traces to understand p99 problems."],"code":"traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01\n# trace id ───────────┘                       span id ┘","e":"Uber built Jaeger to debug requests crossing hundreds of microservices; a single trace could reveal that a slow ride request was caused by a retry loop in one small service.","p":["Context not propagated through queues, breaking traces","Keeping 100% of traces at high volume (cost)","Sampling that drops the rare error traces you actually need"],"v":["Logging","Logs record individual events in one place. Traces CONNECT the steps of one request across services with timing and parent-child structure."],"f":["Request gets trace ID","Gateway span → Order span","→ Payment span → DB span","Waterfall shows slow step"],"q":[["What’s the difference between a trace and a span?","A trace is the whole journey of one request; a span is one unit of work within it, with its own timing and parent."],["How is trace context passed between services?","In headers such as W3C traceparent (and in message metadata for queues)."],["Head vs tail sampling?","Head decides at the start (e.g. keep 10%); tail decides after completion, so it can keep all errors and slow traces."],["What is tail-based sampling?","Deciding which traces to keep after they finish, so you can keep all errors and slow traces while dropping most normal ones."],["How do traces help with p99 latency problems?","Inspecting the slowest traces shows exactly which span (service, query) took the time."]],"r":[123,100,103,105],"k":["Traces break whenever a request goes through your message queue. Why?",["Queues can’t be traced","Trace context isn’t propagated in message headers","Sampling is 100%","Clocks are skewed"],1,"Context must be injected into message metadata by producers and extracted by consumers."],"sl":"distributed-tracing"},{"n":103,"c":"obs","t":"Metrics","s":"Numbers measured over time, like requests per second, error rate or memory usage, that show trends and trigger alerts.","w":"Metric types: counter (only goes up, e.g. total requests; you look at its rate), gauge (goes up and down, e.g. memory in use, queue length), histogram (distribution of values, e.g. request durations, used for percentiles). Metrics have labels (route=“/checkout”, status=“500”). Tools: Prometheus, Grafana, Datadog, CloudWatch, OpenTelemetry.","y":"Metrics are cheap to store and fast to query compared to logs, so they’re ideal for dashboards, trends, capacity planning and alerts.","h":["Use counters for things that happen (requests, errors), gauges for current levels, histograms for latency and sizes.","Keep label cardinality low: never put user IDs, emails or full URLs with IDs as label values. Each unique combination is a new time series.","Name consistently with units (http_request_duration_seconds).","Measure RED per endpoint: rate, errors, duration.","Record business metrics too (orders_total, payments_failed_total).","Aggregate histograms properly to compute percentiles."],"code":"http_requests_total{route=\"/checkout\",status=\"500\"}  1234  (counter)\nqueue_depth{queue=\"emails\"}                           87   (gauge)\nhttp_request_duration_seconds_bucket{le=\"0.5\"}        9920 (histogram)\n\nrate(http_requests_total{status=~\"5..\"}[5m])","e":"A team added user_id as a Prometheus label “for debugging”. It created millions of time series and crashed their Prometheus server within a day.","p":["High-cardinality labels","Averages instead of histograms for latency","Metrics without units in the name"],"v":["Logs","Metrics are aggregated NUMBERS (cheap, great for trends and alerts). Logs are detailed EVENTS (expensive, great for explaining a specific case)."],"f":["App increments counter","Scraped every 15 s","Stored as time series","Graphs + alert rules"],"q":[["Counter vs gauge vs histogram?","Counter only increases (use its rate), gauge goes up and down (current value), histogram records value distributions for percentiles."],["What is cardinality and why does it matter?","The number of unique label combinations; high cardinality creates huge numbers of time series, increasing cost and breaking metric systems."],["What are RED metrics?","Rate (requests per second), Errors (failed requests), Duration (latency distribution) per service/endpoint."],["Why use histograms for latency instead of averages?","Histograms let you compute percentiles and see the distribution; averages hide slow tails."],["What does rate() do on a counter?","Computes the per-second increase over a time window, handling counter resets."]],"r":[100,106,91,101],"k":["Why is adding user_id as a metric label a bad idea?",["Labels must be numbers","Each unique user creates a new time series, exploding cardinality and cost","It’s not allowed by Prometheus","It slows the app"],1,"Metrics systems store a series per label combination. High-cardinality labels belong in logs or traces."],"sl":"metrics"},{"n":104,"c":"obs","t":"Alerts","s":"Automatic notifications that wake a human only when something needs action now.","w":"An alert is a rule over metrics or logs (“checkout error rate > 2% for 5 minutes”) that sends a notification (PagerDuty, Opsgenie, Slack). Good alerts are actionable, urgent and reflect user pain. Bad alerts fire constantly for things nobody can fix, and people start ignoring them (alert fatigue).","y":"Too few alerts: outages go unnoticed. Too many: real alerts get lost in noise and on-call engineers burn out.","h":["Alert on symptoms users feel (errors, latency, availability), not every cause (CPU 80%).","Use SLO burn-rate alerts: page when the error budget is being consumed fast.","Require duration (for: 5m) to avoid flapping on brief spikes.","Split severity: page for urgent user impact; ticket/Slack for things that can wait until morning.","Every alert must have an owner and a runbook link explaining what to check and do.","Group and deduplicate related alerts.","Review alerts monthly: delete or fix any that fired without needing action."],"code":"- alert: CheckoutErrorRateHigh\n  expr: |\n    sum(rate(http_requests_total{route=\"/checkout\",status=~\"5..\"}[5m]))\n    / sum(rate(http_requests_total{route=\"/checkout\"}[5m])) > 0.02\n  for: 5m\n  labels: { severity: page }\n  annotations: { runbook: \"https://wiki/runbooks/checkout\" }","e":"A team had 300 alerts per week, mostly ignored. After deleting non-actionable ones and switching to SLO burn-rate alerts, they had about 5 pages a week, each real.","p":["Paging for things that can’t be acted on","No runbook","Alerts without duration windows that flap all night"],"v":["Monitoring","Monitoring COLLECTS and shows signals. Alerting decides WHEN a human must be interrupted."],"f":["Error rate > 2% for 5 min","Alert fires (severity: page)","On-call notified","Runbook → mitigate"],"q":[["What makes an alert good?","It’s actionable, urgent, reflects real user impact, has an owner and a runbook."],["What is alert fatigue?","When too many noisy alerts cause people to ignore or miss important ones."],["Why alert on symptoms rather than causes?","Symptoms capture what users experience regardless of cause; cause metrics are many and often harmless."],["What is an SLO burn-rate alert?","An alert that fires when the error budget is being consumed much faster than allowed, catching real user impact early."],["What should every alert link to?","A runbook explaining what it means, how to check impact and what actions to take."]],"r":[110,108,101,109],"k":["Which alert is best to page someone at 3 a.m.?",["CPU above 80% on one server","Checkout error rate above 2% for 5 minutes","Disk 60% full","A deploy finished"],1,"Pages should fire for user-impacting, urgent, actionable problems. The others belong on dashboards or tickets."],"sl":"alerts"},{"n":105,"c":"obs","t":"Observability","s":"How well you can understand what’s happening inside your system just by looking at its outputs, even for problems you never predicted.","w":"Observability comes from rich telemetry (logs, metrics and traces, often with events and profiles) that are connected and carry context (request IDs, user tiers, versions, regions). With it you can ask new questions on the fly: “Are only Android users on version 5.2 in Mumbai seeing slow checkout?” without shipping new code.","y":"Modern distributed systems fail in new, strange ways. Pre-built dashboards only answer questions you thought of in advance. Observability lets you debug the unknown.","h":["Instrument with OpenTelemetry for logs, metrics and traces in one standard.","Add high-context attributes: version, region, customer tier, feature flag state.","Correlate signals: trace IDs in logs, exemplars linking metrics to traces.","Make telemetry easy to query and explore, not just display.","Instrument new features as part of “done”, not after the first outage.","Control cost with sampling and retention."],"e":"When a release slowed down only for users with very large carts, high-context traces (cart_size attribute) revealed it in minutes; standard dashboards just showed a small p99 bump.","p":["Buying a tool and calling it observability","Three disconnected tools for logs, metrics and traces","No context attributes, so you can’t slice the data"],"v":["Monitoring","Monitoring answers KNOWN questions with dashboards and alerts. Observability lets you explore UNKNOWN questions using connected, high-context telemetry."],"f":["Rich telemetry with context","Something odd happens","Slice by version/region/tier","Find unknown cause fast"],"q":[["Monitoring vs observability?","Monitoring tracks predefined signals for known failure modes; observability provides data rich enough to investigate new, unexpected problems."],["What are the three pillars commonly mentioned?","Logs, metrics and traces."],["Why does context matter?","Attributes like version, region and user tier let you slice data and isolate which subset is affected."],["What context attributes are most useful to add to telemetry?","Service version, region, customer tier, feature flag state, endpoint and request ID."],["How do you keep observability costs under control?","Sampling, retention limits, avoiding high-cardinality metrics, and dropping noisy low-value logs."]],"r":[102,101,103,123],"k":["What distinguishes observability from basic monitoring?",["More dashboards","The ability to ask new questions about unexpected behaviour using rich, connected telemetry","Using only logs","Having alerts"],1,"Monitoring covers known failure modes; observability lets you slice telemetry by context to debug the unknown."],"sl":"observability"},{"n":106,"c":"obs","t":"SLIs","s":"Service Level Indicator: a precise measurement of how well your service is doing from the user’s point of view.","w":"An SLI is usually a ratio: good events ÷ total events. Examples: “successful HTTP requests ÷ all requests” (availability), “requests faster than 300 ms ÷ all requests” (latency), “orders processed within 5 minutes ÷ all orders” (freshness). It must say exactly what is counted, where it’s measured and over what window.","y":"“The site feels slow” or “we’re pretty reliable” can’t be managed. SLIs give everyone, engineers and business, one shared number.","h":["Start from user journeys: login, search, checkout, upload.","Choose the kind: availability, latency, quality, freshness, correctness.","Define it exactly: which requests count (exclude health checks and bots?), what’s “good” (status < 500? under 300 ms?).","Measure as close to the user as possible (load balancer logs, real user monitoring), not just inside the app.","Keep a few per service, not dozens."],"code":"availability SLI =\n  count(requests where status < 500)\n  / count(all requests)        over 28 days\n\nlatency SLI =\n  count(requests with duration < 300ms) / count(all requests)","e":"An image service’s SLI: “percentage of image loads that succeed and render in under 1 second, measured at the CDN”.","p":["Measuring only server CPU instead of user experience","Vague definitions that people interpret differently","Counting client errors (404s from bad links) as service failures"],"v":["SLOs","The SLI is the MEASUREMENT (99.95% succeeded). The SLO is the TARGET you compare it with (should be ≥ 99.9%)."],"f":["Pick user journey","Define good ÷ total","Measure near user","SLI = 99.95% this month"],"q":[["What form does an SLI usually take?","A ratio of good events to total valid events, expressed as a percentage."],["Give an example latency SLI.","Proportion of requests completed in under 300 ms over a 28-day window."],["Where should SLIs be measured?","As close to the user’s experience as possible, such as at the load balancer or with real user monitoring."],["Why exclude some requests from an SLI?","Health checks, bots or client errors (bad input) don’t reflect service quality and would distort the ratio."],["Availability SLI vs latency SLI?","Availability counts successful responses; latency counts responses faster than a threshold. Many services use both."]],"r":[107,108,103,91],"k":["Which is a well-defined SLI?",["“The site feels fast”","Proportion of checkout requests completing successfully in under 500 ms, measured at the load balancer","CPU usage","Number of servers"],1,"Good SLIs are user-focused ratios with clear definitions of good events, total events and where they’re measured."],"sl":"slis"},{"n":107,"c":"obs","t":"SLOs","s":"Service Level Objective: the reliability target for an SLI, such as “99.9% of requests succeed over 28 days”.","w":"An SLO turns an SLI into a goal. It’s internal and set by the team with the business. It’s different from an SLA (Service Level Agreement), which is an external contract with penalties, usually looser than the SLO so you have a safety margin. 99.9% allows about 43 minutes of failure per month; 99.99% allows about 4 minutes.","y":"Without a target, teams either chase perfection (slow, expensive) or ignore reliability until customers leave. 100% is impossible and not even desirable; users' own Wi-Fi isn’t 100% reliable.","h":["Set targets based on what users need and what’s achievable; look at historical performance.","Use a rolling window (e.g. 28 or 30 days).","Each extra nine costs roughly 10× more effort; choose deliberately.","Make SLOs visible on dashboards and use them for alerting (burn rate).","Use the SLO to make decisions: if you’re meeting it comfortably, ship faster; if not, focus on reliability.","Review SLOs every quarter."],"code":"SLO: 99.9% of checkout requests succeed (28-day window)\nAllowed failures ≈ 0.1%\n1,000,000 requests → up to 1,000 can fail","e":"Google’s SRE book describes how setting SLOs below 100% let teams balance launching features against reliability with data instead of arguments.","p":["Picking 99.999% because it sounds good","SLO stricter than what your dependencies provide","SLOs nobody looks at or acts on"],"v":["SLIs","SLI = what you MEASURE. SLO = the TARGET for that measurement. SLA = the external PROMISE with consequences."],"f":["SLI measured","Compare to SLO 99.9%","Above: ship freely","Below: prioritize reliability"],"q":[["SLO vs SLA?","SLO is an internal target; SLA is a contract with customers that includes consequences and is usually looser than the SLO."],["How much downtime does 99.9% allow per 30 days?","About 43 minutes."],["Why not aim for 100%?","It’s impossible, extremely expensive, and users can’t perceive the difference beyond a point; it also blocks all change."],["Who should set SLOs?","Engineering together with product/business, based on user needs and cost, then reviewed regularly."],["What do you do when you consistently beat your SLO by a lot?","Either tighten it if users benefit, or use the spare budget to ship faster and take more risks."]],"r":[106,108,104,71],"num":"99.9% over 30 days: 30 × 24 × 60 × 0.001 ≈ 43 minutes of failure allowed.\n99.99%: ≈ 4.3 minutes. 99.999%: ≈ 26 seconds.\nTwo dependencies at 99.9% each in series ≈ 99.8% → your SLO can't realistically exceed what they provide.","k":["Your service depends on two services each offering 99.9%. Why is a 99.99% SLO unrealistic?",["SLOs can’t be that high","Chained dependencies multiply: about 99.8% combined, below your target","It is too expensive to measure","Because of caching"],1,"Availability in series multiplies. Without redundancy or fallbacks, you can’t exceed your dependencies."],"sl":"slos"},{"n":108,"c":"obs","t":"Error Budgets","s":"The amount of failure your SLO allows. If you target 99.9%, the remaining 0.1% is a budget you can “spend”.","w":"Error budget = 100% − SLO. With 99.9% over 28 days you can afford roughly 40 minutes of downtime or 0.1% failed requests. Risky deploys, experiments and incidents all consume it. The budget turns reliability into a shared, measurable resource.","y":"It ends the endless fight between “ship faster” (product) and “don’t break anything” (ops). Data decides: budget left means you can take risks; budget burned means slow down and fix things.","h":["Calculate it from your SLO and track remaining budget on a dashboard.","Agree on an error budget policy in advance: e.g. if the budget is exhausted, freeze risky launches and prioritize reliability work.","Alert on burn rate: burning a month’s budget in hours = page now; slow burn = ticket.","Use multi-window burn-rate alerts (e.g. 1 hour and 5 minutes) for fast, accurate detection.","Discuss budget consumption in postmortems and planning.","Don’t treat leftover budget as a goal to spend on purpose by breaking things."],"code":"SLO 99.9% over 28 days\nBudget = 0.1% × 28 days ≈ 40 minutes\nBurn rate 14.4 ⇒ budget gone in ~2 days ⇒ PAGE\nBurn rate 1    ⇒ budget lasts exactly the window","e":"A team used half its monthly budget in one bad deploy. Per their policy, they paused new features for a week and added canary analysis, which prevented a repeat.","p":["No agreed policy, so exhausting the budget changes nothing","Alerting on raw errors instead of burn rate","Using the budget as an excuse to ignore user pain"],"v":["SLOs","The SLO is the target line. The error budget is the room BELOW perfection that the target allows you, and how much of it is left."],"f":["SLO 99.9% → 0.1% budget","Incidents + deploys consume it","Budget left? keep shipping","!Exhausted → reliability focus"],"q":[["How do you calculate an error budget?","100% minus the SLO, applied to the time window or request count."],["What is burn rate?","How fast the error budget is being consumed relative to the rate that would exactly use it up over the window."],["What’s an error budget policy?","A pre-agreed rule about what happens when the budget is consumed, such as freezing feature launches."],["Why use burn rate instead of a fixed error threshold for alerts?","It relates errors to the SLO window, catching fast severe incidents quickly and slow leaks over time with fewer false alarms."],["Is unused error budget a target to spend?","No. It’s permission to take reasonable risks (launches, experiments), not a reason to cause failures."]],"r":[107,106,71,104],"num":"SLO 99.9% over 28 days ≈ 40 minutes of budget.\nA 20-minute outage consumes 50%.\nBurn rate 14.4 for 1 hour consumes 2% of a 30-day budget → classic fast-burn page threshold (Google SRE workbook).","k":["The team has used its entire monthly error budget in week two. Under a typical policy, what happens?",["Nothing","Risky launches pause and work shifts to reliability until the budget recovers","The SLO is lowered","The on-call engineer is blamed"],1,"An error budget policy turns the number into action: slow down risk and fix reliability."],"sl":"error-budgets"},{"n":109,"c":"obs","t":"Production Incidents","s":"An unplanned event that hurts users or the business (an outage, data issue or serious slowdown) and needs coordinated response.","w":"Incident response is a structured process: detect, declare, assign roles, mitigate, communicate, resolve, then learn. Severity levels (SEV1 = major outage, SEV3 = minor) decide how many people are pulled in. Key roles: incident commander (coordinates and decides), communications lead (status updates), and subject-matter experts (do the technical work).","y":"Without structure, five engineers debug the same thing, nobody tells customers, someone makes a risky change, and the outage lasts three times longer.","h":["Declare an incident early; it’s cheap to downgrade.","Assign an incident commander who coordinates rather than debugs.","Mitigate first, investigate later: roll back, fail over, disable the feature flag, scale up. Restoring service beats finding root cause.","Use one dedicated channel and keep a timeline of actions and findings.","Communicate regularly to stakeholders and customers (status page), even if the update is “still investigating”.","Make changes deliberately and announce them in the channel.","Close with a postmortem for significant incidents."],"e":"During a checkout outage, the incident commander noticed it started right after a deploy and ordered a rollback within 6 minutes, before anyone found the bug. The root cause analysis happened calmly the next day.","p":["Hunting the root cause while users are down instead of rolling back","Everyone debugging, nobody coordinating","Silence towards customers"],"v":["Postmortems","The incident is the LIVE emergency: restore service. The postmortem is the CALM review afterwards: learn and prevent recurrence."],"f":["!Alert: checkout errors","Declare SEV, assign IC","Mitigate: rollback","Resolved → postmortem"],"q":[["Why mitigate before finding the root cause?","Restoring service minimizes user impact; investigation can continue safely afterwards."],["What does an incident commander do?","Coordinates the response, assigns tasks, makes decisions and keeps everyone aligned, rather than debugging personally."],["Name common mitigation actions.","Rollback, failover, disabling a feature flag, scaling up, blocking bad traffic, or shedding load."],["Why update the status page even when you don’t know the cause?","Users and support need to know you’re aware and working on it; silence increases frustration and duplicate reports."],["What is the first question in incident response?","What is the user impact and how do we stop it fastest (mitigate), not what is the root cause."]],"r":[111,110,73,104],"k":["During a major incident, what should the incident commander focus on?",["Debugging the code personally","Coordinating people, decisions and communication","Writing the postmortem","Updating dashboards"],1,"The commander keeps the response organised so experts can work and stakeholders stay informed."],"sl":"production-incidents"},{"n":110,"c":"obs","t":"On-Call","s":"A rotation where engineers take turns being responsible for responding to production alerts, day and night.","w":"One person (plus a secondary backup) carries the pager for a period, often a week. When an alert fires, they acknowledge it within minutes, assess and mitigate, or escalate. Tools like PagerDuty or Opsgenie handle schedules, escalation and notifications.","y":"Systems break at 3 a.m. too. Without clear ownership, alerts go to everyone (so nobody acts) or nobody.","h":["Have a primary and secondary, and an escalation path to team leads or other teams.","Keep rotations fair and big enough (ideally 6–8 people) to avoid burnout.","Hand off properly: summary of ongoing issues at the start of each shift.","Give on-call engineers runbooks, dashboards and access BEFORE they need them.","Track page volume; aim for a handful of actionable pages per shift, and fix noisy alerts.","Compensate and respect on-call work (time off after bad nights).","Teams that build a service should share on-call for it (“you build it, you run it”)."],"e":"Google SRE guidelines suggest limiting on-call load to at most a couple of incidents per 12-hour shift, so engineers have time to handle and follow up properly.","p":["Tiny rotations of 2 people","Noisy alerts making every night bad","On-call without access or runbooks"],"v":["Alerts","Alerts are the SIGNAL that something’s wrong. On-call is the PEOPLE and PROCESS that respond to that signal."],"f":["Alert fires","Primary paged → ack","Mitigate with runbook","No ack? escalate to secondary"],"q":[["What’s an escalation policy?","Rules for who gets notified next if the primary doesn’t acknowledge or needs help."],["How do you reduce on-call burnout?","Fewer, actionable alerts; fair large rotations; runbooks; compensation; fixing recurring issues."],["What should an on-call handoff include?","Ongoing incidents, recent changes, known risks and anything left unresolved."],["What is a secondary on-call for?","Backup if the primary doesn’t acknowledge, and help during big incidents."],["What should happen after a bad on-call night?","Recovery time for the engineer, plus follow-up tickets to fix the causes of the pages."]],"r":[104,109,111,101],"k":["Which change most reduces on-call burnout?",["More people paged per alert","Removing or fixing noisy, non-actionable alerts","Longer shifts","Disabling alerts at night"],1,"Most burnout comes from pages that require no action. Fewer, better alerts make on-call sustainable."],"sl":"on-call"},{"n":111,"c":"obs","t":"Postmortems","s":"A written, blameless review after an incident: what happened, why, and what you’ll change so it doesn’t happen again.","w":"A postmortem documents impact (who was affected, for how long), timeline, root and contributing causes, what went well, what went badly, and action items with owners and dates. “Blameless” means focusing on how the system and process allowed the mistake, not punishing the person who typed the command.","y":"Without them, teams repeat the same outages. With blame, people hide mistakes and you never learn the real causes.","h":["Write one for every significant incident within a few days, while memory is fresh.","Build an accurate timeline from logs, chat and alerts.","Ask “why” repeatedly (5 Whys) to find contributing causes; incidents usually have several.","Ask “how did the system make this easy to do?” rather than “who did it?”.","Create specific action items with owners and deadlines: “add canary analysis to deploy pipeline”, not “be more careful”.","Review in a meeting, share widely, and track that actions get done."],"code":"Impact: 23 min, 18% of checkouts failed\nTrigger: config pushed with wrong DB host\nContributing: no validation, no canary, alert fired late\nActions:\n - Validate config in CI (owner: Riya, due Nov 1)\n - Canary config changes (owner: Dev, due Nov 15)","e":"After an engineer’s mistyped command took down part of Amazon S3 in 2017, AWS’s public postmortem focused on the tool allowing too much capacity to be removed at once, and changed the tool to remove capacity more slowly with safeguards.","p":["Blaming individuals","Vague actions like “be more careful”","Action items nobody tracks","Root cause = “human error” and stopping there"],"v":["Blameless Culture","The postmortem is the DOCUMENT and review process. Blameless culture is the MINDSET that makes it honest. Blameless doesn’t mean no accountability for fixing things."],"f":["Incident resolved","Timeline + impact","Contributing causes (5 Whys)","Owned action items tracked"],"q":[["What does blameless mean in a postmortem?","Analyzing how systems and processes allowed the failure, without punishing individuals, so people share information honestly."],["Why is “human error” not a root cause?","Humans always make mistakes; the real question is why the system allowed one mistake to cause an outage."],["What makes a good action item?","Specific, achievable, with an owner and a due date, and tracked to completion."],["What is the 5 Whys technique?","Repeatedly asking why something happened to move from symptoms to underlying contributing causes."],["Why share postmortems widely?","Other teams learn from failures they haven’t had yet, and it builds a culture of openness."]],"r":[109,99,104,73],"k":["Which postmortem action item is best?",["Be more careful with deploys","Add automated config validation in CI (owner: Riya, due Nov 1)","Don’t let it happen again","Discuss later"],1,"Good actions are specific, owned and dated, and change the system rather than asking people to try harder."],"sl":"postmortems"},{"n":112,"c":"rel","t":"Bulkheads","s":"Split resources into separate compartments so a failure in one part can’t drain resources from everything else.","w":"Named after ship compartments: if one floods, the ship still floats. In software: separate thread pools, connection pools, queues or even separate instances per dependency or per customer type. If the slow recommendation service eats all 20 threads of its own pool, the checkout pool still has its own threads.","y":"With one shared pool, one slow dependency makes every request wait for a thread, and the whole app stops, including features that don’t use that dependency.","h":["Give each critical dependency its own connection pool or concurrency limit.","Separate workloads: user-facing API vs batch jobs vs admin, on different pools or instances.","Isolate tenants: big or noisy customers on separate resources (cells/shards).","Use separate queues and workers per job type so a flood of one type doesn’t block another.","Size compartments carefully; too small wastes capacity, too large defeats the point.","Combine with timeouts and circuit breakers."],"code":"reco_pool    = ThreadPool(max_workers=10)   # can fail alone\npayment_pool = ThreadPool(max_workers=30)\nsearch_sem   = Semaphore(20)   # max 20 concurrent search calls","e":"AWS uses “cell-based architecture”: customers are split into independent cells, so a bad deployment or overload in one cell affects only a fraction of customers.","p":["One giant shared pool for everything","Batch jobs sharing the DB connection pool with user traffic","Compartments sized without measuring real needs"],"v":["Circuit Breaker","A bulkhead LIMITS how much damage a failing part can do by isolating resources. A circuit breaker STOPS calling the failing part. They work well together."],"f":["Separate pools per dependency","!Reco service hangs","Reco pool exhausted only","Checkout pool still serving"],"q":[["What problem
