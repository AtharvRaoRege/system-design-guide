onnection that stays open so the browser and server can both send messages any time, instantly.","w":"It starts as a normal HTTP request with an Upgrade: websocket header. The server agrees, and the same TCP connection becomes a two-way message channel. No new request per message, tiny overhead per frame.","y":"Chat, multiplayer games, collaborative editing, live trading screens and dashboards need instant updates in both directions. Polling every second is slow and wasteful.","h":["Authenticate during the handshake (token or cookie) and check permissions on every message, not just at connect.","Use heartbeats (ping/pong) to detect dead connections.","Reconnect automatically with backoff on the client, and resync missed messages.","Scaling: each server holds its own connections, so use a shared pub/sub (Redis, NATS) to broadcast a message to users connected to other servers.","Load balancers need sticky or connection-aware routing and long idle timeouts.","Limit message size and rate per connection.","Libraries like Socket.IO or managed services (Pusher, Ably, AWS API Gateway WebSockets) handle much of this."],"code":"const ws = new WebSocket(\"wss://chat.app/ws?token=…\");\nws.onmessage = (e) => render(JSON.parse(e.data));\nws.send(JSON.stringify({ room: 7, text: \"hi\" }));","e":"Slack and WhatsApp Web keep a WebSocket open so messages appear instantly; the server pushes new messages without the browser asking.","p":["Checking auth only at connect time","Forgetting multi-server fan-out, so users on different servers don’t see each other’s messages","Load balancer idle timeouts dropping connections every 60 s"],"v":["Server-Sent Events","WebSockets: two-way, custom protocol. SSE: one-way server→browser over normal HTTP, with automatic reconnect. If the browser rarely sends, SSE is simpler."],"f":["HTTP Upgrade handshake","Persistent connection","Server pushes messages","Client sends messages"],"q":[["How do WebSockets start?","With an HTTP request containing Upgrade: websocket; the server replies 101 Switching Protocols."],["How do you send a message to users connected to different servers?","Publish it through a shared pub/sub system that every WebSocket server subscribes to."],["When would you choose SSE over WebSockets?","When updates flow only from server to client, like notifications or live feeds."]]},{"n":55,"c":"net","t":"Server-Sent Events","s":"A simple one-way stream where the server keeps sending updates to the browser over a normal HTTP connection.","w":"The browser opens new EventSource(“/stream”). The server responds with Content-Type: text/event-stream and keeps the response open, writing lines like \"data: {...}\" whenever there’s news. The browser reconnects automatically and can resume using the last event ID.","y":"Live notifications, progress bars, stock tickers and AI chat token streaming need server→client pushes but not client→server messages. SSE is much simpler than WebSockets for that and works through normal HTTP infrastructure.","h":["Send \"data:\" lines ending with a blank line; add \"id:\" so clients can resume with Last-Event-ID.","Send a comment or ping every ~15–30 s so proxies don’t kill idle connections.","Disable proxy buffering (e.g. X-Accel-Buffering: no for Nginx).","Use HTTP/2 so many streams share one connection (HTTP/1.1 browsers limit ~6 connections per domain).","Use normal POST requests for client→server actions."],"code":"HTTP/1.1 200 OK\nContent-Type: text/event-stream\n\nid: 41\ndata: {\"progress\": 40}\n\nid: 42\ndata: {\"progress\": 60}","e":"ChatGPT and Claude’s web apps stream answers token by token using SSE-style streaming responses.","p":["Proxies buffering the stream so updates arrive all at once","Hitting the 6-connections-per-domain limit on HTTP/1.1","Trying to send client messages over SSE"],"v":["Long Polling","Long polling: one response per update, then reconnect. SSE: one long response carrying many updates, with built-in reconnect."],"f":["EventSource(“/stream”)","Server holds response open","Writes data: events","Browser auto-reconnects with ID"],"q":[["What content type does SSE use?","text/event-stream."],["How does SSE resume after disconnect?","The browser reconnects and sends Last-Event-ID; the server resends missed events."],["Why might SSE updates arrive in a big batch?","A proxy or server is buffering the response; buffering must be disabled."]]},{"n":56,"c":"net","t":"Long Polling","s":"The client asks “anything new?” and the server holds the request open until there is something new (or a timeout), then the client asks again.","w":"Normal polling asks every few seconds and usually gets “nothing”. Long polling keeps each request waiting on the server, up to say 30 s. The moment data appears, the server answers. The client immediately opens the next request.","y":"It gives near real-time updates using only plain HTTP, which works through old proxies and firewalls where WebSockets might be blocked. It’s a solid fallback.","h":["Server waits up to a timeout (20–30 s), shorter than any proxy timeouts, then returns “no news”.","Client reconnects immediately after each response, with backoff on errors.","Pass a cursor/last-seen ID so no events are missed between requests.","Use async servers (Node, Go, async Python) so thousands of waiting requests don’t each hold a thread."],"code":"async function loop(cursor) {\n  const r = await fetch(\"/updates?after=\" + cursor); // waits\n  const { events, next } = await r.json();\n  events.forEach(show);\n  loop(next);   // ask again right away\n}","e":"Early Facebook chat and Gmail used long polling (“Comet”) before WebSockets were widely supported.","p":["Thread-per-request servers running out of threads","Missing events between requests without a cursor","Timeouts longer than load balancer limits"],"v":["WebSockets","Long polling: many HTTP requests, simple, more overhead. WebSockets: one persistent two-way connection, efficient but needs more infrastructure support."],"f":["Client: any news after #10?","Server waits…","News arrives → respond","Client asks again after #11"],"q":[["How is long polling different from regular polling?","Regular polling returns immediately (often empty); long polling holds the request until data is available or a timeout."],["Why use a cursor in long polling?","To make sure events that happen between requests aren’t missed."],["What server model suits long polling?","Asynchronous/event-loop servers that can hold many idle connections cheaply."]]},{"n":57,"c":"net","t":"gRPC","s":"A fast way for services to call each other’s functions, using strict typed contracts and compact binary messages over HTTP/2.","w":"You define services and messages in a .proto file (Protocol Buffers). Tools generate client and server code in many languages. Calls look like local function calls: user := client.GetUser(ctx, req). Messages are binary (smaller and faster than JSON). It supports streaming in either or both directions.","y":"Between internal microservices, JSON/REST contracts drift, parsing is slower, and there’s no guarantee both sides agree on field types. gRPC gives strong contracts, generated code and efficiency.","h":["Write .proto files and keep them in a shared repo or registry.","Evolve safely: never reuse or change field numbers; add new fields, mark old ones reserved.","Always set deadlines on calls (gRPC supports deadline propagation).","Use proper status codes (NOT_FOUND, UNAVAILABLE, DEADLINE_EXCEEDED).","For browsers use gRPC-Web or a REST gateway; browsers can’t speak raw gRPC.","Load balance per request, not per connection (HTTP/2 keeps long connections, so L4 balancers send everything to one server). Use L7 or client-side balancing."],"code":"service UserService {\n  rpc GetUser (GetUserRequest) returns (User);\n  rpc WatchOrders (WatchReq) returns (stream Order);\n}\nmessage User { int64 id = 1; string name = 2; }","e":"Google uses its internal predecessor (Stubby) for billions of calls per second; companies like Netflix and Square use gRPC between internal services.","p":["Reusing field numbers and corrupting old clients","L4 load balancing sending all traffic to one pod","Hard to debug with curl compared to JSON"],"v":["REST","REST: resource URLs + JSON, human-readable, great for public/browser APIs. gRPC: typed functions + binary, faster, great for internal service-to-service."],"f":[".proto contract","Generated client stub","Binary call over HTTP/2","Typed response"],"q":[["Why is gRPC efficient?","Binary Protocol Buffers are small and fast to parse, and HTTP/2 multiplexes many calls on one connection."],["How do you evolve a proto message safely?","Add new fields with new numbers, never change or reuse existing numbers, and reserve removed ones."],["Why can L4 load balancing be a problem for gRPC?","Long-lived HTTP/2 connections mean all requests from a client stick to one server; balancing must happen per request at L7 or client side."]]},{"n":58,"c":"net","t":"HTTP/2 & HTTP/3","s":"Newer versions of HTTP that send many requests over one connection at once, making websites and APIs faster.","w":"HTTP/1.1 sends one request at a time per connection, so browsers open ~6 connections and requests queue up. HTTP/2 multiplexes many streams over one TCP connection, compresses headers (HPACK) and uses binary framing. But on TCP, one lost packet still stalls all streams (head-of-line blocking). HTTP/3 runs on QUIC over UDP: each stream recovers independently, connection setup is faster (TLS 1.3 built in) and connections survive switching from Wi-Fi to mobile data.","y":"Modern pages load 100+ files. Fewer connections and parallel streams cut load time, especially on high-latency mobile networks.","h":["Enable HTTP/2 and HTTP/3 at your CDN or load balancer; usually just a setting.","Stop old HTTP/1.1 hacks like domain sharding; with HTTP/2 they hurt.","Bundling still matters less than before; many small files are OK over HTTP/2.","Make sure UDP 443 isn’t blocked, so HTTP/3 can be used (browsers fall back automatically).","Measure real user performance before and after."],"e":"Google and Cloudflare report noticeable latency improvements with HTTP/3, especially on lossy mobile networks in places like India, where packet loss is common.","p":["Keeping domain sharding after moving to HTTP/2","Assuming HTTP/3 works everywhere (some corporate networks block UDP)","Thinking HTTP/2 fixes slow backends"],"v":["TCP vs UDP","HTTP versions are application protocols. TCP and UDP are transport protocols underneath: HTTP/2 uses TCP, HTTP/3 uses QUIC on UDP."],"f":["HTTP/1.1: requests queue","HTTP/2: many streams, 1 TCP","!Lost packet stalls all (TCP)","HTTP/3 QUIC: streams independent"],"q":[["What is head-of-line blocking?","When one delayed item blocks everything behind it; in HTTP/2 a lost TCP packet stalls all streams on that connection."],["What does QUIC add?","UDP-based transport with per-stream loss recovery, built-in TLS 1.3, faster handshakes and connection migration."],["Name two HTTP/2 features.","Multiplexing many streams over one connection and header compression (HPACK)."]]},{"n":59,"c":"net","t":"TCP vs UDP","s":"TCP is reliable and ordered but slower to start; UDP is fast and lightweight but doesn’t guarantee delivery or order.","w":"TCP sets up a connection (3-way handshake), numbers every byte, resends lost packets, delivers in order and controls congestion. UDP just sends independent packets (datagrams): no handshake, no resending, no ordering. Apps on UDP add only the reliability they need.","y":"For a file download or API call, every byte must arrive correctly, so TCP. For a video call or game, a late packet is useless; better to skip it than wait, so UDP.","h":["Use TCP (via HTTP, gRPC, database protocols) for almost all business apps.","Use UDP for real-time voice/video (WebRTC), online games, DNS lookups, metrics (StatsD) and QUIC/HTTP/3.","On UDP, handle loss, reordering and duplicates in the app, and don’t flood the network (implement congestion control).","Know TCP costs: handshake latency (plus TLS), and slow start on new connections; reuse connections (keep-alive) to avoid repeating them."],"e":"In a Zoom call, a lost audio packet is simply skipped (a tiny glitch). If it used TCP, the call would freeze waiting for the resend, then rush to catch up.","p":["Building on raw UDP and accidentally reinventing a buggy TCP","Opening a new TCP connection for every request","Assuming UDP is always faster for everything"],"v":["HTTP/2 & HTTP/3","TCP/UDP are the transport layer. HTTP versions sit on top: HTTP/3 brings UDP’s benefits to the web via QUIC while still providing reliability."],"f":["TCP: handshake","Ordered, resend lost","UDP: just send","App decides on loss"],"q":[["What does TCP guarantee that UDP doesn’t?","Reliable, ordered, non-duplicated delivery with congestion control."],["Why do video calls use UDP?","Low latency matters more than perfect delivery; retransmitted late packets are useless in real time."],["Why does DNS mostly use UDP?","Queries are tiny single request/response exchanges; a handshake would double the latency. It falls back to TCP for large responses."]]},{"n":60,"c":"net","t":"DNS","s":"The internet’s phone book: it turns names like google.com into IP addresses computers can connect to.","w":"Your device asks a resolver (from your ISP, or 8.8.8.8 / 1.1.1.1). If it doesn’t know, it asks the root servers, then the .com servers, then the domain’s authoritative nameserver, which returns the answer. Results are cached at each step for the record’s TTL. Record types: A (IPv4), AAAA (IPv6), CNAME (alias to another name), MX (mail), TXT (verification, SPF), NS (nameservers).","y":"Every connection starts with DNS. Misconfigured or slow DNS means “site down” even when servers are fine. DNS is also used for load balancing, failover and routing users to the nearest region.","h":["Use a reliable managed DNS (Route 53, Cloudflare, Cloud DNS).","Pick TTLs wisely: long (hours) for stable records = fewer lookups; short (30–60 s) before planned migrations so changes spread fast. Lower the TTL days BEFORE the change.","Use CNAMEs to point to load balancers/CDNs rather than hardcoding IPs.","Use health-checked DNS failover and latency/geo routing for multi-region.","Protect against hijacking: registrar lock, MFA on the registrar account, DNSSEC where appropriate.","Debug with dig or nslookup: dig +trace example.com shows every step."],"code":"dig +short shop.com A        # 203.0.113.10\ndig shop.com CNAME\ndig +trace shop.com          # full resolution path","e":"In 2016 an attack on DNS provider Dyn made Twitter, Netflix, GitHub and Reddit unreachable for many users, even though those companies' own servers were fine.","p":["Changing an IP with a 24-hour TTL and wondering why half of users still hit the old server","Forgetting renewal and losing the domain","Single DNS provider with no redundancy for critical sites"],"v":["Reverse Proxy","DNS tells the client WHICH address to connect to. A reverse proxy, at that address, decides WHICH server handles the request."],"f":["Browser: where is shop.com?","Resolver asks root → .com → NS","Answer 203.0.113.10 (cached TTL)","Browser connects"],"q":[["What does TTL mean for DNS records?","How long resolvers may cache the answer before asking again."],["A vs CNAME record?","A maps a name to an IPv4 address; CNAME maps a name to another name (an alias)."],["How should you prepare for changing a server’s IP?","Lower the TTL well in advance (longer than the old TTL), make the change, then raise it again."]]},{"n":61,"c":"ops","t":"Docker","s":"Packs your app and everything it needs into a container image that runs the same on any machine.","w":"A Dockerfile lists steps: base OS image, install dependencies, copy code, set the start command. docker build creates an image (a stack of read-only layers). docker run starts a container: an isolated process using that image. Containers share the host kernel, so they’re far lighter than virtual machines.","y":"“It works on my machine” happens because of different OS versions, libraries and settings. A container image freezes all of that, so dev, CI and production run the identical thing.","h":["Use small official base images (alpine, slim, distroless).","Order Dockerfile steps for caching: copy dependency files and install them BEFORE copying source code.","Use multi-stage builds: build in a big image, copy only the output into a tiny runtime image.","Run as a non-root user.","Pin versions (node:22.11-slim, not node:latest).","Never bake secrets into images; pass them at runtime.","Add a .dockerignore (node_modules, .git, .env).","Store data in volumes or external databases; container filesystems disappear with the container.","Scan images for vulnerabilities (Trivy, Docker Scout)."],"code":"FROM node:22-slim AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-slim\nWORKDIR /app\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/node_modules ./node_modules\nUSER node\nCMD [\"node\", \"dist/server.js\"]","e":"A team’s image dropped from 1.2 GB to 140 MB with a multi-stage build, cutting deploy time from 4 minutes to 40 seconds.","p":["Using :latest and getting surprise upgrades","Copying all code before npm install, killing the cache","Saving uploaded files inside the container","Secrets in image layers (they’re readable even if deleted later)"],"v":["Kubernetes","Docker builds and runs containers. Kubernetes runs and manages LOTS of containers across many machines."],"f":["Dockerfile","docker build → image","Push to registry","docker run anywhere"],"q":[["Image vs container?","An image is the read-only template; a container is a running instance of that image."],["Why order COPY package.json before COPY . ?","So the dependency install layer is cached and only rebuilt when dependencies change, not on every code change."],["What is a multi-stage build?","A Dockerfile with several FROM stages where the final image copies only needed artifacts from build stages, keeping it small and secure."]]},{"n":62,"c":"ops","t":"Kubernetes","s":"A system that runs your containers across many machines and keeps them in the state you asked for: running, healthy and scaled.","w":"You declare the desired state in YAML: “run 3 copies of this image with 512 MB memory each”. Kubernetes (K8s) keeps comparing reality to that and fixes differences: restarts crashed containers, reschedules them if a machine dies, rolls out new versions. Key objects: Pod (one or more containers), Deployment (manages replicas and rollouts), Service (stable network address), Ingress (HTTP routing from outside), ConfigMap/Secret (config), HPA (autoscaling).","y":"Managing dozens of containers on many servers by hand (placement, restarts, networking, rollouts) is error-prone. K8s automates it, at the cost of a lot of complexity.","h":["Use a managed cluster (EKS, GKE, AKS) instead of running the control plane yourself.","Set resource requests (what the pod needs for scheduling) and limits (the maximum).","Configure readiness and liveness probes.","Run at least 2–3 replicas and a PodDisruptionBudget for anything important.","Use Deployments with rolling updates; keep containers stateless.","Keep secrets in Secrets backed by a real secrets manager.","Use namespaces, RBAC and network policies to separate teams/apps.","Ask if you need it at all: for a small app, a PaaS (Render, Railway, Cloud Run, App Runner) is far simpler."],"code":"apiVersion: apps/v1\nkind: Deployment\nmetadata: { name: api }\nspec:\n  replicas: 3\n  template:\n    spec:\n      containers:\n      - name: api\n        image: shop/api:1.4.2\n        resources:\n          requests: { cpu: 250m, memory: 256Mi }\n          limits:   { memory: 512Mi }","e":"When a node dies at 3 a.m., Kubernetes notices the pods are gone and starts replacements on healthy nodes within a minute, without anyone being paged.","p":["No resource requests, so pods get packed onto nodes and starve each other","Using K8s for a tiny app and drowning in YAML","Memory limit too low, causing constant OOM kills"],"v":["Docker","Docker = building and running a container. Kubernetes = orchestrating many containers across a cluster. K8s runs images built by Docker (or other tools)."],"f":["You declare: 3 replicas","Scheduler places pods","!One node dies","K8s recreates pods elsewhere"],"q":[["Requests vs limits?","Requests reserve resources for scheduling; limits cap what a container may use (exceeding the memory limit gets it OOM-killed)."],["What does a Service do?","Gives a stable name/IP and load balances across the changing set of pods behind it."],["What does “desired state” mean in Kubernetes?","You declare what should exist, and controllers continuously reconcile actual state to match it."]]},{"n":63,"c":"ops","t":"Helm Charts","s":"Reusable, configurable packages of Kubernetes YAML, like an app store package for your cluster.","w":"A chart is a folder of YAML templates plus a values.yaml file with settings. helm install renders the templates with your values and applies them. You can install the same chart for dev, staging and prod just by changing values (replicas, image tag, domain). Helm tracks releases, so helm rollback returns to the previous version.","y":"One app in K8s needs a Deployment, Service, Ingress, ConfigMap, HPA and more. Copy-pasting them per environment leads to drift and mistakes. Third-party software (Postgres, Prometheus, ingress controllers) is easiest to install as charts.","h":["Keep environment differences in values files: values-dev.yaml, values-prod.yaml.","Pin chart versions and image tags.","Run helm lint and helm template (or helm diff) in CI to see exactly what will change.","Don’t over-template: too much logic in templates makes charts unreadable.","Never put secrets in plain values files in Git; use sealed-secrets/external-secrets.","Pair with GitOps tools (Argo CD, Flux) for automatic, reviewed deployments."],"code":"helm install shop ./chart -f values-prod.yaml\nhelm upgrade shop ./chart --set image.tag=1.4.3\nhelm rollback shop 7\n# values-prod.yaml\nreplicaCount: 5\nimage: { repository: shop/api, tag: \"1.4.2\" }","e":"Installing a full monitoring stack (Prometheus, Grafana, Alertmanager) takes one command with the kube-prometheus-stack chart instead of writing hundreds of YAML files.","p":["Secrets committed in values.yaml","Unpinned chart versions changing under you","Huge templating logic nobody understands"],"v":["Terraform","Helm manages things INSIDE Kubernetes (apps). Terraform usually manages infrastructure AROUND it (clusters, databases, networks). Many teams use both."],"f":["Chart templates","+ values-prod.yaml","helm upgrade renders YAML","Release v8 applied (rollback ready)"],"q":[["What’s in a Helm chart?","Templates for Kubernetes manifests, a default values.yaml, and Chart.yaml metadata."],["How do you deploy one chart to several environments?","Use different values files per environment with the same templates."],["How do you preview a Helm change?","helm template or the helm diff plugin to see rendered manifests before applying."]]},{"n":64,"c":"ops","t":"Service Discovery","s":"How services find each other’s current addresses automatically, even as instances come and go.","w":"In the cloud, instances are created and destroyed all the time; IPs change. Service discovery keeps a live registry of “which healthy instances exist for service X”. Two styles: client-side (the caller asks the registry, e.g. Consul/Eureka, and picks an instance) and server-side (the caller hits a stable name, and a load balancer or DNS routes it, e.g. Kubernetes Services).","y":"Hardcoding IPs breaks the moment you scale or redeploy. You’d be editing config files every time a server restarts.","h":["In Kubernetes, use Services: call http://orders.default.svc.cluster.local and K8s routes to healthy pods.","Outside K8s, use Consul, Eureka or cloud service registries (AWS Cloud Map).","Register instances only once they’re ready, and remove them on shutdown.","Use health checks so unhealthy instances drop out of the registry.","Watch DNS caching: clients caching old IPs too long call dead instances.","Combine with retries and timeouts for when you hit an instance just as it dies."],"e":"When the payments service scales from 3 to 10 pods, the checkout service keeps calling http://payments and Kubernetes spreads traffic across all 10 automatically.","p":["Hardcoded IPs in config","Registering instances before they’re ready","Long DNS caching in clients (e.g. old JVM default caching forever)"],"v":["Load Balancing","Discovery answers “WHERE are the instances?”. Load balancing answers “WHICH instance gets this request?”. They usually work together."],"f":["Pod starts, becomes ready","Registered in registry/Service","Caller asks for “payments”","Routed to a healthy instance"],"q":[["Client-side vs server-side discovery?","Client-side: the caller queries the registry and chooses an instance. Server-side: the caller hits a stable endpoint and a router/load balancer picks."],["How does Kubernetes do service discovery?","Through Services with stable DNS names and virtual IPs that route to the pods matching a label selector."],["Why do health checks matter for discovery?","They remove dead or unready instances from the registry so traffic isn’t sent to them."]]},{"n":65,"c":"ops","t":"CI/CD","s":"Automatically testing every code change (CI) and automatically releasing it safely (CD).","w":"Continuous Integration: every push or pull request triggers a pipeline that builds the code and runs linting, tests and security checks, so problems are caught in minutes. Continuous Delivery: every change that passes is ready to release with one click. Continuous Deployment: it goes to production automatically. Tools: GitHub Actions, GitLab CI, Jenkins, CircleCI, Argo CD.","y":"Manual releases are slow, scary and inconsistent: someone forgets a step, deploys the wrong branch, or skips tests. Teams that release in small, automated steps ship faster AND break things less.","h":["Run fast checks first (lint, unit tests), slower ones later (integration, e2e).","Keep the pipeline under ~10 minutes; slow pipelines get skipped.","Build the artifact (e.g. Docker image) ONCE and promote the same artifact through staging to production.","Run DB migrations as a controlled pipeline step.","Use safe rollout strategies (rolling, canary, blue-green) and automatic rollback on bad health metrics.","Protect the main branch: required reviews and green checks.","Add security scanning: dependencies, secrets, containers.","Use short-lived cloud credentials (OIDC) for pipelines instead of stored keys."],"code":"# .github/workflows/ci.yml\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm ci\n      - run: npm run lint && npm test\n  deploy:\n    needs: test\n    if: github.ref == 'refs/heads/main'\n    steps: [ ... build image, deploy canary ... ]","e":"Companies like Etsy and Amazon deploy to production many times a day; each change is small, so if something breaks, it’s obvious which change did it.","p":["Rebuilding separately per environment, so prod runs something staging never tested","Flaky tests everyone ignores","Long-lived feature branches that merge in giant risky chunks"],"v":["Blue-Green Deployment","CI/CD is the AUTOMATION pipeline. Blue-green is one RELEASE STRATEGY that the pipeline can use."],"f":["git push","Build + test + scan","Deploy to staging","Promote same image to prod"],"q":[["Continuous delivery vs continuous deployment?","Delivery: every passing change is releasable, with a manual approval to ship. Deployment: every passing change ships automatically."],["Why build an artifact once and promote it?","So production runs exactly what was tested, not a rebuild that could differ."],["What makes a pipeline trustworthy?","Fast, reliable (no flaky tests), comprehensive checks, reproducible builds and automatic rollback."]]},{"n":66,"c":"ops","t":"Build Caching","s":"Reusing results of build steps that haven’t changed, so builds take seconds instead of many minutes.","w":"Most builds redo the same work: download the same dependencies, recompile unchanged files, rebuild the same Docker layers. Build caching saves outputs keyed by their inputs (lockfile hash, source file hashes). If inputs are the same, reuse the output.","y":"Slow CI means slow feedback, developers waiting, and higher CI bills. Caching often cuts build times by 50–90%.","h":["Cache package downloads keyed by the lockfile hash (package-lock.json, poetry.lock, go.sum).","Order Docker layers so dependency install is cached and code changes only rebuild the last layers.","Use remote Docker layer cache in CI (BuildKit --cache-from/--cache-to, registry cache).","Use tools with content-addressed caches for monorepos (Turborepo, Nx, Bazel, Gradle remote cache).","Make builds deterministic: pinned versions, no timestamps baked in, so cache hits are reliable.","Never cache secrets or environment-specific outputs.","Have a way to bust the cache when it’s corrupted."],"code":"- uses: actions/cache@v4\n  with:\n    path: ~/.npm\n    key: npm-${{ hashFiles('package-lock.json') }}","e":"A monorepo with 40 packages took 25 minutes per CI run. With Turborepo’s remote cache, only changed packages rebuild and most PRs finish in 3 minutes.","p":["Cache keys that don’t include all inputs, giving stale wrong builds","Caching node_modules across OS/Node versions","Never measuring cache hit rate"],"v":["Application Caching","Build caching speeds up making your SOFTWARE (CI). Application caching speeds up serving your USERS (runtime). Same idea, totally different place."],"f":["Compute hash of inputs","Cache hit?","Yes: restore output","No: build + save to cache"],"q":[["What should a dependency cache key be based on?","The hash of the lockfile (plus OS/runtime version), so it changes exactly when dependencies change."],["Why does Dockerfile order affect caching?","Each instruction is a layer; if an early layer changes, all later layers rebuild. Put rarely-changing steps first."],["What is remote caching?","A shared cache of build outputs that all developers and CI machines can reuse."]]},{"n":67,"c":"ops","t":"Infrastructure as Code","s":"Describing your servers, networks and databases in code files, so infrastructure is created, reviewed and changed like software.","w":"Instead of clicking around a cloud console, you write files that say “a VPC with these subnets, a Postgres database of this size, a bucket with these rules”. A tool reads the files and makes reality match. Declarative tools (Terraform, OpenTofu, CloudFormation, Pulumi) describe the end state; the tool figures out the steps.","y":"Click-ops can’t be reviewed, repeated or audited. Nobody remembers why a firewall rule exists. Recreating an environment after a disaster takes weeks. With IaC, staging and prod can be identical, and changes go through pull requests.","h":["Keep IaC in Git and change it only through pull requests with review.","Show the plan (what will change) in the PR before applying.","Split into modules (network, database, app) and environments.","Store state remotely with locking (for Terraform).","Never hardcode secrets; reference a secrets manager.","Block manual console changes in production, or detect drift regularly.","Use policy checks (OPA/Conftest, Checkov, tfsec) for security rules like “no public buckets”."],"e":"After an accidental account deletion, a team with full IaC rebuilt their entire AWS environment in an afternoon by running their pipeline against a new account.","p":["Mixing manual changes with IaC, causing drift","Huge single files nobody understands","Applying without reading the plan"],"v":["Terraform","IaC is the PRACTICE. Terraform is one popular TOOL that implements it; others are Pulumi, CloudFormation and CDK."],"f":["Write infra code","Pull request + plan","Review + approve","Apply → cloud matches code"],"q":[["Declarative vs imperative IaC?","Declarative describes the desired end state and the tool computes changes; imperative scripts list the steps to perform."],["What is drift?","When real infrastructure differs from the code because of manual changes or external modifications."],["Why review the plan before applying?","To catch unexpected destroys or replacements of critical resources before they happen."]]},{"n":68,"c":"ops","t":"Terraform","s":"A popular IaC tool: you describe cloud resources in HCL files, it shows a plan of changes and then applies them.","w":"Terraform uses providers (AWS, GCP, Azure, Cloudflare, GitHub…) to talk to APIs. It keeps a state file that maps your code to real resource IDs. Workflow: terraform init → terraform plan (preview) → terraform apply. OpenTofu is the open-source fork with the same workflow.","y":"It gives one consistent language for many providers, a reviewable plan before anything changes, and repeatable environments.","h":["Store state remotely (S3 + DynamoDB lock, GCS, Terraform Cloud) with locking so two people can’t apply at once.","State can contain secrets: encrypt it and restrict access.","Always run plan and read it, especially lines saying “destroy” or “must be replaced”.","Use modules for repeated patterns, and pin provider/module versions.","Separate state per environment and per component to limit blast radius.","Add lifecycle { prevent_destroy = true } on critical resources like production databases.","Use terraform import or import blocks to adopt existing resources.","Run plan in CI on every PR."],"code":"resource \"aws_db_instance\" \"main\" {\n  engine         = \"postgres\"\n  instance_class = \"db.t4g.medium\"\n  allocated_storage = 50\n  lifecycle { prevent_destroy = true }\n}\n# terraform plan  → shows +/~/- changes\n# terraform apply → executes them","e":"A rename of a resource block made Terraform plan to destroy and recreate a production database. The plan review caught it; a moved block fixed it without data loss.","p":["Local state files on laptops","Not reading the plan","Editing state by hand","One giant state for everything, so every apply risks everything"],"v":["Kubernetes","Terraform creates and changes infrastructure (clusters, DBs, networks). Kubernetes runs your app containers continuously on that infrastructure."],"f":[".tf code","terraform plan","Review +/~/- changes","terraform apply (state updated)"],"q":[["What is Terraform state used for?","Mapping code resources to real-world IDs and attributes, so Terraform can compute what needs to change."],["Why use remote state with locking?","To share state across a team and prevent concurrent applies from corrupting it."],["How do you protect a production database from accidental deletion?","lifecycle prevent_destroy, careful plan review, and deletion protection on the resource itself."]]},{"n":69,"c":"ops","t":"Feature Flags","s":"On/off switches in your code, controlled from outside, so you can release features to some users without redeploying.","w":"Code ships with both paths: if flags.enabled(“new_checkout”, user): newFlow() else: oldFlow(). A flag service (LaunchDarkly, Unleash, Flagsmith, ConfigCat or a DB table) decides per user, percentage, region or plan. Deploying code and releasing features become separate decisions.","y":"Without flags, a feature is all-or-nothing at deploy time. If it’s broken, you must roll back the whole deploy. Flags allow gradual rollouts, instant kill switches, beta programs and A/B tests.","h":["Types: release flags (temporary), ops/kill switches (long-lived), experiment flags, permission flags.","Roll out gradually: internal staff → 1% → 10% → 50% → 100%, watching metrics at each step.","Make percentage rollouts sticky (hash the user ID) so a user doesn’t flip between versions.","Default to the safe path if the flag service is unreachable.","Remove release flags after full rollout; add an owner and expiry date to each flag.","Restrict and audit who can change production flags.","Test both paths."],"code":"if flags.is_enabled(\"new_checkout\", user_id=user.id):\n    return new_checkout(cart)\nreturn old_checkout(cart)\n# rollout: 5% of users, hashed by user_id → stable","e":"Facebook launches features to employees first, then to a small percentage of a country, then everyone, all controlled by its internal Gatekeeper flag system.","p":["Hundreds of stale flags making code unreadable (“flag debt”)","Flags that depend on other flags in confusing ways","Exposing flag rules client-side that reveal unreleased features"],"v":["Canary Release","Feature flags select USERS for a feature inside the same deployed code. Canary sends a slice of TRAFFIC to a new deployed VERSION."],"f":["Deploy code with flag off","Enable for staff","Ramp 1% → 50% → 100%","!Problem? Flip off instantly"],"q":[["What’s the benefit of separating deploy from release?","You can ship code safely dark and choose when and for whom it goes live, with an instant off switch."],["How do you keep a percentage rollout consistent per user?","Hash a stable user ID into buckets so the same user always gets the same result."],["What is flag debt?","Old flags left in code after rollout, adding branches, confusion and risk; they should be cleaned up."]]},{"n":70,"c":"ops","t":"Blue-Green Deployment","s":"Run the new version (green) next to the old one (blue), test it, then switch all traffic over in one move.","w":"Blue is live. You deploy the new version to an identical green environment, run smoke tests against it, then flip the router/load balancer to green. Blue stays running untouched; if anything goes wrong, flip back in seconds.","y":"Updating servers in place means downtime or a messy partial state, and rollbacks require redeploying. Blue-green gives near-instant cutover and near-instant rollback.","h":["Automate creating green identical to blue (IaC, same config).","Run smoke and health tests on green before switching.","Switch with the load balancer or DNS (LB is faster; DNS has caching delays).","Keep blue alive for a while after switch for fast rollback.","Databases are the hard part: both versions share the DB, so migrations must be backward compatible (expand/contract).","Drain in-flight requests and handle long-lived connections during the switch."],"e":"AWS Elastic Beanstalk and CodeDeploy support blue-green natively: they spin up a new environment, swap URLs, and keep the old one ready for a quick swap back.","p":["A DB migration that breaks blue, so you can’t actually roll back","Doubling infrastructure cost permanently","DNS-based switch taking hours due to TTLs"],"v":["Rolling Deployment","Blue-green swaps ALL traffic at once between two full environments (needs double capacity). Rolling replaces instances a few at a time within one environment."],"f":["Blue live, green deployed","Test green","Switch router → green","!Issue? Switch back to blue"],"q":[["What’s the biggest challenge with blue-green?","The shared database: schema changes must work with both versions, or rollback breaks."],["Why switch at the load balancer rather than DNS?","LB changes are instant; DNS changes are delayed by caching TTLs."],["What’s the cost of blue-green?","Running two full environments during the deployment window."]]},{"n":71,"c":"ops","t":"Canary Releases","s":"Send a small slice of real traffic (like 1–5%) to the new version first, watch it, and expand only if it looks healthy.","w":"Named after canaries in coal mines that warned miners early. The new version gets a small percentage of traffic. You compare its error rate and latency against the old version. If it’s fine, increase to 25%, 50%, 100%. If not, send all traffic back to the old version; only a few users were affected.","y":"Tests never catch everything; real users and real data find bugs. A canary limits how many users see a bad release.","h":["Define success metrics before starting: error rate, p99 latency, key business metrics like checkout conversion.","Compare canary vs baseline at the same time, not against yesterday.","Ramp in steps with waiting periods.","Automate analysis and rollback (Argo Rollouts, Flagger, Spinnaker).","Make sure the canary gets enough traffic to be statistically meaningful.","Watch for issues that only show at full load or after time (memory leaks)."],"code":"# Argo Rollouts\nstrategy:\n  canary:\n    steps:\n    - setWeight: 5\n    - pause: {duration: 10m}\n    - setWeight: 25\n    - pause: {duration: 10m}\n    - setWeight: 100","e":"Google rolls out changes to services and Android gradually; a bad config pushed to a small canary set is caught before reaching everyone.","p":["Too little traffic to notice anything","No predefined rollback criteria, so people argue during an incident","Sticky issues: users bouncing between versions with incompatible data"],"v":["Feature Flags","Canary = traffic % to a new deployed VERSION. Feature flags = turn FEATURES on for chosen users within the same version."],"f":["5% → new version","Compare errors/latency","Healthy: 25% → 100%","!Bad: route back to old"],"q":[["What metrics decide if a canary is healthy?","Error rate, latency (p95/p99), saturation and key business metrics, compared against the baseline version."],["Why compare against a simultaneous baseline?","Traffic patterns change over time; comparing at the same moment isolates the effect of the new version."],["How is canary different from blue-green?","Canary shifts traffic gradually while measuring; blue-green switches everything at once."]]},{"n":72,"c":"ops","t":"Rolling Deployments","s":"Update your servers a few at a time, so the service keeps running throughout the release.","w":"With 10 instances, take down 2, start 2 with the new version, wait until they’re healthy, then continue. Kubernetes Deployments do this by default with settings like maxUnavailable and maxSurge. During the rollout, old and new versions both serve traffic.","y":"Restarting everything at once causes downtime. Blue-green needs double capacity. Rolling updates are the cheap, default middle ground.","h":["Configure maxSurge (extra pods allowed during rollout) and maxUnavailable (how many can be down).","Use readiness probes so traffic only goes to new pods once they’re actually ready.","Handle shutdown gracefully: stop accepting new requests, finish in-flight ones (SIGTERM handling + preStop delay).","Make old and new versions compatible: API and DB changes must work with both at the same time.","Watch metrics during rollout and pause/undo on errors (kubectl rollout undo)."],"code":"strategy:\n  type: RollingUpdate\n  rollingUpdate:\n    maxSurge: 25%\n    maxUnavailable: 0   # never drop below full capacity","e":"A Kubernetes deploy of 20 pods with maxUnavailable: 0 and maxSurge: 5 replaces pods 5 at a time; users see no downtime.","p":["No readiness probe, so traffic hits pods still starting up","Ignoring SIGTERM and dropping in-flight requests","Breaking changes that old pods can’t handle mid-rollout"],"v":["Canary Release","Rolling replaces instances progressively to FINISH the deploy. Canary deliberately pauses at a small slice to MEASURE before deciding."],"f":["10 pods on v1","Replace 2 → v2 (ready?)","Repeat batch by batch","10 pods on v2, zero downtime"],"q":[["What do maxSurge and maxUnavailable control?","maxSurge: how many extra pods can exist above desired count; maxUnavailable: how many can be unavailable during the rollout."],["Why is backward compatibility critical for rolling deploys?","Old and new versions run simultaneously and share databases and APIs."],["What is graceful shutdown?","On termination, stop taking new requests, finish current ones, then exit, avoiding dropped requests."]]},{"n":73,"c":"ops","t":"Rollbacks","s":"Going back to the last known-good version quickly when a release causes problems.","w":"A rollback redeploys the previous artifact (image, build) or configuration. The goal is to stop user pain FIRST, and investigate the root cause after. Rollback can be manual (kubectl rollout undo, helm rollback) or automatic when health metrics break.","y":"During an incident every minute counts. Teams without a fast, practiced rollback end up trying to write fixes under pressure, which often makes things worse.","h":["Keep previous artifacts and tag them immutably (never overwrite tags).","Make rollback one command or one button, and practice it.","Automate rollback triggers based on error rate/latency during deploys.","Make DB migrations backward compatible so old code still works after a rollback.","Config and feature flags count too: roll those back like code.","Decide rollback vs roll-forward: roll back by default; roll forward only when the fix is tiny and certain, or data changes make rollback unsafe."],"code":"kubectl rollout undo deployment/api\nhelm rollback shop 41\n# or redeploy the previous immutable image tag\nimage: shop/api:1.4.1","e":"A config change pushed globally broke Cloudflare’s proxy in 2019; reverting the change (a rollback of config, not code) restored service across their network.","p":["A migration that dropped a column, so old code can’t run anymore","Mutable “latest” tags, so “previous version” is unknown","Never testing the rollback path"],"v":["Database Migrations","Code rollbacks are easy. Data/schema changes often aren’t reversible, which is why migrations must stay compatible with the previous code version."],"f":["v2 deployed","!Errors spike","Roll back to v1 artifact","Users ok → investigate v2"],"q":[["Rollback or roll forward?","Rollback by default to restore service quickly; roll forward when rollback is impossible (irreversible data changes) or the fix is trivial and well understood."],["Why use immutable artifact tags?","So you can always redeploy exactly the previous version."],["What makes a rollback unsafe?","Irreversible schema/data changes, or other services already depending on the new behaviour."]]},{"n":74,"c":"ops","t":"Health Checks","s":"Simple endpoints or commands that answer “is this instance OK?” so load balancers and orchestrators can react.","w":"An instance exposes something like GET /health that returns 200 when it’s fine and 503 when it’s not. Load balancers call it every few seconds and stop sending traffic to instances that fail several checks in a row. Monitoring systems use similar checks from outside (uptime checks).","y":"Without health checks, a crashed or frozen instance keeps receiving traffic, and a share of users get errors until a human notices.","h":["Keep it cheap and fast; it runs constantly.","Return 200 only when the instance can genuinely serve requests.","Separate shallow checks (process alive) from deep checks (can reach DB/cache).","Be careful with deep checks: if the shared DB has a blip, ALL instances fail health checks and get removed at once, turning a small problem into a total outage.","Use thresholds (e.g. 3 failures in a row) to avoid flapping.","Don’t expose sensitive details publicly in health responses.","Also run external synthetic checks from multiple regions."],"code":"@app.get(\"/health\")\ndef health():\n    return {\"status\": \"ok\"}, 200\n\n@app.get(\"/ready\")\ndef ready():\n    ok = db.ping(timeout=0.3)\n    return ({\"db\": ok}, 200 if ok else 503)","e":"An app returned 200 from /health even when its DB connection pool was exhausted, so the load balancer kept sending traffic to useless instances. Adding a readiness check on pool availability fixed it.","p":["Health check that always returns 200","Deep checks causing all instances to fail together","Expensive checks adding real load"],"v":["Liveness & Readiness Probes","A health check is the general idea. Kubernetes splits it into liveness (restart me?) and readiness (send me traffic?), which have different consequences."],"f":["LB calls /health every 5 s","!3 failures in a row","Instance removed from pool","Recovers → added back"],"q":[["Shallow vs deep health check?","Shallow checks the process responds; deep checks dependencies like DB. Deep checks are more accurate but risk mass removal during shared dependency blips."],["Why use failure thresholds?","To avoid flapping instances in and out of rotation due to single slow or failed checks."],["What should a health endpoint never do?","Be slow or expensive, or leak sensitive internal information."]]},{"n":75,"c":"ops","t":"Liveness & Readiness Probes","s":"Kubernetes asks two different questions: “Are you stuck? (restart you)” and “Can you take traffic right now? (route to you)”.","w":"Liveness probe failing → Kubernetes kills and restarts the container. Readiness probe failing → the pod stays running but is removed from the Service’s endpoints, so it gets no traffic. A third, the startup probe, gives slow-starting apps time before liveness kicks in.","y":"Mixing them up causes real outages. If liveness checks the database and the DB is slow, Kubernetes restarts ALL your pods at once (a restart storm), even though restarting doesn’t fix the DB.","h":["Liveness: very simple, only “is my process alive and not deadlocked?”. Never check external dependencies.","Readiness: “am I able to serve?”. Warmed up, connected to essentials, not overloaded.","Startup probe for apps that take long to boot (JVMs, model loading).","Tune timeoutSeconds, periodSeconds and failureThreshold to avoid false failures.","Mark not-ready during graceful shutdown so traffic drains before the pod exits."],"code":"livenessProbe:\n  httpGet: { path: /livez, port: 8080 }\n  periodSeconds: 10\n  failureThreshold: 3\nreadinessProbe:\n  httpGet: { path: /readyz, port: 8080 }\n  periodSeconds: 5\nstartupProbe:\n  httpGet: { path: /livez, port: 8080 }\n  failureThreshold: 30   # up to 5 min to start","e":"A team pointed their liveness probe at an endpoint that queried Postgres. A 30-second DB failover made every pod fail liveness, and Kubernetes restarted 200 pods at once, causing a much longer outage than the failover itself.","p":["Dependency checks in liveness","No startup probe, so slow apps get killed during boot forever","Same endpoint for liveness and readiness"],"v":["Health Checks","Generic health checks just say healthy/unhealthy. Liveness and readiness split that into two actions: restart vs remove from traffic."],"f":["Liveness fail → restart","Readiness fail → no traffic","Startup probe → wait for boot","Pod serves when ready"],"q":[["What happens when a readiness probe fails?","The pod is removed from Service endpoints and receives no traffic, but isn’t restarted."],["Why shouldn’t liveness probes check the database?","A DB problem would restart all pods, which doesn’t fix the DB and adds load and downtime."],["What is a startup probe for?","Giving slow-starting containers time to boot before liveness checks can kill them."]]},{"n":76,"c":"ops","t":"Dependency Hell","s":"When the libraries your project uses need conflicting versions of other libraries, and nothing installs or works cleanly.","w":"Your app needs library A and B. A needs C version 1.x, B needs C version 2.x. Some ecosystems can’t load both, so the install fails or picks one and something breaks at runtime. It also covers transitive dependencies (dependencies of dependencies) silently changing and breaking your build.","y":"It wastes days, blocks security upgrades and causes “it worked yesterday” builds. Unmanaged dependencies are also a big security risk (supply chain attacks, known vulnerabilities).","h":["Commit a lockfile (package-lock.json, poetry.lock, go.sum, Cargo.lock) so every install is identical.","Use isolated environments (venv, containers) per project.","Update regularly in small steps with bots like Dependabot or Renovate, not once every two years.","Read changelogs on major version bumps (SemVer major = breaking).","Keep dependency count low; avoid tiny packages you could write in 5 lines.","Use overrides/resolutions to force one compatible version when needed.","Scan for known vulnerabilities (npm audit, pip-audit, Snyk, OSV).","Remove unused dependencies."],"e":"In 2016 the “left-pad” package (11 lines of code) was unpublished from npm and broke thousands of builds worldwide, including big projects that depended on it transitively.","p":["No lockfile in Git","Huge “upgrade everything” PRs every two years","Pinning to ancient versions forever and missing security fixes"],"v":["Semantic Versioning","Dependency hell is the PROBLEM. SemVer is a COMMUNICATION convention that helps tools choose compatible versions, if maintainers follow it."],"f":["App needs A and B","A → C 1.x, B → C 2.x","!Conflict","Fix: upgrade/override + lockfile"],"q":[["What does a lockfile do?","Records exact versions of every direct and transitive dependency so installs are reproducible."],["Why update dependencies frequently?","Small updates are easy to test and fix; rare huge upgrades are painful and leave known vulnerabilities in place."],["What is a transitive dependency?","A dependency of one of your dependencies, which you didn’t install directly."]]},{"n":77,"c":"net","t":"API Versioning","s":"Changing your API without breaking apps that already use it, by managing versions and deprecations.","w":"Once clients (especially mobile apps you can’t force-update) rely on your API, changing a field name or meaning breaks them. Versioning lets old and new contracts live side by side: in the URL (/v1/orders), a header (Accept: application/vnd.shop.v2+json), or dated versions (Stripe-Version: 2024-06-20).","y":"Breaking changes without versioning crash old app versions in users' hands, and partner integrations fail overnight.","h":["Prefer non-breaking changes: add new fields and endpoints; don’t remove, rename or change types/meaning.","Clients must ignore unknown fields (tolerant reader).","Create a new version only for real breaking changes.","Pick one scheme and stick to it (URL versioning is simplest to see and route).","Announce deprecation with timelines, Deprecation/Sunset headers and docs.","Track which clients use old versions before turning them off.","Keep version translation at the edge so internal code doesn’t fork everywhere."],"code":"GET /v1/users/7  → { \"name\": \"Asha Rao\" }\nGET /v2/users/7  → { \"first_name\": \"Asha\", \"last_name\": \"Rao\" }\n\nDeprecation: true\nSunset: Wed, 31 Dec 2026 23:59:59 GMT","e":"Stripe pins each account to the API version that existed when it integrated. New changes go into new dated versions, and Stripe translates responses so old integrations keep working for years.","p":["Renaming a field “because it’s cleaner”","Versioning every tiny change, creating dozens of versions","Turning off old versions without knowing who still uses them"],"v":["Semantic Versioning","API versioning protects CLIENTS of a service contract. SemVer labels RELEASES of a library/package. A service can use v1/v2 without SemVer."],"f":["Old app calls /v1","New app calls /v2","Both served","v1 deprecated → sunset later"],"q":[["Name three breaking API changes.","Removing or renaming a field, changing a field’s type or meaning, and making an optional parameter required."],["What is the tolerant reader principle?","Clients should ignore fields they don’t understand so servers can add fields safely."],["URL vs header versioning?","URL is explicit and easy to route/cache; headers keep URLs clean but are less visible and harder to test casually."]]},{"n":78,"c":"ops","t":"Semantic Versioning","s":"Version numbers as MAJOR.MINOR.PATCH, where each part tells users how risky the upgrade is.","w":"PATCH (1.4.2 → 1.4.3): bug fixes, nothing breaks. MINOR (1.4 → 1.5): new features, backward compatible. MAJOR (1.x → 2.0): breaking changes. Versions 0.x are “anything may change”. Package managers use ranges: ^1.4.2 means any 1.x ≥ 1.4.2; ~1.4.2 means 1.4.x only.","y":"Without meaning in version numbers, every upgrade is a gamble. SemVer lets tools auto-accept safe updates and warns humans about breaking ones.","h":["Bump MAJOR for any breaking change to the public API, even small ones.","Document the public API; SemVer only applies to it.","Keep a CHANGELOG with “Breaking changes” clearly marked.","Use pre-release tags (2.0.0-beta.1) for testing.","Automate versioning from commit messages (Conventional Commits + semantic-release).","As a consumer: use lockfiles and tests; don’t blindly trust that maintainers got it right."],"code":"1.4.2 → 1.4.3   fix: crash on empty cart       (PATCH)\n1.4.3 → 1.5.0   feat: add coupon support        (MINOR)\n1.5.0 → 2.0.0   BREAKING: rename total → amount (MAJOR)\n\n\"lodash\": \"^4.17.21\"   # allows 4.x.y >= 4.17.21","e":"Python 2 → 3 is the classic giant major version: breaking changes so large that migration took the ecosystem more than a decade.","p":["Breaking changes in a minor release","Staying at 0.x forever to avoid commitment","Trusting ^ ranges without a lockfile"],"v":["API Versioning","SemVer describes compatibility of RELEASES (libraries, packages). API versioning manages endpoint CONTRACTS for clients of a running service."],"f":["Bug fix → PATCH","New feature → MINOR","Breaking change → MAJOR","Users judge risk by number"],"q":[["What does ^1.4.2 allow vs ~1.4.2?","^ allows any 1.x.y ≥ 1.4.2 (not 2.0); ~ allows 1.4.x ≥ 1.4.2 only."],["What does version 0.y.z mean?","Initial development; the API isn’t considered stable and anything may change."],["If you remove a deprecated function, which part do you bump?","MAJOR, because removal breaks users who still call it."]]},{"n":79,"c":"scale","t":"Garbage Collection","s":"The runtime automatically finds memory your program can no longer reach and frees it.","w":"In Java, Go, JavaScript, C# and Python, you create objects without freeing them manually. The garbage collector (GC) periodically finds objects that nothing references anymore and reclaims their memory. Most GCs are generational: new objects (which usually die young) are collected often and cheaply; long-lived objects less often. Some GC work pauses your program (“stop the world”).","y":"GC prevents whole classes of bugs (forgetting to free, double free). But GC pauses can add latency spikes, and high allocation rates make the GC burn CPU.","h":["Measure first: GC logs, pause times, % CPU in GC (JVM GC logs, GODEBUG=gctrace=1, Node --trace-gc).","Allocate less in hot paths: reuse buffers, avoid creating many temporary objects in loops.","Size the heap sensibly; too small means constant collection, too large means longer pauses with some collectors.","Choose a collector for your goal: JVM G1 (balanced), ZGC/Shenandoah (very low pauses), Go’s GC with GOGC/GOMEMLIMIT tuning.","In containers, make the runtime aware of the memory limit (-XX:MaxRAMPercentage, GOMEMLIMIT).","Remember GC can’t free things you still reference; that’s a leak."],"e":"Discord moved a latency-sensitive service from Go to Rust partly because Go’s periodic GC caused regular latency spikes with their huge in-memory cache.","p":["Blaming GC when the real problem is a leak","JVM ignoring container limits and getting OOM-killed","Calling System.gc() manually"],"v":["Memory Leaks","GC frees UNREACHABLE memory. A leak is memory that’s still reachable but useless, so GC can’t help."],"f":["Objects allocated","Some become unreachable","GC marks reachable ones","Sweeps the rest → memory freed"],"q":[["What is generational garbage collection?","Dividing the heap by object age and collecting young objects frequently, since most die young, and old objects rarely."],["What is a stop-the-world pause?","A period when application threads are paused so the GC can safely do part of its work."],["How can you reduce GC pressure?","Allocate fewer short-lived objects in hot paths, reuse buffers, and tune heap size and collector."]]},{"n":80,"c":"dist","t":"Thread Safety","s":"Code is thread-safe if it still behaves correctly when many threads use it at the same time.","w":"Threads in one process share memory. If two threads do count = count + 1 simultaneously, both may read 5 and both write 6, losing an increment. Thread-safe code protects shared mutable state using locks, atomic operations, immutable data, or by not sharing at all.","y":"Thread-safety bugs are intermittent and nearly impossible to reproduce: wrong totals, corrupted maps, crashes under load only.","h":["Best: avoid shared mutable state. Use local variables, immutable objects, or give each thread its own data.","Use atomic types for counters and flags (AtomicInteger, sync/atomic, std::atomic).","Protect compound operations with a mutex/lock; keep the critical section small.","Use concurrent collections (ConcurrentHashMap) instead of plain maps.","Communicate by message passing (Go channels, actor model, queues) instead of sharing memory.","Use tools: Go race detector (-race), ThreadSanitizer, stress tests.","Document whether your classes are thread-safe."],"code":"// unsafe\ncounter++                     // read, add, write: 3 steps\n\n// safe (Go)\nvar counter int64\natomic.AddInt64(&counter, 1)\n\n// or a lock\nmu.Lock(); counter++; mu.Unlock()","e":"A Java service used a plain HashMap as a shared cache. Under heavy concurrent writes the map’s internal structure got corrupted and a thread looped forever at 100% CPU. ConcurrentHashMap fixed it.","p":["Assuming one line of code is atomic","Holding locks while doing slow IO","Thread-safe parts combined in an unsafe way (check-then-act across two safe calls)"],"v":["Race Condition","Thread safety is the PROPERTY you want. A race condition is the BUG you get when you don’t have it."],"f":["T1 reads 5, T2 reads 5","!Both write 6 (lost update)","Use atomic / lock","Result 7, correct"],"q":[["Why is count++ not thread-safe?","It’s read-modify-write in multiple steps; two threads can interleave and lose an update."],["Name three ways to achieve thread safety.","Immutability/no sharing, atomic operations, and locks; also message passing."],["Is combining two thread-safe operations always thread-safe?","No; e.g. “if !map.contains(k) then map.put(k)” can race. Use an atomic putIfAbsent."]]},{"n":81,"c":"scale","t":"Autoscaling","s":"Automatically adding servers when load goes up and removing them when it goes down.","w":"An autoscaler watches a signal (CPU, requests per second, queue length, custom metric) and changes the number of instances to keep it near a target. Examples: AWS Auto Scaling Groups, Kubernetes HPA (pods) and Cluster Autoscaler/Karpenter (nodes), serverless platforms scaling per request.","y":"Fixed capacity is either too small at peak (outage) or too big at night (wasted money). Autoscaling follows demand.","h":["Pick a signal that reflects real load: CPU for compute-bound apps; queue depth/age for workers; requests per instance for web.","Set min and max instances: min for baseline and redundancy, max to cap cost and protect databases.","Use cooldowns/stabilization windows to avoid flapping up and down.","Make startup fast; scaling is useless if new instances take 10 minutes.","Scale ahead of known peaks with scheduled scaling (sale at 8 PM).","Remember dependencies: 100 more app servers may overwhelm the database (connection limits).","Keep instances stateless so any can be removed."],"code":"# Kubernetes HPA\nminReplicas: 3\nmaxReplicas: 40\nmetrics:\n- type: Resource\n  resource:\n    name: cpu\n    target: { type: Utilization, averageUtilization: 60 }","e":"Food delivery apps in India see huge spikes at lunch and dinner; their services scale up before 12:30 and 7:30 PM, then scale down overnight.","p":["Scaling on a metric that doesn’t relate to load","Slow boot times making scaling arrive too late","No max, so a bug or attack scales into a huge bill"],"v":["Horizontal Scaling","Horizontal scaling is the ABILITY to add instances. Autoscaling is AUTOMATICALLY doing it based on metrics."],"f":["Traffic rises","CPU > 60% target","Add instances","Load drops → remove after cooldown"],"q":[["What’s a good autoscaling metric for queue workers?","Queue depth or the age of the oldest message, not CPU."],["Why set a maximum?","To cap cost and to avoid overwhelming shared dependencies like the database."],["What is scheduled scaling?","Pre-adding capacity for predictable peaks, since reactive scaling can lag."]]},{"n":82,"c":"scale","t":"Horizontal Scaling","s":"Handling more load by adding more machines (scale out), instead of a bigger machine.","w":"Instead of one server, run 2, 10 or 100 identical ones behind a load balancer. Capacity grows roughly with the number of machines, and losing one isn’t fatal.","y":"Every single machine has a ceiling, and one machine is a single point of failure. Horizontal scaling has (almost) no ceiling and improves availability.","h":["Make the app stateless: sessions in Redis/DB, files in object storage (S3), not on local disk.","Put a load balancer in front.","Avoid in-memory locks and caches that must be consistent; use shared stores.","Scale the data layer separately: read replicas, caching, sharding.","Use autoscaling to add/remove instances.","Watch out for things that must run once (cron jobs) now that there are many instances."],"e":"Netflix runs thousands of identical stateless service instances; losing a few at any time is normal and unnoticed by viewers.","p":["Storing uploads on local disk, so other servers can’t find the file","Scaling app servers while the single DB is the real bottleneck","Cron jobs running on every instance"],"v":["Vertical Scaling","Horizontal = MORE machines (more resilient, more complex). Vertical = BIGGER machine (simple, has a ceiling, single point of failure)."],"f":["1 server at limit","Make app stateless","Add servers behind LB","Capacity × N, survives failures"],"q":[["What must change in an app to scale horizontally?","It must be stateless: shared session storage, external file storage, and no reliance on local memory for coordination."],["Why doesn’t adding app servers always help?","The bottleneck may be a shared dependency like the database."],["Horizontal scaling’s main advantages?","Near-unlimited growth and fault tolerance."]]},{"n":83,"c":"scale","t":"Vertical Scaling","s":"Handling more load by giving one machine more CPU, RAM or faster disk (scale up).","w":"Change the instance type from 4 cores/16 GB to 32 cores/128 GB. Nothing in the app changes. It’s usually the simplest first move, especially for databases.","y":"It’s fast and needs no code changes. Modern machines are huge (hundreds of cores, terabytes of RAM), so vertical scaling goes further than many people think.","h":["Find the bottleneck first (CPU, memory, disk IO, network) and upgrade that.","Great for databases, which are hard to scale horizontally.","Plan for the restart/failover needed to resize; use a replica to make it near-zero downtime.","Make sure software can use the extra resources (single-threaded apps won’t use 32 cores; tune pools and memory settings).","Watch cost: the biggest instances cost a lot more per unit.","Know the ceiling and plan the next step before you hit it."],"e":"Stack Overflow famously served huge traffic for years from a small number of powerful SQL Server machines instead of a sharded fleet.","p":["Upgrading CPU when the bottleneck is disk IO","Thinking a bigger box fixes a single point of failure","Forgetting to raise config limits (buffer pool, worker counts) to use the new resources"],"v":["Horizontal Scaling","Vertical: bigger single machine, simple, limited, no redundancy. Horizontal: more machines, scalable and resilient, but needs stateless design."],"f":["DB CPU at 90%","Resize 8 → 32 cores","Failover to resized replica","Headroom gained, no code change"],"q":[["When is vertical scaling the right first step?","When the app or database is simple, the bottleneck is clear, and a bigger machine solves it cheaply without code changes."],["What are its limits?","A hardware ceiling, rising cost, possible downtime to resize, and still a single point of failure."],["Why are databases often scaled vertically?","Splitting relational data across machines (sharding) is complex; a bigger machine is far simpler."]]},{"n":84,"c":"scale","t":"CDN","s":"A worldwide network of servers that keeps copies of your content close to users, so it loads fast.","w":"A Content Delivery Network (Cloudflare, CloudFront, Akamai, Fastly) has hundreds of edge locations (points of presence). When a user in Chennai requests your image, it’s served from a nearby edge instead of your origin server in the US. The first request fetches from origin and caches; later requests are served from the edge.","y":"Physics: a round trip from India to the US is ~200+ ms. Pages need many requests. A CDN cuts that to ~20 ms, offloads most traffic from your servers, and absorbs attacks.","h":["Serve static assets (JS, CSS, images, fonts, videos) through the CDN.","Use hashed file names (app.3f9a2c.js) with long cache lifetimes: Cache-Control: public, max-age=31536000, immutable.","Short or no caching for HTML so new deploys show up quickly.","Never cache private or user-specific responses publicly (Cache-Control: private / no-store).","Set up purge/invalidation for urgent changes.","Use image optimization, compression (brotli) and HTTP/2-3 at the edge.","Monitor cache hit ratio; low ratio means poor cache keys or headers."],"code":"# hashed assets: cache forever\nCache-Control: public, max-age=31536000, immutable\n# HTML: always revalidate\nCache-Control: no-cache\n# user data: never cache publicly\nCache-Control: private, no-store","e":"Hotstar/JioCinema use CDNs to stream cricket matches to tens of millions of concurrent viewers; the origin servers would never handle that alone.","p":["Caching personalized pages and showing one user’s data to another","Long cache on HTML causing old app versions","Query strings or cookies fragmenting the cache key so nothing hits"],"v":["Edge Caching","A CDN is the NETWORK and platform. Edge caching is one TECHNIQUE it provides; CDNs also do TLS, DDoS protection, image optimization and edge compute."],"f":["User in Chennai","Nearest edge (Mumbai)","Cache hit → ~20 ms","Miss → fetch from origin once"],"q":[["Why use hashed filenames for static assets?","The content hash changes when the file changes, so you can cache forever and new versions get new URLs."],["What must never be cached at a public CDN?","Private, user-specific responses like account pages or API responses with personal data."],["What is cache hit ratio?","The percentage of requests served from cache; higher means less origin load and faster responses."]]},{"n":85,"c":"scale","t":"Edge Caching","s":"Storing responses at servers near users (the “edge”), so requests are answered before they ever reach your origin.","w":"Not just static files: API responses and full HTML pages can be cached at the edge too, if they’re the same for many users. The edge decides using the cache key (URL plus selected headers/cookies) and headers like Cache-Control, s-maxage and Vary. Techniques like stale-while-revalidate serve a slightly old copy instantly while fetching a fresh one in the background.","y":"A product listing viewed 100,000 times a minute doesn’t need 100,000 origin hits. Even caching for 10 seconds can remove 99% of origin load during a spike.","h":["Use s-maxage for shared caches (CDN) separate from max-age for browsers.","Use stale-while-revalidate and stale-if-error for speed and resilience (serve stale if origin is down).","Keep cache keys tight: ignore irrelevant query params like utm_source; use Vary only on headers that truly change content.","Never cache responses with Set-Cookie or user-specific data publicly.","Use micro-caching (1–10 s) for hot dynamic content.","Use surrogate keys/cache tags to purge all pages related to one product."],"code":"Cache-Control: public, max-age=0, s-maxage=60,\n               stale-while-revalidate=300, stale-if-error=86400","e":"News sites micro-cache article pages for a few seconds at the edge. When a story goes viral, the origin still sees only a handful of requests per second.","p":["Vary: Cookie or Vary: User-Agent destroying hit rates","Caching responses containing Set-Cookie","No purge strategy for urgent corrections"],"v":["Application Caching","Edge caching serves whole RESPONSES near users before the request reaches your servers. Application caching stores DATA inside your backend (e.g. Redis) to speed up building responses."],"f":["Request hits edge","Fresh copy? serve","Stale? serve + refresh in background","Origin barely touched"],"q":[["max-age vs s-maxage?","max-age applies to all caches including browsers; s-maxage overrides it for shared caches like CDNs."],["What does stale-while-revalidate do?","Lets the cache serve a stale response immediately while fetching a fresh one in the background."],["Why can Vary hurt caching?","Each distinct header value creates a separate cache entry; varying on high-variety headers fragments the cache."]]},{"n":86,"c":"scale","t":"Cost Optimization","s":"Paying less for cloud infrastructure while keeping the speed and reliability users need.","w":"Cloud bills grow quietly: oversized servers, forgotten test environments, data transfer, logs nobody reads, idle databases. Cost optimization (part of FinOps) means measuring where money goes, then cutting waste without hurting users.","y":"For many startups the cloud bill is one of the largest expenses. Waste of 30–50% is common. Saving it can mean months more runway.","h":["Make costs visible: tag every resource by team/service/environment and review a cost dashboard weekly.","Set budgets and anomaly alerts so a runaway bill is caught in a day, not a month.","Right-size: if a server averages 10% CPU, use a smaller one.","Turn off or delete idle resources: dev environments at night, unattached disks, old snapshots, unused IPs and load balancers.","Use commitments (Savings Plans, reserved instances) for steady baseline load and spot/preemptible instances for fault-tolerant batch work.","Watch data transfer: cross-region and internet egress are expensive; cache and compress.","Set log retention and sample noisy logs; observability bills grow fast.","Move cold data to cheaper storage classes with lifecycle rules.","Use ARM instances (Graviton etc.) where compatible for better price/performance."],"e":"A startup found 40% of its AWS bill was a forgotten staging cluster and debug-level logs kept forever. Fixing both took a day and saved lakhs per month.","p":["Cutting redundancy and causing outages to save a little","Optimizing tiny line items while ignoring the biggest ones","No ownership: nobody knows who runs what"],"v":["Autoscaling","Autoscaling is one TOOL that can reduce cost by matching capacity to demand. Cost optimization is the broader PRACTICE including pricing models, cleanup and architecture choices."],"f":["Tag + measure spend","Find top cost drivers","Right-size / delete / commit","Budgets + alerts keep it down"],"q":[["What’s the first step in cloud cost optimization?","Visibility: tagging resources and seeing which services and teams spend what."],["When should you use spot instances?","For interruptible, fault-tolerant work like batch jobs, CI runners and stateless workers."],["Why can data transfer be a hidden cost?","Cloud providers charge for egress and cross-region/zone traffic, which grows with chatty architectures."]]},{"n":87,"c":"scale","t":"Cold Starts","s":"The extra delay when a serverless function or new container has to boot up before it can handle the first request.","w":"Serverless platforms (Lambda, Cloud Functions, Cloud Run) scale to zero when idle. The next request must wait while the platform creates an environment, downloads your code, starts the runtime (JVM, Node, Python) and runs your initialization (DB connections, loading config). That can take from ~100 ms to several seconds. Later requests reuse the “warm” instance.","y":"Users notice when an occasional request takes 3 seconds instead of 50 ms. It especially hurts low-traffic APIs, user-facing endpoints and traffic spikes that need many new instances at once.","h":["Keep deployment packages small; remove unused dependencies.","Choose fast-starting runtimes (Node, Go, Python, Rust) or use JVM tricks (SnapStart, GraalVM native images).","Do expensive init lazily or reuse it across invocations (create clients outside the handler).","Use provisioned concurrency / minimum instances for latency-critical endpoints (costs money).","Avoid unnecessary VPC attachments on older setups.","Measure cold start frequency and duration; it may affect only 1% of requests.","If constant low latency matters more than scale-to-zero savings, use always-on containers."],"code":"# created once per instance (reused while warm)\ndb = connect()\ndef handler(event, ctx):\n    return db.query(...)   # warm calls skip the connect","e":"A Java Spring app on Lambda had 6-second cold starts. Enabling SnapStart (restoring from a snapshot of an initialized runtime) cut it to under a second.","p":["Initializing heavy clients inside the handler on every call","Huge bundles with every dependency","Pinging functions every few minutes instead of using proper provisioned concurrency"],"v":["Latency","Latency is the total time of a request. A cold start is one specific CAUSE of extra latency, only on requests that hit a new instance."],"f":["Request arrives, no warm instance","!Boot runtime + init (~1–3 s)","Handle request","Next requests warm (~20 ms)"],"q":[["What causes a cold start?","A request arriving when no initialized instance exists, forcing the platform to create one and run initialization."],["How can you reduce cold start time?","Smaller packages, faster runtimes, lazy or reused initialization, snapshotting (SnapStart), and provisioned/minimum instances."],["Why initialize clients outside the handler?","They’re created once per instance and reused across warm invocations."]]},{"n":88,"c":"scale","t":"Serverless Limits","s":"Serverless functions come with hard limits on running time, memory, payload size and concurrency that you must design around.","w":"Examples (typical, vary by provider): AWS Lambda max 15 minutes per run, up to 10 GB memory, synchronous payloads around 6 MB, an account-level concurrency limit (often 1,000 by default), temporary disk limits. API gateways in front add their own timeouts (often ~30 s). These aren’t bugs; they’re the contract.","y":"A video processing job that takes 20 minutes, a 50 MB upload, or a spike needing 5,000 concurrent functions will simply fail. Unlimited auto-scaling can also crush a database that allows only 100 connections.","h":["Check the current limits in your provider’s docs before designing.","Split long jobs into steps with a workflow engine (Step Functions, Workflows) or use containers/batch for long tasks.","For big files, upload directly to object storage with pre-signed URLs; pass references, not bytes.","Set reserved/maximum concurrency per function to protect downstream databases.","Put a queue between spiky traffic and functions to smooth bursts.","Use connection proxies (RDS Proxy) or HTTP-based databases.","Load-test realistic peaks and watch throttling metrics.","Know the cost curve: at very high steady load, containers may be cheaper."],"e":"A team’s Lambda image processor scaled to 3,000 concurrent executions during a marketing push, each opening a DB connection. Postgres maxed out and crashed. Reserved concurrency of 50 plus a queue fixed it.","p":["Assuming \"serverless = infinite\"","Uploading big files through the function","Unbounded concurrency hammering a database","Gateway timeout shorter than function timeout"],"v":["Cold Starts","Cold starts are about STARTUP delay. Serverless limits are hard CAPS on duration, size and concurrency. A function can be warm and still hit a limit."],"f":["20-min job requested","!Exceeds 15-min limit","Split into steps via workflow"
