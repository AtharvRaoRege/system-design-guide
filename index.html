up + doubly linked list for order\nfrom collections import OrderedDict\ndef get(k): v = d.pop(k); d[k] = v; return v   # move to end\ndef put(k, v):\n    d[k] = v; d.move_to_end(k)\n    if len(d) > CAP: d.popitem(last=False)     # evict LRU","e":"Redis added LFU eviction in version 4.0 because many users had workloads where a nightly batch job scanned lots of keys and pushed popular keys out under pure LRU.","p":["No maxmemory limit, so the cache crashes the server","Using LRU when scans pollute the cache","Ignoring eviction metrics"],"v":["Cache Invalidation","Eviction removes items because the cache is FULL. Invalidation removes items because they’re WRONG (data changed)."],"f":["Cache full","New item arrives","Policy picks victim (LRU/LFU)","Evict → insert new"],"q":[["LRU vs LFU?","LRU evicts the item unused for the longest time; LFU evicts the item used least often overall."],["How do you implement an LRU cache in O(1)?","Hash map for key lookup plus a doubly linked list ordering items by recency; move on access, evict from the tail."],["What metric tells you the cache is too small?","High eviction rate with a low hit ratio."]]},{"n":154,"c":"db","t":"OLTP vs OLAP","s":"OLTP databases handle lots of small, fast transactions for the app; OLAP systems handle big analytical queries over huge amounts of history.","w":"OLTP (Online Transaction Processing): Postgres/MySQL powering the app. Many tiny reads and writes per second (“place order”, “get user 7”), row-oriented storage, normalized data. OLAP (Online Analytical Processing): data warehouses like BigQuery, Snowflake, Redshift, ClickHouse. Few but massive queries (“revenue by city per month for 3 years”), column-oriented storage that reads only the needed columns and compresses well.","y":"Running heavy analytics on your production database slows down users. Interviewers expect you to separate them.","h":["Keep the app on an OLTP database.","Move data to a warehouse via ETL/ELT or CDC pipelines (Fivetran, Airbyte, Debezium, dbt for transforms).","Model analytics data as star schemas: fact tables (orders) + dimension tables (customers, products, dates).","Use columnar stores for aggregations over billions of rows.","Partition large fact tables by date.","For real-time analytics, consider ClickHouse, Druid or Pinot fed from Kafka.","At least move reports to a read replica if you don’t have a warehouse yet."],"e":"An online store runs checkout on Postgres while copying orders every few minutes into BigQuery, where the business team runs dashboards over years of data without touching production.","p":["Running giant reports on the primary database","Using a columnar warehouse as the app’s transactional database","No data modelling, so analysts write 300-line joins"],"v":["Read Replica","A read replica is a copy of the OLTP database, same row format. A warehouse is a different, column-oriented system built for analytics at scale."],"f":["App writes to OLTP DB","CDC/ETL pipeline","Columnar warehouse (OLAP)","Dashboards + big queries"],"q":[["Why are columnar stores faster for analytics?","They read only the columns a query needs and compress similar values well, scanning far less data."],["What is a star schema?","A central fact table of events (like orders) linked to dimension tables (customers, products, dates)."],["ETL vs ELT?","ETL transforms before loading into the warehouse; ELT loads raw data first and transforms inside the warehouse."]]},{"n":155,"c":"rel","t":"Single Point of Failure & Redundancy","s":"A single point of failure (SPOF) is any one component whose failure takes the whole system down; redundancy means having backups for it.","w":"If you have one load balancer, one database, one region, one DNS provider or even one engineer who knows the deploy process, each is a SPOF. Redundancy adds spares: two or more of each component, ideally in different failure zones (servers, racks, availability zones, regions), with automatic failover. Availability “nines”: 99.9% ≈ 8.8 hours down per year; 99.99% ≈ 53 minutes.","y":"Interviewers always ask “what happens if X fails?” Finding and removing SPOFs is the core of high availability.","h":["Draw the request path end to end and ask “what if this dies?” for every box (DNS, CDN, LB, app, cache, DB, queue, third-party APIs).","Run at least 2 instances of stateless services across availability zones.","Use managed redundant components (multi-AZ databases, cloud load balancers).","Replicate stateful systems with automatic failover.","Remember hidden SPOFs: a shared config service, a single NAT gateway, one certificate, one person.","Components in series multiply availability: two 99.9% services in a chain ≈ 99.8%. Components in parallel improve it.","Test failover regularly (chaos engineering)."],"code":"Series:   A(99.9%) → B(99.9%)       = 0.999 × 0.999 ≈ 99.8%\nParallel: A(99%) or B(99%) both up? = 1 - (0.01 × 0.01) = 99.99%","e":"Many outages come from overlooked SPOFs: a single expired certificate, a single config push system, or one region. In 2021 a single faulty config change at Fastly briefly took down major sites like Amazon, Reddit and the UK government’s website.","p":["Redundant app servers but one database with no standby","Two instances in the same availability zone","Forgetting third-party dependencies like payment or SMS providers"],"v":["Failover","Redundancy is HAVING spare components. Failover is the act of SWITCHING to them when the primary fails."],"f":["Map the request path","!Find single components","Add replicas across zones","Automate + test failover"],"q":[["How do you find SPOFs?","Trace the full request path and dependencies and ask what happens if each component fails."],["How does chaining services affect availability?","Availabilities multiply, so a chain of components is less available than any single one."],["How much downtime per year is 99.99%?","About 53 minutes."]]},{"n":156,"c":"arch","t":"How to Approach a System Design Interview","s":"A simple step-by-step framework: clarify requirements, estimate, sketch a high-level design, go deep on key parts, then discuss trade-offs and failures.","w":"System design interviews (usually 45–60 minutes) test how you think, not whether you know one “correct” design. The interviewer gives a vague prompt like “Design WhatsApp” or “Design a URL shortener” and watches how you clarify, structure, make trade-offs and communicate.","y":"Many strong engineers fail by jumping straight into drawing boxes or going deep on one detail and running out of time. A framework keeps you organised and shows senior-level thinking.","h":["Clarify requirements (5 min): functional (what features?) and non-functional (scale, latency, availability, consistency). Agree on scope out loud.","Estimate (3–5 min): users, QPS, read/write ratio, storage. Keep it rough.","Define the API (3 min): key endpoints or events, e.g. POST /shorten, GET /{code}.","Data model (3–5 min): main entities, which database and why.","High-level design (10 min): client → LB → services → cache → DB → queue → workers. Walk through one request end to end.","Deep dive (10–15 min): pick the hardest 1–2 parts (feed fan-out, hot keys, consistency, ID generation) and go deep.","Bottlenecks and failures (5 min): SPOFs, scaling, monitoring, what breaks at 10× traffic.","Throughout: think out loud, state trade-offs (“I’d choose X because…, the downside is…”), and check in with the interviewer."],"code":"Design a URL shortener (sketch)\nReq: shorten, redirect, 100M new links/month, 100:1 reads\nAPI: POST /links {url} → {code}   GET /{code} → 301\nIDs: Snowflake → base62 (7 chars)\nDB:  links(code PK, url, created_at) – key-value fits\nCache: Redis for hot codes; CDN for redirects\nScale: read-heavy → cache + replicas; analytics via queue","e":"Typical interview prompts: URL shortener, rate limiter, chat app (WhatsApp), news feed (Twitter/Instagram), ride sharing (Uber), video streaming (YouTube/Netflix), notification system, distributed cache, web crawler, payment system, typeahead/autocomplete. Every one of them reuses topics in this guide.","p":["Jumping into a solution without asking questions","Going deep on one component and never finishing the big picture","Listing technologies without saying why","Never mentioning trade-offs or failure cases","Silent thinking; the interviewer can’t grade what they can’t hear"],"v":["Coding Interview","A coding interview has a correct answer that passes tests. A system design interview has many acceptable answers; you’re graded on clarity, trade-offs, communication and depth."],"f":["Clarify requirements","Estimate + API + data model","High-level design","Deep dive + trade-offs + failures"],"q":[["What should you do in the first 5 minutes?","Ask clarifying questions to pin down functional and non-functional requirements and agree on scope."],["How do you show seniority in a design interview?","Discuss trade-offs and alternatives, estimate scale, identify bottlenecks and failure modes, and justify each choice."],["What topics come up in almost every design?","Load balancing, caching, database choice and scaling (replicas/sharding), queues for async work, IDs, consistency trade-offs and monitoring."],["What if you don’t know a specific technology?","Describe the capability you need (e.g. “a durable log-based queue”) and its trade-offs; concepts matter more than brand names."]]}];

const KEY="system-design-guide-v3", THEME_KEY="system-design-guide-theme", STREAK_KEY="sd-metro-streak";

function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x)return{learned:(x.learned||[]).filter(n=>byN(n)),last:Number.isInteger(x.lastTopic)?x.lastTopic:null};
  const old=JSON.parse(localStorage.getItem("system-design-guide-v2")||localStorage.getItem("sd-learned")||"null");if(old)return{learned:(Array.isArray(old)?old:old.learned||[]).filter(n=>byN(n)),last:null};}catch(e){}return{learned:[],last:null}}
const init=load();
let learned=new Set(init.learned), last=init.last, current=0, filter="all", query="", closed=new Set();
function save(){try{localStorage.setItem(KEY,JSON.stringify({learned:[...learned],lastTopic:last,updatedAt:new Date().toISOString()}))}catch(e){}}

/* streak */
function dayStr(d){return d.toISOString().slice(0,10)}
function bumpStreak(){let s={days:0,last:null};try{s=JSON.parse(localStorage.getItem(STREAK_KEY))||s}catch(e){}
  const today=dayStr(new Date()),y=dayStr(new Date(Date.now()-864e5));
  if(s.last!==today){s.days=(s.last===y)?s.days+1:1;s.last=today;try{localStorage.setItem(STREAK_KEY,JSON.stringify(s))}catch(e){}}
  return s.days}
function showStreak(){let s={days:0,last:null};try{s=JSON.parse(localStorage.getItem(STREAK_KEY))||s}catch(e){}
  const today=dayStr(new Date()),y=dayStr(new Date(Date.now()-864e5));const d=(s.last===today||s.last===y)?s.days:0;
  $("#streak").textContent="🔥 "+d+(d===1?" day":" days")}

/* progress */
function progress(){
  const c=learned.size,pct=Math.round(c/T.length*100);
  $("#ringFg").style.strokeDashoffset=169.6*(1-c/T.length);
  $("#ringTxt").textContent=pct+"%";
  $("#sideCount").textContent=c+" of "+T.length+" learned";
}

/* sidebar */
function renderSide(){
  const box=$("#lines");let html="",any=false;
  ORDER.forEach(k=>{
    const L=LINES[k];const all=inLine(k);
    const shown=all.filter(t=>(filter==="all"||(filter==="done")===learned.has(t.n))&&(!query||(t.t+" "+t.s).toLowerCase().includes(query)));
    if(!shown.length)return;any=true;
    const done=all.filter(t=>learned.has(t.n)).length;
    const isClosed=closed.has(k)&&!query;
    html+=`<div class="lgroup${isClosed?" closed":""}" style="--c:${L.c}"><button class="lhead" data-line="${k}" aria-expanded="${!isClosed}"><span class="sw"></span><b>${esc(L.name)}</b><em>${done}/${all.length}</em><span class="chev">▾</span></button><div class="stations">`+
      shown.map(t=>`<button class="st${learned.has(t.n)?" done":""}${t.n===current?" active":""}" data-n="${t.n}"><span class="no">${num(t.n)}</span><span>${esc(t.t)}${t.n>=NEW_FROM?' <span class="newtag">new</span>':""}</span></button>`).join("")+`</div></div>`;
  });
  box.innerHTML=any?html:`<div class="empty">No stations match. Clear the filter to see everything.</div>`;
}
$("#lines").addEventListener("click",e=>{
  const h=e.target.closest(".lhead");if(h){const k=h.dataset.line;closed.has(k)?closed.delete(k):closed.add(k);renderSide();return}
  const s=e.target.closest(".st");if(s){show(+s.dataset.n);closeSheet()}
});
$("#search").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();renderSide()});
$$(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$(".chip").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderSide()});

  <section class="hero">
    <h1>System design, one station at a time.</h1>
    <p>${T.length} ideas that real backend engineers use every day, in plain words. Each stop explains what it is, why it matters, exactly how to do it, the mistakes people make, and the questions you’ll get asked in interviews.</p>

      ${resume?`<button class="btn primary" id="goResume">Continue: ${esc(resume.t)}</button>`:`<button class="btn primary" id="goStart">Start at lesson 1: ${esc(byN(SEQ[0]).t)}</button>`}
      ${next&&resume&&next.n!==resume.n?`<button class="btn" id="goNext">Next unlearned: ${esc(next.t)}</button>`:""}

    <div class="map-top"><h2>The network</h2><span>${c} of ${T.length} stations visited · ${pct}%</span></div>
    <div class="map-scroll">${ORDER.map((k,i)=>{const L=LINES[k];return `<div class="mrow" style="--c:${L.c};--d:${(i*0.08).toFixed(2)}s"><div class="lbl"><i></i>${esc(L.name.split(" & ")[0])}</div><div class="track">${inLine(k).map(t=>`<button class="stn${learned.has(t.n)?" done":""}" data-n="${t.n}" aria-label="${esc(num(t.n)+". "+t.t)}${learned.has(t.n)?" (learned)":""}"><span class="tip">${esc(t.t)}</span></button>`).join("")}</div></div>`}).join("")}</div>
    <div class="map-legend"><span><b class="f"></b>Learned</span><span><b></b>Not yet</span><span>Tap any station to open it</span></div>

  <div class="howto">
    <div><b>Read it once</b><p>Idea, why, how. Every lesson is written for a beginner but goes deep enough for interviews.</p></div>

  $$(".stn").forEach(b=>b.onclick=()=>show(+b.dataset.n));

  $("#goStart")&&($("#goStart").onclick=()=>show(SEQ[0]));

  $("#goNew").onclick=()=>show((SEQ.map(byN).find(t=>t.n>=NEW_FROM&&!learned.has(t.n))||SEQ.map(byN).find(t=>t.n>=NEW_FROM)).n);

  progress();renderSide();updateDock();window.scrollTo({top:0});

/* lesson */
let tripTimer=null;
function playTrip(){
  clearInterval(tripTimer);const stops=$$(".tstop");if(!stops.length)return;
  stops.forEach(s=>s.classList.remove("on","passed"));
  if(reduce){stops.forEach(s=>s.classList.add("on","passed"));return}
  let i=0;const step=()=>{if(i>0)stops[i-1].classList.add("passed");if(i>=stops.length){clearInterval(tripTimer);return}stops[i].classList.add("on");i++};
  step();tripTimer=setInterval(step,750);
}
function show(n){
  const t=byN(n);if(!t)return;current=n;last=n;save();
  const L=LINES[t.c];document.documentElement.style.setProperty("--lc",L.c);
  const lineAll=inLine(t.c);const pos=lineAll.findIndex(x=>x.n===n)+1;
  const prev=nb(n,-1),next=nb(n,1);const isDone=learned.has(n);
  $("#main").innerHTML=`<article class="wrap lesson">
  <div class="crumbs"><span class="lbadge"><i>${pos}</i>${esc(L.name)} line</span><span>Station ${pos} of ${lineAll.length} · Lesson ${num(n)} of ${T.length}</span></div>
  <h1>${esc(t.t)}</h1>
  <p class="tldr">${esc(t.s)}</p>
  <nav class="jump" aria-label="On this page"><a href="#s-idea">The idea</a><a href="#s-why">Why it matters</a><a href="#s-how">How to do it</a><a href="#s-trip">The flow</a><a href="#s-story">Real story</a><a href="#s-oops">Mistakes</a><a href="#s-vs">Don’t mix up</a><a href="#s-quiz">Test yourself</a></nav>
  <section class="sec" id="s-idea"><h2><span class="ico">💡</span>The idea</h2><p class="prose">${esc(t.w)}</p></section>
  <section class="sec" id="s-why"><h2><span class="ico">🔥</span>Why it matters</h2><p class="prose">${esc(t.y)}</p></section>
  <section class="sec" id="s-how"><h2><span class="ico">🛠</span>How to do it, step by step</h2><ol class="steps">${t.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  ${t.code?`<div class="code"><div class="cbar"><i></i><i></i><i></i></div><button class="copy" id="copy">Copy</button><pre><code>${esc(t.code)}</code></pre></div>`:""}</section>
  <section class="sec" id="s-trip"><h2><span class="ico">🚇</span>The flow</h2><div class="trip"><div class="trip-row">${t.f.map(x=>{const bad=x.startsWith("!");return `<div class="tstop${bad?" bad":""}"><div class="dot"></div><div class="lab">${esc(bad?x.slice(1):x)}</div><div class="seg"></div></div>`}).join("")}</div>
  <div class="trip-foot"><span>Red stop = where things go wrong.</span><button class="mini" id="replay">↻ Replay</button></div></div></section>
  <section class="sec" id="s-story"><h2><span class="ico">🌍</span>Real-world story</h2><div class="story"><p>${esc(t.e)}</p></div></section>
  <section class="sec" id="s-oops"><h2><span class="ico">⚠️</span>Common mistakes</h2><ul class="oops">${t.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
  <section class="sec" id="s-vs"><h2><span class="ico">⚖️</span>Don’t mix it up</h2><div class="vs"><div class="side-a"><small>This lesson</small><b>${esc(t.t)}</b></div><div class="mid">vs</div><div class="side-b"><small>Often confused with</small><b>${esc(t.v[0])}</b></div><div class="txt">${esc(t.v[1])}</div></div></section>
  <section class="sec" id="s-quiz"><h2><span class="ico">🧠</span>Can you answer these?</h2><p class="prose" style="color:var(--muted);margin-bottom:14px">Say your answer out loud first, then tap the card to check.</p>
  <div class="cards">${t.q.map((x,i)=>`<button class="flip" data-i="${i}" aria-expanded="false"><div class="in"><div class="face front"><div class="q">${esc(x[0])}</div><div class="hint">Tap to reveal the answer</div></div><div class="face back"><div class="a">${esc(x[1])}</div></div></div></button>`).join("")}</div>
  <div class="score" id="score">0 of ${t.q.length} revealed</div></section>
  <section class="finish">
    <div class="row"><div><b style="font-family:var(--display);font-size:19px">${isDone?"You’ve learned this one.":"Could you explain this to a friend?"}</b><div class="note">${isDone?"Unmark it if you want to review it again later.":"If yes, mark it learned and the station lights up on your map."}</div></div>
    <button class="learnbtn${isDone?" is-done":""}" id="learn">${isDone?"✓ Learned · undo":"Mark as learned"}</button></div>
    <div class="navs"><button id="prevB" ${prev?"":"disabled"}><small>← Previous</small><b>${prev?esc(prev.t):"Start of the line"}</b></button><button class="nx" id="nextB" ${next?"":"disabled"}><small>Next →</small><b>${next?esc(next.t):"End of the network"}</b></button></div>
  </section>
  </article>`;
  $("#copy")&&($("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(t.code);$("#copy").textContent="Copied"}catch(e){$("#copy").textContent="Select & copy"}setTimeout(()=>$("#copy")&&($("#copy").textContent="Copy"),1500)});
  $("#replay").onclick=playTrip;
  const seen=new Set();
  $$(".flip").forEach(b=>b.onclick=()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",String(o));if(o)seen.add(b.dataset.i);$("#score").textContent=seen.size+" of "+t.q.length+" revealed"+(seen.size===t.q.length?" · nice, all checked":"")});
  $("#learn").onclick=()=>toggleLearned(n);
  $("#prevB").onclick=()=>prev&&show(prev.n);
  $("#nextB").onclick=()=>next&&show(next.n);
  renderSide();progress();updateDock();
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
  const act=$(".st.active");act&&act.scrollIntoView({block:"nearest"});
  setTimeout(playTrip,350);
}
function toggleLearned(n){
  const t=byN(n);
  if(learned.has(n)){learned.delete(n);save();toast("Unmarked. It’s back on your review list.")}
  else{learned.add(n);save();const d=bumpStreak();showStreak();confetti(LINES[t.c].c);
    const all=inLine(t.c);
    if(all.every(x=>learned.has(x.n)))toast("🎉 You finished the whole "+LINES[t.c].name+" line!");
    else if(learned.size===T.length)toast("🏆 All "+T.length+" stations. You’ve mapped the entire network.");
    else toast("Station learned · "+learned.size+" of "+T.length+(d>1?" · 🔥 "+d+"-day streak":""));}
  show(n);
}

/* dock */
function updateDock(){
  const inLesson=current>0;
  $("#dPrev").disabled=!inLesson||!nb(current,-1);$("#dNext").disabled=!inLesson||!nb(current,1);
  $("#dDone").disabled=!inLesson;$("#dDone").classList.toggle("hi",inLesson&&learned.has(current));
}
$("#dMap").onclick=()=>{closeSheet();home()};
$("#dList").onclick=()=>openSheet();
$("#dPrev").onclick=()=>{const x=nb(current,-1);x&&show(x.n)};
$("#dNext").onclick=()=>{const x=nb(current,1);x&&show(x.n)};
$("#dDone").onclick=()=>current&&toggleLearned(current);
function openSheet(){$("#side").classList.add("open");$("#scrim").classList.add("open");const a=$(".st.active");a&&a.scrollIntoView({block:"center"})}
function closeSheet(){$("#side").classList.remove("open");$("#scrim").classList.remove("open")}
$("#scrim").onclick=closeSheet;
$("#brand").onclick=home;

/* palette */
let palSel=0,palItems=[];
function openPal(){$("#pal").classList.add("open");$("#palIn").value="";renderPal();$("#palIn").focus();setTimeout(()=>$("#palIn").focus(),20)}
function closePal(){$("#pal").classList.remove("open")}
function renderPal(){
  const q=$("#palIn").value.trim().toLowerCase();
  palItems=(q?T.filter(t=>(t.t+" "+t.s+" "+LINES[t.c].name).toLowerCase().includes(q)).sort((a,b)=>(b.t.toLowerCase().includes(q))-(a.t.toLowerCase().includes(q))):SEQ.map(byN).filter(t=>!learned.has(t.n)).slice(0,8)).slice(0,30);
  palSel=0;
  $("#palRes").innerHTML=palItems.length?palItems.map((t,i)=>`<button class="pr" role="option" aria-selected="${i===0}" data-n="${t.n}" style="--c:${LINES[t.c].c}"><i></i><div><b>${num(t.n)}. ${esc(t.t)}${learned.has(t.n)?" ✓":""}</b><span>${esc(t.s)}</span></div></button>`).join(""):`<div class="empty">Nothing found for “${esc(q)}”. Try a shorter word.</div>`;
  $$(".pr").forEach(b=>b.onclick=()=>{closePal();show(+b.dataset.n)});
}
function movePal(d){if(!palItems.length)return;palSel=(palSel+d+palItems.length)%palItems.length;$$(".pr").forEach((b,i)=>b.setAttribute("aria-selected",String(i===palSel)));$$(".pr")[palSel].scrollIntoView({block:"nearest"})}
$("#openPal").onclick=openPal;
$("#palIn").addEventListener("input",renderPal);
$("#pal").addEventListener("click",e=>{if(e.target.id==="pal")closePal()});
$("#palIn").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){e.preventDefault();movePal(1)}else if(e.key==="ArrowUp"){e.preventDefault();movePal(-1)}else if(e.key==="Enter"&&palItems[palSel]){closePal();show(palItems[palSel].n)}});

/* keys + swipe */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();return}
  if(e.key==="Escape"){closePal();closeSheet();return}
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);if(typing||$("#pal").classList.contains("open"))return;
  if(e.key==="/"){e.preventDefault();openPal()}
  else if(e.key==="ArrowRight"&&current&&nb(current,1))show(nb(current,1).n);
  else if(e.key==="ArrowLeft"&&current&&nb(current,-1))show(nb(current,-1).n);
  else if(e.key.toLowerCase()==="l"&&current)toggleLearned(current);
});
let sx=0,sy=0,st=0;
$("#main").addEventListener("touchstart",e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now()},{passive:true});
$("#main").addEventListener("touchend",e=>{if(!current)return;const p=e.changedTouches[0];const dx=p.clientX-sx,dy=p.clientY-sy;
  if(Date.now()-st<600&&Math.abs(dx)>90&&Math.abs(dy)<50&&!e.target.closest(".code,.map-scroll,.jump")){if(dx<0&&nb(current,1))show(nb(current,1).n);else if(dx>0&&nb(current,-1))show(nb(current,-1).n)}},{passive:true});

/* read progress */
addEventListener("scroll",()=>{const h=document.documentElement;const max=h.scrollHeight-h.clientHeight;$("#readbar").style.width=(current&&max>0?(h.scrollTop/max*100):0)+"%"},{passive:true});

/* toast */
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2600)}

/* confetti */
function confetti(color){
  if(reduce)return;const cv=$("#confetti"),cx=cv.getContext("2d");const dpr=devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cx.scale(dpr,dpr);
  const cols=[color,"#ffffff",...ORDER.map(k=>LINES[k].c)];const P=[];const ox=innerWidth/2,oy=innerHeight*0.75;
  for(let i=0;i<120;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6,v=7+Math.random()*9;P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:3+Math.random()*4,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,round:Math.random()<.4})}
  let f=0;(function tick(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;if(p.round){cx.beginPath();cx.arc(0,0,p.r,0,7);cx.fill()}else cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
    if(++f<110)requestAnimationFrame(tick);else cx.clearRect(0,0,innerWidth,innerHeight)})();
}

/* theme */
function applyTheme(m){if(m)document.documentElement.dataset.theme=m;const dark=m?m==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme").textContent=dark?"☀︎":"☾";$("#theme").setAttribute("aria-label",dark?"Switch to light theme":"Switch to dark theme");
  document.querySelector('meta[name="theme-color"]').content=dark?"#0E1430":"#F2F4FA"}
let th=null;try{th=localStorage.getItem(THEME_KEY)}catch(e){}
applyTheme(th==="light"||th==="dark"?th:null);
$("#theme").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=dark?"light":"dark";applyTheme(n);try{localStorage.setItem(THEME_KEY,n)}catch(e){}};

$("#brandCount").textContent=T.length+" stations";
showStreak();home();
</script>
</body>
</html>
