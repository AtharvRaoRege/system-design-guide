,"Each step within limits"],"q":[["How do you handle file uploads larger than the function payload limit?","Have clients upload directly to object storage using pre-signed URLs, then process the stored file by reference."],["Why limit function concurrency?","To protect downstream systems like databases from being overwhelmed by massive parallel scaling."],["What do you do with tasks longer than the max execution time?","Break them into steps orchestrated by a workflow engine, or run them on containers/batch services."]]},{"n":89,"c":"scale","t":"Latency","s":"How long one request takes, from the user’s action until they get a result.","w":"Latency is measured in milliseconds per operation. It adds up across the whole path: DNS lookup, TCP/TLS handshake, network travel, load balancer, app code, database queries, external APIs, and rendering on the device. Useful reference numbers: memory access ~100 ns, SSD read ~100 µs, same-datacenter round trip ~0.5 ms, India to US round trip ~200+ ms.","y":"Users feel latency directly. Studies by Amazon and Google linked even 100 ms delays to fewer sales and searches. A backend that handles huge volume but takes 3 s per page still feels broken.","h":["Measure end to end and per hop (tracing shows where the time goes).","Look at percentiles (p50, p95, p99), not just the average.","Reduce round trips: batch queries, fix N+1, combine API calls.","Do independent calls in parallel instead of one after another.","Cache hot data and move content closer to users (CDN, edge, regional deployments).","Keep connections warm (keep-alive, connection pooling) to avoid repeated handshakes.","Move slow non-essential work to background queues.","Optimize payloads: compress, paginate, send only needed fields."],"code":"# serial: 120 + 80 + 100 = 300 ms\na = get_user(); b = get_orders(); c = get_reco()\n# parallel: max(120, 80, 100) = 120 ms\na, b, c = await gather(get_user(), get_orders(), get_reco())","e":"Amazon famously found that every 100 ms of extra latency cost about 1% in sales, which is why its pages are aggressively optimized and cached.","p":["Only watching averages","Serial calls that could be parallel","Ignoring network distance by putting the DB in another region from the app"],"v":["Throughput","Latency = how LONG one request takes. Throughput = how MANY requests per second you handle. Improving one doesn’t automatically improve the other."],"f":["User taps","Network + TLS","App + DB + APIs","Result shown: total = latency"],"q":[["Why use percentiles instead of averages for latency?","Averages hide slow outliers; percentiles show what the slowest users actually experience."],["Name three ways to reduce latency.","Parallelize independent calls, cache/move data closer to users, and reduce round trips (batching, fixing N+1)."],["Why does geography matter?","Signals are limited by the speed of light; cross-continent round trips add hundreds of milliseconds."]]},{"n":90,"c":"scale","t":"Throughput","s":"How much work your system finishes per unit of time, like requests per second or orders per minute.","w":"If a checkout service completes 2,000 orders per second, that’s its throughput. It’s limited by the bottleneck: the slowest component in the path (CPU, DB writes, a lock, an external API’s rate limit). Little’s Law connects things: concurrent requests = throughput × latency. So 1,000 req/s at 0.2 s each means about 200 requests in progress at any moment.","y":"Big events (sales, launches, IPL finals) need a known capacity. If your throughput tops out at 500 req/s and 2,000 arrive, queues grow, latency explodes and requests fail.","h":["Load test (k6, Locust, Gatling, JMeter) to find maximum sustainable throughput.","Find the bottleneck: watch CPU, DB, connection pools, locks, queue depth during the test.","Increase parallelism: more instances, more workers, async IO.","Batch work: insert 1,000 rows in one statement instead of 1,000 statements.","Remove contention: hot rows, global locks, single-threaded parts.","Use queues to accept bursts and process at steady throughput.","Remember throughput beyond a point increases latency sharply (queues form near 100% utilization). Keep headroom."],"e":"During Flipkart’s Big Billion Days, teams load-test months ahead to make sure order throughput can handle many times normal peak.","p":["Testing with unrealistic data or traffic patterns","Running systems near 100% utilization","Scaling app servers while a single DB lock limits throughput"],"v":["Latency","Throughput = volume per second. Latency = time per request. Little’s Law links them: in-flight requests = throughput × latency."],"f":["Requests arrive","Pass through components","!Bottleneck caps rate","Fix bottleneck → higher req/s"],"q":[["What is Little’s Law?","L = λ × W: average items in the system equals arrival rate times average time in the system."],["What determines a system’s maximum throughput?","Its bottleneck: the most constrained resource in the request path."],["Why not run systems at 100% utilization?","Queueing delay grows rapidly as utilization approaches 100%, making latency explode."]]},{"n":91,"c":"scale","t":"P99 Latency","s":"The time within which 99% of requests finish. The slowest 1% take longer.","w":"Sort a minute’s worth of request times from fastest to slowest. p50 (median) is the middle one. p99 is the value 99% of the way up the list. If p99 = 800 ms, 1 in 100 requests takes 800 ms or more. Related: p95, p99.9 (“three nines” tail).","y":"Averages lie. An average of 100 ms can hide a p99 of 3 seconds. And a single page load often makes dozens of requests, so most users hit that slow 1% at least once per session. Heavy users (often your best customers) hit it most.","h":["Record latencies in histograms (Prometheus histograms, HdrHistogram, OpenTelemetry), not averages.","Don’t average percentiles across servers; aggregate the histograms instead.","Set SLOs on p95/p99, e.g. “99% of checkout requests under 500 ms”.","When p99 is high, look for causes that affect a few requests: GC pauses, cold caches, lock contention, noisy neighbours, slow dependencies, large customers with huge data.","Look at traces of the slowest requests specifically.","Use enough data: p99 of 20 requests is meaningless."],"code":"histogram_quantile(0.99,\n  sum(rate(http_request_duration_seconds_bucket[5m])) by (le))","e":"Amazon measures p99.9 for many services, because their biggest customers, with the most data, tend to experience the slowest requests.","p":["Averaging p99s from multiple servers","Showing only mean latency on dashboards","Calculating percentiles over too few samples"],"v":["Average Latency","Average mixes everything and hides outliers. P99 shows the experience of your slowest 1%, which is what users complain about."],"f":["Collect request times","Sort fast → slow","Take 99th percentile","Alert when it crosses SLO"],"q":[["Why can’t you average p99 values from several servers?","Percentiles aren’t additive; you must combine the underlying distributions (histograms) and compute the percentile from them."],["Why does p99 matter even though it’s only 1%?","Pages make many requests, so most users encounter at least one slow request; and heavy users hit tails more."],["Name common causes of high p99.","GC pauses, lock contention, cache misses, slow dependencies, queueing and large data for specific users."]]},{"n":92,"c":"scale","t":"Tail Latency","s":"The slow end of response times, which gets dramatically worse when one request depends on many backend calls.","w":"If a request fans out to 100 servers and must wait for all of them, its speed equals the SLOWEST of the 100. Even if each server is slow only 1% of the time, the chance that at least one of 100 is slow is about 63%. Tail latency is about controlling these rare slow responses.","y":"Large systems (search, feeds, microservices) fan out a lot. Rare slowness at each step becomes common slowness for the user.","h":["Reduce fan-out: fewer dependencies per request, aggregate data in advance.","Set tight timeouts per call and return partial results when sensible (show the page without recommendations).","Hedged requests: if a reply is slower than the p95, send a duplicate to another replica and use whichever answers first (only for idempotent reads, with a budget).","Remove sources of variance: GC tuning, avoid noisy neighbours, warm caches, background jobs off hot servers.","Use load balancing that avoids slow or overloaded instances (least-outstanding requests).","Track p99 and p99.9 per dependency."],"e":"Google’s paper “The Tail at Scale” showed that hedged requests to a second replica after a short delay cut the 99.9th percentile latency dramatically with only a few percent extra load.","p":["Waiting for every dependency even when some are optional","Hedging everything and doubling load","Optimizing averages while tails stay terrible"],"v":["P99 Latency","Tail latency is the general PROBLEM of slow outliers. P99 is one METRIC to measure it."],"f":["Request fans out to 100","!One replica slow","Whole request waits","Fix: timeouts, hedging, partial results"],"q":[["Why does fan-out amplify tail latency?","The request waits for the slowest call; with many calls, the probability that at least one is slow becomes high."],["What is a hedged request?","Sending a backup copy of a slow request to another replica after a delay and using the first response."],["How can partial results help?","If optional parts are slow, return the page without them rather than making everyone wait."]]},{"n":93,"c":"dist","t":"Network Partitions","s":"When parts of your system are running fine but can’t talk to each other because the network between them failed.","w":"A switch fails, a cable is cut, a cloud zone loses connectivity, or a firewall change blocks traffic. Both sides are alive, but each thinks the other is dead. The tricky part: a slow network looks exactly like a dead server. You can’t tell the difference from the outside.","y":"If both sides keep acting alone, you can get two leaders, double-booked inventory or conflicting writes (split-brain). If both stop, you get an outage. You must decide in advance which happens.","h":["Assume partitions WILL happen; test them (chaos tools, iptables rules, Toxiproxy).","Use timeouts; never wait forever on another node.","Use quorum/majority rules: only the side with a majority of nodes may elect a leader or accept writes.","Use fencing tokens so a node cut off from the cluster can’t keep writing.","Decide per feature: refuse (consistency) or accept and reconcile later (availability).","Plan the healing: how do conflicting changes get merged when the partition ends?"],"e":"In 2012, a network issue at GitHub caused their MySQL cluster’s failover tooling to promote replicas incorrectly, leading to data inconsistency and a long cleanup.","p":["Treating a timeout as proof the other node is dead","Two-node clusters with no tie-breaker","No plan for reconciling data after healing"],"v":["CAP Theorem","A partition is the FAILURE itself. CAP is the THEORY of what you must choose (consistency or availability) while it lasts."],"f":["Nodes A, B | C","!Link between them cut","Majority side (A,B) continues","Minority (C) stops writes"],"q":[["Why can’t a node distinguish a partition from a crash?","In both cases it just stops receiving replies; slow, dead and unreachable look the same."],["How do quorums handle partitions?","Only the side with a majority may make decisions, so at most one side can act."],["What is split-brain?","Two parts of a cluster each believing they’re in charge and accepting conflicting changes."]]},{"n":94,"c":"dist","t":"Clock Skew","s":"Different machines' clocks show slightly different times, so timestamps from different servers can’t be fully trusted for ordering.","w":"Every server’s clock drifts. NTP keeps them close, typically within milliseconds, but sometimes much worse (VM pauses, misconfigured NTP, leap seconds). If server A’s clock is 2 seconds ahead of B’s, an event on A can look like it happened after a later event on B.","y":"Clock skew breaks “last write wins” (the newest change might lose), makes JWTs appear expired or not-yet-valid, confuses log timelines during incidents, and breaks distributed locks that rely on time.","h":["Run NTP (chrony) everywhere and monitor clock offset.","Allow small leeway when validating time-based tokens (e.g. 30–60 s for exp/nbf).","Don’t use wall-clock timestamps to order events across machines. Use sequence numbers from a single source, version numbers, logical clocks (Lamport) or vector clocks.","Use monotonic clocks to measure durations inside one machine (they never jump backwards).","Store timestamps in UTC.","For strong global ordering, systems like Google Spanner use TrueTime, with GPS/atomic clocks and explicit uncertainty intervals."],"code":"# measuring duration: use monotonic, not wall clock\nstart = time.monotonic()\ndo_work()\nelapsed = time.monotonic() - start","e":"A leap second in 2012 made Linux servers' clocks misbehave; Reddit, LinkedIn and others had outages as Java processes spun CPUs at 100%.","p":["Last-write-wins using timestamps from different servers","Measuring timeouts with the wall clock (it can jump)","Zero tolerance on token expiry checks"],"v":["Distributed Tracing","Traces show timing per span, but cross-machine timestamps can be skewed. Traces rely on parent/child links (not clock order) to show causality."],"f":["A writes at 10:00:02 (fast clock)","B writes later at 10:00:01","!Last-write-wins keeps A (wrong)","Fix: version numbers / logical clocks"],"q":[["Why is last-write-wins dangerous with clock skew?","The write with the higher timestamp wins, but a fast clock can make an older write look newer, discarding the real latest update."],["Monotonic vs wall clock?","Wall clock shows calendar time and can jump; monotonic only moves forward and is right for measuring durations."],["What is a Lamport clock?","A logical counter incremented on events and updated on messages, giving an ordering consistent with causality without real time."]]},{"n":95,"c":"rel","t":"Multi-Region Deployment","s":"Running your system in more than one geographic region, for lower latency worldwide and survival of a whole-region outage.","w":"A region is a cluster of data centres in one area (e.g. Mumbai, Singapore, Virginia). Single-region setups go down if that region has a major outage. Multi-region options: active-passive (one region serves, another is on standby) or active-active (all regions serve traffic). The hard part is always the data.","y":"Whole regions do fail occasionally. Global users far from your one region get slow responses. Some laws require data to stay in a country (data residency).","h":["Start with multi-AZ (zones within one region); it covers most failures cheaply.","Decide your targets (RTO/RPO) before choosing a design.","Active-passive: replicate data asynchronously to standby, practice failover. Simpler; small data loss possible.","Active-active: route users to the nearest region (latency-based DNS, anycast); handle write conflicts (single-writer per user/home region, or databases built for it like Spanner, CockroachDB, DynamoDB Global Tables).","Pin each user’s data to a home region to avoid cross-region writes.","Replicate everything needed: images, configs, secrets, queues, not just the DB.","Run failover drills regularly.","Consider data residency rules."],"e":"During a major AWS us-east-1 outage, companies running only in that region were down for hours, while multi-region companies shifted traffic and stayed mostly up.","p":["Hidden single-region dependencies (auth, DNS, a config service)","Never testing failover","Active-active writes without a conflict strategy"],"v":["Failover","Multi-region is the SETUP (resources in many regions). Failover is the ACTION of moving traffic when one fails. Having regions doesn’t guarantee failover works."],"f":["Users routed to nearest region","Data replicated across regions","!Region outage","Traffic shifts to healthy region"],"q":[["Active-active vs active-passive?","Active-active serves traffic from all regions simultaneously; active-passive keeps a standby region that takes over on failure."],["What’s the hardest part of multi-region?","Data: replication lag, write conflicts and consistency across regions."],["Why do multi-AZ before multi-region?","It covers common failures with much less complexity and cost."]]},{"n":96,"c":"rel","t":"Failover","s":"Automatically or manually switching to a backup component when the main one fails.","w":"Primary database dies → a replica is promoted. Load balancer node fails → the standby takes its IP. Region goes down → DNS points users to another region. Failover involves detecting the failure, choosing the replacement, redirecting traffic, and later restoring redundancy.","y":"Without failover, one component’s failure becomes a full outage until a human wakes up and fixes it.","h":["Define RTO (how long you can be down) and RPO (how much data you can lose); they decide your design.","Use health checks with sensible thresholds to detect failure.","Automate failover where possible (managed DBs like RDS Multi-AZ, Patroni for Postgres), but avoid flapping.","Prevent split-brain: fence the old primary so it can’t accept writes if it comes back.","Make clients reconnect: DNS TTLs, connection retry logic, stable endpoints.","Test failover regularly in production-like environments; untested failover usually fails.","After failover, restore redundancy quickly; you’re now running without a spare."],"e":"Amazon RDS Multi-AZ promotes the standby within about a minute or two and updates the DNS endpoint; apps that retry connections recover automatically.","p":["Apps caching the old DB IP forever","Automatic failover on brief blips, causing more downtime than the blip","The old primary waking up and accepting writes"],"v":["Backups","Failover keeps the service RUNNING using a live standby. Backups RESTORE data after corruption or deletion. Failover won’t save you from DELETE FROM users, because the standby copies it."],"f":["Primary healthy","!Primary fails health checks","Promote replica, fence old","Clients reconnect to new primary"],"q":[["What are RTO and RPO?","RTO: maximum acceptable downtime. RPO: maximum acceptable data loss, measured in time."],["What is fencing in failover?","Ensuring the old primary can’t accept writes after a new one is promoted, e.g. by cutting its access or using tokens."],["Why must failover be tested?","Configurations drift and assumptions break; untested failover often fails when it’s needed most."]]},{"n":97,"c":"rel","t":"Backups","s":"Separate, saved copies of your data from different points in time that you can restore after loss, corruption or deletion.","w":"Types: full (everything), incremental (changes since the last backup), and continuous / point-in-time recovery (base backup + transaction logs, so you can restore to e.g. 14:32:10 yesterday, just before the bad command). Backups should be stored separately from production: another account, another region.","y":"Replication instantly copies mistakes and ransomware encryption to replicas. Only backups let you go back in time. Data loss can end a company.","h":["Follow 3-2-1: 3 copies, on 2 different media/services, 1 off-site (another region or account).","Automate backups and enable point-in-time recovery for databases.","Encrypt backups and restrict who can delete them; use immutable/locked backups (object lock) against ransomware.","TEST RESTORES regularly. A backup you’ve never restored is a hope, not a backup.","Measure how long a restore takes; that’s part of your RTO.","Back up more than databases: object storage, configs, secrets, infrastructure code.","Set retention that meets business and legal needs."],"e":"In 2017 GitLab accidentally deleted a production database directory and found that several of its backup methods weren’t working. They recovered from a 6-hour-old snapshot taken almost by luck, and lost hours of data.","p":["Never testing restores","Backups in the same account an attacker can delete","Assuming replicas are backups","Unknown restore time"],"v":["Replication","Replication = a live copy that follows every change, including mistakes. Backup = a frozen copy from the past you can return to."],"f":["Nightly base backup + logs","Copied to separate account","!Bad DELETE at 14:32","Restore to 14:31 point in time"],"q":[["What is the 3-2-1 backup rule?","Keep 3 copies of data on 2 different storage types, with 1 copy off-site."],["Why are replicas not backups?","They replicate every change, including accidental deletes and corruption, almost instantly."],["What is point-in-time recovery?","Restoring a database to any specific moment by replaying transaction logs on top of a base backup."]]},{"n":98,"c":"rel","t":"Disaster Recovery","s":"A practiced plan for bringing your whole system back after a major failure: region outage, data corruption, ransomware or human error.","w":"Disaster recovery (DR) combines technology (backups, replicas, infrastructure as code) and process (runbooks, roles, communication). Common strategies by cost and speed: backup & restore (cheapest, slowest), pilot light (core data replicated, rest built on demand), warm standby (scaled-down copy running), and multi-site active-active (fastest, most expensive).","y":"In a real disaster, people panic, documentation is missing, and things take 10× longer than expected. Planning and rehearsal turn days of chaos into hours of procedure.","h":["Set RTO and RPO per system based on business impact.","Choose a DR strategy that meets them at acceptable cost.","Write runbooks: step-by-step recovery instructions anyone on call can follow.","Map dependencies: DNS, identity provider, secrets, third-party APIs; DR fails if any is missing.","Keep infrastructure as code so environments can be rebuilt.","Store backups and credentials where a disaster (or attacker) in the main account can’t reach them.","Run DR drills (game days) at least yearly; fix what breaks.","Plan communication: status page, customers, internal roles."],"e":"After a fire destroyed an OVHcloud data centre in Strasbourg in 2021, customers with off-site backups recovered; some with backups stored in the same building lost data permanently.","p":["Backups in the same location as production","A runbook that’s never been executed","Forgetting dependencies like DNS or SSO"],"v":["Backups","Backups are one INGREDIENT. Disaster recovery is the full RECIPE: infrastructure, people, runbooks, dependencies, targets and practice."],"f":["!Disaster declared","Follow runbook, assign roles","Rebuild infra + restore data","Verify, switch traffic, communicate"],"q":[["Name four DR strategies from cheapest to fastest.","Backup & restore, pilot light, warm standby, multi-site active-active."],["What is a DR drill?","A planned exercise simulating a disaster to test recovery procedures and find gaps."],["Why map dependencies in DR planning?","Recovery fails if a required service (DNS, identity, secrets, third-party API) is unavailable or forgotten."]]},{"n":99,"c":"rel","t":"Chaos Engineering","s":"Deliberately causing small, controlled failures to prove your system handles them before real failures surprise you.","w":"You form a hypothesis (“if one payment pod dies, checkout success stays above 99.5%”), inject a failure (kill a pod, add 300 ms latency, block a dependency, fill a disk), and observe. If the hypothesis fails, you’ve found a weakness safely. Tools: Chaos Monkey, Gremlin, LitmusChaos, AWS Fault Injection Service, Chaos Mesh.","y":"Retries, timeouts, failover and fallbacks are often never exercised until a real outage, and that’s when you discover they don’t work.","h":["Start with good monitoring; you can’t run experiments you can’t observe.","Define steady state (normal metrics) and a clear hypothesis.","Start small: one instance, in staging, during work hours with the team watching.","Limit blast radius and have an abort button / stop conditions.","Gradually move to production with tiny scope once confident.","Fix findings and turn experiments into regular automated tests.","Run game days where teams practice incident response too."],"e":"Netflix’s Chaos Monkey randomly terminates production instances during business hours, forcing every service to tolerate instance loss. When AWS had major outages, Netflix often stayed up.","p":["Running chaos without monitoring or an abort plan","Starting with huge production experiments","Finding problems and never fixing them"],"v":["Disaster Recovery","DR plans how to RECOVER after a big failure. Chaos engineering TESTS resilience proactively with small failures, often revealing gaps in DR plans."],"f":["Hypothesis: survive pod loss","Inject failure (small scope)","Observe metrics","Weakness found → fix"],"q":[["What are the steps of a chaos experiment?","Define steady state, form a hypothesis, inject a controlled failure, observe, then fix and repeat."],["What is blast radius?","How much of the system or user base an experiment can affect; keep it small at first."],["Why run chaos in production at all?","Production has real traffic, configs and dependencies that staging can’t fully reproduce."]]},{"n":100,"c":"obs","t":"Logging","s":"Recording what your application does (events, errors, important actions) so you can figure out what happened later.","w":"Logs are timestamped records like \"payment failed for order 42: card declined\". Modern systems use structured logs (JSON with fields) shipped to a central place (ELK/OpenSearch, Loki, Datadog, Cloud Logging) where you can search across all servers. Levels (DEBUG, INFO, WARN, ERROR) control detail.","y":"When a user says \"my payment failed at 3:14 PM\", logs are how you find out why. Without central, structured logs you’re SSH-ing into servers grepping text files.","h":["Log in structured JSON with consistent field names.","Include context: request/correlation ID, user ID (not personal details), route, duration, error type.","Use levels properly: ERROR = needs attention; INFO = important business events; DEBUG = off in production by default.","Log errors once, with the stack trace, at the boundary where they’re handled.","Never log passwords, tokens, card numbers or full personal data; add automatic redaction.","Centralize logs and set retention periods (cost!).","Sample high-volume noisy logs."],"code":"{\"ts\":\"2026-10-19T09:14:03Z\",\"level\":\"error\",\n \"msg\":\"payment failed\",\"request_id\":\"req_8f2a\",\n \"order_id\":42,\"provider\":\"razorpay\",\n \"error\":\"card_declined\",\"duration_ms\":812}","e":"A team couldn’t debug intermittent checkout failures for weeks. After adding request IDs to every log line, they traced a failing request through 4 services in minutes.","p":["Logging secrets and personal data","Unstructured text you can’t query","Logging everything at DEBUG in production (huge bills, noise)","Logging the same error at every layer"],"v":["Metrics","Logs = detailed individual EVENTS (why did THIS fail?). Metrics = numbers over time (HOW OFTEN is it failing?). Metrics alert you; logs explain."],"f":["Event happens","Write structured JSON log","Ship to central store","Search by request_id"],"q":[["Why structured logging?","Fields can be filtered, aggregated and queried reliably, unlike free-form text."],["What should never be logged?","Passwords, tokens, secrets, full card numbers and unnecessary personal data."],["What is a correlation/request ID used for in logs?","Linking all log lines from one request across services so you can follow its path."]]},{"n":101,"c":"obs","t":"Monitoring","s":"Continuously measuring your system’s health and alerting someone when something important goes wrong.","w":"Monitoring collects signals (metrics, health checks, synthetic tests), shows them on dashboards and triggers alerts on rules. Two popular frameworks: the Four Golden Signals (latency, traffic, errors, saturation) and RED for services (Rate, Errors, Duration). USE for resources (Utilization, Saturation, Errors).","y":"Without monitoring, users become your alerting system, and you find out about outages from Twitter.","h":["Monitor from the user’s view first: request success rate and latency per key endpoint.","Add golden signals for every service, plus resource metrics (CPU, memory, disk, connections).","Add business metrics: orders per minute, sign-ups, payment success rate. They catch issues technical metrics miss.","Use synthetic checks (scripted logins/checkouts from outside) to catch problems even at low traffic.","Build a few clear dashboards per service, not hundreds.","Alert on symptoms users feel; keep cause metrics on dashboards for diagnosis.","Monitor the monitoring (is data still arriving?)."],"e":"A payment provider’s API kept returning 200 OK but with a “failed” status inside. Technical metrics looked green; a “payment success rate” business metric caught the drop within minutes.","p":["Only CPU/memory monitoring","Dashboards nobody looks at","No external checks, so a DNS or certificate failure goes unnoticed"],"v":["Observability","Monitoring watches for problems you KNOW to look for. Observability lets you investigate problems you DIDN’T predict, using rich, connected telemetry."],"f":["Collect metrics + checks","Dashboards","Rule crosses threshold","Alert to on-call"],"q":[["What are the four golden signals?","Latency, traffic, errors and saturation."],["Why monitor business metrics?","They reflect real user outcomes and can catch failures that technical metrics miss."],["What are synthetic checks?","Automated scripts that simulate user actions from outside to verify the system works end to end."]]},{"n":102,"c":"obs","t":"Distributed Tracing","s":"Following a single request as it travels through many services, with timing for each step.","w":"When a request enters, it gets a trace ID. Every service it touches creates a span (name, start time, duration, attributes) and passes the trace ID along in headers (W3C traceparent). A tracing backend (Jaeger, Tempo, Zipkin, Honeycomb, Datadog) stitches spans into a waterfall chart showing exactly where time went and where errors happened. OpenTelemetry is the standard way to instrument.","y":"In microservices, “checkout is slow” could be any of 12 services. Logs from each service don’t show the chain. A trace shows “80% of time was the inventory service waiting on a DB query”.","h":["Instrument with OpenTelemetry; auto-instrumentation covers HTTP, gRPC and DB clients for many languages.","Propagate context across every boundary, including message queues (put trace context in message headers).","Add useful attributes: route, user tier, order size (not personal data).","Sample to control cost: head sampling (keep X%) or tail sampling (keep all errors and slow traces).","Link logs and metrics to trace IDs so you can jump between them.","Look at the slowest traces to understand p99 problems."],"code":"traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01\n# trace id ───────────┘                       span id ┘","e":"Uber built Jaeger to debug requests crossing hundreds of microservices; a single trace could reveal that a slow ride request was caused by a retry loop in one small service.","p":["Context not propagated through queues, breaking traces","Keeping 100% of traces at high volume (cost)","Sampling that drops the rare error traces you actually need"],"v":["Logging","Logs record individual events in one place. Traces CONNECT the steps of one request across services with timing and parent-child structure."],"f":["Request gets trace ID","Gateway span → Order span","→ Payment span → DB span","Waterfall shows slow step"],"q":[["What’s the difference between a trace and a span?","A trace is the whole journey of one request; a span is one unit of work within it, with its own timing and parent."],["How is trace context passed between services?","In headers such as W3C traceparent (and in message metadata for queues)."],["Head vs tail sampling?","Head decides at the start (e.g. keep 10%); tail decides after completion, so it can keep all errors and slow traces."]]},{"n":103,"c":"obs","t":"Metrics","s":"Numbers measured over time, like requests per second, error rate or memory usage, that show trends and trigger alerts.","w":"Metric types: counter (only goes up, e.g. total requests; you look at its rate), gauge (goes up and down, e.g. memory in use, queue length), histogram (distribution of values, e.g. request durations, used for percentiles). Metrics have labels (route=“/checkout”, status=“500”). Tools: Prometheus, Grafana, Datadog, CloudWatch, OpenTelemetry.","y":"Metrics are cheap to store and fast to query compared to logs, so they’re ideal for dashboards, trends, capacity planning and alerts.","h":["Use counters for things that happen (requests, errors), gauges for current levels, histograms for latency and sizes.","Keep label cardinality low: never put user IDs, emails or full URLs with IDs as label values. Each unique combination is a new time series.","Name consistently with units (http_request_duration_seconds).","Measure RED per endpoint: rate, errors, duration.","Record business metrics too (orders_total, payments_failed_total).","Aggregate histograms properly to compute percentiles."],"code":"http_requests_total{route=\"/checkout\",status=\"500\"}  1234  (counter)\nqueue_depth{queue=\"emails\"}                           87   (gauge)\nhttp_request_duration_seconds_bucket{le=\"0.5\"}        9920 (histogram)\n\nrate(http_requests_total{status=~\"5..\"}[5m])","e":"A team added user_id as a Prometheus label “for debugging”. It created millions of time series and crashed their Prometheus server within a day.","p":["High-cardinality labels","Averages instead of histograms for latency","Metrics without units in the name"],"v":["Logs","Metrics are aggregated NUMBERS (cheap, great for trends and alerts). Logs are detailed EVENTS (expensive, great for explaining a specific case)."],"f":["App increments counter","Scraped every 15 s","Stored as time series","Graphs + alert rules"],"q":[["Counter vs gauge vs histogram?","Counter only increases (use its rate), gauge goes up and down (current value), histogram records value distributions for percentiles."],["What is cardinality and why does it matter?","The number of unique label combinations; high cardinality creates huge numbers of time series, increasing cost and breaking metric systems."],["What are RED metrics?","Rate (requests per second), Errors (failed requests), Duration (latency distribution) per service/endpoint."]]},{"n":104,"c":"obs","t":"Alerts","s":"Automatic notifications that wake a human only when something needs action now.","w":"An alert is a rule over metrics or logs (“checkout error rate > 2% for 5 minutes”) that sends a notification (PagerDuty, Opsgenie, Slack). Good alerts are actionable, urgent and reflect user pain. Bad alerts fire constantly for things nobody can fix, and people start ignoring them (alert fatigue).","y":"Too few alerts: outages go unnoticed. Too many: real alerts get lost in noise and on-call engineers burn out.","h":["Alert on symptoms users feel (errors, latency, availability), not every cause (CPU 80%).","Use SLO burn-rate alerts: page when the error budget is being consumed fast.","Require duration (for: 5m) to avoid flapping on brief spikes.","Split severity: page for urgent user impact; ticket/Slack for things that can wait until morning.","Every alert must have an owner and a runbook link explaining what to check and do.","Group and deduplicate related alerts.","Review alerts monthly: delete or fix any that fired without needing action."],"code":"- alert: CheckoutErrorRateHigh\n  expr: |\n    sum(rate(http_requests_total{route=\"/checkout\",status=~\"5..\"}[5m]))\n    / sum(rate(http_requests_total{route=\"/checkout\"}[5m])) > 0.02\n  for: 5m\n  labels: { severity: page }\n  annotations: { runbook: \"https://wiki/runbooks/checkout\" }","e":"A team had 300 alerts per week, mostly ignored. After deleting non-actionable ones and switching to SLO burn-rate alerts, they had about 5 pages a week, each real.","p":["Paging for things that can’t be acted on","No runbook","Alerts without duration windows that flap all night"],"v":["Monitoring","Monitoring COLLECTS and shows signals. Alerting decides WHEN a human must be interrupted."],"f":["Error rate > 2% for 5 min","Alert fires (severity: page)","On-call notified","Runbook → mitigate"],"q":[["What makes an alert good?","It’s actionable, urgent, reflects real user impact, has an owner and a runbook."],["What is alert fatigue?","When too many noisy alerts cause people to ignore or miss important ones."],["Why alert on symptoms rather than causes?","Symptoms capture what users experience regardless of cause; cause metrics are many and often harmless."]]},{"n":105,"c":"obs","t":"Observability","s":"How well you can understand what’s happening inside your system just by looking at its outputs, even for problems you never predicted.","w":"Observability comes from rich telemetry (logs, metrics and traces, often with events and profiles) that are connected and carry context (request IDs, user tiers, versions, regions). With it you can ask new questions on the fly: “Are only Android users on version 5.2 in Mumbai seeing slow checkout?” without shipping new code.","y":"Modern distributed systems fail in new, strange ways. Pre-built dashboards only answer questions you thought of in advance. Observability lets you debug the unknown.","h":["Instrument with OpenTelemetry for logs, metrics and traces in one standard.","Add high-context attributes: version, region, customer tier, feature flag state.","Correlate signals: trace IDs in logs, exemplars linking metrics to traces.","Make telemetry easy to query and explore, not just display.","Instrument new features as part of “done”, not after the first outage.","Control cost with sampling and retention."],"e":"When a release slowed down only for users with very large carts, high-context traces (cart_size attribute) revealed it in minutes; standard dashboards just showed a small p99 bump.","p":["Buying a tool and calling it observability","Three disconnected tools for logs, metrics and traces","No context attributes, so you can’t slice the data"],"v":["Monitoring","Monitoring answers KNOWN questions with dashboards and alerts. Observability lets you explore UNKNOWN questions using connected, high-context telemetry."],"f":["Rich telemetry with context","Something odd happens","Slice by version/region/tier","Find unknown cause fast"],"q":[["Monitoring vs observability?","Monitoring tracks predefined signals for known failure modes; observability provides data rich enough to investigate new, unexpected problems."],["What are the three pillars commonly mentioned?","Logs, metrics and traces."],["Why does context matter?","Attributes like version, region and user tier let you slice data and isolate which subset is affected."]]},{"n":106,"c":"obs","t":"SLIs","s":"Service Level Indicator: a precise measurement of how well your service is doing from the user’s point of view.","w":"An SLI is usually a ratio: good events ÷ total events. Examples: “successful HTTP requests ÷ all requests” (availability), “requests faster than 300 ms ÷ all requests” (latency), “orders processed within 5 minutes ÷ all orders” (freshness). It must say exactly what is counted, where it’s measured and over what window.","y":"“The site feels slow” or “we’re pretty reliable” can’t be managed. SLIs give everyone, engineers and business, one shared number.","h":["Start from user journeys: login, search, checkout, upload.","Choose the kind: availability, latency, quality, freshness, correctness.","Define it exactly: which requests count (exclude health checks and bots?), what’s “good” (status < 500? under 300 ms?).","Measure as close to the user as possible (load balancer logs, real user monitoring), not just inside the app.","Keep a few per service, not dozens."],"code":"availability SLI =\n  count(requests where status < 500)\n  / count(all requests)        over 28 days\n\nlatency SLI =\n  count(requests with duration < 300ms) / count(all requests)","e":"An image service’s SLI: “percentage of image loads that succeed and render in under 1 second, measured at the CDN”.","p":["Measuring only server CPU instead of user experience","Vague definitions that people interpret differently","Counting client errors (404s from bad links) as service failures"],"v":["SLOs","The SLI is the MEASUREMENT (99.95% succeeded). The SLO is the TARGET you compare it with (should be ≥ 99.9%)."],"f":["Pick user journey","Define good ÷ total","Measure near user","SLI = 99.95% this month"],"q":[["What form does an SLI usually take?","A ratio of good events to total valid events, expressed as a percentage."],["Give an example latency SLI.","Proportion of requests completed in under 300 ms over a 28-day window."],["Where should SLIs be measured?","As close to the user’s experience as possible, such as at the load balancer or with real user monitoring."]]},{"n":107,"c":"obs","t":"SLOs","s":"Service Level Objective: the reliability target for an SLI, such as “99.9% of requests succeed over 28 days”.","w":"An SLO turns an SLI into a goal. It’s internal and set by the team with the business. It’s different from an SLA (Service Level Agreement), which is an external contract with penalties, usually looser than the SLO so you have a safety margin. 99.9% allows about 43 minutes of failure per month; 99.99% allows about 4 minutes.","y":"Without a target, teams either chase perfection (slow, expensive) or ignore reliability until customers leave. 100% is impossible and not even desirable; users' own Wi-Fi isn’t 100% reliable.","h":["Set targets based on what users need and what’s achievable; look at historical performance.","Use a rolling window (e.g. 28 or 30 days).","Each extra nine costs roughly 10× more effort; choose deliberately.","Make SLOs visible on dashboards and use them for alerting (burn rate).","Use the SLO to make decisions: if you’re meeting it comfortably, ship faster; if not, focus on reliability.","Review SLOs every quarter."],"code":"SLO: 99.9% of checkout requests succeed (28-day window)\nAllowed failures ≈ 0.1%\n1,000,000 requests → up to 1,000 can fail","e":"Google’s SRE book describes how setting SLOs below 100% let teams balance launching features against reliability with data instead of arguments.","p":["Picking 99.999% because it sounds good","SLO stricter than what your dependencies provide","SLOs nobody looks at or acts on"],"v":["SLIs","SLI = what you MEASURE. SLO = the TARGET for that measurement. SLA = the external PROMISE with consequences."],"f":["SLI measured","Compare to SLO 99.9%","Above: ship freely","Below: prioritize reliability"],"q":[["SLO vs SLA?","SLO is an internal target; SLA is a contract with customers that includes consequences and is usually looser than the SLO."],["How much downtime does 99.9% allow per 30 days?","About 43 minutes."],["Why not aim for 100%?","It’s impossible, extremely expensive, and users can’t perceive the difference beyond a point; it also blocks all change."]]},{"n":108,"c":"obs","t":"Error Budgets","s":"The amount of failure your SLO allows. If you target 99.9%, the remaining 0.1% is a budget you can “spend”.","w":"Error budget = 100% − SLO. With 99.9% over 28 days you can afford roughly 40 minutes of downtime or 0.1% failed requests. Risky deploys, experiments and incidents all consume it. The budget turns reliability into a shared, measurable resource.","y":"It ends the endless fight between “ship faster” (product) and “don’t break anything” (ops). Data decides: budget left means you can take risks; budget burned means slow down and fix things.","h":["Calculate it from your SLO and track remaining budget on a dashboard.","Agree on an error budget policy in advance: e.g. if the budget is exhausted, freeze risky launches and prioritize reliability work.","Alert on burn rate: burning a month’s budget in hours = page now; slow burn = ticket.","Use multi-window burn-rate alerts (e.g. 1 hour and 5 minutes) for fast, accurate detection.","Discuss budget consumption in postmortems and planning.","Don’t treat leftover budget as a goal to spend on purpose by breaking things."],"code":"SLO 99.9% over 28 days\nBudget = 0.1% × 28 days ≈ 40 minutes\nBurn rate 14.4 ⇒ budget gone in ~2 days ⇒ PAGE\nBurn rate 1    ⇒ budget lasts exactly the window","e":"A team used half its monthly budget in one bad deploy. Per their policy, they paused new features for a week and added canary analysis, which prevented a repeat.","p":["No agreed policy, so exhausting the budget changes nothing","Alerting on raw errors instead of burn rate","Using the budget as an excuse to ignore user pain"],"v":["SLOs","The SLO is the target line. The error budget is the room BELOW perfection that the target allows you, and how much of it is left."],"f":["SLO 99.9% → 0.1% budget","Incidents + deploys consume it","Budget left? keep shipping","!Exhausted → reliability focus"],"q":[["How do you calculate an error budget?","100% minus the SLO, applied to the time window or request count."],["What is burn rate?","How fast the error budget is being consumed relative to the rate that would exactly use it up over the window."],["What’s an error budget policy?","A pre-agreed rule about what happens when the budget is consumed, such as freezing feature launches."]]},{"n":109,"c":"obs","t":"Production Incidents","s":"An unplanned event that hurts users or the business (an outage, data issue or serious slowdown) and needs coordinated response.","w":"Incident response is a structured process: detect, declare, assign roles, mitigate, communicate, resolve, then learn. Severity levels (SEV1 = major outage, SEV3 = minor) decide how many people are pulled in. Key roles: incident commander (coordinates and decides), communications lead (status updates), and subject-matter experts (do the technical work).","y":"Without structure, five engineers debug the same thing, nobody tells customers, someone makes a risky change, and the outage lasts three times longer.","h":["Declare an incident early; it’s cheap to downgrade.","Assign an incident commander who coordinates rather than debugs.","Mitigate first, investigate later: roll back, fail over, disable the feature flag, scale up. Restoring service beats finding root cause.","Use one dedicated channel and keep a timeline of actions and findings.","Communicate regularly to stakeholders and customers (status page), even if the update is “still investigating”.","Make changes deliberately and announce them in the channel.","Close with a postmortem for significant incidents."],"e":"During a checkout outage, the incident commander noticed it started right after a deploy and ordered a rollback within 6 minutes, before anyone found the bug. The root cause analysis happened calmly the next day.","p":["Hunting the root cause while users are down instead of rolling back","Everyone debugging, nobody coordinating","Silence towards customers"],"v":["Postmortems","The incident is the LIVE emergency: restore service. The postmortem is the CALM review afterwards: learn and prevent recurrence."],"f":["!Alert: checkout errors","Declare SEV, assign IC","Mitigate: rollback","Resolved → postmortem"],"q":[["Why mitigate before finding the root cause?","Restoring service minimizes user impact; investigation can continue safely afterwards."],["What does an incident commander do?","Coordinates the response, assigns tasks, makes decisions and keeps everyone aligned, rather than debugging personally."],["Name common mitigation actions.","Rollback, failover, disabling a feature flag, scaling up, blocking bad traffic, or shedding load."]]},{"n":110,"c":"obs","t":"On-Call","s":"A rotation where engineers take turns being responsible for responding to production alerts, day and night.","w":"One person (plus a secondary backup) carries the pager for a period, often a week. When an alert fires, they acknowledge it within minutes, assess and mitigate, or escalate. Tools like PagerDuty or Opsgenie handle schedules, escalation and notifications.","y":"Systems break at 3 a.m. too. Without clear ownership, alerts go to everyone (so nobody acts) or nobody.","h":["Have a primary and secondary, and an escalation path to team leads or other teams.","Keep rotations fair and big enough (ideally 6–8 people) to avoid burnout.","Hand off properly: summary of ongoing issues at the start of each shift.","Give on-call engineers runbooks, dashboards and access BEFORE they need them.","Track page volume; aim for a handful of actionable pages per shift, and fix noisy alerts.","Compensate and respect on-call work (time off after bad nights).","Teams that build a service should share on-call for it (“you build it, you run it”)."],"e":"Google SRE guidelines suggest limiting on-call load to at most a couple of incidents per 12-hour shift, so engineers have time to handle and follow up properly.","p":["Tiny rotations of 2 people","Noisy alerts making every night bad","On-call without access or runbooks"],"v":["Alerts","Alerts are the SIGNAL that something’s wrong. On-call is the PEOPLE and PROCESS that respond to that signal."],"f":["Alert fires","Primary paged → ack","Mitigate with runbook","No ack? escalate to secondary"],"q":[["What’s an escalation policy?","Rules for who gets notified next if the primary doesn’t acknowledge or needs help."],["How do you reduce on-call burnout?","Fewer, actionable alerts; fair large rotations; runbooks; compensation; fixing recurring issues."],["What should an on-call handoff include?","Ongoing incidents, recent changes, known risks and anything left unresolved."]]},{"n":111,"c":"obs","t":"Postmortems","s":"A written, blameless review after an incident: what happened, why, and what you’ll change so it doesn’t happen again.","w":"A postmortem documents impact (who was affected, for how long), timeline, root and contributing causes, what went well, what went badly, and action items with owners and dates. “Blameless” means focusing on how the system and process allowed the mistake, not punishing the person who typed the command.","y":"Without them, teams repeat the same outages. With blame, people hide mistakes and you never learn the real causes.","h":["Write one for every significant incident within a few days, while memory is fresh.","Build an accurate timeline from logs, chat and alerts.","Ask “why” repeatedly (5 Whys) to find contributing causes; incidents usually have several.","Ask “how did the system make this easy to do?” rather than “who did it?”.","Create specific action items with owners and deadlines: “add canary analysis to deploy pipeline”, not “be more careful”.","Review in a meeting, share widely, and track that actions get done."],"code":"Impact: 23 min, 18% of checkouts failed\nTrigger: config pushed with wrong DB host\nContributing: no validation, no canary, alert fired late\nActions:\n - Validate config in CI (owner: Riya, due Nov 1)\n - Canary config changes (owner: Dev, due Nov 15)","e":"After an engineer’s mistyped command took down part of Amazon S3 in 2017, AWS’s public postmortem focused on the tool allowing too much capacity to be removed at once, and changed the tool to remove capacity more slowly with safeguards.","p":["Blaming individuals","Vague actions like “be more careful”","Action items nobody tracks","Root cause = “human error” and stopping there"],"v":["Blameless Culture","The postmortem is the DOCUMENT and review process. Blameless culture is the MINDSET that makes it honest. Blameless doesn’t mean no accountability for fixing things."],"f":["Incident resolved","Timeline + impact","Contributing causes (5 Whys)","Owned action items tracked"],"q":[["What does blameless mean in a postmortem?","Analyzing how systems and processes allowed the failure, without punishing individuals, so people share information honestly."],["Why is “human error” not a root cause?","Humans always make mistakes; the real question is why the system allowed one mistake to cause an outage."],["What makes a good action item?","Specific, achievable, with an owner and a due date, and tracked to completion."]]},{"n":112,"c":"rel","t":"Bulkheads","s":"Split resources into separate compartments so a failure in one part can’t drain resources from everything else.","w":"Named after ship compartments: if one floods, the ship still floats. In software: separate thread pools, connection pools, queues or even separate instances per dependency or per customer type. If the slow recommendation service eats all 20 threads of its own pool, the checkout pool still has its own threads.","y":"With one shared pool, one slow dependency makes every request wait for a thread, and the whole app stops, including features that don’t use that dependency.","h":["Give each critical dependency its own connection pool or concurrency limit.","Separate workloads: user-facing API vs batch jobs vs admin, on different pools or instances.","Isolate tenants: big or noisy customers on separate resources (cells/shards).","Use separate queues and workers per job type so a flood of one type doesn’t block another.","Size compartments carefully; too small wastes capacity, too large defeats the point.","Combine with timeouts and circuit breakers."],"code":"reco_pool    = ThreadPool(max_workers=10)   # can fail alone\npayment_pool = ThreadPool(max_workers=30)\nsearch_sem   = Semaphore(20)   # max 20 concurrent search calls","e":"AWS uses “cell-based architecture”: customers are split into independent cells, so a bad deployment or overload in one cell affects only a fraction of customers.","p":["One giant shared pool for everything","Batch jobs sharing the DB connection pool with user traffic","Compartments sized without measuring real needs"],"v":["Circuit Breaker","A bulkhead LIMITS how much damage a failing part can do by isolating resources. A circuit breaker STOPS calling the failing part. They work well together."],"f":["Separate pools per dependency","!Reco service hangs","Reco pool exhausted only","Checkout pool still serving"],"q":[["What problem do bulkheads prevent?","Resource exhaustion in one area (threads, connections) spreading to unrelated features."],["Give two ways to implement bulkheads.","Separate thread/connection pools per dependency, and separate instances or queues per workload or tenant."],["What is cell-based architecture?","Splitting a system into independent full copies (cells), each serving a subset of customers, to contain failures."]]},{"n":113,"c":"msg","t":"Transactional Outbox Pattern","s":"Save the database change and the event-to-publish in the same transaction, then publish the event separately, so neither can be lost.","w":"The “dual write” problem: you save an order to the DB and then publish OrderPlaced to Kafka. If the app crashes between the two, the order exists but no event is sent (or the event goes out but the DB transaction rolls back). The outbox fixes it: in the same DB transaction, insert the order AND a row into an outbox table. A separate relay reads the outbox and publishes events, marking them sent.","y":"Lost events mean warehouses never ship, emails never send, and systems silently disagree. This is one of the most common hidden bugs in event-driven systems.","h":["Create an outbox table: id, aggregate_id, event_type, payload, created_at, sent_at.","Write business rows and outbox rows in ONE database transaction.","A relay publishes unsent rows in order, then marks them sent (polling with FOR UPDATE SKIP LOCKED, or change data capture with Debezium reading the DB log).","The relay can crash after publishing but before marking sent, so events can repeat: consumers must be idempotent (use the outbox row id as event ID).","Clean up old sent rows periodically.","Keep ordering per aggregate (e.g. per order ID) if consumers need it."],"code":"BEGIN;\nINSERT INTO orders (id, user_id, total) VALUES (42, 7, 999);\nINSERT INTO outbox (id, type, payload)\n  VALUES (gen_random_uuid(), 'OrderPlaced', '{\"order_id\":42}');\nCOMMIT;\n-- relay: SELECT * FROM outbox WHERE sent_at IS NULL\n--        → publish → UPDATE outbox SET sent_at = now()","e":"Many companies use Debezium to stream outbox table inserts from Postgres’s write-ahead log into Kafka, giving reliable event publishing without polling.","p":["Publishing to the broker inside the DB transaction (the broker call can’t be rolled back)","Non-idempotent consumers getting duplicate events","Outbox table growing forever"],"v":["Pub/Sub","Pub/sub DELIVERS events to subscribers. The outbox makes sure the event is RELIABLY PUBLISHED in the first place, consistent with your database."],"f":["One TX: order + outbox row","Commit","Relay reads outbox","Publish → mark sent"],"q":[["What is the dual-write problem?","Writing to two systems (DB and broker) without a shared transaction, so a crash between them leaves them inconsistent."],["Why can the outbox still produce duplicates?","The relay may publish and crash before marking the row sent, so it publishes again on restart."],["What is change data capture (CDC) in this context?","Reading the database’s transaction log to detect new outbox rows and publish them, instead of polling."]]},{"n":114,"c":"dist","t":"CQRS","s":"Command Query Responsibility Segregation: use one model for changing data (commands) and a separate, optimized model for reading it (queries).","w":"Commands like PlaceOrder go through the write model, which enforces business rules on normalized data. Queries like “show my order history with product names and totals” read from read models, which are denormalized views shaped exactly for each screen. Read models are updated from the write side, often via events, so they may lag slightly.","y":"One model serving both often becomes a mess: writes need strict validation and normalized tables, while reads want fast, pre-joined data in many shapes. Read and write loads also scale differently.","h":["Use it only where reads and writes really differ a lot; for simple CRUD it’s overkill.","Commands: validate and change state, return little (success/ID).","Queries: never change state; read from views built for the screen.","Update read models with events or CDC; make projection updates idempotent.","Handle lag in the UI: show the user’s own change optimistically or read from the write side right after a command.","Be able to rebuild read models from the source of truth.","Read models can live in different stores (Elasticsearch for search, Redis for counters)."],"e":"An e-commerce site writes orders to Postgres (write model) and projects them into Elasticsearch for fast search and filtering in the admin panel (read model).","p":["Applying CQRS to every simple service","Users confused because their change doesn’t appear yet","No way to rebuild a corrupted read model"],"v":["Event Sourcing","CQRS separates READ and WRITE models. Event sourcing stores state as a HISTORY of events. They pair well but are independent: either can be used without the other."],"f":["Command: PlaceOrder","Write model validates + saves","Event updates read model","Query reads fast view"],"q":[["What problem does CQRS solve?","Conflicting needs of reads and writes: complex validation and normalized data for writes vs fast, varied, denormalized views for reads."],["What’s the main downside?","More complexity and eventual consistency between the write model and read models."],["Do you need event sourcing to use CQRS?","No; read models can be updated from regular DB changes, CDC or events."]]},{"n":115,"c":"dist","t":"Event Sourcing","s":"Instead of storing only the current state, store every change as an event, and rebuild the current state by replaying them.","w":"A bank account isn’t stored as \"balance = 500\". It’s stored as events: Opened, Deposited 1000, Withdrew 300, Withdrew 200. Current balance = replay of all events. Events are immutable and only appended. Projections build queryable views from them; snapshots speed up rebuilding long histories.","y":"You get a full audit trail, the ability to answer “what was the state last Tuesday?”, to rebuild views after fixing bugs, and to create new views from old history. It’s powerful for finance, logistics and domains where history matters, but it adds real complexity.","h":["Model events as past-tense business facts with all needed data.","Store them in an append-only event store, ordered per entity (stream), with optimistic concurrency on stream version.","Build projections/read models for queries (usually with CQRS).","Use snapshots so you don’t replay 10 years of events every time.","Plan event schema evolution: version events, use upcasters to convert old formats.","Handle personal data carefully: you can’t easily delete from immutable logs (store personal data separately or use crypto-shredding).","Use it for the parts of the system that need it, not everything."],"code":"events for account 7:\n1 AccountOpened   {owner: \"Asha\"}\n2 MoneyDeposited  {amount: 1000}\n3 MoneyWithdrawn  {amount: 300}\n4 MoneyWithdrawn  {amount: 200}\nbalance = replay → 500","e":"Git is a familiar example of the idea: it stores a history of commits, and the current files can be reconstructed from that history.","p":["Events that are just CRUD (“RowUpdated”) instead of business facts","No plan for changing event formats","GDPR deletion requests on immutable logs","Using it everywhere and drowning in complexity"],"v":["Audit Log","In event sourcing the events ARE the source of truth; state is derived from them. An audit log is a side record of what happened; the real state lives elsewhere."],"f":["Command: withdraw 200","Append MoneyWithdrawn event","Projections update","State = replay of events"],"q":[["How is current state obtained in event sourcing?","By replaying all events for an entity in order, often starting from a snapshot."],["What are snapshots for?","Storing state at a point in time so you only replay events after it, speeding up loads."],["What’s hard about event sourcing?","Schema evolution, eventual consistency of projections, deleting personal data and overall complexity."]]},{"n":116,"c":"net","t":"API Pagination","s":"Returning big lists in small chunks (pages) instead of all at once.","w":"GET /orders could return 2 million rows. Instead you return, say, 20 at a time plus a way to get the next 20. Two main styles: offset pagination (?page=3 or ?offset=40&limit=20) and cursor/keyset pagination (?after=eyJpZCI6MTAyfQ, a pointer to the last item you saw).","y":"Giant responses are slow, use huge memory on server and client, time out and waste mobile data. And deep offset pages get slower and slower.","h":["Always have a default limit and a maximum (e.g. default 20, max 100).","Offset is simple and allows jumping to page N, but OFFSET 100000 still reads 100,000 rows, and inserts/deletes shift results (duplicates or skipped items).","Cursor/keyset: WHERE (created_at, id) < (:last_created_at, :last_id) ORDER BY created_at DESC, id DESC LIMIT 20. Fast at any depth and stable while data changes.","Sort by a unique, stable order (add id as tiebreaker).","Return next_cursor (opaque, base64-encoded) and has_more, rather than total counts (counting is expensive on big tables).","Have an index matching the sort order."],"code":"GET /orders?limit=20&after=eyJ0IjoiMjAyNi0xMC0xOSIsImlkIjo5OH0\n{\n  \"data\": [ ...20 orders... ],\n  \"next_cursor\": \"eyJ0IjoiMjAyNi0xMC0xOCIsImlkIjo3OH0\",\n  \"has_more\": true\n}","e":"Twitter/X, Slack and Stripe APIs use cursor-based pagination because their feeds change constantly and users scroll very deep.","p":["No maximum limit, so a client asks for 1,000,000","Ordering by a non-unique column, causing duplicates across pages","Deep OFFSET queries killing the DB","Expensive COUNT(*) on every request"],"v":["Offset vs Cursor","Offset: easy, supports jumping to page 50, slow when deep, unstable with changing data. Cursor: fast and stable, but only next/previous navigation."],"f":["GET first 20","Return data + next_cursor","Client sends cursor","DB seeks via index → next 20"],"q":[["Why is offset pagination slow on deep pages?","The database must read and skip all preceding rows before returning the page."],["Why add id as a tiebreaker in sorting?","To make the order unique and stable so items don’t repeat or vanish between pages."],["What does a cursor usually contain?","An encoded pointer to the last item’s sort values (e.g. created_at and id)."]]},{"n":117,"c":"sec","t":"Input Validation","s":"Checking that incoming data has the right shape, type and allowed values before your system uses it.","w":"Every request is untrusted: a quantity could be -5, an email could be 10 MB of text, an “id” could be a string with SQL in it. Validation checks syntax (is it a valid email/number/date? correct length?) and business rules (quantity between 1 and 10? start date before end date? does this user own this order?).","y":"Bad input causes crashes, corrupted data, confusing errors and security holes. Validating in the browser improves UX, but anyone can bypass the browser with curl, so the server must validate.","h":["Validate on the server at every entry point: APIs, webhooks, file uploads, queue messages.","Use schemas (JSON Schema, Zod, Pydantic, Joi, class-validator) to declare types, required fields, formats and ranges.","Prefer allowlists (only these values allowed) over blocklists.","Limit sizes: string length, array length, request body size, upload size and file type (check content, not just extension).","Reject unknown fields where it matters to avoid mass assignment (user sending “is_admin”: true).","Return clear 400/422 errors that explain what’s wrong.","Validation is not a replacement for parameterized queries, output escaping or authorization checks."],"code":"class CreateOrder(BaseModel):          # Pydantic\n    product_id: int\n    quantity: conint(ge=1, le=10)\n    coupon: constr(max_length=20) | None = None\n    model_config = {\"extra\": \"forbid\"}  # reject unknown fields","e":"GitHub had a mass-assignment bug in 2012 (via Rails) where a user could add an unexpected field to a form and gain write access to the Rails repository itself.","p":["Validating only in the frontend","Blocklists of “bad characters”","Accepting unknown fields straight into DB models","No size limits on uploads or arrays"],"v":["Authentication","Validation checks whether the DATA is acceptable. Authentication checks WHO is sending it. Perfectly valid data can still come from an attacker."],"f":["Request arrives","Schema check: types, ranges","Business rule check","!Invalid → 422 with reason"],"q":[["Why isn’t client-side validation enough?","Clients can be bypassed or modified; only server-side checks are trustworthy."],["Allowlist vs blocklist?","Allowlists accept only known-good values; blocklists try to reject known-bad ones and are easy to bypass."],["What is mass assignment?","Automatically binding request fields to model fields, letting attackers set fields they shouldn’t, like roles."]]},{"n":118,"c":"sec","t":"RBAC vs. ABAC","s":"Two ways to decide permissions: RBAC uses roles (“editors can publish”); ABAC uses attributes and context (“editors can publish articles in their own department during work hours”).","w":"RBAC (Role-Based Access Control): users get roles, roles have permissions. Simple and easy to audit. ABAC (Attribute-Based Access Control): a policy evaluates attributes of the user (department, level), the resource (owner, sensitivity), the action and the environment (time, IP, device). Related: ReBAC (relationship-based, like Google Docs sharing: “viewers of this folder”).","y":"RBAC alone breaks down when access depends on ownership or context: you end up with “role explosion” (Editor-Mumbai-Finance-ReadOnly…). ABAC handles that but is harder to reason about and audit.","h":["Start with RBAC with a few clear roles.","Always check ownership/tenant at the resource level (user can view ONLY their own orders), whatever the model.","Add ABAC rules when access truly depends on attributes or context.","Centralize policies in one place (OPA/Rego, Cedar, Casbin, or an authorization service) instead of scattering if-statements.","Default deny: no matching rule = no access.","Test policies with unit tests and log decisions for audits.","For sharing-heavy apps consider ReBAC tools (OpenFGA, SpiceDB)."],"code":"# RBAC\nallow if \"editor\" in user.roles and action == \"publish\"\n\n# ABAC\nallow if user.role == \"manager\"\n     and resource.region == user.region\n     and resource.amount <= 50000","e":"AWS IAM is mostly ABAC-capable: policies can check tags, e.g. allow developers to stop only EC2 instances tagged with their own team name.","p":["Role explosion trying to express context in role names","Forgetting object-level checks (IDOR: changing /orders/41 to /orders/42)","Permission logic copy-pasted across services"],"v":["RBAC","RBAC: permissions via roles, simple to audit. ABAC: permissions computed from attributes and context, more flexible, more complex."],"f":["User + action + resource","RBAC: role allows?","ABAC: attributes match policy?","Allow or default deny"],"q":[["What is role explosion?","Creating ever more specific roles to capture context, making RBAC unmanageable."],["What is IDOR?","Insecure Direct Object Reference: accessing another user’s resource by changing an ID because ownership isn’t checked."],["When would you choose ABAC?","When access depends on resource attributes, ownership, location, time or other context that roles can’t express cleanly."]]},{"n":119,"c":"msg","t":"Exactly-Once Processing","s":"The goal that each message’s effect happens exactly one time, which in practice means “at-least-once delivery + idempotent processing”.","w":"Delivery guarantees: at-most-once (may lose messages, never duplicates), at-least-once (never lose, may duplicate), exactly-once (neither). Over unreliable networks, a sender can’t know if a lost acknowledgement means “not received” or “received but ack lost”, so true end-to-end exactly-once delivery is impossible in general. What systems offer is exactly-once EFFECT within a boundary, e.g. Kafka transactions for read-process-write within Kafka.","y":"Teams that believe a product’s “exactly-once” label skip deduplication, then charge customers twice when an external call is retried. Understanding the real guarantee prevents that.","h":["Assume at-least-once delivery and design for duplicates.","Make consumers idempotent: dedupe by message ID with a unique constraint, or use naturally idempotent operations (SET status = 'paid').","Store the processed message ID in the SAME transaction as the business change.","Use idempotency keys when calling external APIs.","Understand your platform’s guarantee boundary: Kafka exactly-once covers Kafka-to-Kafka with transactions, not your email provider.","Commit offsets/acks only after the effect is durable."],"code":"BEGIN;\nINSERT INTO processed_messages (id) VALUES (:msg_id);  -- unique\n-- duplicate? → unique violation → rollback & ack\nUPDATE accounts SET balance = balance + :amt WHERE id = :acct;\nCOMMIT;","e":"A team trusted their queue’s “exactly-once” FIFO setting but it only deduplicated within a 5-minute window. A retry after 7 minutes double-credited wallets until they added a processed-IDs table.","p":["Trusting marketing labels","Dedupe check and business update in separate transactions","Acking before the effect is saved"],"v":["At-Least-Once Delivery","At-least-once is what you usually GET from brokers. Exactly-once is the EFFECT you build on top using idempotency and deduplication."],"f":["Message delivered","!Ack lost → redelivered","Consumer sees ID already processed","Skip → effect happened once"],"q":[["Why is end-to-end exactly-once delivery generally impossible?","A sender can’t distinguish a lost message from a lost acknowledgement, so it must either risk loss or risk duplicates."],["How do you achieve exactly-once effects?","At-least-once delivery combined with idempotent processing or deduplication stored atomically with the effect."],["What does Kafka’s exactly-once cover?","Read-process-write cycles within Kafka using transactions and idempotent producers, not external side effects."]]},{"n":120,"c":"msg","t":"Idempotent Consumers","s":"Message handlers designed so processing the same message twice has the same result as processing it once.","w":"Queues, Kafka and webhooks redeliver messages after timeouts, crashes or lost acks. An idempotent consumer detects or neutralizes repeats. Approaches: track processed message IDs; use natural keys with unique constraints (one invoice per order ID); use operations that are naturally idempotent (set status = 'shipped' instead of increment counter); check state before acting (skip if already shipped).","y":"Without it, duplicates turn into double emails, double charges, double inventory deductions or double loyalty points.","h":["Give every message a unique ID (or derive one from business data).","Store processed IDs in a durable table with a unique constraint, inside the same transaction as the effect.","Prefer absolute updates (SET) over relative ones (+1) when possible.","Use unique business constraints (UNIQUE(order_id) on invoices).","For external side effects (payments, emails), pass an idempotency key to the provider.","Expire old processed IDs only after redelivery is no longer possible.","Never rely only on an in-memory set; it’s lost on restart and not shared."],"code":"def handle(msg):\n    with db.transaction():\n        inserted = db.execute(\n          \"INSERT INTO processed(id) VALUES (%s) ON CONFLICT DO NOTHING\",\n          msg.id).rowcount\n        if not inserted: return        # duplicate, skip\n        create_invoice(msg.order_id)   # UNIQUE(order_id) too","e":"Stripe explicitly warns that webhook endpoints may receive the same event more than once and recommends logging processed event IDs to skip duplicates.","p":["In-memory dedupe sets","Checking “processed?” in one transaction and doing the work in another","Relative updates like balance += amount without dedupe"],"v":["Message Deduplication","Deduplication DETECTS repeated messages by ID. Idempotency makes repeating HARMLESS even if a duplicate slips through. Use both for important effects."],"f":["Message ID m-77 arrives","Insert into processed (unique)","New → do work in same TX","Repeat m-77 → conflict, skip"],"q":[["Why store processed IDs in the same transaction as the business change?","So either both happen or neither; otherwise a crash between them causes loss or duplication."],["Give an example of a naturally idempotent operation.","Setting a field to a value (status = 'paid'), as opposed to incrementing a counter."],["Why not use an in-memory set for dedupe?","It disappears on restart and isn’t shared across consumer instances."]]},{"n":121,"c":"sec","t":"Data Retention & Deletion","s":"Deciding how long you keep each type of data, and reliably deleting it everywhere when that time is up or a user asks.","w":"Data lives in many places: main database, replicas, caches, search indexes, logs, analytics warehouses, backups, third-party tools. A retention policy defines, per data type, how long it’s kept and why (e.g. invoices 8 years for tax law, raw logs 30 days, deleted accounts erased in 30 days). Deletion must cover all copies. Laws like GDPR and India’s DPDP Act give users rights to have their data erased.","y":"Keeping everything “just in case” increases breach impact, storage cost and legal risk. Fines for mishandling personal data can be huge.","h":["Inventory personal data: what you store, where, and why.","Set retention per category based on purpose and legal requirements.","Automate expiry: TTL indexes, partition drops, lifecycle rules on object storage, log retention settings.","Build a deletion workflow that fans out to every system (DB, search, cache, analytics, third-party processors) and records proof.","Handle backups: let them expire on schedule, and make sure restores don’t resurrect deleted users (re-apply deletions after restore).","Respect legal holds that pause deletion for litigation.","Prefer anonymization/aggregation when you need data for analytics but not identity.","Crypto-shredding: encrypt each user’s data with their own key, and delete the key to make data unreadable everywhere."],"e":"Under GDPR, Meta, Amazon and others have received fines in the hundreds of millions of euros for data handling violations, showing regulators take retention and processing rules seriously.","p":["Deleting from the main DB but forgetting logs, search indexes and analytics","Restoring a backup that brings deleted users back","No owner for the retention policy"],"v":["Backups","Backups exist to KEEP data for recovery. Retention policy decides how long ANY copy, including backups, may exist."],"f":["Data reaches retention limit","Delete in DB, search, cache","Notify processors + logs","Backups expire on schedule"],"q":[["Why is deleting user data hard?","Copies spread across many systems (replicas, caches, logs, analytics, backups, third parties)."],["What is crypto-shredding?","Encrypting each user’s data with a unique key and deleting the key, making all copies unreadable."],["How do you handle backups for deletion requests?","Let backups expire within a defined period and re-apply deletions if a backup is ever restored."]]},{"n":122,"c":"sec","t":"Zero Trust Security","s":"Never trust a request just because it comes from “inside” the network; verify identity and permission for every access.","w":"The old model: a strong firewall around the office/data centre, and everything inside trusts each other (castle and moat). Zero trust assumes attackers may already be inside. Every user, device and service must authenticate, be authorized for the specific resource, and be continuously evaluated. Google’s BeyondCorp is the famous implementation.","y":"With perimeter security, one phished laptop or compromised server can move freely to databases and admin tools (“lateral movement”). Remote work and cloud made the perimeter mostly meaningless anyway.","h":["Strong identity for everyone: SSO with MFA, preferably phishing-resistant (security keys/passkeys).","Check device health (managed, updated, encrypted) for sensitive access.","Authorize each request to each resource with least privilege, not network location.","Service-to-service: mTLS with workload identities (SPIFFE, service mesh) and per-service authorization.","Segment networks (micro-segmentation) so a breach can’t spread.","Replace VPN-everything with identity-aware proxies for internal apps.","Log and monitor every access; re-evaluate continuously.","It’s a journey and architecture principle, not one product to buy."],"e":"After the 2009 “Operation Aurora” attacks, Google built BeyondCorp, letting employees access internal apps from any network, with access based on user identity and device state, not on being in the office.","p":["Calling a VPN “zero trust”","Internal services with no authentication","MFA via SMS only for admins","Buying a product and skipping the identity work"],"v":["Perimeter Security","Perimeter: trust anything inside the walls. Zero trust: trust nothing by location; verify identity, device and permission every time."],"f":["Request to internal app","Verify user + MFA","Check device + policy","Allow only that resource, log it"],"q":[["What is lateral movement?","An attacker who compromised one machine moving to others within the network, often because internal traffic is trusted."],["Name three building blocks of zero trust.","Strong identity with MFA, device postu
