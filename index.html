e replica is up to date."],["What is read repair?","When a read detects a stale replica, it writes the newest value back to it."],["What is hinted handoff?","When a target replica is down, another node temporarily stores the write and forwards it when the replica returns."],["Why use LOCAL_QUORUM in multi-region Cassandra?","It requires a quorum within the local region only, avoiding cross-region latency on every request."]],"r":[30,135,33,93],"k":["N=3 replicas. Which setting guarantees reads see the latest successful write?",["W=1, R=1","W=2, R=2","W=1, R=2","W=0, R=3"],1,"W + R must exceed N (2 + 2 > 3) so read and write sets always overlap."],"sl":"quorums"},{"n":137,"c":"dist","t":"Heartbeats & Gossip Protocol","s":"Heartbeats are “I’m alive” messages; gossip is how nodes spread information to each other like rumours, without a central server.","w":"Heartbeats: each node regularly sends a small signal (every second or so). If a monitor or peer misses several in a row, it marks the node as suspected dead. Gossip: every second, each node picks a few random peers and shares what it knows (who’s alive, versions of data). Those peers pass it on. Like a rumour in a school, information reaches everyone in a few rounds (roughly log N), even in clusters of thousands.","y":"Large clusters need to know who’s alive without one central bottleneck. Gossip is used for membership and failure detection in Cassandra, Consul, Redis Cluster and DynamoDB.","h":["Send heartbeats at a fixed interval and declare failure only after several misses (avoids false alarms).","Use a phi-accrual detector (adaptive suspicion level) instead of a fixed timeout when networks are noisy.","With gossip, each node contacts a few random peers per round and merges state using version numbers.","Mark nodes “suspect” first, then “dead”, giving them time to refute.","Use gossip for metadata (membership, load), not for large data transfers.","Pair failure detection with automatic actions: remove from load balancer, re-replicate data, elect a new leader."],"e":"Cassandra nodes gossip every second with up to three other nodes about cluster state, so every node learns about joins and failures within seconds without any master server.","p":["Declaring nodes dead after a single missed heartbeat","Heartbeat interval too long, so failures go unnoticed for minutes","Central monitor that is itself a single point of failure"],"v":["Health Checks","Health checks are usually done BY a load balancer TO a server. Heartbeats and gossip are nodes in a CLUSTER monitoring each other in a decentralized way."],"f":["Node A tells 3 random peers","They tell 3 more each","Whole cluster knows in ~log N rounds","!Missed heartbeats → suspect → dead"],"q":[["Why use gossip instead of a central coordinator?","It scales to thousands of nodes, has no single point of failure, and tolerates message loss."],["How fast does gossip spread information?","In about O(log N) rounds, since the number of informed nodes roughly multiplies each round."],["How do you avoid falsely declaring a slow node dead?","Require several missed heartbeats, use adaptive detectors like phi-accrual, and use a suspect state before dead."],["What is a phi-accrual failure detector?","It outputs a suspicion level based on the history of heartbeat arrival times instead of a fixed timeout, adapting to network conditions."],["What shouldn’t gossip be used for?","Large data transfers; it’s meant for small metadata like membership and status."]],"r":[135,74,31,93],"k":["Why do systems mark a node 'suspect' before 'dead'?",["To save memory","To avoid false failure declarations from brief delays, giving the node a chance to respond","Because gossip is slow","To elect a leader"],1,"Networks have hiccups; a suspect state reduces unnecessary failovers and data movement."],"sl":"heartbeats-and-gossip-protocol"},{"n":138,"c":"arch","t":"Monolith vs Microservices","s":"A monolith is one deployable application; microservices split the system into many small services that deploy and scale independently.","w":"Monolith: one codebase, one deploy, one database, function calls between modules. Microservices: separate services (users, orders, payments), each owning its data, talking over the network (HTTP/gRPC/events). A middle ground is the “modular monolith”: one deploy, but with strict internal module boundaries.","y":"It’s an almost guaranteed interview question, and a decision that shapes team speed for years. Microservices solve organisational scaling problems but add huge operational complexity.","h":["Start with a (modular) monolith for new products and small teams; it’s faster to build, test, debug and deploy.","Move to microservices when teams block each other, parts need very different scaling, or deploys become too risky.","Split by business capability (bounded contexts), not technical layers.","Each service owns its database; no sharing tables between services.","Invest in platform basics first: CI/CD, observability, tracing, service discovery, API contracts.","Use the strangler fig pattern: carve out one piece at a time behind a router instead of a big rewrite.","Expect new problems: network failures, distributed transactions, eventual consistency, versioning."],"e":"Amazon and Netflix moved to microservices to let hundreds of teams ship independently. Meanwhile, Shopify runs one of the world’s largest Rails monoliths (modular) successfully, and Amazon Prime Video famously moved one monitoring service back to a monolith to cut costs by 90%.","p":["Starting a 3-person startup with 15 microservices","“Distributed monolith”: services that must deploy together and share a database","Splitting by layers (UI service, DB service) instead of business domains"],"v":["Modular Monolith","A modular monolith keeps clean module boundaries but deploys as one unit, giving most of the code organisation benefits without network complexity. It’s often the best first step."],"f":["Start: modular monolith","!Teams block each other","Strangle out one domain","Independent service + own DB"],"q":[["Give two benefits and two costs of microservices.","Benefits: independent deploys and scaling per service, team autonomy. Costs: network failures and latency, distributed data consistency, more operational overhead."],["What is a distributed monolith?","Services that are technically separate but so coupled (shared DB, lockstep deploys) that you get the costs of both and benefits of neither."],["What is the strangler fig pattern?","Gradually replacing parts of a legacy system by routing specific features to new services until the old system can be retired."],["How should services be split?","By business capabilities / bounded contexts, each owning its own data."],["What evidence justifies splitting a monolith?","Teams blocking each other’s releases, parts needing very different scaling or reliability, and deploy risk or build times growing unmanageable."]],"r":[140,139,9,156],"k":["A 4-person startup is building its first product. Which architecture is usually best?",["20 microservices","A modular monolith with clear internal boundaries","A service mesh","Serverless functions per database table"],1,"A modular monolith is faster to build and operate; split out services later when there’s clear evidence."],"sl":"monolith-vs-microservices"},{"n":139,"c":"ops","t":"Service Mesh & Sidecars","s":"A layer of small proxies next to every service that handles networking jobs like retries, mTLS, routing and metrics, so app code doesn’t have to.","w":"In a service mesh (Istio, Linkerd, Consul Connect), every service instance gets a sidecar proxy (often Envoy) in the same pod. All traffic in and out goes through it. A control plane configures all sidecars centrally: “retry calls to payments twice”, “send 5% of traffic to v2”, “encrypt everything with mTLS”.","y":"With 100 microservices in 5 languages, implementing timeouts, retries, circuit breakers, tracing and encryption in each one is inconsistent and slow. The mesh does it uniformly.","h":["Adopt it only when you have many services; for a few, libraries are simpler.","Enable automatic mTLS for zero-trust service-to-service encryption.","Configure timeouts, retries (with budgets) and circuit breaking per route.","Use traffic splitting for canary releases and fault injection for chaos testing.","Collect golden-signal metrics and traces from sidecars for every service automatically.","Watch overhead: each hop adds a little latency and memory; consider sidecar-less modes (Istio ambient, eBPF meshes)."],"e":"Lyft created Envoy to handle networking between its many services; it became the standard sidecar proxy used by Istio and other meshes.","p":["Adopting a mesh for 3 services and drowning in complexity","Retries configured both in app code and mesh, multiplying load","Ignoring the extra latency and resource cost"],"v":["API Gateway","An API gateway manages NORTH-SOUTH traffic (outside clients into your system). A service mesh manages EAST-WEST traffic (service to service inside)."],"f":["Service A calls B","A’s sidecar: retry, mTLS","B’s sidecar receives","Metrics + traces auto-collected"],"q":[["What is a sidecar?","A helper container running next to the app container in the same pod, here a proxy handling network traffic."],["What features does a service mesh provide?","mTLS, retries/timeouts, circuit breaking, traffic splitting, observability and access policies."],["Gateway vs mesh?","Gateway handles external client traffic entering the system; mesh handles internal service-to-service traffic."],["Why can retries in both the app and the mesh be dangerous?","They multiply: 3 app attempts × 3 mesh attempts = 9 calls per request. Configure retries in one place."],["What is 'sidecar-less' mesh?","Designs like Istio ambient mode or eBPF-based meshes that move proxy work out of each pod to reduce overhead."]],"r":[64,51,13,102],"k":["What is a sidecar proxy in a service mesh?",["A backup database","A proxy running next to each service instance that handles its network traffic","A CDN node","A type of load balancer in front of the cluster"],1,"Every pod gets its own proxy (often Envoy) that implements retries, mTLS, routing and telemetry."],"sl":"service-mesh-and-sidecars"},{"n":140,"c":"arch","t":"Stateless vs Stateful Services","s":"A stateless service remembers nothing between requests (any server can handle any request); a stateful service keeps data in memory or on its own disk.","w":"Stateless: each request carries everything needed (like a token), and shared data lives in a database or cache. Kill a server and nothing is lost. Stateful: the server holds sessions, WebSocket connections, game state or database files. Requests must reach the right server, and losing it loses state.","y":"Stateless services are easy to scale, load balance and replace, which is why designs push state into dedicated systems. Interviewers expect you to say “keep app servers stateless”.","h":["Store sessions in Redis/DB or use signed tokens instead of server memory.","Store files in object storage (S3), not local disk.","Keep caches either shared (Redis) or treat local caches as disposable.","For truly stateful parts (databases, WebSocket hubs, game servers), use replication, consistent routing (sticky by user/room ID) and failover.","In Kubernetes, use Deployments for stateless and StatefulSets with persistent volumes for stateful.","Make stateful pieces few and well-managed; make everything else stateless."],"e":"A shopping site stored carts in server memory. Every deploy or scale-down emptied users' carts. Moving carts to Redis made app servers stateless and fixed it.","p":["Sessions in local memory behind a load balancer","Uploads saved on one server’s disk","Treating a stateful service like disposable stateless pods"],"v":["Sticky Sessions","Sticky sessions route a user to the same server to work around server-side state. Making the service stateless removes the need for stickiness."],"f":["Request + token","Any server handles it","State read from Redis/DB","!Server dies → nothing lost"],"q":[["Why are stateless services easier to scale?","Any instance can serve any request, so you can add/remove instances freely behind a load balancer."],["Where does state go in a stateless design?","Databases, caches like Redis, object storage, or the client (signed tokens)."],["Name examples of inherently stateful components.","Databases, message brokers, WebSocket connection servers, multiplayer game servers."],["How do you scale a stateful WebSocket service?","Route each user/room consistently to a server, share messages via pub/sub, and support reconnecting to another server on failure."],["Deployment vs StatefulSet in Kubernetes?","Deployments are for interchangeable stateless pods; StatefulSets give stable identities and persistent volumes."]],"r":[82,152,62,8],"k":["Users lose their shopping carts every time you deploy. What design fix applies?",["Use sticky sessions","Store carts in a shared store (Redis/DB) so app servers are stateless","Deploy less often","Add more memory"],1,"In-memory state dies with the instance; externalize it so any instance can serve any request."],"sl":"stateless-vs-stateful-services"},{"n":141,"c":"dist","t":"Unique ID Generation","s":"Creating IDs that are unique across many servers without every server asking one central database for the next number.","w":"A single auto-increment counter becomes a bottleneck and single point of failure in a distributed system. Options: UUIDs (random 128-bit, no coordination, but large and unordered), Snowflake IDs (64-bit: timestamp + machine ID + sequence number; unique and roughly time-sorted), ULID/UUIDv7 (time-ordered UUIDs), or ticket servers that hand out ranges of IDs.","y":"“Design a URL shortener” or “design Twitter” always needs IDs. Sorted IDs help database index performance and let you order items by creation time.","h":["Need simple and no ordering? UUIDv4.","Need sortable and index-friendly? UUIDv7 or ULID.","Need compact 64-bit and time-ordered at huge scale? Snowflake: 41 bits timestamp (ms), 10 bits machine ID, 12 bits sequence (4,096 IDs per ms per machine).","Assign machine IDs uniquely (config, ZooKeeper/etcd lease).","Handle clock going backwards: wait or refuse until the clock catches up.","Range allocation: each server grabs a block (e.g. 1,000 IDs) from a central counter and uses them locally.","Don’t expose sequential IDs publicly if guessing them is a risk; use random or encoded IDs."],"code":"Snowflake (64 bits)\n| 1 sign | 41 timestamp ms | 10 machine id | 12 sequence |\nid = (ts - EPOCH) << 22 | machine << 12 | seq\n# 4096 IDs per millisecond per machine, sorted by time","e":"Twitter created Snowflake to generate tweet IDs across many servers; Discord and Instagram use similar schemes. That’s why tweet IDs are huge numbers that grow over time.","p":["Random UUIDv4 as a primary key in a huge B-tree table, causing scattered index inserts","Duplicate machine IDs producing duplicate Snowflakes","Ignoring clock rollback"],"v":["Auto-increment","Auto-increment needs one central database to coordinate. Snowflake/UUIDs generate IDs independently on each server."],"f":["Server needs an ID","Timestamp + machine ID","+ per-ms sequence","Unique, time-sorted 64-bit ID"],"q":[["What are the parts of a Snowflake ID?","A timestamp (ms since custom epoch), a machine/worker ID, and a per-millisecond sequence number."],["Why can random UUIDs hurt database performance?","Random values insert all over the B-tree index, causing page splits and poor cache locality; time-ordered IDs append near the end."],["How would you generate IDs for a URL shortener?","Use a distributed ID generator (Snowflake or range allocation) and encode the number in base62 for short codes."],["What should a Snowflake generator do if the clock moves backwards?","Refuse or wait until the clock passes the last used timestamp, to avoid generating duplicate IDs."],["Why might you avoid exposing sequential IDs publicly?","They reveal volume and allow guessing other resources' IDs; use random or encoded identifiers externally."]],"r":[127,94,28,142],"num":"Snowflake: 12-bit sequence = 4,096 IDs per ms per machine = ~4M IDs/s per machine.\n41-bit timestamp in ms ≈ 69 years from the custom epoch.\n10-bit machine ID = up to 1,024 generators.","k":["Why are random UUIDv4 primary keys sometimes slow in large B-tree tables?",["They’re too short","Random values insert all over the index, causing page splits and poor cache locality","UUIDs can’t be indexed","They require a central server"],1,"Time-ordered IDs (Snowflake, UUIDv7, ULID) append near the end of the index instead."],"sl":"unique-id-generation"},{"n":142,"c":"arch","t":"Back-of-the-Envelope Estimation","s":"Quick, rough maths to estimate traffic, storage and servers, so your design fits the real scale.","w":"Before designing, interviewers want numbers: How many requests per second? How much storage per year? How much bandwidth? You don’t need exact answers, just the right order of magnitude (thousands vs millions). Useful facts: 1 day ≈ 86,400 s ≈ 10^5 s; 1 million requests/day ≈ 12 per second; 1 KB × 1 billion = 1 TB.","y":"The numbers decide the design. 50 requests/second fits on one server; 500,000 needs caching, sharding and queues. Skipping estimation leads to over- or under-engineering, and interviewers notice.","h":["Start from users: daily active users (DAU) × actions per user per day = requests per day.","Divide by ~100,000 to get average requests per second; multiply by 2–5 for peak.","Split reads vs writes (social apps are often 100:1 read-heavy).","Storage = new items per day × size per item × days retained (× replication factor, usually 3).","Bandwidth = requests per second × response size.","Servers ≈ peak QPS ÷ QPS one server handles (assume ~1,000–10,000 for simple APIs).","Round aggressively and state your assumptions out loud."],"code":"Twitter-like example\nDAU = 200M, each posts 2 tweets/day → 400M tweets/day\nWrite QPS ≈ 400M / 10^5 ≈ 4,000/s (peak ~10,000/s)\nEach user reads 100 tweets/day → 20B reads/day ≈ 200,000/s\nTweet ≈ 300 bytes → 400M × 300B ≈ 120 GB/day ≈ 44 TB/year\n(+ media stored separately in object storage)","e":"In a “design a URL shortener” interview, estimating 100M new links/month quickly shows you need about 40 writes/second but maybe 4,000 reads/second, so caching the redirects matters far more than write scaling.","p":["Diving into design with no numbers","Spending 15 minutes on exact arithmetic","Forgetting peak traffic, replication or media size"],"v":["Capacity Planning","Envelope estimation is a quick rough check during design. Capacity planning is ongoing, data-driven forecasting with real metrics and load tests."],"f":["DAU × actions/day","÷ 10^5 → avg QPS","× peak factor","Storage, bandwidth, servers"],"q":[["How many seconds in a day, roughly?","About 86,400, which you can round to 10^5 for quick estimates."],["1 million requests per day is about how many per second?","Roughly 12 per second on average."],["How do you estimate yearly storage?","New items per day × average size × 365, then multiply for replication and growth."],["Why multiply storage estimates by a replication factor?","Data is usually stored on several replicas (often 3) plus backups, so raw capacity needed is several times the logical data size."],["What’s the most common estimation mistake?","Forgetting peak traffic and media/attachments, or spending too long on exact arithmetic."]],"r":[90,156,143,144],"num":"Key conversions:\n1 day ≈ 86,400 s ≈ 10⁵ s\n1M/day ≈ 12/s · 100M/day ≈ 1,200/s · 1B/day ≈ 12,000/s\n1 KB × 1M = 1 GB · 1 KB × 1B = 1 TB\nPeak ≈ 2–5 × average","k":["100 million requests per day is roughly how many requests per second on average?",["~100","~1,200","~12,000","~100,000"],1,"100,000,000 ÷ ~86,400 ≈ 1,160/s; peaks may be 2–5× higher."],"sl":"back-of-the-envelope-estimation"},{"n":143,"c":"arch","t":"Fan-out on Write vs Fan-out on Read","s":"Two ways to build feeds: push each new post into every follower’s feed when it’s written, or pull posts from everyone you follow when you open the app.","w":"Fan-out on write (push): when Asha posts, the system immediately adds the post ID to the precomputed feed of each of her followers (stored in Redis lists). Reading a feed is then super fast. Fan-out on read (pull): nothing happens at post time; when you open your feed, the system fetches recent posts from everyone you follow and merges them. Writing is cheap, reading is expensive.","y":"This is THE core trade-off in “Design Twitter / Instagram / news feed” interviews, and the celebrity problem is the follow-up question.","h":["Push model: fast reads, but a user with 50 million followers creates 50 million writes per post.","Pull model: no write amplification, but every feed load queries many users and merges, which is slow.","Hybrid (what real systems do): push for normal users; for celebrities, don’t fan out; merge their recent posts at read time.","Store only post IDs in feeds, fetch content separately (cached).","Cap feed length (e.g. last 800 items) and skip fan-out to inactive users.","Do fan-out asynchronously through a queue so posting stays fast."],"e":"Twitter used fan-out on write into Redis timelines for most users, but handled accounts with huge follower counts separately at read time, merging their tweets into your timeline when you open it.","p":["Pure push with celebrities causing massive write storms","Pure pull making every feed load hit hundreds of users' data","Doing fan-out synchronously in the post request"],"v":["Pub/Sub","Pub/sub delivers events to subscriber SERVICES. Feed fan-out delivers content into each USER’s feed storage. Fan-out workers are often powered by a queue or pub/sub underneath."],"f":["User posts","Normal user → push to followers' feeds","Celebrity → skip fan-out","Read: precomputed feed + merge celebs"],"q":[["What is the celebrity problem?","With fan-out on write, a user with millions of followers triggers millions of feed writes per post."],["How does the hybrid approach work?","Push posts of normal users into feeds; pull and merge celebrity posts at read time."],["Why store only IDs in feeds?","Saves memory and lets edits/deletes update in one place; content is fetched from a cache by ID."],["How do you avoid fanning out to inactive users?","Skip users who haven’t logged in recently and build their feed on demand (pull) when they return."],["Where should fan-out happen?","Asynchronously in workers consuming from a queue, so posting returns quickly."]],"r":[134,36,6,142],"num":"User with 10,000 followers posts → 10,000 feed writes (fine).\nCelebrity with 50M followers → 50M writes per post; at 1M writes/s that's ~50 s of fan-out per post.\nHybrid: skip fan-out for accounts above a threshold (e.g. 100k followers) and merge at read time.","k":["Why don’t large social networks use pure fan-out on write for celebrity accounts?",["It’s illegal","Each celebrity post would trigger millions of feed writes, causing huge write spikes","Reads would be slower","Celebrities don’t post often"],1,"Write amplification scales with follower count; celebrities are handled with fan-out on read instead."],"sl":"fan-out-on-write-vs-fan-out-on-read"},{"n":144,"c":"scale","t":"Object Storage & Presigned URLs","s":"Store files (images, videos, backups) in services like S3, and let users upload or download directly using temporary signed links.","w":"Object storage (Amazon S3, Google Cloud Storage, Cloudflare R2, MinIO) stores files as objects in buckets with keys like users/7/avatar.jpg. It’s cheap, durable (S3 is designed for 11 nines of durability) and scales infinitely, but you can’t edit part of a file like a disk. A presigned URL is a link your server signs that allows one specific action (upload or download a specific key) for a few minutes, without making the bucket public.","y":"Sending big uploads through your API servers wastes bandwidth and CPU, hits size limits and timeouts. With presigned URLs the client talks to S3 directly, and your server only hands out permission.","h":["Never store large files in the database; store the object key in the DB and the file in object storage.","Upload flow: client asks API → API checks permissions, creates a presigned PUT URL (e.g. 5 min) → client uploads directly → S3 event or client callback tells your app it’s done.","Download: serve public assets via CDN; private files via short-lived presigned GET URLs.","Use multipart uploads for big files (resumable, parallel).","Keep buckets private; block public access by default.","Validate file type and size (presigned policies can limit size/content type) and scan uploads if needed.","Use lifecycle rules to move old files to cheaper storage classes or delete them."],"code":"url = s3.generate_presigned_url(\"put_object\",\n    Params={\"Bucket\": \"uploads\", \"Key\": f\"users/{uid}/{uuid4()}.jpg\",\n            \"ContentType\": \"image/jpeg\"},\n    ExpiresIn=300)   # valid 5 minutes\n# client: PUT the file straight to url","e":"WhatsApp-style and Instagram-style apps upload photos directly to object storage, then a background job creates thumbnails, and a CDN serves them worldwide.","p":["Public buckets leaking private files (a common cause of data breaches)","Streaming large uploads through app servers","Storing images as BLOBs in the main database"],"v":["Block Storage","Block storage (a disk like EBS) is attached to one server and supports partial edits. Object storage is accessed over HTTP by key, whole-object writes, massively scalable."],"f":["Client asks API to upload","API returns presigned URL","Client PUTs file to S3 directly","Event → thumbnail job, CDN serves"],"q":[["Why use presigned URLs?","Clients upload/download directly to storage with time-limited permission, offloading bandwidth from servers while keeping buckets private."],["What should the database store for an uploaded file?","Metadata and the object key (path), not the file bytes."],["How do you handle very large uploads?","Multipart uploads: split into parts uploaded in parallel and resumable, then combined."],["How do you know when a direct upload finished?","Use storage event notifications (e.g. S3 events) or have the client call your API after the upload, then verify the object exists."],["What’s a common cause of data breaches with object storage?","Buckets accidentally made public. Block public access by default and serve private files via short-lived signed URLs."]],"r":[84,88,50,121],"num":"10M photo uploads/day × 2 MB = 20 TB/day through your API servers.\nWith presigned URLs: API handles ~10M tiny JSON requests; storage receives the 20 TB directly.","k":["Why use presigned URLs for uploads?",["They make files smaller","Clients upload directly to storage with time-limited permission, so app servers don’t carry the bytes","They encrypt files","They replace authentication"],1,"Your server checks permission and signs a short-lived URL; heavy traffic goes straight to object storage."],"sl":"object-storage-and-presigned-urls"},{"n":145,"c":"db","t":"Search & Inverted Index","s":"Full-text search works by keeping a map from each word to the list of documents containing it, like the index at the back of a book.","w":"To find products matching “red running shoes”, scanning every row with LIKE '%red%' is slow and dumb (no ranking, no typos). An inverted index tokenizes text into terms (“red”, “run”, “shoe” after stemming) and stores term → list of document IDs. A query intersects these lists and ranks results by relevance (e.g. BM25: rare words that appear often in a document score higher). Engines: Elasticsearch, OpenSearch, Solr, Meilisearch, Typesense, Postgres full-text search.","y":"Every e-commerce, docs or social app needs search. Interviewers ask “design search for X” or “how would you implement autocomplete”.","h":["Keep the primary database as the source of truth; sync data to the search engine (CDC or events), accepting slight delay.","Define analyzers: lowercase, remove stop words, stemming, synonyms, language rules.","Use fuzzy matching for typos and n-grams/edge n-grams for autocomplete.","Tune relevance with field boosts (title more important than description), recency and popularity.","Add filters and facets (brand, price range) on structured fields.","Shard and replicate the index for scale; reindex with aliases for zero downtime.","For small apps, Postgres full-text search (tsvector + GIN index) may be enough."],"code":"\"red running shoes\"\ntokens → [red, run, shoe]\nred  → [3, 9, 42]\nrun  → [9, 17, 42]\nshoe → [9, 42, 88]\nintersection → [9, 42]  → rank by BM25 → results","e":"Wikipedia uses Elasticsearch (via CirrusSearch) to search millions of articles in hundreds of languages in milliseconds.","p":["Using LIKE '%term%' on big tables","Treating the search index as the source of truth","No plan for keeping the index in sync with the DB"],"v":["Database Index","A B-tree index finds exact values or ranges in a column. An inverted index finds documents by the WORDS inside text and ranks by relevance."],"f":["Document saved in DB","Synced to search engine","Tokenized → inverted index","Query: intersect + rank"],"q":[["What is an inverted index?","A mapping from each term to the list of documents that contain it."],["How do you keep search in sync with the database?","Publish changes via events or change data capture to an indexer; accept small delays."],["How would you build autocomplete?","Use prefix structures like edge n-grams or a trie, rank suggestions by popularity, and cache hot prefixes."],["What is stemming?","Reducing words to a root form so 'running', 'runs' and 'ran' can match 'run'."],["How do you reindex without downtime?","Build a new index in the background, then atomically switch an alias from the old index to the new one."]],"r":[20,149,128,130],"k":["Why is WHERE name LIKE '%shoe%' a poor way to build product search?",["It’s not valid SQL","It can’t use a B-tree index efficiently, has no relevance ranking and no typo tolerance","It’s too fast","It only works in MySQL"],1,"Full-text engines use inverted indexes, analyzers and relevance scoring."],"sl":"search-and-inverted-index"},{"n":146,"c":"db","t":"Geospatial Indexing","s":"Special indexes that make “find things near me” fast, by turning 2D locations into searchable cells.","w":"Finding the 10 nearest drivers by computing distance to every driver is far too slow. Geospatial indexes split the map into cells. Geohash encodes latitude/longitude into a string where nearby places share prefixes (“tdr1y” is in Bengaluru). Quadtrees recursively split busy areas into four smaller squares. Uber’s H3 uses hexagons. You search your cell plus neighbouring cells, then compute exact distances for those few candidates.","y":"“Design Uber / Zomato / Google Maps nearby search / Tinder” all need this. It’s a favourite interview deep dive.","h":["Pick a tool: PostGIS (Postgres), Redis GEO commands, Elasticsearch geo queries, MongoDB 2dsphere, or H3/S2 libraries.","Store each object’s cell ID (geohash/H3) and index it.","Query the user’s cell and its neighbours (edges matter: a close place may be in the next cell).","Choose cell size by density: larger cells in villages, smaller in dense cities (quadtrees adapt automatically).","For moving objects (drivers), keep locations in memory (Redis) and update every few seconds; don’t write each ping to the main DB.","Filter candidates by exact distance and other rules (driver available, restaurant open)."],"code":"GEOADD drivers 77.5946 12.9716 driver:42\nGEOSEARCH drivers FROMLONLAT 77.60 12.97\n          BYRADIUS 3 km ASC COUNT 10","e":"Uber built H3, a hexagonal grid system, to group supply and demand by area and quickly find nearby drivers for each ride request.","p":["Calculating distance to every row","Searching only the user’s own cell and missing nearby places across the border","Writing every GPS ping to the primary database"],"v":["B-tree Index","A B-tree handles one dimension (a number or string). Geospatial indexes handle two dimensions by mapping locations to cells or using R-trees."],"f":["User location","Compute cell (geohash/H3)","Fetch cell + neighbours","Exact distance → nearest 10"],"q":[["How does geohash help find nearby places?","Nearby locations share geohash prefixes, so you can search by prefix for the cell and neighbouring cells."],["Why also search neighbouring cells?","A nearby point can sit just across a cell boundary with a different prefix."],["How would you store live driver locations?","In memory (e.g. Redis GEO) updated every few seconds, not in the primary database for every ping."],["Why are quadtrees good for uneven density?","They split busy areas into smaller cells and keep sparse areas as big cells, keeping roughly similar item counts per cell."],["How often should a ride app store driver locations?","Every few seconds in memory (e.g. Redis GEO), not as permanent writes to the main database for every ping."]],"r":[145,134,140,142],"k":["Why must a nearby-places search check neighbouring geohash cells too?",["To find more restaurants","A close place can sit just across a cell boundary with a different prefix","Geohashes are random","For security"],1,"Cells have edges; searching only your own cell misses nearby results across the border."],"sl":"geospatial-indexing"},{"n":147,"c":"msg","t":"Stream vs Batch Processing","s":"Batch processing handles big piles of data on a schedule; stream processing handles each event continuously as it arrives.","w":"Batch: “every night, process yesterday’s 2 billion events and compute reports” (Spark, Hadoop, dbt on a warehouse). High throughput, simple to reason about, results hours late. Stream: “as each payment happens, check for fraud within 100 ms” (Kafka Streams, Flink, Spark Structured Streaming). Low latency, but harder: late events, ordering, state, exactly-once concerns.","y":"Many designs need both: real-time dashboards and alerts (stream) plus accurate daily reports and model training (batch). Interviewers ask which one fits a requirement.","h":["Ask how fresh results must be: seconds → stream; hours/day → batch.","Use batch for reports, billing runs, ML training, backfills; it’s cheaper and simpler.","Use stream for fraud detection, live metrics, notifications, real-time recommendations.","In streaming, use windows (tumbling, sliding, session) to aggregate, e.g. orders per minute.","Handle late and out-of-order events with event-time processing and watermarks.","Keep raw events in durable storage (Kafka + S3) so you can reprocess.","Lambda architecture runs both paths; Kappa architecture uses only streaming with replay."],"e":"A bank streams card transactions through Flink to block suspicious ones within milliseconds, and runs nightly batch jobs to produce statements and retrain fraud models.","p":["Building complex streaming when daily batch would do","Ignoring late events, so streaming totals don’t match batch totals","No raw event storage, so you can’t reprocess after a bug"],"v":["Message Queue","A queue moves events between services. Stream processing COMPUTES over the flow of events (aggregations, joins, windows) as they pass."],"f":["Events flow in","Stream: process each in ms","Batch: collect, run nightly","Both feed dashboards / reports"],"q":[["When choose batch over stream?","When results can be hours old and you want simpler, cheaper, high-throughput processing."],["What is a tumbling window?","A fixed-size, non-overlapping time window, like counting events per minute."],["What are watermarks?","Markers estimating how far event time has progressed, used to decide when a window can be closed despite late events."],["What’s the difference between event time and processing time?","Event time is when the event actually happened; processing time is when the system sees it. Late events make them differ."],["Lambda vs Kappa architecture?","Lambda runs separate batch and streaming paths; Kappa uses only streaming and reprocesses by replaying the log."]],"r":[148,149,154,36],"k":["Which requirement clearly needs stream processing rather than batch?",["Monthly revenue report","Blocking a fraudulent card transaction within 200 ms","Training a model weekly","Yearly tax summary"],1,"Sub-second reactions need events processed as they arrive."],"sl":"stream-vs-batch-processing"},{"n":148,"c":"msg","t":"Kafka & Log-Based Messaging","s":"Kafka stores messages in an ordered, durable log that many consumers can read at their own pace and even replay.","w":"A topic is split into partitions. Each partition is an append-only log; each message gets an increasing offset. Producers append messages (messages with the same key go to the same partition, preserving order for that key). Consumers in a consumer group split partitions among themselves and remember their offsets. Messages stay for a retention period (e.g. 7 days) whether read or not, so new consumers can start from the beginning.","y":"Unlike traditional queues that delete messages once consumed, Kafka lets many independent systems read the same stream, replay history and handle massive throughput (millions of messages per second). It’s the backbone of event-driven architectures.","h":["Choose a partition key that keeps related events ordered (e.g. order_id) and spreads load.","Number of partitions caps consumer parallelism within one group: 12 partitions = up to 12 active consumers.","Set replication factor 3 and min.insync.replicas 2 with acks=all for durability.","Commit offsets after processing (at-least-once) and make consumers idempotent.","Monitor consumer lag per group.","Use compacted topics to keep only the latest value per key (great for state/config).","Use a schema registry for message formats."],"code":"topic \"orders\" (3 partitions)\nP0: [o1 o4 o7 ...]  offsets 0,1,2\nP1: [o2 o5 ...]\nP2: [o3 o6 ...]\nkey=order_id → same partition → ordered per order\ngroup \"billing\":   consumer A ← P0,P1   consumer B ← P2\ngroup \"analytics\": reads all partitions independently","e":"LinkedIn created Kafka to move activity data (page views, clicks) to many systems; today companies like Uber and Netflix process trillions of messages per day through it.","p":["Too few partitions, capping parallelism","Expecting global ordering across partitions","acks=1 with no replication and losing data on broker failure","Ignoring consumer lag"],"v":["RabbitMQ-style Queue","Classic queues push messages to consumers and delete them after ack, with rich routing. Kafka keeps a replayable log; consumers pull and track offsets, ideal for high-throughput streams and multiple readers."],"f":["Producer appends with key","Partition log (offsets)","Consumer groups read independently","Retention lets you replay"],"q":[["How does Kafka guarantee ordering?","Only within a partition; use the same key for events that must stay ordered."],["What limits consumer parallelism?","The number of partitions: each partition is consumed by at most one consumer per group."],["What is consumer lag?","The difference between the latest offset and the consumer’s committed offset, showing how far behind it is."],["How is Kafka different from a traditional queue?","Messages are retained in a log for a set time, can be read by many groups and replayed, rather than deleted on consumption."],["What is a compacted topic?","A topic where Kafka keeps at least the latest message per key and removes older ones, useful for storing current state like user settings."]],"r":[36,147,149,120],"num":"Topic with 12 partitions → max 12 active consumers per group.\nThroughput needed 60,000 msg/s, one consumer handles 5,000 msg/s → 12 consumers → at least 12 partitions.\nRetention 7 days × 1 TB/day × replication 3 = 21 TB of broker storage.","k":["A consumer group has 8 consumers reading a topic with 4 partitions. What happens?",["All 8 share the load","Only 4 consumers get partitions; 4 sit idle","Kafka creates 4 more partitions","Messages are duplicated"],1,"Each partition is consumed by at most one consumer in a group, so partitions cap parallelism."],"sl":"kafka-and-log-based-messaging"},{"n":149,"c":"msg","t":"Change Data Capture (CDC)","s":"Automatically turning every insert, update and delete in a database into a stream of events, by reading the database’s own log.","w":"Databases already record every change in their transaction log (Postgres WAL, MySQL binlog). CDC tools like Debezium read that log and publish each change as an event (e.g. to Kafka): “orders row 42 changed status from paid to shipped”. Other systems subscribe: search index, cache invalidation, data warehouse, analytics.","y":"Without CDC, apps do “dual writes” (save to DB, then also update Elasticsearch and send an event), which get out of sync when one fails. CDC captures exactly what was committed, in order, without changing application code.","h":["Enable logical replication/binlog on the database.","Run a CDC connector (Debezium + Kafka Connect, or managed options like AWS DMS, Fivetran).","Publish changes per table to topics, keyed by primary key to keep per-row order.","Consumers update search indexes, caches, warehouses, other services.","Pair with the outbox pattern to publish clean domain events instead of raw table changes.","Monitor replication slot lag: a stuck consumer can make the database keep WAL forever and fill the disk.","Handle schema changes and initial snapshots (the connector can snapshot existing data first)."],"e":"Many companies keep Elasticsearch in sync with Postgres using Debezium: every product update in Postgres appears in search within a second or two, with no extra code in the app.","p":["Abandoned replication slots filling the database disk","Exposing raw internal table structure as a public event contract","Forgetting the initial snapshot of existing data"],"v":["Transactional Outbox","CDC streams ALL row changes from tables. The outbox writes specific DOMAIN EVENTS to a table, often published using CDC. They work well together."],"f":["App updates DB row","Change recorded in WAL","Debezium reads log → Kafka","Search, cache, warehouse update"],"q":[["How does CDC capture changes?","By reading the database’s transaction log (WAL/binlog), not by polling tables or changing app code."],["What problem does CDC solve compared to dual writes?","It avoids inconsistency when one of two writes fails, since it derives events from what was actually committed."],["What’s a common operational risk with CDC on Postgres?","A stalled replication slot retains WAL indefinitely and can fill the disk."],["What is an initial snapshot in CDC?","Copying existing table data first so downstream systems start complete, then streaming changes from that point."],["Why might you not expose raw CDC table events to other teams?","They mirror internal table structure; renaming a column breaks consumers. Publish domain events (outbox) for public contracts."]],"r":[113,148,145,154],"k":["Why use CDC to keep a search index in sync instead of writing to the DB and the index from the app?",["CDC is faster to write","CDC derives changes from what was actually committed, avoiding inconsistency when one dual write fails","Search engines require it","It removes the need for a database"],1,"Dual writes can half-fail; reading the transaction log captures exactly the committed changes in order."],"sl":"change-data-capture-cdc"},{"n":150,"c":"net","t":"REST vs GraphQL","s":"REST exposes many URLs for resources; GraphQL exposes one endpoint where the client asks for exactly the fields it needs.","w":"REST: GET /users/7, GET /users/7/orders, each returning a fixed shape, using HTTP methods and status codes. GraphQL: POST /graphql with a query like { user(id: 7) { name orders { total } } }, returning exactly that shape, defined by a typed schema. REST can over-fetch (too many fields) or under-fetch (needing several calls); GraphQL solves both but adds complexity.","y":"It’s a common “which API style would you choose?” question. The right answer depends on clients and team.","h":["Choose REST for simple CRUD, public APIs, easy HTTP caching and wide tool support.","Choose GraphQL when many clients (web, iOS, Android) need different shapes of the same data, or screens combine lots of related data.","In GraphQL, prevent N+1 with DataLoader batching.","Protect GraphQL from expensive queries: depth limits, query cost analysis, persisted queries, timeouts.","Caching: REST uses HTTP caching easily; GraphQL needs client caches (Apollo, Relay) or persisted GET queries.","Authorization must be checked per field/object in GraphQL resolvers.","gRPC is the third option for internal service-to-service calls."],"code":"# REST: 3 calls\nGET /users/7\nGET /users/7/orders\nGET /orders/91/items\n\n# GraphQL: 1 call, exact fields\nquery { user(id: 7) { name\n  orders(last: 3) { total items { name } } } }","e":"Facebook created GraphQL in 2012 for its mobile apps, which needed to load complex news feed data efficiently over slow mobile networks. GitHub offers both a REST API and a GraphQL API.","p":["Unbounded GraphQL queries taking down the server","N+1 queries hidden in resolvers","Using GraphQL for a tiny CRUD app where REST is simpler"],"v":["gRPC","REST and GraphQL are popular for client-facing APIs. gRPC is typed, binary and fast, usually best for internal service-to-service calls."],"f":["Mobile screen needs data","REST: 3 round trips","GraphQL: 1 query, exact fields","Resolvers batch with DataLoader"],"q":[["What are over-fetching and under-fetching?","Over-fetching: getting more fields than needed. Under-fetching: needing multiple requests to gather all data for a screen."],["Why is caching harder with GraphQL?","Most queries are POSTs to one URL with varied bodies, so standard HTTP/CDN caching doesn’t apply directly."],["How do you protect a GraphQL server from abusive queries?","Depth and complexity limits, query cost analysis, persisted/allowlisted queries, rate limits and timeouts."],["How does DataLoader help GraphQL performance?","It batches and caches lookups made by resolvers during one request, turning many per-item queries into one."],["When would you pick REST over GraphQL?","Simple CRUD, public APIs needing easy HTTP caching and broad tooling, or small teams without many different clients."]],"r":[57,116,77,5],"k":["What is a major operational risk of a public GraphQL API?",["It can’t return JSON","Clients can send deeply nested, very expensive queries","It doesn’t support authentication","It always over-fetches"],1,"Flexible queries need depth/complexity limits, timeouts and often persisted queries."],"sl":"rest-vs-graphql"},{"n":151,"c":"sec","t":"Password Hashing","s":"Store passwords as slow, salted one-way hashes, never as plain text or simple encryption, so a stolen database doesn’t reveal them.","w":"A hash is a one-way fingerprint: you can check a password against it but can’t reverse it. Fast hashes like MD5 or SHA-256 are bad for passwords because attackers can try billions per second with GPUs. Password hashing algorithms (Argon2id, bcrypt, scrypt) are deliberately slow and memory-hungry. A salt (random value per user) is stored with the hash so identical passwords produce different hashes and precomputed “rainbow tables” don’t work.","y":"Databases get breached. If passwords are stored properly, attackers get almost nothing; if not, they get every user’s password, which people reuse on other sites.","h":["Use Argon2id (preferred) or bcrypt via a trusted library; never write your own.","Let the library generate a unique random salt per password (it’s stored inside the hash string).","Tune the cost so hashing takes roughly 100–500 ms on your servers, and raise it over time.","Rehash on login when you upgrade the algorithm or cost.","Compare hashes with constant-time functions (libraries do this).","Add rate limiting, breached-password checks and MFA; hashing alone doesn’t stop online guessing.","Never log passwords or send them in URLs."],"code":"from argon2 import PasswordHasher\nph = PasswordHasher()\nstored = ph.hash(\"hunter2\")   # '$argon2id$v=19$m=65536,t=3,p=4$...'\nph.verify(stored, attempt)    # raises if wrong","e":"In the 2012 LinkedIn breach, about 6.5 million (later revealed 117 million) passwords were stored as unsalted SHA-1 hashes, and most were cracked quickly. Salted bcrypt or Argon2 would have made that far harder.","p":["Storing plain text or encrypted (reversible) passwords","Using MD5/SHA-256 without a slow KDF","One global salt for all users","Cost settings so low they’re barely slower than plain hashing"],"v":["Encryption","Encryption is reversible with a key; anyone with the key gets all passwords back. Hashing is one-way: you can only verify, never recover."],"f":["User signs up","Argon2id(password + salt)","Store hash only","Login: hash attempt, compare"],"q":[["Why not use SHA-256 for passwords?","It’s designed to be fast, so attackers can test billions of guesses per second; password hashes must be slow."],["What does a salt do?","Makes each hash unique even for identical passwords and defeats precomputed rainbow tables."],["Which algorithms are recommended?","Argon2id first, then scrypt or bcrypt, with properly tuned cost."],["What is a pepper?","A secret value (stored outside the database, e.g. in a KMS) mixed into hashing, so a DB-only leak isn’t enough to crack hashes."],["How do you upgrade old MD5 hashes?","Rehash on next successful login with Argon2id, or wrap old hashes (argon2(md5(pw))) immediately and migrate."]],"r":[152,19,2,122],"num":"Fast hash (SHA-256 on a GPU): billions of guesses per second.\nArgon2id tuned to ~200 ms and 64 MB per hash: about 5 guesses/s per core and heavy memory per guess.\nAn 8-character lowercase password (26⁸ ≈ 2×10¹¹) falls in minutes with fast hashes; with Argon2id it becomes impractical.","k":["Why is a unique salt per password important?",["It makes hashing faster","Identical passwords get different hashes and precomputed rainbow tables don’t work","It encrypts the password","It replaces MFA"],1,"Salts force attackers to crack each hash separately."],"sl":"password-hashing"},{"n":152,"c":"sec","t":"Sessions vs Tokens (JWT)","s":"Two ways to remember a logged-in user: a server-side session looked up by an ID cookie, or a self-contained signed token the server can verify without lookup.","w":"Session: after login, the server stores {session_id → user 7} in Redis/DB and sends the session ID in an HttpOnly cookie. Every request looks it up. Logout = delete it. Token (JWT): the server sends a signed token containing {user: 7, exp: ...}. Any server can verify the signature without a database lookup, but you can’t easily revoke it before it expires.","y":"“How would you handle authentication?” is a standard question, and choosing JWTs for everything is a common mistake.","h":["For typical web apps: server-side sessions in an HttpOnly, Secure, SameSite cookie are simple and easy to revoke.","For APIs used by mobile apps, third parties or many services: short-lived access tokens (JWT, 5–15 min) plus refresh tokens.","Don’t store tokens in localStorage if you can avoid it (readable by XSS); prefer HttpOnly cookies or secure mobile storage.","Keep JWT payloads small and non-sensitive (they’re readable, just signed).","Plan revocation: short expiry, refresh token rotation, and a denylist for emergencies.","Store sessions in a shared store (Redis) so app servers stay stateless."],"code":"Session:  Cookie: sid=8f2a…  → Redis: sid → {user: 7}\nJWT:      Authorization: Bearer eyJhbGciOi…\n          payload {\"sub\":\"7\",\"exp\":1760900000}  (signed, not encrypted)","e":"Many large web apps like GitHub use classic session cookies for the browser, and separate tokens (personal access tokens, OAuth tokens) for API and CLI access.","p":["Using long-lived JWTs with no way to log users out","Putting sensitive data in the JWT payload","Storing tokens in localStorage on XSS-prone sites","Sessions in one server’s memory"],"v":["OAuth","Sessions and JWTs are ways to keep a user logged in to YOUR app. OAuth is a protocol for granting a third-party app access, which may issue tokens (sometimes JWTs)."],"f":["User logs in","Session: store ID in Redis","JWT: sign token","Each request: lookup vs verify"],"q":[["Main advantage of sessions over JWTs?","Easy, immediate revocation (delete the session) and nothing sensitive leaves the server."],["Main advantage of JWTs?","Stateless verification: any service can validate the signature without a shared lookup."],["Is a JWT encrypted?","Usually not; it’s base64-encoded and signed, so anyone can read the payload but can’t modify it."],["Where should a browser app store tokens?","Preferably in HttpOnly, Secure, SameSite cookies, which JavaScript (and thus XSS) can’t read."],["Why keep JWT payloads small?","They’re sent on every request and readable by anyone; large or sensitive payloads waste bandwidth and leak data."]],"r":[47,46,140,44],"k":["You need to log out a user immediately on all devices. Which approach makes this easiest?",["Long-lived JWTs","Server-side sessions you can delete (or short-lived tokens with revocable refresh tokens)","Storing tokens in localStorage","Removing the cookie client-side only"],1,"Deleting server-side sessions or revoking refresh tokens takes effect immediately; a long-lived JWT stays valid until expiry."],"sl":"sessions-vs-tokens-jwt"},{"n":153,"c":"scale","t":"Cache Eviction Policies","s":"Rules that decide which item to throw out when the cache is full: least recently used, least frequently used, oldest, and so on.","w":"Cache memory is limited. When it’s full and a new item comes in, something must go. LRU (Least Recently Used) evicts what hasn’t been accessed for the longest time. LFU (Least Frequently Used) evicts what’s accessed least often. FIFO evicts the oldest inserted. TTL-based expiry removes items after a time. Random eviction is surprisingly okay and cheap.","y":"The wrong policy wastes memory on useless items and lowers hit rate. “Design an LRU cache” is also a classic coding interview question.","h":["LRU is the default for most workloads: recently used data is likely used again.","LFU suits stable popularity (top products); it resists one-off scans pushing out popular items.","TTL guarantees freshness; combine with LRU/LFU for capacity.","In Redis set maxmemory and a policy: allkeys-lru, allkeys-lfu, volatile-ttl, etc.","Protect against scan pollution (one big batch read evicting hot items) with LFU or segmented LRU.","Monitor hit ratio and eviction count; constant evictions mean the cache is too small.","LRU implementation: a hash map + doubly linked list gives O(1) get and put."],"code":"# Redis\nmaxmemory 2gb\nmaxmemory-policy allkeys-lfu\n\n# LRU in O(1): dict for lookup + doubly linked list for order\nfrom collections import OrderedDict\ndef get(k): v = d.pop(k); d[k] = v; return v   # move to end\ndef put(k, v):\n    d[k] = v; d.move_to_end(k)\n    if len(d) > CAP: d.popitem(last=False)     # evict LRU","e":"Redis added LFU eviction in version 4.0 because many users had workloads where a nightly batch job scanned lots of keys and pushed popular keys out under pure LRU.","p":["No maxmemory limit, so the cache crashes the server","Using LRU when scans pollute the cache","Ignoring eviction metrics"],"v":["Cache Invalidation","Eviction removes items because the cache is FULL. Invalidation removes items because they’re WRONG (data changed)."],"f":["Cache full","New item arrives","Policy picks victim (LRU/LFU)","Evict → insert new"],"q":[["LRU vs LFU?","LRU evicts the item unused for the longest time; LFU evicts the item used least often overall."],["How do you implement an LRU cache in O(1)?","Hash map for key lookup plus a doubly linked list ordering items by recency; move on access, evict from the tail."],["What metric tells you the cache is too small?","High eviction rate with a low hit ratio."],["What happens in Redis with maxmemory-policy noeviction when memory is full?","Writes that need more memory fail with errors, while reads continue."],["What two data structures implement an O(1) LRU cache?","A hash map for lookup and a doubly linked list for recency order."]],"r":[6,7,134,128],"num":"Cache 2 GB, item ~4 KB → ~500,000 items.\nWorking set 2M hot items → hit ratio will be poor regardless of policy; grow memory or cache less per item.\nEvictions 5,000/s with hit ratio 60%: cache is too small for the workload.","k":["A nightly batch job scans millions of keys once, and afterwards the cache hit ratio for normal users collapses. Which policy helps most?",["FIFO","LFU (or scan-resistant LRU variants)","No eviction","Random"],1,"Pure LRU lets one-off scans push out popular items; LFU keeps frequently used keys."],"sl":"cache-eviction-policies"},{"n":154,"c":"db","t":"OLTP vs OLAP","s":"OLTP databases handle lots of small, fast transactions for the app; OLAP systems handle big analytical queries over huge amounts of history.","w":"OLTP (Online Transaction Processing): Postgres/MySQL powering the app. Many tiny reads and writes per second (“place order”, “get user 7”), row-oriented storage, normalized data. OLAP (Online Analytical Processing): data warehouses like BigQuery, Snowflake, Redshift, ClickHouse. Few but massive queries (“revenue by city per month for 3 years”), column-oriented storage that reads only the needed columns and compresses well.","y":"Running heavy analytics on your production database slows down users. Interviewers expect you to separate them.","h":["Keep the app on an OLTP database.","Move data to a warehouse via ETL/ELT or CDC pipelines (Fivetran, Airbyte, Debezium, dbt for transforms).","Model analytics data as star schemas: fact tables (orders) + dimension tables (customers, products, dates).","Use columnar stores for aggregations over billions of rows.","Partition large fact tables by date.","For real-time analytics, consider ClickHouse, Druid or Pinot fed from Kafka.","At least move reports to a read replica if you don’t have a warehouse yet."],"e":"An online store runs checkout on Postgres while copying orders every few minutes into BigQuery, where the business team runs dashboards over years of data without touching production.","p":["Running giant reports on the primary database","Using a columnar warehouse as the app’s transactional database","No data modelling, so analysts write 300-line joins"],"v":["Read Replica","A read replica is a copy of the OLTP database, same row format. A warehouse is a different, column-oriented system built for analytics at scale."],"f":["App writes to OLTP DB","CDC/ETL pipeline","Columnar warehouse (OLAP)","Dashboards + big queries"],"q":[["Why are columnar stores faster for analytics?","They read only the columns a query needs and compress similar values well, scanning far less data."],["What is a star schema?","A central fact table of events (like orders) linked to dimension tables (customers, products, dates)."],["ETL vs ELT?","ETL transforms before loading into the warehouse; ELT loads raw data first and transforms inside the warehouse."],["Why shouldn’t you run big reports on the production primary database?","They consume CPU, memory and IO, and hold resources that slow down user requests."],["What is a fact table?","A table of measurable events (orders, page views) with foreign keys to descriptive dimension tables."]],"r":[129,149,147,29],"k":["Why do analytics queries run faster on a columnar warehouse?",["They use more RAM","They read only the needed columns and compress similar values well","They skip indexes","They run on mobile devices"],1,"Scanning one compressed column of a billion rows is far cheaper than reading every full row."],"sl":"oltp-vs-olap"},{"n":155,"c":"rel","t":"Single Point of Failure & Redundancy","s":"A single point of failure (SPOF) is any one component whose failure takes the whole system down; redundancy means having backups for it.","w":"If you have one load balancer, one database, one region, one DNS provider or even one engineer who knows the deploy process, each is a SPOF. Redundancy adds spares: two or more of each component, ideally in different failure zones (servers, racks, availability zones, regions), with automatic failover. Availability “nines”: 99.9% ≈ 8.8 hours down per year; 99.99% ≈ 53 minutes.","y":"Interviewers always ask “what happens if X fails?” Finding and removing SPOFs is the core of high availability.","h":["Draw the request path end to end and ask “what if this dies?” for every box (DNS, CDN, LB, app, cache, DB, queue, third-party APIs).","Run at least 2 instances of stateless services across availability zones.","Use managed redundant components (multi-AZ databases, cloud load balancers).","Replicate stateful systems with automatic failover.","Remember hidden SPOFs: a shared config service, a single NAT gateway, one certificate, one person.","Components in series multiply availability: two 99.9% services in a chain ≈ 99.8%. Components in parallel improve it.","Test failover regularly (chaos engineering)."],"code":"Series:   A(99.9%) → B(99.9%)       = 0.999 × 0.999 ≈ 99.8%\nParallel: A(99%) or B(99%) both up? = 1 - (0.01 × 0.01) = 99.99%","e":"Many outages come from overlooked SPOFs: a single expired certificate, a single config push system, or one region. In 2021 a single faulty config change at Fastly briefly took down major sites like Amazon, Reddit and the UK government’s website.","p":["Redundant app servers but one database with no standby","Two instances in the same availability zone","Forgetting third-party dependencies like payment or SMS providers"],"v":["Failover","Redundancy is HAVING spare components. Failover is the act of SWITCHING to them when the primary fails."],"f":["Map the request path","!Find single components","Add replicas across zones","Automate + test failover"],"q":[["How do you find SPOFs?","Trace the full request path and dependencies and ask what happens if each component fails."],["How does chaining services affect availability?","Availabilities multiply, so a chain of components is less available than any single one."],["How much downtime per year is 99.99%?","About 53 minutes."],["How do parallel redundant components improve availability?","The system is down only if all copies fail: two 99% components in parallel give about 1 − 0.01² = 99.99% (if failures are independent)."],["Why are people sometimes single points of failure?","If only one engineer knows how to deploy or restore, their absence blocks recovery; document runbooks and share knowledge."]],"r":[96,95,8,99],"k":["You run 6 app servers across 3 zones, but one PostgreSQL instance with no standby. What is the single point of failure?",["The app servers","The single database instance","The zones","The load balancer"],1,"Redundant app servers don’t help if the one database dies; add a standby with failover."],"sl":"single-point-of-failure-and-redundancy"},{"n":156,"c":"arch","t":"How to Approach a System Design Interview","s":"A simple step-by-step framework: clarify requirements, estimate, sketch a high-level design, go deep on key parts, then discuss trade-offs and failures.","w":"System design interviews (usually 45–60 minutes) test how you think, not whether you know one “correct” design. The interviewer gives a vague prompt like “Design WhatsApp” or “Design a URL shortener” and watches how you clarify, structure, make trade-offs and communicate.","y":"Many strong engineers fail by jumping straight into drawing boxes or going deep on one detail and running out of time. A framework keeps you organised and shows senior-level thinking.","h":["Clarify requirements (5 min): functional (what features?) and non-functional (scale, latency, availability, consistency). Agree on scope out loud.","Estimate (3–5 min): users, QPS, read/write ratio, storage. Keep it rough.","Define the API (3 min): key endpoints or events, e.g. POST /shorten, GET /{code}.","Data model (3–5 min): main entities, which database and why.","High-level design (10 min): client → LB → services → cache → DB → queue → workers. Walk through one request end to end.","Deep dive (10–15 min): pick the hardest 1–2 parts (feed fan-out, hot keys, consistency, ID generation) and go deep.","Bottlenecks and failures (5 min): SPOFs, scaling, monitoring, what breaks at 10× traffic.","Throughout: think out loud, state trade-offs (“I’d choose X because…, the downside is…”), and check in with the interviewer."],"code":"Design a URL shortener (sketch)\nReq: shorten, redirect, 100M new links/month, 100:1 reads\nAPI: POST /links {url} → {code}   GET /{code} → 301\nIDs: Snowflake → base62 (7 chars)\nDB:  links(code PK, url, created_at) – key-value fits\nCache: Redis for hot codes; CDN for redirects\nScale: read-heavy → cache + replicas; analytics via queue","e":"Typical interview prompts: URL shortener, rate limiter, chat app (WhatsApp), news feed (Twitter/Instagram), ride sharing (Uber), video streaming (YouTube/Netflix), notification system, distributed cache, web crawler, payment system, typeahead/autocomplete. Every one of them reuses topics in this guide.","p":["Jumping into a solution without asking questions","Going deep on one component and never finishing the big picture","Listing technologies without saying why","Never mentioning trade-offs or failure cases","Silent thinking; the interviewer can’t grade what they can’t hear"],"v":["Coding Interview","A coding interview has a correct answer that passes tests. A system design interview has many acceptable answers; you’re graded on clarity, trade-offs, communication and depth."],"f":["Clarify requirements","Estimate + API + data model","High-level design","Deep dive + trade-offs + failures"],"q":[["What should you do in the first 5 minutes?","Ask clarifying questions to pin down functional and non-functional requirements and agree on scope."],["How do you show seniority in a design interview?","Discuss trade-offs and alternatives, estimate scale, identify bottlenecks and failure modes, and justify each choice."],["What topics come up in almost every design?","Load balancing, caching, database choice and scaling (replicas/sharding), queues for async work, IDs, consistency trade-offs and monitoring."],["What if you don’t know a specific technology?","Describe the capability you need (e.g. “a durable log-based queue”) and its trade-offs; concepts matter more than brand names."],["How should you handle time in a 45-minute design interview?","Roughly 5 min requirements, 5 min estimates/API, 10 min high-level design, 15 min deep dive, 5 min bottlenecks and trade-offs, adjusting to the interviewer’s cues."]],"r":[142,138,143,155],"k":["The interviewer says 'Design WhatsApp'. What should you do first?",["Draw a microservices diagram","Ask clarifying questions about features and scale (1:1 vs groups, users, latency, history)","Pick Kafka","Start writing code"],1,"Requirements decide the design; clarifying first shows structured thinking and avoids solving the wrong problem."],"sl":"how-to-approach-a-system-design-interview"}];

function analogyFor(t){

    [/cache|cdn|ttl|eviction|memoiz/,'Keeping the books you use every day on your desk instead of walking to the library for each question. The desk is faster, but you must replace a book when its information changes.'],

    [/queue|kafka|pub.?sub|event|message|worker|stream|dead.?letter/,'A restaurant writes orders on tickets and puts them in a line. Cooks take the next ticket when ready, so the cashier does not have to wait for every meal to be cooked. A ticket can still be delayed, duplicated, or lost unless the system handles those cases.'],
    [/rate limit|throttl|quota|backpressure/,'A theme-park entrance admits only a safe number of people per minute. The rule protects the ride from overload, but the park must decide how to count people and what to do with those who must wait.'],

    [/auth|oauth|jwt|session|csrf|xss|sql injection|encrypt|tls|secret|permission|rbac|security/,'A school has an ID card, a list of rooms each person may enter, and a private envelope for confidential records. Proving who you are is different from deciding what you may access, and neither replaces protecting the information itself.'],
    [/websocket|socket|chat|real.?time|webrtc|livekit|polling|sse/,'A normal letter is sent and answered when convenient; a live phone call keeps a communication channel open so either side can speak quickly. The open channel is responsive, but it consumes resources and needs reconnect logic.'],
    [/shard|horizontal scal|vertical scal|autoscal|load test|capacity|bottleneck|performance|latency|throughput/,'One worker can do only so much. You can give that worker better tools, or add more workers and divide the work. More workers help only if the work can be divided and shared resources do not become the new bottleneck.'],

function deepWalkthrough(t){
  const steps=(t.h||[]).map((step,i)=>{
    const lower=step.toLowerCase();
    let why='This step turns the idea into an explicit operation. Check its input, output, and failure behavior before moving to the next step.';
    if(/validat|check|verify|confirm|requirement/.test(lower)) why='This is a guardrail: reject invalid or unsafe input early, before it consumes expensive resources or changes important state.';
    else if(/store|save|persist|write|insert|record/.test(lower)) why='This is the durability boundary. Decide what must survive a process restart and what happens if the write fails or is repeated.';
    else if(/cache|redis|ttl|expire|invalidate/.test(lower)) why='This introduces a faster copy of information. Define how it is keyed, how long it stays valid, and how changes make it fresh again.';
    else if(/retry|timeout|fail|fallback|circuit/.test(lower)) why='This is failure handling. Bound waiting time, avoid retry storms, and make sure repeating the operation cannot create unintended side effects.';
    else if(/monitor|metric|log|trace|alert|measure|test/.test(lower)) why='This makes the behavior observable. A design is not verified until a test or signal can demonstrate whether it is behaving as intended.';
    else if(/scale|replica|shard|partition|instance|load balanc/.test(lower)) why='This spreads work or data. Confirm that the shared dependencies can handle the extra load and that requests still reach the correct data.';
    else if(/key|unique|atomic|transaction|lock|concurr/.test(lower)) why='This protects correctness when two requests overlap. Test simultaneous operations, not only one request at a time.';
    else if(/queue|worker|async|event|consumer/.test(lower)) why='This separates the request from later work. Decide what acknowledgement means, how retries work, and how duplicate deliveries are handled.';
    return `<li><b>${esc(step)}</b><p class="note" style="margin:6px 0 0">Why this step matters: ${esc(why)}</p></li>`;
  }).join('');
  return steps || `<li>${esc(t.w)}</li>`;
}

  const metricList=(t.m||[]).slice(0,3);
