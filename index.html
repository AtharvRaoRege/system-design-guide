re checks and least-privilege per-request authorization (plus mTLS between services)."],["Is a VPN zero trust?","No; a VPN typically grants broad network access once connected, which is the perimeter model."]]},{"n":123,"c":"obs","t":"Request Correlation IDs","s":"A unique ID attached to each request and passed through every service, so all related logs can be found together.","w":"When a request enters (at the gateway or first service), it gets an ID like req_8f2a91. Every service includes it in every log line and forwards it in a header (X-Request-ID, or the trace ID from traceparent) to the next service and into queue messages. Searching that one ID shows the full story of the request.","y":"One user action can generate logs across 10 services mixed with thousands of other requests. Without a shared ID, connecting them is guesswork based on timestamps.","h":["Generate the ID at the edge; if the client sends one, accept it only if valid (format/length) or create a fresh one.","Store it in request context (middleware, MDC in Java, contextvars in Python, AsyncLocalStorage in Node) so all logs include it automatically.","Forward it on every outbound HTTP call and in message metadata.","Return it in the response header so support can ask users for it (\"error reference: req_8f2a91\").","Prefer using the OpenTelemetry trace ID, so logs and traces line up.","Don’t treat it as a secret or authentication token."],"code":"// Express middleware\napp.use((req, res, next) => {\n  const id = valid(req.get('X-Request-ID')) || crypto.randomUUID();\n  als.run({ requestId: id }, () => {\n    res.set('X-Request-ID', id);\n    next();\n  });\n});","e":"A support agent gets \"Something went wrong. Reference: req_8f2a91\" from a customer screenshot. Engineers search it and see the full path: gateway → orders → payments, where a timeout occurred.","p":["Generating a new ID in each service, breaking the chain","Not passing it through queues","Trusting arbitrary client-supplied IDs (log injection)"],"v":["Distributed Tracing","A correlation ID is just a shared label to LINK logs. Distributed tracing adds structure: spans, parent/child relations and timing. Using the trace ID as the correlation ID gives you both."],"f":["Gateway assigns req_8f2a","Header passed to each service","Every log line includes it","Search one ID → full story"],"q":[["Where should a correlation ID be created?","At the entry point to the system, such as the API gateway or first service."],["How do you make every log line include it automatically?","Store it in request-scoped context (MDC, contextvars, AsyncLocalStorage) used by the logger."],["Correlation ID vs trace ID?","A correlation ID links logs; a trace ID also anchors spans with timing and hierarchy. Many systems use the trace ID as the correlation ID."]]},{"n":124,"c":"net","t":"API Contracts & Contract Testing","s":"Writing down exactly what an API accepts and returns, then automatically testing that both sides still agree.","w":"An API contract describes endpoints, request/response fields, types, required fields and error formats, often in OpenAPI (REST), Protobuf (gRPC), AsyncAPI or JSON Schema (events). Contract testing checks compatibility without spinning up the whole system. In consumer-driven contract testing (e.g. Pact), each consumer records what it expects; the provider’s CI verifies it still satisfies every consumer’s expectations.","y":"End-to-end tests across many services are slow and flaky. Without contract tests, a backend team renames a field, all their own tests pass, and the mobile app breaks in production.","h":["Define the contract first (OpenAPI/Protobuf) and generate clients, server stubs and docs from it.","Lint contracts and run breaking-change detection in CI (openapi-diff, buf breaking for Protobuf).","Use consumer-driven contracts (Pact) between services you own: consumers publish expectations, providers verify them in CI.","Block deploys that would break a consumer (“can I deploy?” checks).","Test only what consumers actually use, not every internal detail.","Version or deprecate properly when breaking changes are unavoidable."],"code":"# Pact consumer test (simplified)\ngiven \"order 42 exists\"\nupon receiving GET /orders/42\nwill respond with 200 {\n  \"id\": 42, \"status\": like(\"paid\"), \"total\": like(999)\n}","e":"A bank’s backend team ran Pact verification in CI. Removing a field “nobody used” failed the build because the Android app’s contract still expected it, catching the break before release.","p":["Contracts in a wiki that drift from reality","Relying only on slow end-to-end tests","Over-specified contracts that break on harmless changes"],"v":["API Versioning","Contract testing DETECTS breaking changes early. API versioning is how you RELEASE a breaking change without hurting existing clients."],"f":["Consumer publishes expectations","Provider CI verifies","!Breaking change detected","Fix or version before deploy"],"q":[["What is consumer-driven contract testing?","Consumers define the interactions they rely on; providers verify they satisfy them, ensuring changes don’t break real usage."],["Why are contract tests better than only end-to-end tests?","They’re fast, isolated and pinpoint which interaction broke, while E2E tests are slow, flaky and need everything running."],["What tools detect breaking changes in schemas?","openapi-diff/oasdiff for OpenAPI, buf breaking for Protobuf, and schema registries for events."]]},{"n":125,"c":"db","t":"Database Transactions & ACID","s":"A transaction groups several database changes so they all happen together or not at all. ACID describes the guarantees.","w":"A = Atomicity: all changes commit, or none do. C = Consistency: constraints (foreign keys, unique, checks) are never violated. I = Isolation: concurrent transactions don’t see each other’s half-done work, to a degree set by the isolation level. D = Durability: once committed, data survives crashes (written to the write-ahead log). Isolation levels from weaker to stronger: Read Uncommitted, Read Committed, Repeatable Read, Serializable.","y":"Transferring money means debit one account AND credit another. If the server crashes between the two, money disappears without a transaction. Concurrency without proper isolation causes lost updates and anomalies.","h":["Wrap related writes in a transaction: BEGIN … COMMIT (or ROLLBACK on error).","Keep transactions short: no HTTP calls, no user waits inside.","Know your default isolation (Postgres: Read Committed; MySQL InnoDB: Repeatable Read).","Read Committed can still have lost updates; use atomic updates, SELECT … FOR UPDATE or optimistic version checks.","Use Serializable for complex invariants, and retry on serialization failures.","Use constraints in the DB (UNIQUE, CHECK balance >= 0, FOREIGN KEY) as the last line of defence.","Remember: a DB transaction doesn’t cover external systems (emails, payment APIs); use the outbox or sagas for those."],"code":"BEGIN;\nUPDATE accounts SET balance = balance - 500 WHERE id = 1;\nUPDATE accounts SET balance = balance + 500 WHERE id = 2;\n-- CHECK (balance >= 0) rejects overdraft automatically\nCOMMIT;   -- both or neither","e":"Every UPI or card payment in a bank’s core system relies on ACID transactions so a debit never happens without the matching credit and ledger entries.","p":["Calling external APIs inside a transaction","Assuming the default isolation prevents all anomalies","Not retrying serialization/deadlock failures","Autocommit mode splitting related writes"],"v":["ACID vs BASE","ACID: strict guarantees, typical of relational DBs. BASE (Basically Available, Soft state, Eventually consistent): favours availability and scale, typical of some distributed NoSQL systems. Real systems mix both."],"f":["BEGIN","Debit A, credit B","!Crash midway → rollback","COMMIT: both durable"],"q":[["Explain each letter of ACID.","Atomicity (all or nothing), Consistency (constraints hold), Isolation (concurrent transactions don’t interfere improperly), Durability (committed data survives crashes)."],["What anomaly can happen at Read Committed?","Lost updates and non-repeatable reads: two transactions read the same value and both write, one overwriting the other."],["Why not call a payment API inside a DB transaction?","It holds locks during slow network calls, and the external call can’t be rolled back if the transaction aborts."]]},{"n":126,"c":"msg","t":"Idempotency vs. Deduplication","s":"Idempotency means repeating an operation is harmless by design. Deduplication means detecting a repeat and skipping it. Related, but not the same.","w":"Idempotent operations: “set order 42 status to paid” or \"PUT /users/7 {name: Asha}\". Doing it twice changes nothing more. Deduplication: remembering IDs you’ve seen (message IDs, idempotency keys, event IDs) and ignoring repeats. Some operations are naturally idempotent; others (charge ₹500, add 10 points, send email) are not, so they need deduplication to become effectively idempotent.","y":"Engineers often add a dedupe check and assume they’re safe, but if the check and the effect aren’t atomic, two copies can both pass the check (a race). Or dedupe windows expire and a late duplicate gets through.","h":["Prefer naturally idempotent designs where possible: absolute values (SET), upserts, unique business keys.","For non-idempotent effects, deduplicate with a durable record of IDs.","Make the dedupe record and the effect atomic: same DB transaction, or a unique constraint on the effect itself (UNIQUE(order_id) on payments).","Choose dedupe retention longer than the maximum redelivery/retry window.","Scope keys correctly (per user/tenant/operation).","For external side effects, use the provider’s idempotency key support."],"code":"-- naturally idempotent\nUPDATE orders SET status = 'paid' WHERE id = 42;\n\n-- not idempotent → needs dedupe\nINSERT INTO points_ledger (event_id, user_id, points)\nVALUES ('evt_9', 7, 10)      -- UNIQUE(event_id)\nON CONFLICT (event_id) DO NOTHING;","e":"A loyalty system checked Redis for “event seen?” then wrote points to Postgres separately. Two consumer instances processed the same event in parallel and both passed the Redis check. Moving to a UNIQUE(event_id) ledger insert fixed it.","p":["Non-atomic “check then act” deduplication","Dedupe windows shorter than retry windows","Assuming “idempotent” just because you added a dedupe cache"],"v":["Idempotency Keys","An idempotency key is a specific DEDUPLICATION mechanism for client requests to an API. Idempotency is the broader PROPERTY you want; deduplication is one way to get it."],"f":["Duplicate event arrives","Natural idempotency? SET again, harmless","Otherwise: unique insert","Conflict → skip atomically"],"q":[["What’s the difference between idempotency and deduplication?","Idempotency is a property where repeats have no additional effect; deduplication is a technique that detects and drops repeated inputs."],["Why must the dedupe check be atomic with the effect?","Otherwise two concurrent duplicates can both pass the check before either records it, causing a double effect."],["How long should dedupe IDs be kept?","Longer than the maximum time a duplicate could arrive (retry and redelivery windows)."]]},{"n":127,"c":"dist","t":"Consistent Hashing","s":"A way to spread keys across servers so that adding or removing a server moves only a small share of the keys, not almost all of them.","w":"Simple hashing does server = hash(key) % N. If N changes from 4 to 5, almost every key lands on a different server, so your cache is suddenly empty or your data must all move. Consistent hashing puts servers and keys on an imaginary circle (a “ring”) of hash values. Each key goes to the first server you meet walking clockwise. Add a server and it only takes keys from its neighbour; remove one and only its keys move to the next server.","y":"Distributed caches (Memcached clusters), databases (Cassandra, DynamoDB), CDNs and load balancers constantly add and remove nodes. Without consistent hashing, every scale-up or crash would cause a giant reshuffle: cache hit rate drops to zero and the database gets flooded.","h":["Hash every server name onto a ring of numbers (e.g. 0 to 2^32).","Hash each key onto the same ring; walk clockwise to the first server: that server owns the key.","Use virtual nodes: put each physical server on the ring 100–200 times at different points. This spreads load evenly and makes a dead server’s keys spread across many servers instead of one.","Give bigger servers more virtual nodes (weighting).","For replication, store the key on the next 2–3 distinct servers clockwise.","When a node joins or leaves, move only the keys in the affected ring segments."],"code":"ring = sorted((hash(f\"{server}#{i}\"), server)\n              for server in servers for i in range(150))\ndef owner(key):\n    h = hash(key)\n    i = bisect(ring, (h,))          # first point clockwise\n    return ring[i % len(ring)][1]\n# with N servers, adding one moves only ~1/(N+1) of keys","e":"Amazon’s Dynamo paper (2007) made consistent hashing with virtual nodes famous; Cassandra, Riak and DynamoDB all use the idea. Discord uses it to route each chat server’s traffic to the right node.","p":["Using hash % N and being surprised that scaling empties the cache","No virtual nodes, so one server owns a huge arc and gets overloaded","Forgetting replication, so a dead node’s data is gone"],"v":["Sharding","Sharding is the IDEA of splitting data across servers. Consistent hashing is one smart WAY to decide which shard owns each key so resharding is cheap."],"f":["Servers placed on hash ring","Key hashed onto ring","Walk clockwise → owner","Add server: only neighbour’s keys move"],"q":[["Why is hash(key) % N bad when servers change?","Changing N changes the result for almost every key, so nearly all data or cache entries must move."],["What are virtual nodes and why use them?","Each physical server appears many times on the ring. This balances load and spreads a failed server’s keys across many servers."],["Roughly how many keys move when you add one server to N?","About 1/(N+1) of all keys, instead of nearly all of them."],["Where is consistent hashing used?","Distributed caches, Cassandra/DynamoDB-style databases, CDNs and some load balancers."]]},{"n":128,"c":"scale","t":"Bloom Filters","s":"A tiny, super-fast data structure that can tell you “definitely NOT in the set” or “PROBABLY in the set”.","w":"A Bloom filter is a bit array plus a few hash functions. To add an item, hash it with each function and set those bits to 1. To check an item, look at its bits: if any is 0, the item was never added (100% sure). If all are 1, it was probably added, but those bits might have been set by other items (a false positive). It never gives false negatives. It uses a tiny fraction of the memory of storing the real items.","y":"Checking “does this exist?” against a huge disk-based set is slow. A Bloom filter in memory can skip most of those expensive lookups. It’s a classic interview answer for “check if a username is taken among a billion users” or “avoid recrawling URLs”.","h":["Pick the expected number of items (n) and acceptable false positive rate (e.g. 1%).","Size the bit array and number of hash functions from those (about 10 bits per item gives ~1% false positives).","On add: set k bits. On check: if any bit is 0 → definitely absent; else → maybe present, so confirm with the real store.","Standard Bloom filters can’t delete items; use a Counting Bloom filter or Cuckoo filter if you need deletes.","Rebuild or use scalable Bloom filters when the item count grows past the plan.","Use built-ins: RedisBloom (BF.ADD / BF.EXISTS), Guava BloomFilter, or databases that use them internally."],"code":"BF.RESERVE usernames 0.01 1000000000   # 1% error, 1B items\nBF.ADD usernames \"asha_rao\"\nBF.EXISTS usernames \"asha_rao\"   # 1 → maybe, check DB\nBF.EXISTS usernames \"zzq_123\"    # 0 → definitely free","e":"Cassandra, HBase and RocksDB keep a Bloom filter per data file, so a read can skip files that definitely don’t contain the key, avoiding many disk reads. Google Chrome once used a Bloom filter to check URLs against a malicious-site list locally.","p":["Treating “maybe present” as “definitely present” without confirming","Undersizing it, so it fills up and false positives skyrocket","Expecting to delete items from a plain Bloom filter"],"v":["Hash Set","A hash set stores every item and answers exactly, using lots of memory. A Bloom filter stores only bits, uses ~1 byte per item, and answers “no” or “maybe”."],"f":["Check “asha_rao”","Hash → look at k bits","Any bit 0 → definitely new","All 1 → maybe, confirm in DB"],"q":[["Can a Bloom filter have false negatives?","No. If it says an item is absent, it’s definitely absent. It can only have false positives."],["How do you reduce the false positive rate?","Use more bits per item (a larger array) and the right number of hash functions for that size."],["Why can’t you delete from a standard Bloom filter?","A bit may be shared by several items; clearing it could make other items look absent. Use counting or cuckoo filters for deletes."],["Give a system design use.","Skip disk lookups for keys that don’t exist (LSM-tree databases), check username availability, avoid re-crawling URLs, or filter already-seen recommendations."]]},{"n":129,"c":"db","t":"SQL vs NoSQL","s":"SQL databases store data in tables with strict structure and powerful queries; NoSQL databases trade some of that for flexibility and easier horizontal scaling.","w":"SQL (relational) databases like PostgreSQL and MySQL use tables, rows, a fixed schema, joins and ACID transactions. NoSQL is a family: document stores (MongoDB, store JSON-like documents), key-value stores (Redis, DynamoDB, look up by key super fast), wide-column stores (Cassandra, huge write-heavy datasets), and graph databases (Neo4j, relationships like friends-of-friends).","y":"It’s one of the first decisions in any design interview, and the wrong choice causes pain for years. The honest answer is usually: start with SQL unless you have a specific reason not to.","h":["Default to SQL (Postgres) for most business apps: orders, users, payments, anything with relationships and transactions.","Choose document stores when records are self-contained, shapes vary, and you read the whole document at once (product catalogs, CMS content).","Choose key-value when access is always by a key and must be extremely fast or massive (sessions, carts, caches, DynamoDB at huge scale).","Choose wide-column for enormous write volume and simple access patterns (time series, messages, IoT events).","Choose graph when queries walk relationships many levels deep (social graphs, fraud rings, recommendations).","With NoSQL, design tables around your queries first, because you can’t rely on flexible joins later.","It’s fine to use both: Postgres for core data, Redis for caching, Elasticsearch for search (“polyglot persistence”)."],"e":"Discord stores trillions of messages in a wide-column database (moved from Cassandra to ScyllaDB) because messages are written constantly and read by channel and time. But billing and accounts at most companies still live in relational databases.","p":["Choosing MongoDB “because it scales” for a highly relational app, then rebuilding joins in code","Assuming SQL can’t scale (it scales very far with indexes, replicas and partitioning)","Designing a NoSQL schema like SQL tables and then needing joins"],"v":["Schema-less","NoSQL isn’t truly schema-less: the schema just lives in your application code instead of the database. You still need to manage changes to it."],"f":["What are the access patterns?","Relations + transactions → SQL","Key lookups at huge scale → KV","Massive writes → wide-column"],"q":[["When would you pick NoSQL over SQL?","Massive scale with simple, known access patterns, flexible or nested document shapes, very high write throughput, or graph-style queries."],["Name the four main NoSQL types with an example each.","Document (MongoDB), key-value (Redis/DynamoDB), wide-column (Cassandra), graph (Neo4j)."],["Can SQL databases scale horizontally?","Yes, with read replicas, partitioning and sharding (Vitess, Citus), or distributed SQL like CockroachDB/Spanner, though it takes more effort."],["What is polyglot persistence?","Using different databases for different jobs in the same system, e.g. Postgres + Redis + Elasticsearch."]]},{"n":130,"c":"db","t":"Normalization vs Denormalization","s":"Normalization stores each fact once to avoid duplicates; denormalization deliberately copies data to make reads faster.","w":"Normalized: orders table stores customer_id, and the customer’s name lives only in the customers table. To show an order with the name, you JOIN. Denormalized: the orders table also stores customer_name, so no join is needed, but if the customer changes their name you must update it in many places.","y":"Normalization keeps data correct and writes simple. Denormalization makes reads fast, which matters at scale (feeds, dashboards, NoSQL). Interviewers love asking when to do which.","h":["Start normalized (roughly 3rd normal form): each table about one thing, no repeated groups, no facts depending on non-key columns.","Measure: denormalize only where joins are a proven bottleneck on hot read paths.","Typical denormalizations: storing counts (comment_count on posts), copying display fields (author_name on comments), pre-computed summary tables.","Keep copies in sync: update in the same transaction, use triggers, or update asynchronously from events (accepting brief staleness).","Prefer materialized views or read models (CQRS) over sprinkling copies everywhere.","In NoSQL, denormalization is the default: shape data around your queries."],"code":"-- normalized: correct, needs a JOIN\nSELECT o.id, c.name FROM orders o JOIN customers c ON c.id = o.customer_id;\n\n-- denormalized counter: fast read, must stay in sync\nUPDATE posts SET comment_count = comment_count + 1 WHERE id = 7;","e":"Instagram stores like counts directly on each post instead of counting the likes table on every view, because counting millions of rows per page load would be far too slow.","p":["Denormalizing everything early and fighting inconsistent data forever","Forgetting to update one of the copies","Normalizing so strictly that simple screens need 10 joins"],"v":["Caching","Denormalization stores duplicate data permanently in the database itself. A cache keeps a temporary copy outside it. Both trade freshness work for read speed."],"f":["Normalized: fact stored once","!Hot page needs 5 joins","Denormalize that field","Keep copies in sync"],"q":[["What problem does normalization solve?","Duplicate data and update anomalies, where changing a fact in one place leaves stale copies elsewhere."],["When should you denormalize?","When read performance on a hot path is a proven problem and you can keep the copies in sync acceptably."],["How do you keep denormalized data consistent?","Update copies in the same transaction, use triggers, or propagate via events with eventual consistency."]]},{"n":131,"c":"db","t":"B-Trees vs LSM Trees","s":"The two main ways databases store data on disk: B-trees are great for reads, LSM trees are great for heavy writes.","w":"A B-tree (used by Postgres, MySQL InnoDB) keeps data sorted in fixed-size pages and updates them in place, so lookups take a few page reads. An LSM tree (Log-Structured Merge tree, used by Cassandra, RocksDB, LevelDB, ScyllaDB) first writes to an in-memory table plus a log, then flushes sorted immutable files (SSTables) to disk, and later merges them in the background (compaction). Writes are sequential and very fast; reads may check several files.","y":"This is why some databases handle millions of writes per second and others are better at complex reads. Interviewers use it to test whether you understand storage trade-offs.","h":["B-tree: pick for read-heavy, mixed workloads with range queries and transactions.","LSM: pick for write-heavy workloads like logs, metrics, messages, IoT.","LSM reads use Bloom filters per file to skip files that don’t contain the key.","LSM needs compaction tuning: too little = slow reads and more disk use; too much = disk IO spikes.","Know the “amplification” trade-offs: B-trees have higher write amplification for random writes; LSM has read amplification and background compaction cost.","Deletes in LSM are tombstones that disappear only after compaction."],"e":"Facebook built RocksDB (an LSM engine) and moved parts of MySQL onto it (MyRocks) to cut storage and write costs for huge, write-heavy tables.","p":["Using an LSM store for a heavy random-read workload without tuning","Ignoring compaction and running out of disk","Deleting lots of data in Cassandra and hitting tombstone slowdowns"],"v":["Database Indexing","B-tree is also the usual structure for an INDEX inside a SQL database. LSM vs B-tree is about the whole storage engine design."],"f":["Write arrives","LSM: memtable + log","Flush sorted file (SSTable)","Background compaction merges"],"q":[["Why are LSM trees fast for writes?","Writes go to memory and an append-only log, then flush as sequential files; no random in-place disk updates."],["Why can LSM reads be slower?","A key may exist in several files, so reads may check multiple SSTables (helped by Bloom filters and compaction)."],["Which databases use each?","B-tree: Postgres, MySQL InnoDB. LSM: Cassandra, RocksDB, LevelDB, ScyllaDB, HBase."]]},{"n":132,"c":"db","t":"Write-Ahead Log (WAL)","s":"Before changing data, the database first writes the change to an append-only log, so it can recover after a crash.","w":"Changing data pages directly is slow and risky: a crash halfway leaves a corrupted page. Instead, the database appends a record \"transaction 91: set balance of account 7 to 500\" to the WAL and forces it to disk (fsync). Only then does it confirm COMMIT. The actual data pages are updated later in the background. After a crash, the database replays the WAL to redo committed changes.","y":"The WAL is how databases give Durability (the D in ACID). It also powers replication (replicas replay the leader’s log), point-in-time recovery and change data capture.","h":["Understand that commit = WAL record safely on disk, not data pages updated.","Put the WAL on fast storage; commit latency depends on its fsync speed.","Group commit batches many transactions into one fsync for higher throughput.","Archive WAL files to get point-in-time recovery (restore a base backup, then replay logs).","Stream the WAL to replicas for replication (Postgres streaming replication, MySQL binlog).","Use it for CDC tools like Debezium, which read the log to publish changes.","Never disable fsync in production to “go faster”: you lose durability."],"e":"Kafka’s whole design is essentially a distributed append-only log, the same idea as a WAL, which is why it’s so fast at writes.","p":["Turning off fsync or synchronous_commit without understanding the data-loss risk","Not archiving WAL, so point-in-time recovery is impossible","WAL disk filling up because a replica or replication slot stopped consuming"],"v":["Event Sourcing","A WAL is an internal, low-level log the database uses for crash recovery. Event sourcing is an application design where business events are the source of truth."],"f":["UPDATE balance","Append to WAL + fsync","COMMIT confirmed","!Crash → replay WAL on restart"],"q":[["Why write to a log before changing data pages?","Appending to a log is fast and sequential, and replaying it after a crash restores all committed changes, guaranteeing durability."],["How is the WAL used for replication?","Replicas receive and replay the leader’s WAL records to apply the same changes."],["What is point-in-time recovery?","Restoring a base backup and replaying archived WAL up to a chosen moment."]]},{"n":133,"c":"db","t":"Isolation Levels","s":"Settings that decide how much concurrent transactions can see each other’s in-progress or recent changes.","w":"From weakest to strongest: Read Uncommitted (can see others' uncommitted data: dirty reads), Read Committed (only committed data, but rereading a row may give a new value: non-repeatable read), Repeatable Read (rows you read stay the same; in some DBs new rows can still appear: phantoms), Serializable (behaves as if transactions ran one at a time). Stronger isolation = fewer weird bugs but more blocking or retries.","y":"Many real bugs (double bookings, wrong balances) come from assuming the database is “serializable” when it’s actually Read Committed. Interviewers often ask you to name the anomalies.","h":["Know the defaults: Postgres and SQL Server use Read Committed; MySQL InnoDB uses Repeatable Read.","Learn the anomalies: dirty read, non-repeatable read, phantom read, lost update, write skew.","For most CRUD, Read Committed plus atomic updates is fine.","For “check then write” invariants (only one doctor on call may go off duty), use SELECT ... FOR UPDATE or Serializable.","With Serializable, catch serialization failures and retry the whole transaction.","Prefer database constraints (UNIQUE, CHECK) as a final guard."],"code":"BEGIN ISOLATION LEVEL SERIALIZABLE;\nSELECT count(*) FROM doctors WHERE on_call AND shift = 1;\nUPDATE doctors SET on_call = false WHERE id = 7;\nCOMMIT;  -- may fail with serialization error → retry","e":"Write skew classic: two doctors both check “at least 2 on call”, both see yes, both go off duty, and nobody is on call. Read Committed and even Repeatable Read can allow this; Serializable or explicit locks prevent it.","p":["Assuming transactions automatically prevent all races","Using Serializable without retry logic","Picking Read Uncommitted for speed and reading garbage"],"v":["ACID","ACID lists four guarantees. Isolation levels are the dial that controls HOW STRONG the “I” is."],"f":["T1 and T2 run together","!Both read “2 on call”","Both update","Serializable aborts one → retry"],"q":[["Name the four standard isolation levels.","Read Uncommitted, Read Committed, Repeatable Read, Serializable."],["What is a phantom read?","Re-running a query returns new rows that another transaction inserted and committed in between."],["What is write skew?","Two transactions read overlapping data, make decisions, and write different rows, together breaking a rule neither broke alone."]]},{"n":134,"c":"scale","t":"Hot Keys & Hot Partitions","s":"When one key or one shard gets far more traffic than the rest, so it becomes the bottleneck even though other servers are idle.","w":"Sharding assumes traffic spreads evenly. But real traffic is skewed: a celebrity’s profile, a viral post, a flash-sale product, or “today’s date” as a key. All requests for that key go to one cache node or one database partition, which melts while others sit idle.","y":"Hot keys cause outages that adding servers doesn’t fix, because the load can’t spread. Interviewers ask “what happens when Virat Kohli posts?” to see if you think about this.","h":["Detect them: monitor per-key or per-partition traffic (Redis --hotkeys, DynamoDB contributor insights).","Cache hot reads close to users: local in-process cache with a short TTL in each app server, plus CDN.","Replicate the hot key: store copies under key#1..key#N and read a random copy.","Split writes: for counters, write to N sub-counters (likes:post7:shard3) and sum them on read.","Avoid naturally hot shard keys like timestamps or status; add a random or hashed prefix.","Use request coalescing so many identical concurrent misses trigger only one backend fetch.","For viral content, special-case celebrities (e.g. fan-out on read for them)."],"code":"# sharded counter: spread writes across 16 keys\nr.incr(f\"likes:post7:{random.randint(0,15)}\")\n# read: sum all 16\ntotal = sum(int(r.get(f\"likes:post7:{i}\") or 0) for i in range(16))","e":"When a major celebrity posts on social media, millions of fans load the same post within seconds. Platforms serve it from local and edge caches and use sharded counters for likes so no single node takes all the traffic.","p":["Sharding by date or status so all new traffic hits one partition","Assuming more nodes will fix a single hot key","No per-key monitoring, so the cause stays invisible"],"v":["Load Balancing","Load balancing spreads REQUESTS over servers. A hot key is about DATA: every request for that one key must go to whichever node owns it, so the balancer can’t help."],"f":["Viral post: 1M reads/sec","!All hit one shard","Local cache + key replicas","Load spread, shard survives"],"q":[["How do you handle a hot read key?","Cache it in local memory and at the edge, and/or replicate it under multiple keys and read randomly."],["How do you handle a hot write key like a like counter?","Shard the counter into N sub-keys, write randomly, and sum on read (or aggregate asynchronously)."],["Why is a timestamp a bad partition key?","All current writes share the same recent value, so they land on one partition."]]},{"n":135,"c":"dist","t":"Consensus (Raft & Paxos)","s":"Algorithms that let a group of servers agree on the same value or the same order of operations, even if some servers fail.","w":"Imagine 5 servers that must agree on “who is leader” or “what is the next entry in the log”. Messages can be lost and servers can crash. Consensus algorithms guarantee that once a majority agrees, the decision is final and everyone eventually learns it. Raft (designed to be understandable) works like this: elect a leader; the leader appends client commands to its log and replicates them; an entry is committed once a majority has it; if the leader dies, a new election starts with a higher “term”.","y":"Consensus is the foundation of etcd (Kubernetes' brain), ZooKeeper, Consul, CockroachDB and Spanner. Leader election, distributed locks and strongly consistent replication are all built on it.","h":["Use an odd cluster size: 3 tolerates 1 failure, 5 tolerates 2 (you need a majority alive).","Leader election: followers that stop hearing heartbeats become candidates and ask for votes; majority wins.","Log replication: leader sends entries; once a majority stores an entry it’s committed and applied.","Terms (epochs) ensure old leaders are ignored after a new one is elected.","Don’t implement it yourself in production; use etcd, ZooKeeper or Consul.","Keep clusters small (3–5 nodes) and close together; every write needs a majority round trip."],"e":"Every change you make with kubectl is stored in etcd, which uses Raft. If one of three etcd nodes dies, the other two still form a majority and the cluster keeps working.","p":["Running 2 or 4 nodes (no extra fault tolerance over 1 or 3)","Spreading a consensus cluster across far regions, making every write slow","Writing a homemade consensus protocol"],"v":["Leader Election","Leader election is one PROBLEM. Consensus is the general SOLUTION that can elect leaders and also agree on every log entry."],"f":["Leader receives command","Replicates to followers","Majority stored → committed","!Leader dies → new term election"],"q":[["How many failures can a 5-node Raft cluster tolerate?","2, because 3 nodes still form a majority."],["When is an entry committed in Raft?","When the leader has replicated it to a majority of nodes."],["Why not use an even number of nodes?","It adds cost without improving fault tolerance and allows split votes; 4 nodes tolerate only 1 failure, same as 3."]]},{"n":136,"c":"dist","t":"Quorums","s":"Requiring a minimum number of replicas to agree on each read and write, so reads always see the latest write.","w":"With N copies of data, a write must be acknowledged by W replicas and a read must ask R replicas. If W + R > N, every read set overlaps with every write set, so at least one replica in your read has the latest value. Example: N=3, W=2, R=2. You can tune: W=3,R=1 for fast reads; W=1,R=3 for fast writes; W=1,R=1 for speed with weaker consistency.","y":"Quorums let leaderless databases (Cassandra, DynamoDB-style, Riak) stay available when some nodes are down while still giving consistent results. A favourite interview formula.","h":["Choose N (copies), usually 3.","Choose W and R based on needs; W + R > N for strong reads.","Use versions/timestamps so the reader can pick the newest value among responses.","Read repair: if the read sees an outdated replica, update it.","Hinted handoff: if a target replica is down, another node holds the write temporarily and passes it on later.","In Cassandra, use consistency levels like QUORUM, ONE, ALL, LOCAL_QUORUM."],"code":"N = 3 replicas\nW = 2  (write succeeds after 2 acks)\nR = 2  (read asks 2, takes newest version)\nW + R = 4 > 3 → reads see latest write\n-- Cassandra: CONSISTENCY QUORUM;","e":"A Cassandra cluster with replication factor 3 using QUORUM reads and writes keeps serving correct data even when one replica in each set is down for maintenance.","p":["Using W=1, R=1 and expecting strong consistency","Ignoring clock-based conflicts when picking the “newest” value","Cross-region quorums making every request slow (use LOCAL_QUORUM)"],"v":["Consensus","Quorums are a simpler overlap rule for reads/writes. Consensus (Raft/Paxos) also uses majorities but additionally agrees on a single ORDER of operations with a leader."],"f":["Write to 3 replicas","2 acks → success (W=2)","Read from 2 (R=2)","Overlap guarantees latest"],"q":[["What does W + R > N guarantee?","Any read quorum overlaps any write quorum, so at least one replica read has the latest write."],["With N=3, how do you favour fast reads?","W=3, R=1: every write goes to all replicas so any single replica is up to date."],["What is read repair?","When a read detects a stale replica, it writes the newest value back to it."]]},{"n":137,"c":"dist","t":"Heartbeats & Gossip Protocol","s":"Heartbeats are “I’m alive” messages; gossip is how nodes spread information to each other like rumours, without a central server.","w":"Heartbeats: each node regularly sends a small signal (every second or so). If a monitor or peer misses several in a row, it marks the node as suspected dead. Gossip: every second, each node picks a few random peers and shares what it knows (who’s alive, versions of data). Those peers pass it on. Like a rumour in a school, information reaches everyone in a few rounds (roughly log N), even in clusters of thousands.","y":"Large clusters need to know who’s alive without one central bottleneck. Gossip is used for membership and failure detection in Cassandra, Consul, Redis Cluster and DynamoDB.","h":["Send heartbeats at a fixed interval and declare failure only after several misses (avoids false alarms).","Use a phi-accrual detector (adaptive suspicion level) instead of a fixed timeout when networks are noisy.","With gossip, each node contacts a few random peers per round and merges state using version numbers.","Mark nodes “suspect” first, then “dead”, giving them time to refute.","Use gossip for metadata (membership, load), not for large data transfers.","Pair failure detection with automatic actions: remove from load balancer, re-replicate data, elect a new leader."],"e":"Cassandra nodes gossip every second with up to three other nodes about cluster state, so every node learns about joins and failures within seconds without any master server.","p":["Declaring nodes dead after a single missed heartbeat","Heartbeat interval too long, so failures go unnoticed for minutes","Central monitor that is itself a single point of failure"],"v":["Health Checks","Health checks are usually done BY a load balancer TO a server. Heartbeats and gossip are nodes in a CLUSTER monitoring each other in a decentralized way."],"f":["Node A tells 3 random peers","They tell 3 more each","Whole cluster knows in ~log N rounds","!Missed heartbeats → suspect → dead"],"q":[["Why use gossip instead of a central coordinator?","It scales to thousands of nodes, has no single point of failure, and tolerates message loss."],["How fast does gossip spread information?","In about O(log N) rounds, since the number of informed nodes roughly multiplies each round."],["How do you avoid falsely declaring a slow node dead?","Require several missed heartbeats, use adaptive detectors like phi-accrual, and use a suspect state before dead."]]},{"n":138,"c":"arch","t":"Monolith vs Microservices","s":"A monolith is one deployable application; microservices split the system into many small services that deploy and scale independently.","w":"Monolith: one codebase, one deploy, one database, function calls between modules. Microservices: separate services (users, orders, payments), each owning its data, talking over the network (HTTP/gRPC/events). A middle ground is the “modular monolith”: one deploy, but with strict internal module boundaries.","y":"It’s an almost guaranteed interview question, and a decision that shapes team speed for years. Microservices solve organisational scaling problems but add huge operational complexity.","h":["Start with a (modular) monolith for new products and small teams; it’s faster to build, test, debug and deploy.","Move to microservices when teams block each other, parts need very different scaling, or deploys become too risky.","Split by business capability (bounded contexts), not technical layers.","Each service owns its database; no sharing tables between services.","Invest in platform basics first: CI/CD, observability, tracing, service discovery, API contracts.","Use the strangler fig pattern: carve out one piece at a time behind a router instead of a big rewrite.","Expect new problems: network failures, distributed transactions, eventual consistency, versioning."],"e":"Amazon and Netflix moved to microservices to let hundreds of teams ship independently. Meanwhile, Shopify runs one of the world’s largest Rails monoliths (modular) successfully, and Amazon Prime Video famously moved one monitoring service back to a monolith to cut costs by 90%.","p":["Starting a 3-person startup with 15 microservices","“Distributed monolith”: services that must deploy together and share a database","Splitting by layers (UI service, DB service) instead of business domains"],"v":["Modular Monolith","A modular monolith keeps clean module boundaries but deploys as one unit, giving most of the code organisation benefits without network complexity. It’s often the best first step."],"f":["Start: modular monolith","!Teams block each other","Strangle out one domain","Independent service + own DB"],"q":[["Give two benefits and two costs of microservices.","Benefits: independent deploys and scaling per service, team autonomy. Costs: network failures and latency, distributed data consistency, more operational overhead."],["What is a distributed monolith?","Services that are technically separate but so coupled (shared DB, lockstep deploys) that you get the costs of both and benefits of neither."],["What is the strangler fig pattern?","Gradually replacing parts of a legacy system by routing specific features to new services until the old system can be retired."],["How should services be split?","By business capabilities / bounded contexts, each owning its own data."]]},{"n":139,"c":"ops","t":"Service Mesh & Sidecars","s":"A layer of small proxies next to every service that handles networking jobs like retries, mTLS, routing and metrics, so app code doesn’t have to.","w":"In a service mesh (Istio, Linkerd, Consul Connect), every service instance gets a sidecar proxy (often Envoy) in the same pod. All traffic in and out goes through it. A control plane configures all sidecars centrally: “retry calls to payments twice”, “send 5% of traffic to v2”, “encrypt everything with mTLS”.","y":"With 100 microservices in 5 languages, implementing timeouts, retries, circuit breakers, tracing and encryption in each one is inconsistent and slow. The mesh does it uniformly.","h":["Adopt it only when you have many services; for a few, libraries are simpler.","Enable automatic mTLS for zero-trust service-to-service encryption.","Configure timeouts, retries (with budgets) and circuit breaking per route.","Use traffic splitting for canary releases and fault injection for chaos testing.","Collect golden-signal metrics and traces from sidecars for every service automatically.","Watch overhead: each hop adds a little latency and memory; consider sidecar-less modes (Istio ambient, eBPF meshes)."],"e":"Lyft created Envoy to handle networking between its many services; it became the standard sidecar proxy used by Istio and other meshes.","p":["Adopting a mesh for 3 services and drowning in complexity","Retries configured both in app code and mesh, multiplying load","Ignoring the extra latency and resource cost"],"v":["API Gateway","An API gateway manages NORTH-SOUTH traffic (outside clients into your system). A service mesh manages EAST-WEST traffic (service to service inside)."],"f":["Service A calls B","A’s sidecar: retry, mTLS","B’s sidecar receives","Metrics + traces auto-collected"],"q":[["What is a sidecar?","A helper container running next to the app container in the same pod, here a proxy handling network traffic."],["What features does a service mesh provide?","mTLS, retries/timeouts, circuit breaking, traffic splitting, observability and access policies."],["Gateway vs mesh?","Gateway handles external client traffic entering the system; mesh handles internal service-to-service traffic."]]},{"n":140,"c":"arch","t":"Stateless vs Stateful Services","s":"A stateless service remembers nothing between requests (any server can handle any request); a stateful service keeps data in memory or on its own disk.","w":"Stateless: each request carries everything needed (like a token), and shared data lives in a database or cache. Kill a server and nothing is lost. Stateful: the server holds sessions, WebSocket connections, game state or database files. Requests must reach the right server, and losing it loses state.","y":"Stateless services are easy to scale, load balance and replace, which is why designs push state into dedicated systems. Interviewers expect you to say “keep app servers stateless”.","h":["Store sessions in Redis/DB or use signed tokens instead of server memory.","Store files in object storage (S3), not local disk.","Keep caches either shared (Redis) or treat local caches as disposable.","For truly stateful parts (databases, WebSocket hubs, game servers), use replication, consistent routing (sticky by user/room ID) and failover.","In Kubernetes, use Deployments for stateless and StatefulSets with persistent volumes for stateful.","Make stateful pieces few and well-managed; make everything else stateless."],"e":"A shopping site stored carts in server memory. Every deploy or scale-down emptied users' carts. Moving carts to Redis made app servers stateless and fixed it.","p":["Sessions in local memory behind a load balancer","Uploads saved on one server’s disk","Treating a stateful service like disposable stateless pods"],"v":["Sticky Sessions","Sticky sessions route a user to the same server to work around server-side state. Making the service stateless removes the need for stickiness."],"f":["Request + token","Any server handles it","State read from Redis/DB","!Server dies → nothing lost"],"q":[["Why are stateless services easier to scale?","Any instance can serve any request, so you can add/remove instances freely behind a load balancer."],["Where does state go in a stateless design?","Databases, caches like Redis, object storage, or the client (signed tokens)."],["Name examples of inherently stateful components.","Databases, message brokers, WebSocket connection servers, multiplayer game servers."]]},{"n":141,"c":"dist","t":"Unique ID Generation","s":"Creating IDs that are unique across many servers without every server asking one central database for the next number.","w":"A single auto-increment counter becomes a bottleneck and single point of failure in a distributed system. Options: UUIDs (random 128-bit, no coordination, but large and unordered), Snowflake IDs (64-bit: timestamp + machine ID + sequence number; unique and roughly time-sorted), ULID/UUIDv7 (time-ordered UUIDs), or ticket servers that hand out ranges of IDs.","y":"“Design a URL shortener” or “design Twitter” always needs IDs. Sorted IDs help database index performance and let you order items by creation time.","h":["Need simple and no ordering? UUIDv4.","Need sortable and index-friendly? UUIDv7 or ULID.","Need compact 64-bit and time-ordered at huge scale? Snowflake: 41 bits timestamp (ms), 10 bits machine ID, 12 bits sequence (4,096 IDs per ms per machine).","Assign machine IDs uniquely (config, ZooKeeper/etcd lease).","Handle clock going backwards: wait or refuse until the clock catches up.","Range allocation: each server grabs a block (e.g. 1,000 IDs) from a central counter and uses them locally.","Don’t expose sequential IDs publicly if guessing them is a risk; use random or encoded IDs."],"code":"Snowflake (64 bits)\n| 1 sign | 41 timestamp ms | 10 machine id | 12 sequence |\nid = (ts - EPOCH) << 22 | machine << 12 | seq\n# 4096 IDs per millisecond per machine, sorted by time","e":"Twitter created Snowflake to generate tweet IDs across many servers; Discord and Instagram use similar schemes. That’s why tweet IDs are huge numbers that grow over time.","p":["Random UUIDv4 as a primary key in a huge B-tree table, causing scattered index inserts","Duplicate machine IDs producing duplicate Snowflakes","Ignoring clock rollback"],"v":["Auto-increment","Auto-increment needs one central database to coordinate. Snowflake/UUIDs generate IDs independently on each server."],"f":["Server needs an ID","Timestamp + machine ID","+ per-ms sequence","Unique, time-sorted 64-bit ID"],"q":[["What are the parts of a Snowflake ID?","A timestamp (ms since custom epoch), a machine/worker ID, and a per-millisecond sequence number."],["Why can random UUIDs hurt database performance?","Random values insert all over the B-tree index, causing page splits and poor cache locality; time-ordered IDs append near the end."],["How would you generate IDs for a URL shortener?","Use a distributed ID generator (Snowflake or range allocation) and encode the number in base62 for short codes."]]},{"n":142,"c":"arch","t":"Back-of-the-Envelope Estimation","s":"Quick, rough maths to estimate traffic, storage and servers, so your design fits the real scale.","w":"Before designing, interviewers want numbers: How many requests per second? How much storage per year? How much bandwidth? You don’t need exact answers, just the right order of magnitude (thousands vs millions). Useful facts: 1 day ≈ 86,400 s ≈ 10^5 s; 1 million requests/day ≈ 12 per second; 1 KB × 1 billion = 1 TB.","y":"The numbers decide the design. 50 requests/second fits on one server; 500,000 needs caching, sharding and queues. Skipping estimation leads to over- or under-engineering, and interviewers notice.","h":["Start from users: daily active users (DAU) × actions per user per day = requests per day.","Divide by ~100,000 to get average requests per second; multiply by 2–5 for peak.","Split reads vs writes (social apps are often 100:1 read-heavy).","Storage = new items per day × size per item × days retained (× replication factor, usually 3).","Bandwidth = requests per second × response size.","Servers ≈ peak QPS ÷ QPS one server handles (assume ~1,000–10,000 for simple APIs).","Round aggressively and state your assumptions out loud."],"code":"Twitter-like example\nDAU = 200M, each posts 2 tweets/day → 400M tweets/day\nWrite QPS ≈ 400M / 10^5 ≈ 4,000/s (peak ~10,000/s)\nEach user reads 100 tweets/day → 20B reads/day ≈ 200,000/s\nTweet ≈ 300 bytes → 400M × 300B ≈ 120 GB/day ≈ 44 TB/year\n(+ media stored separately in object storage)","e":"In a “design a URL shortener” interview, estimating 100M new links/month quickly shows you need about 40 writes/second but maybe 4,000 reads/second, so caching the redirects matters far more than write scaling.","p":["Diving into design with no numbers","Spending 15 minutes on exact arithmetic","Forgetting peak traffic, replication or media size"],"v":["Capacity Planning","Envelope estimation is a quick rough check during design. Capacity planning is ongoing, data-driven forecasting with real metrics and load tests."],"f":["DAU × actions/day","÷ 10^5 → avg QPS","× peak factor","Storage, bandwidth, servers"],"q":[["How many seconds in a day, roughly?","About 86,400, which you can round to 10^5 for quick estimates."],["1 million requests per day is about how many per second?","Roughly 12 per second on average."],["How do you estimate yearly storage?","New items per day × average size × 365, then multiply for replication and growth."]]},{"n":143,"c":"arch","t":"Fan-out on Write vs Fan-out on Read","s":"Two ways to build feeds: push each new post into every follower’s feed when it’s written, or pull posts from everyone you follow when you open the app.","w":"Fan-out on write (push): when Asha posts, the system immediately adds the post ID to the precomputed feed of each of her followers (stored in Redis lists). Reading a feed is then super fast. Fan-out on read (pull): nothing happens at post time; when you open your feed, the system fetches recent posts from everyone you follow and merges them. Writing is cheap, reading is expensive.","y":"This is THE core trade-off in “Design Twitter / Instagram / news feed” interviews, and the celebrity problem is the follow-up question.","h":["Push model: fast reads, but a user with 50 million followers creates 50 million writes per post.","Pull model: no write amplification, but every feed load queries many users and merges, which is slow.","Hybrid (what real systems do): push for normal users; for celebrities, don’t fan out; merge their recent posts at read time.","Store only post IDs in feeds, fetch content separately (cached).","Cap feed length (e.g. last 800 items) and skip fan-out to inactive users.","Do fan-out asynchronously through a queue so posting stays fast."],"e":"Twitter used fan-out on write into Redis timelines for most users, but handled accounts with huge follower counts separately at read time, merging their tweets into your timeline when you open it.","p":["Pure push with celebrities causing massive write storms","Pure pull making every feed load hit hundreds of users' data","Doing fan-out synchronously in the post request"],"v":["Pub/Sub","Pub/sub delivers events to subscriber SERVICES. Feed fan-out delivers content into each USER’s feed storage. Fan-out workers are often powered by a queue or pub/sub underneath."],"f":["User posts","Normal user → push to followers' feeds","Celebrity → skip fan-out","Read: precomputed feed + merge celebs"],"q":[["What is the celebrity problem?","With fan-out on write, a user with millions of followers triggers millions of feed writes per post."],["How does the hybrid approach work?","Push posts of normal users into feeds; pull and merge celebrity posts at read time."],["Why store only IDs in feeds?","Saves memory and lets edits/deletes update in one place; content is fetched from a cache by ID."]]},{"n":144,"c":"scale","t":"Object Storage & Presigned URLs","s":"Store files (images, videos, backups) in services like S3, and let users upload or download directly using temporary signed links.","w":"Object storage (Amazon S3, Google Cloud Storage, Cloudflare R2, MinIO) stores files as objects in buckets with keys like users/7/avatar.jpg. It’s cheap, durable (S3 is designed for 11 nines of durability) and scales infinitely, but you can’t edit part of a file like a disk. A presigned URL is a link your server signs that allows one specific action (upload or download a specific key) for a few minutes, without making the bucket public.","y":"Sending big uploads through your API servers wastes bandwidth and CPU, hits size limits and timeouts. With presigned URLs the client talks to S3 directly, and your server only hands out permission.","h":["Never store large files in the database; store the object key in the DB and the file in object storage.","Upload flow: client asks API → API checks permissions, creates a presigned PUT URL (e.g. 5 min) → client uploads directly → S3 event or client callback tells your app it’s done.","Download: serve public assets via CDN; private files via short-lived presigned GET URLs.","Use multipart uploads for big files (resumable, parallel).","Keep buckets private; block public access by default.","Validate file type and size (presigned policies can limit size/content type) and scan uploads if needed.","Use lifecycle rules to move old files to cheaper storage classes or delete them."],"code":"url = s3.generate_presigned_url(\"put_object\",\n    Params={\"Bucket\": \"uploads\", \"Key\": f\"users/{uid}/{uuid4()}.jpg\",\n            \"ContentType\": \"image/jpeg\"},\n    ExpiresIn=300)   # valid 5 minutes\n# client: PUT the file straight to url","e":"WhatsApp-style and Instagram-style apps upload photos directly to object storage, then a background job creates thumbnails, and a CDN serves them worldwide.","p":["Public buckets leaking private files (a common cause of data breaches)","Streaming large uploads through app servers","Storing images as BLOBs in the main database"],"v":["Block Storage","Block storage (a disk like EBS) is attached to one server and supports partial edits. Object storage is accessed over HTTP by key, whole-object writes, massively scalable."],"f":["Client asks API to upload","API returns presigned URL","Client PUTs file to S3 directly","Event → thumbnail job, CDN serves"],"q":[["Why use presigned URLs?","Clients upload/download directly to storage with time-limited permission, offloading bandwidth from servers while keeping buckets private."],["What should the database store for an uploaded file?","Metadata and the object key (path), not the file bytes."],["How do you handle very large uploads?","Multipart uploads: split into parts uploaded in parallel and resumable, then combined."]]},{"n":145,"c":"db","t":"Search & Inverted Index","s":"Full-text search works by keeping a map from each word to the list of documents containing it, like the index at the back of a book.","w":"To find products matching “red running shoes”, scanning every row with LIKE '%red%' is slow and dumb (no ranking, no typos). An inverted index tokenizes text into terms (“red”, “run”, “shoe” after stemming) and stores term → list of document IDs. A query intersects these lists and ranks results by relevance (e.g. BM25: rare words that appear often in a document score higher). Engines: Elasticsearch, OpenSearch, Solr, Meilisearch, Typesense, Postgres full-text search.","y":"Every e-commerce, docs or social app needs search. Interviewers ask “design search for X” or “how would you implement autocomplete”.","h":["Keep the primary database as the source of truth; sync data to the search engine (CDC or events), accepting slight delay.","Define analyzers: lowercase, remove stop words, stemming, synonyms, language rules.","Use fuzzy matching for typos and n-grams/edge n-grams for autocomplete.","Tune relevance with field boosts (title more important than description), recency and popularity.","Add filters and facets (brand, price range) on structured fields.","Shard and replicate the index for scale; reindex with aliases for zero downtime.","For small apps, Postgres full-text search (tsvector + GIN index) may be enough."],"code":"\"red running shoes\"\ntokens → [red, run, shoe]\nred  → [3, 9, 42]\nrun  → [9, 17, 42]\nshoe → [9, 42, 88]\nintersection → [9, 42]  → rank by BM25 → results","e":"Wikipedia uses Elasticsearch (via CirrusSearch) to search millions of articles in hundreds of languages in milliseconds.","p":["Using LIKE '%term%' on big tables","Treating the search index as the source of truth","No plan for keeping the index in sync with the DB"],"v":["Database Index","A B-tree index finds exact values or ranges in a column. An inverted index finds documents by the WORDS inside text and ranks by relevance."],"f":["Document saved in DB","Synced to search engine","Tokenized → inverted index","Query: intersect + rank"],"q":[["What is an inverted index?","A mapping from each term to the list of documents that contain it."],["How do you keep search in sync with the database?","Publish changes via events or change data capture to an indexer; accept small delays."],["How would you build autocomplete?","Use prefix structures like edge n-grams or a trie, rank suggestions by popularity, and cache hot prefixes."]]},{"n":146,"c":"db","t":"Geospatial Indexing","s":"Special indexes that make “find things near me” fast, by turning 2D locations into searchable cells.","w":"Finding the 10 nearest drivers by computing distance to every driver is far too slow. Geospatial indexes split the map into cells. Geohash encodes latitude/longitude into a string where nearby places share prefixes (“tdr1y” is in Bengaluru). Quadtrees recursively split busy areas into four smaller squares. Uber’s H3 uses hexagons. You search your cell plus neighbouring cells, then compute exact distances for those few candidates.","y":"“Design Uber / Zomato / Google Maps nearby search / Tinder” all need this. It’s a favourite interview deep dive.","h":["Pick a tool: PostGIS (Postgres), Redis GEO commands, Elasticsearch geo queries, MongoDB 2dsphere, or H3/S2 libraries.","Store each object’s cell ID (geohash/H3) and index it.","Query the user’s cell and its neighbours (edges matter: a close place may be in the next cell).","Choose cell size by density: larger cells in villages, smaller in dense cities (quadtrees adapt automatically).","For moving objects (drivers), keep locations in memory (Redis) and update every few seconds; don’t write each ping to the main DB.","Filter candidates by exact distance and other rules (driver available, restaurant open)."],"code":"GEOADD drivers 77.5946 12.9716 driver:42\nGEOSEARCH drivers FROMLONLAT 77.60 12.97\n          BYRADIUS 3 km ASC COUNT 10","e":"Uber built H3, a hexagonal grid system, to group supply and demand by area and quickly find nearby drivers for each ride request.","p":["Calculating distance to every row","Searching only the user’s own cell and missing nearby places across the border","Writing every GPS ping to the primary database"],"v":["B-tree Index","A B-tree handles one dimension (a number or string). Geospatial indexes handle two dimensions by mapping locations to cells or using R-trees."],"f":["User location","Compute cell (geohash/H3)","Fetch cell + neighbours","Exact distance → nearest 10"],"q":[["How does geohash help find nearby places?","Nearby locations share geohash prefixes, so you can search by prefix for the cell and neighbouring cells."],["Why also search neighbouring cells?","A nearby point can sit just across a cell boundary with a different prefix."],["How would you store live driver locations?","In memory (e.g. Redis GEO) updated every few seconds, not in the primary database for every ping."]]},{"n":147,"c":"msg","t":"Stream vs Batch Processing","s":"Batch processing handles big piles of data on a schedule; stream processing handles each event continuously as it arrives.","w":"Batch: “every night, process yesterday’s 2 billion events and compute reports” (Spark, Hadoop, dbt on a warehouse). High throughput, simple to reason about, results hours late. Stream: “as each payment happens, check for fraud within 100 ms” (Kafka Streams, Flink, Spark Structured Streaming). Low latency, but harder: late events, ordering, state, exactly-once concerns.","y":"Many designs need both: real-time dashboards and alerts (stream) plus accurate daily reports and model training (batch). Interviewers ask which one fits a requirement.","h":["Ask how fresh results must be: seconds → stream; hours/day → batch.","Use batch for reports, billing runs, ML training, backfills; it’s cheaper and simpler.","Use stream for fraud detection, live metrics, notifications, real-time recommendations.","In streaming, use windows (tumbling, sliding, session) to aggregate, e.g. orders per minute.","Handle late and out-of-order events with event-time processing and watermarks.","Keep raw events in durable storage (Kafka + S3) so you can reprocess.","Lambda architecture runs both paths; Kappa architecture uses only streaming with replay."],"e":"A bank streams card transactions through Flink to block suspicious ones within milliseconds, and runs nightly batch jobs to produce statements and retrain fraud models.","p":["Building complex streaming when daily batch would do","Ignoring late events, so streaming totals don’t match batch totals","No raw event storage, so you can’t reprocess after a bug"],"v":["Message Queue","A queue moves events between services. Stream processing COMPUTES over the flow of events (aggregations, joins, windows) as they pass."],"f":["Events flow in","Stream: process each in ms","Batch: collect, run nightly","Both feed dashboards / reports"],"q":[["When choose batch over stream?","When results can be hours old and you want simpler, cheaper, high-throughput processing."],["What is a tumbling window?","A fixed-size, non-overlapping time window, like counting events per minute."],["What are watermarks?","Markers estimating how far event time has progressed, used to decide when a window can be closed despite late events."]]},{"n":148,"c":"msg","t":"Kafka & Log-Based Messaging","s":"Kafka stores messages in an ordered, durable log that many consumers can read at their own pace and even replay.","w":"A topic is split into partitions. Each partition is an append-only log; each message gets an increasing offset. Producers append messages (messages with the same key go to the same partition, preserving order for that key). Consumers in a consumer group split partitions among themselves and remember their offsets. Messages stay for a retention period (e.g. 7 days) whether read or not, so new consumers can start from the beginning.","y":"Unlike traditional queues that delete messages once consumed, Kafka lets many independent systems read the same stream, replay history and handle massive throughput (millions of messages per second). It’s the backbone of event-driven architectures.","h":["Choose a partition key that keeps related events ordered (e.g. order_id) and spreads load.","Number of partitions caps consumer parallelism within one group: 12 partitions = up to 12 active consumers.","Set replication factor 3 and min.insync.replicas 2 with acks=all for durability.","Commit offsets after processing (at-least-once) and make consumers idempotent.","Monitor consumer lag per group.","Use compacted topics to keep only the latest value per key (great for state/config).","Use a schema registry for message formats."],"code":"topic \"orders\" (3 partitions)\nP0: [o1 o4 o7 ...]  offsets 0,1,2\nP1: [o2 o5 ...]\nP2: [o3 o6 ...]\nkey=order_id → same partition → ordered per order\ngroup \"billing\":   consumer A ← P0,P1   consumer B ← P2\ngroup \"analytics\": reads all partitions independently","e":"LinkedIn created Kafka to move activity data (page views, clicks) to many systems; today companies like Uber and Netflix process trillions of messages per day through it.","p":["Too few partitions, capping parallelism","Expecting global ordering across partitions","acks=1 with no replication and losing data on broker failure","Ignoring consumer lag"],"v":["RabbitMQ-style Queue","Classic queues push messages to consumers and delete them after ack, with rich routing. Kafka keeps a replayable log; consumers pull and track offsets, ideal for high-throughput streams and multiple readers."],"f":["Producer appends with key","Partition log (offsets)","Consumer groups read independently","Retention lets you replay"],"q":[["How does Kafka guarantee ordering?","Only within a partition; use the same key for events that must stay ordered."],["What limits consumer parallelism?","The number of partitions: each partition is consumed by at most one consumer per group."],["What is consumer lag?","The difference between the latest offset and the consumer’s committed offset, showing how far behind it is."],["How is Kafka different from a traditional queue?","Messages are retained in a log for a set time, can be read by many groups and replayed, rather than deleted on consumption."]]},{"n":149,"c":"msg","t":"Change Data Capture (CDC)","s":"Automatically turning every insert, update and delete in a database into a stream of events, by reading the database’s own log.","w":"Databases already record every change in their transaction log (Postgres WAL, MySQL binlog). CDC tools like Debezium read that log and publish each change as an event (e.g. to Kafka): “orders row 42 changed status from paid to shipped”. Other systems subscribe: search index, cache invalidation, data warehouse, analytics.","y":"Without CDC, apps do “dual writes” (save to DB, then also update Elasticsearch and send an event), which get out of sync when one fails. CDC captures exactly what was committed, in order, without changing application code.","h":["Enable logical replication/binlog on the database.","Run a CDC connector (Debezium + Kafka Connect, or managed options like AWS DMS, Fivetran).","Publish changes per table to topics, keyed by primary key to keep per-row order.","Consumers update search indexes, caches, warehouses, other services.","Pair with the outbox pattern to publish clean domain events instead of raw table changes.","Monitor replication slot lag: a stuck consumer can make the database keep WAL forever and fill the disk.","Handle schema changes and initial snapshots (the connector can snapshot existing data first)."],"e":"Many companies keep Elasticsearch in sync with Postgres using Debezium: every product update in Postgres appears in search within a second or two, with no extra code in the app.","p":["Abandoned replication slots filling the database disk","Exposing raw internal table structure as a public event contract","Forgetting the initial snapshot of existing data"],"v":["Transactional Outbox","CDC streams ALL row changes from tables. The outbox writes specific DOMAIN EVENTS to a table, often published using CDC. They work well together."],"f":["App updates DB row","Change recorded in WAL","Debezium reads log → Kafka","Search, cache, warehouse update"],"q":[["How does CDC capture changes?","By reading the database’s transaction log (WAL/binlog), not by polling tables or changing app code."],["What problem does CDC solve compared to dual writes?","It avoids inconsistency when one of two writes fails, since it derives events from what was actually committed."],["What’s a common operational risk with CDC on Postgres?","A stalled replication slot retains WAL indefinitely and can fill the disk."]]},{"n":150,"c":"net","t":"REST vs GraphQL","s":"REST exposes many URLs for resources; GraphQL exposes one endpoint where the client asks for exactly the fields it needs.","w":"REST: GET /users/7, GET /users/7/orders, each returning a fixed shape, using HTTP methods and status codes. GraphQL: POST /graphql with a query like { user(id: 7) { name orders { total } } }, returning exactly that shape, defined by a typed schema. REST can over-fetch (too many fields) or under-fetch (needing several calls); GraphQL solves both but adds complexity.","y":"It’s a common “which API style would you choose?” question. The right answer depends on clients and team.","h":["Choose REST for simple CRUD, public APIs, easy HTTP caching and wide tool support.","Choose GraphQL when many clients (web, iOS, Android) need different shapes of the same data, or screens combine lots of related data.","In GraphQL, prevent N+1 with DataLoader batching.","Protect GraphQL from expensive queries: depth limits, query cost analysis, persisted queries, timeouts.","Caching: REST uses HTTP caching easily; GraphQL needs client caches (Apollo, Relay) or persisted GET queries.","Authorization must be checked per field/object in GraphQL resolvers.","gRPC is the third option for internal service-to-service calls."],"code":"# REST: 3 calls\nGET /users/7\nGET /users/7/orders\nGET /orders/91/items\n\n# GraphQL: 1 call, exact fields\nquery { user(id: 7) { name\n  orders(last: 3) { total items { name } } } }","e":"Facebook created GraphQL in 2012 for its mobile apps, which needed to load complex news feed data efficiently over slow mobile networks. GitHub offers both a REST API and a GraphQL API.","p":["Unbounded GraphQL queries taking down the server","N+1 queries hidden in resolvers","Using GraphQL for a tiny CRUD app where REST is simpler"],"v":["gRPC","REST and GraphQL are popular for client-facing APIs. gRPC is typed, binary and fast, usually best for internal service-to-service calls."],"f":["Mobile screen needs data","REST: 3 round trips","GraphQL: 1 query, exact fields","Resolvers batch with DataLoader"],"q":[["What are over-fetching and under-fetching?","Over-fetching: getting more fields than needed. Under-fetching: needing multiple requests to gather all data for a screen."],["Why is caching harder with GraphQL?","Most queries are POSTs to one URL with varied bodies, so standard HTTP/CDN caching doesn’t apply directly."],["How do you protect a GraphQL server from abusive queries?","Depth and complexity limits, query cost analysis, persisted/allowlisted queries, rate limits and timeouts."]]},{"n":151,"c":"sec","t":"Password Hashing","s":"Store passwords as slow, salted one-way hashes, never as plain text or simple encryption, so a stolen database doesn’t reveal them.","w":"A hash is a one-way fingerprint: you can check a password against it but can’t reverse it. Fast hashes like MD5 or SHA-256 are bad for passwords because attackers can try billions per second with GPUs. Password hashing algorithms (Argon2id, bcrypt, scrypt) are deliberately slow and memory-hungry. A salt (random value per user) is stored with the hash so identical passwords produce different hashes and precomputed “rainbow tables” don’t work.","y":"Databases get breached. If passwords are stored properly, attackers get almost nothing; if not, they get every user’s password, which people reuse on other sites.","h":["Use Argon2id (preferred) or bcrypt via a trusted library; never write your own.","Let the library generate a unique random salt per password (it’s stored inside the hash string).","Tune the cost so hashing takes roughly 100–500 ms on your servers, and raise it over time.","Rehash on login when you upgrade the algorithm or cost.","Compare hashes with constant-time functions (libraries do this).","Add rate limiting, breached-password checks and MFA; hashing alone doesn’t stop online guessing.","Never log passwords or send them in URLs."],"code":"from argon2 import PasswordHasher\nph = PasswordHasher()\nstored = ph.hash(\"hunter2\")   # '$argon2id$v=19$m=65536,t=3,p=4$...'\nph.verify(stored, attempt)    # raises if wrong","e":"In the 2012 LinkedIn breach, about 6.5 million (later revealed 117 million) passwords were stored as unsalted SHA-1 hashes, and most were cracked quickly. Salted bcrypt or Argon2 would have made that far harder.","p":["Storing plain text or encrypted (reversible) passwords","Using MD5/SHA-256 without a slow KDF","One global salt for all users","Cost settings so low they’re barely slower than plain hashing"],"v":["Encryption","Encryption is reversible with a key; anyone with the key gets all passwords back. Hashing is one-way: you can only verify, never recover."],"f":["User signs up","Argon2id(password + salt)","Store hash only","Login: hash attempt, compare"],"q":[["Why not use SHA-256 for passwords?","It’s designed to be fast, so attackers can test billions of guesses per second; password hashes must be slow."],["What does a salt do?","Makes each hash unique even for identical passwords and defeats precomputed rainbow tables."],["Which algorithms are recommended?","Argon2id first, then scrypt or bcrypt, with properly tuned cost."]]},{"n":152,"c":"sec","t":"Sessions vs Tokens (JWT)","s":"Two ways to remember a logged-in user: a server-side session looked up by an ID cookie, or a self-contained signed token the server can verify without lookup.","w":"Session: after login, the server stores {session_id → user 7} in Redis/DB and sends the session ID in an HttpOnly cookie. Every request looks it up. Logout = delete it. Token (JWT): the server sends a signed token containing {user: 7, exp: ...}. Any server can verify the signature without a database lookup, but you can’t easily revoke it before it expires.","y":"“How would you handle authentication?” is a standard question, and choosing JWTs for everything is a common mistake.","h":["For typical web apps: server-side sessions in an HttpOnly, Secure, SameSite cookie are simple and easy to revoke.","For APIs used by mobile apps, third parties or many services: short-lived access tokens (JWT, 5–15 min) plus refresh tokens.","Don’t store tokens in localStorage if you can avoid it (readable by XSS); prefer HttpOnly cookies or secure mobile storage.","Keep JWT payloads small and non-sensitive (they’re readable, just signed).","Plan revocation: short expiry, refresh token rotation, and a denylist for emergencies.","Store sessions in a shared store (Redis) so app servers stay stateless."],"code":"Session:  Cookie: sid=8f2a…  → Redis: sid → {user: 7}\nJWT:      Authorization: Bearer eyJhbGciOi…\n          payload {\"sub\":\"7\",\"exp\":1760900000}  (signed, not encrypted)","e":"Many large web apps like GitHub use classic session cookies for the browser, and separate tokens (personal access tokens, OAuth tokens) for API and CLI access.","p":["Using long-lived JWTs with no way to log users out","Putting sensitive data in the JWT payload","Storing tokens in localStorage on XSS-prone sites","Sessions in one server’s memory"],"v":["OAuth","Sessions and JWTs are ways to keep a user logged in to YOUR app. OAuth is a protocol for granting a third-party app access, which may issue tokens (sometimes JWTs)."],"f":["User logs in","Session: store ID in Redis","JWT: sign token","Each request: lookup vs verify"],"q":[["Main advantage of sessions over JWTs?","Easy, immediate revocation (delete the session) and nothing sensitive leaves the server."],["Main advantage of JWTs?","Stateless verification: any service can validate the signature without a shared lookup."],["Is a JWT encrypted?","Usually not; it’s base64-encoded and signed, so anyone can read the payload but can’t modify it."]]},{"n":153,"c":"scale","t":"Cache Eviction Policies","s":"Rules that decide which item to throw out when the cache is full: least recently used, least frequently used, oldest, and so on.","w":"Cache memory is limited. When it’s full and a new item comes in, something must go. LRU (Least Recently Used) evicts what hasn’t been accessed for the longest time. LFU (Least Frequently Used) evicts what’s accessed least often. FIFO evicts the oldest inserted. TTL-based expiry removes items after a time. Random eviction is surprisingly okay and cheap.","y":"The wrong policy wastes memory on useless items and lowers hit rate. “Design an LRU cache” is also a classic coding interview question.","h":["LRU is the default for most workloads: recently used data is likely used again.","LFU suits stable popularity (top products); it resists one-off scans pushing out popular items.","TTL guarantees freshness; combine with LRU/LFU for capacity.","In Redis set maxmemory and a policy: allkeys-lru, allkeys-lfu, volatile-ttl, etc.","Protect against scan pollution (one big batch read evicting hot items) with LFU or segmented LRU.","Monitor hit ratio and eviction count; constant evictions mean the cache is too small.","LRU implementation: a hash map + doubly linked list gives O(1) get and put."],"code":"# Redis\nmaxmemory 2gb\nmaxmemory-policy allkeys-lfu\n\n# LRU in O(1): dict for look
