mmits locally, so others can see partial progress. Use explicit statuses like 'pending', avoid acting on unconfirmed data, and design UI accordingly."]],"r":[34,113,120,147],"k":["In a saga, what should happen if the final step (create shipment) fails?",["Nothing; leave earlier steps done","Run compensating actions for the completed steps in reverse order","Retry forever","Roll back all databases with one global transaction"],1,"Sagas replace a global rollback with compensations: undo completed steps (refund, release stock) in reverse order."],"sl":"saga-pattern"},{"n":36,"c":"msg","t":"Message Queues","s":"A waiting line for work: one part of the system drops tasks in, workers take them out and process them when they’re ready.","w":"A producer sends a message (“resize image 42”) to a queue (RabbitMQ, SQS, Redis/BullMQ, Kafka used queue-style). A consumer/worker pulls it, does the job, then acknowledges (acks) it. If the worker crashes before acking, the message becomes visible again and another worker picks it up.","y":"If your API does slow work (send emails, generate PDFs, call slow partners) during the request, users wait and traffic spikes overwhelm you. A queue lets you reply instantly (“we’re on it”), absorb spikes, and scale workers separately.","h":["Put slow or unreliable work behind a queue; respond to the user immediately.","Ack only after the work is fully done, never before.","Expect at-least-once delivery: the same message can arrive twice. Make consumers idempotent.","Set visibility timeouts longer than the job takes.","Limit retries and send repeatedly failing messages to a dead-letter queue.","Monitor queue depth AND age of the oldest message; age shows how far behind users really are.","Autoscale workers on queue depth.","Ordering is usually not guaranteed unless you use FIFO queues or partitions."],"code":"# producer (API)\nqueue.send({\"type\": \"resize\", \"image_id\": 42})\nreturn 202  # Accepted\n\n# worker\nmsg = queue.receive()\nresize(msg.image_id)\nqueue.ack(msg)   # only after success","e":"When you upload a video to YouTube, the upload finishes fast; encoding into many resolutions happens through job queues over the next minutes.","p":["Acking before processing (crash = lost job)","Non-idempotent consumers creating duplicates","Unbounded queue silently growing for days","Putting huge payloads in messages instead of a reference (store the file in S3, send its ID)"],"v":["Pub/Sub","A queue usually gives each message to ONE worker (share the work). Pub/sub gives each message to EVERY subscriber (broadcast the news)."],"f":["API enqueues job","Queue holds it","Worker processes","Worker acks → removed"],"q":[["Why ack after processing and not before?","If the worker crashes after acking but before finishing, the job is lost forever."],["What does at-least-once delivery mean for consumers?","They may receive the same message more than once and must be idempotent."],["Which metric best shows queue health?","Age of the oldest message (latency), together with queue depth and processing rate."],["What’s a visibility timeout?","How long a received message stays hidden from other consumers. If the consumer doesn’t ack in time, the message becomes visible again and may be processed twice."],["Why send a reference instead of a large payload in a message?","Brokers have size limits and large messages slow everything. Store the file in object storage and pass its ID."]],"r":[37,39,148,120],"num":"API receives 2,000 email jobs/s at peak; workers send 500/s.\nQueue grows 1,500/s → after 10 minutes: 900,000 messages.\nWorkers needed to drain in 15 min after peak: backlog ÷ 900 s + incoming… scale workers on queue age.","m":["Age of oldest message: the user-visible delay.","Queue depth and in/out rate: growing depth = consumers can’t keep up.","Redelivery count: frequent redeliveries mean crashes or too-short visibility timeouts."],"k":["A worker acknowledges a message as soon as it receives it, then crashes mid-job. What happens?",["The message is redelivered","The job is lost","The queue pauses","The producer is notified"],1,"Once acknowledged, the broker considers the message done. Ack only after the work is complete."],"sl":"message-queues"},{"n":37,"c":"msg","t":"Pub/Sub","s":"A publisher announces an event to a topic, and every service that subscribed gets its own copy.","w":"The publisher doesn’t know or care who’s listening. “OrderPlaced” goes to the topic; the email service, the analytics service and the warehouse service each receive it. Adding a new listener needs zero changes to the publisher. Tools: Kafka, Google Pub/Sub, SNS, Redis Pub/Sub, NATS.","y":"Without it, the order service must call email, analytics and warehouse directly. Every new feature means editing the order service, and if analytics is down, ordering breaks.","h":["Publish facts in past tense: OrderPlaced, PaymentFailed, with IDs and key fields.","Each subscriber gets its own subscription/consumer group with its own position.","Expect duplicates and out-of-order delivery; deduplicate with event IDs.","Version event schemas; only add fields, don’t remove or rename (or use a schema registry).","Choose durability: Redis Pub/Sub drops messages if nobody’s listening; Kafka/Google Pub/Sub keep them.","Ordering is usually guaranteed only per key/partition (e.g. per order ID)."],"e":"When a ride ends at Uber, a TripCompleted event fans out to billing, driver payouts, receipts, ratings prompts and fraud detection, each a separate subscriber.","p":["Publishing commands disguised as events (“SendEmailNow”)","Breaking subscribers by changing event shape","Using non-durable pub/sub for important events"],"v":["Message Queue","Queue: many workers SHARE the work, each message handled once. Pub/sub: every subscriber gets EVERY message. Kafka can do both via consumer groups."],"f":["Order service publishes OrderPlaced","Topic","Email / Analytics / Warehouse","Each processes its own copy"],"q":[["How does pub/sub reduce coupling?","Publishers don’t know subscribers; new consumers can be added without changing the publisher."],["What’s the difference between an event and a command?","An event states a fact that happened (OrderPlaced). A command asks someone to do something (ChargeCard)."],["How is ordering typically guaranteed in Kafka?","Only within a partition; messages with the same key go to the same partition and keep order."],["What happens to Redis Pub/Sub messages if a subscriber is offline?","They’re lost; Redis Pub/Sub doesn’t persist. Use durable systems (Kafka, Google Pub/Sub, Redis Streams) for important events."],["How do you evolve an event schema safely?","Add optional fields only, never rename/remove or change types in place, version the event when breaking changes are unavoidable, and use a schema registry."]],"r":[36,38,148,113],"k":["You need the email, analytics and warehouse services to each react to every OrderPlaced event. Which pattern fits?",["One work queue shared by all three","Pub/sub with a separate subscription per service","Synchronous HTTP calls from the order service","A cron job"],1,"Pub/sub gives every subscriber its own copy of each event, without the publisher knowing about them."],"sl":"pub-sub"},{"n":38,"c":"msg","t":"Event-Driven Architecture","s":"Services communicate mainly by announcing what happened, and others react, instead of calling each other directly and waiting.","w":"In request/response style, service A calls B and waits. In event-driven style, A emits “something happened” and moves on; B, C and D react in their own time. The system is built from producers, an event backbone (Kafka, EventBridge, Pub/Sub) and consumers.","y":"It decouples teams and services, keeps the user’s request fast (side effects happen asynchronously), and absorbs spikes. The price: the flow is harder to see and debug, and data becomes eventually consistent.","h":["Use events for side effects and notifications; keep direct calls for things the user needs an answer to NOW.","Define clear event contracts and own them like an API.","Add correlation IDs and distributed tracing so you can follow one order through many services.","Make consumers idempotent and handle retries and DLQs.","Publish reliably with the transactional outbox.","Document who produces and who consumes each event (an event catalog).","Watch consumer lag to see when listeners fall behind."],"e":"When you place an Amazon order, the checkout returns quickly. Emails, warehouse picking, recommendations and invoices follow from events behind the scenes.","p":["“Event spaghetti”: nobody knows what triggers what","Using events where the caller actually needs the result","Losing events between DB commit and publish"],"v":["Request/Response","Request/response: call and wait for an answer (simple, tightly coupled). Event-driven: announce and continue (decoupled, eventually consistent, harder to trace)."],"f":["User places order","OrderPlaced event","Services react async","User already got “Order confirmed”"],"q":[["When should you NOT use events?","When the caller needs an immediate answer to continue, like checking a password or getting a price."],["What are the main downsides of event-driven systems?","Harder debugging and tracing, eventual consistency, duplicate/out-of-order handling, and hidden dependencies."],["What is consumer lag?","How far behind a consumer is from the latest events; growing lag means it can’t keep up."],["How do you trace a request across event-driven services?","Propagate trace context (traceparent) and correlation IDs in event headers, and instrument producers and consumers with OpenTelemetry."],["What is 'event spaghetti' and how do you avoid it?","Unclear chains of events triggering events nobody can follow. Avoid it with an event catalog, clear ownership, orchestration for complex flows, and tracing."]],"r":[37,113,102,147],"k":["Which call should stay synchronous rather than become an event?",["Sending a welcome email","Updating analytics","Checking a user’s password at login","Generating a thumbnail"],2,"The login needs an answer immediately to continue. Side effects can be asynchronous events."],"sl":"event-driven-architecture"},{"n":39,"c":"msg","t":"Dead Letter Queues","s":"A separate “problem pile” where messages go after failing too many times, so they stop blocking everything else.","w":"Some messages can never succeed: malformed JSON, a deleted customer, a bug in the consumer. These “poison messages” fail, get retried, fail again forever. A dead-letter queue (DLQ) catches them after N failed attempts, so the main queue keeps flowing and humans can inspect the bad ones.","y":"Without a DLQ, a poison message either blocks a strictly ordered queue completely, or loops forever burning CPU, or is silently dropped and lost.","h":["Set a max receive/retry count (e.g. 5) after which messages move to the DLQ (SQS redrive policy, RabbitMQ dead-letter exchange).","Keep the original payload plus error reason, attempt count and timestamps.","Alert when DLQ size is above zero or growing.","Investigate, fix the bug or data, then redrive (replay) messages back to the main queue.","Make sure replay is safe: consumers must be idempotent.","Set a retention period long enough for someone to look."],"e":"An invoice worker crashed on any customer with an emoji in their address. Instead of retrying forever, those messages landed in the DLQ; after the encoding fix, the team replayed them all with one command.","p":["Nobody watching the DLQ, so it becomes a graveyard","Replaying before fixing the bug (they just go back to the DLQ)","DLQ retention shorter than the time it takes anyone to notice"],"v":["Retry Queue","A retry queue holds messages to try AGAIN later. A DLQ holds messages that have given up and need a HUMAN or a fix."],"f":["Message fails","Retry ×5 with backoff","!Still failing","Move to DLQ + alert"],"q":[["What is a poison message?","A message that will fail every time it’s processed, e.g. due to bad data or a bug."],["What should you do with messages in a DLQ?","Alert, investigate the cause, fix code or data, then replay them safely to the main queue."],["Why must DLQ replay be idempotent?","Some messages may have partially succeeded before failing; replaying could duplicate effects."],["What information should a DLQ message carry?","The original payload plus error message, failure count, timestamps, and which consumer failed, so engineers can diagnose and replay."],["How do you safely replay a DLQ?","Fix the root cause first, replay in small batches, monitor errors, and rely on idempotent consumers so partially processed messages aren’t duplicated."]],"r":[36,120,11,104],"m":["DLQ depth: should be zero; any growth needs an alert.","DLQ arrival rate by error type: groups failures to their causes.","Replay success rate after fixes."],"k":["When should a message move to the dead-letter queue?",["Immediately on the first failure","After a bounded number of failed attempts","Never; retry forever","Only when the queue is full"],1,"Transient errors deserve a few retries; messages that keep failing are moved aside so they stop blocking or wasting work."],"sl":"dead-letter-queues"},{"n":40,"c":"msg","t":"Backpressure","s":"When the downstream part can’t keep up, it pushes back and tells the upstream part to slow down, instead of drowning.","w":"Think of a sink: if water pours in faster than the drain, it overflows. In software, a producer that sends faster than the consumer can handle fills up memory, buffers and queues until something crashes. Backpressure is the feedback signal: “stop”, “slow down”, or “I’ll only take 100 at a time”.","y":"Unbounded buffers hide the problem until latency explodes and the process runs out of memory. With backpressure, the system degrades gracefully: some requests get “busy, try later” while the rest stay fast.","h":["Use bounded queues and buffers; when full, block the producer or reject new work.","Reject early and cheaply with 503/429 at the edge instead of accepting work you can’t finish.","Use pull-based consumption: consumers ask for N items when ready (Reactive Streams, Kafka consumers, gRPC flow control).","Limit concurrency: e.g. max 50 in-flight DB calls; queue or reject the rest.","Shed load by priority: drop analytics before checkout.","Propagate the signal upstream so clients slow down too."],"code":"queue = asyncio.Queue(maxsize=1000)   # bounded\nawait queue.put(item)   # producer waits when full\n# or, for HTTP:\nif inflight >= LIMIT: return 503, {\"Retry-After\": \"2\"}","e":"TCP has backpressure built in: the receiver advertises a window size, and the sender never sends more unacknowledged data than that window.","p":["Unbounded in-memory queues","Accepting every request then timing them all out","Retry storms ignoring the slow-down signal"],"v":["Rate Limiting","Rate limiting is a fixed policy (“100/min per user”) even when idle. Backpressure is dynamic, based on how overloaded the system is right now."],"f":["Producer sends fast","Bounded buffer fills","Signal: slow down / 503","Producer waits, system stable"],"q":[["Why are unbounded queues dangerous?","They hide overload, grow until memory runs out, and make latency for every item huge."],["Name three ways to apply backpressure.","Bounded blocking queues, rejecting with 503/429, pull-based consumption with demand signals, or concurrency limits."],["What is load shedding?","Deliberately dropping lower-priority work when overloaded to protect the most important work."],["How does TCP implement backpressure?","The receiver advertises a window size; the sender can’t have more unacknowledged data in flight than that window, so a slow receiver slows the sender."],["Name a load-shedding strategy.","Prioritize critical traffic (checkout) over optional work (recommendations, analytics) and reject the low-priority requests first when overloaded."]],"r":[2,36,10,112],"num":"Producer 5,000 msg/s, consumer 3,000 msg/s, unbounded buffer, 1 KB/msg:\ngrowth 2,000 msg/s × 1 KB = 2 MB/s → 7.2 GB per hour → out of memory.\nBounded buffer of 10,000 → producer blocked or told to slow down after ~5 s.","m":["Queue/buffer fill level: near-full buffers mean backpressure should be active.","Rejected/shed requests (503/429): show backpressure working.","In-flight request count vs concurrency limit."],"k":["What is the main danger of an unbounded in-memory queue between a fast producer and a slow consumer?",["Messages are delivered out of order","Memory grows until the process crashes and latency becomes huge","The consumer speeds up","Duplicate messages"],1,"An unbounded queue hides overload until memory runs out. Bounded queues force a decision: block, reject or shed."],"sl":"backpressure"},{"n":41,"c":"ops","t":"Cron Jobs","s":"Tasks that run automatically on a schedule, like “every night at 2 AM”.","w":"Cron is the classic Unix scheduler using expressions like 0 2 * * * (minute hour day month weekday). In modern systems you use Kubernetes CronJobs, cloud schedulers (EventBridge Scheduler, Cloud Scheduler) or job libraries. Typical uses: backups, reports, cleanup, sending reminders, syncing data.","y":"Without scheduling, routine work depends on someone remembering. But naive cron jobs have classic failures: they run on every server at once, overlap with the previous run, fail silently, or fire at the wrong time due to time zones.","h":["Run the job in ONE place (a scheduler, or with a distributed lock) so 10 servers don’t all run it.","Prevent overlap: skip if the previous run is still going (Kubernetes concurrencyPolicy: Forbid).","Make jobs idempotent so a rerun or a double run is safe.","Be explicit about time zones (UTC is safest) and daylight-saving changes.","Log start, end and result, and alert when a job FAILS or DOESN’T RUN (heartbeat monitoring like healthchecks.io).","Keep the cron trigger light: it can enqueue jobs that workers process.","Process big data in batches and checkpoint progress so a crash can resume."],"code":"# Kubernetes CronJob\nschedule: \"0 2 * * *\"      # 02:00 every day\ntimeZone: \"Etc/UTC\"\nconcurrencyPolicy: Forbid\nstartingDeadlineSeconds: 600","e":"A nightly billing cron ran on all 4 app servers after a scale-up, charging customers 4 times. Moving it to a single scheduled job with an idempotency check per invoice fixed it.","p":["Silent failures nobody notices for weeks","Same job running on every instance","DST shifting a 2:30 AM job to never run (or run twice)"],"v":["Message Queue","Cron decides WHEN work starts. A queue decides HOW work is buffered and processed. A good pattern: cron enqueues, workers process."],"f":["Scheduler fires 02:00 UTC","Acquire lock / single runner","Enqueue or run job","Log + heartbeat ping"],"q":[["How do you make sure a cron job runs only once with many servers?","Use a central scheduler, a single-instance runner, or a distributed lock, and make the job idempotent."],["How do you detect a cron job that silently stopped running?","Heartbeat (“dead man’s switch”) monitoring: alert if the job doesn’t check in by the expected time."],["What does 0 2 * * 1 mean?","At 02:00 every Monday."],["How do you detect a cron job that silently stopped running?","Have the job ping a heartbeat monitor on success; alert if no ping arrives within the expected window."],["Why can daylight-saving time break cron jobs?","Local times like 02:30 may be skipped or happen twice on DST change days. Schedule in UTC or handle DST explicitly."]],"r":[27,36,104,1],"m":["Last successful run time per job: alert if it’s older than expected (heartbeat / dead man’s switch).","Job duration trend: jobs that grow longer will eventually overlap the next run.","Failure count per job."],"k":["A nightly job runs on all 4 app servers after a scale-up and sends 4 emails per user. Best fix?",["Run it only on the server with the most CPU","Use a single scheduler (or distributed lock) and make the job idempotent","Add sleep before sending","Schedule it at different times on each server"],1,"Exactly one runner plus idempotent work prevents duplicates even if something triggers twice."],"sl":"cron-jobs"},{"n":42,"c":"sec","t":"SQL Injection","s":"An attack where user input is treated as part of your SQL command, letting attackers read or change your data.","w":"If you build SQL by gluing strings, like \"SELECT * FROM users WHERE name = '\" + name + \"'\", an attacker can type ' OR '1'='1 as their name. The query becomes WHERE name = '' OR '1'='1', which matches everyone. Worse inputs can drop tables or dump passwords.","y":"It’s one of the oldest and most damaging web vulnerabilities, behind countless data breaches. It’s also completely preventable.","h":["Always use parameterized queries / prepared statements. The query structure and the data are sent separately, so data can never become code.","ORMs are safe by default, but raw SQL inside ORMs (raw(), execute(), string-formatted filters) is not.","Identifiers like column names in ORDER BY can’t be parameters: use an allowlist of permitted values.","Give the app’s DB user least privilege (no DROP, no access to other schemas).","Validate input types (an ID should be an integer) as an extra layer.","Don’t show raw DB error messages to users.","Use scanners (sqlmap in testing, SAST tools in CI)."],"code":"# VULNERABLE\ncur.execute(f\"SELECT * FROM users WHERE email = '{email}'\")\n\n# SAFE: parameter is sent as data, never as SQL\ncur.execute(\"SELECT * FROM users WHERE email = %s\", (email,))\n\n# ORDER BY: allowlist\ncol = {\"name\": \"name\", \"date\": \"created_at\"}.get(sort, \"created_at\")","e":"The 2008 Heartland Payment Systems breach, one of the largest card thefts ever (over 100 million cards), started with a SQL injection on a web form.","p":["“Escaping” input manually instead of parameters","Thinking an ORM protects raw queries too","Trusting input because it comes from your own frontend or a hidden field"],"v":["XSS","SQL injection makes input run as SQL on YOUR DATABASE. XSS makes input run as JavaScript in OTHER USERS' BROWSERS. Fix SQLi with parameters, XSS with output escaping."],"f":["!Input: ' OR '1'='1","String-built SQL","!Returns every user","Fix: parameterized query"],"q":[["Why do parameterized queries prevent SQL injection?","The SQL structure is compiled separately from the values; values are always treated as data, never as executable SQL."],["How do you safely let users choose a sort column?","Map their choice through an allowlist of known column names; never insert it directly."],["Is input validation enough to stop SQL injection?","No; it’s a helpful extra layer, but parameterization is the real fix."],["Is an ORM always safe from SQL injection?","No. ORMs parameterize their normal APIs, but raw queries or string-built filters inside the ORM are just as vulnerable."],["Why does least privilege matter for SQL injection?","If an injection happens anyway, a DB user without DROP or access to other schemas limits the damage."]],"r":[117,43,48,52],"k":["Which query is safe from SQL injection?",["\"SELECT * FROM users WHERE id = \" + id","f\"SELECT * FROM users WHERE id = {id}\"","cur.execute(\"SELECT * FROM users WHERE id = %s\", (id,))","\"SELECT * FROM users WHERE id = '\" + escape(id) + “'”"],2,"Parameterized queries send the SQL and the value separately, so the value can never change the query’s structure."],"sl":"sql-injection"},{"n":43,"c":"sec","t":"XSS","s":"Cross-Site Scripting: an attacker gets their JavaScript to run inside your website, in other users' browsers.","w":"If you put user content into a page without escaping, e.g. a comment containing <script>steal()<\/script>, every visitor’s browser runs that script as if your site wrote it. Types: stored (saved in DB, shown to many), reflected (bounced from a URL parameter) and DOM-based (frontend JS inserts data unsafely with innerHTML).","y":"The script runs with your site’s power: it can read data on the page, act as the logged-in user, steal tokens from localStorage, change what users see, or redirect them to phishing pages.","h":["Escape output for its context: HTML body, HTML attribute, JavaScript, URL and CSS each need different encoding.","Use frameworks that escape by default (React, Vue, Angular, Django/Jinja templates) and avoid their escape hatches (dangerouslySetInnerHTML, v-html, |safe).","If you must allow HTML (rich text), sanitize with a proven library like DOMPurify using an allowlist.","Use textContent instead of innerHTML in plain JS.","Add a Content-Security-Policy header that blocks inline scripts and untrusted script sources.","Set session cookies HttpOnly so JS can’t read them.","Validate URLs: block javascript: links in href attributes."],"code":"// UNSAFE\nel.innerHTML = comment;\n// SAFE\nel.textContent = comment;\n// Rich text: sanitize first\nel.innerHTML = DOMPurify.sanitize(comment);\n// Header\nContent-Security-Policy: script-src 'self'","e":"The 2005 “Samy” MySpace worm used stored XSS in a profile: anyone viewing it ran a script that added Samy as a friend and copied itself into their profile. Over a million profiles were infected in under a day.","p":["Escaping for HTML but placing data inside a script block or attribute","Trusting data from your own database (it came from users originally)","Building HTML strings in JS with concatenation"],"v":["CSRF","XSS runs the attacker’s code INSIDE your site. CSRF tricks the user’s browser into SENDING a request to your site from somewhere else. XSS is generally worse; it can bypass CSRF protections."],"f":["!Attacker posts <script> comment","Saved in DB","Victim opens page","Fix: escape output + CSP"],"q":[["Stored vs reflected XSS?","Stored is saved on the server and served to many users; reflected comes from the current request (like a URL parameter) and is echoed back immediately."],["Why is escaping context-dependent?","Characters that are dangerous differ between HTML, attributes, JavaScript strings and URLs, so each needs its own encoding."],["How does CSP reduce XSS impact?","It tells the browser which script sources are allowed, blocking injected inline scripts even if escaping fails."],["Why should session cookies be HttpOnly?","JavaScript can’t read HttpOnly cookies, so even if XSS happens, the attacker can’t directly steal the session cookie."],["What’s DOM-based XSS?","The vulnerability is in frontend code that takes data from the URL, storage or messages and inserts it into the page unsafely, without the server being involved."]],"r":[44,117,18,152],"k":["Which line is vulnerable to XSS when 'name' comes from a user?",["el.textContent = name","el.innerHTML = name","React: <p>{name}<\/p>","el.setAttribute('data-name', name) with a safe attribute"],1,"innerHTML parses the string as HTML, so injected tags and event handlers run. textContent and React’s normal rendering escape it."],"sl":"xss"},{"n":44,"c":"sec","t":"CSRF","s":"Cross-Site Request Forgery: a malicious website makes your logged-in browser send an action to another site without you knowing.","w":"Browsers automatically attach cookies to requests for a site. So if you’re logged into bank.com and visit evil.com, evil.com can contain a hidden form that POSTs to bank.com/transfer. Your browser adds your bank cookie, and the bank sees a valid logged-in request. The attacker can’t read the response, but the action still happens.","y":"Any state-changing action that relies only on cookies (transfer money, change email, delete account) can be triggered by a stranger’s webpage.","h":["Set cookies with SameSite=Lax (modern browser default) or Strict, which stops cookies on most cross-site requests.","Use anti-CSRF tokens: a random token in the form/header that evil.com can’t know; most frameworks provide this built in.","Never change state with GET requests.","Check the Origin / Referer header on sensitive requests.","APIs that use an Authorization header (not cookies) aren’t vulnerable in the same way, because browsers don’t add that header automatically.","Re-ask for password for critical actions."],"code":"Set-Cookie: session=abc; HttpOnly; Secure; SameSite=Lax\n\n<form method=\"POST\" action=\"/email\">\n  <input type=\"hidden\" name=\"csrf_token\" value=\"{{ token }}\">\n<\/form>","e":"In 2008, a CSRF bug in some home routers let any website change the router’s DNS settings just by loading an image URL, sending users to fake banking sites.","p":["State-changing GET links like /delete?id=5","Thinking CORS protects you (simple form POSTs don’t need CORS permission to be SENT)","Disabling the framework’s CSRF protection to fix an annoying error"],"v":["CORS","CORS controls whether another site’s JS can READ responses. CSRF is about another site making the browser SEND requests. CORS does not stop CSRF."],"f":["You’re logged into bank.com","!evil.com auto-submits form","Browser attaches cookie","Fix: SameSite + CSRF token"],"q":[["Why does CSRF work?","Browsers automatically include cookies for the target site, so forged requests look authenticated."],["How does SameSite=Lax help?","Cookies aren’t sent on cross-site subrequests and cross-site POSTs, only on top-level GET navigations."],["Are APIs using bearer tokens in headers vulnerable to CSRF?","Generally no, because browsers don’t attach Authorization headers automatically; the attacker’s page doesn’t know the token."],["Why must GET requests never change state?","Browsers, prefetchers and attackers can trigger GETs easily (images, links), so a state-changing GET is trivially exploitable."],["Can XSS bypass CSRF protection?","Yes. Script running on your origin can read the CSRF token and send valid requests, which is why XSS must be fixed too."]],"r":[18,43,152,46],"k":["Your site uses cookie sessions. Which change best protects against CSRF?",["Enable CORS for all origins","Set SameSite=Lax on cookies and use anti-CSRF tokens for state-changing requests","Use GET for all actions","Hide forms with CSS"],1,"SameSite stops cookies on most cross-site requests and CSRF tokens prove the request came from your own page."],"sl":"csrf"},{"n":45,"c":"sec","t":"SSRF","s":"Server-Side Request Forgery: tricking your server into fetching a URL the attacker chooses, often an internal one.","w":"Features like “import from URL”, link previews, webhooks or PDF generators make your server fetch URLs. An attacker supplies http://169.254.169.254/latest/meta-data/ (cloud metadata) or http://localhost:6379 or http://internal-admin/. Your server, which sits inside the trusted network, happily fetches it and maybe shows the result.","y":"Internal services often trust anything from inside the network. Cloud metadata endpoints can hand out credentials. SSRF turns your server into the attacker’s insider.","h":["Allowlist destinations if possible (only specific domains).","Resolve the hostname and block private, loopback and link-local ranges (10.x, 172.16–31.x, 192.168.x, 127.x, 169.254.x, ::1, fc00::/7).","Re-check after every redirect, or disable redirects.","Pin the resolved IP for the actual connection to stop DNS rebinding tricks.","Allow only http/https schemes; block file://, gopher:// etc.","Use IMDSv2 on AWS (requires a token, blocks simple SSRF) and give instances minimal IAM permissions.","Run URL fetchers in an isolated network with restricted egress."],"e":"In the 2019 Capital One breach, an SSRF through a misconfigured web firewall let the attacker query the AWS metadata service, obtain credentials and read over 100 million customer records from S3.","p":["Blocking the string “localhost” but not 127.0.0.1, 0.0.0.0, [::1] or decimal IP tricks","Validating the URL then following a redirect to an internal address","Returning fetched content verbatim to the user"],"v":["CSRF","CSRF tricks a USER’s browser into sending requests. SSRF tricks your SERVER into sending requests from inside your network."],"f":["!User submits internal URL","Server resolves host","Blocked: private IP range","Only public allowed URLs fetched"],"q":[["Why is 169.254.169.254 important in SSRF?","It’s the cloud instance metadata endpoint that can return credentials and configuration."],["Why isn’t checking the URL string enough?","Attackers use redirects, alternate IP encodings and DNS rebinding; you must check the resolved IP for every connection."],["Name two infrastructure defenses for SSRF.","Restricted egress / network isolation for fetchers, and IMDSv2 with minimal instance permissions."],["What is DNS rebinding in the context of SSRF?","A hostname first resolves to a public IP (passing validation) and later to an internal one when the server connects. Pin the validated IP for the actual connection."],["Why does IMDSv2 help?","It requires a session token obtained with a PUT request and headers that simple SSRF can’t usually produce, protecting cloud credentials."]],"r":[117,48,52,122],"k":["A link-preview feature fetches user-submitted URLs. Which defence is most important against SSRF?",["Checking the URL starts with http","Resolving the hostname and blocking private/link-local IP ranges, rechecking after redirects","Using HTTPS only","Limiting response size"],1,"Attackers target internal addresses (169.254.169.254, 10.x, localhost). You must check the resolved IP on every connection, including redirects."],"sl":"ssrf"},{"n":46,"c":"sec","t":"OAuth","s":"A standard that lets one app get limited access to your account on another service without ever seeing your password.","w":"Roles: the user (resource owner), the app (client), the authorization server (e.g. Google’s login), and the resource server (Google Drive API). You click “Connect Google Drive”, Google asks you to approve specific permissions (scopes), then Google gives the app an access token for just those permissions. OAuth 2.0 is about authorization (what can be accessed). OpenID Connect (OIDC) adds an ID token on top for login (who you are).","y":"Before OAuth, apps asked for your actual Gmail password, getting full access forever. OAuth gives limited, revocable, expiring access.","h":["Use the Authorization Code flow with PKCE for web, mobile and SPAs. Avoid the old Implicit flow and the password grant.","Use a random state parameter to prevent CSRF on the callback.","Register exact redirect URIs; never allow wildcards.","Request the smallest scopes you need.","Keep short-lived access tokens and use refresh tokens to get new ones; store tokens securely on the server where possible.","For login, use OIDC and validate the ID token (signature, issuer, audience, expiry, nonce).","Use Client Credentials flow for machine-to-machine access.","Use a well-known library or provider, not hand-written OAuth."],"code":"1. App → redirect to /authorize?client_id&scope=drive.read\n       &redirect_uri&state=xyz&code_challenge=…\n2. User logs in at Google + approves\n3. Google → redirect back with ?code=abc&state=xyz\n4. App server → POST /token (code + code_verifier)\n5. Gets access_token (+ refresh_token)","e":"“Sign in with Google” on most websites is OIDC on top of OAuth 2.0: the site never sees your Google password, only an ID token saying who you are.","p":["Using OAuth access tokens as proof of login without OIDC checks","Open/wildcard redirect URIs leaking codes to attackers","Storing refresh tokens in localStorage","Skipping the state check"],"v":["JWT","OAuth is a PROTOCOL for granting access. JWT is a token FORMAT. OAuth tokens may or may not be JWTs."],"f":["App redirects to Google","User approves scopes","App gets code → exchanges","Access token for Drive API"],"q":[["OAuth 2.0 vs OpenID Connect?","OAuth 2.0 grants delegated access (authorization). OIDC adds identity (authentication) with an ID token telling the app who the user is."],["What does PKCE protect against?","Interception of the authorization code: only the client that created the code_verifier can exchange the code for tokens."],["What’s the purpose of the state parameter?","It ties the callback to the request the app started, preventing CSRF/login mix-up attacks."],["What is a scope?","A named permission the app requests (e.g. drive.readonly); the user approves it and the token only works for those scopes."],["When do you use the client credentials flow?","For machine-to-machine access where no user is involved, e.g. a backend service calling another API."]],"r":[152,47,48,122],"k":["Which OAuth flow is recommended for a single-page app or mobile app?",["Implicit flow","Resource owner password flow","Authorization Code flow with PKCE","Client credentials flow"],2,"Authorization Code with PKCE keeps tokens off the URL and protects the code from interception without needing a client secret."],"sl":"oauth"},{"n":47,"c":"sec","t":"JWT Rotation","s":"Regularly replacing tokens and signing keys so that stolen ones stop working quickly.","w":"A JWT (JSON Web Token) is a signed blob: header.payload.signature. Servers verify the signature instead of looking up a session. The catch: once issued, a JWT is valid until it expires, even if stolen. Rotation covers two things: token rotation (short-lived access tokens plus refresh tokens that get replaced on every use) and key rotation (changing the signing keys periodically).","y":"A long-lived token (say 30 days) that leaks gives an attacker 30 days of access. A leaked signing key lets attackers create valid tokens for anyone. Rotation limits the blast radius.","h":["Keep access tokens short (5–15 minutes).","Use refresh tokens to get new access tokens; store refresh tokens securely (HttpOnly cookie or server-side).","Refresh token rotation: each use returns a NEW refresh token and invalidates the old one.","Reuse detection: if an old refresh token is used again, assume theft and revoke the whole token family/session.","Rotate signing keys: publish keys via JWKS with a kid (key ID) header; add the new key, start signing with it, keep the old one for verification until old tokens expire, then remove it.","Prefer asymmetric signing (RS256/ES256) so services verify with a public key without holding the private one.","Always validate: signature, exp, iss, aud, and reject alg=none."],"e":"Auth0 and Okta both support refresh token rotation with automatic reuse detection: replaying a stolen refresh token logs out the legitimate user and the attacker together, cutting the attack off.","p":["Day-long or never-expiring access tokens","Putting sensitive data in the payload (it’s only base64, not encrypted)","Accepting the algorithm from the token header blindly","One key forever with no rotation plan"],"v":["Token Revocation","Rotation replaces credentials on a schedule or each use. Revocation kills a specific credential NOW. Short-lived JWTs + revocable refresh tokens give you both."],"f":["Access token expires (15 min)","Send refresh token R1","Get new access + R2; R1 dead","!R1 reused → revoke session"],"q":[["Why can’t you simply “log out” a JWT?","It’s self-contained and valid until expiry; servers don’t look it up. You need short lifetimes, a denylist, or revocable refresh tokens."],["How does refresh token reuse detection work?","Each refresh issues a new token and invalidates the old one; if an invalidated token is presented, the server assumes theft and revokes the whole family."],["How do you rotate a signing key without logging everyone out?","Publish the new key alongside the old via JWKS with key IDs, sign new tokens with the new key, keep verifying the old until its tokens expire, then remove it."],["What does the 'kid' header in a JWT do?","It identifies which signing key was used, so verifiers can pick the right public key from the JWKS during rotation."],["Why reject alg=none?","It means 'no signature'. Accepting it lets attackers forge any token."]],"r":[152,46,19,94],"num":"Access token lifetime 15 min vs 7 days:\nA stolen 15-min token is useful for at most 15 minutes.\nA stolen 7-day token: up to 10,080 minutes (672× longer).\nRefresh calls: 1M active users × 4 refreshes/hour ≈ 1,100 refresh req/s.","m":["Refresh token reuse detections: each one may be a theft; investigate.","Token validation failures by reason (expired, bad signature, wrong audience).","Signing key age: keys due for rotation."],"k":["Why use short-lived access tokens with refresh tokens instead of one long-lived token?",["They are smaller","A stolen access token expires quickly, and refresh tokens can be rotated and revoked","They avoid HTTPS","They don’t need signatures"],1,"Short lifetimes limit the damage of theft, while refresh tokens (stored more safely and rotated) keep users logged in."],"sl":"jwt-rotation"},{"n":48,"c":"sec","t":"IAM","s":"Identity and Access Management: the system that decides who (or what) you are, and what you’re allowed to do.","w":"IAM covers identities (users, groups, service accounts, roles), authentication (proving who you are: passwords, MFA, SSO) and authorization (permissions/policies: “this role can read this S3 bucket”). In clouds like AWS/GCP/Azure, every API call is checked against IAM policies.","y":"Most cloud breaches come from overly broad permissions or leaked credentials. If every developer and service has admin access, one leaked key means total compromise.","h":["Least privilege: grant only the actions and resources needed, nothing extra.","Use roles and groups instead of attaching permissions to individuals.","Use temporary credentials (assume-role, workload identity) instead of long-lived access keys.","Turn on MFA for every human, especially admins; use SSO for central control.","Separate environments (prod vs dev accounts/projects).","Review access regularly and remove unused permissions (AWS Access Analyzer, IAM recommender).","Log every access (CloudTrail, audit logs) and alert on risky actions.","Lock away the root/owner account; use it almost never."],"code":"{\n  \"Effect\": \"Allow\",\n  \"Action\": [\"s3:GetObject\"],\n  \"Resource\": \"arn:aws:s3:::invoices-bucket/*\"\n}  // read-only, one bucket, nothing else","e":"A startup gave its CI pipeline AdministratorAccess. When the CI token leaked, the attacker deleted production databases. With least privilege, the CI could only deploy to one service.","p":["Wildcards everywhere: “Action”: \"*\", “Resource”: \"*\"","Sharing one account between people","Never removing access for people who left"],"v":["RBAC","IAM is the whole system of identities and access. RBAC is one WAY to model permissions inside it, by roles."],"f":["Identity: user / service","Authenticate (SSO + MFA)","Check policy","Allow or deny + audit log"],"q":[["What is the principle of least privilege?","Give each identity only the minimum permissions required to do its job, and nothing more."],["Why prefer roles with temporary credentials over access keys?","Temporary credentials expire automatically and aren’t stored in code, so leaks are less damaging."],["Authentication vs authorization?","Authentication proves who you are; authorization decides what you’re allowed to do."],["What’s the difference between a user and a role in cloud IAM?","A user is a long-lived identity (often a person); a role is assumed temporarily by people or services and issues short-lived credentials."],["Why review access regularly?","Permissions accumulate as people change jobs; unused access is risk with no benefit."]],"r":[118,19,122,46],"m":["Unused permissions (access analyzer): candidates for removal.","Root/admin account usage: should be near zero and alert on use.","Failed authorization attempts and policy changes in audit logs."],"k":["A CI pipeline needs to deploy one service. Which IAM setup follows least privilege?",["AdministratorAccess so it never fails","A role allowing only the specific deploy actions on that service’s resources, with short-lived credentials","A shared admin user’s access key","Read-only access to everything"],1,"Grant only what the job needs, scoped to its resources, using temporary credentials so leaks expire."],"sl":"iam"},{"n":49,"c":"sec","t":"TLS","s":"The protocol behind HTTPS that encrypts traffic and proves you’re talking to the real server.","w":"TLS (Transport Layer Security, the successor to SSL) gives three things: encryption (nobody in the middle can read it), integrity (nobody can change it unnoticed) and authentication (the server proves its identity with a certificate signed by a trusted Certificate Authority). During the handshake, client and server agree on keys; TLS 1.3 does this in one round trip.","y":"Without TLS, anyone on the same Wi-Fi, ISP or network path can read passwords and cookies, inject ads or malware, or impersonate your site.","h":["Use HTTPS everywhere, and redirect HTTP to HTTPS.","Get certificates automatically (Let’s Encrypt with certbot/Caddy, or cloud-managed certificates) and auto-renew them.","Allow only TLS 1.2 and 1.3; disable old SSL/TLS versions and weak ciphers.","Add HSTS (Strict-Transport-Security) so browsers never try plain HTTP again.","Monitor certificate expiry; expired certs cause full outages.","Use mTLS (both sides present certificates) between internal services for zero-trust setups.","Test your config with SSL Labs."],"code":"Strict-Transport-Security: max-age=31536000; includeSubDomains\n\n# nginx\nssl_protocols TLSv1.2 TLSv1.3;","e":"Many famous outages, including some at Microsoft Teams and Spotify, were caused simply by an expired certificate that nobody renewed in time.","p":["Expired certificates","Disabling certificate verification in code (\"verify=False\") to fix an error","Mixed content: HTTPS page loading HTTP scripts"],"v":["Encryption at Rest","TLS protects data MOVING over the network. Encryption at rest protects data SITTING on disk. You need both."],"f":["Client hello","Server sends certificate","Verify CA + agree keys","Encrypted HTTPS traffic"],"q":[["What three guarantees does TLS give?","Confidentiality (encryption), integrity (tamper detection) and server authentication (certificates)."],["What is HSTS?","A header telling browsers to always use HTTPS for the domain, preventing downgrade to HTTP."],["What is mTLS?","Mutual TLS: both client and server present certificates, so each side authenticates the other; common between microservices."],["Why is disabling certificate verification in code dangerous?","Traffic is still encrypted but to anyone, so a man-in-the-middle can present their own certificate and read everything."],["What does TLS 1.3 improve?","Faster handshakes (one round trip, zero for resumption), removal of weak ciphers, and encryption of more of the handshake."]],"r":[51,50,3,122],"m":["Certificate expiry dates: alert weeks before expiry.","TLS handshake errors: version/cipher mismatches or certificate problems.","Share of HTTP vs HTTPS traffic: unexpected HTTP use."],"k":["What does a TLS certificate prove to the browser?",["That the server is fast","That the server controls the domain, as vouched for by a trusted Certificate Authority","That the website is safe from bugs","That the data is stored encrypted"],1,"Certificates authenticate the server’s identity for that domain. They don’t say anything about the site’s other security."],"sl":"tls"},{"n":50,"c":"sec","t":"Encryption at Rest","s":"Encrypting data while it’s stored on disks, databases and backups, so stolen storage is useless without the key.","w":"Data at rest is anything stored: DB files, S3 objects, backups, laptop disks. Encrypting it means the bytes on disk are scrambled. Levels: full-disk/volume encryption (e.g. EBS, BitLocker), database-level (TDE), and application-level or field-level encryption (you encrypt a specific column like Aadhaar or card numbers before saving).","y":"Disks get stolen, backups get misplaced, cloud snapshots get shared by mistake. Many regulations (GDPR, PCI DSS, HIPAA) require it.","h":["Turn on provider encryption for disks, databases, object storage and backups (usually one checkbox with a managed key).","Use a Key Management Service (AWS KMS, GCP KMS, Vault); never store keys next to the data.","Envelope encryption: data is encrypted with a data key, and the data key is encrypted with a master key in KMS.","For very sensitive fields, add application-level encryption so even DB admins only see ciphertext.","Rotate keys and restrict who can use them; log every key use.","Remember its limits: if the app is hacked, it reads data decrypted. It mainly protects against stolen media and some insider access."],"e":"AWS S3 now encrypts all new objects by default (SSE-S3). Teams handling payment data add SSE-KMS with their own keys so access to the key itself is controlled and audited.","p":["Key stored in the same place as the data","Thinking it protects against SQL injection or app compromise","Unencrypted backups of encrypted databases"],"v":["Encryption in Transit","At rest = stored data on disk. In transit = data travelling over networks. A secure system encrypts both."],"f":["App writes data","Encrypt with data key","Data key wrapped by KMS","Disk stores ciphertext"],"q":[["What is envelope encryption?","Data is encrypted with a data key; that key is itself encrypted with a master key held in a KMS. Only the wrapped data key is stored with the data."],["What does encryption at rest NOT protect against?","An attacker who compromises the running application or credentials that can read data normally."],["Why use application-level field encryption?","So specific sensitive fields stay encrypted even to database admins, logs and backups."],["Why store encryption keys in a KMS?","Keys stay separate from data, access is controlled and logged, and rotation is managed; keys stored next to data defeat the purpose."],["What is crypto-shredding?","Deleting the key that encrypts some data makes every copy of that data unreadable, useful for deletion requests."]],"r":[19,51,97,121],"k":["Which threat does disk encryption at rest mainly protect against?",["SQL injection","A stolen disk, backup or snapshot","A compromised application server reading data","Phishing"],1,"If someone gets the raw storage without the key, they see only ciphertext. A running app with access still reads plaintext."],"sl":"encryption-at-rest"},{"n":51,"c":"sec","t":"Encryption in Transit","s":"Encrypting data while it travels between browsers, servers, databases and services.","w":"Any data crossing a network can be captured: public Wi-Fi, ISPs, cloud network hops. Encryption in transit wraps traffic so it can’t be read or altered on the way, mostly using TLS (HTTPS, database connections with SSL, SMTP with STARTTLS) or VPN/IPsec/WireGuard tunnels.","y":"Teams often protect the public HTTPS edge but send plaintext between the load balancer, app, database and cache inside the network. Internal networks get breached too, and cloud networks are shared infrastructure.","h":["Use HTTPS for all external traffic.","Enable TLS for database, Redis and message broker connections (sslmode=verify-full for Postgres).","Verify certificates; encryption without verification can still be intercepted.","Use mTLS or a service mesh (Istio, Linkerd) to encrypt service-to-service traffic automatically.","Never send secrets or tokens in URLs (they land in logs); use headers or bodies over TLS.","Use VPN or private links for cross-cloud or on-prem connections."],"code":"postgresql://app@db:5432/shop?sslmode=verify-full\nredis-cli --tls -h cache.internal","e":"In 2013 it emerged that some intelligence agencies tapped private links between Google’s data centres. Google responded by encrypting all internal traffic.","p":["TLS that skips certificate verification","Plaintext internal traffic “because it’s private”","Tokens in query strings"],"v":["TLS","Encryption in transit is the GOAL. TLS is the most common TOOL used to achieve it."],"f":["Browser → LB (HTTPS)","LB → app (TLS)","App → DB (TLS verify-full)","Encrypted end to end"],"q":[["Why encrypt internal traffic?","Internal networks can be compromised or shared; attackers inside could otherwise read everything."],["What does sslmode=verify-full do in Postgres?","Encrypts and also verifies the server certificate and hostname, preventing man-in-the-middle attacks."],["Why shouldn’t tokens go in URLs?","URLs are recorded in logs, browser history and Referer headers."],["Why encrypt traffic inside a private network?","Internal networks can be breached or shared; attackers inside could sniff credentials and data otherwise."],["How does a service mesh help with encryption in transit?","It can automatically apply mTLS between all services without changing application code."]],"r":[49,122,50,139],"k":["Your app connects to Postgres with sslmode=require. What is still missing compared to verify-full?",["Encryption","Verification of the server certificate and hostname","Compression","Authentication with a password"],1,"require encrypts but doesn’t verify who you’re talking to; verify-full also checks the certificate and hostname, stopping man-in-the-middle attacks."],"sl":"encryption-in-transit"},{"n":52,"c":"sec","t":"WAF","s":"A Web Application Firewall: a filter in front of your app that blocks requests matching known attack patterns.","w":"A WAF inspects HTTP requests (URL, headers, body) and blocks suspicious ones: SQL injection payloads, XSS strings, path traversal (../../etc/passwd), bad bots, known exploits. It runs at the edge (Cloudflare, AWS WAF, Akamai) or as a module (ModSecurity with the OWASP Core Rule Set).","y":"It’s a safety net that buys time, for example blocking a newly announced exploit (like Log4Shell) across all apps within hours, before every service is patched.","h":["Start with managed rule sets (OWASP CRS, vendor managed rules).","Run in “count/log only” mode first to find false positives, then enable blocking.","Add custom rules: rate limits on login, geo or bot rules, blocking admin paths from the internet.","Tune exceptions for legitimate endpoints that look scary (e.g. a code editor posting SQL).","Keep logs and dashboards of blocked requests.","Treat it as defence-in-depth; still fix the actual vulnerabilities in code."],"e":"When Log4Shell was disclosed in December 2021, Cloudflare and AWS pushed WAF rules blocking ${jndi: patterns within hours, protecting customers while they patched Java apps.","p":["Relying on a WAF instead of writing secure code","Enabling blocking without tuning, breaking real users","Attackers bypassing with encodings the WAF doesn’t decode"],"v":["DDoS Protection","A WAF filters MALICIOUS requests by content. DDoS protection deals with HUGE VOLUMES of traffic. Often offered together, but different jobs."],"f":["Incoming request","WAF rule check","!Matches attack → block","Clean request → app"],"q":[["Why start a WAF in log-only mode?","To detect false positives that would block legitimate users before enforcing."],["Can a WAF replace secure coding?","No; attackers find bypasses. It’s an extra layer and a stopgap for new vulnerabilities."],["What is the OWASP Core Rule Set?","An open-source set of generic attack-detection rules for WAFs like ModSecurity."],["Can a WAF replace fixing a vulnerability?","No. It’s a temporary shield; attackers find bypasses through encodings or variations. Fix the code too."],["What is virtual patching?","Adding WAF rules to block exploitation of a known vulnerability until the application can be patched."]],"r":[53,42,43,2],"m":["Blocked requests by rule: spikes show attacks; a single rule blocking many legit users means a false positive.","False-positive reports from users or support."],"k":["Why deploy WAF rules in count/log-only mode first?",["It is cheaper","To find false positives before they block real users","Blocking mode doesn’t work on day one","To train the WAF’s AI"],1,"Generic rules can match legitimate traffic. Watching what would be blocked lets you tune exceptions first."],"sl":"waf"},{"n":53,"c":"sec","t":"DDoS Protection","s":"Defending against floods of traffic from many machines that try to knock your service offline.","w":"In a DDoS (Distributed Denial of Service), thousands of hijacked devices (a botnet) send traffic. Types: volumetric (fill your bandwidth with gigabits of junk), protocol (exhaust connection tables, e.g. SYN floods), and application-layer (realistic-looking HTTP requests to expensive pages).","y":"A small server or even a whole data centre link can be overwhelmed. You can’t simply out-scale terabits of attack traffic yourself; it requires huge edge networks.","h":["Put a CDN/DDoS provider in front (Cloudflare, AWS Shield + CloudFront, Akamai, Google Cloud Armor) to absorb volumetric floods at the edge.","Hide your origin IP; allow traffic only from the provider’s IP ranges.","Rate limit per IP/token, and challenge suspicious clients (CAPTCHA, JS challenge).","Cache as much as possible so floods hit the cache, not your servers.","Protect expensive endpoints (search, login, report generation) with stricter limits.","Autoscale carefully with cost caps; scaling alone can just make the attack expensive for you.","Have a runbook: who to call, how to turn on “under attack” mode."],"e":"In 2018 GitHub was hit with a 1.35 Tbps memcached amplification attack. Routing traffic through Akamai’s scrubbing network brought the site back within about 10 minutes.","p":["Origin IP leaked (old DNS records, email headers), so attackers bypass the CDN","Relying on autoscaling and getting a giant bill","No plan until the attack starts"],"v":["Rate Limiting","Rate limiting handles abusive clients you can identify. DDoS protection handles massive distributed floods that need edge network capacity."],"f":["!Botnet flood","Edge network absorbs/scrubs","Rate limit + challenges","Clean traffic reaches origin"],"q":[["Name three types of DDoS attacks.","Volumetric (bandwidth floods), protocol (SYN floods etc.), and application-layer (HTTP floods on expensive endpoints)."],["Why must the origin IP stay hidden?","If attackers know it, they can bypass the protective edge network and hit servers directly."],["Why isn’t autoscaling a full DDoS defence?","Attack traffic can exceed what you can scale to, and scaling multiplies cost; filtering at the edge is needed."],["What’s an amplification attack?","Attackers send small spoofed requests to servers (DNS, memcached) that reply with much larger responses to the victim’s IP, multiplying traffic."],["Why protect expensive endpoints specifically?","Application-layer floods target slow operations like search or login; a few hundred requests per second there can cost more than millions of cached page hits."]],"r":[52,2,84,40],"m":["Requests per second and bandwidth at the edge vs normal baseline.","Origin traffic during an attack: should stay near normal if edge protection works.","Challenge/CAPTCHA pass rates."],"k":["During a DDoS, attackers bypass your CDN and hit your servers directly. Most likely cause?",["The CDN is too slow","Your origin IP is exposed and the origin accepts traffic from anywhere","DNS TTL is too long","TLS is misconfigured"],1,"If the origin IP leaks, attackers skip the edge. Allow origin traffic only from the CDN’s IP ranges."],"sl":"ddos-protection"},{"n":54,"c":"net","t":"WebSockets","s":"A connection that stays open so the browser and server can both send messages any time, instantly.","w":"It starts as a normal HTTP request with an Upgrade: websocket header. The server agrees, and the same TCP connection becomes a two-way message channel. No new request per message, tiny overhead per frame.","y":"Chat, multiplayer games, collaborative editing, live trading screens and dashboards need instant updates in both directions. Polling every second is slow and wasteful.","h":["Authenticate during the handshake (token or cookie) and check permissions on every message, not just at connect.","Use heartbeats (ping/pong) to detect dead connections.","Reconnect automatically with backoff on the client, and resync missed messages.","Scaling: each server holds its own connections, so use a shared pub/sub (Redis, NATS) to broadcast a message to users connected to other servers.","Load balancers need sticky or connection-aware routing and long idle timeouts.","Limit message size and rate per connection.","Libraries like Socket.IO or managed services (Pusher, Ably, AWS API Gateway WebSockets) handle much of this."],"code":"const ws = new WebSocket(\"wss://chat.app/ws?token=…\");\nws.onmessage = (e) => render(JSON.parse(e.data));\nws.send(JSON.stringify({ room: 7, text: \"hi\" }));","e":"Slack and WhatsApp Web keep a WebSocket open so messages appear instantly; the server pushes new messages without the browser asking.","p":["Checking auth only at connect time","Forgetting multi-server fan-out, so users on different servers don’t see each other’s messages","Load balancer idle timeouts dropping connections every 60 s"],"v":["Server-Sent Events","WebSockets: two-way, custom protocol. SSE: one-way server→browser over normal HTTP, with automatic reconnect. If the browser rarely sends, SSE is simpler."],"f":["HTTP Upgrade handshake","Persistent connection","Server pushes messages","Client sends messages"],"q":[["How do WebSockets start?","With an HTTP request containing Upgrade: websocket; the server replies 101 Switching Protocols."],["How do you send a message to users connected to different servers?","Publish it through a shared pub/sub system that every WebSocket server subscribes to."],["When would you choose SSE over WebSockets?","When updates flow only from server to client, like notifications or live feeds."],["Why add heartbeats on WebSockets?","To detect dead connections (phones losing signal) and stop proxies from closing idle connections."],["How should clients reconnect?","Automatically with exponential backoff and jitter, then fetch missed messages using a last-seen ID or timestamp."]],"r":[55,56,37,8],"num":"1M concurrent users, one WebSocket each.\nAt ~50k connections per server → 20 servers just to hold connections.\nHeartbeat every 30 s: 1M ÷ 30 ≈ 33k pings/s across the fleet.","m":["Concurrent connections per server: capacity planning and imbalance.","Connection drops and reconnect rate: network or load balancer timeout problems.","Message delivery latency (send to receive)."],"k":["Users connected to different WebSocket servers can’t see each other’s chat messages. Why?",["WebSockets don’t support broadcast","Each server only knows its own connections; you need a shared pub/sub to fan out messages","TLS blocks it","The browser limits connections"],1,"Messages must be published to a shared channel (Redis, NATS, Kafka) that every WebSocket server subscribes to."],"sl":"websockets"},{"n":55,"c":"net","t":"Server-Sent Events","s":"A simple one-way stream where the server keeps sending updates to the browser over a normal HTTP connection.","w":"The browser opens new EventSource(“/stream”). The server responds with Content-Type: text/event-stream and keeps the response open, writing lines like \"data: {...}\" whenever there’s news. The browser reconnects automatically and can resume using the last event ID.","y":"Live notifications, progress bars, stock tickers and AI chat token streaming need server→client pushes but not client→server messages. SSE is much simpler than WebSockets for that and works through normal HTTP infrastructure.","h":["Send \"data:\" lines ending with a blank line; add \"id:\" so clients can resume with Last-Event-ID.","Send a comment or ping every ~15–30 s so proxies don’t kill idle connections.","Disable proxy buffering (e.g. X-Accel-Buffering: no for Nginx).","Use HTTP/2 so many streams share one connection (HTTP/1.1 browsers limit ~6 connections per domain).","Use normal POST requests for client→server actions."],"code":"HTTP/1.1 200 OK\nContent-Type: text/event-stream\n\nid: 41\ndata: {\"progress\": 40}\n\nid: 42\ndata: {\"progress\": 60}","e":"ChatGPT and Claude’s web apps stream answers token by token using SSE-style streaming responses.","p":["Proxies buffering the stream so updates arrive all at once","Hitting the 6-connections-per-domain limit on HTTP/1.1","Trying to send client messages over SSE"],"v":["Long Polling","Long polling: one response per update, then reconnect. SSE: one long response carrying many updates, with built-in reconnect."],"f":["EventSource(“/stream”)","Server holds response open","Writes data: events","Browser auto-reconnects with ID"],"q":[["What content type does SSE use?","text/event-stream."],["How does SSE resume after disconnect?","The browser reconnects and sends Last-Event-ID; the server resends missed events."],["Why might SSE updates arrive in a big batch?","A proxy or server is buffering the response; buffering must be disabled."],["Why might SSE updates arrive all at once instead of streaming?","A proxy or server is buffering the response; disable buffering (e.g. X-Accel-Buffering: no) and flush after each event."],["Why use HTTP/2 with SSE?","HTTP/1.1 browsers allow about 6 connections per domain; HTTP/2 multiplexes many streams over one connection."]],"r":[54,56,58,3],"k":["What does a browser send when reconnecting an SSE stream so it can resume?",["A new session cookie","The Last-Event-ID header","A WebSocket upgrade","Nothing"],1,"If the server includes id: fields, the browser sends Last-Event-ID on reconnect so missed events can be replayed."],"sl":"server-sent-events"},{"n":56,"c":"net","t":"Long Polling","s":"The client asks “anything new?” and the server holds the request open until there is something new (or a timeout), then the client asks again.","w":"Normal polling asks every few seconds and usually gets “nothing”. Long polling keeps each request waiting on the server, up to say 30 s. The moment data appears, the server answers. The client immediately opens the next request.","y":"It gives near real-time updates using only plain HTTP, which works through old proxies and firewalls where WebSockets might be blocked. It’s a solid fallback.","h":["Server waits up to a timeout (20–30 s), shorter than any proxy timeouts, then returns “no news”.","Client reconnects immediately after each response, with backoff on errors.","Pass a cursor/last-seen ID so no events are missed between requests.","Use async servers (Node, Go, async Python) so thousands of waiting requests don’t each hold a thread."],"code":"async function loop(cursor) {\n  const r = await fetch(\"/updates?after=\" + cursor); // waits\n  const { events, next } = await r.json();\n  events.forEach(show);\n  loop(next);   // ask again right away\n}","e":"Early Facebook chat and Gmail used long polling (“Comet”) before WebSockets were widely supported.","p":["Thread-per-request servers running out of threads","Missing events between requests without a cursor","Timeouts longer than load balancer limits"],"v":["WebSockets","Long polling: many HTTP requests, simple, more overhead. WebSockets: one persistent two-way connection, efficient but needs more infrastructure support."],"f":["Client: any news after #10?","Server waits…","News arrives → respond","Client asks again after #11"],"q":[["How is long polling different from regular polling?","Regular polling returns immediately (often empty); long polling holds the request until data is available or a timeout."],["Why use a cursor in long polling?","To make sure events that happen between requests aren’t missed."],["What server model suits long polling?","Asynchronous/event-loop servers that can hold many idle connections cheaply."],["Why should long-poll timeouts be shorter than proxy timeouts?","Otherwise proxies cut the connection first, causing errors instead of a clean 'no news' response."],["Why use a cursor with long polling?","Events can occur between one response and the next request; the cursor lets the server return everything after the last seen event."]],"r":[55,54,17,116],"k":["What makes long polling different from normal polling?",["It uses WebSockets","The server holds the request open until there’s data or a timeout","It uses UDP","It polls more often"],1,"Instead of answering 'nothing new' immediately, the server waits, so updates arrive almost instantly with fewer empty responses."],"sl":"long-polling"},{"n":57,"c":"net","t":"gRPC","s":"A fast way for services to call each other’s functions, using strict typed contracts and compact binary messages over HTTP/2.","w":"You define services and messages in a .proto file (Protocol Buffers). Tools generate client and server code in many languages. Calls look like local function calls: user := client.GetUser(ctx, req). Messages are binary (smaller and faster than JSON). It supports streaming in either or both directions.","y":"Between internal microservices, JSON/REST contracts drift, parsing is slower, and there’s no guarantee both sides agree on field types. gRPC gives strong contracts, generated code and efficiency.","h":["Write .proto files and keep them in a shared repo or registry.","Evolve safely: never reuse or change field numbers; add new fields, mark old ones reserved.","Always set deadlines on calls (gRPC supports deadline propagation).","Use proper status codes (NOT_FOUND, UNAVAILABLE, DEADLINE_EXCEEDED).","For browsers use gRPC-Web or a REST gateway; browsers can’t speak raw gRPC.","Load balance per request, not per connection (HTTP/2 keeps long connections, so L4 balancers send everything to one server). Use L7 or client-side balancing."],"code":"service UserService {\n  rpc GetUser (GetUserRequest) returns (User);\n  rpc WatchOrders (WatchReq) returns (stream Order);\n}\nmessage User { int64 id = 1; string name = 2; }","e":"Google uses its internal predecessor (Stubby) for billions of calls per second; companies like Netflix and Square use gRPC between internal services.","p":["Reusing field numbers and corrupting old clients","L4 load balancing sending all traffic to one pod","Hard to debug with curl compared to JSON"],"v":["REST","REST: resource URLs + JSON, human-readable, great for public/browser APIs. gRPC: typed functions + binary, faster, great for internal service-to-service."],"f":[".proto contract","Generated client stub","Binary call over HTTP/2","Typed response"],"q":[["Why is gRPC efficient?","Binary Protocol Buffers are small and fast to parse, and HTTP/2 multiplexes many calls on one connection."],["How do you evolve a proto message safely?","Add new fields with new numbers, never change or reuse existing numbers, and reserve removed ones."],["Why can L4 load balancing be a problem for gRPC?","Long-lived HTTP/2 connections mean all requests from a client stick to one server; balancing must happen per request at L7 or client side."],["Why must you never reuse a protobuf field number?","Old clients would decode the new field’s bytes as the old field, silently corrupting data."],["How do browsers use gRPC services?","Through gRPC-Web with a proxy, or by exposing a REST/JSON gateway, since browsers can’t control raw HTTP/2 frames."]],"r":[150,58,77,124],"k":["Why can an L4 load balancer send almost all gRPC traffic to one backend?",["gRPC uses UDP","gRPC keeps long-lived HTTP/2 connections, so balancing per connection doesn’t spread individual calls","gRPC disables load balancing","Protobuf is too large"],1,"HTTP/2 multiplexes many calls on one connection. Balance per request (L7 proxy or client-side) instead."],"sl":"grpc"},{"n":58,"c":"net","t":"HTTP/2 & HTTP/3","s":"Newer versions of HTTP that send many requests over one connection at once, making websites and APIs faster.","w":"HTTP/1.1 sends one request at a time per connection, so browsers open ~6 connections and requests queue up. HTTP/2 multiplexes many streams over one TCP connection, compresses headers (HPACK) and uses binary framing. But on TCP, one lost packet still stalls all streams (head-of-line blocking). HTTP/3 runs on QUIC over UDP: each stream recovers independently, connection setup is faster (TLS 1.3 built in) and connections survive switching from Wi-Fi to mobile data.","y":"Modern pages load 100+ files. Fewer connections and parallel streams cut load time, especially on high-latency mobile networks.","h":["Enable HTTP/2 and HTTP/3 at your CDN or load balancer; usually just a setting.","Stop old HTTP/1.1 hacks like domain sharding; with HTTP/2 they hurt.","Bundling still matters less than before; many small files are OK over HTTP/2.","Make sure UDP 443 isn’t blocked, so HTTP/3 can be used (browsers fall back automatically).","Measure real user performance before and after."],"e":"Google and Cloudflare report noticeable latency improvements with HTTP/3, especially on lossy mobile networks in places like India, where packet loss is common.","p":["Keeping domain sharding after moving to HTTP/2","Assuming HTTP/3 works everywhere (some corporate networks block UDP)","Thinking HTTP/2 fixes slow backends"],"v":["TCP vs UDP","HTTP versions are application protocols. TCP and UDP are transport protocols underneath: HTTP/2 uses TCP, HTTP/3 uses QUIC on UDP."],"f":["HTTP/1.1: requests queue","HTTP/2: many streams, 1 TCP","!Lost packet stalls all (TCP)","HTTP/3 QUIC: streams independent"],"q":[["What is head-of-line blocking?","When one delayed item blocks everything behind it; in HTTP/2 a lost TCP packet stalls all streams on that connection."],["What does QUIC add?","UDP-based transport with per-stream loss recovery, built-in TLS 1.3, faster handshakes and connection migration."],["Name two HTTP/2 features.","Multiplexing many streams over one connection and header compression (HPACK)."],["Why is domain sharding harmful with HTTP/2?","It forces extra connections and handshakes and prevents multiplexing benefits over one connection."],["What happens if UDP is blocked for HTTP/3?","Browsers fall back to HTTP/2 over TCP automatically."]],"r":[59,49,84,55],"k":["What problem does HTTP/3 solve that HTTP/2 still has?",["No encryption","Head-of-line blocking at the TCP level when a packet is lost","No multiplexing","No header compression"],1,"HTTP/2 multiplexes over one TCP connection, so one lost packet stalls all streams. QUIC recovers streams independently."],"sl":"http-2-and-http-3"},{"n":59,"c":"net","t":"TCP vs UDP","s":"TCP is reliable and ordered but slower to start; UDP is fast and lightweight but doesn’t guarantee delivery or order.","w":"TCP sets up a connection (3-way handshake), numbers every byte, resends lost packets, delivers in order and controls congestion. UDP just sends independent packets (datagrams): no handshake, no resending, no ordering. Apps on UDP add only the reliability they need.","y":"For a file download or API call, every byte must arrive correctly, so TCP. For a video call or game, a late packet is useless; better to skip it than wait, so UDP.","h":["Use TCP (via HTTP, gRPC, database protocols) for almost all business apps.","Use UDP for real-time voice/video (WebRTC), online games, DNS lookups, metrics (StatsD) and QUIC/HTTP/3.","On UDP, handle loss, reordering and duplicates in the app, and don’t flood the network (implement congestion control).","Know TCP costs: handshake latency (plus TLS), and slow start on new connections; reuse connections (keep-alive) to avoid repeating them."],"e":"In a Zoom call, a lost audio packet is simply skipped (a tiny glitch). If it used TCP, the call would freeze waiting for the resend, then rush to catch up.","p":["Building on raw UDP and accidentally reinventing a buggy TCP","Opening a new TCP connection for every request","Assuming UDP is always faster for everything"],"v":["HTTP/2 & HTTP/3","TCP/UDP are the transport layer. HTTP versions sit on top: HTTP/3 brings UDP’s benefits to the web via QUIC while still providing reliability."],"f":["TCP: handshake","Ordered, resend lost","UDP: just send","App decides on loss"],"q":[["What does TCP guarantee that UDP doesn’t?","Reliable, ordered, non-duplicated delivery with congestion control."],["Why do video calls use UDP?","Low latency matters more than perfect delivery; retransmitted late packets are useless in real time."],["Why does DNS mostly use UDP?","Queries are tiny single request/response exchanges; a handshake would double the latency. It falls back to TCP for large responses."],["What is TCP slow start?","A new connection begins sending a small amount of data and increases it as acknowledgements arrive, so new connections aren’t immediately fast."],["Why does DNS fall back to TCP sometimes?","Responses too large for a UDP packet (e.g. DNSSEC) are retried over TCP."]],"r":[58,60,54,49],"num":"New HTTPS connection over TCP + TLS 1.3 with 100 ms round trip:\nTCP handshake 1 RTT + TLS 1 RTT = 200 ms before the first request byte.\nReusing a kept-alive connection: 0 extra RTT.","k":["Which application is the best fit for UDP?",["Downloading a software update","A live video call","A bank transfer API","Sending an email"],1,"Real-time media prefers dropping a late packet over waiting for retransmission; UDP lets the app decide."],"sl":"tcp-vs-udp"},{"n":60,"c":"net","t":"DNS","s":"The internet’s phone book: it turns names like google.com into IP addresses computers can connect to.","w":"Your device asks a resolver (from your ISP, or 8.8.8.8 / 1.1.1.1). If it doesn’t know, it asks the root servers, then the .com servers, then the domain’s authoritative nameserver, which returns the answer. Results are cached at each step for the record’s TTL. Record types: A (IPv4), AAAA (IPv6), CNAME (alias to another name), MX (mail), TXT (verification, SPF), NS (nameservers).","y":"Every connection starts with DNS. Misconfigured or slow DNS means “site down” even when servers are fine. DNS is also used for load balancing, failover and routing users to the nearest region.","h":["Use a reliable managed DNS (Route 53, Cloudflare, Cloud DNS).","Pick TTLs wisely: long (hours) for stable records = fewer lookups; short (30–60 s) before planned migrations so changes spread fast. Lower the TTL days BEFORE the change.","Use CNAMEs to point to load balancers/CDNs rather than hardcoding IPs.","Use health-checked DNS failover and latency/geo routing for multi-region.","Protect against hijacking: registrar lock, MFA on the registrar account, DNSSEC where appropriate.","Debug with dig or nslookup: dig +trace example.com shows every step."],"code":"dig +short shop.com A        # 203.0.113.10\ndig shop.com CNAME\ndig +trace shop.com          # full resolution path","e":"In 2016 an attack on DNS provider Dyn made Twitter, Netflix, GitHub and Reddit unreachable for many users, even though those companies' own servers were fine.","p":["Changing an IP with a 24-hour TTL and wondering why half of users still hit the old server","Forgetting renewal and losing the domain","Single DNS provider with no redundancy for critical sites"],"v":["Reverse Proxy","DNS tells the client WHICH address to connect to. A reverse proxy, at that address, decides WHICH server handles the request."],"f":["Browser: where is shop.com?","Resolver asks root → .com → NS","Answer 203.0.113.10 (cached TTL)","Browser connects"],"q":[["What does TTL mean for DNS records?","How long resolvers may cache the answer before asking again."],["A vs CNAME record?","A maps a name to an IPv4 address; CNAME maps a name to another name (an alias)."],["How should you prepare for changing a server’s IP?","Lower the TTL well in advance (longer than the old TTL), make the change, then raise it again."],["Why can’t you put a CNAME at the root domain (example.com)?","DNS rules forbid CNAME alongside other records required at the apex (like NS/SOA). Providers offer ALIAS/ANAME records instead."],["How does DNS help with multi-region failover?","Health-checked records stop returning a failed region’s address so clients resolve to healthy regions (subject to TTL caching)."]],"r":[59,84,95,3],"num":"TTL 86,400 s (24 h): after changing an IP, some resolvers keep the old answer for up to 24 h.\nLower TTL to 60 s at least 24 h before the change → after the change, most clients switch within ~1 minute.","m":["DNS resolution time and failure rate from multiple regions.","Record changes audit: unexpected changes
